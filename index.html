    "title": "金属配位离子补料(ZnCl2)与培养基(LB/TB/自诱导)选择",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握含金属配位结构域蛋白在发酵诱导期的 **微量金属辅因子补料法则（如锌指蛋白补 50–100 μM ZnCl₂）**，理解 **ZnCl₂ 在磷酸盐培养基中防沉淀的配制与投料技巧**，并掌握 **LB、TB与Studier自诱导培养基** 的选型与操作要点。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【微量金属辅因子补料法则（50–100 μM ZnCl₂）】**：全长 Ro52 的 N 端有 RING 和 B-box 两个锌指结构域，**每造 1 个全长 Ro52 分子就需要消耗 3–4 颗 Zn²⁺ 离子当结构骨架**。普通培养基里只有酵母粉带进去的极微量锌（约几微摩尔），诱导开启后 1 小时就被抢光了；如果不额外补加 **50 μM ZnCl₂**，后面 15 个小时造出来的全长 Ro52 全是“没骨头的软脚蟹”，一出核糖体就塌成包涵体！\n- **【ZnCl₂ 配制与防氢氧化锌/磷酸锌沉淀技巧】**：\n  1. 氯化锌（ZnCl₂）溶于纯水时极易水解生成白色氢氧化锌沉淀（溶液变浑浊）；配制 **`100 mM ZnCl₂` 母液** 时，必须在纯水中加入极少量稀盐酸（调节 pH 至 3–4 呈微酸性清亮溶液）并经 0.22 μm 过滤除菌；\n  2. **严禁把 ZnCl₂ 在高压灭菌前直接加进含高浓度磷酸盐的 TB 培养基里一起高温灭菌**（高温下 Zn²⁺ 会和磷酸根生成不溶性的磷酸锌沉淀全沉在瓶底，细菌根本吃不到）！**必须在降温到 16°C、临加 IPTG 诱导的那一刻，按 1:2000 体积比把无菌 ZnCl₂ 母液加入菌液中**！\n- **【LB vs. TB vs. 自诱导培养基（Auto-induction Medium）】**：\n  - **LB（10g 蛋白胨 + 5g 酵母粉 + 10g NaCl / L）**：营养最薄、无 pH 缓冲盐，菌体长到 OD₆₀₀ ≈ 3–4 就封顶了，只适合活化种子或 50 mL 初筛；\n  - **TB（12g 蛋白胨 + 24g 酵母粉 + 4mL 甘油 + 磷酸钾盐缓冲液 / L）**：营养是 LB 的 3–4 倍且 pH 极其稳定，OD₆₀₀ 可轻松长到 8–15，**是本实验室 1 L 大摇瓶正式生产的主力培养基**！（注意：TB 的磷酸盐包必须与酵母蛋白胨分开灭菌、放凉后再混匀，否则高温下会发生美拉德反应褐变沉淀）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **培养基与补锌两必查**：① 查 TB 培养基配制记录 —— 磷酸盐（KH₂PO₄ / K₂HPO₄）是否与蛋白胨酵母粉分开灭菌或达标配制？② 查全长 Ro52 诱导记录 —— `50 μM ZnCl₂` 是否在 **诱导加 IPTG 时同步加入**（而非灭菌前混入）？",
    "cases": [
      {
        "title": "全长 Ro52 补锌配方（100 mM ZnCl₂ 母液配制与投料 SOP）",
        "tag": "实战案例",
        "body": "## **1. `100 mM ZnCl₂` 无菌母液标准配制法**\n- 称取无水氯化锌（ZnCl₂, MW = 136.3）**1.363 g**，加入 90 mL 纯水；若出现微弱水解乳光，滴加 1–2 滴 `1 M HCl` 至溶液彻底澄清透明，定容至 100 mL，经 **0.22 μm 滤膜过滤除菌**，分装保存。\n- **投料比例（终浓度 `50 μM`）**：每 **1 L（1,000 mL）** 预冷至 16°C 的菌液，在加入 `100 μL` 1M IPTG 的同时，加入 **`500 μL`（0.5 mL）的 `100 mM ZnCl₂` 母液**（即 1:2,000 体积比）。\n- *(注：若是表达已切掉 N 端锌指域的 `Ro52(125–268)` 截短体，因不含 RING/B-box 域，则无需补加 ZnCl₂。)*"
      }

  "learn.3.2": {
    "key": "learn.3.2",
    "path": "基础知识学习 / ③ 上游发酵与可溶性表达 (Upstream & Gate R4) / 细胞破壁、专属破壁Buffer与真可溶评估 (五级拆解)",
    "title": "细胞破壁、专属破壁Buffer与真可溶评估 (五级拆解)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在 **全程冰水浴低温（0–4°C）** 与 **现配现加蛋白酶抑制剂（PMSF）** 保护下，通过 **脉冲超声破壁（小试/中试）或高压均质破菌（放大）** 彻底释放胞内可溶蛋白，经 **高速离心 + 0.45μm过滤** 澄清后，利用 **Mini-Pulldown小量挂柱试验** 排除“MBP 假可溶微聚集体”，确保进入纯化柱的每一毫升上清都是真可溶、高活性物料。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【脉冲超声破壁 vs. 高压均质破菌】**：超声波靠空化效应震碎细菌，适合 10 mL – 500 mL 菌悬液（必须设“超 3 秒、停 5 秒”防发热）；高压均质机靠 700–800 bar 高压狭缝剪切破壁，破碎极其均匀且带冷却盘管，适合 >500 mL 规模。\n- **【现配现加蛋白酶抑制剂（PMSF）】**：苯甲基磺酰氟（PMSF），专门封死破菌时释放出来的丝氨酸蛋白酶。**因为 PMSF 一遇到水，30 分钟内就会水解失效一半**！所以绝对不能提前一天配进水溶液里，必须用 **无水异丙醇（或无水乙醇）配成 `100 mM PMSF` 母液**，在开机超声前那一分钟按 `1:100` 加进破菌液里！\n- **【Mini-Pulldown小量挂柱试验】**：取 1 mL 破菌上清 + 50 μL 镍柱填料在 EP 管里摇 20 分钟洗脱跑胶——不仅看蛋白在不在上清里，更直接检验它能不能被柱子抓住！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **破菌与上柱前必查红线**：① 破菌液上柱前是否做了 **高速离心（≥12,000–14,000 rpm, 30 min, 4°C）+ `0.45 μm` 滤膜过滤**？（没过滤直接上 AKTA 预装柱或重力柱的，残留菌体微粒会直接把层析柱顶筛板堵死报废！）；② 全长 Ro52 的破菌液里 **是否已确认不含 EDTA**？",
    "cases": [
      {
        "title": "Ro52 湿菌重悬、冰浴超声破壁与上清澄清标准化操作卡",
        "tag": "实战案例",
        "body": "## **1. Ro52 破菌与澄清六步标准动作**\n1. **称重与重悬比**：取 `-80°C` 冻存或新鲜收获的湿菌泥，按 **`1 g 湿菌 : 12 mL 破菌缓冲液`**（`50 mM Tris pH 7.8, 300 mM NaCl, 5% Glycerol, 15 mM Imidazole, 0.5 mM TCEP`）在 4°C 搅拌或吹打至完全均匀无菌块。\n2. **现加 PMSF**：临超声前加入 `1/100` 体积的 `100 mM PMSF`（异丙醇母液，终浓度 `1 mM`）。\n3. **冰水浴脉冲超声**：将烧杯深埋于 **碎冰+水混合物** 中，变幅杆探头伸入液面下 1.5–2 cm（离杯底 >1 cm），设置功率 300–400 W，**工作 3 s / 间歇 5 s**，总时间约 20–30 min（期间实测液温 **始终 ≤10°C，绝不起白色泡沫**），直至菌液由浑浊牛奶状变为半透明、移液器吸吐不再粘稠拉丝。\n4. **留 Total 样**：混匀后吸取 `50 μL` 标为 **`T（总菌）`**。\n5. **高速离心与留 Pellet 样**：`14,000 rpm`（约 22,000× g）、**4°C 离心 30 min**；收集全部上清并记录体积，取 `50 μL` 标为 **`S（上清）`**；管底沉淀用等体积缓冲液重悬取样标为 **`P（沉淀）`**。\n6. **微孔过滤护柱**：上清经 **`0.45 μm` 亲水滤膜（PES 或 PVDF）** 过滤除尽微粒，立即进入亲和层析！"
      }

    "title": "冰水浴脉冲超声与高压均质破壁实操",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握细胞裂解（Cell Lysis）过程中的两大物理与化学防护核心 —— **防止超声局部高温与气液界面起泡变性（把好蛋白煮成假包涵体）**，以及利用 **溶菌酶（Lysozyme）+ DNase I / 高盐 + PMSF** 协同降低破菌液粘度并阻断内源蛋白酶降解。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【气液界面起泡变性（Foaming Denaturation）】**：超声探头如果插得太浅（贴近液面），一声巨响就会打出满杯白色泡沫！**蛋白质一旦遇到气泡的“空气-水界面”，会瞬间把原本藏在肚子里的疏水核心翻出来贴向空气，发生不可逆的表面变性沉淀**！一旦起泡，立即停机把探头往下插深！\n- **【基因组DNA释放导致的粘稠拉丝】**：细菌破壁瞬间，里面长达几毫米的染色体基因组 DNA 会散开在液体里，像鼻涕一样粘稠拉丝（不仅离心甩不清，一上柱子就会把层析柱彻底糊死）。通过 **足量超声剪切打断 DNA 长链**（或加入 5 μg/mL `DNase I + 2 mM MgCl₂` 消化 15 min），直到液体像水一样清爽滴落，才算破菌合格！\n- **【溶菌酶（Lysozyme）辅助破壁】**：在冰浴超声前先加 0.2 mg/mL 溶菌酶在 4°C 孵育 20 分钟，先把细菌坚硬的肽聚糖细胞壁啃软，能把所需超声时间缩短一半，大幅减少超声产热对构象蛋白的损伤。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **破菌终点判断双标准**：① **外观与粘度**：菌液颜色变深、透光度明显增加，用移液枪头吸起滴落时 **呈水滴状干脆滴下、无任何粘连拉丝**；② **温度红线**：全程冰水浴（冰块+水，不能只放干冰块因为干冰块与杯壁接触面积小导热慢！），实测破菌液温度 **绝不超过 10–12°C**！",
    "cases": [
      {
        "title": "超声探头起泡与只放碎冰不加水导致 Ro52 热变性沉淀的现场教训",
        "tag": "实战案例",
        "body": "## **1. 两个真实的实验室细节失误**\n1. **失误一（只埋碎冰没加水）**：烧杯周围只塞了干碎冰没加冷水，超声 5 分钟后碎冰融化在烧杯外壁留出一圈空气隔热层，杯内液体温度升至 **34°C**，原本可溶的 `MBP-Ro52` 被热变性煮成白色浑浊沉淀！ → **纠正：必须用「70% 碎冰 + 30% 冷水」组成的冰水浴紧密贴合杯壁导热**。\n2. **失误二（探头太浅打出满杯泡沫）**：50 mL 离心管超声时探头仅入液面 0.5 cm，打出大量泡沫，泡沫层中的 Ro52 全部变性成不溶物。 → **纠正：探头必须深入液面下 ≥1.5–2 cm，一旦听见空化嘶嘶声变尖或起泡，立即停机调整深度**。"
      }

    "title": "破壁专属Lysis Buffer配方: 500mM高盐、现加PMSF、补Zn2+与禁EDTA铁律",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握大肠杆菌细胞破壁裂解工序的 **破壁专属Lysis Buffer配方**，明确每一项组分（**500mM高盐防自聚**、**20mM低咪唑降本底**、**现加1mM PMSF防蛋白酶降解**、**20µM ZnCl₂护锌指** 与 **绝对禁加EDTA**）的生化作用。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【破壁专属Lysis Buffer配方】**：\n  - **推荐标准配方（以 6×His-MBP-Ro52 为例）**：`25 mM HEPES (或 Tris-HCl) pH 7.5, 500 mM NaCl, 20 mM Imidazole, 5% (v/v) Glycerol, 0.5 mM TCEP, 20 µM ZnCl₂`，并在 **开超声前 3 分钟现加 1 mM PMSF**（按 1 g 湿菌泥兑 10–15 mL 破壁液重悬）。\n- **【500mM高盐防自聚】**：菌体破裂瞬间，原本高度浓缩在胞内的靶蛋白与大量带负电的细菌 DNA/RNA 和脂质混在一起；500 mM NaCl 能打断靶蛋白与细菌核酸的非特异静电纠缠，并维持靶蛋白盐溶状态。\n- **【现加1mM PMSF防蛋白酶降解】**：大肠杆菌周质和外膜含有丝氨酸蛋白酶，一旦破壁就会疯狂剪切靶蛋白的柔性铰链区。**PMSF（苯甲基磺酰氟，配成 100 mM 异丙醇母液存 −20°C）在水溶液中的半衰期仅有 30–60 分钟**！如果提前一天把 PMSF 加进破壁液里，第二天破壁时 PMSF 早就 100% 水解失效了——**必须在重悬完菌泥、即将开机超声的前一刻按 1:100 现加**！\n- **【20µM ZnCl₂护锌指与绝对禁加EDTA】**：补足 20 µM ZnCl₂ 防止高浓度裂解稀释时 RING 域脱锌；**严禁照抄普通分子生物学裂解液添加 EDTA**（EDTA 会同时废掉锌指蛋白和后续的 Ni-NTA 柱）。",
    "cases": [
      {
        "title": "项目实战案例：提前一夜把 PMSF 加进 Buffer 导致 Ro52 铰链区被切出 32 kDa 降解带",
        "tag": "实验室实战案例",
        "body": "- 某次操作员在前一天下午配破壁液时就把 PMSF 加了进去，次日早上破壁纯化后 SDS-PAGE 主带下方出现明显的 32 kDa 断裂杂带。严格执行 **“超声前 3 分钟现加 1 mM PMSF + 必要时补加 EDTA-Free 蛋白酶抑制剂片”** 后，降解带彻底消失。"
      }

    "title": "超声/均质温控红线(<10°C)、防起泡氧化与DNase消除核酸黏液",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **冰水混合物浴脉冲超声（Pulse Sonication）** 与 **低温高压均质破壁** 的 **液温<10°C硬红线**、**探头液面深度防起泡氧化** 以及 **DNase I/Mg²⁺消除细菌基因组DNA鼻涕状黏液** 的实操技巧。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【冰水混合物浴脉冲超声（Pulse Sonication）】**：\n  - **为什么必须是“冰+水混合物”而不是“干碎冰”**：干碎冰与烧杯外壁之间全是空气缝隙，导热极差！只有 **一半碎冰 + 一半冷水** 才能 tight 包裹烧杯壁迅速带走超声空化产生的巨大热量。\n  - **脉冲参数与温控红线**：推荐 **工作 2–3 秒、停歇 4–6 秒（占空比 ≤ 35%）**，功率 250–350 W；**全程用温度计监测菌液内部温度，绝对不得超过 10°C（理想 4–8°C）**！一旦局部过热，刚释放出来的可溶蛋白会被直接“煮”成热变性假包涵体！\n- **【探头液面深度防起泡氧化】**：超声变幅杆探头尖端必须深入液面以下 **1.5–2.0 cm**（且距烧杯底 ≥ 1 cm）。如果探头插得太浅，液面会吸入大量空气打出满杯白色泡沫——**泡沫的气-液界面张力加上氧气，会在 2 分钟内把杯子里的蛋白全部表面变性并氧化交联**！一旦听到刺耳的“滋滋”空化啸叫或起泡，必须立即停机调深探头。\n- **【DNase I/Mg²⁺消除细菌基因组DNA鼻涕状黏液】**：高密度菌泥（如 TB 发酵）刚破壁时，释放出的细菌基因组大分子 DNA 会让裂解液变得像鼻涕一样极度粘稠（既离不下沉淀，又会直接堵死 0.22 µm 滤膜和层析柱）。只要继续超声打断长链 DNA，或在破壁液中加入 **5 µg/mL DNase I + 2 mM MgCl₂** 冰上孵育 15 min，裂解液就会瞬间变得像水一样清爽流动性极佳！",

        "tag": "实验室实战案例",
        "body": "- 某次小试 30 mL 菌液放在 100 mL 宽底大烧杯中超声，液层太浅导致探头打入大量空气变成满杯奶油状泡沫，离心后上清蛋白少了 60%。改用细高型 50 mL 离心管浸于冰水浴中深插探头脉冲超声（全程零泡沫、终点液温 6.5°C），上清可溶收率直接翻倍。"

    "path": "基础知识学习 / ③ 上游发酵与可溶性表达 (Upstream & Gate R4) / 细胞破壁、专属破壁Buffer与真可溶评估 (五级拆解) / 冰水浴脉冲超声与高压均质破壁实操 / 超声/均质温控红线(<10°C)、防起泡氧化与DNase消除核酸黏液",
    "title": "超声/均质温控红线(<10°C)、防起泡氧化与DNase消除核酸黏液",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **冰水混合物浴脉冲超声（Pulse Sonication）** 与 **低温高压均质破壁** 的 **液温<10°C硬红线**、**探头液面深度防起泡氧化** 以及 **DNase I/Mg²⁺消除细菌基因组DNA鼻涕状黏液** 的实操技巧。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【冰水混合物浴脉冲超声（Pulse Sonication）】**：\n  - **为什么必须是“冰+水混合物”而不是“干碎冰”**：干碎冰与烧杯外壁之间全是空气缝隙，导热极差！只有 **一半碎冰 + 一半冷水** 才能 tight 包裹烧杯壁迅速带走超声空化产生的巨大热量。\n  - **脉冲参数与温控红线**：推荐 **工作 2–3 秒、停歇 4–6 秒（占空比 ≤ 35%）**，功率 250–350 W；**全程用温度计监测菌液内部温度，绝对不得超过 10°C（理想 4–8°C）**！一旦局部过热，刚释放出来的可溶蛋白会被直接“煮”成热变性假包涵体！\n- **【探头液面深度防起泡氧化】**：超声变幅杆探头尖端必须深入液面以下 **1.5–2.0 cm**（且距烧杯底 ≥ 1 cm）。如果探头插得太浅，液面会吸入大量空气打出满杯白色泡沫——**泡沫的气-液界面张力加上氧气，会在 2 分钟内把杯子里的蛋白全部表面变性并氧化交联**！一旦听到刺耳的“滋滋”空化啸叫或起泡，必须立即停机调深探头。\n- **【DNase I/Mg²⁺消除细菌基因组DNA鼻涕状黏液】**：高密度菌泥（如 TB 发酵）刚破壁时，释放出的细菌基因组大分子 DNA 会让裂解液变得像鼻涕一样极度粘稠（既离不下沉淀，又会直接堵死 0.22 µm 滤膜和层析柱）。只要继续超声打断长链 DNA，或在破壁液中加入 **5 µg/mL DNase I + 2 mM MgCl₂** 冰上孵育 15 min，裂解液就会瞬间变得像水一样清爽流动性极佳！",
    "cases": [
      {
        "title": "项目实战案例：超声起泡导致 60% 可溶蛋白在破壁阶段变性进沉淀",
        "tag": "实验室实战案例",
        "body": "- 某次小试 30 mL 菌液放在 100 mL 宽底大烧杯中超声，液层太浅导致探头打入大量空气变成满杯奶油状泡沫，离心后上清蛋白少了 60%。改用细高型 50 mL 离心管浸于冰水浴中深插探头脉冲超声（全程零泡沫、终点液温 6.5°C），上清可溶收率直接翻倍。"
      }

    "title": "高速离心与Mini-Pulldown小量挂柱: 排查MBP假可溶微聚集",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握破菌后 **高速离心固液分离** 的操作规范，学会识别大助溶标签（如 MBP）特有的 **“假可溶微聚集体陷阱（Soluble Micelle Aggregates）”**，并通过 **Mini-Pulldown（小量亲和磁珠/填料挂柱试验）** 在正式放大投柱前确认上清中的目标蛋白具备真实的填料结合力与酶切稳定性。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【假可溶微聚集体陷阱（Soluble Micelle Aggregates）】**：这是做 `MBP` 融合蛋白最容易踩的隐形大坑！当诱导温度偏高（如 25–30°C）或蛋白内部疏水区没折好时，几十个 Ro52 分子的疏水区其实已经死死抱成一个大绒球了（没有天然活性），但因为外圈围着几十个极度亲水的 MBP 大球，使得这个几百万道尔顿的“大绒球”依然能悬浮在水里，**连 14,000 rpm 高速离心都甩不下去**（跑 SDS-PAGE 看上清条带还特别粗）！\n- **【怎么一眼识破“假可溶”？】**：\n  1. **现象一（挂不上柱）**：因為 `6xHis` 或 `MBP` 结合口袋被卷在微聚集体绒球内部，过 Ni 柱或 Amylose 柱时，一多半从流穿液（FT）直接流走；\n  2. **现象二（一切就沉）**：一旦加 TEV 酶把外圈的 MBP 救生圈切掉，里面的死 Ro52 瞬间原形毕露，在管子里直接变成一团白色沉淀！\n- **【Mini-Pulldown（小量挂柱试验）】**：在小试筛选阶段，取 1 mL 破菌上清 + 50 μL 平衡好的 Ni-NTA 填料在 1.5 mL 离心管中 4°C 翻转孵育 20 min，离心洗杂后用 100 μL含 250 mM 咪唑洗脱液洗脱并加一点 TEV 酶试切 —— **只有“挂得上、洗得下、切完还不沉”的上清，才是 100% 折叠正确的真可溶蛋白**！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **小试筛选必查**：筛选最优表达条件时，不能只停留在“看破菌上清 S 泳道谁最粗”，必须加做一步 **Mini-Pulldown 小量挂柱与试切确认**，确认可回收的完整无标签蛋白得率！",
    "cases": [
      {
        "title": "Ro52 用 Mini-Pulldown 淘汰“28°C 假可溶高产组”、锁定“16°C 真可溶组”案例",
        "tag": "实战案例",
        "body": "## **1. 两组上清的“真假可溶”对决**\n| 对比项 | A 组：28°C 诱导 6 h | B 组：16°C 诱导 16 h (+50 μM ZnCl₂) |\n|---|---|---|\n| **破菌上清 (S) 电泳条带** | 看着很粗（表观上清占比 ~45%） | 粗且清晰（上清占比 ~55%） |\n| **Mini-Pulldown (Ni-NTA 挂柱率)** | **仅 35% 挂上柱（65% 在流穿液跑掉！）** | **>85% 牢牢挂上柱（流穿液极干净）** |\n| **加 TEV 酶切后状态** | **切完 2 小时管底出现大量白沉淀** | **切完 14 小时溶液依然清亮透明** |\n| **SEC-HPLC 验证** | 70% 在 V₀ 死体积峰（微聚集体胶束） | **>90% 为天然同源二聚体主峰** |"
      }

    "path": "基础知识学习 / ③ 上游发酵与可溶性表达 (Upstream & Gate R4) / Gate R4 (G1)｜④ 上游湿菌重、T/S/P三道电泳QC与交接标准",
    "title": "Gate R4 (G1)｜④ 上游湿菌重、T/S/P三道电泳QC与交接标准",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R4（上游制备完成与 G1 上下游交接关口）** 将上游发酵的质检标准（**单位体积湿菌重**、**总菌/上清/沉淀等体积归一化SDS-PAGE可溶率**、**Mini-Pulldown可捕获确认** 及 **无杂菌/噬菌体污染**）固定为硬性过关条件，并在 LabOS 中完成上游批次向中下游纯化的受控转序。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【总菌/上清/沉淀（T/S/P）等体积归一化SDS-PAGE】**：上游交接的核心铁证胶图！取 1 mL 破菌液，留 `T` 样后离心取出上清 `S`，**管底的沉淀 `P` 必须加严格相等的 1 mL 缓冲液重悬**，然后 `T`、`S`、`P` 吸同样微升数并排点在相邻三个泳道上！这样：T ≈ S + P，目视或扫描 S / (S+P) 的比例才是真实不掺水的可溶率！\n- **【单位体积湿菌重（Wet Cell Weight, g/L）】**：反映本批发酵菌体密度是否正常的直观指标（如 TB 摇瓶 16°C 过夜诱导通常为 `15–22 g/L`，LB 摇瓶通常为 `4–7 g/L`）。\n- **【G1 上游交接状态管控】**：在 LabOS「批记录 / 上游表达」模块中，上游负责人填完所有参数并上传 T/S/P 胶图后，消除所有“待补”空行，经复核确认达标后方可转入下游纯化工序。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R4 (G1) 四件套放行核查表**：\n> - **① 检查方法**：核查发酵批记录（OD₆₀₀、16°C 预冷时间、IPTG 与 ZnCl₂ 投料量）、湿菌称重单、以及 `Marker + 未诱导 + Total + Supernatant + Pellet` 五泳道并排 SDS-PAGE 胶图；\n> - **② 通过依据**：TB 摇瓶湿菌重 **≥15 g/L**（或与标准速率偏差 ≤20%）；目标条带分子量正确且 **上清（S）可溶占比 ≥40%**；未诱导泳道本底干净；\n> - **③ 未通过动作**：若可溶率 <20%（如预冷未到位全进包涵体）或湿菌重异常偏低，该批湿菌体立即标为 **「冻结」** 隔离调查，**严禁直接拿去过昂贵的亲和层析柱**；\n> - **④ 交付物**：贴有受控中间品批号、重量与日期的 `-80°C` 湿菌体（或 0.45 μm 过滤澄清上清）+ 完整 LabOS 上游记录与标注齐全的 T/S/P 电泳原图。",
    "cases": [
      {
        "title": "Ro52 上游批次 Gate R4 (G1) 五泳道标准交接电泳图判读样板",
        "tag": "Gate 放行案例",
        "body": "## **1. 标准五泳道（5-Lane）上游交接胶图排布规范**\n| 泳道编号 | 样品名称 | 上样处理（等体积归一化） | 合格判读标准（Ro52 全长融合体 ~97.5 kDa） |\n|---|---|---|---|\n| **Lane 1** | 标准蛋白 Marker | 5 μL (10–180 kDa) | 条带清晰，100 kDa / 70 kDa / 55 kDa / 40 kDa 刻度明确 |\n| **Lane 2** | **未诱导总菌 (0 h)** | 按 OD₆₀₀ 折算等菌量煮样 | 在 97.5 kDa 处无明显泄漏粗带（证明 0.5% 葡萄糖锁死泄漏） |\n| **Lane 3** | **诱导后破菌总液 (T)** | 破菌混匀液原液 10 μL + 10 μL 2×Buffer | 在 100 kDa 紧下方出现粗壮的 **97.5 kDa 主表达带** |\n| **Lane 4** | **离心过滤后上清 (S)** | 14,000 rpm 离心上清原液 10 μL + 10 μL 2×Buffer | **97.5 kDa 条带亮度占 Total (Lane 3) 的 50%–60%（≥40% 合格）** |\n| **Lane 5** | **等体积重悬沉淀 (P)** | 沉淀加 **1.0 倍原体积** Buffer 重悬后取 10 μL | 残余包涵体占 40%–50%，且 `Lane 4 + Lane 5 ≈ Lane 3` 账目闭合 |"
      }

    "title": "Gate R4 (G1)｜④ 上游湿菌重、T/S/P三道电泳QC与交接标准",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R4（上游制备完成与 G1 上下游交接关口）** 将上游发酵的质检标准（**单位体积湿菌重**、**总菌/上清/沉淀等体积归一化SDS-PAGE可溶率**、**Mini-Pulldown可捕获确认** 及 **无杂菌/噬菌体污染**）固定为硬性过关条件，并在 LabOS 中完成上游批次向中下游纯化的受控转序。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【总菌/上清/沉淀（T/S/P）等体积归一化SDS-PAGE】**：上游交接的核心铁证胶图！取 1 mL 破菌液，留 `T` 样后离心取出上清 `S`，**管底的沉淀 `P` 必须加严格相等的 1 mL 缓冲液重悬**，然后 `T`、`S`、`P` 吸同样微升数并排点在相邻三个泳道上！这样：T ≈ S + P，目视或扫描 S / (S+P) 的比例才是真实不掺水的可溶率！\n- **【单位体积湿菌重（Wet Cell Weight, g/L）】**：反映本批发酵菌体密度是否正常的直观指标（如 TB 摇瓶 16°C 过夜诱导通常为 `15–22 g/L`，LB 摇瓶通常为 `4–7 g/L`）。\n- **【G1 上游交接状态管控】**：在 LabOS「批记录 / 上游表达」模块中，上游负责人填完所有参数并上传 T/S/P 胶图后，消除所有“待补”空行，经复核确认达标后方可转入下游纯化工序。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R4 (G1) 四件套放行核查表**：\n> - **① 检查方法**：核查发酵批记录（OD₆₀₀、16°C 预冷时间、IPTG 与 ZnCl₂ 投料量）、湿菌称重单、以及 `Marker + 未诱导 + Total + Supernatant + Pellet` 五泳道并排 SDS-PAGE 胶图；\n> - **② 通过依据**：TB 摇瓶湿菌重 **≥15 g/L**（或与标准速率偏差 ≤20%）；目标条带分子量正确且 **上清（S）可溶占比 ≥40%**；未诱导泳道本底干净；\n> - **③ 未通过动作**：若可溶率 <20%（如预冷未到位全进包涵体）或湿菌重异常偏低，该批湿菌体立即标为 **「冻结」** 隔离调查，**严禁直接拿去过昂贵的亲和层析柱**；\n> - **④ 交付物**：贴有受控中间品批号、重量与日期的 `-80°C` 湿菌体（或 0.45 μm 过滤澄清上清）+ 完整 LabOS 上游记录与标注齐全的 T/S/P 电泳原图。",
    "cases": [
      {
        "title": "Ro52 上游批次 Gate R4 (G1) 五泳道标准交接电泳图判读样板",
        "tag": "Gate 放行案例",
        "body": "## **1. 标准五泳道（5-Lane）上游交接胶图排布规范**\n| 泳道编号 | 样品名称 | 上样处理（等体积归一化） | 合格判读标准（Ro52 全长融合体 ~97.5 kDa） |\n|---|---|---|---|\n| **Lane 1** | 标准蛋白 Marker | 5 μL (10–180 kDa) | 条带清晰，100 kDa / 70 kDa / 55 kDa / 40 kDa 刻度明确 |\n| **Lane 2** | **未诱导总菌 (0 h)** | 按 OD₆₀₀ 折算等菌量煮样 | 在 97.5 kDa 处无明显泄漏粗带（证明 0.5% 葡萄糖锁死泄漏） |\n| **Lane 3** | **诱导后破菌总液 (T)** | 破菌混匀液原液 10 μL + 10 μL 2×Buffer | 在 100 kDa 紧下方出现粗壮的 **97.5 kDa 主表达带** |\n| **Lane 4** | **离心过滤后上清 (S)** | 14,000 rpm 离心上清原液 10 μL + 10 μL 2×Buffer | **97.5 kDa 条带亮度占 Total (Lane 3) 的 50%–60%（≥40% 合格）** |\n| **Lane 5** | **等体积重悬沉淀 (P)** | 沉淀加 **1.0 倍原体积** Buffer 重悬后取 10 μL | 残余包涵体占 40%–50%，且 `Lane 4 + Lane 5 ≈ Lane 3` 账目闭合 |"
      }
    ],

  "learn.4": {
    "key": "learn.4",
    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5)",
    "title": "④ 下游层析纯化与填料再生维护 (Downstream & Gate R5)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过科学的 **Buffer化学体系**、**亲和层析捕获**、**阴/阳离子交换与分子筛精纯** 以及严格的 **层析柱装柱再生与20%乙醇保养**，将破碎上清中的目标蛋白提纯至符合 **Gate R5出厂理化QC标准** 的高纯度、单分散活性原料。\n- **实验室设备配置特点**：本实验室以 **一套全自动蛋白纯化仪（AKTA）配合多套手工柱（重力柱/注射器预装柱/蠕动泵）为主力**，因此每位研发人员既要精通 AKTA 在线 UV/电导率梯度监测，更要掌握手工装柱、流速控制、洗脱分管与填料再生保养。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Buffer化学体系】**：为蛋白提供稳定 pH、离子强度、氧化还原电位和配体竞争环境的缓冲液配方组合；选错一种成分（如给含锌蛋白加 EDTA、给 NHS 偶联蛋白用 Tris）就会导致整批报废。\n- **【亲和层析捕获】**：利用融合标签（如 6×His、MBP）与填料配基（Ni²⁺、直链淀粉）的特异锁钥结合，从复杂的细菌裂解液中一步抓取目标蛋白并浓缩体积的头道工序。\n- **【阴/阳离子交换与分子筛精纯】**：在亲和捕获后，利用蛋白质表面净电荷差异（阴离子柱 AEX / 阳离子柱 CEX）、疏水差异（HIC）或流体力学体积差异（SEC 分子筛），剔除伴随杂蛋白、核酸、内毒素和错误折叠多聚体的精修工序。\n- **【层析柱装柱再生与20%乙醇保养】**：保证手工柱和预装柱床层均匀无气泡、每次使用后彻底洗脱残留强结合杂蛋白、定期剥离再生金属离子并封存在 20% 乙醇中防止长菌干裂的设备维护规范。\n- **【Gate R5出厂理化QC标准】**：纯化原液入库或交接下游前必须通过的五大硬性理化体检（SDS-PAGE 纯度、SEC-HPLC 单分散性、BCA/A₂₈₀ 浓度、A₂₆₀/A₂₈₀ 核酸残留、内毒素与分步收率）。\n\n---\n\n## **3. 下游纯化“三步走”与填料寿命管理**\n1. **Capture（捕获阶段）**：Ni-NTA 或 Amylose 柱，目标是快速从大体积裂解液中抓出靶蛋白，去除 85% 以上宿主杂蛋白。\n2. **Intermediate（中度精制 / 去标签）**：TEV/ULP1 酶切去标签 + 反向 IMAC，或 **阴离子交换（AEX）/ 阳离子交换（CEX）** 去除电荷异质体、核酸与内毒素。\n3. **Polishing（精细抛光与换液）**：**SEC 分子筛** 切掉死体积微聚集体，配合超滤/透析置换至无伯胺、带防冻保护的终存储 Buffer。\n4. **填料资产红线**：一根柱子用完绝不允许带着高浓度咪唑、高盐或残余蛋白直接塞回冰箱！必须当天完成水洗与 **20% 乙醇封存**。",
    "cases": [
      {
        "title": "项目实战案例：Ro52 (TRIM21) 下游三步纯化与手工/自动柱协同路线",
        "tag": "实验室实战案例",
        "body": "- **设备分工**：\n  1. **头道捕获（手工重力柱 / 蠕动泵 5 mL Ni-NTA 柱）**：由于多批次小试并行筛选，头道亲和采用手工重力柱或蠕动泵上样（流速 1–2 mL/min），Bradford 显色追踪洗脱终点，单天可并行处理 4–6 个构建体。\n  2. **精纯抛光（全自动 AKTA 层析仪 + Superdex 200 Increase 10/300 GL）**：亲和洗脱浓缩至 500 µL 后，上全自动 AKTA 跑 SEC 分子筛，精确切弃 8.2 mL 死体积聚体，收集 13.8 mL 天然二聚体主峰。"
      }
    ],
    "updatedAt": "2026-11-20T13:10:00.000Z"

  "learn.4.0": {
    "key": "learn.4.0",
    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 亲和层析捕获与填料再生维护 (五级深度拆解)",
    "title": "亲和层析捕获与填料再生维护 (五级深度拆解)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握四大亲和层析技术——**Ni-NTA金属螯合层析**、**Amylose直链淀粉层析**、**Protein A/G抗体亲和层析** 以及 **蛋白酶切与反向挂柱（Reverse IMAC）** 的结合洗脱机理，并严格落实每种亲和填料的 **清洗再生与20%乙醇封存保养 SOP**。\n- **为什么亲和层析是下游的脊梁**：亲和层析靠的是生物大分子或配位键的“专属门禁卡”，一步就能实现 50–100 倍的纯化富集。但亲和填料价格昂贵且极易被脂质、变性蛋白和微生物污染，**“三分用柱、七分养柱”**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Ni-NTA金属螯合层析】**：利用琼脂糖微球上的 NTA 四齿螯合臂固定 Ni²⁺，特异抓取带 6×His 标签的重组蛋白，再用咪唑竞争洗脱的实验室第一主力捕获柱。\n- **【Amylose直链淀粉层析】**：利用直链淀粉多糖配基特异结合 MBP（麦芽糖结合蛋白）标签，用 10 mM 麦芽糖温和竞争洗脱且完全不扰动靶蛋白金属离子的正交亲和柱。\n- **【Protein A/G抗体亲和层析】**：利用细菌表面蛋白 A 或 G 对免疫球蛋白 IgG Fc 段的超高亲和力，从细胞培养上清或腹水中一步纯化单克隆/多克隆抗体的专用柱。\n- **【蛋白酶切与反向挂柱（Reverse IMAC）】**：用带 His 标签的 TEV 或 ULP1 蛋白酶切掉融合标签后，再次过 Ni-NTA 柱：让切下来的标签、未切开的杂蛋白和蛋白酶全部留在柱上，流穿液直接拿到无标签纯天然靶蛋白的精妙工艺。\n- **【清洗再生与20%乙醇封存保养】**：每次用完柱子后的标准善后流程——高浓度洗脱剂清场 → 纯水洗盐 → 20% 乙醇防腐封存；以及柱效下降时的剥镍/NaOH 除垢/重挂镍再生流程。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **亲和工序必查**：① 流穿液（FT）、洗杂液（W）、洗脱峰（E）必须同胶跑 SDS-PAGE；②《层析柱使用与维护台账》必须记录本次使用批次、累计使用次数、清洗步骤及是否已置换为 20% 乙醇。",
    "cases": [
      {
        "title": "项目实战案例：实验室亲和层析柱“专柱专用”与寿命管理制度",
        "tag": "实验室实战案例",
        "body": "- 规定：**不同靶点项目严禁混用同一根 Ni-NTA 或 Amylose 填料柱**（防止极微量交叉污染导致临床免疫假阳性）！每个项目配发独立贴标的手工柱管或预装柱，累计使用满 5 次必须执行 1 次 EDTA 剥镍 + 0.5 M NaOH CIP 深度再生。"
      }

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 亲和层析捕获与填料再生维护 (五级深度拆解)",
    "title": "亲和层析捕获与填料再生维护 (五级深度拆解)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握四大亲和层析技术——**Ni-NTA金属螯合层析**、**Amylose直链淀粉层析**、**Protein A/G抗体亲和层析** 以及 **蛋白酶切与反向挂柱（Reverse IMAC）** 的结合洗脱机理，并严格落实每种亲和填料的 **清洗再生与20%乙醇封存保养 SOP**。\n- **为什么亲和层析是下游的脊梁**：亲和层析靠的是生物大分子或配位键的“专属门禁卡”，一步就能实现 50–100 倍的纯化富集。但亲和填料价格昂贵且极易被脂质、变性蛋白和微生物污染，**“三分用柱、七分养柱”**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Ni-NTA金属螯合层析】**：利用琼脂糖微球上的 NTA 四齿螯合臂固定 Ni²⁺，特异抓取带 6×His 标签的重组蛋白，再用咪唑竞争洗脱的实验室第一主力捕获柱。\n- **【Amylose直链淀粉层析】**：利用直链淀粉多糖配基特异结合 MBP（麦芽糖结合蛋白）标签，用 10 mM 麦芽糖温和竞争洗脱且完全不扰动靶蛋白金属离子的正交亲和柱。\n- **【Protein A/G抗体亲和层析】**：利用细菌表面蛋白 A 或 G 对免疫球蛋白 IgG Fc 段的超高亲和力，从细胞培养上清或腹水中一步纯化单克隆/多克隆抗体的专用柱。\n- **【蛋白酶切与反向挂柱（Reverse IMAC）】**：用带 His 标签的 TEV 或 ULP1 蛋白酶切掉融合标签后，再次过 Ni-NTA 柱：让切下来的标签、未切开的杂蛋白和蛋白酶全部留在柱上，流穿液直接拿到无标签纯天然靶蛋白的精妙工艺。\n- **【清洗再生与20%乙醇封存保养】**：每次用完柱子后的标准善后流程——高浓度洗脱剂清场 → 纯水洗盐 → 20% 乙醇防腐封存；以及柱效下降时的剥镍/NaOH 除垢/重挂镍再生流程。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **亲和工序必查**：① 流穿液（FT）、洗杂液（W）、洗脱峰（E）必须同胶跑 SDS-PAGE；②《层析柱使用与维护台账》必须记录本次使用批次、累计使用次数、清洗步骤及是否已置换为 20% 乙醇。",

    "title": "Ni-NTA 镍柱亲和层析 (含图解)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：全面掌握 **Ni-NTA配位化学原理**、**阶梯咪唑除杂与洗脱**、**手工柱与AKTA过镍柱实操**、**日常洗后20%乙醇保养** 以及 **EDTA剥镍-NaOH再生-NiSO₄重挂镍** 全套理论与动手技能。\n- **核心痛点解决**：彻底解决新手常见的“镍柱变黄变褐/变白”、“杂带洗不掉”、“目标蛋白挂不上柱”以及“柱子用两次就堵死”四大顽疾。\n\n[SVG:ni_nta]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Ni-NTA配位化学原理】**：Ni²⁺ 离子有 6 个配位轨道（八面体构型）。琼脂糖填料上的 **次氮基三乙酸（NTA，Nitrilotriacetic acid）** 像一只四爪卡爪一样牢牢抓着 Ni²⁺ 的 4 个配位键，把 Ni²⁺ 固定在填料上；剩下 **2 个空余配位爪** 伸向溶液，专门等待蛋白上的 **6×His（连续 6 个组氨酸）的咪唑侧链氮原子** 上来配位结合。\n  - *对比 IDA 填料*：老式 IDA 填料只有 3 个爪抓 Ni²⁺，虽然留出 3 个爪抓蛋白，但 Ni²⁺ 极易脱落（镍脱落会诱发蛋白沉淀）；NTA 四爪抓镍极其牢固，是工业与诊断原料的首选。\n- **【阶梯咪唑除杂与洗脱】**：游离咪唑（Imidazole）分子跟组氨酸侧链长得一模一样。\n  - **上样（20 mM 咪唑）**：堵住 Ni²⁺ 对大肠杆菌天然零散组氨酸蛋白的弱结合；\n  - **洗杂（40–60 mM 咪唑）**：把含有 2–3 个相邻组氨酸的宿主高频污染蛋白（如 SlyD 伴侣蛋白）挤下柱子；\n  - **洗脱（250–300 mM 咪唑）**：高浓度游离咪唑靠数量优势把 6×His 靶蛋白彻底替换下来。\n- **【手工柱与AKTA过镍柱实操】**：\n  - 手工重力柱适合多构建体并行摸索（推荐 **柱上梯度洗脱**：依次用 40 mM、80 mM、150 mM、300 mM 咪唑各洗 3 CV 分管收集，一眼看出哪个咪唑浓度除杂最干净且不损失靶蛋白）；\n  - AKTA 适合定型工艺放大，用 A 液（20 mM 咪唑）和 B 液（500 mM 咪唑）精确设定 8% B 洗杂、50% B 洗脱。\n- **【日常洗后20%乙醇保养】**：每次纯化结束后当天必须完成的“三步洗柱保养法”（500 mM 咪唑清场 → 5 CV 纯水脱盐 → 5 CV 20% 乙醇封存 4°C），防止残余蛋白腐败长菌或盐结晶撑裂微球。\n- **【EDTA剥镍-NaOH再生-NiSO₄重挂镍】**：当镍柱使用 5 次以上、流速变慢、顶层变黄褐（死蛋白与脂质堆积）或变白（Ni²⁺ 流失）时，用 100 mM EDTA 卸下旧镍 → 0.5 M NaOH 强碱溶解顽固死蛋白与内毒素 → 100 mM NiSO₄ 重新挂满新镍的“满血复活”技术。\n\n---\n\n## **3. Ni-NTA 柱全套标准操作与维护保养手册（实验室必背）**\n\n### **A. 镍柱填料颜色诊断表（一眼看懂柱子健康状态）**\n| 柱床颜色 | 物理化学原因 | 处置措施 |\n|---|---|---|\n| **均匀浅蓝绿色** | Ni²⁺ 饱满且配位正常 | 正常使用 |\n| **变成深蓝色 / 紫蓝色** | 柱内含有高浓度咪唑或 Tris（氮原子与 Ni²⁺ 配位显深蓝） | 属正常现象，用纯水或无咪唑 Buffer 冲洗后即恢复浅蓝绿色 |\n| **变成白色 / 局部发白** | Buffer 中误加了 EDTA/EGTA，或低 pH (< 4.0) 导致 Ni²⁺ 被剥离流失 | 需执行 **100 mM NiSO₄ 重挂镍再生** |\n| **变成黄褐色 / 棕黑色** | ① 裂解液中 DTT > 2 mM 将 Ni²⁺ 还原成黑色金属镍/硫化镍；② 柱头堆积大量变性死蛋白和菌体脂质 | 必须立即执行 **EDTA 剥镍 → 0.5 M NaOH CIP 强碱清洗 → 重新挂镍** |\n\n### **B. 每次用完后的【日常三步清洗与保养 SOP】（耗时 15 分钟，当天必做！）**\n1. **高咪唑清场（Strip Residual Proteins）**：过 **3–5 CV 的 500 mM 咪唑 Buffer（pH 7.5）**，把柱上残留的强结合多聚体蛋白彻底赶下来。\n2. **纯水彻底洗盐（Water Wash）**：过 **5–8 CV 的 0.22 µm 过滤超纯水**，洗净柱内的咪唑和 NaCl（**警告：若不洗掉高盐直接进乙醇，NaCl 和磷酸盐会在乙醇中析出针状晶体，永久堵死柱筛板！**）。\n3. **20% 乙醇封存（Storage）**：过 **5 CV 的 20% 乙醇水溶液**，在填料顶面上方保留 **1–2 cm 高的 20% 乙醇液封**，旋紧上下堵头，垂直放置于 **4°C 冷藏柜** 保存（**严禁冷冻**，结冰会撑碎琼脂糖微球！）。\n\n### **C. 柱效下降或变色时的【深度清洗与重挂镍再生 SOP（Stripping & Recharging）】**\n> **触发条件**：同一根柱累计使用满 **5 次**、柱头出现黄褐色沉积环、流速明显变慢、或被 DTT 还原变黑时执行：\n1. **第一步：EDTA 彻底剥离旧镍（Stripping）**\n   - 先用 **5 CV 超纯水** 冲柱；\n   - 过 **5 CV 的脱镍液（100 mM EDTA, 500 mM NaCl, 20 mM 磷酸钠或 Tris, pH 8.0）**，此时蓝绿色 Ni²⁺ 被 EDTA 抓走流下，**柱床应完全变成纯白色**；\n   - 再用 **5 CV 超纯水** 洗掉残留 EDTA。\n2. **第二步：0.5 M NaOH 在位强碱除垢（CIP，Cleaning-In-Place）**\n   - 过 **5 CV 的 0.5 M NaOH 溶液**（接触时间控制在 **15–30 min**），彻底皂化溶解粘在微球上的死蛋白、脂质、核酸并灭活内毒素；\n   - *注：若柱头仍有疏水脂质污垢，可加洗 3 CV 的 70% 乙醇或 0.5% Triton X-100*；\n   - 立即用 **10 CV 超纯水** 洗至流出液 pH 回到中性（pH 7.0）。\n3. **第三步：100 mM NiSO₄ 重新挂镍（Recharging）**\n   - 过 **3–5 CV 的 100 mM NiSO₄（硫酸镍）水溶液**，白色柱床由上至下重新变为 **鲜艳均匀的浅蓝绿色**；\n   - 用 **5–8 CV 超纯水** 洗去未结合的游离 Ni²⁺；\n   - 用 **5 CV 结合液（Buffer A）** 平衡立即使用，或过 **5 CV 20% 乙醇** 封存回 4°C。",

        "tag": "实验室实战案例",
        "body": "- **阶梯咪唑摸索**：在手工 2 mL Ni-NTA 重力柱上，依次用 20 mM（上样）、40 mM（W1）、60 mM（W2）、100 mM（E1）、250 mM（E2）、500 mM（E3）咪唑各洗 4 CV，跑 SDS-PAGE 发现：60 mM 咪唑能把 70 kDa 和 25 kDa 两条大肠杆菌伴侣杂带洗得干干净净，而 6×His-MBP-Ro52 在 250 mM 咪唑处集中洗脱，单步纯度即达 85%。\n- **防 RING 域失锌**：由于高浓度咪唑（250 mM）在柱上洗脱时会微弱竞争 Ro52 RING 结构域里的 Zn²⁺，我们在洗脱液和承接管中预先补加 **20 µM ZnCl₂**，并在洗脱后 2 小时内进入脱盐/酶切工序，确保 Ro52 天然构象零受损。"

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：全面掌握 **Ni-NTA配位化学原理**、**阶梯咪唑除杂与洗脱**、**手工柱与AKTA过镍柱实操**、**日常洗后20%乙醇保养** 以及 **EDTA剥镍-NaOH再生-NiSO₄重挂镍** 全套理论与动手技能。\n- **核心痛点解决**：彻底解决新手常见的“镍柱变黄变褐/变白”、“杂带洗不掉”、“目标蛋白挂不上柱”以及“柱子用两次就堵死”四大顽疾。\n\n[SVG:ni_nta]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Ni-NTA配位化学原理】**：Ni²⁺ 离子有 6 个配位轨道（八面体构型）。琼脂糖填料上的 **次氮基三乙酸（NTA，Nitrilotriacetic acid）** 像一只四爪卡爪一样牢牢抓着 Ni²⁺ 的 4 个配位键，把 Ni²⁺ 固定在填料上；剩下 **2 个空余配位爪** 伸向溶液，专门等待蛋白上的 **6×His（连续 6 个组氨酸）的咪唑侧链氮原子** 上来配位结合。\n  - *对比 IDA 填料*：老式 IDA 填料只有 3 个爪抓 Ni²⁺，虽然留出 3 个爪抓蛋白，但 Ni²⁺ 极易脱落（镍脱落会诱发蛋白沉淀）；NTA 四爪抓镍极其牢固，是工业与诊断原料的首选。\n- **【阶梯咪唑除杂与洗脱】**：游离咪唑（Imidazole）分子跟组氨酸侧链长得一模一样。\n  - **上样（20 mM 咪唑）**：堵住 Ni²⁺ 对大肠杆菌天然零散组氨酸蛋白的弱结合；\n  - **洗杂（40–60 mM 咪唑）**：把含有 2–3 个相邻组氨酸的宿主高频污染蛋白（如 SlyD 伴侣蛋白）挤下柱子；\n  - **洗脱（250–300 mM 咪唑）**：高浓度游离咪唑靠数量优势把 6×His 靶蛋白彻底替换下来。\n- **【手工柱与AKTA过镍柱实操】**：\n  - 手工重力柱适合多构建体并行摸索（推荐 **柱上梯度洗脱**：依次用 40 mM、80 mM、150 mM、300 mM 咪唑各洗 3 CV 分管收集，一眼看出哪个咪唑浓度除杂最干净且不损失靶蛋白）；\n  - AKTA 适合定型工艺放大，用 A 液（20 mM 咪唑）和 B 液（500 mM 咪唑）精确设定 8% B 洗杂、50% B 洗脱。\n- **【日常洗后20%乙醇保养】**：每次纯化结束后当天必须完成的“三步洗柱保养法”（500 mM 咪唑清场 → 5 CV 纯水脱盐 → 5 CV 20% 乙醇封存 4°C），防止残余蛋白腐败长菌或盐结晶撑裂微球。\n- **【EDTA剥镍-NaOH再生-NiSO₄重挂镍】**：当镍柱使用 5 次以上、流速变慢、顶层变黄褐（死蛋白与脂质堆积）或变白（Ni²⁺ 流失）时，用 100 mM EDTA 卸下旧镍 → 0.5 M NaOH 强碱溶解顽固死蛋白与内毒素 → 100 mM NiSO₄ 重新挂满新镍的“满血复活”技术。\n\n---\n\n## **3. Ni-NTA 柱全套标准操作与维护保养手册（实验室必背）**\n\n### **A. 镍柱填料颜色诊断表（一眼看懂柱子健康状态）**\n| 柱床颜色 | 物理化学原因 | 处置措施 |\n|---|---|---|\n| **均匀浅蓝绿色** | Ni²⁺ 饱满且配位正常 | 正常使用 |\n| **变成深蓝色 / 紫蓝色** | 柱内含有高浓度咪唑或 Tris（氮原子与 Ni²⁺ 配位显深蓝） | 属正常现象，用纯水或无咪唑 Buffer 冲洗后即恢复浅蓝绿色 |\n| **变成白色 / 局部发白** | Buffer 中误加了 EDTA/EGTA，或低 pH (< 4.0) 导致 Ni²⁺ 被剥离流失 | 需执行 **100 mM NiSO₄ 重挂镍再生** |\n| **变成黄褐色 / 棕黑色** | ① 裂解液中 DTT > 2 mM 将 Ni²⁺ 还原成黑色金属镍/硫化镍；② 柱头堆积大量变性死蛋白和菌体脂质 | 必须立即执行 **EDTA 剥镍 → 0.5 M NaOH CIP 强碱清洗 → 重新挂镍** |\n\n### **B. 每次用完后的【日常三步清洗与保养 SOP】（耗时 15 分钟，当天必做！）**\n1. **高咪唑清场（Strip Residual Proteins）**：过 **3–5 CV 的 500 mM 咪唑 Buffer（pH 7.5）**，把柱上残留的强结合多聚体蛋白彻底赶下来。\n2. **纯水彻底洗盐（Water Wash）**：过 **5–8 CV 的 0.22 µm 过滤超纯水**，洗净柱内的咪唑和 NaCl（**警告：若不洗掉高盐直接进乙醇，NaCl 和磷酸盐会在乙醇中析出针状晶体，永久堵死柱筛板！**）。\n3. **20% 乙醇封存（Storage）**：过 **5 CV 的 20% 乙醇水溶液**，在填料顶面上方保留 **1–2 cm 高的 20% 乙醇液封**，旋紧上下堵头，垂直放置于 **4°C 冷藏柜** 保存（**严禁冷冻**，结冰会撑碎琼脂糖微球！）。\n\n### **C. 柱效下降或变色时的【深度清洗与重挂镍再生 SOP（Stripping & Recharging）】**\n> **触发条件**：同一根柱累计使用满 **5 次**、柱头出现黄褐色沉积环、流速明显变慢、或被 DTT 还原变黑时执行：\n1. **第一步：EDTA 彻底剥离旧镍（Stripping）**\n   - 先用 **5 CV 超纯水** 冲柱；\n   - 过 **5 CV 的脱镍液（100 mM EDTA, 500 mM NaCl, 20 mM 磷酸钠或 Tris, pH 8.0）**，此时蓝绿色 Ni²⁺ 被 EDTA 抓走流下，**柱床应完全变成纯白色**；\n   - 再用 **5 CV 超纯水** 洗掉残留 EDTA。\n2. **第二步：0.5 M NaOH 在位强碱除垢（CIP，Cleaning-In-Place）**\n   - 过 **5 CV 的 0.5 M NaOH 溶液**（接触时间控制在 **15–30 min**），彻底皂化溶解粘在微球上的死蛋白、脂质、核酸并灭活内毒素；\n   - *注：若柱头仍有疏水脂质污垢，可加洗 3 CV 的 70% 乙醇或 0.5% Triton X-100*；\n   - 立即用 **10 CV 超纯水** 洗至流出液 pH 回到中性（pH 7.0）。\n3. **第三步：100 mM NiSO₄ 重新挂镍（Recharging）**\n   - 过 **3–5 CV 的 100 mM NiSO₄（硫酸镍）水溶液**，白色柱床由上至下重新变为 **鲜艳均匀的浅蓝绿色**；\n   - 用 **5–8 CV 超纯水** 洗去未结合的游离 Ni²⁺；\n   - 用 **5 CV 结合液（Buffer A）** 平衡立即使用，或过 **5 CV 20% 乙醇** 封存回 4°C。",

        "title": "项目实战案例：Ro52 镍柱“阶梯咪唑摸索”与防锌被夺策略",
        "tag": "实验室实战案例",
        "body": "- **阶梯咪唑摸索**：在手工 2 mL Ni-NTA 重力柱上，依次用 20 mM（上样）、40 mM（W1）、60 mM（W2）、100 mM（E1）、250 mM（E2）、500 mM（E3）咪唑各洗 4 CV，跑 SDS-PAGE 发现：60 mM 咪唑能把 70 kDa 和 25 kDa 两条大肠杆菌伴侣杂带洗得干干净净，而 6×His-MBP-Ro52 在 250 mM 咪唑处集中洗脱，单步纯度即达 85%。\n- **防 RING 域失锌**：由于高浓度咪唑（250 mM）在柱上洗脱时会微弱竞争 Ro52 RING 结构域里的 Zn²⁺，我们在洗脱液和承接管中预先补加 **20 µM ZnCl₂**，并在洗脱后 2 小时内进入脱盐/酶切工序，确保 Ro52 天然构象零受损。"

    "title": "六配位捕获原理与柱床颜色健康诊断表 (蓝绿/发白/黄褐/深蓝)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Ni-NTA八面体六配位捕获原理（NTA四爪固镍+双空位抓6×His）**，并学会通过 **柱床颜色四态诊断表（浅蓝绿/深蓝/发白/黄褐）** 一眼看穿镍柱的健康状况。\n\n[SVG:ni_nta]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Ni-NTA八面体六配位捕获原理】**：\n  - Ni²⁺ 具有 6 个配位轨道；琼脂糖微球上的 **NTA（次氮基三乙酸）** 提供 1 个氮原子和 3 个羧基氧原子（共 **4 个配位爪**），像铁钳一样把 Ni²⁺ 牢牢锁在填料上（极难脱落）；\n  - 剩下的 **2 个空余配位轨道** 朝向水相，专门与重组蛋白末端 **6×His 标签中相邻组氨酸咪唑环上的非质子化氮原子** 形成配位键（必须在 **pH 7.4–8.0** 下组氨酸咪唑环才去质子化具备孤对电子；若 pH < 6.0，组氨酸被 H⁺ 质子化，蛋白会自动从镍柱上掉下来！）。\n- **【柱床颜色四态诊断表】**：\n  1. **`均匀浅蓝绿色（翠绿）`**：Ni²⁺ 饱满且处于正常水合配位态，随时可用；\n  2. **`深蓝色 / 紫蓝色`**：柱内充满了高浓度咪唑（250–500 mM）或高浓度 Tris，氮原子配位使 Ni²⁺ 吸收光谱蓝移——**属完全正常现象**，用纯水或低咪唑 Buffer 冲洗后即变回浅蓝绿色；\n  3. **`发白 / 局部变白`**：裂解液或 Buffer 中误加了 **EDTA/EGTA**，或接触了强酸，导致 Ni²⁺ 被彻底剥离冲走——**必须执行 100 mM NiSO₄ 重挂镍再生**；\n  4. **`黄褐色 / 棕黑色（Brown Column）`**：① 破壁液中 **DTT > 2–5 mM** 将 Ni²⁺ 还原成了黑色的金属镍/硫化镍；② 柱头沉积了大量变性死蛋白、脂质与色素——**必须立即执行 EDTA 剥镍 → 0.5 M NaOH 强碱除垢 → NiSO₄ 重挂镍**！",

    "title": "Ni柱专属Buffer体系: 结合/洗杂/洗脱阶梯咪唑调pH与TCEP/Zn2+配伍",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Ni-NTA镍柱专属三步Buffer配方（Binding / Wash / Elution）**，严控 **阶梯咪唑浓度（20 / 50 / 250 mM）**、**500mM高盐防非特异吸附**、**咪唑母液调pH 7.5** 以及 **TCEP/Zn²⁺兼容性边界**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Ni-NTA镍柱专属三步Buffer配方】**（以含 Zn²⁺ 指环蛋白 Ro52 为例）：\n  - **`Binding Buffer A（结合/平衡液）`**：`25 mM HEPES (或 Tris-HCl) pH 7.5, 500 mM NaCl, 20 mM 咪唑, 5% 甘油, 0.5 mM TCEP, 20 µM ZnCl₂`；\n  - **`Wash Buffer W（洗杂液）`**：`25 mM HEPES pH 7.5, 500 mM NaCl, 40–60 mM 咪唑, 5% 甘油, 0.5 mM TCEP, 20 µM ZnCl₂`（专门洗脱大肠杆菌天然富组氨酸伴侣杂蛋白 SlyD/ArnA）；\n  - **`Elution Buffer B（洗脱液）`**：`25 mM HEPES pH 7.5, 300 mM NaCl, 250–300 mM 咪唑, 5% 甘油, 0.5 mM TCEP, 20 µM ZnCl₂`；\n  - **`Strip Buffer（洗柱清场液）`**：同上，咪唑浓度提升至 **500 mM（pH 7.5）**。\n- **【咪唑母液调pH 7.5铁律】**：建议预先配制一瓶 **2.0 M 咪唑母液（已用浓盐酸调至 pH 7.50，0.22 µm 过滤避光保存）**，配制不同阶梯浓度 Buffer 时直接按比例稀释，省时且绝对不会忘调 pH！\n- **【TCEP/Zn²⁺兼容性边界】**：\n  - 还原剂首选 **0.5 mM TCEP**（严禁 DTT > 2 mM）；\n  - 螯合剂 **EDTA / EGTA 容忍度为 0 mM**；\n  - 对含 Zn²⁺ 的 RING 域蛋白，洗脱液中补加 **20 µM ZnCl₂** 可抵消 250 mM 咪唑对锌指的微弱夺锌效应，并在洗脱后 2 h 内进入透析或分子筛除咪唑。",

  "learn::基础知识学习/④ 下游层析纯化与填料再生维护 (Downstream & Gate R5)/亲和层析捕获与填料再生维护 (五级深度拆解)/Ni-NTA 镍柱亲和层析 (含图解)/Ni柱专属Buffer体系: 结合/洗杂/洗脱阶梯咪唑调pH与TCEP/Zn2+配伍": {
    "key": "learn.4.0.0.1",
    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 亲和层析捕获与填料再生维护 (五级深度拆解) / Ni-NTA 镍柱亲和层析 (含图解) / Ni柱专属Buffer体系: 结合/洗杂/洗脱阶梯咪唑调pH与TCEP/Zn2+配伍",
    "title": "Ni柱专属Buffer体系: 结合/洗杂/洗脱阶梯咪唑调pH与TCEP/Zn2+配伍",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Ni-NTA镍柱专属三步Buffer配方（Binding / Wash / Elution）**，严控 **阶梯咪唑浓度（20 / 50 / 250 mM）**、**500mM高盐防非特异吸附**、**咪唑母液调pH 7.5** 以及 **TCEP/Zn²⁺兼容性边界**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Ni-NTA镍柱专属三步Buffer配方】**（以含 Zn²⁺ 指环蛋白 Ro52 为例）：\n  - **`Binding Buffer A（结合/平衡液）`**：`25 mM HEPES (或 Tris-HCl) pH 7.5, 500 mM NaCl, 20 mM 咪唑, 5% 甘油, 0.5 mM TCEP, 20 µM ZnCl₂`；\n  - **`Wash Buffer W（洗杂液）`**：`25 mM HEPES pH 7.5, 500 mM NaCl, 40–60 mM 咪唑, 5% 甘油, 0.5 mM TCEP, 20 µM ZnCl₂`（专门洗脱大肠杆菌天然富组氨酸伴侣杂蛋白 SlyD/ArnA）；\n  - **`Elution Buffer B（洗脱液）`**：`25 mM HEPES pH 7.5, 300 mM NaCl, 250–300 mM 咪唑, 5% 甘油, 0.5 mM TCEP, 20 µM ZnCl₂`；\n  - **`Strip Buffer（洗柱清场液）`**：同上，咪唑浓度提升至 **500 mM（pH 7.5）**。\n- **【咪唑母液调pH 7.5铁律】**：建议预先配制一瓶 **2.0 M 咪唑母液（已用浓盐酸调至 pH 7.50，0.22 µm 过滤避光保存）**，配制不同阶梯浓度 Buffer 时直接按比例稀释，省时且绝对不会忘调 pH！\n- **【TCEP/Zn²⁺兼容性边界】**：\n  - 还原剂首选 **0.5 mM TCEP**（严禁 DTT > 2 mM）；\n  - 螯合剂 **EDTA / EGTA 容忍度为 0 mM**；\n  - 对含 Zn²⁺ 的 RING 域蛋白，洗脱液中补加 **20 µM ZnCl₂** 可抵消 250 mM 咪唑对锌指的微弱夺锌效应，并在洗脱后 2 h 内进入透析或分子筛除咪唑。",
    "cases": [
      {
        "title": "项目实战案例：建立“2 M 咪唑 (pH 7.50) 受控母液”制度",
        "tag": "实验室实战案例",
        "body": "- 自从实验室统一配制并质检 `2.0 M Imidazole Stock (pH 7.50 ± 0.05)` 受控母液后，配制 20 / 50 / 250 / 500 mM 咪唑工作液只需按 1:100 / 1:40 / 1:8 / 1:4 稀释，pH 永远精准稳定在 7.5，再未发生过洗脱碱沉淀。"
      }

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 亲和层析捕获与填料再生维护 (五级深度拆解) / Ni-NTA 镍柱亲和层析 (含图解) / 手工重力柱/蠕动泵 vs. 全自动AKTA过镍柱实操与分管追踪",
    "title": "手工重力柱/蠕动泵 vs. 全自动AKTA过镍柱实操与分管追踪",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握在实验室主力设备上过 Ni-NTA 柱的两种标准实操模式——**手工柱（重力柱/蠕动泵）柱上阶梯咪唑摸索与Bradford分管收集** vs. **全自动AKTA纯化仪双泵百分比阶梯洗脱**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【手工柱（重力柱/蠕动泵）过镍柱 5 步标准动作】**：\n  1. **去乙醇与平衡**：新装或从 4°C 取出的镍柱，先过 **5 CV 超纯水** 洗掉 20% 乙醇，再过 **5–8 CV Binding Buffer A（20 mM 咪唑）** 平衡；\n  2. **慢速上样（或 4°C 旋转孵育结合）**：将高速离心并过 0.45/0.22 µm 膜的裂解上清以 **1 mL/min** 慢速过柱（或与填料在 4°C 翻转混匀孵育 30 min 后流下），**必须接住流穿液（FT）留样跑电泳**；\n  3. **充分洗杂（Wash）**：过 **10–15 CV Wash Buffer（40–60 mM 咪唑）**，用 **96 孔板 Bradford 染液点滴监测**，直至流出液完全不变蓝（棕红色）；\n  4. **新靶点摸索期“四阶梯咪唑洗脱法”**：首轮摸索新蛋白时，依次用 **80 mM、150 mM、250 mM、500 mM 咪唑各洗 3 CV** 分管收集跑 SDS-PAGE，一眼锁定最佳除杂上限与洗脱下限；\n  5. **定型工艺分管切峰**：直接用 **250 mM 咪唑洗脱液** 按 **每管 0.5–1.0 CV** 分管收集（E1–E6），用 Bradford 点滴挑出深蓝色的核心管（通常 E2–E4）合并！\n- **【全自动AKTA纯化仪双泵百分比阶梯洗脱】**：\n  - `A 泵` 接 20 mM 咪唑（Buffer A），`B 泵` 接 500 mM 咪唑（Buffer B）；\n  - 上样流穿后，设定 **6%–8% B（对应 ~50–60 mM 咪唑）** 洗杂至 UV₂₈₀ 完全回到基线；\n  - 一步阶跃（Step Gradient）至 **50% B（对应 260 mM 咪唑）**，使目标蛋白集中成一根高浓尖峰洗脱并由收集器自动切峰收集；最后走 **100% B（500 mM 咪唑）** 3 CV 清场。",
    "cases": [
      {
        "title": "项目实战案例：流穿液（FT）留样习惯救回一整批因 pH 偏酸未挂柱的蛋白",
        "tag": "实验室实战案例",
        "body": "- 某次操作员上样 50 mL 裂解液后洗脱没拿到蛋白，因为严格遵守了 **“流穿液（FT）未跑完电泳确认前绝不准倒进废液桶”** 的规定，检查发现裂解液 pH 仅 6.3 导致蛋白全在 FT 桶里。将 FT 调回 pH 7.6 重新过柱后，95% 蛋白失而复得！"
      }

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 亲和层析捕获与填料再生维护 (五级深度拆解) / Ni-NTA 镍柱亲和层析 (含图解) / 日常三步洗柱(20%乙醇保养)与EDTA剥镍-NaOH除垢-NiSO4重挂镍再生SOP",
    "title": "日常三步洗柱(20%乙醇保养)与EDTA剥镍-NaOH除垢-NiSO4重挂镍再生SOP",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：严格执行 Ni-NTA 柱的 **每次用完日常三步洗柱与20%乙醇保养 SOP**，以及每 5 次（或变色/流速变慢时）的 **100mM EDTA剥镍 → 0.5M NaOH在位强碱除垢（CIP） → 100mM NiSO₄重挂镍再生 SOP**。\n- **为什么洗完柱子绝对不能直接塞回冰箱**：用完的柱子里满是 250 mM 咪唑、500 mM NaCl 和微量残余死蛋白——直接放回 4°C 既会滋生霉菌毁掉填料，又会让死蛋白在柱头上老化交联成永远洗不掉的硬壳。\n\n[SVG:ni_nta]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【每次用完日常三步洗柱与20%乙醇保养 SOP】（耗时 15 min，当天必做！）**：\n  1. **`Step 1 高咪唑清场`**：过 **3–5 CV 的 500 mM 咪唑 Buffer (pH 7.5)**，把柱上死抱不放的微量多聚体彻底赶下来；\n  2. **`Step 2 超纯水彻底洗盐`**：过 **5–8 CV 脱气超纯水**，把柱内的 NaCl 和咪唑彻底冲净（**红线：若不先用纯水冲掉高盐就直接通入 20% 乙醇，盐类在乙醇中溶解度骤降，会瞬间在筛板微孔内析出盐晶，把柱子永久堵死！**）；\n  3. **`Step 3 20%乙醇封存4°C`**：过 **5 CV 20% (v/v) 乙醇水溶液**，在填料顶面上方保留 **1–2 cm 液封**，旋紧底帽与顶盖，贴上更新后的使用次数标签，垂直存放于 **4°C 冷柜（严禁 −20°C 冷冻！）**。\n- **【100mM EDTA剥镍 → 0.5M NaOH在位强碱除垢（CIP） → 100mM NiSO₄重挂镍再生 SOP】**：\n  - **何时启动**：专柱专用累计满 **5 次**、柱头出现黄褐色污垢环、被 DTT 还原变黑、变白、或重力滴速变慢时：\n  1. **`第一步：EDTA 彻底剥离旧镍（Stripping）`**\n     - 过 **5 CV 超纯水** → 过 **5 CV 脱镍液（100 mM EDTA, 500 mM NaCl, 20 mM 磷酸钠或 Tris, pH 8.0）**，看着蓝绿色 Ni²⁺ 被全部抓走流下，**柱床完全变为纯白色** → 再过 **5 CV 超纯水** 洗净 EDTA；\n  2. **`第二步：0.5 M NaOH 强碱除死蛋白与内毒素（CIP）`**\n     - 过 **5 CV 0.5 M NaOH 溶液**（让强碱在柱内停留接触 **15–30 min**），彻底皂化溶解死蛋白、菌体脂质、核酸并杀灭内毒素（若脂质严重可加洗 3 CV 70% 乙醇）→ 立即过 **10 CV 超纯水** 洗至流出液 pH 回到 7.0 中性；\n  3. **`第三步：100 mM NiSO₄ 重新挂满新镍（Recharging）`**\n     - 过 **3–5 CV 100 mM NiSO₄（硫酸镍）水溶液**，纯白柱床由上至下重新变为 **鲜艳均匀的翠蓝绿色** → 过 **5–8 CV 超纯水** 洗去游离 Ni²⁺ → 过 **5 CV 20% 乙醇** 封存回 4°C（柱效 100% 满血复活！）。",
    "cases": [
      {
        "title": "项目实战案例：一根 5 mL 镍柱通过标准剥镍再生循环稳定服役 30 批次",

        "body": "- 严格执行“每次用完三步进 20% 乙醇 + 每 5 次执行 1 次 EDTA/NaOH/NiSO₄ 深度再生”后，单根专柱连续服役 30 批次，流速与蛋白结合载量（> 30 mg/mL）始终如新，填料耗材成本下降 75%。"

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：严格执行 Ni-NTA 柱的 **每次用完日常三步洗柱与20%乙醇保养 SOP**，以及每 5 次（或变色/流速变慢时）的 **100mM EDTA剥镍 → 0.5M NaOH在位强碱除垢（CIP） → 100mM NiSO₄重挂镍再生 SOP**。\n- **为什么洗完柱子绝对不能直接塞回冰箱**：用完的柱子里满是 250 mM 咪唑、500 mM NaCl 和微量残余死蛋白——直接放回 4°C 既会滋生霉菌毁掉填料，又会让死蛋白在柱头上老化交联成永远洗不掉的硬壳。\n\n[SVG:ni_nta]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【每次用完日常三步洗柱与20%乙醇保养 SOP】（耗时 15 min，当天必做！）**：\n  1. **`Step 1 高咪唑清场`**：过 **3–5 CV 的 500 mM 咪唑 Buffer (pH 7.5)**，把柱上死抱不放的微量多聚体彻底赶下来；\n  2. **`Step 2 超纯水彻底洗盐`**：过 **5–8 CV 脱气超纯水**，把柱内的 NaCl 和咪唑彻底冲净（**红线：若不先用纯水冲掉高盐就直接通入 20% 乙醇，盐类在乙醇中溶解度骤降，会瞬间在筛板微孔内析出盐晶，把柱子永久堵死！**）；\n  3. **`Step 3 20%乙醇封存4°C`**：过 **5 CV 20% (v/v) 乙醇水溶液**，在填料顶面上方保留 **1–2 cm 液封**，旋紧底帽与顶盖，贴上更新后的使用次数标签，垂直存放于 **4°C 冷柜（严禁 −20°C 冷冻！）**。\n- **【100mM EDTA剥镍 → 0.5M NaOH在位强碱除垢（CIP） → 100mM NiSO₄重挂镍再生 SOP】**：\n  - **何时启动**：专柱专用累计满 **5 次**、柱头出现黄褐色污垢环、被 DTT 还原变黑、变白、或重力滴速变慢时：\n  1. **`第一步：EDTA 彻底剥离旧镍（Stripping）`**\n     - 过 **5 CV 超纯水** → 过 **5 CV 脱镍液（100 mM EDTA, 500 mM NaCl, 20 mM 磷酸钠或 Tris, pH 8.0）**，看着蓝绿色 Ni²⁺ 被全部抓走流下，**柱床完全变为纯白色** → 再过 **5 CV 超纯水** 洗净 EDTA；\n  2. **`第二步：0.5 M NaOH 强碱除死蛋白与内毒素（CIP）`**\n     - 过 **5 CV 0.5 M NaOH 溶液**（让强碱在柱内停留接触 **15–30 min**），彻底皂化溶解死蛋白、菌体脂质、核酸并杀灭内毒素（若脂质严重可加洗 3 CV 70% 乙醇）→ 立即过 **10 CV 超纯水** 洗至流出液 pH 回到 7.0 中性；\n  3. **`第三步：100 mM NiSO₄ 重新挂满新镍（Recharging）`**\n     - 过 **3–5 CV 100 mM NiSO₄（硫酸镍）水溶液**，纯白柱床由上至下重新变为 **鲜艳均匀的翠蓝绿色** → 过 **5–8 CV 超纯水** 洗去游离 Ni²⁺ → 过 **5 CV 20% 乙醇** 封存回 4°C（柱效 100% 满血复活！）。",

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 亲和层析捕获与填料再生维护 (五级深度拆解) / Amylose 直链淀粉柱层析 (MBP标签专用)",
    "title": "Amylose 直链淀粉柱层析 (MBP标签专用)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Amylose直链淀粉树脂** 与 MBP（麦芽糖结合蛋白）标签的特异结合原理、**10mM麦芽糖温和竞争洗脱**、抑制宿主淀粉酶降解以及 **SDS/纯水清洗与20%乙醇保养 SOP**。\n- **为什么它是金属蛋白的“温柔港湾”**：不同于 Ni-NTA 柱需要使用高浓度咪唑且存在二价金属离子交换干扰，Amylose 柱全程在近生理条件（pH 7.4, 200 mM NaCl）下运行，用 **10 mM 麦芽糖（Maltose）** 即可把 MBP 融合蛋白温和洗脱下来，对 Ro52 等含 Zn²⁺ 靶蛋白零损伤。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Amylose直链淀粉树脂】**：将直链淀粉（α-1,4-葡萄糖多聚物）共价偶联在琼脂糖微球上制成的亲和填料，专门识别 MBP 标签表面的麦芽糖结合口袋（载量约 3–6 mg MBP 融合蛋白 / mL 填料）。\n- **【10mM麦芽糖温和竞争洗脱】**：游离麦芽糖（二糖）对 MBP 口袋的亲和力高于直链淀粉多糖链；加入 10 mM 麦芽糖即可把 MBP-靶蛋白温和替换下来，洗脱条件极其温和，几乎没有杂蛋白共洗脱。\n- **【宿主淀粉酶与葡萄糖禁忌】**：\n  - 发酵培养基中 **严禁添加 > 0.2% 葡萄糖**（游离葡萄糖及大肠杆菌分泌的淀粉酶会占满 MBP 口袋或啃食柱上的直链淀粉配基，导致不挂柱）；\n  - 破壁液中严禁加入 α-淀粉酶。\n- **【SDS/纯水清洗与20%乙醇保养】**：Amylose 柱上的配基是天然多糖，**严禁使用 0.5 M NaOH 强碱长时间浸泡**（强碱会水解破坏直链淀粉糖苷键！）；标准再生是用 **3 CV 的 0.1% SDS** 洗脱顽固疏水杂蛋白 → 大量纯水洗净 SDS → 20% 乙醇 4°C 封存（一般可重复使用 3–5 次）。\n\n---\n\n## **3. Amylose 直链淀粉柱标准操作与保养 SOP**\n1. **标准 Buffer 配方**：\n   - `Column Buffer（平衡/洗杂液）`：20 mM HEPES (或 Tris-HCl) pH 7.4, **200 mM NaCl**, 0.5 mM TCEP, 20 µM ZnCl₂（*注：若非金属蛋白可加 1 mM EDTA，但 Ro52 等含锌蛋白严禁加 EDTA*）。\n   - `Elution Buffer（洗脱液）`：Column Buffer + **10 mM Maltose（麦芽糖）**。\n2. **过柱流速红线**：MBP 与直链淀粉的结合动力学较慢（慢结合、慢解离），**上样流速必须放慢至 0.5–1 mL/min**（或 4°C 柱上孵育 30 min），否则流穿损失会超过 30%。\n3. **洗后再生与保养（每次用完必做）**：\n   - 过 **3 CV 超纯水** → 过 **3 CV 0.1% SDS 水溶液**（剥离粘附的变性杂蛋白，注意低温下 SDS 易析出，此步在室温 20–25°C 操作）→ 过 **10 CV 超纯水**（洗至流出液摇晃完全不起泡沫）→ 过 **5 CV 20% 乙醇** 封存回 4°C。\n   - **重要提示**：若需把洗脱下来的 MBP 蛋白再次挂回 Amylose 柱，必须先通过透析、超滤或离子交换柱彻底除掉溶液里的 10 mM 麦芽糖，否则已吃饱麦芽糖的 MBP 绝对挂不上柱！",
    "cases": [
      {
        "title": "项目实战案例：6×His-MBP-Ro52 双标签正交亲和纯化",
        "tag": "实验室实战案例",
        "body": "- 利用 N 端 `6×His-MBP` 串联标签：头道先过 Ni-NTA 柱（高载量快速捕获 2 L 菌液），洗脱液直接慢速过 Amylose 柱（无需透析除咪唑！因为咪唑不影响 MBP 与直链淀粉结合），10 mM 麦芽糖洗脱后不仅纯度直接跃升至 95% 以上，而且顺带把 250 mM 咪唑彻底替换成了温和的 10 mM 麦芽糖缓冲液。"
      }

    "title": "多糖配基识别原理、专属无糖Buffer与10mM麦芽糖慢流速温和洗脱",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Amylose直链淀粉柱（MBP标签专用）** 的多糖结合口袋原理、**专属无葡萄糖/无淀粉酶Buffer**、**0.5–1 mL/min慢流速结合铁律** 与 **10 mM麦芽糖温和竞争洗脱**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Amylose直链淀粉柱多糖结合口袋原理】**：琼脂糖微球上共价挂着直链淀粉（α-1,4-葡萄糖链），专门塞进 42 kDa 的 MBP（麦芽糖结合蛋白）标签深处的结合口袋。\n- **【专属无葡萄糖/无淀粉酶Buffer】**：\n  - `Column Buffer（平衡/洗杂）`：`20 mM HEPES (或 Tris-HCl) pH 7.4, 200 mM NaCl, 0.5 mM TCEP, 5% 甘油`（若靶蛋白为含 Zn²⁺ 的 Ro52，补加 `20 µM ZnCl₂` 且 **严禁按通用说明书加 1 mM EDTA**！）；\n  - `Elution Buffer（洗脱液）`：`Column Buffer + 10 mM Maltose（麦芽糖）`；\n  - **无糖红线**：上游发酵培养基和破壁液中 **严禁添加葡萄糖（>0.2%）或淀粉酶**，否则游离糖会占满 MBP 口袋或淀粉酶会把柱上的直链淀粉配基全部啃光！\n- **【0.5–1 mL/min慢流速结合铁律】**：MBP 与直链淀粉的结合动力学常数（k_on）比 Ni-His 配位慢得多！上样时如果流速过快（> 2 mL/min），蛋白还没来得及张开口袋咬住直链淀粉就流穿走了——**必须控制上样流速 ≤ 0.5–1.0 mL/min（或将填料与上清在 4°C 旋转孵育 30–45 min 后再装柱洗杂）**。",

    "title": "多糖配基识别原理、专属无糖Buffer与10mM麦芽糖慢流速温和洗脱",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Amylose直链淀粉柱（MBP标签专用）** 的多糖结合口袋原理、**专属无葡萄糖/无淀粉酶Buffer**、**0.5–1 mL/min慢流速结合铁律** 与 **10 mM麦芽糖温和竞争洗脱**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Amylose直链淀粉柱多糖结合口袋原理】**：琼脂糖微球上共价挂着直链淀粉（α-1,4-葡萄糖链），专门塞进 42 kDa 的 MBP（麦芽糖结合蛋白）标签深处的结合口袋。\n- **【专属无葡萄糖/无淀粉酶Buffer】**：\n  - `Column Buffer（平衡/洗杂）`：`20 mM HEPES (或 Tris-HCl) pH 7.4, 200 mM NaCl, 0.5 mM TCEP, 5% 甘油`（若靶蛋白为含 Zn²⁺ 的 Ro52，补加 `20 µM ZnCl₂` 且 **严禁按通用说明书加 1 mM EDTA**！）；\n  - `Elution Buffer（洗脱液）`：`Column Buffer + 10 mM Maltose（麦芽糖）`；\n  - **无糖红线**：上游发酵培养基和破壁液中 **严禁添加葡萄糖（>0.2%）或淀粉酶**，否则游离糖会占满 MBP 口袋或淀粉酶会把柱上的直链淀粉配基全部啃光！\n- **【0.5–1 mL/min慢流速结合铁律】**：MBP 与直链淀粉的结合动力学常数（k_on）比 Ni-His 配位慢得多！上样时如果流速过快（> 2 mL/min），蛋白还没来得及张开口袋咬住直链淀粉就流穿走了——**必须控制上样流速 ≤ 0.5–1.0 mL/min（或将填料与上清在 4°C 旋转孵育 30–45 min 后再装柱洗杂）**。",
    "cases": [
      {
        "title": "项目实战案例：Ni-NTA 洗脱液免透析直接串联上 Amylose 柱的双标签正交纯化",
        "tag": "实验室实战案例",
        "body": "- `6×His-MBP-Ro52` 从 Ni-NTA 柱上被 250 mM 咪唑洗脱下来后，无需透析除咪唑（因为咪唑完全不干扰 MBP 与直链淀粉结合），直接以 0.8 mL/min 慢速上 Amylose 柱：10 mM 麦芽糖洗脱不仅一步将纯度从 82% 提至 96%，还顺带把 250 mM 刺头咪唑彻底替换成了极其温和的麦芽糖缓冲液！"
      }
    ],

        "tag": "实验室实战案例",
        "body": "- 某次人员在 4°C 层析冷柜内直接将冰冷的 0.1% SDS 打进 Amylose 柱，结果 SDS 在低温下瞬间析出白色十二烷基硫酸钠结晶堵住柱头。移至 25°C 室温用温纯水（28°C）慢速冲洗 10 CV 才化开结晶。此后在 SOP 中用红字标明：**“Amylose 柱 0.1% SDS 再生必须在 20–25°C 室温下进行”**。"
      }

    "key": "learn.4.0.2",
    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 亲和层析捕获与填料再生维护 (五级深度拆解) / Protein A/G 抗体亲和柱层析",
    "title": "Protein A/G 抗体亲和柱层析",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Protein A与Protein G种属亚型亲和谱**、**pH 2.7–3.0甘氨酸低pH洗脱与1M Tris即时中和** 以及 **耐碱Protein A柱的NaOH清洗保养**，用于实验室阳性对照单抗、质控人源嵌合抗体及 Fc 融合抗原的纯化。\n- **核心风险提示**：低 pH 洗脱液如果不立刻中和，抗体会在酸性环境下发生不可逆的 Fc 构象变性聚集；此外，评估 Ro52 抗原时必须高度警惕 **Ro52 自身就能像 Protein A 一样结合 IgG Fc 段**！\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Protein A与Protein G种属亚型亲和谱】**：\n  - `Protein A`（金黄色葡萄球菌表面蛋白 A）：对 **人 IgG1/IgG2/IgG4** 和 **兔 IgG** 亲和力极强，但对 **小鼠 IgG1** 和 **人 IgG3** 结合较弱；\n  - `Protein G`（链球菌表面蛋白 G）：对几乎所有哺乳动物 IgG 亚型（尤其是 **小鼠 IgG1**、大鼠 IgG、山羊 IgG）都有强结合力（工程化 Protein G 已切除白蛋白结合域）。\n- **【pH 2.7–3.0甘氨酸低pH洗脱与1M Tris即时中和】**：抗体与 Protein A/G 结合极其牢固，需用 **0.1 M Glycine-HCl (pH 2.7–3.0)** 或 **0.1 M 柠檬酸钠 (pH 3.0–3.5)** 质子化打断氢键洗脱；**必须在收集管底部预先加入 1/10 体积的 1 M Tris-HCl (pH 9.0)**，让滴下来的酸洗脱液在 1 秒内瞬间恢复至 pH 7.4！\n- **【耐碱Protein A柱的NaOH清洗保养】**：\n  - 传统天然 Protein A/G 配基不耐强碱，需用 **6 M 盐酸胍** 或 **0.1 M 柠檬酸 (pH 2.0)** 再生；\n  - 现代工程化耐碱填料（如 MabSelect SuRe）可用 **0.1–0.5 M NaOH 接触 15 min** 进行 CIP 清洗，洗后用纯水冲至中性，再封存于 **20% 乙醇**（4°C）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **抗体纯化必查**：收集管预加中和液记录、中和后实测 pH（7.2–7.6）以及 SEC-HPLC 聚体比例（低 pH 暴露过久会导致聚体 > 10%）。",
    "cases": [
      {
        "title": "项目实战案例：纯化人源抗 Ro52 阳性校准品单抗",
        "tag": "实验室实战案例",
        "body": "- 采用 1 mL HiTrap MabSelect SuRe 预装柱纯化重组人源抗 Ro52 IgG1 质控抗体：每支 1 mL 收集管预先加入 **100 µL 1 M Tris-HCl (pH 9.0)**，用 0.1 M 柠檬酸钠 (pH 3.2) 洗脱，滴落即刻摇匀中和，最终抗体单体纯度达 98.6%，效价零损失。"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Protein A与Protein G种属亚型结合谱**，以及抗体亲和层析最核心的保活操作——**pH 2.7–3.0甘氨酸/柠檬酸低pH洗脱 + 收集管预加1/10体积1M Tris(pH 9.0)滴落即时中和**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Protein A与Protein G种属亚型结合谱】**：\n  - `Protein A`：对 **人 IgG1/IgG2/IgG4**、**兔多抗/单抗**、豚鼠 IgG 亲和力极高，但对 **小鼠 IgG1（实验室最常见的杂交瘤单抗亚型！）** 结合力较弱（小鼠 IgG1 挂 Protein A 需高盐 pH 8.5 才勉强挂住）；\n  - `Protein G`：对 **小鼠 IgG1/2a/2b**、大鼠 IgG、山羊/绵羊 IgG 以及所有人 IgG1–4 均有强结合力。\n- **【pH 2.7–3.0低pH洗脱 + 收集管预加1M Tris(pH 9.0)即时中和】**：\n  - `Binding Buffer`：`20 mM 磷酸钠 (PBS) pH 7.2–7.4, 150 mM NaCl`；\n  - `Elution Buffer`：`0.1 M Glycine-HCl (甘氨酸-盐酸, pH 2.7–3.0)` 或 `0.1 M 柠檬酸钠 (pH 3.0–3.2)`；\n  - **即时中和铁律**：千万不能等整管抗体全洗脱完再去慢悠悠调 pH！抗体在 pH 2.7 的强酸里多泡 10 分钟，Fc 段就会部分去折叠，表面疏水性大增并在后续偶联时自聚成沉淀。**必须在接洗脱液前，预先在每支 1 mL 收集管底部加入 80–100 µL 的 `1.0 M Tris-HCl (pH 9.0)`**，让每一滴酸洗脱液掉进管子的第 1 秒就被中和回 pH 7.4！",
    "cases": [
      {
        "title": "项目实战案例：小鼠 IgG1 质控单抗从 Protein A 换用 Protein G 预装柱挽回 60% 流穿损失",
        "tag": "实验室实战案例",
        "body": "- 纯化一株小鼠 IgG1 亚型抗 Ro52 阳性对照单抗时，用普通 PBS (pH 7.2) 上 Protein A 柱有 60% 抗体在流穿液里跑掉；切换为 **HiTrap Protein G HP 柱** 后，结合率达 99%，收集管预加 Tris 即时中和后效价零损耗。"
      }

    "title": "耐碱Protein A柱的0.1–0.5M NaOH在位清洗(CIP)与20%乙醇保养",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：区分 **传统天然Protein A/G填料（pH 2.0/盐酸胍再生）** 与 **现代耐碱工程化Protein A填料（MabSelect SuRe: 0.1–0.5M NaOH CIP再生）** 的维护边界，落实 **20%乙醇封存保养 SOP**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【传统天然Protein A/G vs. 耐碱工程化Protein A（MabSelect SuRe）】**：\n  - 传统天然重组 Protein A 和所有 Protein G 配基含有对碱敏感的天冬酰胺（Asn，遇强碱会发生脱酰胺断裂），**严禁用 0.5 M NaOH 冲洗**！其日常再生标准是：过 **5 CV 0.1 M 甘氨酸/柠檬酸 (pH 2.0)** 或 **2 CV 6 M 盐酸胍** → **10 CV 超纯水** → **5 CV 20% 乙醇**；\n  - 现代耐碱工程化 Protein A（如 Cytiva `MabSelect SuRe`，已将对碱敏感的 Asn 突变为耐碱氨基酸）专门设计支持 **0.1–0.5 M NaOH 在位清洗（接触 15 min）**，随后用 PBS 调回中性、超纯水洗盐、**5 CV 20% 乙醇** 封存 4°C。",
    "cases": [
      {
        "title": "项目实战案例：为每根抗体柱张贴“耐碱 NaOH 型 vs. 禁碱酸洗型”醒目警示贴",
        "tag": "实验室实战案例",
        "body": "- 实验室在 `HiTrap MabSelect SuRe` 柱盒上贴绿签（允许 0.1–0.5 M NaOH CIP 15 min），在 `HiTrap Protein G HP` 柱盒上贴橙签（禁 NaOH，仅用 pH 2.0 酸洗 + 20% 乙醇保养），避免误操作损毁 Protein G 配基。"
      }
    ],

  "learn.4.0.3": {
    "key": "learn.4.0.3",
    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 亲和层析捕获与填料再生维护 (五级深度拆解) / TEV/ULP1低温透析酶切与反向挂柱(Reverse IMAC)彻底去标签",
    "title": "TEV/ULP1低温透析酶切与反向挂柱(Reverse IMAC)彻底去标签",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握利用带 His 标签的 **TEV或ULP1蛋白酶** 在 **4°C边透析边酶切** 切除 MBP/SUMO 大标签，随后通过 **反向挂柱（Reverse IMAC / Subtractive IMAC）** 一步分离拿到“无痕纯天然靶蛋白”的标准工艺。\n- **为什么要边透析边酶切**：刚从 Ni-NTA 柱洗脱下来的蛋白含有 250 mM 高浓度咪唑，不仅会抑制蛋白酶活性，更会导致酶切完无法直接上第二遍镍柱（因为高咪唑下谁都挂不上镍柱！）。把蛋白酶加进蛋白液一起装入透析袋，在 4°C 过夜透析除咪唑的同时完成酶切，第二天早上直接过镍柱，一举两得！\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【TEV或ULP1蛋白酶】**：\n  - `6×His-TEV 蛋白酶`：识别 `ENLYFQ↓G/S` 七肽序列，质量比通常按 **1:20 至 1:50（酶:底物，w/w）** 投料；\n  - `6×His-ULP1 蛋白酶`：专门识别 SUMO 标签的三维折叠结构并从 C 端 `GG↓` 处精准切开，效率极高，质量比按 **1:100 至 1:200** 投料即可。\n- **【4°C边透析边酶切】**：将亲和洗脱液与蛋白酶混匀后装入透析袋（MWCO 10–14 kDa），放入 100 倍体积的无咪唑透析液（25 mM HEPES pH 7.5, 300 mM NaCl, 0.5 mM TCEP, 20 µM ZnCl₂）中，4°C 慢速磁力搅拌透析过夜（12–16 h），将咪唑浓度降至 < 5 mM 并完成 > 95% 切割。\n- **【反向挂柱（Reverse IMAC / Subtractive IMAC）】**：酶切体系中共有 4 种物质：\n  1. 切下来的 `6×His-MBP`（或 `6×His-SUMO`）标签 —— **带 His 标签**；\n  2. 还没切开的微量全长融合蛋白 —— **带 His 标签**；\n  3. 加入的 `6×His-TEV`（或 `6×His-ULP1`）蛋白酶 —— **带 His 标签**；\n  4. **切下来的目标靶蛋白（Native Ro52）** —— **唯一不带 His 标签！**\n  - 将酶切液过一遍平衡好的 Ni-NTA 柱，前 3 种带 His 标签的杂质全部被死死扣在镍柱上，而 **流穿液（Flow-through）和 20 mM 咪唑追洗液里流出来的，就是高纯度无标签的靶蛋白**！\n\n---\n\n## **3. 酶切与反向挂柱实操排坑指南**\n1. **必须先做 20 µL 小样确认切开再过反向柱**：过夜酶切次日早上，先取 10 µL 酶切前样品与 10 µL 酶切后样品跑快胶 SDS-PAGE，确认融合大条带已 95% 以上分裂为“标签带 + 靶蛋白带”，且离心无沉淀（证明切掉助溶标签后靶蛋白没有自己聚沉！）。\n2. **假流穿陷阱**：如果切掉 MBP 后靶蛋白依然和切下来的 `6×His-MBP` 紧抱在一起（即疏水死抱的微聚集体），过反向镍柱时靶蛋白会被 MBP 拽在柱上流不下来！因此 **只有真正独立折叠的单分散蛋白，才能在反向 IMAC 的流穿液中被高收率回收**。",
    "cases": [
      {
        "title": "项目实战案例：6×His-SUMO-Ro52(1-255) 的 ULP1 酶切与反向 IMAC",
        "tag": "实验室实战案例",
        "body": "- 15 mg `6×His-SUMO-Ro52(1-255)` 亲和洗脱液加入 100 µg `6×His-ULP1`，装入 10 kDa 透析袋在 4°C 透析酶切 14 小时（咪唑从 250 mM 降至 2.5 mM）。次日过 2 mL Ni-NTA 重力柱，收集流穿液 + 3 CV 20 mM 咪唑平衡液追洗，一步拿到纯度 96.5% 的无标签天然 Ro52(1-255) 10.2 mg。"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握利用带 His 标签的 **TEV或ULP1蛋白酶** 在 **4°C边透析边酶切** 切除 MBP/SUMO 大标签，随后通过 **反向挂柱（Reverse IMAC / Subtractive IMAC）** 一步分离拿到“无痕纯天然靶蛋白”的标准工艺。\n- **为什么要边透析边酶切**：刚从 Ni-NTA 柱洗脱下来的蛋白含有 250 mM 高浓度咪唑，不仅会抑制蛋白酶活性，更会导致酶切完无法直接上第二遍镍柱（因为高咪唑下谁都挂不上镍柱！）。把蛋白酶加进蛋白液一起装入透析袋，在 4°C 过夜透析除咪唑的同时完成酶切，第二天早上直接过镍柱，一举两得！\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【TEV或ULP1蛋白酶】**：\n  - `6×His-TEV 蛋白酶`：识别 `ENLYFQ↓G/S` 七肽序列，质量比通常按 **1:20 至 1:50（酶:底物，w/w）** 投料；\n  - `6×His-ULP1 蛋白酶`：专门识别 SUMO 标签的三维折叠结构并从 C 端 `GG↓` 处精准切开，效率极高，质量比按 **1:100 至 1:200** 投料即可。\n- **【4°C边透析边酶切】**：将亲和洗脱液与蛋白酶混匀后装入透析袋（MWCO 10–14 kDa），放入 100 倍体积的无咪唑透析液（25 mM HEPES pH 7.5, 300 mM NaCl, 0.5 mM TCEP, 20 µM ZnCl₂）中，4°C 慢速磁力搅拌透析过夜（12–16 h），将咪唑浓度降至 < 5 mM 并完成 > 95% 切割。\n- **【反向挂柱（Reverse IMAC / Subtractive IMAC）】**：酶切体系中共有 4 种物质：\n  1. 切下来的 `6×His-MBP`（或 `6×His-SUMO`）标签 —— **带 His 标签**；\n  2. 还没切开的微量全长融合蛋白 —— **带 His 标签**；\n  3. 加入的 `6×His-TEV`（或 `6×His-ULP1`）蛋白酶 —— **带 His 标签**；\n  4. **切下来的目标靶蛋白（Native Ro52）** —— **唯一不带 His 标签！**\n  - 将酶切液过一遍平衡好的 Ni-NTA 柱，前 3 种带 His 标签的杂质全部被死死扣在镍柱上，而 **流穿液（Flow-through）和 20 mM 咪唑追洗液里流出来的，就是高纯度无标签的靶蛋白**！\n\n---\n\n## **3. 酶切与反向挂柱实操排坑指南**\n1. **必须先做 20 µL 小样确认切开再过反向柱**：过夜酶切次日早上，先取 10 µL 酶切前样品与 10 µL 酶切后样品跑快胶 SDS-PAGE，确认融合大条带已 95% 以上分裂为“标签带 + 靶蛋白带”，且离心无沉淀（证明切掉助溶标签后靶蛋白没有自己聚沉！）。\n2. **假流穿陷阱**：如果切掉 MBP 后靶蛋白依然和切下来的 `6×His-MBP` 紧抱在一起（即疏水死抱的微聚集体），过反向镍柱时靶蛋白会被 MBP 拽在柱上流不下来！因此 **只有真正独立折叠的单分散蛋白，才能在反向 IMAC 的流穿液中被高收率回收**。",
    "cases": [
      {
        "title": "项目实战案例：6×His-SUMO-Ro52(1-255) 的 ULP1 酶切与反向 IMAC",
        "tag": "实验室实战案例",
        "body": "- 15 mg `6×His-SUMO-Ro52(1-255)` 亲和洗脱液加入 100 µg `6×His-ULP1`，装入 10 kDa 透析袋在 4°C 透析酶切 14 小时（咪唑从 250 mM 降至 2.5 mM）。次日过 2 mL Ni-NTA 重力柱，收集流穿液 + 3 CV 20 mM 咪唑平衡液追洗，一步拿到纯度 96.5% 的无标签天然 Ro52(1-255) 10.2 mg。"
      }

    "key": "learn.4.1",
    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 电荷精纯色谱: 阴离子柱与阳离子柱独立分叉 (五级拆解)",
    "title": "电荷精纯色谱: 阴离子柱与阳离子柱独立分叉 (五级拆解)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在亲和层析之后，利用蛋白质的 **等电点（pI）与表面净电荷法则**、疏水性及流体力学半径差异，通过 **阴离子交换柱（AEX）**、**阳离子交换柱（CEX）**、**疏水作用层析（HIC）** 与 **凝胶过滤分子筛（SEC）** 四大正交精纯手段，彻底清除微量宿主杂蛋白、核酸、内毒素与多聚体。\n- **为什么阴离子柱和阳离子柱要分开独立掌握**：虽然都叫离子交换（IEX），但 **阴离子柱（Q/DEAE）带正电、专抓负电蛋白并兼顾除核酸/内毒素**；**阳离子柱（SP/CM）带负电、专抓正电碱性蛋白**，两者的 Buffer 缓冲盐体系、pH 设定方向和适用靶点完全相反！\n\n[SVG:iex_charge]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【等电点（pI）与表面净电荷法则】**：蛋白质表面布满酸性氨基酸（Asp/Glu，脱质子带负电）和碱性氨基酸（Lys/Arg/His，加质子带正电）。当溶液 pH 等于某特定值时，正负电荷恰好抵消（净电荷为 0），这个 pH 就是 **等电点（pI）**。\n  - 当 **环境 pH > pI + 1.0**：蛋白脱去质子，整体带 **净负电荷（阴离子）** → 挂 **阴离子交换柱（AEX）**；\n  - 当 **环境 pH < pI − 1.0**：蛋白结合质子，整体带 **净正电荷（阳离子）** → 挂 **阳离子交换柱（CEX）**；\n  - **绝对禁区**：严禁把 Buffer pH 调到等于蛋白的 pI！因为净电荷为 0 时，蛋白分子间失去同种电荷排斥力，会瞬间抱团发生 **等电点沉淀**！\n- **【阴离子交换柱（AEX）】**：填料本身带正电荷（如季铵盐 `-N⁺(CH₃)₃` 的 **Q 柱** 或二乙基氨基乙基的 **DEAE 柱**），用来交换吸附溶液中的 **负电阴离子（带负电的蛋白、核酸、内毒素）**。\n- **【阳离子交换柱（CEX）】**：填料本身带负电荷（如磺丙基 `-SO₃⁻` 的 **SP 柱** 或羧甲基 `-COO⁻` 的 **CM 柱**），用来交换吸附溶液中的 **正电阳离子（带正电的碱性蛋白）**。\n- **【疏水作用层析（HIC）】**：高盐暴露疏水斑块挂柱、低盐恢复水化层洗脱，专门剔除构象松散或部分去折叠的异质体。\n- **【凝胶过滤分子筛（SEC）】**：不挂柱、按分子体积大小排队出峰（大分子先出、小分子后出），是切弃死体积可溶性聚集体和换液的终极抛光步。\n\n---\n\n## **3. 阴离子柱 vs. 阳离子柱快速选型对比表**\n| 对比维度 | 阴离子交换柱 (AEX: Q / DEAE) | 阳离子交换柱 (CEX: SP / CM) |\n|---|---|---|\n| **填料自身带电** | **带正电 (+)** | **带负电 (−)** |\n| **抓取的目标离子** | **带净负电的蛋白 (阴离子)** + 核酸 + 内毒素 | **带净正电的蛋白 (阳离子)** |\n| **适用靶蛋白 pI** | 中酸性蛋白（**pI 4.5 – 7.0**，如 Ro52 pI ≈ 6.1） | 中碱性蛋白（**pI 7.5 – 10.5**，如核糖体蛋白、组蛋白、部分抗体） |\n| **工作 Buffer pH 设定** | **pH > pI + 1.0**（通常设在 **pH 7.5 – 8.5**） | **pH < pI − 1.0**（通常设在 **pH 5.5 – 6.8**） |\n| **推荐缓冲盐（防反离子干扰）** | **Tris-HCl**、Bis-Tris（缓冲阳离子带正电，不与柱子抢位点） | **MES、HEPES、磷酸盐、醋酸盐**（缓冲阴离子带负电，不与柱子抢位点） |\n| **强/弱交换填料代表** | 强阴离子：**Q** (HiTrap Q HP / Source 15Q)<br>弱阴离子：**DEAE** | 强阳离子：**SP** (HiTrap SP HP / Source 15S)<br>弱阳离子：**CM** |",
    "cases": [
      {
        "title": "项目实战案例：Ro52 (pI 6.08) 为什么选 Q 阴离子柱而不是 SP 阳离子柱？",
        "tag": "实验室实战案例",
        "body": "- Ro52 全长理论等电点 pI = 6.08（6×His-MBP-Ro52 融合蛋白 pI = 5.65）。若要用阳离子柱（SP），必须把 Buffer pH 调到 < 5.0，而在 pH 5.0 酸性条件下 Ro52 的 RING 锌指域会质子化丢锌并瞬间沉淀！\n- 反之，在生理偏微碱性的 **pH 7.8–8.0** 下，Ro52 非常稳定且表面带充足的 **净负电荷**（pH − pI ≈ +1.9），上 **HiTrap Q HP 强阴离子交换柱** 结合紧实，通过 50 mM → 500 mM NaCl 线性梯度即可实现尖锐洗脱并彻底分离核酸。"
      }

    "title": "阴离子交换层析 (AEX: Q强阴 / DEAE弱阴)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：单独深入掌握 **阴离子交换层析（AEX）** 的 **强阴离子Q与弱阴离子DEAE区别**、**pH>pI+1与低电导率上样铁律**、**NaCl线性梯度分峰与除核酸/内毒素** 以及 **阴离子柱NaOH+高盐再生保养 SOP**。\n- **为什么阴离子柱是重组蛋白纯化的“劳模”**：人体和病原体的绝大多数可溶胞内抗原（约 70%，包括 Ro52、Ro60、La、Jo-1 等）等电点都在 **5.0–6.8** 之间，在生理 pH 7.5–8.0 下天然带负电；同时，大肠杆菌最难缠的两大污染物——**核酸（DNA/RNA）和内毒素（LPS）都带极强的负电荷**，通过阴离子柱可以实现“蛋白精纯 + 除核酸 + 除内毒素”一箭三雕！\n\n[SVG:iex_charge]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【强阴离子Q与弱阴离子DEAE区别】**：\n  - **强阴离子（Q，季铵基团 `-CH₂-N⁺(CH₃)₃`）**：这里的“强”不是指抓得死洗不下来，而是指 **在 pH 2–12 的极宽范围内永远保持 100% 正电荷电离度**，柱载量和分辨率不受 pH 波动影响，是方法开发的首选（如 HiTrap Q HP、Q Sepharose Fast Flow、Mono Q）。\n  - **弱阴离子（DEAE，二乙基氨基乙基 `-CH₂-CH₂-N⁺H(C₂H₅)₂`）**：仅在 pH < 8.5 时带正电；当 pH > 9.0 时会去质子化失去电荷，选择性与 Q 柱略有差异，偶尔用于特殊异构体分离。\n- **【pH>pI+1与低电导率上样铁律】**：\n  - **pH 设定**：必须把 Buffer pH 设在目标蛋白 **pI 以上 1.0–2.0 个单位**（通常为 pH 7.5–8.5，推荐用 **20–25 mM Tris-HCl pH 8.0**）；\n  - **低盐低电导率上样**：亲和层析洗脱液通常含 300–500 mM NaCl，**绝对不能直接上 Q 柱**！必须先用无盐/低盐 Buffer A 稀释 6–10 倍或透析脱盐，使 **NaCl ≤ 30–50 mM（电导率 < 4–5 mS/cm）**，否则大量的 Cl⁻ 离子会把 Q 柱上的正电荷全部占满，蛋白直接流穿！\n- **【NaCl线性梯度分峰与除核酸/内毒素】**：\n  - 蛋白挂上 Q 柱后，通过 AKTA 控制 B 泵（含 1 M NaCl）从 **0% B → 50% B（即 20 mM → 500 mM NaCl）跑 15–20 CV 线性梯度**；\n  - 带微弱负电的杂蛋白在 100–150 mM NaCl 先被 Cl⁻ 换下来；目标蛋白通常在 **180–300 mM NaCl** 呈尖锐单峰洗脱；而带满磷酸骨架负电荷的 **DNA/RNA 核酸和内毒素（LPS）** 被 Q 柱死死吸住，要到 **600–1000 mM NaCl（100% B 再生步）** 才会洗脱出来（此时 UV₂₆₀ 远高于 UV₂₈₀），从而与目标蛋白彻底分家！\n- **【阴离子柱NaOH+高盐再生保养】**：Q 柱每次跑完都会死死吸附大量核酸、内毒素和酸性脂质，必须用 **2 M NaCl 高盐冲脱 + 0.5–1.0 M NaOH 强碱消杀**，再置换为 20% 乙醇封存。\n\n---\n\n## **3. 阴离子交换柱（HiTrap Q / Q Sepharose）实操与维护 SOP**\n1. **标准 Buffer 配方**：\n   - `Buffer A（低盐结合液）`：25 mM Tris-HCl (或 HEPES) **pH 8.0**, **20 mM NaCl**, 5% Glycerol, 0.5 mM TCEP, 20 µM ZnCl₂（实测电导率 ≈ 2.8 mS/cm）。\n   - `Buffer B（高盐洗脱液）`：25 mM Tris-HCl (或 HEPES) **pH 8.0**, **1000 mM NaCl**, 5% Glycerol, 0.5 mM TCEP, 20 µM ZnCl₂（实测电导率 ≈ 85 mS/cm）。\n2. **手工柱（蠕动泵）跑 Q 柱阶梯盐洗脱法（无 AKTA 时的应急方案）**：\n   - 若 AKTA 正在忙，用蠕动泵推 5 mL HiTrap Q 柱：低盐上样后，依次用 **100 mM、150 mM、200 mM、250 mM、300 mM、400 mM、1000 mM NaCl** 各洗 3 CV 分管收集，跑电泳即可锁定目标蛋白洗脱盐浓度窗口。\n3. **Q 柱洗后再生与保养 SOP（每次必做）**：\n   - **高盐清场**：过 **5 CV 100% Buffer B（1 M NaCl）** 或 **2 M NaCl**，冲掉紧紧吸在柱上的核酸峰与内毒素；\n   - **强碱 CIP（每 3–5 次或除内毒素时）**：过 **5 CV 0.5 M NaOH**（接触 15–30 min）→ **5 CV Buffer B（调回 pH 并补足 Cl⁻ 反离子）** → **10 CV 超纯水**（洗尽 NaCl 防乙醇结晶）；\n   - **封存**：过 **5 CV 20% 乙醇**，4°C 保存。",
    "cases": [
      {
        "title": "项目实战案例：Ro52 过 HiTrap Q HP 阴离子柱把 A₂₆₀/A₂₈₀ 从 1.15 降至 0.54",
        "tag": "实验室实战案例",
        "body": "- **问题**：Ro52 的 Coiled-Coil 与 PRY/SPRY 域含局部正电荷斑块，Ni-NTA 洗脱液的 **A₂₆₀/A₂₈₀ 高达 1.15**（掺杂大量宿主 RNA/DNA 片段），导致包被磁珠时背景噪点偏高。\n- **解决**：将 Ni-NTA 洗脱液用无盐 25 mM Tris pH 8.0 稀释 8 倍（盐浓度降至 35 mM，电导率 3.6 mS/cm），上 5 mL HiTrap Q HP 阴离子柱，跑 20 mM → 500 mM NaCl（20 CV）线性梯度：\n  - **220 mM NaCl（电导率 21 mS/cm）**：洗出纯净 Ro52 主峰（**UV₂₈₀ 远高于 UV₂₆₀，实测 A₂₆₀/A₂₈₀ = 0.54**，内毒素 < 2 EU/mg）；\n  - **750 mM NaCl（100% B 冲洗步）**：洗出一个巨大的核酸峰（UV₂₆₀ 是 UV₂₈₀ 的 2 倍），核酸污染被彻底剥离！"
      }
    ],

    "title": "AEX电荷原理(pH>pI+1抓负电蛋白)与强阴离子Q/弱阴离子DEAE选型 (含图解)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：吃透 **阴离子交换柱（AEX：填料带正电 \\oplus，专抓负电蛋白 \\ominus）** 的 **pH > pI + 1.0 电荷法则**，以及 **强阴离子交换柱（Q）与弱阴离子交换柱（DEAE）** 的电离度差异与选型准则。\n\n[SVG:iex_charge]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【pH > pI + 1.0 电荷法则】**：\n  - 先用 Expasy ProtParam 查出目标蛋白的理论等电点（pI，例如 Ro52 全长 pI = 6.08，6×His-MBP-Ro52 pI = 5.65）；\n  - 当我们把缓冲液的 **pH 设定在蛋白 pI 以上 1.0–2.0 个单位（如 pH 7.8–8.0）** 时，蛋白表面的天冬氨酸（Asp）和谷氨酸（Glu）羧基充分脱去 H⁺，使整个蛋白分子表面带上充沛的 **净负电荷（变成阴离子 \\ominus）**；\n  - 当蛋白流经表面布满 **正电荷（\\oplus）** 的阴离子交换填料时，正负相吸，蛋白就像磁铁一样牢牢吸在柱头上！\n- **【强阴离子交换柱（Q）与弱阴离子交换柱（DEAE）】**：\n  - **`Q 柱（季铵基团 `-CH₂-N⁺(CH₃)₃`，如 HiTrap Q HP / Q Sepharose FF / Resource Q）`**：季铵盐是永久正电荷，**在 pH 2–12 的任何酸碱度下都保持 100% 电离带正电**，柱载量大、重现性极高，是 **90% 以上中酸性抗原精纯的第一首选**！\n  - **`DEAE 柱（二乙基氨基乙基 `-CH₂-CH₂-N⁺H(C₂H₅)₂`）`**：叔胺基团，仅在 pH < 8.5 时完全质子化带正电，当 pH > 9.0 时电荷密度下降；仅在对 Q 柱结合过死或特殊异构体分离时选用。",

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：吃透 **阴离子交换柱（AEX：填料带正电 \\oplus，专抓负电蛋白 \\ominus）** 的 **pH > pI + 1.0 电荷法则**，以及 **强阴离子交换柱（Q）与弱阴离子交换柱（DEAE）** 的电离度差异与选型准则。\n\n[SVG:iex_charge]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【pH > pI + 1.0 电荷法则】**：\n  - 先用 Expasy ProtParam 查出目标蛋白的理论等电点（pI，例如 Ro52 全长 pI = 6.08，6×His-MBP-Ro52 pI = 5.65）；\n  - 当我们把缓冲液的 **pH 设定在蛋白 pI 以上 1.0–2.0 个单位（如 pH 7.8–8.0）** 时，蛋白表面的天冬氨酸（Asp）和谷氨酸（Glu）羧基充分脱去 H⁺，使整个蛋白分子表面带上充沛的 **净负电荷（变成阴离子 \\ominus）**；\n  - 当蛋白流经表面布满 **正电荷（\\oplus）** 的阴离子交换填料时，正负相吸，蛋白就像磁铁一样牢牢吸在柱头上！\n- **【强阴离子交换柱（Q）与弱阴离子交换柱（DEAE）】**：\n  - **`Q 柱（季铵基团 `-CH₂-N⁺(CH₃)₃`，如 HiTrap Q HP / Q Sepharose FF / Resource Q）`**：季铵盐是永久正电荷，**在 pH 2–12 的任何酸碱度下都保持 100% 电离带正电**，柱载量大、重现性极高，是 **90% 以上中酸性抗原精纯的第一首选**！\n  - **`DEAE 柱（二乙基氨基乙基 `-CH₂-CH₂-N⁺H(C₂H₅)₂`）`**：叔胺基团，仅在 pH < 8.5 时完全质子化带正电，当 pH > 9.0 时电荷密度下降；仅在对 Q 柱结合过死或特殊异构体分离时选用。",

        "title": "项目实战案例：中酸性自身抗原家族（Ro52/Ro60/La/Jo-1）全面标配 HiTrap Q HP 强阴离子柱",
        "tag": "实验室实战案例",
        "body": "- 统计实验室核心自免抗原等电点：Ro52 (pI 6.1)、Ro60 (pI 6.5)、La/SS-B (pI 6.7)、Jo-1 (pI 5.7)，全部落在中酸性区间（pI 5.5–6.8）。统一采用 **pH 8.0 缓冲体系 + HiTrap Q HP 强阴离子柱** 作为标准二道精纯柱，工艺通用性极强。"

    "title": "AEX专属Buffer体系: Tris阳离子缓冲对、低盐(<5mS/cm)上样与NaCl线性梯度",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握阴离子交换柱（AEX）的 **AEX专属BufferA/B配方（Tris阳离子缓冲对）**、**上样前低盐稀释（电导率<5 mS/cm）死命令** 以及 **0%→50% B（20→500 mM NaCl）线性盐梯度竞争洗脱机制**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【AEX专属BufferA/B配方（Tris阳离子缓冲对）】**：\n  - **`Buffer A（低盐结合液）`**：`25 mM Tris-HCl (或 HEPES) pH 8.0, 20 mM NaCl, 5% 甘油, 0.5 mM TCEP, 20 µM ZnCl₂`（实测电导率 **2.5–3.5 mS/cm**）；\n  - **`Buffer B（高盐洗脱液）`**：`25 mM Tris-HCl (或 HEPES) pH 8.0, 1000 mM (1.0 M) NaCl, 5% 甘油, 0.5 mM TCEP, 20 µM ZnCl₂`（实测电导率 **~85 mS/cm**）。\n  - *为什么首选 Tris-HCl*：Tris⁺ 带正电，与带正电的 Q 填料同性相斥，绝不会占柱子的位子。\n- **【上样前低盐稀释（电导率<5 mS/cm）死命令】**：\n  - 从头道 Ni-NTA 柱洗脱下来的蛋白液通常含有 **300–500 mM NaCl + 250 mM 咪唑**（电导率高达 35–45 mS/cm）——**如果直接打进 Q 柱，高浓度的 Cl⁻ 会占满 Q 柱所有正电位点，你的蛋白会 100% 从流穿液里直接跑掉**！\n  - **正确操作**：上 Q 柱前，必须先用 **无盐 Buffer（0 mM NaCl 的 25 mM Tris pH 8.0）将样品稀释 8–10 倍**（或先做过夜酶切低盐透析），用便携电导率仪或 AKTA 确认 **上样液 NaCl ≤ 30–40 mM（电导率 ≤ 4.5 mS/cm）** 后再上柱！\n- **【0%→50% B（20→500 mM NaCl）线性盐梯度竞争洗脱机制】**：\n  - 不要直接从 0% B 跳到 100% B（1 M NaCl 会把所有杂蛋白和核酸跟目标蛋白抱成一团冲下来！）；\n  - 必须在 AKTA 上设定 **15–20 CV 的 `0% B → 50% B（即 20 mM → 500 mM NaCl）` 缓坡线性梯度**，让表面负电荷密度不同的杂蛋白、单体/二聚体和核酸按先后顺序依次被 Cl⁻ 替换下来，形成高分辨率分离！",
    "cases": [
      {
        "title": "项目实战案例：稀释 8 倍降电导至 3.8 mS/cm 解决 Q 柱“挂不上蛋白”",
        "tag": "实验室实战案例",
        "body": "- 某新人把含 300 mM NaCl 的酶切液直接上 HiTrap Q 柱，结果 90% 目标蛋白出现在流穿峰。改用无盐 25 mM Tris (pH 8.0) 稀释 7 倍（NaCl 降至 42 mM，电导率 4.1 mS/cm）后以 2 mL/min 大体积上样，结合率立刻达到 100%！"
      }

  "learn.4.1.0.2": {
    "key": "learn.4.1.0.2",
    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 电荷精纯色谱: 阴离子柱与阳离子柱独立分叉 (五级拆解) / 阴离子交换层析 (AEX: Q强阴 / DEAE弱阴) / 一石三鸟实操(蛋白精纯+除核酸A260+除内毒素)与2M NaCl+0.5M NaOH保养",
    "title": "一石三鸟实操(蛋白精纯+除核酸A260+除内毒素)与2M NaCl+0.5M NaOH保养",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握阴离子交换柱（Q 柱）最强大的 **“一石三鸟”实操技能（纯化目标蛋白 + 剥离大肠杆菌DNA/RNA核酸 + 清除强负电内毒素LPS）**，并严格执行每次用完后的 **2M NaCl高盐冲核酸 + 0.5–1.0M NaOH强碱CIP + 20%乙醇保养 SOP**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【“一石三鸟”实操技能（蛋白 + 除核酸 + 除内毒素）】**：\n  - 在 pH 8.0 下上 Q 柱跑 NaCl 梯度时，不同物质在 Q 柱上的结合紧密度遵循严格的洗脱顺序：\n    1. **`50–150 mM NaCl（5%–15% B）`**：带微弱负电的大肠杆菌宿主杂蛋白率先被洗掉；\n    2. **`180–300 mM NaCl（18%–30% B）`**：**目标重组蛋白（如 Ro52，在 ~220 mM NaCl 处）** 洗脱出尖锐单峰（此时 AKTA 上 **UV₂₈₀ 蓝线远高于 UV₂₆₀ 红线，A₂₆₀/A₂₈₀ ≈ 0.54**）；\n    3. **`600–1000 mM NaCl（60%–100% B 高盐冲洗区）`**：由于细菌 **DNA/RNA 的磷酸二酯键骨架** 和 **革兰氏阴性菌内毒素（LPS 脂多糖）的焦磷酸基团** 带有极其密集的强负电荷，它们会像胶水一样死死贴在 Q 柱上，直到目标蛋白早就安全收完、盐浓度升到 **650–1000 mM NaCl** 时才被冲下来（此时你会看到一个 **UV₂₆₀ 红线比 UV₂₈₀ 蓝线高出一倍的巨大核酸峰**）！\n- **【2M NaCl高盐冲核酸 + 0.5–1.0M NaOH强碱CIP + 20%乙醇保养 SOP】**：\n  - 正因为 Q 柱每次帮你的蛋白吸走了所有脏核酸和内毒素，跑完梯度后那些顽固的基因组大片段 DNA 和脂多糖还死死粘在 Q 柱上！如果不彻底洗掉，跑第二批时柱载量就会掉一半并交叉污染下一批！\n  - **Q 柱每次用完强制保养四步曲**：\n    1. **`高盐剥核酸`**：过 **5 CV 1.0–2.0 M NaCl（100% Buffer B）**，直到 UV₂₆₀ 核酸大峰完全归零；\n    2. **`强碱 CIP 灭内毒素`**：过 **5 CV 0.5–1.0 M NaOH**（接触 15–30 min，强碱既能水解残留 RNA/死蛋白，又能皂化灭活内毒素 LPS）；\n    3. **`补 Cl⁻ 反离子与纯水脱盐`**：过 **5 CV Buffer B（1 M NaCl，把 OH⁻ 换回 Cl⁻ 并恢复 pH 8.0）** → 过 **10 CV 超纯水** 洗尽 NaCl；\n    4. **`封存`**：过 **5 CV 20% 乙醇**，4°C 保存。",
    "cases": [
      {
        "title": "项目实战案例：HiTrap Q HP 一步将 Ro52 的 A₂₆₀/A₂₈₀ 从 1.15 降至 0.54、内毒素降至 1.8 EU/mg",
        "tag": "实验室实战案例",
        "body": "- 亲和粗纯后的 Ro52 因伴随宿主 RNA 结合，`A₂₆₀/A₂₈₀ = 1.15`、内毒素 `68 EU/mg`；经过 HiTrap Q HP 线性梯度在 220 mM NaCl 处收集蛋白主峰（将 750 mM NaCl 处的核酸/内毒素大峰彻底甩在柱后再生段），收集液 `A₂₆₀/A₂₈₀` 一步降至 **0.54**，内毒素降至 **1.8 EU/mg**，发光本底下降 70%！"
      }

      {
        "title": "项目实战案例：HiTrap Q HP 一步将 Ro52 的 A₂₆₀/A₂₈₀ 从 1.15 降至 0.54、内毒素降至 1.8 EU/mg",
        "tag": "实验室实战案例",
        "body": "- 亲和粗纯后的 Ro52 因伴随宿主 RNA 结合，`A₂₆₀/A₂₈₀ = 1.15`、内毒素 `68 EU/mg`；经过 HiTrap Q HP 线性梯度在 220 mM NaCl 处收集蛋白主峰（将 750 mM NaCl 处的核酸/内毒素大峰彻底甩在柱后再生段），收集液 `A₂₆₀/A₂₈₀` 一步降至 **0.54**，内毒素降至 **1.8 EU/mg**，发光本底下降 70%！"
      }

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 电荷精纯色谱: 阴离子柱与阳离子柱独立分叉 (五级拆解) / 阳离子交换层析 (CEX: SP强阳 / CM弱阳)",
    "title": "阳离子交换层析 (CEX: SP强阳 / CM弱阳)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：单独深入掌握 **阳离子交换层析（CEX）** 的 **强阳离子SP与弱阳离子CM区别**、**pH<pI-1微酸性上样规则**、**缓冲阴离子选型（MES/磷酸盐/HEPES）** 以及 **阳离子柱再生与乙酸钠-乙醇保养 SOP**。\n- **什么时候必须用阳离子柱**：当目标抗原是 **碱性蛋白（pI > 7.8，如 Sm/RNP 核糖核蛋白、组蛋白 H1/H2B、核仁蛋白 Fibrillarin、溶菌酶以及多数单克隆抗体 IgG）** 时，在生理 pH 6.0–7.2 下它们天然带 **净正电荷**；此时上阳离子柱（SP/CM），不仅目标蛋白抓得极牢，而且带负电的大肠杆菌宿主杂蛋白、核酸和内毒素在流穿液（Flow-through）中直接穿柱而过，一步就能实现极高纯度！\n\n[SVG:iex_charge]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【强阳离子SP与弱阳离子CM区别】**：\n  - **强阳离子（SP，磺丙基 `-CH₂-CH₂-CH₂-SO₃⁻`）**：在 pH 2–12 全范围内始终保持 100% 负电荷电离度，即使在 pH 4.5–5.5 的酸性条件下载量也毫不衰减，是碱性蛋白和抗体精纯的绝对主力（如 HiTrap SP HP、SP Sepharose Fast Flow、Mono S）。\n  - **弱阳离子（CM，羧甲基 `-CH₂-COO⁻`）**：pKa ≈ 4.5，只有在 pH > 5.5 时才完全带负电；在 pH < 5.0 时电荷密度下降，适合对强阳离子结合过紧、难以洗脱的极强碱性蛋白。\n- **【pH<pI-1微酸性上样规则】**：\n  - 必须将上样 Buffer 的 pH 设定在目标蛋白 **pI 以下 1.0–2.0 个单位**（通常在 **pH 5.5–7.0** 之间），使蛋白表面赖氨酸（Lys）和精氨酸（Arg）充分质子化带正电；\n  - 上样盐浓度同样必须控制在 **≤ 20–50 mM NaCl（电导率 < 5 mS/cm）**；若蛋白在低盐下有轻微浑浊倾向，需在刚调完 pH 和稀释后立即以 1–2 mL/min 上柱，避免在烧杯中长时间静置。\n- **【缓冲阴离子选型（MES/磷酸盐/HEPES）】**：\n  - 跑阳离子柱时，缓冲盐本身的离子 **不能带正电去跟填料上的 `-SO₃⁻` 结合**！\n  - 因此，阳离子柱 **首选 MES（pH 5.5–6.7）、磷酸钠（pH 6.0–7.5）、HEPES（pH 6.8–7.8）或醋酸钠（pH 4.5–5.5）**（它们的缓冲离子都是阴离子，与带负电的 SP 柱互不排斥）；**尽量避免使用 Tris-HCl**（Tris⁺ 是阳离子，会与 SP 柱发生微弱吸附导致局部 pH 波动）。\n- **【阳离子柱再生与乙酸钠-乙醇保养】**：SP/CM 柱带有磺酸基/羧基负电荷，长期保存在纯水+乙醇中可能发生反离子流失；因此厂家标准规范要求封存在 **含 0.2 M 乙酸钠（Sodium Acetate）的 20% 乙醇水溶液** 中以维持 Na⁺ 反离子平衡。\n\n---\n\n## **3. 阳离子交换柱（HiTrap SP / SP Sepharose）实操与维护 SOP**\n1. **标准 Buffer 配方（以 pI ≈ 8.8 的碱性自身抗原为例）**：\n   - `Buffer A（低盐结合液）`：25 mM MES (或磷酸钠 / HEPES) **pH 6.2–6.8**, **20 mM NaCl**, 5% Glycerol, 0.5 mM TCEP。\n   - `Buffer B（高盐洗脱液）`：25 mM MES (或磷酸钠 / HEPES) **pH 6.2–6.8**, **1000 mM NaCl**, 5% Glycerol, 0.5 mM TCEP。\n2. **SP 柱过柱操作要点**：\n   - **流穿除核酸优势**：上样时可观察 AKTA 的 `UV 260 nm` 曲线——你会看到流穿峰中 `UV 260 > UV 280`，这是因为带负电的核酸与带负电的 SP 填料同性相斥，一秒都不停留直接流穿走了！\n   - **线性梯度洗脱**：用 **0% B → 60% B（20 mM → 600 mM NaCl，20 CV）** 线性梯度洗脱，碱性靶蛋白通常在 **250–450 mM NaCl** 之间洗出对称尖峰。\n3. **SP/CM 阳离子柱洗后再生与保养 SOP（每次必做）**：\n   - **高盐清场**：过 **5 CV 100% Buffer B（1 M NaCl）** 或 **2 M NaCl**，洗脱强结合碱性杂蛋白；\n   - **强碱 CIP**：过 **5 CV 0.5 M NaOH**（接触 15–30 min）→ **5 CV Buffer B（恢复 Na⁺ 反离子并调回中性 pH）** → **8 CV 超纯水**；\n   - **专用封存液（重点区别！）**：过 **5 CV 含 0.2 M 醋酸钠（CH₃COONa）的 20% 乙醇水溶液**，旋紧堵头于 4°C 保存（乙酸钠能确保磺酸基 `-SO₃⁻` 始终结合着 `Na⁺` 抗衡离子，防止下次开机时柱内 pH 骤降变酸伤蛋白！）。",
    "cases": [
      {
        "title": "项目实战案例：碱性核蛋白抗原（pI 9.2）过 HiTrap SP HP 阳离子柱一步去核酸",
        "tag": "实验室实战案例",
        "body": "- **挑战**：某核糖核蛋白抗原（pI = 9.2）在细胞内天然结合 RNA，Ni-NTA 亲和纯化后 `A₂₆₀/A₂₈₀ = 1.42`，且如果上 Q 阴离子柱（需调 pH > 10.2）蛋白直接碱变性。\n- **方案**：在 **25 mM MES pH 6.5, 30 mM NaCl** 条件下上 **5 mL HiTrap SP HP 强阳离子交换柱**：带负电的宿主 RNA 在上样流穿液中直接被排斥冲走，而带强正电的靶蛋白牢牢挂在 SP 柱上，在 **380 mM NaCl** 处洗脱出尖锐单峰，纯度达 97.2%，`A₂₆₀/A₂₈₀` 直接降至 **0.56**！"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **阳离子交换柱（CEX：填料带负电 \\ominus，专抓正电碱性蛋白 \\oplus）** 的 **pH < pI − 1.0 微酸性电荷法则**、**上样流穿自动排斥负电核酸/内毒素** 的独特优势，以及 **强阳离子交换柱（SP）与弱阳离子交换柱（CM）** 的选型。\n\n[SVG:iex_charge]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【pH < pI − 1.0 微酸性电荷法则】**：\n  - 适用于 **中碱性靶蛋白（pI > 7.5–10.5，如 Sm/RNP 核糖核蛋白、组蛋白 Histone、核仁抗原、多数单克隆抗体 IgG）**；\n  - 将缓冲液的 **pH 设定在蛋白 pI 以下 1.0–2.0 个单位（通常设在微酸性至中性的 pH 5.5–6.8）**，使蛋白表面的赖氨酸（Lys）、精氨酸（Arg）和组氨酸（His）充分结合 H⁺ 带上 **净正电荷（变成阳离子 \\oplus）**，从而牢牢吸附在带负电（\\ominus）的阳离子交换柱上。\n- **【上样流穿自动排斥负电核酸/内毒素】**：\n  - 这是阳离子柱（SP/CM）最爽的地方：在 pH 6.0–6.8 下，大肠杆菌绝大多数宿主杂蛋白（70% 为酸性蛋白）、**所有的 DNA/RNA 核酸以及内毒素（LPS）全都带负电荷（\\ominus）**！\n  - 当样品打进同样带 **负电荷（\\ominus）** 的 SP 柱时，**同性相斥**——所有的核酸、内毒素和酸性宿主杂蛋白根本挂不上柱，在上样流穿液（Flow-through）里第一时间就被冲走了，柱上只留下干干净净的碱性目标蛋白！\n- **【强阳离子交换柱（SP）与弱阳离子交换柱（CM）】**：\n  - **`SP 柱（磺丙基 `-CH₂-CH₂-CH₂-SO₃⁻`，如 HiTrap SP HP / SP Sepharose FF / Resource S）`**：强酸磺酸根，在 **pH 2–12 全范围保持 100% 负电荷**，即使在 pH 4.5–5.5 下也不掉载量，是碱性抗原与抗体精纯的绝对主力；\n  - **`CM 柱（羧甲基 `-CH₂-COO⁻`）`**：弱酸羧基（pKa ≈ 4.5），仅在 pH > 5.5 时完全带负电，用于对 SP 结合过紧的极强碱性蛋白。",
    "cases": [

        "title": "项目实战案例：Sm/RNP 碱性核抗原（pI 9.4）用 HiTrap SP 阳离子柱流穿一步去尽宿主 RNA",
        "tag": "实验室实战案例",
        "body": "- 针对天然极易死抱细菌 RNA 的碱性核抗原（pI 9.4），在 pH 6.4 MES 低盐下上 HiTrap SP HP 强阳离子柱：流穿峰呈现极高的 260 nm 吸收（细菌 RNA 被负电 SP 填料直接排斥冲走），随后在 360 mM NaCl 处洗脱出 `A₂₆₀/A₂₈₀ = 0.55` 的超纯碱性抗原。"
      }

    "title": "CEX专属Buffer体系(MES/HEPES/磷酸盐)与含0.2M乙酸钠的20%乙醇专用封存",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握阳离子交换柱（CEX）的 **CEX专属阴离子缓冲体系（MES/磷酸盐/HEPES）**、低盐上样与 NaCl 线性梯度洗脱，并重点落实与阴离子柱截然不同的 **“含0.2M乙酸钠的20%乙醇”专用封存保养 SOP**！\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【CEX专属阴离子缓冲体系（MES/磷酸盐/HEPES）】**：\n  - **`Buffer A（低盐结合液）`**：`25 mM MES (pH 5.5–6.5) 或 磷酸钠 / HEPES (pH 6.5–7.2), 20–30 mM NaCl, 5% 甘油, 0.5 mM TCEP`（电导率 **< 5 mS/cm**）；\n  - **`Buffer B（高盐洗脱液）`**：`同 Buffer A 缓冲盐与 pH + 1000 mM (1.0 M) NaCl`；\n  - *缓冲盐禁忌*：跑 SP/CM 阳离子柱时 **避免使用 Tris-HCl**（因为 Tris⁺ 是阳离子，不仅在 pH < 7.0 下毫无缓冲力，还会吸附到带负电的 SP 柱上扰乱 pH！）。\n- **【“含0.2M乙酸钠的20%乙醇”专用封存保养 SOP（重点区别！）】**：\n  - 每次用完 SP / CM 阳离子柱后的标准清洗与封存四步曲：\n    1. **`高盐清场`**：过 **5 CV 1.0–2.0 M NaCl（100% Buffer B）** 洗脱强结合碱性杂蛋白；\n    2. **`强碱 CIP`**：过 **5 CV 0.5–1.0 M NaOH**（接触 15–30 min）→ **5 CV Buffer B（恢复中性 pH）** → **8 CV 超纯水**；\n    3. **`专用封存液（20% 乙醇 + 0.2 M 乙酸钠 CH₃COONa）`**：**注意！阳离子柱（SP/CM）不能像 Ni 柱和 Q 柱那样只存纯 20% 乙醇**！按照 Cytiva 官方规程，SP 和 CM 柱长期保存必须封存于 **含 0.2 M 乙酸钠（Sodium Acetate）的 20% 乙醇水溶液** 中！\n    4. *为什么要加 0.2 M 乙酸钠*：是为了确保填料上的磺酸基（-SO₃⁻）或羧基（-COO⁻）始终饱满地结合着 Na⁺ 抗衡离子（Counter-ion）；如果只泡在纯水+乙醇中导致反离子流失变成 -SO₃H 氢型，下次上蛋白时蛋白抓上去会把 H⁺ 置换出来，导致柱内局部 pH 瞬间暴跌变酸，把蛋白酸变性！",

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 疏水层析、分子筛抛光与超滤换液 (五级拆解)",
    "title": "疏水层析、分子筛抛光与超滤换液 (五级拆解)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在层析纯化收尾阶段，通过科学的 **透析与超滤浓缩（MWCO选型）**、**偶联禁忌组分置换**、**血源/真核原料病毒灭活边界** 与 **单次小规格无菌分装留样**，把纯化好的蛋白安全转化为高浓度、无干扰、可长期溯源的成品原液。\n- **为什么最后一步最容易“晚节不保”**：很多研发人员辛辛苦苦过了三根柱子拿到 95% 纯度的好蛋白，结果在最后一步超滤浓缩时选错截留分子量、或者一口气离干在超滤膜上，导致一半蛋白沉淀损失在膜表面。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【透析与超滤浓缩（MWCO选型）】**：利用半透膜孔径（截留分子量 MWCO，Molecular Weight Cut-Off）留住大分子蛋白、放走小分子盐和咪唑。**铁律：所选超滤管/透析袋的 MWCO 必须 ≤ 目标蛋白单体（或稳定寡聚体）分子量的 1/3 至 1/2**！\n- **【偶联禁忌组分置换】**：下游若要做 NHS 生物素化或羧基磁珠/胶乳 EDC 偶联，终 Buffer 中 **绝对不能残留游离伯胺（Tris、甘氨酸、咪唑、硫酸铵）和叠氮钠（NaN₃）**，必须通过透析或连续超滤换液将残留浓度降至 < 0.01 mM。\n- **【血源/真核原料病毒灭活边界】**：人血浆提取抗原或哺乳动物细胞表达产品需考虑低 pH 或 S/D 病毒灭活；但对大肠杆菌重组且对低 pH 极敏感的构象型蛋白（如 Ro52），严禁生搬硬套 pH 3.5 酸处理。\n- **【单次小规格无菌分装留样】**：过 0.22 µm 低蛋白吸附滤膜后，按单次实验用量（如 50–100 µL/支）分装至低吸附冻存管，并强制扣留质控留样（Retention Sample）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **换液与分装必查**：① 超滤前后必须核算 **物料平衡回收率（浓缩后总蛋白量 ÷ 浓缩前总蛋白量 ≥ 85%）**；② 终 Buffer 配方必须与下游偶联工艺签字确认无配伍禁忌。",

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 疏水层析、分子筛抛光与超滤换液 (五级拆解)",
    "title": "疏水层析、分子筛抛光与超滤换液 (五级拆解)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在层析纯化收尾阶段，通过科学的 **透析与超滤浓缩（MWCO选型）**、**偶联禁忌组分置换**、**血源/真核原料病毒灭活边界** 与 **单次小规格无菌分装留样**，把纯化好的蛋白安全转化为高浓度、无干扰、可长期溯源的成品原液。\n- **为什么最后一步最容易“晚节不保”**：很多研发人员辛辛苦苦过了三根柱子拿到 95% 纯度的好蛋白，结果在最后一步超滤浓缩时选错截留分子量、或者一口气离干在超滤膜上，导致一半蛋白沉淀损失在膜表面。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【透析与超滤浓缩（MWCO选型）】**：利用半透膜孔径（截留分子量 MWCO，Molecular Weight Cut-Off）留住大分子蛋白、放走小分子盐和咪唑。**铁律：所选超滤管/透析袋的 MWCO 必须 ≤ 目标蛋白单体（或稳定寡聚体）分子量的 1/3 至 1/2**！\n- **【偶联禁忌组分置换】**：下游若要做 NHS 生物素化或羧基磁珠/胶乳 EDC 偶联，终 Buffer 中 **绝对不能残留游离伯胺（Tris、甘氨酸、咪唑、硫酸铵）和叠氮钠（NaN₃）**，必须通过透析或连续超滤换液将残留浓度降至 < 0.01 mM。\n- **【血源/真核原料病毒灭活边界】**：人血浆提取抗原或哺乳动物细胞表达产品需考虑低 pH 或 S/D 病毒灭活；但对大肠杆菌重组且对低 pH 极敏感的构象型蛋白（如 Ro52），严禁生搬硬套 pH 3.5 酸处理。\n- **【单次小规格无菌分装留样】**：过 0.22 µm 低蛋白吸附滤膜后，按单次实验用量（如 50–100 µL/支）分装至低吸附冻存管，并强制扣留质控留样（Retention Sample）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **换液与分装必查**：① 超滤前后必须核算 **物料平衡回收率（浓缩后总蛋白量 ÷ 浓缩前总蛋白量 ≥ 85%）**；② 终 Buffer 配方必须与下游偶联工艺签字确认无配伍禁忌。",

    "title": "疏水作用层析(HIC: Phenyl/Butyl柱): 高盐结合低盐洗脱去除构象异质体",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **疏水作用层析（HIC: Phenyl/Butyl柱）** 的 **“高盐上样暴露疏水区、低盐洗脱恢复水化层”** 反向盐梯度原理，用于分离电荷相同但折叠紧密度不同的构象异质体（如局部去折叠蛋白、剪切降解片段）。\n- **与离子交换（IEX）的镜像对比**：\n  - **离子交换（IEX）** 是 **“低盐挂柱 → 高盐洗脱”**；\n  - **疏水层析（HIC）** 恰好反过来，是 **“高盐挂柱（如 1.0–1.5 M 硫酸铵）→ 低盐（无盐缓冲液）洗脱”**！\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【疏水作用层析（HIC: Phenyl/Butyl柱）】**：填料表面偶联了弱疏水基团（如苯基 **Phenyl**、丁基 **Butyl** 或辛基 **Octyl**）。\n- **【高盐上样暴露疏水区、低盐洗脱恢复水化层】**：\n  - 在高浓度盐溶盐（如 **0.8–1.2 M (NH₄)₂SO₄ 硫酸铵** 或 **1.5–2.0 M NaCl**）中，盐离子抢走了蛋白表面的水化层，迫使蛋白表面的疏水斑块与填料上的 Phenyl/Butyl 贴合挂柱；\n  - 洗脱时逐渐 **降低盐浓度（100% 高盐 A 液 → 0% 无盐 B 液）**，水分子重新包裹蛋白表面，疏水性越弱（折叠越紧密）的天然蛋白越早洗脱下来，而疏水核心外翻的错误折叠聚体则死死粘在柱上最后才出来。\n\n---\n\n## **3. HIC 操作注意事项与维护**\n1. **上样前盐析预试验**：不同蛋白对硫酸铵的耐受度不同，上柱前必须先取 50 µL 蛋白小样加入目标浓度的硫酸铵（如 1.0 M），静置 15 min 确认 **不会直接发生盐析沉淀** 才能放大上柱！\n2. **HIC 柱清洗与保养**：由于错误折叠的强疏水蛋白在无盐 Buffer 下也洗不下来，每次跑完必须用 **5 CV 超纯水 → 5 CV 0.5 M NaOH → 5 CV 30% 异丙醇（或 70% 乙醇）→ 10 CV 超纯水** 彻底剥离疏水污垢，最后封存于 **20% 乙醇**。",
    "cases": [

        "title": "项目实战案例：利用 HiTrap Phenyl HP 剔除局部去折叠的假可溶构象体",

        "body": "- 某批次融合抗原切掉标签后在 SDS-PAGE 上呈单一条带，但 ELISA 本底偏高；过 Phenyl HP 柱后分离出两个峰：早洗脱峰（0.4 M 硫酸铵，折叠紧密，ELISA 信噪比极佳）与晚洗脱峰（无盐水洗才出来，疏水暴露严重，非特异吸附极高），成功剔除劣质构象体。"

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 疏水层析、分子筛抛光与超滤换液 (五级拆解) / 凝胶过滤分子筛 (SEC: Superdex 200/75)",
    "title": "凝胶过滤分子筛 (SEC: Superdex 200/75)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **凝胶过滤分子筛（SEC: Superdex 200 / Superdex 75）** 的体积排阻物理原理、**外水死体积（V₀）可溶性聚集体切弃**、**天然寡聚态（如二聚体vs单体）保留体积校准** 以及 **一步完成终存储Buffer置换** 的核心操作。\n- **为什么 SEC 是高规格抗原的“照妖镜与终极抛光机”**：SDS-PAGE 加入了 SDS 和煮沸，会把几百个抱成一团的死蛋白聚体全部拆散成好看的“单一条带”；只有跑一针 SEC 分子筛，才能亲眼看到你的蛋白在天然溶液里究竟是 **死体积（V₀ ≈ 8 mL）的假可溶垃圾**，还是 **保留体积精准对称的真可溶活性二聚体/单体**！\n\n[SVG:sec_chromatogram]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【凝胶过滤分子筛（SEC: Superdex 200 / Superdex 75）】**：填料是布满纳米级微孔的葡聚糖-琼脂糖复合微球，不带任何电荷或亲和配基。\n  - **大分子**：钻不进微球的小孔，只能顺着微球之间的外部大缝隙走捷径，路程最短，**最先流出来**；\n  - **中等分子（目标蛋白）**：能钻进一部分微孔里绕路，路程适中，**居中洗脱**；\n  - **小分子（游离咪唑、麦芽糖、盐离子）**：钻遍所有微孔的角角落落，路程最长，**最后（约 1 CV ≈ 24 mL 处）才流出来**。\n  - *柱型选择*：`Superdex 75` 适合 **3–70 kDa** 的小蛋白/截短体；`Superdex 200` 适合 **10–600 kDa** 的中等/大蛋白及二聚体复合物（如 ~104 kDa 的 Ro52 天然二聚体或 ~190 kDa 的 MBP-Ro52 二聚体）。\n- **【外水死体积（V₀）可溶性聚集体切弃】**：微球外部缝隙的总液体体积称为死体积 V₀（对于标准的 24 mL `10/300 GL` 预装柱，**V₀ ≈ 8.0–8.5 mL**）。任何大于 600 kDa（Superdex 200）的蛋白多聚体或 MBP 假可溶微聚集体都会在 **8.0–8.5 mL 处集中涌出（Aggregate Peak）**——**这一峰哪怕在 SDS-PAGE 上也是目的条带，也必须 100% 切弃报废，绝不能混入主峰**！\n- **【天然寡聚态（如二聚体vs单体）保留体积校准】**：通过标准分子量蛋白（Marker：670 kDa 甲状腺球蛋白、158 kDa γ-球蛋白、44 kDa 卵清蛋白、17 kDa 肌红蛋白）标定洗脱体积曲线，验证靶蛋白在溶液中的真实表观分子量（例如 Ro52 单体理论 52 kDa，但在 Superdex 200 上洗脱位置约 **13.5–14.2 mL**，对应 ~105 kDa 的天然反平行二聚体，证明 Coiled-Coil 二聚化折叠完全正确）。\n- **【一步完成终存储Buffer置换】**：因为蛋白跑得比盐和咪唑快得多，用终存储 Buffer（如 20 mM HEPES pH 7.4, 150 mM NaCl, 0.5 mM TCEP）平衡分子筛柱，蛋白流出来时就已经自动换到了干净的终 Buffer 中，把咪唑和杂盐远远甩在 20–24 mL 的柱尾。\n\n---\n\n## **3. Superdex 10/300 GL 分子筛贵重柱铁律与维护 SOP**\n1. **上样体积硬红线（决定峰宽与分辨率）**：\n   - 分子筛不像亲和柱可以无限大体积上样！对于 24 mL 的 `10/300 GL` 分析/半制备柱，**单次上样体积必须 ≤ 500 µL（即 ≤ 2% CV，使用 500 µL 定量上样环）**；\n   - 上样前必须 **12,000 × g 4°C 离心 10 min**（严禁把微沉淀打进分子筛柱头筛板！）。\n2. **流速与耐压红线**：\n   - 标准流速 **0.5 mL/min**（若 Buffer 含 5%–10% 甘油，降至 **0.35–0.4 mL/min**）；\n   - **绝对禁止让气泡进入分子筛柱**！一旦进气泡，柱床会出现肉眼可见的裂缝，所有峰都会严重分叉拖尾。\n3. **日常保养与在位清洗（CIP）**：\n   - **每次用完**：过 **1.5 CV（36 mL）超纯水** → 过 **1.5 CV（36 mL）20% 乙醇**（流速降至 0.3 mL/min，因为 20% 乙醇与水混合放热且粘度高，防超压！），4°C 保存。\n   - **柱压升高或基线飘移时（CIP）**：以 **0.2 mL/min 反向或正向** 过 **0.5 CV（12 mL）0.5 M NaOH** → 立即过 **1.5 CV 超纯水** → **1.5 CV 缓冲液** 平衡。",
    "cases": [
      {
        "title": "项目实战案例：Superdex 200 切弃 8.2 mL 死体积聚体，挽救 Ro52 临床特异性",
        "tag": "实验室实战案例",
        "body": "- **对比实验**：将某批次 Ni-NTA 纯化后的 Ro52 浓缩至 500 µL 上 Superdex 200 Increase 10/300 GL，图谱出现两个峰：**Peak 1（8.2 mL，死体积聚体，占 28%）** 和 **Peak 2（13.8 mL，天然二聚体主峰，占 72%）**。\n- 分别拿 Peak 1 和 Peak 2 跑 SDS-PAGE，两条泳道位置一模一样（都是 52 kDa）！但拿去测 40 份正常人阴性血清：\n  - **Peak 1（8.2 mL 聚体）**：有 6 份正常人血清出现假阳性高本底（疏水聚集团块非特异粘附人 IgG）；\n  - **Peak 2（13.8 mL 二聚体主峰）**：40 份正常人血清本底全部极低（S/CO < 0.25），阳性血清梯度极佳！\n- **结论**：直接把“SEC 主峰占比 ≥ 90%、死体积聚集峰 100% 切弃”写入 Ro52 SOP 与 Gate R5 放行红线。"
      }

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 疏水层析、分子筛抛光与超滤换液 (五级拆解) / 凝胶过滤分子筛 (SEC: Superdex 200/75)",
    "title": "凝胶过滤分子筛 (SEC: Superdex 200/75)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **凝胶过滤分子筛（SEC: Superdex 200 / Superdex 75）** 的体积排阻物理原理、**外水死体积（V₀）可溶性聚集体切弃**、**天然寡聚态（如二聚体vs单体）保留体积校准** 以及 **一步完成终存储Buffer置换** 的核心操作。\n- **为什么 SEC 是高规格抗原的“照妖镜与终极抛光机”**：SDS-PAGE 加入了 SDS 和煮沸，会把几百个抱成一团的死蛋白聚体全部拆散成好看的“单一条带”；只有跑一针 SEC 分子筛，才能亲眼看到你的蛋白在天然溶液里究竟是 **死体积（V₀ ≈ 8 mL）的假可溶垃圾**，还是 **保留体积精准对称的真可溶活性二聚体/单体**！\n\n[SVG:sec_chromatogram]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【凝胶过滤分子筛（SEC: Superdex 200 / Superdex 75）】**：填料是布满纳米级微孔的葡聚糖-琼脂糖复合微球，不带任何电荷或亲和配基。\n  - **大分子**：钻不进微球的小孔，只能顺着微球之间的外部大缝隙走捷径，路程最短，**最先流出来**；\n  - **中等分子（目标蛋白）**：能钻进一部分微孔里绕路，路程适中，**居中洗脱**；\n  - **小分子（游离咪唑、麦芽糖、盐离子）**：钻遍所有微孔的角角落落，路程最长，**最后（约 1 CV ≈ 24 mL 处）才流出来**。\n  - *柱型选择*：`Superdex 75` 适合 **3–70 kDa** 的小蛋白/截短体；`Superdex 200` 适合 **10–600 kDa** 的中等/大蛋白及二聚体复合物（如 ~104 kDa 的 Ro52 天然二聚体或 ~190 kDa 的 MBP-Ro52 二聚体）。\n- **【外水死体积（V₀）可溶性聚集体切弃】**：微球外部缝隙的总液体体积称为死体积 V₀（对于标准的 24 mL `10/300 GL` 预装柱，**V₀ ≈ 8.0–8.5 mL**）。任何大于 600 kDa（Superdex 200）的蛋白多聚体或 MBP 假可溶微聚集体都会在 **8.0–8.5 mL 处集中涌出（Aggregate Peak）**——**这一峰哪怕在 SDS-PAGE 上也是目的条带，也必须 100% 切弃报废，绝不能混入主峰**！\n- **【天然寡聚态（如二聚体vs单体）保留体积校准】**：通过标准分子量蛋白（Marker：670 kDa 甲状腺球蛋白、158 kDa γ-球蛋白、44 kDa 卵清蛋白、17 kDa 肌红蛋白）标定洗脱体积曲线，验证靶蛋白在溶液中的真实表观分子量（例如 Ro52 单体理论 52 kDa，但在 Superdex 200 上洗脱位置约 **13.5–14.2 mL**，对应 ~105 kDa 的天然反平行二聚体，证明 Coiled-Coil 二聚化折叠完全正确）。\n- **【一步完成终存储Buffer置换】**：因为蛋白跑得比盐和咪唑快得多，用终存储 Buffer（如 20 mM HEPES pH 7.4, 150 mM NaCl, 0.5 mM TCEP）平衡分子筛柱，蛋白流出来时就已经自动换到了干净的终 Buffer 中，把咪唑和杂盐远远甩在 20–24 mL 的柱尾。\n\n---\n\n## **3. Superdex 10/300 GL 分子筛贵重柱铁律与维护 SOP**\n1. **上样体积硬红线（决定峰宽与分辨率）**：\n   - 分子筛不像亲和柱可以无限大体积上样！对于 24 mL 的 `10/300 GL` 分析/半制备柱，**单次上样体积必须 ≤ 500 µL（即 ≤ 2% CV，使用 500 µL 定量上样环）**；\n   - 上样前必须 **12,000 × g 4°C 离心 10 min**（严禁把微沉淀打进分子筛柱头筛板！）。\n2. **流速与耐压红线**：\n   - 标准流速 **0.5 mL/min**（若 Buffer 含 5%–10% 甘油，降至 **0.35–0.4 mL/min**）；\n   - **绝对禁止让气泡进入分子筛柱**！一旦进气泡，柱床会出现肉眼可见的裂缝，所有峰都会严重分叉拖尾。\n3. **日常保养与在位清洗（CIP）**：\n   - **每次用完**：过 **1.5 CV（36 mL）超纯水** → 过 **1.5 CV（36 mL）20% 乙醇**（流速降至 0.3 mL/min，因为 20% 乙醇与水混合放热且粘度高，防超压！），4°C 保存。\n   - **柱压升高或基线飘移时（CIP）**：以 **0.2 mL/min 反向或正向** 过 **0.5 CV（12 mL）0.5 M NaOH** → 立即过 **1.5 CV 超纯水** → **1.5 CV 缓冲液** 平衡。",
    "cases": [
      {
        "title": "项目实战案例：Superdex 200 切弃 8.2 mL 死体积聚体，挽救 Ro52 临床特异性",
        "tag": "实验室实战案例",
        "body": "- **对比实验**：将某批次 Ni-NTA 纯化后的 Ro52 浓缩至 500 µL 上 Superdex 200 Increase 10/300 GL，图谱出现两个峰：**Peak 1（8.2 mL，死体积聚体，占 28%）** 和 **Peak 2（13.8 mL，天然二聚体主峰，占 72%）**。\n- 分别拿 Peak 1 和 Peak 2 跑 SDS-PAGE，两条泳道位置一模一样（都是 52 kDa）！但拿去测 40 份正常人阴性血清：\n  - **Peak 1（8.2 mL 聚体）**：有 6 份正常人血清出现假阳性高本底（疏水聚集团块非特异粘附人 IgG）；\n  - **Peak 2（13.8 mL 二聚体主峰）**：40 份正常人血清本底全部极低（S/CO < 0.25），阳性血清梯度极佳！\n- **结论**：直接把“SEC 主峰占比 ≥ 90%、死体积聚集峰 100% 切弃”写入 Ro52 SOP 与 Gate R5 放行红线。"
      }
    ],

    "title": "体积排阻原理、外水死体积(V0≈8mL)假可溶聚体切弃与天然二聚体校准 (含图解)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **凝胶过滤分子筛（SEC: Superdex 200 / Superdex 75）** 的 **体积排阻“大分子走捷径先出、小分子钻微孔后出”原理**，学会识别并 **100%切弃外水死体积（V₀ ≈ 8.0–8.5 mL）假可溶聚集体峰**，只收集 **天然寡聚态（如Ro52二聚体 ~13.6 mL）活性主峰**。\n\n[SVG:sec_chromatogram]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【体积排阻“大分子走捷径先出、小分子钻微孔后出”原理】**：\n  - 分子筛微球内部布满纳米级迷宫微孔，不与蛋白发生任何吸附（等度洗脱 Isocratic Elution）：\n  - **超大分子 / 聚集体（> 600 kDa）**：体型太大，完全钻不进微球孔洞，只能顺着微球外面的大缝隙直通柱底，路程最短，**最先在死体积 V₀ 涌出**；\n  - **目标蛋白（如 ~108 kDa 的 Ro52 天然二聚体，或 ~52 kDa 单体）**：能钻进一部分微孔里绕路，**在柱中段（12–16 mL）按分子量从大到小依次对称出峰**；\n  - **小分子盐与咪唑（< 1 kDa）**：钻遍所有微孔的每一个角落，路程最长，**最后在总柱床体积 V_t（~24 mL）处才流出来**。\n- **【100%切弃外水死体积（V₀ ≈ 8.0–8.5 mL）假可溶聚集体峰】**：\n  - 对于实验室标准的 24 mL `Superdex 200 Increase 10/300 GL` 柱，微球外部缝隙总体积（外水体积 / 死体积 V₀）固定在 **8.0–8.5 mL** 处；\n  - **凡是在 8.0–8.5 mL 处跑出来的蛋白峰，哪怕它在还原 SDS-PAGE 上也是漂漂亮亮的 52 kDa 单一条带，它在天然溶液里也是几十个错误折叠分子死抱成一团的“假可溶微聚集体（Soluble Aggregates）”**！如果把这个峰混进成品里，包被磁珠后会非特异吸附正常人血清 IgG 造成成片假阳性——**必须 100% 切弃报废**！\n- **【天然寡聚态（如Ro52二聚体 ~13.6 mL）活性主峰】**：通过标准品曲线（K_av = [V_e - V₀ ÷ V_t - V₀] 对 logMW 作图）校准，仅收集保留体积精准对称的天然活性主峰。",
    "cases": [
      {
        "title": "项目实战案例：切弃 8.2 mL 死体积峰使 Ro52 在 40 例阴性血清中的假阳性从 15% 降为 0%",
        "tag": "实验室实战案例",
        "body": "- 对比同一批次在 Superdex 200 上的 `8.2 mL 死体积峰` 与 `13.8 mL 天然二聚体主峰`：两者 SDS-PAGE 完全相同，但 8.2 mL 峰在阴性血清盘中有 15% 假阳性且阳性信噪比低；切弃 8.2 mL 峰仅收 13.8 mL 主峰后，40 例阴性血清 100% 干净过关！"
      }

    "title": "SEC运行Buffer一步换液、≤500µL上样红线、防气泡压限与0.5M NaOH低流速保养",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 SEC 分子筛的 **一步置换终存储/偶联Buffer技巧**，死守贵重分子筛柱的 **单次上样体积≤500µL（≤2% CV）红线**、**12,000×g离心防堵与流速压限**，以及 **0.5M NaOH低流速CIP与20%乙醇保养 SOP**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【一步置换终存储/偶联Buffer技巧】**：\n  - 因为蛋白质在 13–15 mL 就跑出来了，而样品里原有的高盐、咪唑或麦芽糖要到 21–24 mL 才跑出来；\n  - 所以只要我们直接用 **下游偶联或终存储专用的无伯胺 Buffer（如 `20 mM HEPES 或 K-PBS pH 7.4, 150–300 mM NaCl, 0.5 mM TCEP, 20 µM ZnCl₂, 5% 甘油`）** 来平衡和运行 Superdex 200 柱，当蛋白主峰流出来时，它就已经 **100% 自动换好了干净的终 Buffer**，连后续透析除咪唑都省了！\n- **【单次上样体积≤500µL（≤2% CV）红线】**：\n  - 分子筛不挂柱，样品带进去有多宽，出来的峰就至少有多宽！\n  - 对于 24 mL 的 `10/300 GL` 柱，**单次上样体积必须控制在 200–500 µL（≤ 2% CV，使用 500 µL 上样环）**；如果样品有 2 mL，必须先超滤浓缩到 450 µL（或分 4 针跑），绝不能一次打 2 mL 进去（否则死体积峰和主峰会完全连成一片分不开）！\n- **【12,000×g离心防堵与流速压限】**：\n  - 浓缩后的高浓度蛋白上分子筛前，**必须在 4°C, 12,000 × g 离心 10 min** 吸取上清进样；\n  - 运行流速：**0.5 mL/min**（若 Buffer 含 5%–10% 甘油或跑 20% 乙醇时，因粘度增大，**必须将流速下调至 0.30–0.35 mL/min**，防止超过 3.0 MPa 压限压塌床层！）。\n- **【0.5M NaOH低流速CIP与20%乙醇保养 SOP】**：\n  - **日常每次用完**：以 **0.35 mL/min** 过 **1.5 CV（36 mL）脱气超纯水** → 再以 **0.30 mL/min** 过 **1.5 CV（36 mL）脱气 20% 乙醇** 封存；\n  - **定期在位清洗（CIP）**：以 **0.2–0.3 mL/min** 过 **0.5 CV（12 mL）0.5 M NaOH** 去除柱头吸附的疏水死蛋白 → 立即过 **1.5 CV 超纯水** → **1.5 CV Buffer 或 20% 乙醇**。",

    "title": "SEC运行Buffer一步换液、≤500µL上样红线、防气泡压限与0.5M NaOH低流速保养",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 SEC 分子筛的 **一步置换终存储/偶联Buffer技巧**，死守贵重分子筛柱的 **单次上样体积≤500µL（≤2% CV）红线**、**12,000×g离心防堵与流速压限**，以及 **0.5M NaOH低流速CIP与20%乙醇保养 SOP**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【一步置换终存储/偶联Buffer技巧】**：\n  - 因为蛋白质在 13–15 mL 就跑出来了，而样品里原有的高盐、咪唑或麦芽糖要到 21–24 mL 才跑出来；\n  - 所以只要我们直接用 **下游偶联或终存储专用的无伯胺 Buffer（如 `20 mM HEPES 或 K-PBS pH 7.4, 150–300 mM NaCl, 0.5 mM TCEP, 20 µM ZnCl₂, 5% 甘油`）** 来平衡和运行 Superdex 200 柱，当蛋白主峰流出来时，它就已经 **100% 自动换好了干净的终 Buffer**，连后续透析除咪唑都省了！\n- **【单次上样体积≤500µL（≤2% CV）红线】**：\n  - 分子筛不挂柱，样品带进去有多宽，出来的峰就至少有多宽！\n  - 对于 24 mL 的 `10/300 GL` 柱，**单次上样体积必须控制在 200–500 µL（≤ 2% CV，使用 500 µL 上样环）**；如果样品有 2 mL，必须先超滤浓缩到 450 µL（或分 4 针跑），绝不能一次打 2 mL 进去（否则死体积峰和主峰会完全连成一片分不开）！\n- **【12,000×g离心防堵与流速压限】**：\n  - 浓缩后的高浓度蛋白上分子筛前，**必须在 4°C, 12,000 × g 离心 10 min** 吸取上清进样；\n  - 运行流速：**0.5 mL/min**（若 Buffer 含 5%–10% 甘油或跑 20% 乙醇时，因粘度增大，**必须将流速下调至 0.30–0.35 mL/min**，防止超过 3.0 MPa 压限压塌床层！）。\n- **【0.5M NaOH低流速CIP与20%乙醇保养 SOP】**：\n  - **日常每次用完**：以 **0.35 mL/min** 过 **1.5 CV（36 mL）脱气超纯水** → 再以 **0.30 mL/min** 过 **1.5 CV（36 mL）脱气 20% 乙醇** 封存；\n  - **定期在位清洗（CIP）**：以 **0.2–0.3 mL/min** 过 **0.5 CV（12 mL）0.5 M NaOH** 去除柱头吸附的疏水死蛋白 → 立即过 **1.5 CV 超纯水** → **1.5 CV Buffer 或 20% 乙醇**。",
    "cases": [
      {
        "title": "项目实战案例：通入 20% 乙醇时自动降速至 0.3 mL/min 保护万元级 Superdex 200 柱",
        "tag": "实验室实战案例",
        "body": "- 水与 20% 乙醇混合瞬间会产生水合放热且粘度比纯水高 1.8 倍，若保持 0.5 mL/min 流速极易触发超压报警；在 AKTA 关机洗柱程序中将通 20% 乙醇步的流速固定设为 **0.30 mL/min**，柱压平稳维持在 1.4 MPa 安全区内。"
      }

    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 疏水层析、分子筛抛光与超滤换液 (五级拆解) / 透析与超滤浓缩(MWCO 1/3选型): 偶联禁忌Buffer置换与防膜吸附物料平衡",
    "title": "透析与超滤浓缩(MWCO 1/3选型): 偶联禁忌Buffer置换与防膜吸附物料平衡",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **超滤管MWCO 1/3选型法则**、**防浓差极化间隔吹打实操**、**三次10倍稀释换液公式** 以及 **超滤浓缩物料平衡核算**。\n- **为什么要防“浓差极化（Concentration Polarization）”**：超滤离心时，水分子穿过底部的滤膜流走，而蛋白质被甩在滤膜表面。如果不每隔 8–10 分钟停机拿移液器轻轻吹打混匀，滤膜表面那 0.1 mm 液层的局部蛋白浓度会飙升到 **50–100 mg/mL**，瞬间超过溶解度极限析出成不可逆的沉淀膜并堵死滤孔！\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【超滤管MWCO 1/3选型法则】**：超滤膜标称的 `30 kDa` 是指对球状蛋白有 90% 截留率，并非绝对孔径。因此：\n  - 对于 **52 kDa 的 Ro52（或 30–60 kDa 蛋白）**：必须选 **10 kDa 或 15 kDa MWCO** 的超滤管（若选 30 kDa 管，滤液里往往会漏掉 10%–15% 的靶蛋白）；\n  - 对于 **95 kDa 的 MBP-Ro52**：可选 **30 kDa MWCO** 超滤管。\n- **【防浓差极化间隔吹打实操】**：\n  1. **预润洗（Pre-rinse）**：新超滤管含微量甘油防腐剂，必须先加满终 Buffer 离心 5 min 润洗膜面；\n  2. **分段短时离心**：在 **4°C、3,500–4,000 × g** 下，**每次只离心 8–10 min**，取出观察液面，用移液器贴近膜上方（**严禁枪头戳破滤膜！**）轻轻吸打 3–5 次把膜表面的高浓蛋白吹散；\n  3. **滤液留底备查**：在测完浓缩液总蛋白质量并确认回收率 ≥ 85% 之前，**绝对不准倒掉下层收集管里的超滤滤液（Filtrate）**！（一旦膜破漏蛋白，蛋白全在下层滤液里，还能救回来）。\n- **【三次10倍稀释换液公式】**：若用超滤管进行 Buffer 置换（Diafiltration），比如将 250 mM 咪唑换成无咪唑偶联液：\n  - 每次从 10 mL 浓缩到 1 mL（10 倍浓缩），再补加新 Buffer 到 10 mL；\n  - 连续重复 **3 次（10 × 10 × 10 = 1,000 倍稀释）**，原有的 250 mM 咪唑就会降至 **0.25 mM**（去除率 99.9%）。\n- **【超滤浓缩物料平衡核算】**：超滤回收率 = [C(浓缩后) × V(浓缩后) ÷ C(浓缩前) × V(浓缩前)] × 100%。若低于 80%，必须检查下层滤液是否有蛋白漏出或膜面是否析出沉淀。\n\n---\n\n## **3. 下游偶联/包被工艺的 Buffer 禁忌红线表**\n| 下游应用工艺 | 终原液绝对禁止含有的成分 | 化学冲突原因 | 推荐终原液 Buffer |\n|---|---|---|---|\n| **NHS-Biotin 生物素化 / NHS 磁珠偶联** | **Tris、甘氨酸 (Glycine)、咪唑、硫酸铵、赖氨酸** | 均含游离伯胺（`-NH₂`），会直接抢走 NHS 活性酯使蛋白偶联失败 | **20 mM HEPES 或 PBS (pH 7.4–7.8)**, 150 mM NaCl |\n| **EDC/NHS 羧基胶乳微球 / 羧基磁珠偶联** | **Tris、甘氨酸、醋酸盐 (Acetate)、柠檬酸盐** | 伯胺抢活化酯；醋酸/柠檬酸含游离羧基（`-COOH`），会被 EDC 活化封死蛋白氨基 | **20 mM MES (pH 6.0–6.5)** 或 **PBS / HEPES (pH 7.2)** |\n| **HRP 辣根过氧化物酶标记 / 酶联反应** | **叠氮钠 (NaN₃)** | N₃⁻ 会直接配位毒化 HRP 活性中心的血红素铁离子，使酶彻底失活 | 含 ProClin 300 或无菌过滤的 PBS/HEPES |\n| **含 Zn²⁺ 指环结构域抗原 (如 Ro52)** | **EDTA / EGTA、高浓度咪唑 (>20 mM)** | 夺取 RING 结构域内的结构性 Zn²⁺，导致三明治构象坍塌 | 20 mM HEPES pH 7.4, 150 mM NaCl, 0.5 mM TCEP, **10–20 µM ZnCl₂** |",
    "cases": [
      {
        "title": "项目实战案例：建立超滤前“滤液暂存”规程挽回一整批 12 mg 抗原",
        "tag": "实验室实战案例",
        "body": "- 某次生产批在超滤浓缩时，其中一根 15 mL 超滤管存在出厂微裂纹，离心 10 min 后上层只剩 0.5 mL，浓度仅 0.4 mg/mL。由于严格执行了 **“未算完物料平衡不准倒下层滤液”** 的铁律，从下层收集管中成功找回全部 11.5 mg 漏出的蛋白，换新管重新浓缩后零损失交接。"
      }

  "learn.4.2.3": {
    "key": "learn.4.2.3",
    "path": "基础知识学习 / ④ 下游层析纯化与填料再生维护 (Downstream & Gate R5) / 疏水层析、分子筛抛光与超滤换液 (五级拆解) / 血源/真核原料低pH病毒灭活边界与单次小规格无菌分装留样",
    "title": "血源/真核原料低pH病毒灭活边界与单次小规格无菌分装留样",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：明确 **血源/真核原料低pH病毒灭活边界** 与原核重组蛋白的本质区别，并严格执行原液 **0.22µm无菌除粒过滤**、**单次小规格冻存分装** 与 **独立质控留样（Retention Sample）** 制度。\n- **为什么要小规格单次分装**：哪怕配了最好的防冻剂，一管 5 mL 的大包装原液如果被下游人员反复从 −80°C 拿出来化冻、吸 50 µL、再冻回去，超过 3–5 次后蛋白就会因为冰晶界面剪切和局部盐浓缩而聚集失活。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【血源/真核原料低pH病毒灭活边界】**：\n  - 来源于人血浆/血清、动物组织提取物或哺乳动物细胞（CHO/HEK293）分泌的单抗，有潜在包膜病毒传播风险，法规要求经过 **低 pH 孵育（pH 3.5–3.8 孵育 30–60 min）** 或 **有机溶剂/去垢剂（S/D）** 病毒灭活；\n  - **但对于大肠杆菌（E. coli）原核重组表达的诊断抗原**，大肠杆菌不携带感染人类的包膜病毒，且像 Ro52 这类含锌指和 Coiled-Coil 的脆弱胞内蛋白一旦降到 pH 3.6 会 **100% 脱锌变性报废**！因此原核重组抗原 **严禁套用低 pH 病毒灭活**，其安全控制点在于 **0.22 µm 除菌过滤与内毒素（LAL）达标**。\n- **【0.22µm无菌除粒过滤】**：分装前使用 **低蛋白吸附的 PES（聚醚砜）或 PVDF 材质 0.22 µm 针头滤器** 过滤原液（**严禁使用硝酸纤维素 NC 膜滤器**，NC 膜是做 Western 转膜专门吸蛋白的，一推过去蛋白全被滤膜吸光了！）。\n- **【单次小规格冻存分装】**：根据下游包被或生物素化单次投料量，按 **50 µg / 100 µg / 500 µg 每支（通常 50–200 µL/支）** 分装于低吸附螺口冻存管，标注 `Use-Once（单次开启即用，避免反复冻融）`。\n- **【独立质控留样（Retention Sample）】**：每批成品原液入库前，必须单独抽出 **至少 3–5 支最小包装** 贴上绿色《QC 留样签》，存入专用的 −80°C 留样盒，仅用于长期稳定性追踪和未来客户投诉/批间差异仲裁，研发日常严禁动用。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **分装入库必查**：① 滤器材质记录（PES/PVDF）；② 分装总支数、单支装量、QC 留样支数及 −80°C 冰箱层架盒位坐标完整录入台账。",
    "cases": [
      {
