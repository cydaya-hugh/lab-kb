.nb-case-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

    "title": "5. 记录真实性：审核中最致命的一类",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「5. 记录真实性：审核中最致命的一类」梳理关键控制要求，重点涵盖 **红线**、**已发现的情形（03 R1）**、**处置方向（03 建议）** 等核心要素（来源：`ISO9001体系管理要点_草案V0.1_20261106.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【红线】**：原始数据先于记录；不预填；不补造签名；不倒签日期；不覆盖原数据；返工不换批号。\n- **【已发现的情形（03 R1）】**：事后生成的“模拟”记录；跨年数值完全一致的 CoA；稳定性时间不成立；逐格相同的供方评估和满意度表；同日同人保养多台设备。\n- **【处置方向（03 建议）】**：先隔离，再确认是否已提交给客户或审核员，已提交的要书面说明；历史产品采用“回顾性技术文件”如实写明；未采集的指标写“待验证”。\n- **【LabOS 的作用】**：限制编辑权限、保留版本历史、原始文件作为附件、签署证据、服务器时间戳，让造假在系统里“做不到”，而不是靠人自觉。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `ISO9001体系管理要点_草案V0.1_20261106.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n03 号文件把“记录真实性（数据完整性 ALCOA+）”列为第一优先事项。管理者需要记住：\n\n- **红线**：原始数据先于记录；不预填；不补造签名；不倒签日期；不覆盖原数据；返工不换批号。\n- **已发现的情形（03 R1）**：事后生成的“模拟”记录；跨年数值完全一致的 CoA；稳定性时间不成立；逐格相同的供方评估和满意度表；同日同人保养多台设备。\n- **处置方向（03 建议）**：先隔离，再确认是否已提交给客户或审核员，已提交的要书面说明；历史产品采用“回顾性技术文件”如实写明；未采集的指标写“待验证”。\n- **LabOS 的作用**：限制编辑权限、保留版本历史、原始文件作为附件、签署证据、服务器时间戳，让造假在系统里“做不到”，而不是靠人自觉。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「6. 审核准备清单（客户审核与监督审核）」梳理关键控制要求，重点涵盖 **事项**、**客户审核台账**、**常驻审核资料包** 等核心要素（来源：`ISO9001体系管理要点_草案V0.1_20261106.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【事项】**：做法（来源）\n- **【客户审核台账】**：亚辉龙、迈克、科华、浩欧博的结论、不符合项、整改记录需存档；三次审核反复被索要同类记录（03 R8）\n- **【常驻审核资料包】**：校准、批记录、培训、供方、返工、设计开发；每季度用最新真实批次刷新（03 R8）\n- **【监督审核前】**：文件主索引、体系文件签发、NCR 关闭证据、供应商管理程序按 8 人规模重写（03 R5）\n- **【扩项】**：评估营业执照和证书范围增加“生产”（03 R2，待确认）\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `ISO9001体系管理要点_草案V0.1_20261106.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n| 事项 | 做法（来源） |\n|---|---|\n| 客户审核台账 | 亚辉龙、迈克、科华、浩欧博的结论、不符合项、整改记录需存档；三次审核反复被索要同类记录（03 R8） |\n| 常驻审核资料包 | 校准、批记录、培训、供方、返工、设计开发；每季度用最新真实批次刷新（03 R8） |\n| 监督审核前 | 文件主索引、体系文件签发、NCR 关闭证据、供应商管理程序按 8 人规模重写（03 R5） |\n| 扩项 | 评估营业执照和证书范围增加“生产”（03 R2，待确认） |\n| 与 ISO 13485 的关系 | 客户普遍按 13485 运行，路线图建议评估（04）；墨肽体系是 13485 体例，可作参考，但能否引用其文件待确认（G 笔记） |",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「① 调研与立项」梳理关键控制要求，重点涵盖 **① 调研与立项**、**技术来源是否清楚**、**① 调研与立项** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 目标是不是写成了**可检验的指标**（数值 + 用什么方法测），而不是“完成转化”这类说法。\n- 技术来源是否清楚：自研，还是转移、委托、外购？有没有授权或合同？\n- 客户的硬要求有没有写进来（例如剩余效期、运输温度）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【① 调研与立项】**：目标是不是写成了**可检验的指标**（数值 + 用什么方法测），而不是“完成转化”这类说法。\n- **【技术来源是否清楚】**：自研，还是转移、委托、外购？有没有授权或合同？\n- **【① 调研与立项】**：客户的硬要求有没有写进来（例如剩余效期、运输温度）。\n- **【① 调研与立项】**：把一篇文献的结论直接当作“已验证技术”写进立项书。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：在动手做之前，先弄清三件事：这个材料给谁用、要达到什么指标、技术从哪来。相当于项目的“可行性论证 + 立项审批”。做错的代价最大，因为后面所有工作都建立在这一步上。\n\n**该盯什么**\n- 目标是不是写成了**可检验的指标**（数值 + 用什么方法测），而不是“完成转化”这类说法。\n- 技术来源是否清楚：自研，还是转移、委托、外购？有没有授权或合同？\n- 客户的硬要求有没有写进来（例如剩余效期、运输温度）。\n\n**常见翻车点**\n- 把一篇文献的结论直接当作“已验证技术”写进立项书。\n- 技术来自外单位却没有授权文件（dsDNA、RF 工艺均有此风险，见风险清单 R10）。\n- LabOS 里 dsDNA-Ag 的“当期目标”写的是“新工艺完成转化”，没有指标数值和检测方法，后面无法判断做没做到。\n\n**可以问团队**\n1. 这个项目的验收指标有哪几条？每条用什么方法测、多少算合格？\n2. 这项技术的来源是什么？有没有授权或转让文件？\n3. 客户有哪些硬性要求（效期、运输、规格）？写进立项书了吗？",
    "cases": [
      {
        "title": "工序 ① 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| RD01–RD03 立项指标 | RD01 自身免疫抗原（dsDNA ≥0.8 mg/mL、A260/280 1.75–1.90、3 批 CV ≤8%；CCP HPLC ≥90%、MW 2500±10 Da）；RD02 动物疫病抗原（纯度 ≥95%、≥1.0 mg/mL、≥2 家企业书面反馈）；RD03 CCP 胶乳半成品 | E1，全景 §5.2 | 哪些指标写清了检测方法？哪些只写了数值？ |\n| 亚辉龙 DNA-Ag 05 | 要求到货剩余效期 ≥24 个月、2–8 ℃ 运输 | E2，全景 §5.1 | 这个要求应在立项时写进哪一项？对 ⑧ 意味着什么？ |\n| 技术来源 | dsDNA 工艺\"疑来自宁波赛珀\"；RF 酶切工艺\"转移自赛珀 SG\"；部分文件改名为 CYDAYA-QP，但正文仍是赛珀 | E1，全景 §5.1；风险清单 R10 | 立项时缺授权或转让合同，R1 能不能过？ |\n| IgG4、Z110 立项与合同顺序 | 合同先于或紧跟立项；设计记录有改日期的两个版本 | E1，风险清单 R1 | 立项文件的日期应以什么为准？ |"

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「② 分子与材料设计」梳理关键控制要求，重点涵盖 **设计文件是否写清分子形式（尤其抗**、**② 分子与材料设计**、**② 分子与材料设计** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 设计文件是否写清分子形式（尤其抗体：鼠源、嵌合、人源化）。\n- 序列文件有没有版本号，后续每一批是否引用同一版本。\n- 验收标准是否在实验开始前就定好了。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【设计文件是否写清分子形式（尤其抗】**：鼠源、嵌合、人源化）。\n- **【② 分子与材料设计】**：序列文件有没有版本号，后续每一批是否引用同一版本。\n- **【② 分子与材料设计】**：验收标准是否在实验开始前就定好了。\n- **【对外名称与实际分子不一致】**：SAA 对外有“人源化、嵌合、杂交瘤”三种说法，IgG4 名称写“鼠抗人”（风险清单 R4）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把“要什么”翻译成“做什么样的分子”：用全长还是截短、加不加标签、怎样让抗体最容易“抓住”它。这一步还要**提前**定好怎么验收，不能做完再改标准。\n\n**该盯什么**\n- 设计文件是否写清分子形式（尤其抗体：鼠源、嵌合、人源化）。\n- 序列文件有没有版本号，后续每一批是否引用同一版本。\n- 验收标准是否在实验开始前就定好了。\n\n**常见翻车点**\n- 对外名称与实际分子不一致：SAA 对外有“人源化、嵌合、杂交瘤”三种说法，IgG4 名称写“鼠抗人”（风险清单 R4）。\n- 看到结果后再回头调整通过标准。\n- 设计文件事后一天补齐、日期倒填（风险清单 R1）。\n\n**可以问团队**\n1. 这个分子的准确名称和分子形式是什么？客户资料里是否一致？\n2. 序列文件是哪个版本？存在哪里？\n3. 验收标准是什么时候定的？之后有没有改过？",

    "title": "③ 构建与原料准备",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「③ 构建与原料准备」梳理关键控制要求，重点涵盖 **③ 构建与原料准备**、**③ 构建与原料准备**、**③ 构建与原料准备** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【③ 构建与原料准备】**：种子有没有建档（来源、版本、测序报告、冻存位置）。\n- **【③ 构建与原料准备】**：外购物料的供方是否在合格名录里，来料有没有检验。\n- **【③ 构建与原料准备】**：领用的物料是否合格、在效期内。\n- **【③ 构建与原料准备】**：供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把设计变成“可靠的起点”：测序确认序列没错的菌种、建档保存的种子，以及外购的关键原料（合成肽、IgG 粗品、酶、填料）。起点不可靠，后面做得再好也白做。\n\n**该盯什么**\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n**常见翻车点**\n- 供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n- 批记录里“起始物料”这一步没登记（LabOS 页面显示：导入的批记录没有这一步）。\n- 中间品批号重复使用（26-001/26-003 用于不同物料，风险清单 R12）。\n\n**可以问团队**\n1. 这批用的种子编号是什么？测序报告在哪？\n2. 外购的关键物料来自哪个供方？到货检验记录在哪？\n3. 起始物料批号有没有登记到批记录里？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「③ 构建与原料准备」梳理关键控制要求，重点涵盖 **③ 构建与原料准备**、**③ 构建与原料准备**、**③ 构建与原料准备** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【③ 构建与原料准备】**：种子有没有建档（来源、版本、测序报告、冻存位置）。\n- **【③ 构建与原料准备】**：外购物料的供方是否在合格名录里，来料有没有检验。\n- **【③ 构建与原料准备】**：领用的物料是否合格、在效期内。\n- **【③ 构建与原料准备】**：供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把设计变成“可靠的起点”：测序确认序列没错的菌种、建档保存的种子，以及外购的关键原料（合成肽、IgG 粗品、酶、填料）。起点不可靠，后面做得再好也白做。\n\n**该盯什么**\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n**常见翻车点**\n- 供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n- 批记录里“起始物料”这一步没登记（LabOS 页面显示：导入的批记录没有这一步）。\n- 中间品批号重复使用（26-001/26-003 用于不同物料，风险清单 R12）。\n\n**可以问团队**\n1. 这批用的种子编号是什么？测序报告在哪？\n2. 外购的关键物料来自哪个供方？到货检验记录在哪？\n3. 起始物料批号有没有登记到批记录里？",

    "title": "④ 制备：扩增、表达或合成",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「④ 制备：扩增、表达或合成」梳理关键控制要求，重点涵盖 **④ 制备：扩增、表达或合**、**④ 制备：扩增、表达或合**、**④ 制备：扩增、表达或合** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 记录是否及时（LabOS 上“待补”行是否长期堆积）。\n- 产量是否与“标准速率”对得上，近期是否偏低。\n- 不同条件的比较是否有对照、取样是否可比。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【④ 制备：扩增、表达或合】**：记录是否及时（LabOS 上“待补”行是否长期堆积）。\n- **【④ 制备：扩增、表达或合】**：产量是否与“标准速率”对得上，近期是否偏低。\n- **【④ 制备：扩增、表达或合】**：不同条件的比较是否有对照、取样是否可比。\n- **【④ 制备：扩增、表达或合】**：两个诱导条件取样量不一致就下结论。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：用细菌、哺乳细胞或 PCR 把目标产物“做出来”。关键不在做出来，而在**能证明条件之间的差别是真的**：比较时取样要等比例，否则结论不可信。\n\n**该盯什么**\n- 记录是否及时（LabOS 上“待补”行是否长期堆积）。\n- 产量是否与“标准速率”对得上，近期是否偏低。\n- 不同条件的比较是否有对照、取样是否可比。\n\n**常见翻车点**\n- 两个诱导条件取样量不一致就下结论。\n- 上游记录拖着不补：D10-01 页面显示上游有待补行、下游有待补 10 行。\n- 表达量波动很大（SAA 表达量 85–135 mg/L）却没有记录能解释波动的参数。\n\n**可以问团队**\n1. 这批的关键条件参数是什么？和上一批比有什么变化？\n2. 上清和沉淀是不是等比例取样跑的胶？\n3. 近期速率低于标准，原因找过吗？",

        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| SAA/IgG 瞬转 | 293F；DNA 1 µg/mL；DNA:PEI = 1:3；D1 补 5% Feed + 1% 葡萄糖；第 6 天收获；表达量 85–135 mg/L | E1，全景 §5.1、§5.3 | 表达量波动这么大，应记录哪些参数来解释？ |\n| 原核表达通用条件 | LB/TB；OD600 0.65–0.89 诱导；可溶性差时 16 ℃、IPTG 0.1–0.4 mM；超声 400 W 3 s/2 s 40 min | E1，全景 §5.3 | 比较 16 ℃ 和 37 ℃ 时，取样要怎样做才可比？ |\n| dsDNA PCR | 100 µL 体系，EasyTaq，引物 0.25 µM，模板 200 ng；94 ℃ 4 min →（94 ℃ 30 s / 54 ℃ 30 s / 72 ℃ 3 min 10 s）×30 → 72 ℃ 4 min | E1，全景 §5.3 | 按常用的 Taq 延伸经验值（约 1 kb/min，E3，以所用酶的说明书为准），3 min 10 s 延伸对约 5000 bp 产物是否足够？现行程序的依据是什么？ |\n| 程新秀 2025 年真核转染 | 126 次，成功率 92% | E1，全景 §3 | 这类统计可以成为 LabOS 里的\"标准速率\"吗？ |\n| LabOS 中 D10 上游进度 | 仪表盘显示 D10-01 上游\"63/65 板\"（2026-11-04 查看） | LabOS | 板数和产量的对应关系应记录在哪里？ |"

    "title": "⑤ 纯化与样品处理（可重复调用）",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑤ 纯化与样品处理（可重复调用）」梳理关键控制要求，重点涵盖 **⑤ 纯化与样品处理（可重**、**⑤ 纯化与样品处理（可重**、**⑤ 纯化与样品处理（可重** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每一步的回收率有没有记，损失能不能解释。\n- 最终拿到的结果是否来自一致的操作，而不是挑了最好的一次。\n- 原料是不是血浆或细胞来源（如人 IgG），需要病原风险评估。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑤ 纯化与样品处理（可重】**：每一步的回收率有没有记，损失能不能解释。\n- **【⑤ 纯化与样品处理（可重】**：最终拿到的结果是否来自一致的操作，而不是挑了最好的一次。\n- **【⑤ 纯化与样品处理（可重】**：原料是不是血浆或细胞来源（如人 IgG），需要病原风险评估。\n- **【⑤ 纯化与样品处理（可重】**：只挑最好看的胶图当结果，不记各步回收。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：从一锅混合物里把目标“钓”出来并洗干净。方法有三类思路：按**特异结合**钓（亲和）、按**大小**分（分子筛）、按**电荷或疏水性**分。纯化可以反复用，例如表达后捕获、切掉标签后再纯化、修饰后清除残留，都算纯化。\n\n**该盯什么**\n- 每一步的回收率有没有记，损失能不能解释。\n- 最终拿到的结果是否来自一致的操作，而不是挑了最好的一次。\n- 原料是不是血浆或细胞来源（如人 IgG），需要病原风险评估。\n\n**常见翻车点**\n- 只挑最好看的胶图当结果，不记各步回收。\n- RF 酶切抗原的人 IgG 原料没有病原筛查（风险清单 R6）。\n- 日报写“静丙酶切一直在纯化”，系统里却标“暂停”（LabOS 仪表盘 AI 提示，需例会确认）。\n\n**可以问团队**\n1. 每一步的回收率是多少？总回收多少？\n2. 这一步是为了去掉什么杂质？怎么证明去掉了？\n3. 原料来自哪里？需不需要病原筛查？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑦ 质量与用途验证」梳理关键控制要求，重点涵盖 **⑦ 质量与用途验证**、**⑦ 质量与用途验证**、**⑦ 质量与用途验证** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每个质量属性有没有适合的方法（小肽不能只靠 SDS-PAGE）。\n- 检验的人和放行的人是不是分开。\n- 检测用的设备是否在校准有效期内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑦ 质量与用途验证】**：每个质量属性有没有适合的方法（小肽不能只靠 SDS-PAGE）。\n- **【⑦ 质量与用途验证】**：检验的人和放行的人是不是分开。\n- **【⑦ 质量与用途验证】**：检测用的设备是否在校准有效期内。\n- **【⑦ 质量与用途验证】**：CoA 上写的是实测值，还是只写“≥90%”。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：确认做出来的东西“是什么、有多少、纯不纯”，并且在客户用途里“真的能用”。最关键的是：**检测方法要适合这种材料**，合格标准要在测之前就定好。\n\n**该盯什么**\n- 每个质量属性有没有适合的方法（小肽不能只靠 SDS-PAGE）。\n- 检验的人和放行的人是不是分开。\n- 检测用的设备是否在校准有效期内。\n- CoA 上写的是实测值，还是只写“≥90%”。\n\n**常见翻车点**\n- CCP 标准写 HPLC 和质谱，实际只检外观、溶解性、SDS-PAGE。\n- 检验与放行是同一个人；CoA 没有批准人签名（风险清单 R6）。\n- 外检设备校准已过期（墨肽台账外检 2026-05-19 到期）。\n\n**可以问团队**\n1. 这个指标用什么方法测？这个方法适合这种材料吗？\n2. 这份检验结果是谁测的、谁复核的、谁放行的？\n3. 用的设备校准到什么时候？",

  "iso.3.7": {
    "key": "iso.3.7",
    "path": "实验室 ISO 体系管理 / 各工序的控制点与异常处理 / ⑧ 优化、稳定性与放大",
    "title": "⑧ 优化、稳定性与放大",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑧ 优化、稳定性与放大」梳理关键控制要求，重点涵盖 **⑧ 优化、稳定性与放大**、**⑧ 优化、稳定性与放大**、**⑧ 优化、稳定性与放大** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 声明的效期有没有实时数据支撑。\n- 优化是不是在独立样本上也有效，而不只是在开发样本上。\n- 至少 3 批的一致性有没有按同一方法比较。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑧ 优化、稳定性与放大】**：声明的效期有没有实时数据支撑。\n- **【⑧ 优化、稳定性与放大】**：优化是不是在独立样本上也有效，而不只是在开发样本上。\n- **【⑧ 优化、稳定性与放大】**：至少 3 批的一致性有没有按同一方法比较。\n- **【⑧ 优化、稳定性与放大】**：都写“6 个月长期稳定性”，但批次生产后仅约 1 个月（风险清单 R1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把“能做出来”变成“每批都一样、放得住、能放大”。**稳定性**就是产品放多久不坏；**放大**就是批量变大后性能不变。结论必须有时间做依据，不能超过实际观察过的时间。\n\n**该盯什么**\n- 声明的效期有没有实时数据支撑。\n- 优化是不是在独立样本上也有效，而不只是在开发样本上。\n- 至少 3 批的一致性有没有按同一方法比较。\n\n**常见翻车点**\n- 都写“6 个月长期稳定性”，但批次生产后仅约 1 个月（风险清单 R1）。\n- 声明效期 24–36 个月，却没有实时稳定性数据（风险清单 R7），而亚辉龙要求到货剩余效期 ≥24 个月。\n- 三个项目共用同一组批间数据。\n\n**可以问团队**\n1. 效期的依据是什么？实时数据已经做了多长时间？\n2. 这个改进在没用过的样本上验证过吗？\n3. 3 批的一致性数据是各自独立的原始数据吗？",
    "cases": [
      {
        "title": "工序 ⑧ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| RD01 稳定性指标 | 2–8 ℃ 7 天、冻融 3 次后保持率 ≥90%；3 批 CV ≤8% | E1，全景 §5.2 | 7 天数据能支持多长的效期？ |\n| \"6 个月稳定性\" | SAA、dsDNA、B2mg 的确认评审都称有 6 个月长期稳定性，但批次生产后只过了约 1 个月 | E1，风险清单 R1 | 这类结论应怎样更正？对已给客户的资料怎么办？ |\n| 声明效期无依据 | 声明 24–36 个月，无实时稳定性数据；亚辉龙要求剩余效期 ≥24 个月 | E1、E2，风险清单 R7 | 风险清单建议什么？数据出来前对外应如何表述？ |\n| 批间数据共用 | 三个项目共用同一组数字（批间 CV 纯度 1.1%、ELISA 7.2%） | E1，风险清单 R1 | 批间一致性报告应附哪些原始数据？ |\n| dsDNA 产能 | 月产能 70–80 mg | E1，全景 §5.1 | 产能数据是否足以支撑放大决策？ |\n| 液氮与冰箱监控 | 液氮罐液位事故延迟 4 天上报；冰箱、液氮无连续监控报警 | E1，风险清单 R11 | 储存条件失控对稳定性结论有什么影响？ |"
      }

    "path": "实验室 ISO 体系管理 / 各工序的控制点与异常处理 / ⑩ 批生产与偏差",
    "title": "⑩ 批生产与偏差",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑩ 批生产与偏差」梳理关键控制要求，重点涵盖 **⑩ 批生产与偏差**、**⑩ 批生产与偏差**、**⑩ 批生产与偏差** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 五个控制点 G0 开工、G1 上游交接、G2 半成品转序、G3 成品放行、G4 发货，是否一个都没跳过。\n- 入库只是“收下”，不等于“放行”。\n- 偏差有没有登记、分级、有结论。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑩ 批生产与偏差】**：五个控制点 G0 开工、G1 上游交接、G2 半成品转序、G3 成品放行、G4 发货，是否一个都没跳过。\n- **【⑩ 批生产与偏差】**：入库只是“收下”，不等于“放行”。\n- **【⑩ 批生产与偏差】**：偏差有没有登记、分级、有结论。\n- **【⑩ 批生产与偏差】**：把入库签收当成放行，没放行就发货。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：按已批准的指令，做出一批**有据可查、经过放行**的成品。核心是三条：**每一步留记录、每个异常先停下、放行由专人签字**。LabOS 的批记录模块就是这道工序的主战场。\n\n**该盯什么**\n- 五个控制点 G0 开工、G1 上游交接、G2 半成品转序、G3 成品放行、G4 发货，是否一个都没跳过。\n- 入库只是“收下”，不等于“放行”。\n- 偏差有没有登记、分级、有结论。\n\n**常见翻车点**\n- 把入库签收当成放行，没放行就发货。\n- 记录事后补写或批量生成（86 份“模拟”缓冲液配制记录，风险清单 R1）。\n- 批次已过交期、多个步骤过了计划日期，但没有人提出调整（如 D10-01 的页面提示）。\n\n**可以问团队**\n1. 这批现在走到哪个控制点？每个控制点的证据在哪？\n2. 这批有没有偏差？是怎么分级和处理的？\n3. 每个人做了什么：谁做的、谁复核的、谁放行的？",
    "cases": [
      {
        "title": "工序 ⑩ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 证据 | 讨论题 |\n|---|---|---|---|\n| dsDNA D10：第一个全链路真实批 | 路线图建议选 D10（生产指令 2026-09-15，100 mg，交期 10-30）作为第一个按 G0–G4 留全部原始数据的批次 | `04_世界一流路线图.md` | 这批在 LabOS 里的 G0–G4 证据齐不齐？缺哪个？ |\n| 86 份\"模拟\"缓冲液配制记录 | 事后按规则生成；2024 年记录引用 2025 年的 SOP；实测值恰好等于目标值 | 风险清单 R1 | 哪些迹象说明这不是原始记录？LabOS 怎样从系统上防止？ |\n| 中间品批号重复 | 26-001/26-003 被用于不同物料；批号没有产品前缀 | 风险清单 R12 | 按父子批规则应该怎样编号？ |\n| dsDNA 同一批两份检验记录 | 同一批 251201 有 docx、xlsx 两种半成品检验记录，项目和限值不同 | 流转计划 §9、S8 | 以哪份为准？产品主数据应由谁核定？ |\n| 审核时提交他司格式的批记录 | 浩欧博审核时提交的批记录实为墨肽格式，其中有返工批 | 全景 §5.1 | 返工批需要哪些记录才算完整？ |"

仓管 + 销售 | 销售出库单 SW-FM-005 | 进入 ⑪ |\n\n### Gate 四件套\n\n| Gate | 检查方法 | 通过依据 | 未通过 → 去向 | 交付物 |\n|---|---|---|---|---|\n| G0 | 开工检查表逐项核对 | 物料合格且在效期；设备校准有效；文件现行；人员已培训；清场合格 | 不开工；补齐条件，或改指令版本 | 签字的开工检查 |\n| G1 | 实物与交接单逐容器核对 | 身份、数量、状态、条件、时限一致 | 冻结 → 偏差（⑩.3） | 双签交接单 |\n| G2 | 半成品检验 + 原始数据复核 | 达到该产品半成品 QC-SIP 规定的限值（**不能用\"符合 ISO 9001\"替代产品指标**，流转计划 §5.2） | 不合格 → QA-OP-008 处置；需要调查的 → ⑫ | 半成品检验记录 + 转序审批 |\n| G3 | 管代复核整批资料 | 全项合格；偏差已关闭或已评估；CoA、标签、库存批号三者一致 | 不放行；按 QA-OP-008 让步、返工或报废 | 放行单 + CoA |\n| G4 | 出库核对 | 只有\"成品已放行\"状态可发；冻结、超期、退货、未批准品一律不可发 | 停发，查明原因 | 出库单 + 运单 |",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「偏差与不合格」梳理关键控制要求，重点涵盖 **停**、**隔离与标识**、**报告** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 前提：不合格评审已决定返工。由项目部提出返工申请，写明不合格内容、返工工艺与原工艺的差异、预期指标、风险评估。\n- 审批：技术可行性和风险评估后，由**管代批准**。\n- 次数：原则上同一批**不超过 1 次**；多次返工需总经理批准。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【停】**：发现人立即停止相关生产、发料或发货（PM-OP-001 §4.4.3）。\n- **【隔离与标识】**：受影响物料改为\"冻结\"状态，移到隔离位置；保全原始记录。\n- **【报告】**：通知 QC、管代和批次负责人。\n- **【调查】**：QC/技术人员评估对质量的影响；调取批记录、检验记录、留样。\n- **【处置】**：管代批准以下之一：继续流转、复检、返工、让步接收、降级、报废、退货（QA-OP-008 §4.3.2）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n### 必须立即暂停流转的情形（流转计划 §7.1）\n批号或标签不清；实物与记录不符；数量差异无法解释；容器破损；有污染疑虑；温度或时限超限；检验不合格；资料不全；未经批准的变更。\n\n### 处理步骤\n1. **停**：发现人立即停止相关生产、发料或发货（PM-OP-001 §4.4.3）。\n2. **隔离与标识**：受影响物料改为\"冻结\"状态，移到隔离位置；保全原始记录。\n3. **报告**：通知 QC、管代和批次负责人。\n4. **调查**：QC/技术人员评估对质量的影响；调取批记录、检验记录、留样。\n5. **处置**：管代批准以下之一：继续流转、复检、返工、让步接收、降级、报废、退货（QA-OP-008 §4.3.2）。\n6. **关联**：偏差编号写进批记录和放行单；需要根因调查的转 ⑫。\n\n### 偏差分级（建议）\n现行 PM-OP-001 引用的《异常偏差处理规程》PM-SMP-006 **尚未建立**（风险清单 R5）。在建立之前，建议先用 QA-OP-005 的风险值 R = S × P（S、P 各 1–5 级）来分级：\n\n> **已起草**：`00 AI 工作区/待审核/PM-SMP-006 异常偏差处理规程_草案V0.1_20261104.docx`（2026-11-04，AI 起草，待人工审核）。含 S、P 分级描述（建议）、直接判为重大的条件、检验结果异常的调查、处置与关闭要求，附流程表、偏差报告单和台账样式。下表为摘要，以规程为准。\n\n| R 值 | 等级（QA-OP-005） | 偏差处理建议 |\n|---|---|---|\n| R ≤ 4 | 低 | 记录 + 批次负责人处置 + QC 确认；按季度汇总趋势 |\n| 5–9 | 中 | 必须调查原因；管代批准处置；评估是否开 CAPA |\n| R ≥ 10 | 高 | 必须开 CAPA；管代组织评审；影响已放行或已发货批次时转 ⑪/⑫ 评估客户通知或召回；重大偏差由总经理决策（PM-OP-001 §3） |\n\n### 返工（PM-OP-004）\n- 前提：不合格评审已决定返工。由项目部提出返工申请，写明不合格内容、返工工艺与原工艺的差异、预期指标、风险评估。\n- 审批：技术可行性和风险评估后，由**管代批准**。\n- 次数：原则上同一批**不超过 1 次**；多次返工需总经理批准。\n- 标识：\"返工品 - 原批号 - 返工日期\"，与正常品分区存放。\n- 放行：返工后重新做**完整**成品检验；必要时加做稳定性观察；客户要求时在 CoA 上注明返工批。\n- 每一次返工都要按 QA-OP-009 做根因调查（转 ⑫）。\n\n### 让步与紧急放行\n- 流转计划**不设常规\"紧急放行\"通道**。但 PM-OP-002 §4.2.2 写有\"紧急放行\"，两份文件冲突，待统一。\n- 让步放行：原则上需要**客户书面同意 + 管代签字**；QA-OP-011 §4.4 仍是\"待人工确认\"状态，规则定下来之前不应使用。",

    "title": "批号、批次关系与追溯",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「批号、批次关系与追溯」梳理关键控制要求，重点涵盖 **批号、批次关系与追溯**、**批号、批次关系与追溯**、**批号、批次关系与追溯** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 原辅料的供方、批号、入库日期、检验结果；\n- 每道工序的操作人、复核人、关键参数；\n- 检验人、放行人、放行日期；\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【批号、批次关系与追溯】**：原辅料的供方、批号、入库日期、检验结果；\n- **【批号、批次关系与追溯】**：每道工序的操作人、复核人、关键参数；\n- **【批号、批次关系与追溯】**：检验人、放行人、放行日期；\n- **【批号、批次关系与追溯】**：发给了哪个客户、发货日期、CoA 编号。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**追溯链**（PM-OP-002 §4.4）：采购入库单 → 原辅料检验记录 → 领料单 → 批生产记录 → 半成品/成品检验记录 → CoA → 出货单 → 销售合同 → 客户收货与反馈。\n\n任意一批成品都应能查到：\n- 原辅料的供方、批号、入库日期、检验结果；\n- 每道工序的操作人、复核人、关键参数；\n- 检验人、放行人、放行日期；\n- 发给了哪个客户、发货日期、CoA 编号。\n\n**父子批规则**（流转计划 §6.2）：\n- 同一半成品分几次分装，要保留父批号和每次的子批号。\n- 不同来源的批次不得自行合批。确需合批的，须事先批准，并登记全部父批号、投入比例、依据和检验要求。\n\n**物料平衡**（流转计划 §6.2）：\n可核算投入量 ＝ 成品量 ＋ 检验取样量 ＋ 留样量 ＋ 可回收余量 ＋ 已记录损耗。\n差额必须解释；体积、质量、容器数分别核算；取样和留样不能重复计数。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「批号、批次关系与追溯」梳理关键控制要求，重点涵盖 **批号、批次关系与追溯**、**批号、批次关系与追溯**、**批号、批次关系与追溯** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 原辅料的供方、批号、入库日期、检验结果；\n- 每道工序的操作人、复核人、关键参数；\n- 检验人、放行人、放行日期；\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【批号、批次关系与追溯】**：原辅料的供方、批号、入库日期、检验结果；\n- **【批号、批次关系与追溯】**：每道工序的操作人、复核人、关键参数；\n- **【批号、批次关系与追溯】**：检验人、放行人、放行日期；\n- **【批号、批次关系与追溯】**：发给了哪个客户、发货日期、CoA 编号。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**追溯链**（PM-OP-002 §4.4）：采购入库单 → 原辅料检验记录 → 领料单 → 批生产记录 → 半成品/成品检验记录 → CoA → 出货单 → 销售合同 → 客户收货与反馈。\n\n任意一批成品都应能查到：\n- 原辅料的供方、批号、入库日期、检验结果；\n- 每道工序的操作人、复核人、关键参数；\n- 检验人、放行人、放行日期；\n- 发给了哪个客户、发货日期、CoA 编号。\n\n**父子批规则**（流转计划 §6.2）：\n- 同一半成品分几次分装，要保留父批号和每次的子批号。\n- 不同来源的批次不得自行合批。确需合批的，须事先批准，并登记全部父批号、投入比例、依据和检验要求。\n\n**物料平衡**（流转计划 §6.2）：\n可核算投入量 ＝ 成品量 ＋ 检验取样量 ＋ 留样量 ＋ 可回收余量 ＋ 已记录损耗。\n差额必须解释；体积、质量、容器数分别核算；取样和留样不能重复计数。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑪ 交付与客户反馈」梳理关键控制要求，重点涵盖 **⑪ 交付与客户反馈**、**⑪ 交付与客户反馈**、**⑪ 交付与客户反馈** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑪ 交付与客户反馈】**：每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- **【⑪ 交付与客户反馈】**：客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- **【⑪ 交付与客户反馈】**：客户审核的结论和整改记录有没有存档。\n- **【⑪ 交付与客户反馈】**：评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把放行的产品**完好送到**客户手里，并且把客户的每一次反馈（咨询、评测结果、投诉、退货、审核）都**登记、分级、给回复、能追到结果**。反馈是改进的原料，丢了就没有闭环。\n\n**该盯什么**\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n**常见翻车点**\n- 评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n- 亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录均未存档（风险清单 R8）。\n- 满意度调查表逐格相同且早于签约日（风险清单 R1）。\n\n**可以问团队**\n1. 最近一个月收到了哪些客户反馈？各自处理到哪一步？\n2. 这个客户的协议里，回复时限、变更通知提前期、留样要求分别是什么？\n3. 上次客户审核的不符合项，整改证据在哪？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑪ 交付与客户反馈」梳理关键控制要求，重点涵盖 **⑪ 交付与客户反馈**、**⑪ 交付与客户反馈**、**⑪ 交付与客户反馈** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑪ 交付与客户反馈】**：每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- **【⑪ 交付与客户反馈】**：客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- **【⑪ 交付与客户反馈】**：客户审核的结论和整改记录有没有存档。\n- **【⑪ 交付与客户反馈】**：评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把放行的产品**完好送到**客户手里，并且把客户的每一次反馈（咨询、评测结果、投诉、退货、审核）都**登记、分级、给回复、能追到结果**。反馈是改进的原料，丢了就没有闭环。\n\n**该盯什么**\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n**常见翻车点**\n- 评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n- 亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录均未存档（风险清单 R8）。\n- 满意度调查表逐格相同且早于签约日（风险清单 R1）。\n\n**可以问团队**\n1. 最近一个月收到了哪些客户反馈？各自处理到哪一步？\n2. 这个客户的协议里，回复时限、变更通知提前期、留样要求分别是什么？\n3. 上次客户审核的不符合项，整改证据在哪？",

    "title": "二方审核（客户审核）",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「二方审核（客户审核）」梳理关键控制要求，重点涵盖 **审前**、**审中**、**审后** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 逐批 CoA，质量放行；\n- 变更提前通知（30 个工作日起）；\n- 偏差和 CAPA 要包含根因，以及对其他批次的影响；\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【审前】**：建\"常驻审核资料包\"，按季度用最新的**真实**批次刷新（风险清单 R8 建议）。\n- **【审中】**：只提交真实、本公司主体、格式受控的记录。历史上出现过两年提交同两个 CCP 批次、提交墨肽格式批记录等问题（风险清单 R8；全景 §7）。\n- **【审后】**：不符合项逐条登记 → 开 CAPA → 按期提交整改证据 → 归档客户结论。亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录目前**均未存档**（风险清单 R8）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n- **审前**：建\"常驻审核资料包\"，按季度用最新的**真实**批次刷新（风险清单 R8 建议）。\n- **审中**：只提交真实、本公司主体、格式受控的记录。历史上出现过两年提交同两个 CCP 批次、提交墨肽格式批记录等问题（风险清单 R8；全景 §7）。\n- **审后**：不符合项逐条登记 → 开 CAPA → 按期提交整改证据 → 归档客户结论。亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录目前**均未存档**（风险清单 R8）。\n\n**客户共性要求清单**（全景 §7），可直接作为 ⑪ 的检查表：\n- 逐批 CoA，质量放行；\n- 变更提前通知（30 个工作日起）；\n- 偏差和 CAPA 要包含根因，以及对其他批次的影响；\n- 设备校准、方法验证；\n- 留样至效期；\n- 冷链；\n- 关键物料供应商管理；\n- 批记录可追溯；\n- OEM 试剂要求供方自建溯源。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「二方审核（客户审核）」梳理关键控制要求，重点涵盖 **审前**、**审中**、**审后** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 逐批 CoA，质量放行；\n- 变更提前通知（30 个工作日起）；\n- 偏差和 CAPA 要包含根因，以及对其他批次的影响；\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【审前】**：建\"常驻审核资料包\"，按季度用最新的**真实**批次刷新（风险清单 R8 建议）。\n- **【审中】**：只提交真实、本公司主体、格式受控的记录。历史上出现过两年提交同两个 CCP 批次、提交墨肽格式批记录等问题（风险清单 R8；全景 §7）。\n- **【审后】**：不符合项逐条登记 → 开 CAPA → 按期提交整改证据 → 归档客户结论。亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录目前**均未存档**（风险清单 R8）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n- **审前**：建\"常驻审核资料包\"，按季度用最新的**真实**批次刷新（风险清单 R8 建议）。\n- **审中**：只提交真实、本公司主体、格式受控的记录。历史上出现过两年提交同两个 CCP 批次、提交墨肽格式批记录等问题（风险清单 R8；全景 §7）。\n- **审后**：不符合项逐条登记 → 开 CAPA → 按期提交整改证据 → 归档客户结论。亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录目前**均未存档**（风险清单 R8）。\n\n**客户共性要求清单**（全景 §7），可直接作为 ⑪ 的检查表：\n- 逐批 CoA，质量放行；\n- 变更提前通知（30 个工作日起）；\n- 偏差和 CAPA 要包含根因，以及对其他批次的影响；\n- 设备校准、方法验证；\n- 留样至效期；\n- 冷链；\n- 关键物料供应商管理；\n- 批记录可追溯；\n- OEM 试剂要求供方自建溯源。",

    "title": "⑫ CAPA 与变更",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑫ CAPA 与变更」梳理关键控制要求，重点涵盖 **⑫ CAPA 与变更**、**⑫ CAPA 与变更**、**⑫ CAPA 与变更** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- 措施完成后有没有验证有效。\n- 改动是否通知了协议要求的客户、提前了多久。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑫ CAPA 与变更】**：根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- **【⑫ CAPA 与变更】**：措施完成后有没有验证有效。\n- **【⑫ CAPA 与变更】**：改动是否通知了协议要求的客户、提前了多久。\n- **【⑫ CAPA 与变更】**：外审不符合 Q8.4.1 的整改，写了做不到的内容（SaaS 平台、法务部，风险清单 R5）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：**CAPA** 是“纠正与预防措施”：出了问题，找到真正的原因，改掉它，防止再发生，并验证有效。**变更控制**是：任何改动（原料、供方、工艺、方法、规格）先评估影响、批准、通知客户，再执行。这一步让整条链路形成闭环：问题要回到出问题的那道工序去修。\n\n**该盯什么**\n- 根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- 措施完成后有没有验证有效。\n- 改动是否通知了协议要求的客户、提前了多久。\n\n**常见翻车点**\n- 外审不符合 Q8.4.1 的整改，写了做不到的内容（SaaS 平台、法务部，风险清单 R5）。\n- 措施做完就关闭，没有验证。\n- 工艺或方法改了，没有评估是否要通知客户。\n\n**可以问团队**\n1. 这个问题的根因是什么？为什么规程或系统允许它发生？\n2. 措施做完后，用什么标准证明有效？\n3. 这次改动要不要通知客户？协议要求提前多久？",
    "cases": [
      {
        "title": "工序 ⑫ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 证据 | 讨论题 |\n|---|---|---|---|\n| ISO 外审不符合 Q8.4.1 | 奥浦迈、语燕未纳入合格供方；90 天整改；关闭证据待确认；整改用的供应商程序写了做不到的内容（SaaS 平台、法务部） | 全景 §6；风险清单 R5 | 根因是\"漏登\"，还是\"供方程序与公司规模不匹配\"？有效性如何验证？ |\n| 记录真实性问题群 | 模拟记录、CoA 数值复制、稳定性时间不成立、克隆检验数据相同 | 风险清单 R1 | 这是 ⑩ 的执行问题，还是缺少系统控制？LabOS 能消除哪些条件？ |\n| 诺唯赞 81% 符合率 | 来自 ⑪ 的 B 类反馈 | 全景 §5.1 | 按根因退回表推演：退回 ②、⑦ 还是 ①？（教学推演，E4） |\n| CCP 检验方法不适用 | 只检外观、溶解性、SDS-PAGE，没有 HPLC 和 MS | 全景 §5.1；风险清单 R6 | 改用 HPLC（或委外）属于重大变更吗？需要通知哪些客户？ |\n| 工艺来源与授权 | dsDNA、RF 等工艺资料来自宁波赛珀 | 风险清单 R10 | 这类问题的 CAPA 输出是什么？与 ① 的技术来源合法性如何衔接？ |"

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「CAPA 流程（QA-OP-009）」梳理关键控制要求，重点涵盖 **#**、**1**、**2** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【#】**：步骤；做什么；负责；记录\n- **【1】**：立项；描述不合格事实（是什么、在哪、什么时候、多少、证据）；体系/内审类由综合部填写；投诉类由销售填写；纠正和预防措施处理单 QA-FM-024\n- **【2】**：遏制；立即控制影响：冻结相关批次、停发、通知（与 ⑩.3、⑪.3 衔接）；责任部门 + 管代；同上\n- **【3】**：影响评估；涉及哪些批次、哪些已发货、哪些客户；QC + 项目部；同上\n- **【4】**：根因分析；用 5Why、因果图、排列图或试验，找到**可验证**的根因；责任部门；同上 + 分析附件\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n| # | 步骤 | 做什么 | 负责 | 记录 |\n|---|---|---|---|---|\n| 1 | 立项 | 描述不合格事实（是什么、在哪、什么时候、多少、证据） | 体系/内审类由综合部填写；投诉类由销售填写 | 纠正和预防措施处理单 QA-FM-024 |\n| 2 | 遏制 | 立即控制影响：冻结相关批次、停发、通知（与 ⑩.3、⑪.3 衔接） | 责任部门 + 管代 | 同上 |\n| 3 | 影响评估 | 涉及哪些批次、哪些已发货、哪些客户 | QC + 项目部 | 同上 |\n| 4 | 根因分析 | 用 5Why、因果图、排列图或试验，找到**可验证**的根因 | 责任部门 | 同上 + 分析附件 |\n| 5 | 措施 | 纠正（处理已发生的）+ 纠正措施（消除根因）+ 预防措施（同类风险）；写明责任人和完成期限 | 责任部门制定，管代批准 | 同上 |\n| 6 | 实施 | 按计划执行；涉及文件、工艺、规格改动的，走 ⑫.3 变更 | 责任部门 | 变更记录 |\n| 7 | 有效性验证 | 用事先定好的标准判断措施是否有效（如连续 N 批未再发生、复审通过） | 监督部门（综合部/管代） | 同上 |\n| **C1** | **CAPA 关闭** | 有效性验证通过，监督部门主管签字确认 | 管代 | 同上 |\n| 8 | 回流 | 按根因所在退回 ①–⑩，更新知识库和风险登记 | 综合部 | 知识库更新日志 |\n\n### 根因退回表（建议，本知识梳理的核心）\n\n| 根因类型 | 典型例子 | 退回到 |\n|---|---|---|\n| 需求或用途理解错 | 客户平台、样本类型与我们的验收方式不匹配 | ① 调研与立项 |\n| 设计问题 | 表位、构建、标签、呈现方式导致性能不足 | ② 设计 |\n| 原料或供方问题 | 合成肽质量波动；供方未纳入合格名录 | ③ 构建与原料 / 供方管理 |\n| 工艺能力不足 | 收率、纯度、批间差不稳定 | ④⑤⑥ 或 ⑧ |\n| 检验方法不适用 | 方法不能检出关键属性（如小肽只用 SDS-PAGE） | ⑦ 质量验证 |\n| 规格或效期没有依据 | 效期缺少稳定性数据 | ⑧ 稳定性 / ⑨ 定型 |\n| 执行或记录问题 | 未按 SOP 操作；记录不真实；交接遗漏 | ⑩ 批生产（培训、复核、系统控制） |\n| 交付或沟通问题 | 冷链超时；客户要求没传达 | ⑪ 交付 |\n\n**判别要点**：\"加强培训\"\"员工粗心\"通常不是根因。要继续追问：为什么规程或系统允许这个错误发生？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「变更控制」梳理关键控制要求，重点涵盖 **#**、**1**、**2** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【#】**：步骤；做什么；负责\n- **【1】**：申请；写清变更内容、原因、涉及的产品、批次和文件；提出人\n- **【2】**：分类；重大**：可能影响产品质量、性能、规格，或客户已确认的工艺，如关键原料、供方、工艺步骤、检验方法、规格、生产地点。**一般**：不影响质量，如格式、非关键设备的同型替换；综合部 + QC\n- **【3】**：影响评估；要做哪些验证（对比批、稳定性、方法确认）；哪些客户需要通知；对库存和在制批的影响；R = S×P；项目部 + QC\n- **【4】**：批准；一般变更由管代批准；重大变更由管代批准，涉及重大资源的报总经理；管代 / 总经理\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n> **重要缺口**：现行体系**没有独立的变更控制程序**。只有 SM-OP-001 §4.4 讲产品要求变更（与客户协商并按 QA-OP-001 修改文件），以及 QA-OP-009 §4.5 讲 CAPA 引起的文件更改。客户普遍要求变更提前 30 个工作日通知（全景 §7），因此建议新建变更控制规程。下面的流程是**建议**。\n>\n> **已起草**：`00 AI 工作区/待审核/QA-SMP-007 变更管理规程_草案V0.1_20261104.docx`（2026-11-04，AI 起草，待人工审核）。编号沿用 RD-OP-001 §5 已引用的 QA-SMP-007；内容覆盖分类判定、影响评估、验证、批准、顾客通知、紧急/临时变更、供方变更（衔接 SC-OP-002 §4.4.1），附流程表、申请评估单和顾客通知函样式。下表为摘要，以规程为准。\n\n| # | 步骤 | 做什么 | 负责 |\n|---|---|---|---|\n| 1 | 申请 | 写清变更内容、原因、涉及的产品、批次和文件 | 提出人 |\n| 2 | 分类 | **重大**：可能影响产品质量、性能、规格，或客户已确认的工艺，如关键原料、供方、工艺步骤、检验方法、规格、生产地点。**一般**：不影响质量，如格式、非关键设备的同型替换 | 综合部 + QC |\n| 3 | 影响评估 | 要做哪些验证（对比批、稳定性、方法确认）；哪些客户需要通知；对库存和在制批的影响；R = S×P | 项目部 + QC |\n| 4 | 批准 | 一般变更由管代批准；重大变更由管代批准，涉及重大资源的报总经理 | 管代 / 总经理 |\n| 5 | 客户通知 | 重大变更按客户协议提前通知（如 30 个工作日），需要时取得客户书面同意后才执行 | 销售 + 管代 |\n| 6 | 实施与验证 | 按计划执行和验证；文件按 QA-OP-001 换版；培训；回收旧版 | 项目部 + 综合部 |\n| **C2** | **变更关闭** | 验证结果达标；文件已生效；客户通知已有回执；首批变更后产品放行 | 管代 |",

    "path": "实验室 ISO 体系管理 / 记录与数据完整性 / 5. 数据完整性：系统层规则",
    "title": "5. 数据完整性：系统层规则",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「5. 数据完整性：系统层规则」梳理关键控制要求，重点涵盖 **原始数据先于记录**、**修改留痕**、**不可删除** 等核心要素（来源：`LabOS字段与规则总表_草案V0.1_20261105.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【原始数据先于记录】**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n- **【修改留痕】**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n- **【不可删除】**：已提交的记录只能作废并注明原因，不能物理删除。\n- **【时间戳由系统生成】**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n- **【签署证据】**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `LabOS字段与规则总表_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n对应 AGENTS.md §2.3 和风险清单 R1。目标是让“补造、倒签、覆盖”**在系统里做不到**，而不是只靠制度。\n\n1. **原始数据先于记录**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n2. **修改留痕**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n3. **不可删除**：已提交的记录只能作废并注明原因，不能物理删除。\n4. **时间戳由系统生成**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n5. **签署证据**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n6. **AI 读取的内容必须人核对**：现有“待整理与核对”流程（绿底/黄底，改/对/驳回）应保留，并在报表里区分“人工核对过”和“AI 读出未核”的数值。\n7. **测试数据隔离**：我在“批次与样品”里看到“测试1027/测试1028”等测试批次与正式批次混在一个清单里。建议增加“测试”标记，默认不进入统计、不进入周报和 CoA。\n8. **示例与真实分开**：培训或演示用的数据必须有“示例/培训用”标识，不得生成看起来像真实原始记录的数据（AGENTS.md §2.3）。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「5. 数据完整性：系统层规则」梳理关键控制要求，重点涵盖 **原始数据先于记录**、**修改留痕**、**不可删除** 等核心要素（来源：`LabOS字段与规则总表_草案V0.1_20261105.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【原始数据先于记录】**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n- **【修改留痕】**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n- **【不可删除】**：已提交的记录只能作废并注明原因，不能物理删除。\n- **【时间戳由系统生成】**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n- **【签署证据】**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `LabOS字段与规则总表_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n对应 AGENTS.md §2.3 和风险清单 R1。目标是让“补造、倒签、覆盖”**在系统里做不到**，而不是只靠制度。\n\n1. **原始数据先于记录**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n2. **修改留痕**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n3. **不可删除**：已提交的记录只能作废并注明原因，不能物理删除。\n4. **时间戳由系统生成**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n5. **签署证据**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n6. **AI 读取的内容必须人核对**：现有“待整理与核对”流程（绿底/黄底，改/对/驳回）应保留，并在报表里区分“人工核对过”和“AI 读出未核”的数值。\n7. **测试数据隔离**：我在“批次与样品”里看到“测试1027/测试1028”等测试批次与正式批次混在一个清单里。建议增加“测试”标记，默认不进入统计、不进入周报和 CoA。\n8. **示例与真实分开**：培训或演示用的数据必须有“示例/培训用”标识，不得生成看起来像真实原始记录的数据（AGENTS.md §2.3）。",

        "tag": "全景主线案例",
        "body": "## **1. 项目背景与挑战**\n- **靶点属性**：人源 Ro52（UniProt `P19474`，475 aa，54.2 kDa），干燥综合征（SS）与系统性红斑狼疮（SLE）核心自身抗原。\n- **核心痛点**：中间卷曲螺旋区极易自聚形成包涵体，C 端 PRY/SPRY 域易结合人血清 IgG Fc 段产生假阳性。\n\n---\n\n## **2. 全链路五步通关策略**\n1. **SOTA 调研（Gate R1）**：锁定 `P19474 v1` 序列，确立全长（1–475 aa）与核心截短体（125–268 aa）平行验证路线。\n2. **DNA 构建（Gate R2/R3）**：大肠杆菌密码子优化（CAI ≥0.85），构建 `6xHis-MBP-TEV-Ro52` 载体，先转 DH5α 测序建库。\n3. **上游发酵（Gate R4）**：转入 `Rosetta(DE3)`，16°C + 0.1 mM IPTG 低温慢速诱导，补加 $50\\ \\mu\\text{M ZnCl}_2$ 稳定锌指。\n4. **下游纯化（Gate R5）**：Amylose/Ni 亲和捕获 → TEV 酶切去标签 → 反挂 Ni 柱 + IEX/SEC 抛光。\n5. **质控放行（Gate R7）**：SDS-PAGE 纯度 ≥90%、SEC-HPLC 确认天然二聚体峰、阴阳性血清盘验证信噪比与冻融稳定性。"

    "path": "基础知识学习 / State-of-the-Art前沿调研",
    "title": "State-of-the-Art前沿调研",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在花钱合成基因、进实验室动手之前，先完成 **靶点结构分析**、**文献与专利自由实施（FTO）** 检索以及 **证据矩阵** 梳理，弄清 ==「做哪个分子、怎么切、用什么宿主和标签、最大风险在哪、怎么算合格」==。\n- **管理意义**：这是研发成本最低、但决定生死的一步。起点选错（如漏看自聚区或非特异结合区），后面几个月的表达和纯化都会在错误路线上返工。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【靶点结构分析】**：通过 UniProt 和三维结构数据，摸清蛋白的氨基酸长度、独立结构域边界、疏水区和金属结合位点。\n- **【文献与专利自由实施（FTO）】**：Freedom to Operate，排查拟采用的技术路线、序列截取方式是否侵犯他人有效专利，以及外单位技术是否有正式授权。\n- **【证据矩阵】**：把不同文献里的片段坐标、表达宿主、测试血清样本量和结论强度列在一张表里对比，防止把单篇论文结论当成普适真理。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R1 必查红线**：未明确客户检测平台（直接包被 vs. 生物素捕获）、未锁定基准序列版本、或把文献结果直接当成已验证工艺时，严禁进入基因合成与生产。",
    "cases": [
      {
        "title": "Ro52 (TRIM21) 前沿调研全景推演",
        "tag": "实战案例",
        "body": "## **1. 靶点底牌（摸清脾气）**\n- **基准序列**：UniProt `P19474`（Version 1），全长 ==475 aa==（约 54.2 kDa），天然无糖基化，可用大肠杆菌表达。\n- **两大结构隐患**：\n  1. **【包涵体隐患】**：中间 `Coiled-Coil 卷曲螺旋区（128–238 aa）` 既是核心免疫优势区，又极易疏水自聚，裸蛋白原核表达 >90% 进包涵体。\n  2. **【假阳性隐患】**：C 端 `PRY/SPRY 域（268–475 aa）` 天然结合人 IgG 的 Fc 段，在血清学检测中易产生非特异背景。\n\n---\n\n## **2. 锚定策略（立项路线）**\n- **平行对比路线**：以 **路线 A（全长 1–475 aa）** 为基准参照，平行开发 **路线 B（125–268 aa 核心表位截短体，切掉 C 端 Fc 结合域）**。\n- **保溶方案**：采用 `N端 6xHis-MBP-TEV` 助溶标签 + `Rosetta(DE3)` 16°C 低温诱导（全长补加 $50\\ \\mu\\text{M ZnCl}_2$ 稳定 N 端锌指）。"
      }

    "path": "基础知识学习 / State-of-the-Art前沿调研 / 靶点与结构特征分析",
    "title": "靶点与结构特征分析",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在设计构建体前，系统拆解目标抗原的 **一级序列**、**结构域边界**、**空间寡聚态** 与 **翻译后修饰（PTM）**，找出决定抗原活性和溶解度的物理化学特征。\n- **为什么要拆解**：蛋白不是一根均匀的绳子，弄清哪里是表位、哪里是疏水核心、哪里要绑金属离子，才能在不破坏抗体识别的前提下改造成高产可溶抗原。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【一级序列】**：蛋白质从 N 端到 C 端精确的氨基酸排列顺序，是所有结构域坐标定位的基准尺。\n- **【结构域边界】**：蛋白质中能独立折叠成一个稳定球体或螺旋模块（如 RING、Coiled-Coil）的起止氨基酸位置；截短改造绝不能切在结构域内部。\n- **【空间寡聚态】**：蛋白质在溶液中天然是以单分子（单体）、成对（二聚体）还是多分子组合（如八聚体）存在。\n- **【翻译后修饰（PTM）】**：蛋白翻译出来后在真核细胞里额外加上的化学基团（如糖基化、磷酸化、二硫键），直接决定能不能用大肠杆菌生产。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **结构评估必查**：立项调研报告必须画出靶蛋白的结构域分布图（标明起止 aa 编号）、疏水风险区以及是否依赖真核修饰。",
    "cases": [
      {
        "title": "Ro52 四大结构域与理化特征画像",
        "tag": "实战案例",

    "title": "靶点与结构特征分析",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在设计构建体前，系统拆解目标抗原的 **一级序列**、**结构域边界**、**空间寡聚态** 与 **翻译后修饰（PTM）**，找出决定抗原活性和溶解度的物理化学特征。\n- **为什么要拆解**：蛋白不是一根均匀的绳子，弄清哪里是表位、哪里是疏水核心、哪里要绑金属离子，才能在不破坏抗体识别的前提下改造成高产可溶抗原。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【一级序列】**：蛋白质从 N 端到 C 端精确的氨基酸排列顺序，是所有结构域坐标定位的基准尺。\n- **【结构域边界】**：蛋白质中能独立折叠成一个稳定球体或螺旋模块（如 RING、Coiled-Coil）的起止氨基酸位置；截短改造绝不能切在结构域内部。\n- **【空间寡聚态】**：蛋白质在溶液中天然是以单分子（单体）、成对（二聚体）还是多分子组合（如八聚体）存在。\n- **【翻译后修饰（PTM）】**：蛋白翻译出来后在真核细胞里额外加上的化学基团（如糖基化、磷酸化、二硫键），直接决定能不能用大肠杆菌生产。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **结构评估必查**：立项调研报告必须画出靶蛋白的结构域分布图（标明起止 aa 编号）、疏水风险区以及是否依赖真核修饰。",
    "cases": [
      {
        "title": "Ro52 四大结构域与理化特征画像",
        "tag": "实战案例",
        "body": "## **1. 结构域坐标图（基于 P19474, 1–475 aa）**\n- **N 端 RING 域（16–55 aa）+ B-box 2 域（92–123 aa）**：依赖 $\\text{Zn}^{2+}$ 维持折叠，缺锌易聚集。\n- **中间 Coiled-Coil 域（128–238 aa）**：长 $\\alpha$-螺旋，驱动形成 **反平行同源二聚体**，包含患者抗体主要识别区（如 p200 表位 200–239 aa）。\n- **C 端 PRY/SPRY (B30.2) 域（268–475 aa）**：球状 $\\beta$-折叠域，具有结合人 IgG Fc 的天然活性。\n\n---\n\n## **2. 防错要点**\n- **不能乱切**：截短边界必须选在结构域之间的连接区（如 125–268 aa 完整包住 Coiled-Coil），绝不能在 180 aa 这种螺旋中间下刀。"

    "path": "基础知识学习 / State-of-the-Art前沿调研 / 靶点与结构特征分析 / 氨基酸序列获取: UniProt数据库标准序列",
    "title": "氨基酸序列获取: UniProt数据库标准序列",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心原则**：任何重组蛋白项目的起点，都是从 **UniProt** 锁定唯一的、受控的 **氨基酸基准序列** 及其 **异构体**，并登记明确的 **登录号与序列版本**。\n- **为什么要锁死**：避免团队内部误用截短体、突变体或不同物种序列，导致后续 ==引物设计、质粒构建和表位坐标全部错位==。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【UniProt】**：全球最权威的蛋白质序列与功能数据库（相当于蛋白质界的“国家标准户籍库”），网址为 `uniprot.org`。\n- **【氨基酸基准序列】**：Canonical Sequence，同一个基因在数据库里被指定为“默认主代表”的那条全长标准氨基酸序列（编号通常为 `-1`），是所有坐标的唯一标尺。\n- **【异构体】**：Isoforms，同一个基因由于 mRNA 选择性剪接（切掉了某段外显子）翻译出来的“同胞兄弟蛋白”，名字很像但长度和表位不同。\n- **【登录号与序列版本】**：Accession & Version，蛋白质在 UniProt 中的唯一身份证号（如 `P19474`）及序列修订版次（如 `Version 1`）。只写蛋白名不写登录号等于没有受控标准。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项必查**：立项书与序列设计文件上是否明确写出了 **UniProt 登录号 + 序列版本号 + 起止氨基酸坐标（如 `P19474, v1, 1–475 aa`）**？没写一律退回补齐。",
    "cases": [
      {
        "title": "Ro52 案例：UniProt 标准序列锁定与异构体防错",
        "tag": "实战案例",
        "body": "## **1. 标准序列锁定**\n- **靶点名称**：人源 Ro52（基因名 `TRIM21`）\n- **UniProt 登录号**：==`P19474`==（条目名：`RO52_HUMAN`，Sequence Version 1）\n- **基准规格**：全长共 **475 个氨基酸（1–475 aa）**，理论分子量约 **54.2 kDa**。\n\n---\n\n## **2. 防错要点（Ro52α vs. Ro52β）**\n- **常见踩坑点**：文献中常同时出现 `Ro52α`（全长 475 aa，即 `P19474-1`）和缺少中间第 4 外显子（缺失部分卷曲螺旋核心表位区）的剪接异构体 `Ro52β`。\n- **坐标错位风险**：如果不锁死基准序列，不同文献或不同研发人员说的“第 125–268 位”或“p200 肽段（200–239 aa）”就会对不上号。\n\n---\n\n> **立项受控写法**：在立项书与 LabOS 中必须写死 —— **「基准序列：基于 UniProt `P19474` (Version 1, 1–475 aa)」**，以此作为全长参照及后续 `125–268 aa` 截短体设计的唯一坐标尺子。"
      }

        "body": "## **1. 标准序列锁定**\n- **靶点名称**：人源 Ro52（基因名 `TRIM21`）\n- **UniProt 登录号**：==`P19474`==（条目名：`RO52_HUMAN`，Sequence Version 1）\n- **基准规格**：全长共 **475 个氨基酸（1–475 aa）**，理论分子量约 **54.2 kDa**。\n\n---\n\n## **2. 防错要点（Ro52α vs. Ro52β）**\n- **常见踩坑点**：文献中常同时出现 `Ro52α`（全长 475 aa，即 `P19474-1`）和缺少中间第 4 外显子（缺失部分卷曲螺旋核心表位区）的剪接异构体 `Ro52β`。\n- **坐标错位风险**：如果不锁死基准序列，不同文献或不同研发人员说的“第 125–268 位”或“p200 肽段（200–239 aa）”就会对不上号。\n\n---\n\n> **立项受控写法**：在立项书与 LabOS 中必须写死 —— **「基准序列：基于 UniProt `P19474` (Version 1, 1–475 aa)」**，以此作为全长参照及后续 `125–268 aa` 截短体设计的唯一坐标尺子。"

    "key": "learn.0.0.1",
    "path": "基础知识学习 / State-of-the-Art前沿调研 / 靶点与结构特征分析 / 蛋白质结构解析: 一至四级结构评估",
    "title": "蛋白质结构解析: 一至四级结构评估",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：全面评估靶蛋白的 **一级至四级结构**，识别 **疏水核心**、**构象表位** 与 **金属配位结构域**，预判表达时的包涵体风险及纯化时的正常聚集态。\n- **管理意义**：很多抗原在 SDS-PAGE 上只有一条带，但在溶液里却是无活性的错误团聚体；只有先看懂四级结构，才知道 SEC 分子筛上跑出的大峰是“天然二聚体”还是“死蛋白聚集”。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【一级至四级结构】**：一级是氨基酸排布；二级是局部的 $\\alpha$-螺旋或 $\\beta$-折叠；三级是单条链折成的三维模块；四级是多条链组装成的复合物（如二聚体、八聚体）。\n- **【疏水核心】**：不喜欢水的氨基酸聚在一起形成的区域；正常时藏在蛋白内部或二聚体交界面，一旦暴露在水里就会互相粘连形成沉淀或包涵体。\n- **【构象表位】**：患者抗体识别的不是几个连续排在一起的氨基酸（线性表位），而是蛋白折叠成特定三维螺旋或球体后才呈现出来的表面形状。\n- **【金属配位结构域】**：如锌指结构（Zinc Finger），必须像脚手架一样抓着一个金属离子（如 $\\text{Zn}^{2+}$）才能折叠正确的结构域。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **结构审查必问**：① 该蛋白天然状态是单体还是二聚/多聚体？② 核心表位是线性的还是构象依赖的？③ 是否含有需要补加金属离子的结构域？",
    "cases": [
      {
        "title": "Ro52 一至四级结构风险拆解与应对",
        "tag": "实战案例",
        "body": "## **1. 四级结构特征锁定**\n- **二级/三级重点**：128–238 aa 为典型的 **Coiled-Coil（卷曲螺旋）**，其内部的 p200 区段（200–239 aa）必须维持 $\\alpha$-螺旋构象才能被高亲和力患者抗体识别；N 端 RING/B-box 为锌指结构。\n- **四级结构**：两条 Ro52 肽链通过 Coiled-Coil 疏水界面结合，天然以 **同源二聚体（Homodimer，约 108 kDa）** 存在。\n\n---\n\n## **2. 防错要点**\n1. **SEC 判读防错**：纯化后去标签的 Ro52 在 SEC-HPLC 上主峰对应二聚体位置是正常天然状态，不能误判为“多聚杂质”而强行丢弃。\n2. **C 端干扰防错**：C 端 PRY/SPRY 域（268–475 aa）是高亲和力 IgG Fc 结合域，设计时需设置 `125–268 aa` 截短体对照以排除 Fc 假阳性干扰。"
      }

    "title": "翻译后修饰评估: 糖基化与磷酸化位点",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：核查靶蛋白在人体内是否存在 **糖基化位点**、**磷酸化修饰** 或复杂 **二硫键网络**，并判断患者的 **自身抗体识别** 是否依赖这些修饰。\n- **为什么关键**：这直接决定了表达底盘的选择——不依赖真核修饰的蛋白用大肠杆菌（成本低、快 10 倍），高度依赖糖基化和复杂二硫键的糖蛋白必须上哺乳动物细胞（CHO/HEK293）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【糖基化位点】**：蛋白质在真核细胞内内质网/高尔基体中被挂上糖链的位置（如 N-糖基化 `N-X-S/T` 基序），大肠杆菌没有这套加糖机器。\n- **【磷酸化修饰】**：在丝氨酸/苏氨酸/酪氨酸上加上磷酸基团的修饰，某些自身抗体专门识别磷酸化后的表位。\n- **【二硫键网络】**：两个半胱氨酸（Cys）之间形成的共价硫-硫键（$-S-S-$），用于锁住胞外蛋白的三维构象；大肠杆菌胞质是还原环境，很难正确配对多对二硫键。\n- **【自身抗体识别】**：患者血清中的抗靶点抗体与抗原结合的过程；必须搞清抗体抓的是“裸肽链”还是“带糖链的构象”。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项必查**：选用大肠杆菌表达前，必须在报告中提供 UniProt PTM（翻译后修饰）核查截图，证实无必需的糖基化与复杂二硫键网络。",
    "cases": [
      {
        "title": "Ro52 vs. β2GPI：翻译后修饰决定表达底盘",
        "tag": "对比案例",
        "body": "## **1. Ro52 的 PTM 评估结论**\n- **修饰核查**：检索 UniProt `P19474`，Ro52 为胞内蛋白，**无天然 N-糖基化修饰**；N 端虽富含半胱氨酸（Cys），但属于结合 $\\text{Zn}^{2+}$ 的配位残基而非二硫键网络。\n- **决策**：可放心选用 **大肠杆菌（*E. coli*）** 表达，无需昂贵的哺乳动物细胞系统。\n\n---\n\n## **2. 反例对照（β2GPI 为什么不能用大肠杆菌）**\n- **β2GPI（抗磷脂综合征核心抗原）**：属于血浆分泌型糖蛋白，含 **22 个半胱氨酸（11 对二硫键）** 和 **4 个 N-糖基化位点**，且病理性自身抗体高度依赖其天然折叠构象——用大肠杆菌表达全部是死包涵体，必须选 **HEK293 / CHO 哺乳系统**。"
      }

    "path": "基础知识学习 / State-of-the-Art前沿调研 / 文献与策略锚定",
    "title": "文献与策略锚定",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过检索顶刊文献与公开权威试剂库 SOP，锚定经过检验的 **候选构建路线**，并提前制定 **包涵体规避策略** 与 **融合标签方案**。\n- **管理原则**：站在前人肩膀上少走弯路，但必须严格区分 **文献事实与教学推演**——别人的论文能做出来，只代表它是合格的候选起点，不代表在本公司试剂盒上已经验证通过。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【候选构建路线】**：立项时选定的 1～3 种平行设计方案（如：路线 A 全长参照 + 路线 B 优势截短体），通过实验数据比选优胜者。\n- **【包涵体规避策略】**：通过加助溶伴侣标签、降低诱导温度（16°C）、降低诱导剂浓度等手段，让蛋白在细菌里保持可溶折叠，避免变成不溶废渣。\n- **【融合标签方案】**：在目标蛋白前端或后端接上一段功能蛋白（如用于亲和纯化的 `6xHis`、用于助溶的 `MBP/SUMO`）及蛋白酶切位点。\n- **【文献事实与教学推演】**：文献事实是原作者在特定样本和方法下测到的结果（E3 级）；迁移到我们自己的缓冲液、标签和临床血清盘上，在实测前都只是待验证假设（E4 级）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **策略审查必问**：① 选定的标签将来切不切？如果不切，怎么排除标签本身的假阳性背景？② 截短体方案有没有设置全长蛋白作为平行参照？",
    "cases": [
      {
        "title": "Ro52 文献路线锚定：Dundee SOP 与 2018 表位研究",
        "tag": "实战案例",
        "body": "## **1. 前人权威经验提取**\n- **全长制备事实**：英国 Dundee 大学公开 SOP（`DU22292`）采用 **N 端 `His-SUMO` 标签融合 Ro52 全长（1–475 aa）**，在 *E. coli* BL21 中低温表达并通过 Ni 柱 + SEC 获得了可溶全长蛋白。\n- **截短表位事实**：2018 年表位研究（*PMC6293197*）证实，大肠杆菌表达的 **`Ro52-2 (125–268 aa)`** 片段在抗 Ro52 阳性队列中具有极高检出率。\n\n---\n\n## **2. 本项目策略锚定**\n- **不赌单一路线**：同时立项 **全长（1–475 aa）** 与 **截短体（125–268 aa）**，统一搭载可酶切的助溶标签，在同一套阴阳性临床血清盘上公平比武。"
      }

    "path": "基础知识学习 / State-of-the-Art前沿调研 / 文献与策略锚定 / 同靶点顶刊方案检索与前人经验",
    "title": "同靶点顶刊方案检索与前人经验",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：系统检索 PubMed、PMC 及专业蛋白库（如 MRC PPU、Addgene），提取同靶点的 **片段坐标**、**测试样本范围** 与 **对照设置**，形成可溯源的检索记录。\n- **为什么要查细**：很多文献标题写“某短肽灵敏度 98%”，细看正文才发现它的 **测试样本范围** 是提前筛选过的强阳性血清，如果直接照搬就会在临床弱阳性样本上漏检。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【片段坐标】**：文献中所用抗原片段在标准序列（如 UniProt `P19474`）上的精确起止氨基酸编号（必须核对是否包含首尾两端）。\n- **【测试样本范围】**：文献用来验证该抗原的血清队列（是全人群初筛样本，还是已经用全长抗原筛过一轮的阳性子集？有没有包含其他自免疾病的干扰样本？）。\n- **【对照设置】**：文献实验中用来排除假象的参照组（如全长抗原参照、空标签对照、健康人阴性血清对照）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **检索记录必查**：立项附件必须留存文献 PMID/链接、提取的精确 aa 坐标，以及“该文献队列与本公司目标用途的差异说明”。",
    "cases": [
      {
        "title": "Ro52 三代文献方案的证据强度对比",
        "tag": "实战案例",
        "body": "## **1. 三篇核心文献的证据边界**\n1. **1994 合成短肽研究（PMID `7511075`）**：发现 `107–122 aa` 和 `365–382 aa` 线性肽有反应，但不同患者血清异质性极大 —— **结论：仅靠短肽拼接会严重漏检构象型患者，不可单独作为成品路线**。\n2. **2005 p200 表位研究（PMID `15683447`）**：证实 `200–239 aa` 的抗体识别依赖其部分 $\\alpha$-螺旋构象 —— **结论：工艺必须保护螺旋二级结构**。\n3. **2018 片段对比研究（PMID `30581434`）**：`125–268 aa`（144 aa）完整覆盖卷曲螺旋区，反应性最强 —— **结论：可作为高产截短体主力候选，但仍需在本公司血清盘上与全长 1–475 aa 对比弱阳性检出率**。"
      }

    "path": "基础知识学习 / State-of-the-Art前沿调研 / 文献与策略锚定 / 包涵体与低活性规避策略",
    "title": "包涵体与低活性规避策略",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：针对原核表达中极易出现的 **包涵体（Inclusion Body）** 与 **错误折叠低活性** 问题，在立项阶段就制定“前端助溶 + 过程降速 + 辅因子补充”的源头预防方案，尽量规避高风险的 **变性复性（Refolding）**。\n- **管理逻辑**：包涵体复性不仅耗时耗药，而且每一批复性效率极难控制一致（批间 CV 大）；能在上清里直接拿到天然折叠的可溶蛋白，绝不走包涵体路线。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【包涵体（Inclusion Body）】**：细菌合成蛋白速度太快，新生肽链来不及折叠就互相粘成致密的不溶性蛋白颗粒（离心后全在沉淀里，通常没有天然空间活性）。\n- **【错误折叠低活性】**：蛋白虽然勉强溶在水里（或者复性后溶了），但三维结构拧巴了，装了假构象，导致抗体认不出来（效价极低）。\n- **【变性复性（Refolding）】**：用高浓度尿素（8M）或盐酸胍（6M）把包涵体强行拆散溶解，再通过透析慢慢去掉变性剂让它重新折叠——成功率低、极易二次沉淀。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项防坑红线**：凡是疏水指数高或文献提示易进包涵体的靶点，立项方案必须同时具备「助溶标签 + 低温低 IPTG 诱导」设计；若拟采用包涵体复性路线，必须说明如何验证构象恢复率。",
    "cases": [
      {
        "title": "Ro52 规避 90% 包涵体的三联防聚方案",
        "tag": "实战案例",
        "body": "## **1. 痛点现象**\n- 全长 Ro52 不加助溶标签在 *E. coli* 37°C、1.0 mM IPTG 常规诱导下，**>90% 目标蛋白进入沉淀包涵体**，且尿素复性后对弱阳性血清识别率腰斩。\n\n---\n\n## **2. 三联源头保溶策略**\n1. **分子伴侣大标签牵引**：N 端融合 `MBP`（42 kDa）或 `SUMO`，遮蔽 Coiled-Coil 疏水面。\n2. **低温慢速翻译**：诱导温度从 37°C 降至 **16–18°C**，IPTG 降至 **0.1 mM**，给二聚体螺旋正确配对留足时间。\n3. **配位金属离子护航**：培养基中补加 **$50\\ \\mu\\text{M ZnCl}_2$**，让 N 端 RING 锌指结构域出核糖体即正确抓锌折叠，可溶率跃升至 45%–55% 以上。"
      }

        "title": "Ro52 规避 90% 包涵体的三联防聚方案",
        "tag": "实战案例",
        "body": "## **1. 痛点现象**\n- 全长 Ro52 不加助溶标签在 *E. coli* 37°C、1.0 mM IPTG 常规诱导下，**>90% 目标蛋白进入沉淀包涵体**，且尿素复性后对弱阳性血清识别率腰斩。\n\n---\n\n## **2. 三联源头保溶策略**\n1. **分子伴侣大标签牵引**：N 端融合 `MBP`（42 kDa）或 `SUMO`，遮蔽 Coiled-Coil 疏水面。\n2. **低温慢速翻译**：诱导温度从 37°C 降至 **16–18°C**，IPTG 降至 **0.1 mM**，给二聚体螺旋正确配对留足时间。\n3. **配位金属离子护航**：培养基中补加 **$50\\ \\mu\\text{M ZnCl}_2$**，让 N 端 RING 锌指结构域出核糖体即正确抓锌折叠，可溶率跃升至 45%–55% 以上。"

  "learn.0.1.2": {
    "key": "learn.0.1.2",
    "path": "基础知识学习 / State-of-the-Art前沿调研 / 文献与策略锚定 / 融合标签与表达宿主选择",
    "title": "融合标签与表达宿主选择",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：为目标抗原匹配最优的 **表达底盘（Host）**、**亲和纯化标签** 与 **助溶伴侣标签**，并提前评估 **标签非特异背景** 对下游 IVD 试剂盒的影响。\n- **为什么是立项重中之重**：研发人员喜欢留着大标签（如 MBP、GST）因为好表达、好纯化；但质检和客户最怕大标签，因为人血清里有抗大肠杆菌/抗 MBP 抗体，留着标签上板会导致假阳性泛滥！\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【表达底盘（Host）】**：用来生产蛋白的“生物车间”，最常用的是大肠杆菌（原核，快且便宜）和 CHO/HEK293（哺乳细胞，能加糖链和复杂二硫键）。\n- **【亲和纯化标签】**：像吸铁石一样的短肽（最典型是 `6xHis` 六聚组氨酸），能让目标蛋白被镍柱（Ni-NTA）一把抓住，一步洗掉 80% 杂蛋白。\n- **【助溶伴侣标签】**：自身极易溶解的大蛋白（如 `MBP` 麦芽糖结合蛋白 42 kDa、`SUMO` 11 kDa），接在难溶蛋白前面能带着它一起溶在水里。\n- **【标签非特异背景】**：部分正常人血清中含有针对细菌蛋白（如 MBP、GST）的天然抗体；如果抗原成品不切掉这些大标签，测阴性血清时也会发光报警（假阳性）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **标签审核铁律**：凡是使用 `MBP`、`GST`、`Trx` 等大于 10 kDa 的外源助溶标签，设计方案中必须配套 **「特异性酶切位点（TEV/ULP1）+ 切标后反挂去除标签」** 的完整闭环，或设置严格的纯标签阴性对照孔。",
    "cases": [
      {
        "title": "Ro52 宿主与双标签（6xHis-MBP-TEV）选型决策",
        "tag": "实战案例",
        "body": "## **1. 宿主与标签锁定**\n- **表达宿主**：选用 **`E. coli Rosetta(DE3)`**（自带稀有密码子 tRNA 补充质粒 pRARE，且缺失 Lon/OmpT 蛋白酶防降解）。\n- **标签架构**：`N端 6xHis - MBP - Linker - TEV酶切位点 - Ro52`。\n\n---\n\n## **2. 为什么这样组合（一举三得）**\n1. **表达期**：靠 `MBP` 把 Ro52 可溶表达率从 <10% 拉升到 ~50%。\n2. **粗纯期**：既可用 `Ni-NTA` 抓 `6xHis`，也可用 `Amylose 麦芽糖柱` 温和抓 `MBP`。\n3. **去标签期**：加入带 His 标签的 `TEV 蛋白酶` 切开后，再过一次 `Ni-NTA` 柱 —— 切下来的 `6xHis-MBP` 和 `His-TEV 酶` 全部被镍柱扣留，流穿液就是 **零大标签残留的纯净 Ro52**！"
      }

    "path": "基础知识学习 / State-of-the-Art前沿调研 / Gate｜① 调研与立项",
    "title": "Gate｜① 调研与立项",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R1（调研与立项关口）** 是从“纸面调研”跨入“花钱做实验”的第一道刚性阀门，必须按 **Gate四件套**（检查方法、通过依据、未通过动作、交付物）完成评审签批，并在 LabOS 中锁定 **设计输入（Design Input）** 与 **风险评估（R=S×P）**。\n- **管理红线**：严禁“边做边补立项书”或“一天内同时补签立项到放行全套文件”。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Gate四件套】**：每个阶段关口必须写清的四要素 —— ① 怎么查（检查方法）、② 什么算过（通过依据）、③ 不过怎么办（未通过动作）、④ 留什么档（交付物）。\n- **【设计输入（Design Input）】**：对应 `RD-FM-003`，把客户需求翻译成研发能测量的硬指标（如：用于化学发光磁珠包被、浓度 ≥1.0 mg/mL、纯度 ≥90%、到货剩余效期 ≥24 个月）。\n- **【风险评估（R=S×P）】**：按严重度（Severity, 1–5）× 发生概率（Probability, 1–5）算风险分值 $R$；$R \\ge 10$ 为高风险，必须在立项书中写明预防控制措施。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **R1 放行签字前必核四项**：① UniProt 号与版本锁死没有？② 客户检测平台与验收指标（含检测方法）写清没有？③ 技术来源与 FTO 有无侵权隐患？④ 平行对照与参照品定好没有？",
    "cases": [
      {
        "title": "Ro52 项目 Gate R1 立项评审通过清单",
        "tag": "Gate 评审案例",
        "body": "## **1. Gate R1 四件套核验表（Ro52 项目）**\n| 维度 | Ro52 立项核验内容 | 状态 |\n|---|---|---|\n| **检查方法** | 核对 UniProt `P19474 v1` 序列图谱、Dundee `DU22292` 与 `PMC6293197` 证据矩阵、策划评审 | 已核对 |\n| **通过依据** | 明确 ELISA/发光包被用途；确立全长 `1–475 aa` 与截短体 `125–268 aa` 平行路线；明确纯度 $\\ge 90\\%$（SDS-PAGE）、浓度 $\\ge 1.0\\text{ mg/mL}$（BCA） | 达标 |\n| **未通过动作** | 若未明确“去 MBP 标签”方案或缺少全长参照，退回修改设计，禁止下单合成质粒 | 闭环 |\n| **交付物** | `RD-FM-001` 项目建议书、`RD-FM-002` 开发计划书、`RD-FM-004` 策划评审表、LabOS 立项编号 | 已建档 |"

  "learn.1": {
    "key": "learn.1",
    "path": "基础知识学习 / DNA设计与基因构建",
    "title": "DNA设计与基因构建",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：把阶段 1 锁定的氨基酸序列，转化为在特定宿主中高效、稳定、可切标的 **工程化表达载体（Expression Construct）**，涵盖 **密码子优化**、**融合标签与酶切盒设计** 以及 **工程化截短/突变改造**。\n- **管理意义**：基因合成只要几百到上千元，但一旦质粒设计漏了一个酶切位点、读码框移位或用错了克隆宿主，后面几个月做出来的全是非目标蛋白。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【工程化表达载体（Expression Construct）】**：把优化好的目标基因、启动子、助溶标签、连接肽和酶切位点精准拼装进质粒骨架（如 `pET-28a`）里形成的环状 DNA 蓝图。\n- **【密码子优化】**：在不改变蛋白质氨基酸序列的前提下，把人类基因里大肠杆菌不认识的“生僻字（稀有密码子）”换成大肠杆菌最常用的“高频字”。\n- **【融合标签与酶切盒设计】**：在目标蛋白前端排好 `纯化标签(6xHis) + 助溶标签(MBP) + 柔性连接肽(Linker) + 蛋白酶切位点(TEV)` 的模块化组合。\n- **【工程化截短/突变改造】**：通过精准删去非表位疏水区（截短）、替换易聚集残基（定点突变）或串联多个优势表位（嵌合），改善抗原的可溶性和信噪比。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R2/R3 必查红线**：下单合成前必须完成翻译比对（确认氨基酸与 UniProt 基准 100% 一致、无移码）；质粒到货必须经 **Sanger 双向全长测序 100% 正确** 并在 `DH5α` 中建档保存。",
    "cases": [
      {
        "title": "Ro52 两条候选质粒构建蓝图对比",
        "tag": "实战案例",
        "body": "## **1. 构建体 A（全长基准参照）**\n- **载体架构**：`pET28a-6xHis-MBP-(GGGGS)3-TEV-Ro52(1-475)`\n- **用途**：保留 100% 天然序列覆盖，作为所有截短体与修饰版本的基准金标准。\n\n---\n\n## **2. 构建体 B（高产低背景截短体）**\n- **载体架构**：`pET28a-6xHis-MBP-(GGGGS)3-TEV-Ro52(125-268)`\n- **设计收益**：完整保留 Coiled-Coil 核心表位区（144 aa），切除了 N 端需锌的 RING 域和 C 端易结合人血清 IgG Fc 的 PRY/SPRY 域，表达量更高、非特异背景更低。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"

  "learn.1.0": {
    "key": "learn.1.0",
    "path": "基础知识学习 / DNA设计与基因构建 / 密码子优化与表达元件",
    "title": "密码子优化与表达元件",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：完成外源基因的 **密码子适应指数（CAI）** 优化、匹配合理强度的 **启动子（Promoter）** 与高稳定性的 **质粒骨架（Vector Backbone）**，确保外源基因在宿主细胞内既能高效转录翻译，又不会因合成过猛而把细菌撑死或全变包涵体。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【密码子适应指数（CAI）】**：Codon Adaptation Index（0 到 1 之间），衡量一段基因序列里的密码子与宿主（如大肠杆菌）常用习惯的匹配程度；优化后通常要求 $\\text{CAI} \\ge 0.80$。\n- **【启动子（Promoter）】**：基因前面的“油门开关”（如强油门 `T7 启动子`、温和油门 `tac/lac 启动子`），控制细菌合成目标蛋白的速度。\n- **【质粒骨架（Vector Backbone）】**：承载目标基因的环状 DNA 底盘（如 `pET` 系列），自带复制起点（决定一个细菌里有几份拷贝）和抗生素抗性基因（如卡那霉素 `KanR`，防止细菌扔掉质粒）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **序列下单必查**：① CAI 是否 $\\ge 0.80$、GC 含量是否在 40%–60%？② 翻译成氨基酸后与原设计序列比对是否 100% 一致？③ 抗生素抗性是否优选卡那霉素（Kan）而非易降解的氨苄（Amp）？",
    "cases": [
      {
        "title": "Ro52 表达元件组合：pET-28a(KanR) + T7lac + 密码子优化",
        "tag": "实战案例",
        "body": "## **1. 元件参数锁定**\n- **密码子优化**：人源 *TRIM21* 原始基因在大肠杆菌中 $\\text{CAI}=0.62$（含大量 `AGA/AGG` 稀有精氨酸密码子）；优化后 **$\\text{CAI}=0.89$，GC 含量 52.4%**。\n- **质粒骨架**：选用 **`pET-28a(+)`（卡那霉素抗性 `KanR`）**，带 `T7lac` 启动子（含 `lacI` 阻遏基因，压制未加 IPTG 时的本底泄漏表达）。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },

        "tag": "实战案例",
        "body": "## **1. 元件参数锁定**\n- **密码子优化**：人源 *TRIM21* 原始基因在大肠杆菌中 $\\text{CAI}=0.62$（含大量 `AGA/AGG` 稀有精氨酸密码子）；优化后 **$\\text{CAI}=0.89$，GC 含量 52.4%**。\n- **质粒骨架**：选用 **`pET-28a(+)`（卡那霉素抗性 `KanR`）**，带 `T7lac` 启动子（含 `lacI` 阻遏基因，压制未加 IPTG 时的本底泄漏表达）。"

  "learn.1.0.0": {
    "key": "learn.1.0.0",
    "path": "基础知识学习 / DNA设计与基因构建 / 密码子优化与表达元件 / 密码子偏好性适配表达宿主",
    "title": "密码子偏好性适配表达宿主",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：利用遗传密码的简并性，将人源或病毒源基因中的 **稀有密码子** 替换为表达宿主偏好的高频密码子，消除 **核糖体翻译停滞** 与 **mRNA二级结构发卡**，在不改变哪怕一个氨基酸的前提下把蛋白产量提升数倍。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【稀有密码子】**：人类基因常用、但大肠杆菌体内对应的搬运工（tRNA）极少的密码子（如精氨酸的 `AGA`、`AGG`，异亮氨酸的 `AUA`）。\n- **【核糖体翻译停滞】**：核糖体读到连续几个稀有密码子时，因为等不到对应的 tRNA 搬运氨基酸而“卡壳”，导致蛋白翻译半途而废（产生大量截短降解条带）。\n- **【mRNA二级结构发卡】**：转录出来的 mRNA 如果局部 GC 太高，自己跟自己粘成死结（发卡结构），挡住核糖体前进的道路，导致蛋白无法起始翻译。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **密码子优化三看**：一看 **CAI $\\ge 0.80$**；二看 **GC 含量控制在 40%–60%** 且无连续 >5 个相同碱基；三看 **5' 端前 40 个碱基自由能**（无稳定发卡结构）。",
    "cases": [
      {
        "title": "Ro52 密码子优化消除截短降解带案例",
        "tag": "实战案例",
        "body": "## **1. 未优化前的踩坑现象**\n- 直接用人源 Ro52 野生型 cDNA 在 BL21(DE3) 中表达，由于含有 14 个大肠杆菌稀有密码子（尤其是精氨酸簇），不仅总产量极低，SDS-PAGE 上还出现多条 30–40 kDa 的 **中途翻译停滞截短杂质带**。\n\n---\n\n## **2. 优化方案与效果**\n- **措施**：由基因合成公司按 *E. coli* B 株密码子表全局优化（$\\text{CAI}$ 从 $0.62 \\rightarrow 0.89$），抹平 5' 端发卡结构，同时配合 `Rosetta(DE3)` 宿主。\n- **结果**：全长条带完整性显著提升，截短副产物基本消失，合成速率提升 3 倍以上。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },

    "path": "基础知识学习 / DNA设计与基因构建 / 密码子优化与表达元件 / 启动子选择: 弱启动子防止过快聚集",
    "title": "启动子选择: 弱启动子防止过快聚集",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：根据目标蛋白的折叠难度，在超强的 **T7强启动子** 与温和可控的 **弱启动子/严谨调控启动子** 之间做出平衡，严控 **本底泄漏表达（Leaky Expression）**，防止蛋白因为“生得太快”来不及折叠而全部抱团进包涵体。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【T7强启动子】**：噬菌体来源的“超级涡轮油门”，一旦诱导开启，细菌几乎把所有能量都用来狂造目标蛋白；对易溶小蛋白是神器，但对 Ro52 这种难折叠蛋白，速度太快反而全堆成包涵体。\n- **【弱启动子/严谨调控启动子】**：如 `T7lac`（带双重刹车）、`tac`、`cspA`（冷休克启动子）或阿拉伯糖 `araBAD` 启动子，能把蛋白合成速度控制在分子伴侣忙得过来的节奏。\n- **【本底泄漏表达（Leaky Expression）】**：还没加诱导剂（IPTG）的时候，启动子关不严实，细菌在长身体阶段就偷偷合成目标蛋白；如果目标蛋白对细菌有一点毒性，会导致质粒丢失或菌液根本长不起来。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **启动子审查必问**：针对难溶自免抗原，若采用 pET 系列 T7 启动子，必须确认是带 `lacO` 操纵基因和 `lacI` 的 **`T7lac` 严谨型载体**，且上游工艺必须配对“低温（16°C）+ 低 IPTG（0.1 mM）”降速措施。",
    "cases": [
      {
        "title": "Ro52 启动子选型与防泄漏控制",
        "tag": "实战案例",
        "body": "## **1. 选型策略**\n- **首选方案**：选用带严谨调控的 **`pET-28a` (`T7lac` 启动子)**，在扩增培养阶段（37°C 长菌至 $\\text{OD}_{600}=0.6$）补充 **0.5% 葡萄糖** 彻底压制本底泄漏表达。\n- **备选降速方案**：若某截短体在 T7 系统下仍过快聚集，可切换至 **`pCold` 冷休克启动子（15°C 专属表达）** 或 **`pMAL-c5X` (`tac` 温和启动子)**，从转录源头放慢肽链吐出速度。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"

    "path": "基础知识学习 / DNA设计与基因构建 / 密码子优化与表达元件 / 载体骨架匹配: pET系列专用质粒",
    "title": "载体骨架匹配: pET系列专用质粒",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：选择与表达宿主、标签系统和工业化发酵兼容的 **pET系列质粒** 骨架，重点管控 **抗生素抗性标记** 的稳定性，并严格执行 **克隆宿主（DH5α）与表达宿主（BL21/Rosetta）分工**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【pET系列质粒】**：原核表达最经典的商业化载体家族（如 `pET-28a`、`pET-32a`），自带 T7lac 启动子、His 标签和多克隆位点。\n- **【抗生素抗性标记】**：质粒上带的“免死金牌”。**卡那霉素（KanR）** 最稳定；而 **氨苄青霉素（AmpR）** 会被细菌分泌到培养基里的 $\\beta$-内酰胺酶迅速分解，导致发酵中后期大量无质粒“白吃白喝”的空菌疯长，产量暴跌。\n- **【克隆宿主（DH5α）与表达宿主（BL21/Rosetta）分工】**：\n  - `DH5α` 是“保险柜”（无 T7 聚合酶，绝对不表达蛋白，且 `recA1/endA1` 突变保证质粒不突变、不降解，专门用来提质粒、测序和长期甘油菌保种）；\n  - `BL21(DE3) / Rosetta(DE3)` 是“生产车间”（含 T7 聚合酶，专门用来加 IPTG 造蛋白，**严禁用来长期保藏质粒**）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **菌种库必查红线**：查 LabOS 菌种台账 —— 主种子库（MCB）质粒是否保藏在 **`DH5α`** 中？凡是只把质粒保存在 `BL21(DE3)` 里反复传代生产的，一律责令重新从质粒转化建库！",
    "cases": [
      {
        "title": "Ro52 载体骨架选型与 DH5α/Rosetta 双菌库防错",
        "tag": "实战案例",
        "body": "## **1. 载体锁定**\n- 选用 **`pET-28a(+)` 骨架（卡那霉素抗性 `KanR`，$50\\ \\mu\\text{g/mL}$）**，杜绝氨苄青霉素在高密度发酵后期失效导致的丢质粒问题。\n\n---\n\n## **2. 克隆与表达双菌库 SOP（严禁混用）**\n1. **保种阶段（DH5α）**：合成的 `pET28a-His-MBP-TEV-Ro52` 质粒先转化 **`DH5α`**，挑单克隆做 **Sanger 双向测序 100% 正确** 后，提取高纯度质粒 + 建立 `DH5α` 甘油主细胞库（-80°C）。\n2. **表达阶段（Rosetta(DE3)）**：每次生产或小试前，取测序合格的质粒转化进 **`Rosetta(DE3)`** 新鲜涂板挑菌，绝不拿上个月诱导剩的 `Rosetta` 老菌液直接传代放大。"
      }

  "learn.1.1": {
    "key": "learn.1.1",
    "path": "基础知识学习 / DNA设计与基因构建 / 标签与酶切位点设计",
    "title": "标签与酶切位点设计",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：科学设计目标蛋白前端的 **双标签系统（Dual-Tag）**、**特异性蛋白酶切位点** 与 **柔性连接肽（Linker）**，实现“表达时能助溶、粗纯时能一把抓、酶切后能把标签彻底扒干净”的工业闭环。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【双标签系统（Dual-Tag）】**：把“小巧的纯化抓手（`6xHis`）”和“大块头的助溶救生圈（`MBP` 或 `SUMO`）”串联在一起（如 `6xHis-MBP`），兼顾高溶解度与镍柱高回收率。\n- **【特异性蛋白酶切位点】**：在标签和目标蛋白之间安放一段特定的“暗号序列”（如 TEV 酶只认 `ENLYFQ↓G`），像精准手术刀一样只切暗号、绝不误伤目标抗原内部。\n- **【柔性连接肽（Linker）】**：在标签和目标蛋白之间加一段像软绳子一样的氨基酸序列（如 `GGGGS` 重复序列），拉开两个蛋白的距离，防止大标签挡住蛋白酶下刀，也防止两个蛋白折叠时撞在一起。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **标签盒设计必查**：检查构建图谱 —— `6xHis` 是否放在 `MBP` 的最外侧（N 端）？这样 TEV 酶切后，`6xHis-MBP` 依然带着 His 标签，才能用镍柱一把反挂除掉！如果顺序反了（`MBP-6xHis-TEV-蛋白` 还好，若 `MBP-TEV-6xHis-蛋白` 则切下的 MBP 没法用镍柱除）。",
    "cases": [
      {
        "title": "Ro52 的 N 端模块化标签盒精确排布图",
        "tag": "实战案例",
        "body": "## **1. 标准排布顺序（从 N 端到 C 端）**\n`[ATG] — [6xHis] — [MBP 助溶域] — [15~20 aa 柔性 Linker] — [TEV 酶切位点 ENLYFQ↓G] — [Ro52 目标区]`\n\n---\n\n## **2. 防错要点**\n- **反挂逻辑核对**：该排布下，加入带 `6xHis` 的 TEV 酶切完后，体系里有三种东西：① `6xHis-MBP`（带 His）、② `6xHis-TEV酶`（带 His）、③ `纯 Ro52`（无 His）。直接流过 Ni-NTA 柱，① 和 ② 全被扣在柱子上，流穿液直接拿到高纯度无标签 Ro52！"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },

    "path": "基础知识学习 / DNA设计与基因构建 / 标签与酶切位点设计 / 助溶与亲和标签: MBP-6xHis双标签",
    "title": "助溶与亲和标签: MBP-6xHis双标签",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过 **MBP-6xHis双标签**（或 **His-SUMO双标签**）协同发挥 **分子伴侣助溶效应** 与 **IMAC固定化金属亲和捕获** 优势，解决自免抗原在原核系统中的不溶与难纯化瓶颈。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【MBP-6xHis双标签】**：大肠杆菌麦芽糖结合蛋白（MBP，约 42.5 kDa）与 6 个组氨酸（6xHis）的组合，是目前原核表达公认助溶能力最强的王牌组合之一。\n- **【His-SUMO双标签】**：酵母小泛素相关修饰蛋白（SUMO，约 11 kDa）与 6xHis 的组合；分子量比 MBP 小（目标蛋白占比高），且配套的 ULP1 蛋白酶只认 SUMO 的三维结构，切割效率极高且不留多余氨基酸残基。\n- **【分子伴侣助溶效应】**：MBP 在核糖体最前端先翻译折叠好，像一个大号的亲水海绵垫，把紧接着翻译出来的 Ro52 疏水区护在怀里，阻止不同 Ro52 分子之间发生疏水碰撞结块。\n- **【IMAC固定化金属亲和捕获】**：Immobilized Metal Affinity Chromatography，即镍柱（Ni-NTA）层析，利用 `6xHis` 对 $\\text{Ni}^{2+}$ 的螯合作用实现高选择性捕获。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **双标签核算必查**：用大标签（MBP 42.5 kDa）融合后，总分子量变为 $42.5 + 54.2 = 96.7\\text{ kDa}$，计算得率时必须扣掉约 44% 的标签重量（10 mg 融合蛋白切完最多只剩 5.6 mg 纯 Ro52）！",
    "cases": [
      {
        "title": "Ro52 采用 MBP-6xHis vs. His-SUMO 的质量平衡核算",
        "tag": "实战案例",
        "body": "## **1. 两种双标签在 Ro52 上的实操对比**\n| 指标 | `6xHis-MBP-TEV-Ro52` | `6xHis-SUMO-Ro52` |\n|---|---|---|\n| **标签大小** | ~43 kDa（全长融合体 ~97 kDa） | ~12 kDa（全长融合体 ~66 kDa） |\n| **助溶能力** | ⭐⭐⭐⭐⭐（极强，全长 1–475 首选） | ⭐⭐⭐⭐（强，125–268 截短体首选） |\n| **配套蛋白酶** | TEV 酶（切点后留 1 个 `G` 或 `S`） | ULP1 (SUMO 酶，零残留切割) |\n| **理论质量扣减** | 切标后理论最高质量收率 55.8% | 切标后理论最高质量收率 81.8% |"
      }

    "path": "基础知识学习 / DNA设计与基因构建 / 标签与酶切位点设计 / 蛋白酶切位点: TEV或凝血酶切位点",
    "title": "蛋白酶切位点: TEV或凝血酶切位点",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在融合标签与目标抗原之间嵌入高特异性的 **TEV蛋白酶切位点**（或 **SUMO/ULP1酶切系统**），替代容易乱切目标蛋白的 **凝血酶（Thrombin）**，确保切标过程既能 100% 卸下标签，又绝不把目标抗原切成碎片。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【TEV蛋白酶切位点】**：烟草蚀纹病毒蛋白酶（TEV Protease），严格识别 **7 个氨基酸的暗号序列 `E-N-L-Y-F-Q ↓ G/S`**（在谷氨酰胺 Q 和甘氨酸 G 之间下刀）。因为 7 个氨基酸同时撞衫的概率极低，所以几乎从不误伤目标蛋白，且在 4°C 低温下也能干活。\n- **【SUMO/ULP1酶切系统】**：ULP1 蛋白酶认识的是整个 SUMO 标签的三维球状构象，直接在 SUMO 尾巴最后一个甘氨酸后面下刀，切完的目标蛋白 N 端连一个多余氨基酸都不留。\n- **【凝血酶（Thrombin）】**：老一代载体常用的蛋白酶，只认短短的 `L-V-P-R ↓ G-S`（甚至遇到蛋白表面暴露的精氨酸 R 就会乱切），极易把目标抗原内部切断（非特异星号活性），现代 IVD 抗原开发应尽量淘汰。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **酶切设计必查**：① 目标蛋白自身内部序列是否含有 `ENLYFQ`？（必须在设计软件里全局搜索确认 0 匹配）；② 选用的载体如果是自带 Thrombin 位点的老 `pET-28a`，必须改成 `TEV` 或 `SUMO` 位点！",
    "cases": [
      {
        "title": "Ro52 淘汰 Thrombin 改用 TEV 酶切防降解案例",
        "tag": "实战案例",
        "body": "## **1. 踩坑原因（为什么不能用 pET-28a 自带的 Thrombin 位点）**\n- Ro52 全长含有高达 **33 个精氨酸（Arg, R）**，且卷曲螺旋区与连接区暴露度高；若用 Thrombin 切标签，主带会出现明显内部断裂降解（产生 25 kDa / 30 kDa 杂带）。\n\n---\n\n## **2. 受控改进方案**\n- 统一在 MBP 与 Ro52 之间设计 **`ENLYFQ↓G` TEV 识别位点**。\n- **酶切工艺参数**：按质量比 `TEV酶 : 融合蛋白 = 1 : 20~1 : 50`，在 **4°C 温和透析酶切 12–16 h**（缓冲液不含高浓度咪唑，含 $0.5\\text{ mM DTT}$ 或 TCEP 维持 TEV 活性），切割率 $>95\\%$ 且 Ro52 主带零内部降解。"
      }

    "path": "基础知识学习 / DNA设计与基因构建 / 标签与酶切位点设计 / 柔性连接肽: 15-25个氨基酸Linker",
    "title": "柔性连接肽: 15-25个氨基酸Linker",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在融合大标签（或串联表位）与目标蛋白之间设计合适长度（通常 15–25 aa）的 **柔性连接肽（Flexible Linker）**，消除 **空间位阻（Steric Hindrance）**，保证蛋白酶能顺畅伸进去切掉标签，或在固相包被时让表位充分向外伸展。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【柔性连接肽（Flexible Linker）】**：主要由甘氨酸（`G`，体积最小、像万向节一样灵活）和丝氨酸（`S`，亲水、防止绳子自己打结）组成的重复序列，最经典的是 **`(GGGGS)_3`**（15 aa）到 **`(GGGGS)_4`**（20 aa）。\n- **【空间位阻（Steric Hindrance）】**：如果 MBP（42 kDa 大球）和 Ro52（54 kDa）挨得太紧，中间的 TEV 酶切位点会被两个大球夹在缝隙里，TEV 蛋白酶根本伸不进刀头，导致“加再多酶也切不开”。\n- **【阅读框对齐（In-Frame）】**：DNA 每 3 个碱基编码 1 个氨基酸；插入 Linker 和酶切位点时，总碱基数必须是 **3 的整数倍**，少一个或多一个碱基就会导致后面整个 Ro52 全部乱码（移码突变）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Linker 审查必看**：① 长度是否足够拉开大标签与核心域（建议 15–25 aa）？② 插入 Linker 后，整条 ORF 从起始密码子 `ATG` 到终止密码子 `TAA` 翻译出的氨基酸序列是否 100% 无移码？",
    "cases": [
      {
        "title": "Ro52 加长柔性 Linker 解决 TEV 酶切不全案例",
        "tag": "实战案例",
        "body": "## **1. 问题复盘**\n- 早期某版构建在 MBP 与 TEV 位点间仅留了 4 个氨基酸短间隔，结果纯化出的 `MBP-Ro52` 加入 TEV 酶后，**即使室温切 24 小时也只有不到 40% 被切开**（空间位阻挡住了 TEV 酶）。\n\n---\n\n## **2. 解决措施**\n- 在 MBP C 端与 TEV 位点 `ENLYFQG` 之间插入 **15 aa 柔性连接肽 `(GGGGS)_3`**（共加上酶切位点区域约 22 aa 间隔臂），TEV 酶在 4°C 下 12 小时切割效率即提升至 **95% 以上**。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"

    "title": "工程化突变改造方案",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：当天然全长蛋白难以制备或存在固有交叉反应域时，运用 **截短体工程（Truncation）**、**疏水定点突变** 或 **多表位嵌合设计（Chimera）** 对分子进行理性改造，并用严密的平行实验证明“改造只去掉了毛病、没丢掉核心检出率”。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【截短体工程（Truncation）】**：像修剪树枝一样，把没有诊断价值又容易惹祸的区段（如跨膜疏水区、非特异结合区）整段剪掉，只保留患者抗体最爱抓的核心结构域。\n- **【疏水定点突变】**：在不属于抗体表位的蛋白表面，把几个极易互相粘连的强疏水氨基酸（如亮氨酸 L、异亮氨酸 I）精准替换成亲水氨基酸，降低聚集倾向。\n- **【多表位嵌合设计（Chimera）】**：把同一个蛋白的不同优势片段（或同一疾病的多个靶点片段）用柔性 Linker 串成一条新蛋白，试图实现“一管测多靶”。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **工程改造铁律**：任何截短、突变或嵌合版本，在未与 **全长基准蛋白** 在同一套包含“弱阳性”与“相关疾病阴性”的血清盘上完成头对头验证前，**一律属于待验证候选（E4），不得直接替代全长定型**！",
    "cases": [
      {
        "title": "Ro52 三种工程化路线（全长 vs 截短 vs 嵌合）取舍矩阵",
        "tag": "实战案例",
        "body": "## **1. 三种路线头对头对比**\n| 路线 | 氨基酸范围 | 制备难度 | 表位完整性 | 非特异背景风险 | 适用定位 |\n|---|---|---|---|---|---|\n| **路线 A：全长** | `1–475 aa` | 高（需 MBP + 补锌） | 100% 完整 | 需防 C 端 Fc 结合 | **金标准参照 & 全表位原料** |\n| **路线 B：核心截短** | `125–268 aa` | 低（高产可溶） | 覆盖主优势区 | 极低（已切掉 Fc 域） | **高性价比主力候选（需测弱阳覆盖率）** |\n| **路线 C：双肽嵌合** | `107–122` + `365–382` | 极低 | 仅线性短肽 | 连接处可能产生新背景 | **教学探索，不可单独作主原料** |"
      }

    "path": "基础知识学习 / DNA设计与基因构建 / 工程化突变改造方案 / 疏水片段定点突变与序列替换",
    "title": "疏水片段定点突变与序列替换",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：利用生物信息学工具计算序列的 **GRAVY疏水性指数** 并结合 **AlphaFold置信度（pLDDT）** 与三维结构表面扫描，定位导致蛋白聚集的非表位暴露疏水斑块，通过定点突变或边界微调提升溶解度与稳定性。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【GRAVY疏水性指数】**：Grand Average of Hydropathicity，衡量一段多肽“怕水程度”的数值；正值越大越疏水（越容易沉淀），负值代表亲水。\n- **【AlphaFold置信度（pLDDT）】**：AI 预测三维结构时给每个氨基酸打的“把握分”（0–100）。$>90$ 说明结构非常固定；$<50$ 通常代表这段是柔软乱晃的无序区（容易被蛋白酶切碎），但 **低置信度不等于没有表位，不能不经实验就直接删掉**。\n- **【非功能性半胱氨酸突变】**：有些蛋白表面有落单的游离半胱氨酸（Cys），在储存过程中会跟别的分子乱结二硫键变成多聚体；在确认不是表位后，可突变为丝氨酸（Ser）防止氧化聚集。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **突变审核红线**：绝对不允许仅凭结构模型预测“这块疏水/置信度低”就直接删改并宣布定型；每一个定点突变都必须记录 **「原残基 → 突变残基 + 坐标」**，并与未突变版本做血清反应性配对比较！",
    "cases": [
      {
        "title": "Ro52 结构建模与疏水/半胱氨酸分析防错",
        "tag": "实战案例",
        "body": "## **1. 结构分析与防错结论**\n- **不能乱突变的内部疏水残基**：Ro52 的 Coiled-Coil 区（128–238 aa）每隔 3–4 个氨基酸就有疏水残基（七肽重复 Heptad Repeat），它们是 **形成二聚体螺旋界面的必需骨架**！如果把这些疏水点突变掉，螺旋直接散架，p200 构象表位随之消失。\n- **正确的工程策略**：不破坏 Coiled-Coil 内部疏水核心，而是通过切除两端高风险冗余区（保留 125–268 aa）或利用 N 端可切 MBP 标签在表达期临时保护。"
      }

  "learn.1.2.1": {
    "key": "learn.1.2.1",
    "path": "基础知识学习 / DNA设计与基因构建 / 工程化突变改造方案 / 全长与截短体筛选策略",
    "title": "全长与截短体筛选策略",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：建立科学的 **全长与截短体平行筛选** 机制，在切除高疏水/高干扰区段提升产量的同时，通过 **摩尔量/包被量归一化** 与弱阳性样本配对测试，严防因过度截短导致的 **表位覆盖率损失**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【全长与截短体平行筛选】**：开发截短体时，必须同时拿全长蛋白放在同一块酶标板/同一批磁珠上测同一批血清，看截短体有没有把原本全长能测出来的阳性样本给漏掉。\n- **【表位覆盖率损失】**：不同病人体内产生的抗 Ro52 抗体抓的位置不完全一样；85% 的病人抓中间的 Coiled-Coil，但可能有 10% 的病人专门抓 N 端或 C 端。切掉两端虽然好生产了，但会漏掉那 10% 的病人。\n- **【摩尔量/包被量归一化】**：全长 Ro52（54 kDa）比截短体（17 kDa）重 3 倍多！如果都按 $1\\ \\mu\\text{g/mL}$ 的相同重量去包被，截短体的分子个数其实是全长的 3 倍。比较两者活性时，必须考虑分子数（摩尔浓度）和实际挂到板上的有效包被量。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **截短体评测三问**：① 跟全长比过了吗？② 比较时是怎么归一化的（按等质量还是等摩尔梯度滴定）？③ 有没有测 **弱阳性/临界值样本**（强阳性谁都能测出来，弱阳性才能看出有没有丢表位）？",
    "cases": [
      {
        "title": "Ro52 全长 (1–475) vs. 截短体 (125–268) 公平比武方案",
        "tag": "实战案例",
        "body": "## **1. 平行对比实验设计**\n- **受试材料**：路线 A 全长 Ro52（去标签后 54.2 kDa） vs. 路线 B 截短体 Ro52（125–268 aa，去标签后约 16.8 kDa）。\n- **归一化方式**：同时设置 **等质量浓度梯度（0.5 / 1.0 / 2.0 / 4.0 $\\mu\\text{g/mL}$）** 与 **等摩尔浓度梯度（20 / 40 / 80 $\\text{nM}$）** 包被。\n\n---\n\n## **2. 判读规则**\n- 若 `125–268 aa` 在阴性血清和类风湿因子（RF）/高 IgG 干扰血清上的背景明显低于全长，但在 30 份临床确诊抗 Ro52 阳性血清（含 10 份弱阳性）中漏检 $\\ge 2$ 份，则需评估“将全长与截短体按比例复配包被”或保留全长优化工艺。"
      }

    "title": "嵌合表位抗原串联设计",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：探索将多个独立的优势表位片段通过连接肽拼接成 **嵌合多表位抗原（Chimeric Antigen）** 的可行性，必须通过 **单片段与物理混合对照** 排查 **连接区新生假表位（Neo-epitope）** 和空间遮挡风险。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【嵌合多表位抗原（Chimeric Antigen）】**：把原本不挨着的两段肽（比如 A 段和 B 段）或者两个不同蛋白的表位（如 Ro52 + Ro60）用 Linker 焊成一条新蛋白。\n- **【单片段与物理混合对照】**：验证 `A-Linker-B` 拼接蛋白好不好用时，必须同时测“单独 A”、“单独 B”以及“A 和 B 直接倒在一起混合（不焊接）”，看焊接到底带来了增益还是破坏。\n- **【连接区新生假表位（Neo-epitope）】**：A 段的尾巴、Linker 和 B 段的头焊在一起后，意外拼出了一段自然界原本不存在的新形状，结果正常人血清里的杂抗体正好能粘上去，导致阴性背景莫名其妙飙升。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **嵌合设计红线**：**两段肽各自有 60% 检出率，拼在一起绝对不等于 100% 检出率**！没有“单片段对照 + 物理混合对照 + 阴性背景排查”的嵌合抗原，一律不准定型投产。",
    "cases": [
      {
        "title": "Ro52 线性双肽嵌合体 (107–122 + 365–382) 的对照设计",
        "tag": "教学对照案例",
        "body": "## **1. 方案构建与风险**\n- 拟将 1994 年文献报道的两段线性肽 `Ro52(107–122: GKALCWVCAQSRKHRD)` 与 `Ro52(365–382: RKGHFLLSSKSGFWTIWL)` 通过 `(GGGGS)_3` 拼接，并设计 `A-Linker-B` 与 `B-Linker-A` 两种顺序。\n\n---\n\n## **2. 必须设置的四组对照**\n1. **单肽 A**（107–122）与 **单肽 B**（365–382）单独包被；\n2. **A + B 等摩尔物理混合**包被；\n3. **纯 Linker + 标签**空白对照（排查连接处是否吸阴性血清）；\n4. **全长 Ro52 (1–475)** 基准参照（验证两段短肽是否漏掉了 p200 构象型阳性患者）。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"

  "learn.1.3": {
    "key": "learn.1.3",
    "path": "基础知识学习 / DNA设计与基因构建 / Gate｜② 分子与材料设计",
    "title": "Gate｜② 分子与材料设计",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R2（分子与材料设计评审关口）** 在下单合成基因前，对 **构建体图谱与序列版本号**、**标签去留与对照计划** 以及 **预设验收标准（Pre-defined Acceptance Criteria）** 进行最终锁定。\n- **管理原则**：验收标准必须在看到实验结果之前白纸黑字定好，严禁“做出来多少算多少、看结果反改标准”。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【构建体图谱与序列版本号】**：完整标明载体骨架、抗性、启动子、标签、Linker、酶切位点、目标基因起止 aa 坐标及唯一版本号（如 `V1.0`）的受控文件。\n- **【标签去留与对照计划】**：在设计阶段就定死成品是否切标签；若保留标签或做修饰，必须同步设计好对应的阴性对照材料。\n- **【预设验收标准（Pre-defined Acceptance Criteria）】**：实验开始前写入《设计开发输入清单》（`RD-FM-003`）的合格线（理化纯度、浓度、活性信噪比、阴阳性符合率）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R2 放行必查**：核对《设计开发输入清单》（`RD-FM-003`）与构建图谱 —— 序列边界是否有歧义？理论分子量（含带标签与切标签两个数值）和等电点（pI）算出来没有？",
    "cases": [
      {
        "title": "Ro52 项目 Gate R2 设计输入锁定清单",
        "tag": "Gate 评审案例",
        "body": "## **1. Gate R2 锁定参数表**\n- **构建版本**：\n  - `Construct-A (V1.0)`：`pET28a-6xHis-MBP-(GGGGS)3-TEV-Ro52(1-475)`（带标签 MW $\\approx 97.5\\text{ kDa}$，TEV 切后 MW $= 54.2\\text{ kDa}$，理论 $\\text{pI} = 6.35$）\n  - `Construct-B (V1.0)`：`pET28a-6xHis-MBP-(GGGGS)3-TEV-Ro52(125-268)`（TEV 切后 MW $\\approx 16.8\\text{ kDa}$）\n- **预设验收标准**：切标纯化后 SDS-PAGE 纯度 $\\ge 90\\%$，SEC-HPLC 二聚体主峰占比 $\\ge 85\\%$，临床参考血清盘（阳 20 / 阴 30）符合率 $\\ge 95\\%$。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },

  "learn.1.4": {
    "key": "learn.1.4",
    "path": "基础知识学习 / DNA设计与基因构建 / Gate｜③ 构建与原料准备",
    "title": "Gate｜③ 构建与原料准备",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R3（构建与原料准备关口）** 确保从基因合成公司或分子组拿到的起始材料 100% 可靠——质粒必须通过 **Sanger双向全长测序**（零突变、零覆盖盲区），在 `DH5α` 中建立 **主种子库（MCB）**，且所有外购原料（酶、填料、合成物）均来自 **合格供方名录（ASL）** 并通过来料检验。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Sanger双向全长测序】**：第一代测序金标准；不能只看菌落 PCR 条带大小对不对，必须用正向和反向测序引物把整个标签、连接区和目标基因从头到尾读通，确认每一个碱基都跟设计图一模一样。\n- **【主种子库（MCB）】**：Master Cell Bank，把测序 100% 正确的质粒转化进 `DH5α` 后，分装冻存在 $-80^\\circ\\text{C}$ 的原始标准种子管（标明构建名称、版本号、宿主、测序报告号、冰箱盒位置）。\n- **【合格供方名录（ASL）】**：Approved Supplier List，经质量体系评估批准的供应商名单；严禁随便在网店买未经验证的填料或原料直接投产（曾触发外审不符合项 Q8.4.1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R3 放行红线**：① 只做了菌落 PCR 没做全长测序的克隆，不准进表达！② 测序拼接报告里有“未覆盖缺口”或“套峰（混合克隆）”的，不准放行！③ 保存管标签没写清宿主（是 `DH5α` 还是 `Rosetta`）的，退回重贴重核！",
    "cases": [
      {
        "title": "Ro52 质粒 Sanger 测序核验与种子建档案例",
        "tag": "Gate 评审案例",
        "body": "## **1. Gate R3 实物核验项**\n1. **测序核对**：使用 `T7 Promoter`、`T7 Terminator` 及 MBP 内部正向测序引物三引物拼接，覆盖 `6xHis-MBP-Linker-TEV-Ro52` 全长编码区及起止密码子，翻译比对 **100% 无点突变、无移码、无双峰**。\n2. **双库登记（LabOS 批次与样品）**：\n   - **质粒保存库**：`DH5α / pET28a-MBP-Ro52-FL-V1.0`，冻存位置 `-80°C 1号冰箱 2层 A3盒 #01~#10`。\n   - **表达工作菌株**：新鲜转化 `Rosetta(DE3)` 单克隆，经小量诱导确认表达后建立工作种子库（WCB）。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },

  "learn.2": {
    "key": "learn.2",
    "path": "基础知识学习 / 上游发酵与表达系统",
    "title": "上游发酵与表达系统",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在选定的表达宿主中，通过精细调控 **小试诱导动力学（温度/IPTG/时间/金属离子）**，实现高比例的 **可溶性功能表达**，并以高速离心收获的 **湿菌体（Wet Cell Paste）** 作为上游发酵向中下游纯化交接的标准受控资产。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【小试诱导动力学】**：在正式放大几十升发酵前，先用摇瓶测试不同温度（如 16°C vs 37°C）、不同诱导剂浓度和诱导时间下的长菌速度和蛋白产出效率。\n- **【可溶性功能表达】**：超声破菌离心后，目标蛋白真正溶解在 **上清液（Supernatant）** 中且保持正确三维折叠，而不是沉在管底的包涵体渣子里。\n- **【湿菌体（Wet Cell Paste）】**：发酵结束、高速离心倒掉培养液后留在离心瓶底的菌泥；称重（g/L 培养基）并贴签冻存，是上游组移交给纯化组的“半成品交接物”。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R4 必查红线**：比较不同表达条件好坏时，**必须按等量菌体（$\\text{OD}_{600}$ 归一化）取样，且将“总菌、破菌上清、破菌沉淀”三道并排跑在同一块 SDS-PAGE 胶上**！只跑一张总菌胶或取样体积不统一的比较结论一律作废。",
    "cases": [
      {
        "title": "Ro52 上游小试筛选与放大收获全记录",
        "tag": "实战案例",
        "body": "## **1. 最优上游工艺参数卡片**\n- **菌株与培养基**：`Rosetta(DE3)`，TB 富营养培养基（含 $50\\ \\mu\\text{g/mL Kan} + 34\\ \\mu\\text{g/mL Chloramphenicol}$）。\n- **长菌阶段**：37°C、220 rpm 培养至 $\\text{OD}_{600} = 0.6\\text{–}0.8$，**先把摇床降温至 16°C 静置冷透 30 分钟**。\n- **诱导阶段**：加入 **$0.1\\text{ mM IPTG} + 50\\ \\mu\\text{M ZnCl}_2$**，16°C、180 rpm 慢速诱导 **16–18 小时**。\n- **收获交接**：8,000 rpm、4°C 离心 15 min 收集湿菌体，得率约 **18.5 g 湿菌/L 培养液**，上清可溶占比 $>50\\%$。"

    "title": "上游发酵与表达系统",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在选定的表达宿主中，通过精细调控 **小试诱导动力学（温度/IPTG/时间/金属离子）**，实现高比例的 **可溶性功能表达**，并以高速离心收获的 **湿菌体（Wet Cell Paste）** 作为上游发酵向中下游纯化交接的标准受控资产。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【小试诱导动力学】**：在正式放大几十升发酵前，先用摇瓶测试不同温度（如 16°C vs 37°C）、不同诱导剂浓度和诱导时间下的长菌速度和蛋白产出效率。\n- **【可溶性功能表达】**：超声破菌离心后，目标蛋白真正溶解在 **上清液（Supernatant）** 中且保持正确三维折叠，而不是沉在管底的包涵体渣子里。\n- **【湿菌体（Wet Cell Paste）】**：发酵结束、高速离心倒掉培养液后留在离心瓶底的菌泥；称重（g/L 培养基）并贴签冻存，是上游组移交给纯化组的“半成品交接物”。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R4 必查红线**：比较不同表达条件好坏时，**必须按等量菌体（$\\text{OD}_{600}$ 归一化）取样，且将“总菌、破菌上清、破菌沉淀”三道并排跑在同一块 SDS-PAGE 胶上**！只跑一张总菌胶或取样体积不统一的比较结论一律作废。",

  "learn.2.0": {
    "key": "learn.2.0",
    "path": "基础知识学习 / 上游发酵与表达系统 / 表达宿主系统筛选",
    "title": "表达宿主系统筛选",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：根据靶蛋白的复杂度、修饰需求与开发周期，在 **原核大肠杆菌系统**、**真核哺乳动物细胞系统** 与 **无细胞蛋白合成系统（CFPS）** 之间科学选型，在满足临床血清学活性的前提下实现最优的工业成本与批间一致性。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【原核大肠杆菌系统】**：细菌发酵车间（周期 2–3 天，成本极低，产量高），适合无需糖基化修饰的蛋白（如 Ro52、核糖体 P0）。\n- **【真核哺乳动物细胞系统】**：如中国仓鼠卵巢细胞（CHO）或人胚肾细胞（HEK293），周期 7–14 天、培养基昂贵，但自带全套人类级别的折叠伴侣、二硫键异构酶和糖基化修饰机器（适合 $\\beta_2\\text{GPI}$、TPO、单抗）。\n- **【无细胞蛋白合成系统（CFPS）】**：Cell-Free Protein Synthesis，把细胞打碎抽取出里面的核糖体和酶做成“试管浓缩汤”，直接往试管里加 DNA 模板，2–4 小时就能造出微量蛋白（适合早期几百个突变体的极速高通量快筛，不适合大批量生产）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **宿主匹配核查**：转化表达前，必须核对 **载体启动子与宿主是否配套**（例如 `pET` 载体含 T7 启动子，必须转入带 `(DE3)` 标志的宿主菌株；如果误转入不带 DE3 的普通菌株，加再多 IPTG 也一克蛋白都出不来）。",
    "cases": [
      {
        "title": "自免抗原三大宿主系统选型矩阵（Ro52 / β2GPI / 快速突变筛查）",
        "tag": "实战案例",
        "body": "## **1. 选型决策对照表**\n| 表达底盘 | 代表菌株/细胞系 | 本公司适用靶点 | 核心优势 | 局限性 |\n|---|---|---|---|---|\n| **大肠杆菌** | `Rosetta(DE3)` / `BL21(DE3)` | **Ro52**、Histone 八聚体、P0 | 成本极低、周期 2 天、易放大 | 无糖基化，难溶蛋白需 MBP 助溶 |\n| **哺乳细胞** | `Expi293F` / `ExpiCHO` | **β2GPI**、自身免疫重组单抗 | 天然构象、完整糖基化与二硫键 | 成本高 10 倍，周期 1–2 周 |\n| **无细胞 CFPS** | *E. coli* S30 裂解物体外翻译 | 早期数十个表位截短体快筛 | 4 小时出结果，免转化免破菌 | 仅限微克级初筛，无法工业量产 |"
      }

    "path": "基础知识学习 / 上游发酵与表达系统 / 表达宿主系统筛选 / 大肠杆菌系统: Rosetta(DE3)低温保溶",
    "title": "大肠杆菌系统: Rosetta(DE3)低温保溶",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握大肠杆菌王牌表达菌株 **Rosetta(DE3)** 的遗传改造原理 —— 利用染色体整合的 **λDE3溶原噬菌体（T7聚合酶）** 驱动强效转录，借助自带的 **pRARE稀有密码子tRNA质粒** 消除人源基因翻译瓶颈，并依靠 **Lon与OmpT蛋白酶缺失** 防止目标蛋白在破菌时被消化。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Rosetta(DE3)】**：在经典 `BL21(DE3)` 基础上专门为表达“人类等真核基因”升级的特种工程菌。\n- **【λDE3溶原噬菌体（T7聚合酶）】**：菌株名字里带 `(DE3)`，代表它的染色体里装了 T7 RNA 聚合酶基因（由 IPTG 控制开关），专门用来启动 `pET` 系列质粒上的 T7 启动子。\n- **【pRARE稀有密码子tRNA质粒】**：Rosetta 菌体内自带的一张辅助小质粒（具 **氯霉素抗性 `CamR`**），能额外供应大肠杆菌最缺的 6 种稀有密码子 tRNA（`AUA, AGG, AGA, CUA, CCC, GGA`），专治人源基因翻译卡壳。\n- **【Lon与OmpT蛋白酶缺失】**：把细菌体内两个最爱乱剪外源蛋白的“剪刀手”（胞内蛋白酶 Lon 和外膜蛋白酶 OmpT）基因敲除掉，保护表达出来的 Ro52 不被细菌消化。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Rosetta 培养防错必查**：使用 `Rosetta(DE3)` 时，培养基里建议同时加 **主质粒抗生素（如 Kan $50\\ \\mu\\text{g/mL}$）+ 氯霉素（Chloramphenicol $34\\ \\mu\\text{g/mL}$）**，防止细菌在培养中把自带的 `pRARE` 辅助质粒弄丢！",
    "cases": [
      {
        "title": "Ro52 在 Rosetta(DE3) vs. 普通 BL21(DE3) 中的表达表现",
        "tag": "实战案例",
        "body": "## **1. 实测对比经验**\n- 即使经过密码子优化，在大规模诱导表达 ~97 kDa 的大分子量融合蛋白 `6xHis-MBP-Ro52` 时，**`Rosetta(DE3)`（双抗性 Kan + Cam 培养）** 的全长完整条带占比和批次稳定性明显优于普通 `BL21(DE3)`。\n- **防错提示**：活化 `Rosetta(DE3)` 时因为双抗生素压力，长菌至 $\\text{OD}_{600}=0.6$ 的时间比单抗性 `BL21` 慢约 45–60 分钟，严禁还没长到对数期就提前按固定钟点加 IPTG！"
      }

    "path": "基础知识学习 / 上游发酵与表达系统 / 表达宿主系统筛选 / 哺乳动物细胞: CHO/293T天然修饰",
    "title": "哺乳动物细胞: CHO/293T天然修饰",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：对于必须依赖天然糖链、复杂二硫键配对或精细立体构象的自免抗原与工程抗体，采用 **CHO/HEK293哺乳动物细胞** 表达系统，利用真核 **内质网折叠质量控制（ERQC）** 与 **信号肽分泌表达**，直接从无血清培养上清中收获高活性天然构象蛋白。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【CHO/HEK293哺乳动物细胞】**：`HEK293`（人胚肾悬浮细胞，如 Expi293F）最适合毫克到百毫克级快速瞬时转染（Transient Transfection，5–7 天收样）；`CHO`（中国仓鼠卵巢细胞）最适合建立稳定细胞株做克到公斤级工业化放大。\n- **【内质网折叠质量控制（ERQC）】**：哺乳动物细胞自带的“质检车间”（含 BiP、钙联蛋白、PDI 二硫键异构酶），折叠不对的蛋白不准分泌出细胞，从源头保证分泌出来的都是正确构象。\n- **【信号肽分泌表达】**：在蛋白 N 端加一段“快递导航头”（分泌信号肽，如鼠 IgG $\\kappa$ 链信号肽），细胞造好蛋白后自动剪掉导航头并把蛋白吐到细胞外的培养液里——不用破细胞，离心取培养液上清就能直接过柱纯化，杂蛋白极少！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **真核路线审核必看**：① 载体是否换成了真核启动子（如 `CMV` 启动子，`pET` 载体在哺乳细胞里是废纸）？② 如果是分泌表达，N 端是否加了分泌信号肽且确认了信号肽切割位点？",
    "cases": [
      {

    "title": "哺乳动物细胞: CHO/293T天然修饰",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：对于必须依赖天然糖链、复杂二硫键配对或精细立体构象的自免抗原与工程抗体，采用 **CHO/HEK293哺乳动物细胞** 表达系统，利用真核 **内质网折叠质量控制（ERQC）** 与 **信号肽分泌表达**，直接从无血清培养上清中收获高活性天然构象蛋白。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【CHO/HEK293哺乳动物细胞】**：`HEK293`（人胚肾悬浮细胞，如 Expi293F）最适合毫克到百毫克级快速瞬时转染（Transient Transfection，5–7 天收样）；`CHO`（中国仓鼠卵巢细胞）最适合建立稳定细胞株做克到公斤级工业化放大。\n- **【内质网折叠质量控制（ERQC）】**：哺乳动物细胞自带的“质检车间”（含 BiP、钙联蛋白、PDI 二硫键异构酶），折叠不对的蛋白不准分泌出细胞，从源头保证分泌出来的都是正确构象。\n- **【信号肽分泌表达】**：在蛋白 N 端加一段“快递导航头”（分泌信号肽，如鼠 IgG $\\kappa$ 链信号肽），细胞造好蛋白后自动剪掉导航头并把蛋白吐到细胞外的培养液里——不用破细胞，离心取培养液上清就能直接过柱纯化，杂蛋白极少！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **真核路线审核必看**：① 载体是否换成了真核启动子（如 `CMV` 启动子，`pET` 载体在哺乳细胞里是废纸）？② 如果是分泌表达，N 端是否加了分泌信号肽且确认了信号肽切割位点？",

    "title": "无细胞蛋白质合成: CFPS快速合成系统",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **无细胞蛋白质合成（CFPS）** 技术的原理与应用场景 —— 在不养活细胞的情况下，利用 **细胞裂解物外源翻译机器** 直接在试管或 96 孔板中由 DNA 模板合成蛋白，用于 **高通量表位/突变体快筛** 或毒性蛋白试制。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【无细胞蛋白质合成（CFPS）】**：Cell-Free Protein Synthesis，把大肠杆菌、麦胚或兔网织红细胞打破，抽出里面的核糖体、tRNA、氨基酸和能量（ATP/GTP），做成冻干粉或预混液；用的时候直接加质粒或线性 PCR 产物，30°C 孵育 3 小时就出蛋白。\n- **【细胞裂解物外源翻译机器】**：脱离了细胞膜束缚的裸露翻译工厂，好处是可以随便往里面加去垢剂、金属离子、非天然氨基酸或分子伴侣，不用担心把细胞毒死。\n- **【高通量表位/突变体快筛】**：当你想一口气测试 Ro52 的 20 种不同截短边界或点突变时，不用走“转化→涂板→挑菌→摇瓶”那套 5 天的慢流程，用 CFPS 在 96 孔板里一天就能测完 20 个突变体的血清反应性。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **CFPS 边界提醒**：CFPS 是研发前端的“侦察兵（微克级快筛）”，不能直接当成工业量产工艺；在 CFPS 里筛出的优势构建体，进入中试前必须桥接验证其在活菌发酵（如 `Rosetta(DE3)`）中的实际放大产量与纯化收率。",
    "cases": [
      {
        "title": "利用 CFPS 一天内快筛 Ro52 不同截短边界（教学拓展）",
        "tag": "教学案例",
        "body": "## **1. 应用场景**\n- 在精细摸索 Ro52 Coiled-Coil 区不同起止边界（如 `125–268` vs `128–238` vs `135–255`）对弱阳性血清识别的影响时，可直接用带 T7 启动子的线性 PCR 片段投入 *E. coli* CFPS 体系，4 小时后直接点板做 ELISA 初筛，筛出最优边界后再转入正式载体建库放大。"
      }

  "learn.2.1": {

    "path": "基础知识学习 / 上游发酵与表达系统 / 小试诱导工艺优化",
    "title": "小试诱导工艺优化",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过对 **诱导温度**、**诱导剂（IPTG）浓度**、**诱导时机（$\\text{OD}_{600}$）** 以及 **辅因子金属离子** 的正交优化，找到“单个细菌不早衰、合成蛋白不抱团、上清可溶总产量最高”的黄金发酵窗口。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【诱导时机（$\\text{OD}_{600}$）】**：用分光光度计在 600 nm 下测菌液的浑浊度（代表细菌密度）。最佳诱导时机通常是 **对数生长期中后期（摇瓶 $\\text{OD}_{600} = 0.6\\text{–}0.8$）**，此时细菌最年轻力壮、核糖体最活跃。\n- **【诱导温度】**：加 IPTG 之后的培养温度。37°C 细菌长得快但蛋白折叠最粗糙；**16–20°C 低温诱导** 是让复杂蛋白保持可溶的核心手段。\n- **【诱导剂（IPTG）浓度】**：异丙基-$\\beta$-D-硫代半乳糖苷，用来松开 `lac` 阻遏刹车的化学开关（不会被细菌代谢掉，所以极低浓度就能持续起效）。\n- **【辅因子金属离子】**：含金属结合域的蛋白（如锌指蛋白需 $\\text{Zn}^{2+}$）在大量合成时，普通培养基里的微量金属不够分，必须额外补料。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **小试方案必查**：小试不能只做单一条件！必须保留 **「未诱导（0 mM IPTG）阴性对照」**，并记录诱导前后的 $\\text{OD}_{600}$ 增长情况（若加 IPTG 后 $\\text{OD}_{600}$ 完全不涨甚至下降，说明表达过猛对菌体产生了毒性）。",
    "cases": [
      {
        "title": "Ro52 小试三因素（温度 × IPTG × Zn2+）优化对照表",
        "tag": "实战案例",
        "body": "## **1. 小试实验结果对照**\n| 组别 | 诱导温度 | IPTG 浓度 | $\\text{ZnCl}_2$ 补加 | 破菌上清可溶比例 | 破菌沉淀（包涵体） | 结论 |\n|---|---|---|---|---|---|---|\n| 对照组 0 | 37°C | 0 mM（未诱导） | 无 | 无目标带 | 无目标带 | 本底干净无泄漏 |\n| 条件组 1 | 37°C | 1.0 mM | 无 | <10% | >90% | 常规猛诱导全进包涵体 |\n| 条件组 2 | 16°C | 0.1 mM | 无 | ~35% | ~65% | 低温低 IPTG 显著改善可溶 |\n| **条件组 3（优胜）** | **16°C** | **0.1 mM** | **$50\\ \\mu\\text{M}$** | **~55%** | **~45%** | **低温+低IPTG+补锌，可溶收率最高** |"
      }

    "path": "基础知识学习 / 上游发酵与表达系统 / 小试诱导工艺优化 / 诱导温度控制: 16°C至20°C低温防包涵体",
    "title": "诱导温度控制: 16°C至20°C低温防包涵体",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：将诱导期温度从常规的 37°C 降至 **16°C至20°C低温区间**，通过减缓 **核糖体翻译延伸速率** 并削弱 **疏水相互作用（Hydrophobic Interaction）**，从热力学和动力学两方面阻止新生肽链聚集形成包涵体。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【16°C至20°C低温区间】**：大肠杆菌可溶性表达的黄金温度带；在此温度下细菌新陈代谢放慢，内源蛋白酶活性也大幅降低，既防包涵体又防目标蛋白降解。\n- **【核糖体翻译延伸速率】**：37°C 时大肠杆菌每秒钟能拼 15–20 个氨基酸，前面的结构域还没折好，后面的疏水链就撞上来了；降到 16°C 时速度降为每秒 2–4 个氨基酸，每个结构域都能从容折好。\n- **【疏水相互作用（Hydrophobic Interaction）】**：物理学上，疏水基团互相粘连结块的过程是由熵驱动的，**温度越高，疏水粘连力越强**！把温度降到 16°C，疏水基团之间粘连形成包涵体的驱动力直接大幅减弱。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **现场操作必查（极易违规点）**：**必须等摇床和菌液真正降温到 16–20°C 之后，才允许加 IPTG**！很多实验员图省事，在 37°C 刚调完摇床温度就立刻加 IPTG，结果前 1 小时菌液还是 30 多度，蛋白在降温前就已经全变成包涵体了！",
    "cases": [
      {
        "title": "Ro52 诱导前“先预冷 30 分钟再加 IPTG”的操作铁律",
        "tag": "实战案例",
        "body": "## **1. 批间差追查案例**\n- **现象**：同一批 `Rosetta(DE3)/pET28a-MBP-Ro52` 种子，两次摇瓶小试参数都写着“16°C 诱导 16h”，但第一批可溶率 52%，第二批可溶率跌到 20%。\n- **根因**：第二批实验员在 $\\text{OD}_{600}=0.7$（37°C）时直接加了 IPTG 再把摇床设成 16°C；1L 大摇瓶液体从 37°C 降到 16°C 耗时近 50 分钟，前 50 分钟高温暴发合成的全是包涵体。\n\n---\n\n> **受控 SOP 条款**：在批记录中增加独立必填格 —— **「诱导前降温确认：实测菌液/摇床温度达 $\\le 20^\\circ\\text{C}$ 后，方可加入 IPTG（记录预冷起止时间）」**。"
      }

  "learn::基础知识学习/上游发酵与表达系统/小试诱导工艺优化/诱导温度控制: 16°C至20°C低温防包涵体": {

    "path": "基础知识学习 / 上游发酵与表达系统 / 小试诱导工艺优化 / 诱导温度控制: 16°C至20°C低温防包涵体",
    "title": "诱导温度控制: 16°C至20°C低温防包涵体",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：将诱导期温度从常规的 37°C 降至 **16°C至20°C低温区间**，通过减缓 **核糖体翻译延伸速率** 并削弱 **疏水相互作用（Hydrophobic Interaction）**，从热力学和动力学两方面阻止新生肽链聚集形成包涵体。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【16°C至20°C低温区间】**：大肠杆菌可溶性表达的黄金温度带；在此温度下细菌新陈代谢放慢，内源蛋白酶活性也大幅降低，既防包涵体又防目标蛋白降解。\n- **【核糖体翻译延伸速率】**：37°C 时大肠杆菌每秒钟能拼 15–20 个氨基酸，前面的结构域还没折好，后面的疏水链就撞上来了；降到 16°C 时速度降为每秒 2–4 个氨基酸，每个结构域都能从容折好。\n- **【疏水相互作用（Hydrophobic Interaction）】**：物理学上，疏水基团互相粘连结块的过程是由熵驱动的，**温度越高，疏水粘连力越强**！把温度降到 16°C，疏水基团之间粘连形成包涵体的驱动力直接大幅减弱。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **现场操作必查（极易违规点）**：**必须等摇床和菌液真正降温到 16–20°C 之后，才允许加 IPTG**！很多实验员图省事，在 37°C 刚调完摇床温度就立刻加 IPTG，结果前 1 小时菌液还是 30 多度，蛋白在降温前就已经全变成包涵体了！",

    "title": "诱导剂浓度: 0.1-0.2mM低浓度IPTG",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：打破“诱导剂加越多产量越高”的误区，采用 **0.1–0.2mM低浓度IPTG** 温和解除 **LacI阻遏蛋白** 对启动子的锁定，避免高浓度 IPTG 引发的 **代谢负荷崩溃与翻译拥堵**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【0.1–0.2mM低浓度IPTG】**：相比传统教科书写的 1.0 mM IPTG，降低 5–10 倍用量（不仅省下 80% 昂贵的 IPTG 成本，而且让可溶性完整蛋白的真实产量更高）。\n- **【LacI阻遏蛋白】**：平时死死坐在启动子轨道上挡住转录的“刹车块”；IPTG 结合到 LacI 上会让它松手离开轨道，启动转录。\n- **【代谢负荷崩溃与翻译拥堵】**：1.0 mM IPTG 会瞬间把所有刹车全部拔掉，细胞内瞬间塞满成千上万条目标 mRNA，抢光所有的核糖体和伴侣蛋白，导致细菌停止生长、蛋白来不及折叠全变废渣。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **小试浓度审查**：小试方案应包含 `0.05 mM`、`0.1 mM`、`0.2 mM`、`0.5 mM` 梯度对比；评判标准不是看“总菌条带谁最粗”，而是看 **“破菌上清可溶条带 + 一步亲和纯化后拿到的合格蛋白毫克数”** 谁最高！",
    "cases": [
      {
        "title": "Ro52 0.1 mM vs. 1.0 mM IPTG 可用产量对比",
        "tag": "实战案例",
        "body": "## **1. 对比结论**\n- 在 16°C 诱导条件下，`1.0 mM IPTG` 组虽然总菌体 SDS-PAGE 条带略粗 15%，但大量蛋白沉淀在包涵体中；而 **`0.1 mM IPTG` 组** 破菌上清中的可溶 `MBP-Ro52` 反而比 1.0 mM 组高出约 30%，且下游纯化时的宿主杂蛋白和核酸污染更少。\n- **最终锁定参数**：**$0.1\\text{ mM IPTG}$**（即 $1\\text{ M}$ 母液按 $1:10000$ 体积比加入）。"
      }
    ],

  "learn.2.1.2": {
    "key": "learn.2.1.2",
    "path": "基础知识学习 / 上游发酵与表达系统 / 小试诱导工艺优化 / 金属离子添加: 微量ZnCl2稳定锌指结构",
    "title": "金属离子添加: 微量ZnCl2稳定锌指结构",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：针对含有 **RING/B-box锌指结构域** 的全长 Ro52，在诱导表达时向培养基和裂解缓冲液中定量补加 **微量ZnCl2（氯化锌）**，提供充足的 **四面体配位锌离子（$\\text{Zn}^{2+}$）**，防止N端结构域因“缺骨架”而塌陷聚集，同时在下游严禁误用会拔掉锌离子的 **EDTA螯合剂**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【RING/B-box锌指结构域】**：Ro52 N 端（16–123 aa）的两个核心模块，像一只手一样必须靠 4 个半胱氨酸/组氨酸手指死死抓着中间的 $\\text{Zn}^{2+}$ 才能握成紧实的三维结构。\n- **【微量ZnCl2（氯化锌）】**：在诱导加 IPTG 的同时加入终浓度 $20\\text{–}100\\ \\mu\\text{M}$（常用 $50\\ \\mu\\text{M}$）的 $\\text{ZnCl}_2$（注意：浓度不能太高，超过 $0.5\\text{ mM}$ 会毒害细菌并引起磷酸盐沉淀）。\n- **【四面体配位锌离子（$\\text{Zn}^{2+}$）】**：不参与氧化还原反应、纯粹起“结构铆钉”作用的锌离子；没有这颗铆钉，RING 域就是一团松散的粘性肽链。\n- **【EDTA螯合剂】**：很多常规破菌液或酶切缓冲液习惯加 $1\\text{–}5\\text{ mM EDTA}$（乙二胺四乙酸）来抑制金属蛋白酶；但 **EDTA 会把 Ro52 锌指里的 $\\text{Zn}^{2+}$ 强行夺走**，导致原本好好的全长 Ro52 在纯化半路上突然变浑浊沉淀！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **全长 Ro52 缓冲液红线**：审核全长 Ro52（含 16–123 aa 区段）的上游培养基与下游全套纯化缓冲液配方 —— ① 诱导时是否补加了 $50\\ \\mu\\text{M ZnCl}_2$？② **下游所有缓冲液（破菌液、洗脱液、透析液）是否已剔除 EDTA**？",
    "cases": [
      {
        "title": "全长 Ro52 上游补锌与下游“禁 EDTA”防沉淀案例",
        "tag": "实战案例",
        "body": "## **1. 真实踩坑机理**\n- **上游缺锌**：高密度诱导时每个细菌瞬间造出数万个 Ro52 分子，LB/TB 培养基里微量的天然锌被抢光，后造出来的全长 Ro52 N 端无锌可抓，exposed Cys 互相乱连成包涵体。\n- **下游误加 EDTA**：某实验员照搬通用 TEV 酶切配方（含 $1\\text{ mM EDTA}$）切全长 Ro52，结果过夜后透析袋里出现大量白色絮状沉淀（EDTA 夺走了 RING 域的 $\\text{Zn}^{2+}$ 且还会剥落 Ni-NTA 柱上的镍离子）。\n\n---\n\n> **受控配方规定**：全长 Ro52 诱导时补加 **$50\\ \\mu\\text{M ZnCl}_2$**；下游破菌及透析缓冲液中 **严禁添加 EDTA**（可保留 $10\\ \\mu\\text{M ZnCl}_2 + 0.5\\text{ mM TCEP}$ 护航）。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },
