    "title": "可溶性与包涵体评估",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过标准化的 **高压均质/超声破菌**、**高速离心固液分离** 与 **总菌/上清/沉淀三道并排SDS-PAGE**，客观定量评估目标蛋白的真实可溶性比例与分子量完整性，决定该批次是否有资格移交下游纯化。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【高压均质/超声破菌】**：用超声波探头（小试）或高压均质机（中试放大）在冰水浴低温下把大肠杆菌坚硬的细胞壁震碎，把里面的可溶蛋白释放到缓冲液里。\n- **【高速离心固液分离】**：破菌液在 $\\ge 12,000\\text{ rpm}$（约 $15,000\\text{–}20,000\\times g$）、4°C 下离心 20–30 分钟 —— 真正溶解的好蛋白留在上面的透明液体（**上清 S**）里，细胞碎片和包涵体被甩到管底（**沉淀 P**）。\n- **【总菌/上清/沉淀三道并排SDS-PAGE】**：鉴定可溶性的唯一标准铁证：把“破菌前总液（T）”、“离心上清（S）”和“用等体积缓冲液重悬的沉淀（P）”按相同体积上样跑在同一块胶上，一眼就能看出目标蛋白到底有几成在水里、几成在泥里。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **可溶性胶图必查**：凡是研发汇报说“可溶性很好”，必须调看原图 —— 胶上有没有把 **Total（总）、Supernatant（上清）、Pellet（沉淀）** 并排跑？沉淀重悬的体积是否与原破菌液体积严格相等（如果沉淀用 10 倍体积稀释后再上样，沉淀条带就会显得很浅，造成“没有包涵体”的假象）！",
    "cases": [
      {
        "title": "Ro52 破菌可溶性评估的“等体积归一化”防假象规范",
        "tag": "实战案例",
        "body": "## **1. 标准取样与归一化操作（防假象）**\n1. 取 $1\\text{ mL}$ 破菌混悬液，先吸出 $50\\ \\mu\\text{L}$ 标为 **`T（总菌 Total）`**。\n2. 剩余 $950\\ \\mu\\text{L}$ 在 $12,000\\text{ rpm}$、4°C 离心 20 min，吸取上清标为 **`S（上清 Supernatant）`**。\n3. 管底沉淀加入 **严格等体积（$950\\ \\mu\\text{L}$）** 的缓冲液彻底吹散重悬，标为 **`P（沉淀 Pellet）`**。\n4. `T`、`S`、`P` 各取 $20\\ \\mu\\text{L}$ 加同体积 $2\\times$ Loading Buffer 煮样，并排点在同一块 SDS-PAGE 胶上：$S / (S + P) \\ge 40\\%$ 方可通过小试。"
      }
    ],

    "path": "基础知识学习 / 上游发酵与表达系统 / 可溶性与包涵体评估 / 细胞裂解与高速离心分离",
    "title": "细胞裂解与高速离心分离",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在 **全程低温（0–4°C冰水浴）** 与 **蛋白酶抑制剂（PMSF）** 保护下完成细胞破壁与高速离心，既要保证破菌彻底（充分释放胞内蛋白），又要严防 **超声局部过热变性** 把原本可溶的蛋白“煮熟”成人工假包涵体。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【全程低温（0–4°C冰水浴）】**：超声探头工作时会产生极大的热量；如果不把离心管插在冰水混合物里，并采用“工作 3 秒、停歇 5 秒”的脉冲模式，管内温度 2 分钟就能升到 50°C 以上，蛋白当场热变性沉淀。\n- **【蛋白酶抑制剂（PMSF）】**：破菌瞬间，细菌内部原本被隔开的残留蛋白酶会趁机出来咬目标蛋白；必须在破菌前立刻往裂解液里加终浓度 $0.5\\text{–}1.0\\text{ mM PMSF}$（注意：PMSF 在水里半衰期只有 30 分钟，必须用异丙醇配成母液，临破菌前现加！）。\n- **【超声局部过热变性】**：探头没没入液面以下（产生大量白色泡沫，蛋白质在气泡气液界面极易变性）或连续超声不停歇导致的热沉淀——很多时候“上清没蛋白全在沉淀里”不是表达没做好，而是被超声煮熟了！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **破菌过程控制必查**：① 裂解液是否临用前现加了 PMSF？② 超声功率、工作/间歇秒数及破菌终点（菌液变半透明、不粘稠）是否记录？③ 超声全程是否有起泡或温度超过 10°C 的异常？",
    "cases": [
      {
        "title": "Ro52 破菌缓冲液配方与防过热起泡 SOP",
        "tag": "实战案例",
        "body": "## **1. Ro52 标准破菌缓冲液（Lysis Buffer）**\n- **配方**：$50\\text{ mM Tris-HCl (pH 7.8)}, 300\\text{ mM NaCl}, 5\\%\\text{ Glycerol（甘油护构）}, 10\\text{ mM Imidazole（压制杂蛋白吸附）}, 0.5\\text{ mM TCEP（防半胱氨酸氧化）}$，临破菌前加入 **$1\\text{ mM PMSF}$**（全长 Ro52 严禁加 EDTA）。\n\n---\n\n## **2. 破菌与离心参数**\n- **菌液比**：按 `1 g 湿菌 : 10~15 mL 破菌液` 重悬。\n- **超声参数**：冰水浴，探头伸入液面下 1.5 cm（严禁起泡），**超声 3 s / 间歇 5 s**，总时间至菌液清亮不挂壁。\n- **高速离心 + 过滤**：$14,000\\text{ rpm}$、4°C 离心 30 min，上清经 **$0.45\\ \\mu\\text{m}$ 滤膜** 过滤后方可上柱（防止微粒堵死层析柱）。"
      }

    "path": "基础知识学习 / 上游发酵与表达系统 / 可溶性与包涵体评估 / 上清液可溶性表达检测",
    "title": "上清液可溶性表达检测",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：准确检测破菌上清液中目标蛋白的 **真实可溶存在状态**，区分“真正单分散/天然二聚可溶蛋白”与“虽然没被 $12,000\\text{ rpm}$ 甩下去、但已经抱成几百万道尔顿的 **可溶性微聚集体（Soluble Aggregates）**”，并通过 **小量亲和挂柱试验（Mini-Pulldown）** 验证上清里的蛋白能不能真正被纯化柱抓下来。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【真实可溶存在状态】**：蛋白不仅在离心后留在上清里，而且折叠紧实、融合标签暴露在外、能正常结合亲和填料。\n- **【可溶性微聚集体（Soluble Aggregates）】**：MBP 标签助溶能力太强，有时候即使后面的目标蛋白已经折成一团乱麻（没活性了），MBP 也能像救生圈一样拖着这团死蛋白浮在上清里不被离心甩下去——这种“假可溶”一过柱子就会堵柱或切掉 MBP 后当场沉淀！\n- **【小量亲和挂柱试验（Mini-Pulldown）】**：在上游筛选阶段，取 $1\\text{ mL}$ 破菌上清加 $50\\ \\mu\\text{L}$ Ni-NTA 或 Amylose 磁珠/填料孵育洗脱，验证上清里的蛋白到底能不能被抓下来、洗脱下来是多少。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **上清评估进阶必问**：不要只看“破菌上清有条带”就宣布上游大功告成！必须确认：**上清里的条带做完小量亲和捕获（Mini-Pulldown）后，洗脱液里能不能回收到完整蛋白？**（如果上清很粗但挂不上柱子，说明标签被包在微聚集体内部了）。",
    "cases": [
      {
        "title": "Ro52 排查“MBP 假可溶微聚集体”的小量挂柱法",
        "tag": "实战案例",
        "body": "## **1. 什么是 MBP 的“假可溶陷阱”**\n- 30°C 诱导的 `MBP-Ro52` 破菌上清里也有很粗的目标带，但一上 Amylose/Ni 柱，一半流穿、切完 TEV 后大面积浑浊 —— 因为 30°C 下 Ro52 部分其实已经错误折叠聚成大团，只是被 MBP 强行拽在水里。\n\n---\n\n## **2. 16°C 真可溶验证法**\n- 16°C + 0.1 mM IPTG 组不仅上清占比 >50%，而且经 `Ni-NTA` 小量捕获洗脱回收率 $>80\\%$，TEV 酶切后溶液依然澄清透明、无沉淀，证明是 **真正折叠正确的可溶蛋白**。"
      }

        "body": "## **1. 什么是 MBP 的“假可溶陷阱”**\n- 30°C 诱导的 `MBP-Ro52` 破菌上清里也有很粗的目标带，但一上 Amylose/Ni 柱，一半流穿、切完 TEV 后大面积浑浊 —— 因为 30°C 下 Ro52 部分其实已经错误折叠聚成大团，只是被 MBP 强行拽在水里。\n\n---\n\n## **2. 16°C 真可溶验证法**\n- 16°C + 0.1 mM IPTG 组不仅上清占比 >50%，而且经 `Ni-NTA` 小量捕获洗脱回收率 $>80\\%$，TEV 酶切后溶液依然澄清透明、无沉淀，证明是 **真正折叠正确的可溶蛋白**。"
      }

    "title": "SDS-PAGE电泳初步鉴定",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：利用 **SDS-PAGE（十二烷基硫酸钠-聚丙烯酰胺凝胶电泳）** 与 **考马斯亮蓝染色**，对未诱导总菌、诱导后总菌、破菌上清、破菌沉淀进行初步定性与半定量鉴定，核对 **表观分子量（Apparent MW）** 并监控是否存在异常降解带。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【SDS-PAGE】**：蛋白质质检最基础的“筛子”。SDS 是一种强力肥皂，能把所有蛋白质搓成直棍并裹满负电荷，然后在电场里穿过凝胶网孔——个头小的跑得快（在下面），个头大的跑得慢（在上面），从而按分子量大小把不同蛋白分开。\n- **【考马斯亮蓝染色】**：把跑完电泳的胶染成蓝色的染料，蛋白质条带越粗越深，代表这个位置的蛋白含量越高。\n- **【表观分子量（Apparent MW）】**：目标条带跟旁边的标准尺子（Marker）比对出来的大小。注意：有些带极端电荷或富含脯氨酸/长螺旋的蛋白，在胶上跑的位置会比理论计算的分子量偏大或偏小 3–5 kDa。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **电泳胶图审核四要素**：每张写入实验报告的 SDS-PAGE 胶图必须标注清楚 —— **① Marker 每条带的 kDa 数值、② 每个泳道（Lane）代表什么样品与上样量、③ 目标蛋白箭头指示与理论 MW、④ 批次号与日期**（严禁拿一张没标泳道、没标 Marker 的白板胶图交差）！",
    "cases": [
      {
        "title": "Ro52 融合体与切标产物的 SDS-PAGE 泳道判读标准",
        "tag": "实战案例",
        "body": "## **1. 标准泳道分子量对照尺**\n- **`6xHis-MBP-TEV-Ro52(1-475)` 全长融合蛋白**：理论 MW $\\approx 97.5\\text{ kDa}$，在 SDS-PAGE 上应出现在 **`100 kDa` Marker 条带紧下方**。\n- **TEV 酶切后体系**：应清晰分裂为三条可解释条带：\n  1. **`~54 kDa`**：切下标签后的 **目标全长 Ro52**；\n  2. **`~43 kDa`**：切下来的 **`6xHis-MBP` 标签**；\n  3. **`~27 kDa`**：加入的 **`6xHis-TEV` 蛋白酶**。"
      }

  "learn.2.3": {
    "key": "learn.2.3",
    "path": "基础知识学习 / 上游发酵与表达系统 / Gate｜④ 制备：扩增、表达或合成",
    "title": "Gate｜④ 制备：扩增、表达或合成",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R4（上游制备与交接关口）** 管控从“摇瓶/发酵罐”到“下游纯化组”的半成品转序（对应生产控制点 **G1 上游交接**），必须确认 **单位体积湿菌重**、**上清可溶性占比（$\\ge 40\\%$）** 与 **无杂菌污染** 均达标后，方可签字移交。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【G1 上游交接】**：上游发酵人员（如分子组）把收获的湿菌泥或粗提液移交给下游纯化人员（纯化组）的交接关口；没过这关的菌泥不准进纯化柱（否则既浪费昂贵的层析填料，又污染柱子）。\n- **【单位体积湿菌重】**：每升发酵液离心后称出来的湿菌泥克数（如 TB 摇瓶通常要求 $\\ge 12\\text{–}15\\text{ g/L}$），反映本批菌体生长是否正常。\n- **【上清可溶性占比（$\\ge 40\\%$）】**：通过三道并排 SDS-PAGE（总/上清/沉淀）光密度扫描或目视比对，确认至少 40% 以上的目标蛋白在可溶上清相中。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R4 交接红线**：查 LabOS「上游表达」模块 —— ① 是否还有未填完的“待补”记录行？② 湿菌重与折合产量是否明显低于历史“标准速率”？③ 破菌 T/S/P 电泳胶图附件是否已上传？",
    "cases": [
      {
        "title": "Ro52 项目 Gate R4 (G1) 上下游交接核验单",
        "tag": "Gate 评审案例",
        "body": "## **1. Gate R4 放行四件套（Ro52 上游批次）**\n- **检查方法**：核查发酵记录（诱导前降温至 16°C、0.1 mM IPTG、$50\\ \\mu\\text{M ZnCl}_2$）、湿菌称重记录及 `Total / Supernatant / Pellet` 并排 SDS-PAGE 胶图。\n- **通过依据**：湿菌重 $\\ge 15\\text{ g/L}$；`~97 kDa` 目标带在上清（S）中占比 $\\ge 40\\%$ 且无明显降解；无噬菌体裂解或杂菌污染。\n- **未通过动作**：若可溶率 $<20\\%$（如误在高温诱导），该批菌体冻结隔离，不得直接按正常上清工艺投料浪费亲和柱。\n- **交付物**：贴有唯一中间品批号标签的 `-80°C` 湿菌体 + LabOS 上游记录与电泳胶图附件。"
      }

  "learn.3": {
    "key": "learn.3",
    "path": "基础知识学习 / 下游分离与纯化技术",
    "title": "下游分离与纯化技术",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：按照工业级“**亲和层析捕获（Capture）** → **蛋白酶切与反挂去标签** → **理化精纯（IEX/HIC）** → **凝胶过滤抛光（SEC）与超滤换液**”四步法，从复杂的破菌上清中提取出高纯度、正确寡聚态、无残留干扰的活性抗原，并建立全流程 **质量平衡与步回收率（Step Yield）** 台账。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【亲和层析捕获（Capture）】**：纯化的第一步，利用标签（如 `6xHis` 或 `MBP`）与填料的特异锁钥结合，从一锅细菌汤里先把目标蛋白一把捞出来（粗纯度可达 80%–85%）。\n- **【蛋白酶切与反挂去标签】**：用 TEV 酶切掉 MBP 大标签后，再次流过镍柱（反挂 Reverse IMAC），把带 His 的标签和酶留在柱上，收集流穿的纯目标蛋白。\n- **【理化精纯（IEX/HIC）与凝胶过滤抛光（SEC）】**：按电荷（离子交换 IEX）、疏水性（HIC）或分子大小（分子筛 SEC）把微量的宿主杂蛋白、内毒素和错误多聚体彻底剔除。\n- **【质量平衡与步回收率（Step Yield）】**：每一步过柱前后都要记“体积 × 浓度 = 总毫克数”；如果进柱 100 mg，洗脱只拿到 20 mg，必须查流穿液和洗涤液，搞清楚另外 80 mg 丢在哪一步了。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R5 纯化必查红线**：**绝对不能只看最后一张成品胶图**！批记录必须包含 `上样 Load / 流穿 FT / 洗涤 Wash / 洗脱 Elute` 四道并排电泳记录以及每一步的 **总蛋白毫克数与步回收率**！",
    "cases": [
      {
        "title": "Ro52 四步工业纯化路线与收率总表",
        "tag": "实战案例",
        "body": "## **1. Ro52 标准四步纯化链（以 1 L 发酵湿菌 ~18 g 为起点）**\n| 步骤 | 层析/操作方法 | 关键目的 | 阶段纯度 | 阶段目标蛋白总量 |\n|---|---|---|---|---|\n| **Step 1 粗纯捕获** | `Ni-NTA` 或 `Amylose` 亲和柱 | 从破菌上清捕获 `6xHis-MBP-Ro52` | ~85% | ~45 mg（融合体） |\n| **Step 2 酶切与反挂** | 4°C `His-TEV` 酶切 + 二次反挂 `Ni-NTA` | 切除并扣留 `6xHis-MBP`（占重 44%）与 TEV 酶 | ~92% | ~21 mg（去标 Ro52） |\n| **Step 3/4 精纯抛光** | `Q 阴离子交换` + `Superdex 200 SEC` | 去除宿主核酸/内毒素与大分子死聚集，收集天然二聚体主峰 | **≥95%** | **~15 mg（成品）** |"
      }

        "body": "## **1. Ro52 标准四步纯化链（以 1 L 发酵湿菌 ~18 g 为起点）**\n| 步骤 | 层析/操作方法 | 关键目的 | 阶段纯度 | 阶段目标蛋白总量 |\n|---|---|---|---|---|\n| **Step 1 粗纯捕获** | `Ni-NTA` 或 `Amylose` 亲和柱 | 从破菌上清捕获 `6xHis-MBP-Ro52` | ~85% | ~45 mg（融合体） |\n| **Step 2 酶切与反挂** | 4°C `His-TEV` 酶切 + 二次反挂 `Ni-NTA` | 切除并扣留 `6xHis-MBP`（占重 44%）与 TEV 酶 | ~92% | ~21 mg（去标 Ro52） |\n| **Step 3/4 精纯抛光** | `Q 阴离子交换` + `Superdex 200 SEC` | 去除宿主核酸/内毒素与大分子死聚集，收集天然二聚体主峰 | **≥95%** | **~15 mg（成品）** |"

    "title": "亲和层析捕获种类",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：根据目标生物材料的种类（重组标签蛋白、单克隆抗体、生物素化多肽/核酸），选择高特异性的 **亲和层析介质（Affinity Resin）**，在保护构象的温和条件下完成高选择性第一步捕获，并严控 **动态结合载量（DBC）** 防止过载流穿损失。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【亲和层析介质（Affinity Resin）】**：表面挂了特定“诱饵”的微球填料（如挂了镍离子的 `Ni-NTA`、挂了麦芽糖的 `Amylose`、挂了 `Protein A` 的抗体填料），只抓带对应抓手的目标分子。\n- **【动态结合载量（DBC）】**：Dynamic Binding Capacity，每毫升填料在流动状态下最多能挂住多少毫克目标蛋白（如 Ni-NTA 通常为 30–50 mg/mL，Amylose 约 6–10 mg/mL）；如果上样量超过载量，多余的好蛋白就会直接从流穿液（Flow-through）里白白流走。\n- **【竞争性温和洗脱】**：不用强酸强碱硬拽，而是往柱子里冲入高浓度的“替身小分子”（如用咪唑替下 His 标签，用麦芽糖替下 MBP 标签），把目标蛋白毫发无损地换下来。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **亲和捕获必查**：① 流穿液（FT）跑胶了没有？（如果流穿液里还有很粗的目标带，说明填料装少了过载，或者流速太快没挂上）；② 填料用了多少次、有没有按规程做在位清洗（CIP）防交叉污染？",
    "cases": [
      {
        "title": "本公司四大类 IVD 原料的亲和捕获选型表",
        "tag": "实战案例",
        "body": "## **1. 四大亲和体系在产品线中的分工**\n1. **Ni-NTA (IMAC)**：捕获带 `6xHis` 的重组抗原（**Ro52**、核糖体 P0）及 TEV 切标后的反挂除杂。\n2. **Amylose 麦芽糖柱**：专门温和捕获 `MBP-Ro52` 等 MBP 融合蛋白（10 mM 麦芽糖生理 pH 洗脱，最护构象）。\n3. **Protein A / G 亲和柱**：捕获 **SAA 单抗、IgG4 抗体、RF 酶切抗原用人 IgG 原料** 的 Fc 段。\n4. **Streptavidin 链霉亲和素介质**：用于 **Biotin-dsDNA、Biotin-CCP** 在化学发光磁珠或酶标板上的定向固相捕获。"
      }

    "path": "基础知识学习 / 下游分离与纯化技术 / 亲和层析捕获种类 / Protein A/G色谱: 捕获IgG抗体Fc区",
    "title": "Protein A/G色谱: 捕获IgG抗体Fc区",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：利用金黄色葡萄球菌 **Protein A** 或链球菌 **Protein G** 对免疫球蛋白 **IgG Fc段** 的天然高亲和力，从细胞培养上清、腹水或血清中一步捕获高纯度单克隆/多克隆抗体，并在 **pH 3.0–3.5低pH洗脱** 瞬间完成 **Tris碱性缓冲液即时中和**，防止抗体酸变性聚集。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Protein A 与 Protein G】**：细菌进化出来的专门抓抗体“柄部（Fc 段）”的天然蛋白。`Protein A` 对人 IgG1/IgG2/IgG4 和兔 IgG 亲和力极强（但抓人 IgG3 和小鼠 IgG1 较弱）；`Protein G` 对小鼠各亚型和人 IgG1–4 通吃。\n- **【IgG Fc段】**：Y 字形抗体底部的恒定区“把柄”；因为 Protein A/G 只抓把柄，完全不碰抗体上面抓抗原的两个“钳子（Fab 段）”，所以不会破坏抗体的识别活性。\n- **【pH 3.0–3.5低pH洗脱】**：Protein A 和抗体抓得太紧，普通盐水冲不下来，必须用 pH 3.0–3.5 的柠檬酸或甘氨酸缓冲液让结合面电荷排斥才能松手。\n- **【Tris碱性缓冲液即时中和】**：抗体在 pH 3.0 的酸液里泡久了会变性结块！所以必须在收集管底部 **预先加好 1/10 体积的 $1\\text{ M Tris-HCl (pH 8.5–9.0)}$**，酸洗脱液一滴进管里就立刻被中和回中性 pH 7.2–7.5！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **抗体纯化必查红线**：检查抗体/IgG 纯化批记录 —— ① 选的填料（Protein A vs G）与抗体种属亚型（如鼠 IgG1 vs 人 IgG）是否匹配？② 洗脱收集管是否写明 **“预置中和液并核对中和后实测 pH 在 7.0–7.5”**？",
    "cases": [
      {
        "title": "人 IgG 原料（RF 抗原制备）与抗 Ro52 质控单抗的 Protein A/G 纯化",
        "tag": "实战案例",
        "body": "## **1. 种属亚型选柱防错**\n- **人源 IgG / 嵌合抗 Ro52 质控抗体（Human IgG1 Fc）**：首选耐碱清洗的 **`MabSelect SuRe (rProtein A)`**，一步洗脱纯度 $\\ge 95\\%$。\n- **小鼠源杂交瘤单抗（Mouse IgG1 亚型，如部分 SAA/IgG4 鼠单抗）**：普通 Protein A 在中性条件下几乎抓不住鼠 IgG1（全从流穿液跑掉）！必须选用 **`Protein G` 填料**（或高盐高 pH 结合缓冲液）。\n\n---\n\n> **操作红线**：洗脱采用 $0.1\\text{ M}$ 甘氨酸-HCl（pH 3.0），收集管预置 $1/10$ 体积 $1\\text{ M Tris-HCl (pH 8.8)}$，接样后立即混匀测 pH，严禁让抗体在 pH 3.0 下停留超过 15 分钟。"
      }

    "key": "learn.3.0.1",
    "path": "基础知识学习 / 下游分离与纯化技术 / 亲和层析捕获种类 / Ni-NTA树脂: 纯化多组氨酸标签蛋白",
    "title": "Ni-NTA树脂: 纯化多组氨酸标签蛋白",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Ni-NTA固定化金属离子亲和层析（IMAC）** 的原理 —— 利用螯合在填料上的 **镍离子（$\\text{Ni}^{2+}$）** 与蛋白末端的 **多组氨酸标签（6xHis）** 形成配位键，通过 **阶梯咪唑浓度（Imidazole Gradient）** 先洗掉弱结合的宿主杂蛋白、再精准洗脱目标蛋白，并在切掉标签后利用 **二次反挂镍柱（Reverse IMAC）** 一步彻底清除切下的标签与蛋白酶。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Ni-NTA固定化金属离子亲和层析（IMAC）】**：次氮基三乙酸（NTA）像一只四爪卡爪一样牢牢抓着 $\\text{Ni}^{2+}$ 离子，留出两个空位专门抓取目标蛋白上的 `6xHis` 标签。\n- **【多组氨酸标签（6xHis）】**：连续 6 个组氨酸组成的极小标签（仅 0.8 kDa），它的咪唑侧链环能跟镍离子精准配位结合。\n- **【阶梯咪唑浓度（Imidazole Gradient）】**：咪唑（Imidazole）分子长得很像组氨酸的侧链。\n  - 上样和洗杂时加 **低浓度咪唑（10–30 mM）**：挡住大肠杆菌自带的零散组氨酸杂蛋白，不让杂蛋白乱往柱子上贴；\n  - 洗脱时加 **高浓度咪唑（250–300 mM）**：海量咪唑一拥而上，把 `6xHis` 目标蛋白从镍离子上和平替换下来。\n- **【二次反挂镍柱（Reverse IMAC）】**：TEV 酶切后的神仙操作！切完后体系里 `6xHis-MBP` 和 `6xHis-TEV酶` 都带 His，只有切出来的纯 `Ro52` 不带 His。把酶切液透析掉咪唑后重新过一遍 Ni-NTA 柱 —— **这次我们要的好蛋白直接从流穿液（FT）里干干净净流出来**，而标签和酶全被镍柱扣在上面！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Ni-NTA 纯化必查三件事**：① 破菌液和洗涤液里有没有加 $10\\text{–}30\\text{ mM}$ 本底咪唑防杂蛋白？（没加会导致洗脱液里全是 70 kDa 左右的细菌伴侣杂带）；② 缓冲液里有没有误加 EDTA 或高浓度 DTT（会把柱子从蓝色吸成白色——镍离子脱柱）？③ 反挂镍柱前，第一次洗脱液里的 $250\\text{ mM}$ 高咪唑有没有通过透析降到 $<15\\text{ mM}$（否则高咪唑下标签也挂不上柱子）？",
    "cases": [
      {
        "title": "Ro52 的“正向 Ni-NTA 捕获 + TEV 酶切 + 反向 Ni-NTA 去标签”SOP",
        "tag": "核心实战案例",
        "body": "## **1. 正向捕获（抓 `6xHis-MBP-TEV-Ro52` 融合蛋白）**\n- **平衡/上样液（Buffer A）**：$50\\text{ mM Tris-HCl (pH 7.8)}, 300\\text{ mM NaCl}, 5\\%\\text{ Glycerol}, \\mathbf{15\\text{ mM Imidazole}}, 0.5\\text{ mM TCEP}$。\n- **洗杂液（Wash Buffer）**：Buffer A + **$30\\text{ mM Imidazole}$**（洗 10 个柱体积 CV 至紫外基线归零，洗掉大肠杆菌 SlyD 等内源富组氨酸杂蛋白）。\n- **洗脱液（Elution Buffer）**：Buffer A + **$250\\text{ mM Imidazole}$**，收集主峰（纯度 $\\ge 85\\%$）。\n\n---\n\n## **2. 透析酶切与反向挂柱（拿无标签纯 Ro52）**\n1. **边透析边酶切**：按 $1:30$ 加入 `6xHis-TEV` 蛋白酶，装入 14 kDa 透析袋，放入 **不含咪唑** 的 Buffer A 中 4°C 过夜透析 14 h（将咪唑从 $250\\text{ mM}$ 降至 $<5\\text{ mM}$，同时完成 $>95\\%$ 切割）。\n2. **反挂 Ni-NTA（Reverse IMAC）**：将酶切液再次流过平衡好的 Ni-NTA 柱 —— **直接收集流穿液（Flow-through）即为去掉了 MBP 和 TEV 的高纯度 Ro52**！再用 $300\\text{ mM}$ 咪唑洗柱即可看到被扣留的 43 kDa `His-MBP` 和 27 kDa `His-TEV`。"
      }

  "learn::基础知识学习/下游分离与纯化技术/亲和层析捕获种类/Ni-NTA树脂: 纯化多组氨酸标签蛋白": {
    "key": "learn.3.0.1",
    "path": "基础知识学习 / 下游分离与纯化技术 / 亲和层析捕获种类 / Ni-NTA树脂: 纯化多组氨酸标签蛋白",
    "title": "Ni-NTA树脂: 纯化多组氨酸标签蛋白",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **Ni-NTA固定化金属离子亲和层析（IMAC）** 的原理 —— 利用螯合在填料上的 **镍离子（$\\text{Ni}^{2+}$）** 与蛋白末端的 **多组氨酸标签（6xHis）** 形成配位键，通过 **阶梯咪唑浓度（Imidazole Gradient）** 先洗掉弱结合的宿主杂蛋白、再精准洗脱目标蛋白，并在切掉标签后利用 **二次反挂镍柱（Reverse IMAC）** 一步彻底清除切下的标签与蛋白酶。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Ni-NTA固定化金属离子亲和层析（IMAC）】**：次氮基三乙酸（NTA）像一只四爪卡爪一样牢牢抓着 $\\text{Ni}^{2+}$ 离子，留出两个空位专门抓取目标蛋白上的 `6xHis` 标签。\n- **【多组氨酸标签（6xHis）】**：连续 6 个组氨酸组成的极小标签（仅 0.8 kDa），它的咪唑侧链环能跟镍离子精准配位结合。\n- **【阶梯咪唑浓度（Imidazole Gradient）】**：咪唑（Imidazole）分子长得很像组氨酸的侧链。\n  - 上样和洗杂时加 **低浓度咪唑（10–30 mM）**：挡住大肠杆菌自带的零散组氨酸杂蛋白，不让杂蛋白乱往柱子上贴；\n  - 洗脱时加 **高浓度咪唑（250–300 mM）**：海量咪唑一拥而上，把 `6xHis` 目标蛋白从镍离子上和平替换下来。\n- **【二次反挂镍柱（Reverse IMAC）】**：TEV 酶切后的神仙操作！切完后体系里 `6xHis-MBP` 和 `6xHis-TEV酶` 都带 His，只有切出来的纯 `Ro52` 不带 His。把酶切液透析掉咪唑后重新过一遍 Ni-NTA 柱 —— **这次我们要的好蛋白直接从流穿液（FT）里干干净净流出来**，而标签和酶全被镍柱扣在上面！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Ni-NTA 纯化必查三件事**：① 破菌液和洗涤液里有没有加 $10\\text{–}30\\text{ mM}$ 本底咪唑防杂蛋白？（没加会导致洗脱液里全是 70 kDa 左右的细菌伴侣杂带）；② 缓冲液里有没有误加 EDTA 或高浓度 DTT（会把柱子从蓝色吸成白色——镍离子脱柱）？③ 反挂镍柱前，第一次洗脱液里的 $250\\text{ mM}$ 高咪唑有没有通过透析降到 $<15\\text{ mM}$（否则高咪唑下标签也挂不上柱子）？",
    "cases": [
      {
        "title": "Ro52 的“正向 Ni-NTA 捕获 + TEV 酶切 + 反向 Ni-NTA 去标签”SOP",
        "tag": "核心实战案例",
        "body": "## **1. 正向捕获（抓 `6xHis-MBP-TEV-Ro52` 融合蛋白）**\n- **平衡/上样液（Buffer A）**：$50\\text{ mM Tris-HCl (pH 7.8)}, 300\\text{ mM NaCl}, 5\\%\\text{ Glycerol}, \\mathbf{15\\text{ mM Imidazole}}, 0.5\\text{ mM TCEP}$。\n- **洗杂液（Wash Buffer）**：Buffer A + **$30\\text{ mM Imidazole}$**（洗 10 个柱体积 CV 至紫外基线归零，洗掉大肠杆菌 SlyD 等内源富组氨酸杂蛋白）。\n- **洗脱液（Elution Buffer）**：Buffer A + **$250\\text{ mM Imidazole}$**，收集主峰（纯度 $\\ge 85\\%$）。\n\n---\n\n## **2. 透析酶切与反向挂柱（拿无标签纯 Ro52）**\n1. **边透析边酶切**：按 $1:30$ 加入 `6xHis-TEV` 蛋白酶，装入 14 kDa 透析袋，放入 **不含咪唑** 的 Buffer A 中 4°C 过夜透析 14 h（将咪唑从 $250\\text{ mM}$ 降至 $<5\\text{ mM}$，同时完成 $>95\\%$ 切割）。\n2. **反挂 Ni-NTA（Reverse IMAC）**：将酶切液再次流过平衡好的 Ni-NTA 柱 —— **直接收集流穿液（Flow-through）即为去掉了 MBP 和 TEV 的高纯度 Ro52**！再用 $300\\text{ mM}$ 咪唑洗柱即可看到被扣留的 43 kDa `His-MBP` 和 27 kDa `His-TEV`。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"

    "path": "基础知识学习 / 下游分离与纯化技术 / 亲和层析捕获种类 / 直链淀粉树脂: Amylose抓取MBP融合蛋白",
    "title": "直链淀粉树脂: Amylose抓取MBP融合蛋白",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：利用 `MBP（麦芽糖结合蛋白）` 对直链淀粉的天然生物亲和力，通过 **Amylose直链淀粉树脂** 从破菌上清中特异抓取 MBP 融合蛋白，并用极其温和的 **10mM麦芽糖（Maltose）生理缓冲液洗脱**，最大限度保护对咪唑或金属离子敏感的构象型抗原。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Amylose直链淀粉树脂】**：表面偶联了直链淀粉多糖的琼脂糖凝胶微球，专门识别并结合 MBP 标签上的糖结合口袋。\n- **【10mM麦芽糖（Maltose）生理缓冲液洗脱】**：洗脱时既不用改 pH、也不用加几百毫摩尔可能刺激蛋白聚集的咪唑，只需在原缓冲液里加一点点麦芽糖（$10\\text{ mM}$），MBP 吃到麦芽糖就自动从淀粉柱上松手下来，洗脱条件温和到极致。\n- **【内源淀粉酶与葡萄糖干扰】**：大肠杆菌培养液或细胞内如果含有游离葡萄糖或淀粉酶，会抢占 MBP 口袋或啃坏淀粉填料——因此破菌液不能含葡萄糖，且填料寿命比 Ni-NTA 短。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Amylose 层析防错必查**：① 上游诱导期如果加过葡萄糖，破菌前湿菌体必须用不含糖的缓冲液洗一遍；② Amylose 填料载量较低（约 $6\\text{–}8\\text{ mg/mL}$ 填料，仅为镍柱的 $1/5$），核算柱体积时必须留足填料量，严防过载流穿！",
    "cases": [
      {
        "title": "Ro52 全长采用 Amylose 温和捕获 vs. Ni-NTA 捕获的适用场景",
        "tag": "实战案例",
        "body": "## **1. 什么时候优先用 Amylose 柱抓 Ro52？**\n- **痛点**：全长 Ro52 N 端含有依赖 $\\text{Zn}^{2+}$ 的 RING/B-box 锌指结构域；有时高浓度咪唑（$250\\text{ mM}$）或游离 $\\text{Ni}^{2+}$ 会竞争干扰锌指配位，导致洗脱液放置后慢慢变浑。\n- **解决方案**：改用 **Amylose 直链淀粉柱捕获** + **$10\\text{ mM}$ 麦芽糖温和洗脱**，洗脱下来的 `6xHis-MBP-TEV-Ro52` 直接加 `His-TEV` 酶切（无需像镍柱洗脱液那样先透析除高咪唑才能切！），切完再过一次小体积 Ni-NTA 反挂除掉 `6xHis-MBP` 和 `His-TEV`，全程零高咪唑冲击，二聚体构象保持率最佳！"
      }

    "path": "基础知识学习 / 下游分离与纯化技术 / 亲和层析捕获种类 / 生物素化靶点: Streptavidin亲和介质",
    "title": "生物素化靶点: Streptavidin亲和介质",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握自然界最强的非共价相互作用 —— **链霉亲和素-生物素系统（Streptavidin-Biotin，$K_d \\approx 10^{-14}\\text{ M}$）** 在 IVD 诊断原料中的应用，通过化学法（NHS-Biotin）或定点酶促法（AviTag/BirA）完成抗原/核酸的 **可控生物素化修饰**，彻底清除 **游离生物素（Free Biotin）**，并对 **SA捕获能力与抗体识别能力进行双重独立验证**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【链霉亲和素-生物素系统（Streptavidin-Biotin）】**：生物界最强的“魔术贴”（结合紧度接近共价键，解离常数 $10^{-14}\\text{ M}$）。1 个链霉亲和素（SA）分子有 4 个爪子，能稳稳抓住 4 个生物素（Biotin）分子。化学发光试剂盒最爱把 SA 涂在磁珠上，再用带 Biotin 的抗原去定向挂珠。\n- **【可控生物素化修饰】**：给抗原贴生物素贴纸的两种方法：\n  - **化学胺标记（NHS-PEG4-Biotin）**：随机贴在蛋白表面的赖氨酸（Lys）上——简单通用，但如果贴多了把表位里的赖氨酸全糊住了，患者抗体就认不出来了；\n  - **定点酶促标记（AviTag + BirA 酶）**：只在蛋白末端设计好的 15 aa `AviTag` 上精准贴 1 个生物素——完全不遮挡抗原核心表位，定向朝外呈现！\n- **【游离生物素（Free Biotin）】**：反应完没贴到蛋白上的剩余小分子生物素。**哪怕只残留一点点游离生物素，因为小分子跑得比大蛋白快得多，上磁珠时会瞬间把磁珠上的 SA 爪子全部占满，导致真正的生物素化抗原一颗都挂不上去**！\n- **【SA捕获能力与抗体识别能力双重独立验证】**：不能只测“生物素贴上了没有”，必须同时证明：① 能被 SA 磁珠/板吸住；② 吸住之后，患者阳性血清还能认出它！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **生物素化原料放行铁律（对应风险清单 R6）**：凡是出厂名为 `Biotin-xxx`（如 Biotin-Ro52、Biotin-dsDNA、Biotin-CCP）的原料，必须有 **① 生物素化率/标记度实测值、② 游离生物素彻底清除验证、③ SA 板/磁珠功能捕获 + 血清学识别双重检验记录**！",
    "cases": [
      {
        "title": "Ro52 供化学发光 SA 磁珠平台：NHS 化学标记 vs. AviTag 定点标记",
        "tag": "实战案例",
        "body": "## **1. 化学标记（NHS-PEG4-Biotin）的投料比红线**\n- Ro52 富含赖氨酸（全长含 29 个 Lys，且多个位于 Coiled-Coil 表面）。若 `Biotin : Ro52` 摩尔投料比过高（如 $>15:1$），虽挂珠信号极强，但阳性血清信噪比反而下降 40%（过度标记遮蔽了表位）。\n- **最优化学标记参数**：控制投料摩尔比 **`NHS-PEG4-Biotin : Ro52 = 3:1 ~ 5:1`**，使平均每个 Ro52 二聚体携带 2–3 个生物素，反应后经 **脱盐柱（Zeba Spin）+ 超滤换液 3 次** 彻底除尽游离生物素。\n\n---\n\n## **2. 高端升级路线（C 端或 N 端 AviTag 定点生物素化）**\n- 构建 `Ro52-Linker-AviTag(GLNDIFEAQKIEWHE)`，用 BirA 生物素连接酶在唯一的赖氨酸 K 上 100% 定点标记 1 个 Biotin，使 Ro52 在 SA 磁珠表面像刷子毛一样整齐朝外立起，弱阳性血清检出灵敏度最高。"
      }

    "title": "生物素化靶点: Streptavidin亲和介质",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握自然界最强的非共价相互作用 —— **链霉亲和素-生物素系统（Streptavidin-Biotin，$K_d \\approx 10^{-14}\\text{ M}$）** 在 IVD 诊断原料中的应用，通过化学法（NHS-Biotin）或定点酶促法（AviTag/BirA）完成抗原/核酸的 **可控生物素化修饰**，彻底清除 **游离生物素（Free Biotin）**，并对 **SA捕获能力与抗体识别能力进行双重独立验证**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【链霉亲和素-生物素系统（Streptavidin-Biotin）】**：生物界最强的“魔术贴”（结合紧度接近共价键，解离常数 $10^{-14}\\text{ M}$）。1 个链霉亲和素（SA）分子有 4 个爪子，能稳稳抓住 4 个生物素（Biotin）分子。化学发光试剂盒最爱把 SA 涂在磁珠上，再用带 Biotin 的抗原去定向挂珠。\n- **【可控生物素化修饰】**：给抗原贴生物素贴纸的两种方法：\n  - **化学胺标记（NHS-PEG4-Biotin）**：随机贴在蛋白表面的赖氨酸（Lys）上——简单通用，但如果贴多了把表位里的赖氨酸全糊住了，患者抗体就认不出来了；\n  - **定点酶促标记（AviTag + BirA 酶）**：只在蛋白末端设计好的 15 aa `AviTag` 上精准贴 1 个生物素——完全不遮挡抗原核心表位，定向朝外呈现！\n- **【游离生物素（Free Biotin）】**：反应完没贴到蛋白上的剩余小分子生物素。**哪怕只残留一点点游离生物素，因为小分子跑得比大蛋白快得多，上磁珠时会瞬间把磁珠上的 SA 爪子全部占满，导致真正的生物素化抗原一颗都挂不上去**！\n- **【SA捕获能力与抗体识别能力双重独立验证】**：不能只测“生物素贴上了没有”，必须同时证明：① 能被 SA 磁珠/板吸住；② 吸住之后，患者阳性血清还能认出它！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **生物素化原料放行铁律（对应风险清单 R6）**：凡是出厂名为 `Biotin-xxx`（如 Biotin-Ro52、Biotin-dsDNA、Biotin-CCP）的原料，必须有 **① 生物素化率/标记度实测值、② 游离生物素彻底清除验证、③ SA 板/磁珠功能捕获 + 血清学识别双重检验记录**！",
    "cases": [
      {
        "title": "Ro52 供化学发光 SA 磁珠平台：NHS 化学标记 vs. AviTag 定点标记",
        "tag": "实战案例",
        "body": "## **1. 化学标记（NHS-PEG4-Biotin）的投料比红线**\n- Ro52 富含赖氨酸（全长含 29 个 Lys，且多个位于 Coiled-Coil 表面）。若 `Biotin : Ro52` 摩尔投料比过高（如 $>15:1$），虽挂珠信号极强，但阳性血清信噪比反而下降 40%（过度标记遮蔽了表位）。\n- **最优化学标记参数**：控制投料摩尔比 **`NHS-PEG4-Biotin : Ro52 = 3:1 ~ 5:1`**，使平均每个 Ro52 二聚体携带 2–3 个生物素，反应后经 **脱盐柱（Zeba Spin）+ 超滤换液 3 次** 彻底除尽游离生物素。\n\n---\n\n## **2. 高端升级路线（C 端或 N 端 AviTag 定点生物素化）**\n- 构建 `Ro52-Linker-AviTag(GLNDIFEAQKIEWHE)`，用 BirA 生物素连接酶在唯一的赖氨酸 K 上 100% 定点标记 1 个 Biotin，使 Ro52 在 SA 磁珠表面像刷子毛一样整齐朝外立起，弱阳性血清检出灵敏度最高。"
      }
    ],

  },

    "title": "理化分离与精纯色谱",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在亲和捕获与切标签之后，利用蛋白质在 **表面净电荷（IEX）**、**有效分子流体力学体积（SEC）** 及 **表面疏水性（HIC）** 上的理化差异进行正交精纯抛光（Polishing），彻底去除宿主残留蛋白（HCP）、残留核酸、内毒素以及非功能性错误多聚体。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【正交精纯抛光（Polishing）】**：Orthogonal Purification，用和第一步完全不同原理的筛子接着筛（第一步按标签亲和筛，第二步按电荷筛，第三步按个头大小筛），把顺着第一步混进来的杂质一网打尽，让纯度从 85% 跨入 $\\ge 95\\%$。\n- **【表面净电荷（IEX）】**：由蛋白质的等电点（pI）和缓冲液 pH 决定，用于离子交换层析。\n- **【有效分子流体力学体积（SEC）】**：蛋白质在水溶液里转起来占多大空间（单体、二聚体、大聚集体个头差一倍以上），用于凝胶过滤分子筛。\n- **【表面疏水性（HIC）】**：正常折叠蛋白把疏水区藏在肚子里，错误折叠的变性异质体把疏水区露在外面，用于疏水层析挑出坏构象。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **精纯步骤价值核算**：每增加一步精纯，都会损失 10%–25% 的蛋白产量！审核工艺规程时必须问：**“加这一步柱子到底是为了除掉什么特定杂质？过柱前后的纯度、内毒素或阴性血清背景有没有实测对比证明这一步确实有效？”**",
    "cases": [
      {
        "title": "Ro52 切标后“Q 阴离子交换 + Superdex 200 分子筛”正交精纯组合",
        "tag": "实战案例",
        "body": "## **1. 为什么反挂 Ni 柱后还需要精纯？**\n- 反挂 Ni-NTA 流穿液虽然去掉了 His-MBP 和 His-TEV，但仍含有：① 破菌带来的微量大肠杆菌核酸与内毒素（带强负电）、② 少量在酶切过程中发生疏水聚集的高分子量多聚体（在 SDS-PAGE 还原胶上看不出来，因为煮样时全被 SDS 拆成了 54 kDa 单体！）。\n\n---\n\n## **2. 两步正交解决方案**\n1. **Q HP 强阴离子交换**：梯度盐洗脱，将紧密结合在柱上的核酸与内毒素留在高盐洗脱区，回收纯净蛋白峰（$A_{260}/A_{280} < 0.6$）。\n2. **Superdex 200 SEC 分子筛**：切去死体积处的高分子聚集峰（Void Peak），精准收集天然同源二聚体主峰。"
      }

    "key": "learn.3.1.0",
    "path": "基础知识学习 / 下游分离与纯化技术 / 理化分离与精纯色谱 / 离子交换色谱IEX: 依据电荷去除杂质",
    "title": "离子交换色谱IEX: 依据电荷去除杂质",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **离子交换色谱（IEX）** 的电荷调控法则 —— 根据目标蛋白的 **理论等电点（pI）** 设定缓冲液 pH，使蛋白带上明确的正电荷或负电荷，挂载到 **阴离子交换柱（Q/DEAE）** 或 **阳离子交换柱（SP/CM）** 上，再通过 **线性/阶梯NaCl盐浓度梯度** 将目标蛋白与宿主杂蛋白、核酸及内毒素精准分离。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【理论等电点（pI）】**：Isoelectric Point，蛋白质表面正负电荷刚好互相抵消、净电荷为 0 时的 pH 值（千万别把缓冲液调到正好等于 pI，蛋白没电荷互斥，最容易在 pI 附近沉淀！）。\n- **【pH 与电荷口诀（必背）】**：\n  - 当 **缓冲液 $\\text{pH} > \\text{pI} + 1$** 时，蛋白带 **负电** $\\rightarrow$ 用带正电的 **阴离子交换柱（Anion Exchange，如 Q 柱）** 抓它；\n  - 当 **缓冲液 $\\text{pH} < \\text{pI} - 1$** 时，蛋白带 **正电** $\\rightarrow$ 用带负电的 **阳离子交换柱（Cation Exchange，如 SP 柱）** 抓它。\n- **【阴离子交换柱（Q/DEAE）与阳离子交换柱（SP/CM）】**：`Q`（季铵基）是强阴离子柱，`SP`（磺丙基）是强阳离子柱。而且细菌的 **DNA/RNA 核酸和内毒素（LPS）天生带极强的负电荷**，在 Q 柱上抓得死死的，能和蛋白漂亮分开！\n- **【线性/阶梯NaCl盐浓度梯度】**：上样时必须是 **低盐（电导率低，如 $\\le 50\\text{ mM NaCl}$）** 蛋白才能吸上柱子；洗脱时慢慢升高食盐（$\\text{NaCl}$）浓度，$\\text{Na}^+$ 和 $\\text{Cl}^-$ 把不同电荷强度的蛋白按先后顺序挨个顶下来。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **IEX 挂柱失败第一防错点**：上离子交换柱前，**必须核查样品的电导率（Conductivity）和盐浓度**！刚从 Ni 柱下来含 $300\\text{ mM NaCl}$ 的样品如果直接往 Q 柱上打，因为盐太高屏蔽了电荷，蛋白会 100% 从流穿液跑掉！必须先用无盐缓冲液稀释 6 倍或透析把 NaCl 降到 $\\le 50\\text{ mM}$！",
    "cases": [
      {
        "title": "Ro52 (pI=6.35) 的 Q 强阴离子交换层析精纯参数",
        "tag": "实战案例",
        "body": "## **1. 电荷计算与选柱**\n- 去标签后的全长 Ro52 理论等电点 **$\\text{pI} = 6.35$**。\n- 设定工作缓冲液为 **$20\\text{ mM Tris-HCl, pH 8.0}$**（高于 pI 约 1.65 个单位） $\\rightarrow$ 此时 Ro52 带明显 **净负电荷**，选用 **`HiTrap Q HP` 强阴离子交换柱**。\n\n---\n\n## **2. 上样与盐梯度洗脱参数**\n1. **低盐上样**：将反挂 Ni 柱流穿液用无盐 $20\\text{ mM Tris (pH 8.0)}$ 稀释至 **$\\text{NaCl} \\le 50\\text{ mM}$（电导率 $\\le 6\\text{ mS/cm}$）** 后上样。\n2. **梯度洗脱**：以 $50\\text{ mM} \\rightarrow 500\\text{ mM NaCl}$ 线性梯度洗脱 15 CV：\n   - **Ro52 主峰**在约 **$180\\text{–}240\\text{ mM NaCl}$** 处对称洗脱；\n   - **残留大肠杆菌核酸与内毒素**被死死锁在柱上，直到 $>600\\text{ mM NaCl}$ / $1\\text{ M NaOH}$ CIP 时才被洗下，一步将内毒素与核酸污染降低 90% 以上。"
      }

        "title": "Ro52 (pI=6.35) 的 Q 强阴离子交换层析精纯参数",
        "tag": "实战案例",
        "body": "## **1. 电荷计算与选柱**\n- 去标签后的全长 Ro52 理论等电点 **$\\text{pI} = 6.35$**。\n- 设定工作缓冲液为 **$20\\text{ mM Tris-HCl, pH 8.0}$**（高于 pI 约 1.65 个单位） $\\rightarrow$ 此时 Ro52 带明显 **净负电荷**，选用 **`HiTrap Q HP` 强阴离子交换柱**。\n\n---\n\n## **2. 上样与盐梯度洗脱参数**\n1. **低盐上样**：将反挂 Ni 柱流穿液用无盐 $20\\text{ mM Tris (pH 8.0)}$ 稀释至 **$\\text{NaCl} \\le 50\\text{ mM}$（电导率 $\\le 6\\text{ mS/cm}$）** 后上样。\n2. **梯度洗脱**：以 $50\\text{ mM} \\rightarrow 500\\text{ mM NaCl}$ 线性梯度洗脱 15 CV：\n   - **Ro52 主峰**在约 **$180\\text{–}240\\text{ mM NaCl}$** 处对称洗脱；\n   - **残留大肠杆菌核酸与内毒素**被死死锁在柱上，直到 $>600\\text{ mM NaCl}$ / $1\\text{ M NaOH}$ CIP 时才被洗下，一步将内毒素与核酸污染降低 90% 以上。"
      }

    "title": "凝胶过滤色谱SEC: 依据分子量分离二聚体",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：利用 **凝胶过滤色谱/尺寸排阻色谱（SEC，分子筛）** 多孔凝胶微球的筛分效应，在不改变缓冲液成分的等度洗脱条件下，将 **无活性高分子聚集体（Void Peak）**、**天然功能性同源二聚体（Dimer）** 与 **小分子降解片段** 按流体力学半径大小彻底分开，同时一步完成最终成品的缓冲液置换。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【凝胶过滤色谱/尺寸排阻色谱（SEC，分子筛）】**：Size-Exclusion Chromatography（常用 `Superdex 200` 或 `Superdex 75`）。柱子里的微球布满微小孔洞：\n  - **个头最大的蛋白** 钻不进孔洞，只能走微球之间的外道近路，**最先跑出来**；\n  - **个头适中的蛋白** 半钻孔洞，**中间跑出来**；\n  - **个头最小的小分子/盐** 每个孔洞都要钻进去绕一圈，路程最长，**最后才跑出来**。\n- **【无活性高分子聚集体（Void Peak）】**：在柱子外水体积（死体积 $V_0$，如 Superdex 200 10/300 柱约在 $8\\text{ mL}$ 处）最先冲出来的尖峰——里面全是几百万道尔顿的死蛋白团块，**哪怕 SDS-PAGE 上看着是单带，也绝对不能混进成品里**（混进去会导致发光试剂盒非特异本底极高且效期极短）！\n- **【天然功能性同源二聚体（Dimer）】**：Ro52 天然依靠 Coiled-Coil 组成的双分子复合物（约 108 kDa，由于呈长杆状，流体力学半径约对应球状蛋白 130–150 kDa 洗脱位置），是活性最高的目标主峰。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **SEC 层析两条铁律**：① **上样体积绝不能超过柱床体积的 3%–5%**（例如 24 mL 分析柱上样 $\\le 0.5\\text{ mL}$，120 mL 制备柱上样 $\\le 4\\text{ mL}$；上样体积太大峰就会全糊在一起分不开）；② **严禁把 $V_0$ 死体积聚集峰和主峰合并收集**！",
    "cases": [
      {
        "title": "Ro52 在 Superdex 200 上的三峰辨析（死体积聚集峰 vs 天然二聚体主峰）",
        "tag": "实战案例",
        "body": "## **1. Superdex 200 Increase 10/300 GL（24 mL 柱）洗脱图谱判读**\n- **Peak 1（~8.2 mL，$V_0$ 死体积峰）**：高分子量非特异错误聚集体（>600 kDa）。虽然跑还原 SDS-PAGE 也是 54 kDa 条带，但 ELISA 测阴性血清本底极高 —— **必须果断切弃**！\n- **Peak 2（~12.8 mL，对称主峰）**：**Ro52 天然同源二聚体**（长杆状二聚体表观水力学分子量约 140 kDa），比活性与阴阳信噪比最高 —— **唯一放行收集区**。\n- **Peak 3（>16.5 mL，小肩峰）**：微量游离降解小片段或残留酶 —— **切弃**。"
      }

    "path": "基础知识学习 / 下游分离与纯化技术 / 理化分离与精纯色谱 / 疏水作用层析HIC: 去除构象异质体",
    "title": "疏水作用层析HIC: 去除构象异质体",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **疏水作用层析（HIC）** “**高盐上样结合、低盐梯度洗脱**”的反向盐控原理，利用不同折叠状态蛋白表面暴露疏水斑块的差异，精准剔除分子量与电荷都跟好蛋白一模一样、唯独三维折叠半露馅的 **构象异质体（Conformational Variants）**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【疏水作用层析（HIC）】**：Hydrophobic Interaction Chromatography（如 `Phenyl Sepharose` 苯基柱、`Butyl` 丁基柱），填料表面带温和的疏水基团，专门按蛋白表面的“怕水程度”来排队。\n- **【高盐上样结合、低盐梯度洗脱】**：操作顺序跟离子交换（IEX）**完全相反**！\n  - **上样时加高浓度硫酸铵（如 $0.8\\text{–}1.2\\text{ M } (\\text{NH}_4)_2\\text{SO}_4$）**：高盐抢走了水分子，逼着蛋白表面的疏水区贴到填料上；\n  - **洗脱时慢慢降低盐浓度（降到无盐缓冲液）**：水分子重新回来包裹蛋白，表面最亲水的好蛋白最先松手下来，表面极度疏水的坏构象蛋白最后才下来。\n- **【构象异质体（Conformational Variants）】**：氨基酸序列一字不差（所以 SDS-PAGE 和分子筛都分不开），但折叠时有一半疏水肚皮露在外面——这种半变性分子在试剂盒里存放一个月就会带头聚沉，用 HIC 就能把它们扣在柱子上除掉。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **HIC 防沉淀警告**：往蛋白溶液里加硫酸铵高盐前，**必须先做小样盐溶度测试**！很多像 Ro52 这样本身就容易疏水聚集的蛋白，如果硫酸铵加到 $1.0\\text{ M}$ 以上，还没上柱就在烧杯里直接盐析沉淀了（对易聚蛋白应选弱疏水填料 + 较低起始盐浓度，或优先用 IEX + SEC）。",
    "cases": [
      {
        "title": "HIC 疏水层析在去除截短体构象异质体与内毒素中的应用边界",
        "tag": "实战案例",
        "body": "## **1. 适用与慎用边界**\n- **对全长 Ro52（慎用高盐 HIC）**：全长 Ro52 在 $>0.8\\text{ M}$ 硫酸铵下易发生不可逆盐析聚集，因此全长路线主推 `Ni/Amylose → TEV → 反挂 Ni → Q 柱 → SEC`。\n- **对高可溶截短体（如 Ro52 125–268 或 P0 截短体）**：在 $0.6\\text{ M } (\\text{NH}_4)_2\\text{SO}_4$ 下上 `Butyl HP` 疏水柱，降盐梯度洗脱，可极高效地把暴露疏水面的半折叠分子与脂多糖（内毒素强疏水脂质 A）死死扣在柱尾，提升成品 37°C 加速稳定性。"
      }

  "learn.3.2": {
    "key": "learn.3.2",
    "path": "基础知识学习 / 下游分离与纯化技术 / 病毒灭活与缓冲液置换",
    "title": "病毒灭活与缓冲液置换",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在纯化收尾阶段，针对动物/人血浆或哺乳细胞来源原料执行必要的 **低pH病毒灭活与病原安全管控**，随后通过 **超滤离心管/切向流超滤（TFF）与透析** 将蛋白置换入含有保护剂的 **最终储存配方缓冲液（Formulation Buffer）**，浓缩至目标浓度并按单次使用规格无菌分装冻存。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【低pH病毒灭活与病原安全管控】**：凡是来源于人血浆（如制备 RF 抗原的人 IgG）、动物组织或哺乳动物细胞（CHO/293）的物料，不仅原料必须有传染病病原（HIV/HBV/HCV）阴性报告，工艺中还常利用 Protein A 洗脱后的 `pH 3.5–3.8 低 pH 孵育 30–60 min` 灭活脂包膜病毒。\n- **【超滤离心管/切向流超滤（TFF）与透析】**：\n  - **透析（Dialysis）**：把蛋白装进半透膜袋子里泡在一大桶新缓冲液里，小分子盐和咪唑慢慢扩散出去（温和，但不能浓缩体积）；\n  - **超滤（Ultrafiltration / TFF）**：用带微孔（如截留分子量 `MWCO 10 kDa / 30 kDa`）的滤膜加压过滤，水和盐透过去，大蛋白留在膜上——既能换缓冲液，又能把稀蛋白浓缩 5–10 倍。\n- **【最终储存配方缓冲液（Formulation Buffer）】**：让蛋白在 $-80^\\circ\\text{C}$ 或 $-20^\\circ\\text{C}$ 放两年都不失活的“保鲜汤”（通常含稳定 pH 的 PBS/Tris、维持离子强度的 $150\\text{–}300\\text{ mM NaCl}$、防还原氧化的 $0.5\\text{ mM TCEP/DTT}$ 以及防冻融冰晶刺伤蛋白的甘油或海藻糖）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **浓缩换液必查红线**：**浓度变高绝对不等于总蛋白没丢**！很多蛋白在超滤浓缩到 $>2\\text{ mg/mL}$ 时会大量贴在超滤膜上或析出沉淀（比如浓缩前 $10\\text{ mL} \\times 0.5\\text{ mg/mL} = 5\\text{ mg}$，浓缩后 $1\\text{ mL} \\times 2.0\\text{ mg/mL} = 2\\text{ mg}$，白白在膜上丢了 $3\\text{ mg}$）！批记录必须核算 **浓缩前后的总毫克数回收率**！",
    "cases": [
      {
        "title": "Ro52 最终储存配方（Formulation）与超滤防吸附损失 SOP",
        "tag": "实战案例",
        "body": "## **1. Ro52 标准成品储存缓冲液配方**\n- **配方**：$25\\text{ mM Tris-HCl (pH 7.5)}$（或 PBS pH 7.4） + **$300\\text{ mM NaCl}$（保持略高盐度压制 Coiled-Coil 聚集）** + **$0.5\\text{ mM TCEP}$（防 Cys 氧化）** + **$10\\%\\text{–}20\\%\\text{ Glycerol}$（防冻融聚集；若后续要做 NHS 氨基偶联包被，则严禁用 Tris 和甘氨酸，必须换入 PBS 缓冲液！）**。\n\n---\n\n## **2. 超滤浓缩防坑三招**\n1. **选对截留孔径（MWCO）**：按“目标分子量除以 2～3”选膜 —— 全长 Ro52（54 kDa，二聚体 108 kDa）选 **`30 kDa MWCO`** 超滤管；`125–268` 截短体（16.8 kDa）选 **`10 kDa MWCO`**。\n2. **防局部浓度过高沉淀**：每次离心 10 分钟必须拿出来用移液器沿膜面轻轻吹打混匀，且最终浓缩上限控制在 **$1.5\\text{–}2.0\\text{ mg/mL}$**（切勿盲目浓缩到 $>5\\text{ mg/mL}$ 引发自聚）。"

    "title": "病毒灭活与缓冲液置换",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在纯化收尾阶段，针对动物/人血浆或哺乳细胞来源原料执行必要的 **低pH病毒灭活与病原安全管控**，随后通过 **超滤离心管/切向流超滤（TFF）与透析** 将蛋白置换入含有保护剂的 **最终储存配方缓冲液（Formulation Buffer）**，浓缩至目标浓度并按单次使用规格无菌分装冻存。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【低pH病毒灭活与病原安全管控】**：凡是来源于人血浆（如制备 RF 抗原的人 IgG）、动物组织或哺乳动物细胞（CHO/293）的物料，不仅原料必须有传染病病原（HIV/HBV/HCV）阴性报告，工艺中还常利用 Protein A 洗脱后的 `pH 3.5–3.8 低 pH 孵育 30–60 min` 灭活脂包膜病毒。\n- **【超滤离心管/切向流超滤（TFF）与透析】**：\n  - **透析（Dialysis）**：把蛋白装进半透膜袋子里泡在一大桶新缓冲液里，小分子盐和咪唑慢慢扩散出去（温和，但不能浓缩体积）；\n  - **超滤（Ultrafiltration / TFF）**：用带微孔（如截留分子量 `MWCO 10 kDa / 30 kDa`）的滤膜加压过滤，水和盐透过去，大蛋白留在膜上——既能换缓冲液，又能把稀蛋白浓缩 5–10 倍。\n- **【最终储存配方缓冲液（Formulation Buffer）】**：让蛋白在 $-80^\\circ\\text{C}$ 或 $-20^\\circ\\text{C}$ 放两年都不失活的“保鲜汤”（通常含稳定 pH 的 PBS/Tris、维持离子强度的 $150\\text{–}300\\text{ mM NaCl}$、防还原氧化的 $0.5\\text{ mM TCEP/DTT}$ 以及防冻融冰晶刺伤蛋白的甘油或海藻糖）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **浓缩换液必查红线**：**浓度变高绝对不等于总蛋白没丢**！很多蛋白在超滤浓缩到 $>2\\text{ mg/mL}$ 时会大量贴在超滤膜上或析出沉淀（比如浓缩前 $10\\text{ mL} \\times 0.5\\text{ mg/mL} = 5\\text{ mg}$，浓缩后 $1\\text{ mL} \\times 2.0\\text{ mg/mL} = 2\\text{ mg}$，白白在膜上丢了 $3\\text{ mg}$）！批记录必须核算 **浓缩前后的总毫克数回收率**！",

    "path": "基础知识学习 / 下游分离与纯化技术 / 病毒灭活与缓冲液置换 / 低pH洗脱与病毒灭活处理",
    "title": "低pH洗脱与病毒灭活处理",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握生物制品中 **低pH孵育病毒灭活** 的适用场景与工艺边界，区分 **原核重组抗原（无人类病毒风险）** 与 **血浆/真核细胞源原料（需病原筛查与灭活）**，并严防低 pH 处理对酸敏感蛋白造成的 **不可逆酸变性聚集**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【低pH孵育病毒灭活】**：在单抗或 IgG 纯化中，利用 Protein A 洗脱下来的酸性条件（pH $3.5 \\pm 0.1$），在室温下静置保持 30–60 分钟，用酸彻底破坏逆转录病毒等脂包膜病毒的外壳，然后再加 Tris 调回中性。\n- **【原核重组抗原 vs 血浆/真核细胞源原料】**：\n  - 大肠杆菌（*E. coli*）根本不会感染人类病毒（HIV/HBV/HCV），所以 **大肠杆菌表达的 Ro52 绝对不需要、也不应该做低 pH 病毒灭活**（大肠杆菌要做的是除内毒素）；\n  - 而从人血清/血浆提取的原料（如本公司制备 RF 酶切抗原用的人 IgG 粗品）或 CHO 细胞制品，才需要管控人类病原体与病毒灭活！\n- **【不可逆酸变性聚集】**：Ro52 等胞内蛋白极度怕酸（pH 降到 5.0 以下就会跨越等电点 pI 6.35 并发生三维结构坍塌，变成一锅白粥一样的死沉淀）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **生物安全与工艺防错双查（对应风险清单 R6）**：① 对大肠杆菌表达的 Ro52，严禁生搬硬套单抗的“低 pH 洗脱/灭活”步骤；② 对本公司 **RF 酶切抗原所用的人源 IgG 原料**，来料检验必须核查供方提供的 **HBsAg、HCV、HIV-1/2、梅毒螺旋体抗体阴性检测报告（CoA）**！",
    "cases": [
      {
        "title": "导图纠偏案例：为什么大肠杆菌 Ro52 不做低 pH 灭活，而 RF 人 IgG 原料必须查病原？",
        "tag": "体系防错案例",
        "body": "## **1. 概念纠偏（防止生搬硬套单抗 SOP）**\n- 通用生物制药导图常把“低 pH 病毒灭活”列为下游标准步骤，但这专门针对 **CHO 表达单抗或血浆制品（走 Protein A 低 pH 洗脱）**。\n- **Ro52 在大肠杆菌中表达**：无人类脂包膜病毒宿主风险，且 Ro52 酸敏感（pH $<5.5$ 即跨等电点沉淀），全程 pH 必须稳定在 **7.4–8.0**！\n\n---\n\n## **2. 本公司真正需要管病原与灭活的品种（风险清单 R6 整改落点）**\n- **RF（类风湿因子）酶切抗原项目**：起始原料为外购 **人源 IgG 粗品**（人血浆来源）。在 Gate R3（原料放行）与 Gate R5（纯化）中，必须强制核查供方血源病原体四项阴性证明及灭活记录！"
      }

    "title": "超滤透析进行缓冲液置换",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：利用 **透析袋扩散（Dialysis）**、**脱盐柱（Desalting）** 或 **超滤换液（Diafiltration）**，将洗脱液中的高浓度咪唑、高盐或错配缓冲体系彻底置换成与下游包被/偶联工艺完全兼容的目标缓冲液，严防 **氨基缓冲液（Tris/甘氨酸）干扰NHS偶联**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【透析袋扩散（Dialysis）】**：把蛋白装进半透膜肠衣里，扎紧两头泡进 100 倍体积的新缓冲液桶里（4°C 磁力搅拌）。每次泡 4–6 小时换一次桶里的水，连换 3 次水就能把原来里面 99.9% 的咪唑或旧盐排干净。\n- **【超滤换液（Diafiltration）】**：在超滤管里把蛋白浓缩到 1/5 体积，再加满新缓冲液稀释回原体积，如此重复“浓缩—补新液” 3–4 个循环，也能把旧缓冲液置换 99% 以上（速度比透析快得多，但要盯防浓缩界面沉淀）。\n- **【氨基缓冲液（Tris/甘氨酸）干扰NHS偶联】**：**IVD 原料交付头号大坑**！很多纯化人员习惯用 `Tris-HCl` 缓冲液，但 **每一个 Tris 分子头上都带一个伯氨基（$-\\text{NH}_2$）**！如果客户买回去要用 NHS-生物素标记、或者用 EDC/NHS 偶联到羧基磁珠/胶乳微球上，缓冲液里成千上万倍的 Tris 氨基会把偶联试剂抢光，导致蛋白根本挂不上磁珠！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **换液配方必查红线**：**用途决定最终缓冲液**！在定型换液前必须核对客户用途 —— **凡是后续要做生物素化（NHS-Biotin）、羧基磁珠偶联或胶乳微球共价致敏的原料，最终缓冲液必须换成 `PBS` 或 `HEPES / MES`，绝对禁止残留 `Tris`、`甘氨酸（Glycine）` 或 `硫酸铵`**！",

        "tag": "实战案例",
        "body": "## **1. 按客户下游工艺定制换液配方**\n| 客户下游用法 | 推荐最终换液配方 | 严禁含有的禁忌成分 | 原因说明 |\n|---|---|---|---|\n| **ELISA 微孔板物理吸附包被** | `PBS (pH 7.4)` 或 `20 mM Tris (pH 7.5) + 150 mM NaCl` | **严禁含去垢剂（Tween-20 / Triton X-100）** | 去垢剂会占满酶标板疏水位点，导致蛋白吸不上板 |\n| **羧基磁珠 EDC/NHS 共价偶联 / NHS-生物素标记** | **`PBS (pH 7.4) + 300 mM NaCl`**（无氨基体系） | **严禁含 Tris、甘氨酸、铵盐、叠氮钠（$\\text{NaN}_3$）** | 游离伯氨基会彻底淬灭 NHS 酯，导致偶联失败 |"

    "title": "超滤透析进行缓冲液置换",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：利用 **透析袋扩散（Dialysis）**、**脱盐柱（Desalting）** 或 **超滤换液（Diafiltration）**，将洗脱液中的高浓度咪唑、高盐或错配缓冲体系彻底置换成与下游包被/偶联工艺完全兼容的目标缓冲液，严防 **氨基缓冲液（Tris/甘氨酸）干扰NHS偶联**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【透析袋扩散（Dialysis）】**：把蛋白装进半透膜肠衣里，扎紧两头泡进 100 倍体积的新缓冲液桶里（4°C 磁力搅拌）。每次泡 4–6 小时换一次桶里的水，连换 3 次水就能把原来里面 99.9% 的咪唑或旧盐排干净。\n- **【超滤换液（Diafiltration）】**：在超滤管里把蛋白浓缩到 1/5 体积，再加满新缓冲液稀释回原体积，如此重复“浓缩—补新液” 3–4 个循环，也能把旧缓冲液置换 99% 以上（速度比透析快得多，但要盯防浓缩界面沉淀）。\n- **【氨基缓冲液（Tris/甘氨酸）干扰NHS偶联】**：**IVD 原料交付头号大坑**！很多纯化人员习惯用 `Tris-HCl` 缓冲液，但 **每一个 Tris 分子头上都带一个伯氨基（$-\\text{NH}_2$）**！如果客户买回去要用 NHS-生物素标记、或者用 EDC/NHS 偶联到羧基磁珠/胶乳微球上，缓冲液里成千上万倍的 Tris 氨基会把偶联试剂抢光，导致蛋白根本挂不上磁珠！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **换液配方必查红线**：**用途决定最终缓冲液**！在定型换液前必须核对客户用途 —— **凡是后续要做生物素化（NHS-Biotin）、羧基磁珠偶联或胶乳微球共价致敏的原料，最终缓冲液必须换成 `PBS` 或 `HEPES / MES`，绝对禁止残留 `Tris`、`甘氨酸（Glycine）` 或 `硫酸铵`**！",
    "cases": [
      {
        "title": "Ro52 交付不同客户平台时的缓冲液切换规则（Tris vs. PBS）",
        "tag": "实战案例",
        "body": "## **1. 按客户下游工艺定制换液配方**\n| 客户下游用法 | 推荐最终换液配方 | 严禁含有的禁忌成分 | 原因说明 |\n|---|---|---|---|\n| **ELISA 微孔板物理吸附包被** | `PBS (pH 7.4)` 或 `20 mM Tris (pH 7.5) + 150 mM NaCl` | **严禁含去垢剂（Tween-20 / Triton X-100）** | 去垢剂会占满酶标板疏水位点，导致蛋白吸不上板 |\n| **羧基磁珠 EDC/NHS 共价偶联 / NHS-生物素标记** | **`PBS (pH 7.4) + 300 mM NaCl`**（无氨基体系） | **严禁含 Tris、甘氨酸、铵盐、叠氮钠（$\\text{NaN}_3$）** | 游离伯氨基会彻底淬灭 NHS 酯，导致偶联失败 |"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },
  "learn.3.2.2": {
    "key": "learn.3.2.2",
    "path": "基础知识学习 / 下游分离与纯化技术 / 病毒灭活与缓冲液置换 / 超滤浓缩与蛋白分装储存",
    "title": "超滤浓缩与蛋白分装储存",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：将换液合格的蛋白浓缩至目标规格浓度（通常 $\\ge 1.0\\text{ mg/mL}$），经 $0.22\\ \\mu\\text{m}$ 无菌滤膜除菌后，按 **单次使用小规格（Single-Use Aliquots）** 分装、贴赋唯一受控批号标签、留足 **QC检验样与稳定性留样支数**，并在 $-80^\\circ\\text{C}$ 受控库位登记入库。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【截留分子量（MWCO）】**：Molecular Weight Cut-Off，超滤膜能拦住的最小蛋白大小（指 90% 能被拦住的分子量）。为保证一点都不漏，**必须选 MWCO 小于目标蛋白分子量 $1/2 \\sim 1/3$ 的超滤膜**。\n- **【单次使用小规格（Single-Use Aliquots）】**：不要把 20 mg 蛋白全装在一个大管子里！如果一大管反复从 $-80^\\circ\\text{C}$ 拿出来化冻取样再冻回去（反复冻融），3 次下来蛋白就聚沉失活了。必须按客户和 QC 单次用量（如 $0.1\\text{ mg/支}$、$0.5\\text{ mg/支}$、$1.0\\text{ mg/支}$）分装成几十小管。\n- **【QC检验样与稳定性留样支数】**：按 LabOS 与质量体系规定，每批分装时必须单独留出 **成品质检抽样（默认 $\\ge 3$ 支）** 和 **留样观察室留样（按分装规格留存，用于后续稳定性追踪与客户投诉复查）**。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **分装入库必查（对应 LabOS「批次与样品」模块）**：分装完成后必须当天在 LabOS 登记 —— **① 样品编号（样品号-年月日-序号）、② 实测浓度（mg/mL）与单支体积、③ 总支数/合格量/留样支数、④ 精确到「几号冰箱-第几层-哪个冻存盒」的物理位置**！（严禁像历史上 152 个中间品那样不填冰箱位置和数量）。",
    "cases": [
      {
        "title": "Ro52 成品浓缩分装、留样与 LabOS 库位登记标准样板",
        "tag": "实战案例",
        "body": "## **1. 分装与留样物料平衡单（示例批）**\n- **浓缩终点**：使用 `30 kDa MWCO` 超滤管浓缩至实测 BCA 浓度 **$1.25\\text{ mg/mL}$**，总体积 $12.0\\text{ mL}$（折合总量 **$15.0\\text{ mg}$**），$0.22\\ \\mu\\text{m}$ 低蛋白吸附 PVDF 滤膜过滤。\n- **分装规格**：\n  - 正式库存管：$0.8\\text{ mL/支} \\times 12\\text{ 支}$（$1.0\\text{ mg/支}$，共 $12.0\\text{ mg}$）；\n  - QC 检验抽样管：$0.2\\text{ mL/支} \\times 4\\text{ 支}$（用于 SDS-PAGE、SEC-HPLC、BCA、ELISA 活性与加速冻融测试）；\n  - 长期稳定性留样管：$0.2\\text{ mL/支} \\times 8\\text{ 支}$（分别用于 3/6/12/24 个月实时稳定性追踪）。\n- **LabOS 登记库位**：`-80°C 2号成品冰箱 / 第3层 / B2冻存盒`（状态先设为 **「待检」**，严禁未放行先出库）。"
      }
    ],

  "learn.3.3": {
    "key": "learn.3.3",
    "path": "基础知识学习 / 下游分离与纯化技术 / Gate｜⑤ 纯化与样品处理（可重复调用）",
    "title": "Gate｜⑤ 纯化与样品处理（可重复调用）",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R5（下游纯化与样品处理关口，对应生产 G2 半成品转序）** 对整条纯化链的 **步回收率与总物料平衡**、**残留物清除证据（标签/蛋白酶/咪唑/游离生物素）** 以及 **中间品库位建档** 进行全面审查，确认合格后方可移交 QC 进行成品质检（工序 ⑦）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【步回收率与总物料平衡】**：每一道柱子进去了多少毫克、出来了多少毫克、损失率是多少，账本必须合得上；严禁“挑最好看的一管去测纯度，却不报告整批收率只有 5%”。\n- **【残留物清除证据】**：如果工艺里加了 TEV 酶、切了 MBP 标签或做了生物素标记，必须证明这些外加物已经被反挂或换液除干净了，不会干扰后续定量和包被。\n- **【G2 半成品转序】**：纯化组完成纯化分装后，将样品状态置为 **「待检」** 并提交请检单移交 QC 的受控节点。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R5 放行四问**：① 各步纯化过程样品（上样/流穿/洗杂/洗脱）的完整胶图和紫外层析图谱归档了吗？② 总收率（mg/L 发酵液或 mg/g 湿菌）算出来了吗？③ 缓冲液最终配方是否与客户下游用法兼容？④ 冰箱位置、支数、留样在 LabOS 上填全了吗？",
    "cases": [
      {
        "title": "Ro52 项目 Gate R5 纯化完成交检核验表",
        "tag": "Gate 评审案例",
        "body": "## **1. Gate R5 四件套核验清单**\n| 维度 | Ro52 纯化交检核验内容 | 结果 |\n|---|---|---|\n| **检查方法** | 审查层析图谱（AKTA UV280/260 曲线）、全过程 SDS-PAGE 胶图、各步体积与浓度物料平衡表 | 已核查 |\n| **通过依据** | 反挂与抛光后 SDS-PAGE 主带（54.2 kDa）无 43 kDa MBP 残留；每升发酵液纯品收率 $\\ge 10\\text{ mg/L}$；缓冲液为无 Tris 的 PBS + 300 mM NaCl + 10% 甘油 | 合格 |\n| **未通过动作** | 若 MBP 残留 $>5\\%$ 或死体积聚集峰（$V_0$）超过 15%，必须重新反挂镍柱或重过 SEC，严禁带病交检 | 闭环 |\n| **交付物** | 完整纯化批记录、层析原始导出文件、LabOS「批次与样品」位置登记单、QC 请检单 | 已转序 |"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过 **理化质控（纯度/聚体/浓度/内毒素）**、**功能与临床血清学验证（ELISA/发光阴阳性参考盘）** 以及 **实时与加速稳定性测试** 三大维度，全方位证实做出来的抗原“**身份对、纯度高、构象活、批间稳、放得住**”，并由 **独立于执行人的 QC 与管理者代表** 完成受控放行。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【理化质控】**：用仪器测出来的客观物理化学指标（电泳看分子量与纯度、SEC-HPLC 看有没有聚体、BCA/UV280 看浓度、鲎试剂看内毒素）。\n- **【功能与临床血清学验证】**：理化纯度 99% 的蛋白如果是死构象，在试剂盒里也是废品！必须包被到板或磁珠上，用真实的 **临床阳性血清（含强阳、中阳、弱阳）和阴性血清（含健康人与干扰疾病血清）** 实测信噪比与符合率。\n- **【实时与加速稳定性测试】**：测试蛋白耐受 **反复冻融（3–5 次）**、**37°C 加速热破坏（7–14 天）** 以及 **$-20^\\circ\\text{C}/-80^\\circ\\text{C}$ 长期真实存放** 的能力。**声明多长的有效期，就必须有多长时间的真实数据支撑**！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R7 / G3 成品放行最高红线（对应风险清单 R1、R6、R7）**：① **检验人与放行批准人必须分离**（放行由管代胡冯博签批）；② **CoA 上必须填写真实实测数值（如 `94.6%`），且每一项数字背后必须能调出原始仪器图谱/胶图附件**，严禁跨批次复制粘贴 CoA 数字！",

        "tag": "实战案例",
        "body": "## **1. Ro52 企业产品标准（CoA 必检六项）**\n| 检验项目 | 检测方法 | 合格标准（预设） | 本批实测示例（须附原图） |\n|---|---|---|---|\n| **1. 外观** | 目视检查 | 无色澄清透明液体，无肉眼可见沉淀或絮状物 | 符合（无色澄清液体） |\n| **2. 身份与分子量** | 还原 SDS-PAGE / WB | 主带位于 $54\\pm 3\\text{ kDa}$（截短体 $17\\pm 2\\text{ kDa}$），抗 Ro52 标准品识别阳性 | $54.1\\text{ kDa}$，识别阳性 |\n| **3. 电泳纯度** | SDS-PAGE 考马斯亮蓝光密度扫描 | 主带占比 **$\\ge 90.0\\%$** | **$94.2\\%$**（附胶图 #20261118-01） |\n| **4. 聚体与均一性** | SEC-HPLC（分析型分子筛） | 天然二聚体主峰 **$\\ge 85.0\\%$**，死体积大聚集峰 $\\le 5.0\\%$ | 二聚体峰 **$91.5\\%$**，聚集峰 $2.1\\%$ |\n| **5. 蛋白浓度** | BCA 法（或经消光系数校正的 $A_{280}$） | **$\\ge 1.00\\text{ mg/mL}$**（偏差 $\\pm 10\\%$） | **$1.25\\text{ mg/mL}$** |\n| **6. 血清学功能活性** | 间接 ELISA / 化学发光参考血清盘 | 参比批效价偏差 $\\le 15\\%$；阳性盘（20例）符合率 $\\ge 95\\%$，阴性盘（30例）均值 $\\text{OD} \\le 0.15$ | 阳符合率 $20/20 (100\\%)$，阴均值 $0.068$ |"

    "path": "基础知识学习 / 质量控制QC与活性评估 / 理化质控指标检测",
    "title": "理化质控指标检测",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：运用相互正交的理化分析手段 —— **还原与非还原SDS-PAGE（测变性纯度与链完整性）**、**SEC-HPLC（测天然溶液寡聚态）**、**BCA/UV280（测定量浓度与核酸污染比）** 及 **内毒素测定**，给出一批原料完整、客观的理化身份证。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【还原与非还原SDS-PAGE】**：还原胶加了 DTT/巯基乙醇并煮沸，把所有二硫键和非共价键全拆散，看单条肽链有没有断裂；非还原胶不加还原剂，用来看有没有靠二硫键连在一起的共价多聚体。\n- **【SEC-HPLC】**：在高效液相色谱仪上跑分析型分子筛（15–20 分钟一针），看蛋白在天然不煮沸的水溶液里到底是健康的二聚体，还是抱成了一团废聚集体（这是 SDS-PAGE 绝对看不出来的盲区！）。\n- **【BCA/UV280与核酸污染比（$A_{260}/A_{280}$）】**：BCA 用铜离子显色测蛋白浓度；紫外分光光度计同时测 $280\\text{ nm}$（蛋白吸收峰）和 $260\\text{ nm}$（核酸吸收峰）—— **纯蛋白的 $A_{260}/A_{280}$ 必须 $\\approx 0.57\\text{–}0.65$**；如果 $>0.8$，说明里面掺了大量细菌 DNA/RNA，必须重除核酸！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **理化质检防错红线（对应风险清单 R6）**：**检测方法必须适合该材料的物理本质**！例如大蛋白（Ro52 54 kDa）用 SDS-PAGE + SEC-HPLC；而小分子环肽（如 CCP 2.5 kDa）在普通 SDS-PAGE 上根本跑不住，必须用 RP-HPLC + 质谱（MS）；dsDNA 核酸必须测 $A_{260}/A_{280} (1.75\\text{–}1.90)$ 与琼脂糖电泳！严禁标准里写 HPLC、实际只拿一张普通电泳胶放行！",
    "cases": [
      {
        "title": "为什么“SDS-PAGE 单一条带”不等于“好抗原”？（Ro52 理化正交检验案例）",
        "tag": "实战案例",
        "body": "## **1. 经典质量盲区复盘**\n- **现象**：两批全长 Ro52 在还原 SDS-PAGE 上都是漂亮的 54 kDa 单一条带（纯度均 $>93\\%$），BCA 浓度也都是 $1.2\\text{ mg/mL}$；但包被酶标板后，B 批的阴性血清本底比 A 批高出 4 倍。\n- **正交排查真相**：\n  1. 测紫外全波长扫描：B 批 **$A_{260}/A_{280} = 1.05$**（A 批为 $0.59$），说明 B 批漏过了 Q 柱，携带大量大肠杆菌残留核酸；\n  2. 上 **SEC-HPLC**：B 批在死体积处有 **32% 的高分子聚集峰**（煮样跑 SDS-PAGE 时聚集体被 SDS 拆散成了 54 kDa，所以在电泳胶上完全隐形！）。\n\n---\n\n> **质控结论**：必须将 **`SDS-PAGE + SEC-HPLC + A260/A280`** 三项联合作为 Ro52 理化放行必检组合。"
      }

    "path": "基础知识学习 / 质量控制QC与活性评估 / 理化质控指标检测 / 纯度测定:考马斯亮蓝与SDS-PAGE",
    "title": "纯度测定:考马斯亮蓝与SDS-PAGE",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：规范 **SDS-PAGE电泳与考马斯亮蓝染色** 的上样量与成像积分操作，利用凝胶成像系统的 **光密度扫描积分（Densitometry）** 计算目标主带占总条带面积的百分比（即电泳纯度），并通过 **还原（+DTT）与非还原（-DTT）双模式对比** 排查异常二硫键交联与微量降解带。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【光密度扫描积分（Densitometry）】**：不是靠人眼拍脑袋估“大概有 90% 纯”，而是用凝胶成像软件画出整个泳道的灰度峰面积，用 `目标主峰面积 ÷ 该泳道所有条带总峰面积 × 100%` 算出来的客观纯度数值。\n- **【上样量窗口（$2\\text{–}5\\ \\mu\\text{g}$/孔）】**：跑纯度鉴定时，每孔上样蛋白量必须控制在 **$2\\text{–}5\\ \\mu\\text{g}$**！\n  - 如果上样太少（如 $<0.3\\ \\mu\\text{g}$），杂蛋白条带低于考马斯亮蓝显色极限根本看不见，随便什么脏蛋白跑出来都像“100% 单一条带”（假高纯度）；\n  - 如果上样太多（$>15\\ \\mu\\text{g}$），主带严重过载拖尾，又会掩盖紧挨着的降解带。\n- **【还原（+DTT）与非还原（-DTT）双模式对比】**：还原组加 DTT 拆开所有二硫键看单链纯度；非还原组不加 DTT，看存储过程中半胱氨酸（Cys）有没有被空气氧化结成错误的二硫键多聚体。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **纯度报告必查三项**：① 每孔上样蛋白微克数写明了没有（必须在 $2\\text{–}5\\ \\mu\\text{g}$ 显色敏感区，严禁故意稀释到 $0.2\\ \\mu\\text{g}$ 跑胶凑“单一条带”）？② CoA 上的纯度百分比是否有凝胶成像软件的积分原始图支撑？③ 还原胶与非还原胶是否都做了确认？",
    "cases": [
      {
        "title": "Ro52 还原 vs. 非还原 SDS-PAGE 判读防错（天然非共价二聚体 vs. 氧化交联多聚体）",
        "tag": "实战案例",
        "body": "## **1. 核心科学概念防错（极易搞混点！）**\n- **问：Ro52 天然是同源二聚体（108 kDa），那跑非还原 SDS-PAGE 时应该在 108 kDa 还是 54 kDa？**\n- **答：健康的 Ro52 在非还原 SDS-PAGE 上依然主要在 54 kDa！**\n  - **原理**：Ro52 的天然二聚体是靠 Coiled-Coil 螺旋的 **疏水非共价作用** 结合的（不是靠二硫键焊死的）；即使不加 DTT（非还原），只要加了 SDS 强去垢剂，非共价二聚体就会被拆成 **54 kDa 单体**！\n  - **反之**：如果非还原 SDS-PAGE 上出现了大量 **$>110\\text{ kDa}$ 甚至卡在胶孔顶部的条带**，加了 DTT 后又消失变回 54 kDa —— 说明缓冲液里 **还原剂（TCEP/DTT）失效，导致 N 端锌指的半胱氨酸发生了错误的分子间二硫键氧化交联**！"
      }

    "title": "纯度测定:考马斯亮蓝与SDS-PAGE",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：规范 **SDS-PAGE电泳与考马斯亮蓝染色** 的上样量与成像积分操作，利用凝胶成像系统的 **光密度扫描积分（Densitometry）** 计算目标主带占总条带面积的百分比（即电泳纯度），并通过 **还原（+DTT）与非还原（-DTT）双模式对比** 排查异常二硫键交联与微量降解带。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【光密度扫描积分（Densitometry）】**：不是靠人眼拍脑袋估“大概有 90% 纯”，而是用凝胶成像软件画出整个泳道的灰度峰面积，用 `目标主峰面积 ÷ 该泳道所有条带总峰面积 × 100%` 算出来的客观纯度数值。\n- **【上样量窗口（$2\\text{–}5\\ \\mu\\text{g}$/孔）】**：跑纯度鉴定时，每孔上样蛋白量必须控制在 **$2\\text{–}5\\ \\mu\\text{g}$**！\n  - 如果上样太少（如 $<0.3\\ \\mu\\text{g}$），杂蛋白条带低于考马斯亮蓝显色极限根本看不见，随便什么脏蛋白跑出来都像“100% 单一条带”（假高纯度）；\n  - 如果上样太多（$>15\\ \\mu\\text{g}$），主带严重过载拖尾，又会掩盖紧挨着的降解带。\n- **【还原（+DTT）与非还原（-DTT）双模式对比】**：还原组加 DTT 拆开所有二硫键看单链纯度；非还原组不加 DTT，看存储过程中半胱氨酸（Cys）有没有被空气氧化结成错误的二硫键多聚体。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **纯度报告必查三项**：① 每孔上样蛋白微克数写明了没有（必须在 $2\\text{–}5\\ \\mu\\text{g}$ 显色敏感区，严禁故意稀释到 $0.2\\ \\mu\\text{g}$ 跑胶凑“单一条带”）？② CoA 上的纯度百分比是否有凝胶成像软件的积分原始图支撑？③ 还原胶与非还原胶是否都做了确认？",
    "cases": [
      {
        "title": "Ro52 还原 vs. 非还原 SDS-PAGE 判读防错（天然非共价二聚体 vs. 氧化交联多聚体）",
        "tag": "实战案例",
        "body": "## **1. 核心科学概念防错（极易搞混点！）**\n- **问：Ro52 天然是同源二聚体（108 kDa），那跑非还原 SDS-PAGE 时应该在 108 kDa 还是 54 kDa？**\n- **答：健康的 Ro52 在非还原 SDS-PAGE 上依然主要在 54 kDa！**\n  - **原理**：Ro52 的天然二聚体是靠 Coiled-Coil 螺旋的 **疏水非共价作用** 结合的（不是靠二硫键焊死的）；即使不加 DTT（非还原），只要加了 SDS 强去垢剂，非共价二聚体就会被拆成 **54 kDa 单体**！\n  - **反之**：如果非还原 SDS-PAGE 上出现了大量 **$>110\\text{ kDa}$ 甚至卡在胶孔顶部的条带**，加了 DTT 后又消失变回 54 kDa —— 说明缓冲液里 **还原剂（TCEP/DTT）失效，导致 N 端锌指的半胱氨酸发生了错误的分子间二硫键氧化交联**！"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"

    "title": "聚体分析: SEC-HPLC评估二聚体比例",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：使用 **分析型尺寸排阻高效液相色谱（SEC-HPLC）** 在生理缓冲液（非变性）条件下测定抗原的 **天然溶液寡聚分布**，利用 **标准分子量校准曲线（Gel Filtration Standard）** 确认主峰归属（单体、天然二聚体或多聚体），并严格限制 **高分子死体积聚集体（HMWS）** 的比例。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【分析型尺寸排阻高效液相色谱（SEC-HPLC）】**：在高压液相色谱仪上装一根高分辨率分析型分子筛柱（如 `TSKgel G3000SWxl` 或 `Superdex 200 Increase 5/150`），只需打入 $10\\text{–}20\\ \\mu\\text{g}$ 蛋白，15 分钟就能精确算出溶液里天然二聚体占百分之几、错误大聚集体占百分之几。\n- **【标准分子量校准曲线（Gel Filtration Standard）】**：用已知分子量的 5 种标准球状蛋白（如 670 kDa 甲状腺球蛋白、158 kDa $\\gamma$-球蛋白、44 kDa 卵清蛋白、17 kDa 肌红蛋白、1.35 kDa 维生素 B12）跑同一根柱子画出的时间标尺。\n- **【高分子死体积聚集体（HMWS）】**：High Molecular Weight Species，在最前面（近 670 kDa 甚至死体积处）跑出来的非正常大团块；在免疫诊断中，1 个大聚集体上挂着几十个抗原表位，极易非特异吸附人血清中的正常 IgG 或类风湿因子（RF），是导致临床假阳性的头号元凶。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **SEC-HPLC 判读必知**：SEC 测的是蛋白在水里转起来的“外接球体积（流体力学半径）”，不是绝对质量！像 Ro52 这样中间有一根长长的 Coiled-Coil 卷曲螺旋杆的 **长条形蛋白**，转起来占的地方比同重量的圆球大得多，所以 **108 kDa 的 Ro52 天然二聚体在 SEC 上跑出来的位置通常对应球状标准品的 130–160 kDa**，这属于完全正常的物理现象！",
    "cases": [
      {
        "title": "Ro52 的 SEC-HPLC 放行图谱标准与形状因子解释",
        "tag": "实战案例",
        "body": "## **1. Ro52 SEC-HPLC 放行标准（TSKgel G3000SWxl / Superdex 200）**\n- **流动相**：$50\\text{ mM PB (pH 7.4)} + 300\\text{ mM NaCl}$（高离子强度防止蛋白与硅胶基质发生次级静电吸附拖尾）。\n- **峰面积积分标准**：\n  1. **天然同源二聚体主峰**（表观保留位置对应球状标准品 ~140 kDa）：峰面积占比 **$\\ge 85.0\\%$**；\n  2. **死体积大聚集体峰（HMWS，>600 kDa）**：峰面积占比 **$\\le 5.0\\%$**；\n  3. **低分子降解碎片峰（LMWS，<30 kDa）**：峰面积占比 **$\\le 5.0\\%$**。"

  "learn.4.0.2": {
    "key": "learn.4.0.2",
    "path": "基础知识学习 / 质量控制QC与活性评估 / 理化质控指标检测 / 浓度与内毒素测定: BCA法与低内毒素控制",
    "title": "浓度与内毒素测定: BCA法与低内毒素控制",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：建立准确的 **蛋白定量方法（BCA法与摩尔消光系数校正$A_{280}$法）**，排查缓冲液中 **还原剂（DTT）与甘油对定量的干扰**，确保每一批包被投料的质量浓度真实可比；同时通过 **鲎试剂法（LAL）测定细菌内毒素**，确保原料符合免疫实验或体内外诊断要求。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【蛋白定量方法（BCA法与摩尔消光系数校正$A_{280}$法）】**：\n  - **BCA 法**：蛋白质在碱性条件下把 $\\text{Cu}^{2+}$ 还原成 $\\text{Cu}^+$，与 BCA 试剂生成紫色复合物（562 nm 测吸光度，跟 BSA 标准曲线对比）。优点是不受蛋白色氨酸多少的影响；**致命缺点是极怕 DTT 等还原剂**（DTT 自己就会把铜离子还原成深紫色，导致测出来的蛋白浓度虚高几倍！）；\n  - **$A_{280}$ 紫外吸光法**：测 280 nm 吸光度除以该蛋白的理论消光系数 $\\varepsilon$（由序列中色氨酸 W 和酪氨酸 Y 的个数决定）。**前提是必须先确保 $A_{260}/A_{280} < 0.65$ 无核酸污染**（否则核酸在 280 nm 也有强吸收，会把蛋白浓度算虚高）！\n- **【还原剂（DTT）与甘油对定量的干扰】**：若缓冲液含 $>1\\text{ mM DTT}$，必须改用 **兼容还原型 BCA 试剂盒（或 Bradford 法 / 去核酸后的 $A_{280}$ 法）**，且空白调零孔（Blank）必须使用 **同批次的最终储存缓冲液**（不能拿纯水调零！）。\n- **【鲎试剂法（LAL）测定细菌内毒素】**：大肠杆菌外膜脱落的脂多糖（LPS，即内毒素，耐高温高压）；对于细胞功能实验、动物免疫或高敏发光体系，需通过阴离子交换（Q 柱）或 Triton X-114 相分离控制在合格线（如 $<10\\text{ EU/mg}$）以内。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **浓度不准引发的“假失活”防错**：当发现两批 Ro52 按同样“标称 $1\\ \\mu\\text{g/mL}$”包被、信号却差一倍时，**第一步不是怀疑蛋白失活，而是先查定量方法** —— 是不是上一批缓冲液里有 DTT 导致 BCA 测虚高了？或者含核酸导致 $A_{280}$ 虚高了？必须在 SDS-PAGE 上把两批蛋白按“各自标称的 $2\\ \\mu\\text{g}$”并排跑一胶，看条带深浅到底一不一样！",
    "cases": [
      {
        "title": "Ro52 精准定量 SOP：消光系数换算与 BCA 空白基质扣除",
        "tag": "实战案例",
        "body": "## **1. Ro52 理论紫外消光系数基准（可直接写入 LabOS 生物计算器）**\n- **全长 Ro52 (1–475 aa，MW 54.2 kDa)**：含 7 个色氨酸（Trp）、12 个酪氨酸（Tyr），理论消光系数 $\\varepsilon_{0.1\\%} (1\\text{ mg/mL}, 1\\text{ cm}) \\approx \\mathbf{1.04}$ —— 即无核酸污染（$A_{260}/A_{280} \\approx 0.58$）时，实测 $A_{280} = 1.04$ 对应真实浓度为 **$1.00\\text{ mg/mL}$**。\n- **截短体 Ro52 (125–268 aa，MW 16.8 kDa)**：色氨酸较少（$\\varepsilon_{0.1\\%}$ 偏低），**必须以 BCA 法（以同配方含 $0.5\\text{ mM TCEP}$ 缓冲液作 Blank 调零）为准，并辅以 SDS-PAGE 与参比批条带灰度互校**！"
      }

    "title": "功能活性与血清学验证",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：跨越“理化合格”到“临床可用”的鸿沟，通过 **体外生化/酶活或构象探针验证**、**ELISA/SPR/BLI结合动力学分析** 以及 **临床阴阳性参考血清盘（Reference Serum Panel）** 实测，全方位证明所制备的抗原在客户的真实固相载体（酶标板/磁珠/胶乳）上具备高灵敏度与高特异性。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【用途验证（Fitness-for-Purpose）】**：理化纯度只证明“它是干净的蛋白”，用途验证才证明“它在客户的试剂盒里真能准确抓出病人的抗体，且不抓健康人的抗体”。\n- **【ELISA/SPR/BLI结合动力学分析】**：用已知识别特定构象表位的标准单克隆抗体或阳性参考品，测试抗原的包被效价（半数有效浓度 $\\text{EC}_{50}$）和亲和力常数（$K_D$）。\n- **【临床阴阳性参考血清盘（Reference Serum Panel）】**：由已确诊的临床阳性血清（必须包含 **强阳、中阳、弱阳/临界值样本**）和阴性血清（必须包含 **健康人血清 + 高 IgG/高 RF/其他自免疾病的易干扰阴性血清**）组成的标准考卷。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **功能验证两条防弊铁律**：① **严禁只拿几份强阳性血清测一下发光值高就宣布通过**（强阳性随便什么粗糙片段都能测出来，只有 **弱阳性/临界样本** 和 **高干扰阴性样本** 才能试出真功夫）；② **定阈值（Cutoff）的开发样本集与最终验证性能的独立样本集必须分开**！",
    "cases": [
      {
        "title": "Ro52 血清学功能验证的“三阶考卷（强弱阳 + 疾病干扰阴 + 机制对照）”",
        "tag": "实战案例",
        "body": "## **1. Ro52 专属临床血清考卷构成（共 50 份标准盘）**\n1. **阳性考卷（20 份）**：含 8 份 SLE/SS 强阳性、7 份中阳性、**5 份接近 Cutoff 的弱阳性血清**（专门检验 p200 构象表位是否完好，防漏检）。\n2. **常规健康阴性考卷（20 份）**：正常体检健康人血清（要求平均 $\\text{OD}_{450} < 0.08$，单份最高 $< 0.18$）。\n3. **挑战性干扰阴性考卷（10 份）**：抗 Ro52 阴性但 **总 IgG 极高、类风湿因子（RF）阳性或抗 Ro60 单阳性** 的患者血清（专门检验全长 Ro52 的 C 端 PRY/SPRY 域有没有发生非特异 Fc 吸附，以及 MBP 标签有没有除干净！）。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"

  "learn.4.1.0": {
    "key": "learn.4.1.0",
    "path": "基础知识学习 / 质量控制QC与活性评估 / 功能活性与血清学验证 / 体外酶活测定: 泛素化或酶催化活性验证",
    "title": "体外酶活测定: 泛素化或酶催化活性验证",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：当靶蛋白本身具有天然酶催化活性（如 Ro52/TRIM21 的 **E3泛素连接酶自泛素化活性**）或天然配体结合功能时，可通过 **体外生化功能测定** 作为验证其三级/四级空间构象是否正确折叠的辅助金标准；但必须明确 **生化酶活与临床抗原表位识别的边界**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【E3泛素连接酶自泛素化活性】**：全长 Ro52 在人体内的本职工作是 E3 泛素连接酶（靠 N 端 RING 锌指域抓取 E2 酶如 UbcH5，把泛素 Ubiquitin 挂到自己或靶标上）。如果体外加入 E1、E2、泛素和 ATP 后，Ro52 能给自己挂上一串泛素链（条带往大分子量移动），就 100% 铁证它的 **N 端 RING 锌指域和二聚体折叠是完全鲜活的**！\n- **【体外生化功能测定】**：在试管里测试蛋白天生的催化或配体结合本领（主要用于科研级试剂或全长天然构象确认）。\n- **【生化酶活与临床抗原表位识别的边界】**：对于 IVD 诊断抗原而言，**我们需要的是“能被患者自身抗体特异识别”，而不是一定要它去催化酶促反应**！比如 `Ro52(125–268)` 截短体 deliberately 切掉了 N 端 RING 催化域（所以它完全没有泛素连接酶活性），但它的 Coiled-Coil 抗原表位依然完整，作为 IVD 诊断抗原照样极其优秀！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者认知抓手**：审阅 QC 方案时要分清产品用途 —— 如果卖给科研客户做泛素化研究，必须测全长 Ro52 的 E3 酶活；如果是做 **IVD 自身抗体检测试剂盒原料**，放行核心指标是 **抗 Ro52 阳性/阴性血清识别信噪比与构象单抗结合力**，不把体外泛素化酶活作为截短体抗原的放行门槛！",
    "cases": [
      {
        "title": "Ro52 全长 E3 泛素化活性验证 vs. IVD 抗原表位活性验证的区别",
        "tag": "实战案例",
        "body": "## **1. 两种“活性”的应用场景区分**\n- **场景 A（确认全长 Ro52 N 端 RING 锌指是否折叠正确）**：在体外反应体系（E1 + UbcH5a E2 + Ubiquitin + $\\text{Mg}^{2+}$-ATP）中孵育 1 h，Western Blot 可见全长 Ro52 形成梯状多聚泛素化条带 —— 证明上游补加 $50\\ \\mu\\text{M ZnCl}_2$ 成功保全了 RING 域活性（参考 Dundee `DU22292` 质控理念）。\n- **场景 B（IVD 试剂盒原料放行）**：直接采用 **抗 Ro52 构象依赖型标准单抗（如针对 p200 螺旋表位的质控单抗）+ 临床参考血清盘** 进行固相包被测试，直击临床诊断终点。"
      }

    "cases": [
      {

        "tag": "实战案例",
        "body": "## **1. 两种“活性”的应用场景区分**\n- **场景 A（确认全长 Ro52 N 端 RING 锌指是否折叠正确）**：在体外反应体系（E1 + UbcH5a E2 + Ubiquitin + $\\text{Mg}^{2+}$-ATP）中孵育 1 h，Western Blot 可见全长 Ro52 形成梯状多聚泛素化条带 —— 证明上游补加 $50\\ \\mu\\text{M ZnCl}_2$ 成功保全了 RING 域活性（参考 Dundee `DU22292` 质控理念）。\n- **场景 B（IVD 试剂盒原料放行）**：直接采用 **抗 Ro52 构象依赖型标准单抗（如针对 p200 螺旋表位的质控单抗）+ 临床参考血清盘** 进行固相包被测试，直击临床诊断终点。"

  "learn.4.1.1": {
    "key": "learn.4.1.1",
    "path": "基础知识学习 / 质量控制QC与活性评估 / 功能活性与血清学验证 / 结合特异性测定: ELISA或SPR/BLI分析",
    "title": "结合特异性测定: ELISA或SPR/BLI分析",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过 **棋盘滴定ELISA（Checkerboard Titration）** 或 **SPR/BLI表面等离子体共振/生物膜干涉技术**，定量测定抗原与标准抗体的 **半数有效浓度（$\\text{EC}_{50}$）**、**亲和力平衡解离常数（$K_D$）**，并设置完备的 **空白/标签/无关抗体系统对照**，锁定最佳包被浓度并排除非特异交叉反应。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【棋盘滴定ELISA（Checkerboard Titration）】**：在 96 孔板上，横排按不同浓度梯度包被抗原（如 $4.0, 2.0, 1.0, 0.5, 0.25\\ \\mu\\text{g/mL}$），竖列加不同稀释度的阳性血清和阴性血清，像下棋一样找出一个 **“阳性信号已经达到平台期、同时阴性本底最低、而且最省抗原用量”** 的黄金包被浓度。\n- **【半数有效浓度（$\\text{EC}_{50}$）与四参数拟合（4PL）】**：用固定浓度的标准阳性抗体去测梯度稀释的抗原，达到最大发光/吸光信号一半时所需的浓度叫 $\\text{EC}_{50}$。**$\\text{EC}_{50}$ 数值越小，说明这批抗原的活性越高**（用更少的量就能产生同样的信号）；不同批次间的 $\\text{EC}_{50}$ 偏差必须控制在 $\\pm 15\\%\\text{–}20\\%$ 以内！\n- **【SPR/BLI表面等离子体共振/生物膜干涉技术】**：免标记的实时光学传感器（如 Biacore 或 Octet），能实时画出抗体“抓上去有多快（结合速率 $k_{on}$）”和“掉下来有多慢（解离速率 $k_{off}$）”，算出精确亲和力 $K_D = k_{off}/k_{on}$。\n- **【空白/标签/无关抗体系统对照】**：用来抓鬼的照妖镜 —— ① **无抗原孔**（看血清是不是直接粘在塑料板/磁珠上）；② **纯 MBP/His 标签对照孔**（看阳性信号是不是假装抓在残留标签上）；③ **非特异人 IgG 对照**（看全长 Ro52 的 PRY/SPRY 域有没有乱抓普通 IgG 的 Fc 段）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **包被优化防错必看**：**“阳性信号变高”不等于“性能变好”**！如果把包被浓度从 $1\\ \\mu\\text{g/mL}$ 提到 $5\\ \\mu\\text{g/mL}$，阳性 OD 从 1.8 升到 2.5，但阴性血清 OD 从 0.05 暴涨到 0.45，信噪比（P/N）反而腰斩了！审核时必须同时看 **「弱阳性检出限 + 阴性血清均值与标准差（Mean + 3SD） + 信噪比（P/N）」**！",
    "cases": [
      {
        "title": "Ro52 棋盘滴定与“PRY/SPRY 域结合 IgG Fc 干扰”的对照排查方案",
        "tag": "实战案例",
        "body": "## **1. 4PL 标准曲线批间活性放行（衔接 AIOS 4PL 生物计算引擎）**\n- 以公司内部冻存的 **Ro52 黄金参比批（Lot-Ref-01）** 为 100% 基准，每批新纯化的 Ro52 同板做 8 梯度倍比稀释，用 AIOS 四参数逻辑斯蒂（4PL）拟合计算相对效价（Relative Potency）：要求 **相对效价在 $85\\%\\text{–}115\\%$ 之间，$R^2 \\ge 0.99$**。\n\n---\n\n## **2. 全长 Ro52 的“IgG Fc 非特异结合”专项排查对照**\n- **文献机制隐患**：2007 年 *PNAS*（PMID `17400754`）解析了 TRIM21(Ro52) C 端 PRY/SPRY 域与人 IgG Fc 的高亲和复合物结构。\n- **本体系实测排查法**：在包被全长 Ro52 与 `125–268` 截短体的孔中，分别加入 **$10\\ \\mu\\text{g/mL}$ 经确认抗 Ro52 阴性的纯化人正常多克隆 IgG（及去 Fc 的 $\\text{F(ab')}_2$ 对照）**：\n  - 若全长 Ro52 在碳酸盐缓冲液（pH 9.6）疏水吸附包被时，PRY/SPRY 域贴壁朝向固相而被封闭剂（BSA/酪蛋白）掩蔽，实测阴性 IgG 背景 $<0.08$，则证明在该直接包被格式下 Fc 结合已被有效抑制；\n  - 若在液相捕获或生物素-SA 悬空呈现格式下全长 Ro52 出现明显 Fc 本底，则立即切换为已切除 PRY/SPRY 域的 **`Ro52(125–268)` 截短体** 或在稀释液中加入 Fc 阻断剂！"
      }

    "path": "基础知识学习 / 质量控制QC与活性评估 / 功能活性与血清学验证 / 结合特异性测定: ELISA或SPR/BLI分析",
    "title": "结合特异性测定: ELISA或SPR/BLI分析",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过 **棋盘滴定ELISA（Checkerboard Titration）** 或 **SPR/BLI表面等离子体共振/生物膜干涉技术**，定量测定抗原与标准抗体的 **半数有效浓度（$\\text{EC}_{50}$）**、**亲和力平衡解离常数（$K_D$）**，并设置完备的 **空白/标签/无关抗体系统对照**，锁定最佳包被浓度并排除非特异交叉反应。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【棋盘滴定ELISA（Checkerboard Titration）】**：在 96 孔板上，横排按不同浓度梯度包被抗原（如 $4.0, 2.0, 1.0, 0.5, 0.25\\ \\mu\\text{g/mL}$），竖列加不同稀释度的阳性血清和阴性血清，像下棋一样找出一个 **“阳性信号已经达到平台期、同时阴性本底最低、而且最省抗原用量”** 的黄金包被浓度。\n- **【半数有效浓度（$\\text{EC}_{50}$）与四参数拟合（4PL）】**：用固定浓度的标准阳性抗体去测梯度稀释的抗原，达到最大发光/吸光信号一半时所需的浓度叫 $\\text{EC}_{50}$。**$\\text{EC}_{50}$ 数值越小，说明这批抗原的活性越高**（用更少的量就能产生同样的信号）；不同批次间的 $\\text{EC}_{50}$ 偏差必须控制在 $\\pm 15\\%\\text{–}20\\%$ 以内！\n- **【SPR/BLI表面等离子体共振/生物膜干涉技术】**：免标记的实时光学传感器（如 Biacore 或 Octet），能实时画出抗体“抓上去有多快（结合速率 $k_{on}$）”和“掉下来有多慢（解离速率 $k_{off}$）”，算出精确亲和力 $K_D = k_{off}/k_{on}$。\n- **【空白/标签/无关抗体系统对照】**：用来抓鬼的照妖镜 —— ① **无抗原孔**（看血清是不是直接粘在塑料板/磁珠上）；② **纯 MBP/His 标签对照孔**（看阳性信号是不是假装抓在残留标签上）；③ **非特异人 IgG 对照**（看全长 Ro52 的 PRY/SPRY 域有没有乱抓普通 IgG 的 Fc 段）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **包被优化防错必看**：**“阳性信号变高”不等于“性能变好”**！如果把包被浓度从 $1\\ \\mu\\text{g/mL}$ 提到 $5\\ \\mu\\text{g/mL}$，阳性 OD 从 1.8 升到 2.5，但阴性血清 OD 从 0.05 暴涨到 0.45，信噪比（P/N）反而腰斩了！审核时必须同时看 **「弱阳性检出限 + 阴性血清均值与标准差（Mean + 3SD） + 信噪比（P/N）」**！",
    "cases": [
      {
        "title": "Ro52 棋盘滴定与“PRY/SPRY 域结合 IgG Fc 干扰”的对照排查方案",
        "tag": "实战案例",
        "body": "## **1. 4PL 标准曲线批间活性放行（衔接 AIOS 4PL 生物计算引擎）**\n- 以公司内部冻存的 **Ro52 黄金参比批（Lot-Ref-01）** 为 100% 基准，每批新纯化的 Ro52 同板做 8 梯度倍比稀释，用 AIOS 四参数逻辑斯蒂（4PL）拟合计算相对效价（Relative Potency）：要求 **相对效价在 $85\\%\\text{–}115\\%$ 之间，$R^2 \\ge 0.99$**。\n\n---\n\n## **2. 全长 Ro52 的“IgG Fc 非特异结合”专项排查对照**\n- **文献机制隐患**：2007 年 *PNAS*（PMID `17400754`）解析了 TRIM21(Ro52) C 端 PRY/SPRY 域与人 IgG Fc 的高亲和复合物结构。\n- **本体系实测排查法**：在包被全长 Ro52 与 `125–268` 截短体的孔中，分别加入 **$10\\ \\mu\\text{g/mL}$ 经确认抗 Ro52 阴性的纯化人正常多克隆 IgG（及去 Fc 的 $\\text{F(ab')}_2$ 对照）**：\n  - 若全长 Ro52 在碳酸盐缓冲液（pH 9.6）疏水吸附包被时，PRY/SPRY 域贴壁朝向固相而被封闭剂（BSA/酪蛋白）掩蔽，实测阴性 IgG 背景 $<0.08$，则证明在该直接包被格式下 Fc 结合已被有效抑制；\n  - 若在液相捕获或生物素-SA 悬空呈现格式下全长 Ro52 出现明显 Fc 本底，则立即切换为已切除 PRY/SPRY 域的 **`Ro52(125–268)` 截短体** 或在稀释液中加入 Fc 阻断剂！"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },

    "path": "基础知识学习 / 质量控制QC与活性评估 / 功能活性与血清学验证 / 临床血清学评估: 阳性与阴性参考血清测试",
    "title": "临床血清学评估: 阳性与阴性参考血清测试",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：建立分级受控的 **临床参考血清盘（开发盘 Development Panel vs. 独立验证盘 Validation Panel）**，严格区分 **抗体阳性状态参照（与已上市标杆试剂盒如 Euroimmun/Phadia 对比）** 与临床疾病诊断，确保新原料在 **临界弱阳性样本（Borderline Samples）** 和 **跨病种干扰样本** 上具备高度一致的阴阳判别力与批间重复性。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【开发盘（Development Panel）vs. 独立验证盘（Validation Panel）】**：\n  - **开发盘（平时练习卷）**：研发阶段用来调包被浓度、选封闭液、定 Cutoff 阈值的 20–30 份血清；\n  - **独立验证盘（高考正式卷）**：定型放行时拿出来的另一批从未参与调参的 50–100 份盲样血清。**如果拿同一批样本既用来挑选最有利的阈值、又用来报告“符合率 100%”，这叫数据自证（过拟合），一上客户端评测就会翻车**！\n- **【临界弱阳性样本（Borderline Samples）】**：信号值刚好在阳性判定线（Cutoff Index, $\\text{COI} = 1.0\\text{–}2.5$）附近的弱阳性患者血清；这是检验不同批次抗原表位活性有没有微小滑坡的最灵敏放大镜。\n- **【抗体阳性状态参照（与标杆试剂盒头对头比对）】**：抗 Ro52 抗体可见于干燥综合征（SS）、系统性红斑狼疮（SLE）、系统性硬化症（SSc）和肌炎等多种疾病；因此 IVD 原料验证的直接对标物是 **“经国际公认标杆试剂盒（如欧蒙 Euroimmun、亚辉龙等客户参比平台）确认的抗 Ro52 抗体阴阳性血清”**。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **客户端送样前必查（防诺唯赞 dsDNA 81% 符合率教训重演，见全景 §5.1）**：任何新抗原或改工艺批次在发给客户（亚辉龙、浩欧博、诺唯赞等）评测前，**必须在内部用至少 30–50 例经过客户同平台（或标杆化学发光/ELISA）标定过的阴阳性血清盘完成内部盲测**，内部符合率未达 $\\ge 95\\%$ 严禁盲目外寄样品！",
    "cases": [
      {
        "title": "Ro52 临床血清学内部定型验证与送样前防错规范",
        "tag": "实战案例",
        "body": "## **1. 内部教训引用（来自公司全景知识库 §5.1）**\n- **历史教训**：此前 dsDNA 某批次外送诺唯赞评测时，客户端实测符合率仅 81%，且反馈仅停留在微信聊天中未进台账闭环 —— 根因在于内部放行时仅测了理化指标或少量强阳对照，缺乏覆盖弱阳性与干扰阴性的标定血清盘盲测。\n\n---\n\n## **2. Ro52 定型与外送样前强制血清盘标准**\n1. **参比锚定**：所有入库参考血清均须标明第三方标杆平台（如欧蒙免疫印迹/ELISA 或头部发光平台）的定值结果。\n2. **放行硬指标**：\n   - 阳性符合率（20 例，含 $\\ge 5$ 例弱阳）：**$\\ge 95\\%$（即至少 $19/20$ 检出）**；\n   - 阴性符合率（30 例，含 10 例高 IgG/RF/抗核抗体其他靶点阳性干扰血清）：**$\\ge 96.7\\%$（至少 $29/30$ 阴性）**；\n   - 临界样本批内与批间重复性 CV：**$\\le 10\\%$**。"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },

    "key": "learn.4.2",
    "path": "基础知识学习 / 质量控制QC与活性评估 / 批次稳定性测试",
    "title": "批次稳定性测试",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过系统的 **反复冻融耐受测试（Freeze-Thaw Stability）**、**4°C冷藏开瓶使用稳定性（In-Use Stability）**、**37°C加速热稳定性** 以及 **长期实时稳定性追踪（Real-Time Stability）**，为产品效期声明（如 24 个月）和冷链运输条件提供真实、合法的实验数据支撑。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【反复冻融耐受测试（Freeze-Thaw Stability）】**：把分装好的抗原从 $-80^\\circ\\text{C}$（或 $-20^\\circ\\text{C}$）拿出来在室温/冰浴完全融化，再放回去冻透，算 1 次冻融；连续做 **1 次、3 次、5 次冻融** 后，跟 0 次冻融的原始样同时测外观、SEC-HPLC 聚体和 ELISA 活性（因为冰晶结冰膨胀时像刀子一样会把蛋白挤压到冰晶缝隙里切碎或压聚沉）。\n- **【4°C冷藏开瓶使用稳定性（In-Use Stability）】**：客户把抗原化冻放进 $2\\text{–}8^\\circ\\text{C}$ 冰箱后，第 1 天、第 3 天、第 7 天、第 14 天拿出来包被，活性掉了多少？这决定了说明书上写“化冻后 4°C 可存放几天”。\n- **【37°C加速热稳定性 vs. 长期实时稳定性追踪（Real-Time Stability）】**：\n  - **37°C 加速稳定性**（把蛋白放 37°C 温箱烤 3 天、7 天、14 天）：用于研发期快速筛选哪个保护剂配方最耐造、预测稳定性趋势；\n  - **长期实时稳定性**：把至少 3 批正式成品真的放在 $-20^\\circ\\text{C} / -80^\\circ\\text{C}$ 冰箱里，在第 0、1、3、6、9、12、18、24、36 个月按时取出来实测！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **稳定性数据真实性最高红线（对应风险清单 R1、R7）**：① **绝对禁止“批生产日期刚过 1 个月，报告里就写出了 6 个月长期稳定性合格结论”的时空穿越造假**！② 客户（如亚辉龙要求到货剩余效期 $\\ge 24$ 个月）所需的长效期，必须有对应的实时稳定性台账或加速外推方案+持续实时补测承诺支撑！",
    "cases": [
      {
        "title": "Ro52 稳定性测试矩阵与“理化+弱阳功能”双指标判读法",
        "tag": "实战案例",
        "body": "## **1. Ro52 四维稳定性考核方案**\n| 测试类型 | 存放条件 | 取样时间点 | 必检项目（与 T0 基线同板配对比较） | 合格判据 |\n|---|---|---|---|---|\n| **反复冻融耐受** | $-80^\\circ\\text{C} \\leftrightarrow 25^\\circ\\text{C}$ | 0、1、3、5 次 | 外观、SEC-HPLC 聚体、弱阳血清 ELISA | 5 次冻融后二聚体峰下降 $\\le 5\\%$，活性变化 $\\le 10\\%$ |\n| **4°C 开瓶稳定性** | $2\\text{–}8^\\circ\\text{C}$ | 0、3、7、14 天 | 外观、SDS-PAGE（看降解）、ELISA 效价 | 7 天内无降解带、效价保持率 $85\\%\\text{–}115\\%$ |\n| **37°C 加速破坏** | $37^\\circ\\text{C} \\pm 1^\\circ\\text{C}$ | 0、3、7 天 | SEC-HPLC、4PL $\\text{EC}_{50}$、弱阳血清 OD | 7 天后活性保持率 $\\ge 80\\%$（配方筛选核心指标） |\n| **长期实时稳定性** | $-80^\\circ\\text{C}$ 及 $-20^\\circ\\text{C}$ | 0、1、3、6、12、18、24、36 月 | 全项 CoA 指标 | 全周期内各项指标符合放行标准 |"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },
  "learn::基础知识学习/质量控制QC与活性评估/批次稳定性测试": {

    "path": "基础知识学习 / 质量控制QC与活性评估 / 批次稳定性测试",
    "title": "批次稳定性测试",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过系统的 **反复冻融耐受测试（Freeze-Thaw Stability）**、**4°C冷藏开瓶使用稳定性（In-Use Stability）**、**37°C加速热稳定性** 以及 **长期实时稳定性追踪（Real-Time Stability）**，为产品效期声明（如 24 个月）和冷链运输条件提供真实、合法的实验数据支撑。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【反复冻融耐受测试（Freeze-Thaw Stability）】**：把分装好的抗原从 $-80^\\circ\\text{C}$（或 $-20^\\circ\\text{C}$）拿出来在室温/冰浴完全融化，再放回去冻透，算 1 次冻融；连续做 **1 次、3 次、5 次冻融** 后，跟 0 次冻融的原始样同时测外观、SEC-HPLC 聚体和 ELISA 活性（因为冰晶结冰膨胀时像刀子一样会把蛋白挤压到冰晶缝隙里切碎或压聚沉）。\n- **【4°C冷藏开瓶使用稳定性（In-Use Stability）】**：客户把抗原化冻放进 $2\\text{–}8^\\circ\\text{C}$ 冰箱后，第 1 天、第 3 天、第 7 天、第 14 天拿出来包被，活性掉了多少？这决定了说明书上写“化冻后 4°C 可存放几天”。\n- **【37°C加速热稳定性 vs. 长期实时稳定性追踪（Real-Time Stability）】**：\n  - **37°C 加速稳定性**（把蛋白放 37°C 温箱烤 3 天、7 天、14 天）：用于研发期快速筛选哪个保护剂配方最耐造、预测稳定性趋势；\n  - **长期实时稳定性**：把至少 3 批正式成品真的放在 $-20^\\circ\\text{C} / -80^\\circ\\text{C}$ 冰箱里，在第 0、1、3、6、9、12、18、24、36 个月按时取出来实测！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **稳定性数据真实性最高红线（对应风险清单 R1、R7）**：① **绝对禁止“批生产日期刚过 1 个月，报告里就写出了 6 个月长期稳定性合格结论”的时空穿越造假**！② 客户（如亚辉龙要求到货剩余效期 $\\ge 24$ 个月）所需的长效期，必须有对应的实时稳定性台账或加速外推方案+持续实时补测承诺支撑！",
    "cases": [
      {
        "title": "Ro52 稳定性测试矩阵与“理化+弱阳功能”双指标判读法",
        "tag": "实战案例",
        "body": "## **1. Ro52 四维稳定性考核方案**\n| 测试类型 | 存放条件 | 取样时间点 | 必检项目（与 T0 基线同板配对比较） | 合格判据 |\n|---|---|---|---|---|\n| **反复冻融耐受** | $-80^\\circ\\text{C} \\leftrightarrow 25^\\circ\\text{C}$ | 0、1、3、5 次 | 外观、SEC-HPLC 聚体、弱阳血清 ELISA | 5 次冻融后二聚体峰下降 $\\le 5\\%$，活性变化 $\\le 10\\%$ |\n| **4°C 开瓶稳定性** | $2\\text{–}8^\\circ\\text{C}$ | 0、3、7、14 天 | 外观、SDS-PAGE（看降解）、ELISA 效价 | 7 天内无降解带、效价保持率 $85\\%\\text{–}115\\%$ |\n| **37°C 加速破坏** | $37^\\circ\\text{C} \\pm 1^\\circ\\text{C}$ | 0、3、7 天 | SEC-HPLC、4PL $\\text{EC}_{50}$、弱阳血清 OD | 7 天后活性保持率 $\\ge 80\\%$（配方筛选核心指标） |\n| **长期实时稳定性** | $-80^\\circ\\text{C}$ 及 $-20^\\circ\\text{C}$ | 0、1、3、6、12、18、24、36 月 | 全项 CoA 指标 | 全周期内各项指标符合放行标准 |"
      }

    "path": "基础知识学习 / 质量控制QC与活性评估 / 批次稳定性测试 / 4°C冷藏与反复冻融耐受评估",
    "title": "4°C冷藏与反复冻融耐受评估",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：针对蛋白在冷冻结冰过程中的 **冰晶界面剪切变性** 与 **缓冲盐共晶pH漂移（Cryo-concentration & pH Shift）**，通过优化 **防冻保护剂（甘油/海藻糖/蔗糖）** 并控制降温/融化速率，确保 Ro52 能够耐受至少 5 次反复冻融及 4°C 短期冷藏周转。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【冰晶界面剪切变性】**：纯水结冰时，水分子先排成锋利的冰晶格，把蛋白质和盐全都挤到还没结冰的微小缝隙里（局部盐浓度瞬间飙升 10 倍，且冰晶表面张力把蛋白三维结构撕裂），化冻后就变成一管白色沉淀。\n- **【缓冲盐共晶pH漂移】**：**普通磷酸钠缓冲液（Na2HPO4/NaH2PO4）在冷冻结冰时，$\\text{Na}_2\\text{HPO}_4$ 会先结晶析出，导致管内剩余液体的 pH 从 7.4 暴跌到 pH 3.8–4.5**！很多像 Ro52 这样怕酸的蛋白，一冻进 $-20^\\circ\\text{C}$ 实际上是被冷冻过程中的“磷酸盐局部强酸”给酸变性弄死的！（改用 **Tris**、**HEPES** 或含钾的 **K-PBS** 加上甘油/海藻糖就能避免 pH 暴跌）。\n- **【防冻保护剂（甘油/海藻糖/蔗糖）】**：\n  - **甘油（Glycerol，$10\\%\\text{–}50\\%$）**：降低冰点、减少冰晶体积，是液体抗原最经典的防冻护甲；\n  - **海藻糖/蔗糖（Trehalose/Sucrose，$5\\%\\text{–}10\\%$）**：如果不希望溶液太粘稠、或者将来要做冻干粉（Lyophilization），海藻糖能在蛋白表面形成一层“玻璃态水化保护壳”，防冻融和耐热效果极佳。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **冻融测试防错必查**：做冻融稳定性实验时，**严禁只看 SDS-PAGE 胶图没变就宣布“耐冻融合格”**！因为冻融只会把蛋白压成非共价死聚集体、不会把肽链切断，所以跑还原 SDS-PAGE 永远看不出变化！冻融前后 **必须测「离心后上清蛋白浓度（看有没有沉淀损失） + SEC-HPLC 聚体比例 + 弱阳性血清 ELISA 信号」**！",
    "cases": [
      {
        "title": "Ro52 克服“普通 PBS 冻融沉淀”的防冻配方优化案例",
        "tag": "实战案例",
        "body": "## **1. 踩坑现象复盘**\n- 将纯化好的全长 Ro52（$1.2\\text{ mg/mL}$）保存在不含甘油的普通钠盐 PBS（pH 7.4, $150\\text{ mM NaCl}$）中，放入 $-20^\\circ\\text{C}$ 冻存 1 次化冻后，溶液出现微弱乳光，高速离心后上清浓度跌至 $0.75\\text{ mg/mL}$，弱阳性血清信号下降 35%（因钠盐 PBS 冷冻时 pH 骤降跨越了 Ro52 的 pI 6.35）。\n\n---\n\n## **2. 受控防冻配方（经 5 次冻融实测验证）**\n- **优化配方**：$25\\text{ mM HEPES 或 K-PB (pH 7.5)} + 300\\text{ mM NaCl} + 0.5\\text{ mM TCEP} + \\mathbf{15\\%\\text{ Glycerol} + 5\\%\\text{ Trehalose（海藻糖）}}$。\n- **实测效果**：经 $-80^\\circ\\text{C} \\leftrightarrow 25^\\circ\\text{C}$ 连续 **5 次反复冻融** 及 $4^\\circ\\text{C}$ 放置 **14 天** 后，溶液清亮无沉淀，SEC-HPLC 二聚体主峰保持 $>90\\%$，弱阳性血清 OD 偏差 $<5\\%$。"
      }

    "path": "基础知识学习 / 质量控制QC与活性评估 / 批次稳定性测试 / 长期保存条件与降解监测",
    "title": "长期保存条件与降解监测",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：建立规范的 **长期实时稳定性台账（Real-Time Stability Ledger）**，通过至少 **3个独立生产批次** 在规定储存温度下的定期取样监测（涵盖 **肽链降解监测**、**聚体增长趋势** 与 **效价衰减曲线**），科学锁定产品的真实有效期（Shelf Life）与运输温控要求。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【长期实时稳定性台账（Real-Time Stability Ledger）】**：在 LabOS 中为每一批参加稳定性考核的留样建立定时提醒日程表（T0、1M、3M、6M、12M、18M、24M、36M），到点由系统提示 QC 取出留样管实测并上传原始记录，**到期日绝不能早于生产日 + 考核月数**。\n- **【3个独立生产批次】**：稳定性结论和工艺定型一样，不能只看 1 批“幸运批”，必须用 3 个不同时间独立投料生产的批次同时考核，确认批与批之间的衰老速度一致。\n- **【肽链降解监测与聚体增长趋势】**：长期存放中蛋白常见的两种死法 —— ① 被极微量残留蛋白酶慢慢啃断（在 SDS-PAGE 上主带下面长出小分子尾巴）；② 还原剂耗尽后慢慢氧化聚集成大团（在 SEC-HPLC 上死体积峰越来越高，弱阳性血清信号逐渐跌破合格线）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **效期与发货合规红线（对应风险清单 R1、R7 与工序 ⑪）**：① **绝不允许任何报告出现“测试日期 - 生产日期 < 声称考核月数”的时间逻辑错误**；② 客户协议有特殊效期要求的（如亚辉龙要求到货剩余效期 $\\ge 24$ 个月），在接单和 G4 发货前必须核对批次生产日期与实时稳定性支撑数据！",
    "cases": [
      {
        "title": "Ro52 长期稳定性留样计划与 24 个月效期支撑路线图",
        "tag": "实战案例",
        "body": "## **1. 新产品如何合法合规应对客户的“24 个月长效期”要求？**\n- **现实矛盾**：新研发定型的 Ro52 刚刚生产出来 1 个月，不可能立刻拥有 24 个月的实时存放数据；但绝不能因此伪造“6 个月/24 个月长期稳定性报告”（风险清单 R1 致命红线）！\n\n---\n\n## **2. 国际通行合规做法（加速外推 + 滚动实时稳定性承诺）**\n1. **初期（0–3 个月）**：凭 **3 批 $37^\\circ\\text{C}$ 加速稳定性（7–14 天）+ $-20^\\circ\\text{C}/-80^\\circ\\text{C}$ 已完成的 1–3 个月实时数据 + 阿伦尼乌斯（Arrhenius）热力学外推评估**，在技术文件中明确标注“**暂定效期（Provisional Shelf Life）12–24 个月（由 37°C 加速数据外推，实时稳定性持续进行中）**”。\n2. **持续滚动更新**：在 LabOS 稳定性台账中锁定 3 批留样，每满 3、6、12、18、24、36 个月实测一次并追加进《稳定性验证报告》（`RD-FM-006`），用真实时间换取正式效期。"
      }

        "title": "Ro52 长期稳定性留样计划与 24 个月效期支撑路线图",
        "tag": "实战案例",
        "body": "## **1. 新产品如何合法合规应对客户的“24 个月长效期”要求？**\n- **现实矛盾**：新研发定型的 Ro52 刚刚生产出来 1 个月，不可能立刻拥有 24 个月的实时存放数据；但绝不能因此伪造“6 个月/24 个月长期稳定性报告”（风险清单 R1 致命红线）！\n\n---\n\n## **2. 国际通行合规做法（加速外推 + 滚动实时稳定性承诺）**\n1. **初期（0–3 个月）**：凭 **3 批 $37^\\circ\\text{C}$ 加速稳定性（7–14 天）+ $-20^\\circ\\text{C}/-80^\\circ\\text{C}$ 已完成的 1–3 个月实时数据 + 阿伦尼乌斯（Arrhenius）热力学外推评估**，在技术文件中明确标注“**暂定效期（Provisional Shelf Life）12–24 个月（由 37°C 加速数据外推，实时稳定性持续进行中）**”。\n2. **持续滚动更新**：在 LabOS 稳定性台账中锁定 3 批留样，每满 3、6、12、18、24、36 个月实测一次并追加进《稳定性验证报告》（`RD-FM-006`），用真实时间换取正式效期。"
      }
    ],

  },
  "learn.4.3": {
    "key": "learn.4.3",
    "path": "基础知识学习 / 质量控制QC与活性评估 / Gate｜⑦ 质量与用途验证",
    "title": "Gate｜⑦ 质量与用途验证",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R7（质量与用途验证关口，衔接 R8 工艺锁定、R9 定型放行与生产 G3 成品放行）** 是决定一批或一款诊断原料能否贴上合格标签交付客户的终极关口，必须严格执行 **检验人与放行人职责分离**、**原始数据附件100%挂钩** 以及 **規格/方法/工艺三版本冻结**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【检验人与放行人职责分离】**：做实验测数据的 QC 检验员、复核数据的复核人、以及最终签字批准放行的管理者代表（胡冯博），**绝对不能是同一个人自己测、自己审、自己放行**（对应风险清单 R6 重点整改项）。\n- **【原始数据附件100%挂钩】**：CoA 报告和《验证报告》（`RD-FM-006`）上写的每一个数字，在 LabOS 里都必须挂着对应的原始仪器导出文件（电泳原图、SEC-HPLC 色谱积分 PDF、酶标仪原始 Excel 读数表）；没有原始附件的数字一律标为“待核”，不准出厂。\n- **【规格/方法/工艺三版本冻结】**：定型放行（Gate R9）时，产品合格标准（考什么）、检验 SOP（怎么考）、生产工艺规程（怎么做）三个文件的版本号必须一一对应锁死；之后改任何一个参数，都必须走 ⑫ 变更控制流程。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管代放行签字前终极五查**：① 四人签名链（执行人 $\\neq$ 复核人，检验人 $\\neq$ 放行人）合规吗？② 计量设备（酶标仪、天平、pH 计、移液器）在校准有效期内吗？③ 原始图谱附件齐全且数值与 CoA 逐格一致（非跨批复制）吗？④ 弱阳性与干扰阴性血清盘达标吗？⑤ 生产与检验日期逻辑严密自洽吗？",
    "cases": [
      {
        "title": "Ro52 项目 Gate R7–R9 定型与首批发运放行审核清单",
        "tag": "Gate 评审案例",
        "body": "## **1. Gate R7 / G3 放行四件套核验总表（Ro52 定型批）**\n| 维度 | 核验内容 | 责任人与记录 |\n|---|---|---|\n| **检查方法** | 逐项核对 3 批连续中试批的批记录、SDS-PAGE 原图、SEC-HPLC 报告、BCA 原始表、50 例参考血清盘 ELISA 原始读数表及 37°C/冻融稳定性数据 | QC 检验 + 交叉复核 |\n| **通过依据** | 3 批纯度均 $\\ge 90\\%$、SEC 二聚体主峰 $\\ge 85\\%$、批间 4PL $\\text{EC}_{50}$ CV $\\le 10\\%$、临床血清盘阳符合率 $\\ge 95\\%$ / 阴符合率 $\\ge 96.7\\%$；所有原始附件齐全 | 管代（胡冯博）审核 |\n| **未通过动作** | 任一指标超标或缺原始数据附件，系统状态锁为「冻结/不合格」，启动偏差调查（PM-SMP-006）或退回 ⑧ 优化，严禁把“入库”当“放行”发货 | 系统硬拦截 |\n| **交付物** | 经批准的《验证报告》（`RD-FM-006`）、《企业产品标准》（`RD-FM-012`）、《Datasheet》（`RD-FM-015`）、双签锁定的批次 `CoA` | 总经理批准转换（R9） |"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },

    "title": "2. 质量状态规则（⑩ 的核心）",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「2. 质量状态规则（⑩ 的核心）」梳理关键控制要求，重点涵盖 **待检**、**检验合格待审批**、**已批准转序** 等核心要素（来源：`LabOS字段与规则总表_草案V0.1_20261105.md`）。\n- 正常主线：待检 → 检验合格待审批 → 已批准转序（半成品）；待检 → 检验合格待审批 → 成品已放行（成品）。\n- 任何状态都可以进入“冻结”；解除冻结只能走“已处置”。\n- 只有“成品已放行”的批次可以出库（G4）；“入库”不改变状态，也不等于放行。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【待检】**：已到货或已产出，尚未检验；系统（入库/请检时自动）\n- **【检验合格待审批】**：QC 判定合格，等待审批；QC\n- **【已批准转序】**：半成品获准进入下一工序；管代（统一授权前的建议）\n- **【成品已放行】**：允许发货的唯一状态；管代\n- **【冻结】**：发现异常，暂停一切流转；发现人、QC、管代\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `LabOS字段与规则总表_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n7 种文字状态，来自《生产流转计划草案 V0.1》§7.2；状态不能只靠颜色。\n\n| 状态 | 含义 | 谁能改成此状态 |\n|---|---|---|\n| 待检 | 已到货或已产出，尚未检验 | 系统（入库/请检时自动） |\n| 检验合格待审批 | QC 判定合格，等待审批 | QC |\n| 已批准转序 | 半成品获准进入下一工序 | 管代（统一授权前的建议） |\n| 成品已放行 | 允许发货的唯一状态 | 管代 |\n| 冻结 | 发现异常，暂停一切流转 | 发现人、QC、管代 |\n| 不合格 | 检验不合格 | QC |\n| 已处置 | 偏差或不合格已处理完（继续/复检/返工/让步/降级/报废/退货） | 管代批准处置后 |\n\n**流转规则**\n- 正常主线：待检 → 检验合格待审批 → 已批准转序（半成品）；待检 → 检验合格待审批 → 成品已放行（成品）。\n- 任何状态都可以进入“冻结”；解除冻结只能走“已处置”。\n- 只有“成品已放行”的批次可以出库（G4）；“入库”不改变状态，也不等于放行。\n- 每次状态变化必须记录：依据、批准人、时间、范围，且不可删除。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「3. 角色与签核」梳理关键控制要求，重点涵盖 **执行**、**检验判定**、**复核** 等核心要素（来源：`LabOS字段与规则总表_草案V0.1_20261105.md`）。\n- 同一批次的“执行人、检验人、复核人、放行人”四个字段，系统要校验：复核人 ≠ 执行人；放行人 ≠ 检验人。\n- 小团队无人可复核时，系统提示“调整排程或启用已授权替岗”，不允许自行跳过。\n- 上述角色映射和岗位名称待管代、综合部确认；“岁鲁珊/岁鲁姗”等写法需统一。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【执行】**：项目部批次负责人（上游：程新秀；纯化与分装：岁鲁姗）；复核自己的关键操作\n- **【检验判定】**：经授权的 QC 兼岗人员；同一批既检验又复核又放行\n- **【复核】**：另一名有能力的人员；—\n- **【放行】**：管代（胡冯博）；以交期或经营决策代替检验\n- **【保管】**：综合部仓管（张含瑞）；判定检验合格；审批放行\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `LabOS字段与规则总表_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n公司只有综合部、项目部两个部门（AGENTS.md §5）；下表把职能落到岗位，并映射程序文件里的“生产部/质量部”等。\n\n| 职能 | 承担 | 不能做 |\n|---|---|---|\n| 执行 | 项目部批次负责人（上游：程新秀；纯化与分装：岁鲁姗） | 复核自己的关键操作 |\n| 检验判定 | 经授权的 QC 兼岗人员 | 同一批既检验又复核又放行 |\n| 复核 | 另一名有能力的人员 | — |\n| 放行 | 管代（胡冯博） | 以交期或经营决策代替检验 |\n| 保管 | 综合部仓管（张含瑞） | 判定检验合格；审批放行 |\n| 批准立项与重大事项 | 总经理（周伟） | — |\n\n**系统层面的硬规则**\n- 同一批次的“执行人、检验人、复核人、放行人”四个字段，系统要校验：复核人 ≠ 执行人；放行人 ≠ 检验人。\n- 小团队无人可复核时，系统提示“调整排程或启用已授权替岗”，不允许自行跳过。\n- 上述角色映射和岗位名称待管代、综合部确认；“岁鲁珊/岁鲁姗”等写法需统一。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「4. 缺口与优先级（建议）」梳理关键控制要求，重点涵盖 **P0**、**P0**、**P0** 等核心要素（来源：`LabOS字段与规则总表_草案V0.1_20261105.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【P0】**：质量状态 + G3 放行校验；放行是最后一道防线，状态不清晰会把没放行的货发出去；⑩\n- **【P0】**：检验人/复核人/放行人分离 + 原始数据附件；风险清单 R6：QC 与放行同一人；CoA 无批准人；⑦⑩\n- **【P0】**：父子批关联、物料平衡；批号重复、追溯不到来源（风险清单 R12）；⑩\n- **【P0】**：偏差登记与 R=S×P 分级；现有“变更与偏差”无分级，也没有与 CAPA 的联动；⑩⑫\n- **【P0】**：数据完整性系统规则、测试数据隔离；见 §5；风险清单 R1；全部\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `LabOS字段与规则总表_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n排序逻辑：先保证**“能放行、可追溯、数据可信”**，再补**“反馈与改进闭环”**，最后补**“研发前端”**。\n\n| 优先级 | 事项 | 原因 | 对应工序 |\n|---|---|---|---|\n| P0 | 质量状态 + G3 放行校验 | 放行是最后一道防线，状态不清晰会把没放行的货发出去 | ⑩ |\n| P0 | 检验人/复核人/放行人分离 + 原始数据附件 | 风险清单 R6：QC 与放行同一人；CoA 无批准人 | ⑦⑩ |\n| P0 | 父子批关联、物料平衡 | 批号重复、追溯不到来源（风险清单 R12） | ⑩ |\n| P0 | 偏差登记与 R=S×P 分级 | 现有“变更与偏差”无分级，也没有与 CAPA 的联动 | ⑩⑫ |\n| P0 | 数据完整性系统规则、测试数据隔离 | 见 §5；风险清单 R1 | 全部 |\n| P1 | 质量标准补齐（目前“质量标准”页签为 0）+ 方法/设备/参考品 | 没有标准就没有放行依据 | ⑦ |\n| P1 | 稳定性台账 + 效期校验 | 声明效期无数据支撑（风险清单 R7） | ⑧ |\n| P1 | 批次位置、浓度、总量补全 | 152 个中间品大多未登记位置和数量 | ③⑩ |\n| P1 | 客户反馈模块 | 客户反馈没有登记入口；客户审核结论未存档（风险清单 R8） | ⑪ |\n| P1 | CAPA/变更模块 | 与客户协议的变更通知义务直接相关；2027-03-11 前第一次监督审核 | ⑫ |\n| P2 | 立项书字段、设计输入（序列版本、分子形式） | 影响研发前端的可追溯性，但不阻断放行 | ①② |\n| P2 | 种子库、外购物料与供方、来料检验 | 补齐起点追溯 | ③ |\n| P2 | “修饰/偶联”工序类型 | 目前只影响少数产品 | ⑥ |",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「5. 数据完整性：系统层规则」梳理关键控制要求，重点涵盖 **原始数据先于记录**、**修改留痕**、**不可删除** 等核心要素（来源：`LabOS字段与规则总表_草案V0.1_20261105.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【原始数据先于记录】**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n- **【修改留痕】**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n- **【不可删除】**：已提交的记录只能作废并注明原因，不能物理删除。\n- **【时间戳由系统生成】**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n- **【签署证据】**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `LabOS字段与规则总表_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n对应 AGENTS.md §2.3 和风险清单 R1。目标是让“补造、倒签、覆盖”**在系统里做不到**，而不是只靠制度。\n\n1. **原始数据先于记录**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n2. **修改留痕**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n3. **不可删除**：已提交的记录只能作废并注明原因，不能物理删除。\n4. **时间戳由系统生成**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n5. **签署证据**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n6. **AI 读取的内容必须人核对**：现有“待整理与核对”流程（绿底/黄底，改/对/驳回）应保留，并在报表里区分“人工核对过”和“AI 读出未核”的数值。\n7. **测试数据隔离**：我在“批次与样品”里看到“测试1027/测试1028”等测试批次与正式批次混在一个清单里。建议增加“测试”标记，默认不进入统计、不进入周报和 CoA。\n8. **示例与真实分开**：培训或演示用的数据必须有“示例/培训用”标识，不得生成看起来像真实原始记录的数据（AGENTS.md §2.3）。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「① 调研与立项」梳理关键控制要求，重点涵盖 **① 调研与立项**、**技术来源是否清楚**、**① 调研与立项** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 目标是不是写成了**可检验的指标**（数值 + 用什么方法测），而不是“完成转化”这类说法。\n- 技术来源是否清楚：自研，还是转移、委托、外购？有没有授权或合同？\n- 客户的硬要求有没有写进来（例如剩余效期、运输温度）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【① 调研与立项】**：目标是不是写成了**可检验的指标**（数值 + 用什么方法测），而不是“完成转化”这类说法。\n- **【技术来源是否清楚】**：自研，还是转移、委托、外购？有没有授权或合同？\n- **【① 调研与立项】**：客户的硬要求有没有写进来（例如剩余效期、运输温度）。\n- **【① 调研与立项】**：把一篇文献的结论直接当作“已验证技术”写进立项书。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：在动手做之前，先弄清三件事：这个材料给谁用、要达到什么指标、技术从哪来。相当于项目的“可行性论证 + 立项审批”。做错的代价最大，因为后面所有工作都建立在这一步上。\n\n**该盯什么**\n- 目标是不是写成了**可检验的指标**（数值 + 用什么方法测），而不是“完成转化”这类说法。\n- 技术来源是否清楚：自研，还是转移、委托、外购？有没有授权或合同？\n- 客户的硬要求有没有写进来（例如剩余效期、运输温度）。\n\n**常见翻车点**\n- 把一篇文献的结论直接当作“已验证技术”写进立项书。\n- 技术来自外单位却没有授权文件（dsDNA、RF 工艺均有此风险，见风险清单 R10）。\n- LabOS 里 dsDNA-Ag 的“当期目标”写的是“新工艺完成转化”，没有指标数值和检测方法，后面无法判断做没做到。\n\n**可以问团队**\n1. 这个项目的验收指标有哪几条？每条用什么方法测、多少算合格？\n2. 这项技术的来源是什么？有没有授权或转让文件？\n3. 客户有哪些硬性要求（效期、运输、规格）？写进立项书了吗？",
    "cases": [
      {
        "title": "工序 ① 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| RD01–RD03 立项指标 | RD01 自身免疫抗原（dsDNA ≥0.8 mg/mL、A260/280 1.75–1.90、3 批 CV ≤8%；CCP HPLC ≥90%、MW 2500±10 Da）；RD02 动物疫病抗原（纯度 ≥95%、≥1.0 mg/mL、≥2 家企业书面反馈）；RD03 CCP 胶乳半成品 | E1，全景 §5.2 | 哪些指标写清了检测方法？哪些只写了数值？ |\n| 亚辉龙 DNA-Ag 05 | 要求到货剩余效期 ≥24 个月、2–8 ℃ 运输 | E2，全景 §5.1 | 这个要求应在立项时写进哪一项？对 ⑧ 意味着什么？ |\n| 技术来源 | dsDNA 工艺\"疑来自宁波赛珀\"；RF 酶切工艺\"转移自赛珀 SG\"；部分文件改名为 CYDAYA-QP，但正文仍是赛珀 | E1，全景 §5.1；风险清单 R10 | 立项时缺授权或转让合同，R1 能不能过？ |\n| IgG4、Z110 立项与合同顺序 | 合同先于或紧跟立项；设计记录有改日期的两个版本 | E1，风险清单 R1 | 立项文件的日期应以什么为准？ |"
      }

    "title": "LabOS 设计",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「LabOS 设计」梳理关键控制要求，重点涵盖 **对象**、**立项书**、**目标** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 产品管线：产品属性（来源、项目状态/年度、主要研发、研发周期、一/二/三级代码、原料属性、疾病类型、单位、当期目标），可挂子产品（如 dsDNA-Ag 下有 C10、F111E、D10、新融合工艺）。\n- 实验立项：研发项目（L4）与子任务（L5），带阶段、状态、负责人、计划时间、摘要/待解决。\n- 验收指标每条都必须有“检测方法”和“判定值”，否则不能提交立项评审。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对象】**：关键字段（＋为新增）\n- **【立项书】**：＋用途与终端平台（化学发光/ELISA/胶乳比浊）；＋客户规格来源（链接 E2 文件）；＋验收指标清单（每条：指标、判定值、检测方法、是否已确认）；＋技术来源与授权状态；＋证据矩阵附件；＋风险值 R=S×P\n- **【目标】**：把“当期目标”从自由文本改为可关联验收指标的条目\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**LabOS 现状（页面所见）**\n- 产品管线：产品属性（来源、项目状态/年度、主要研发、研发周期、一/二/三级代码、原料属性、疾病类型、单位、当期目标），可挂子产品（如 dsDNA-Ag 下有 C10、F111E、D10、新融合工艺）。\n- 实验立项：研发项目（L4）与子任务（L5），带阶段、状态、负责人、计划时间、摘要/待解决。\n\n**建议新增对象与字段**\n\n| 对象 | 关键字段（＋为新增） |\n|---|---|\n| 立项书 | ＋用途与终端平台（化学发光/ELISA/胶乳比浊）；＋客户规格来源（链接 E2 文件）；＋验收指标清单（每条：指标、判定值、检测方法、是否已确认）；＋技术来源与授权状态；＋证据矩阵附件；＋风险值 R=S×P |\n| 目标 | 把“当期目标”从自由文本改为可关联验收指标的条目 |\n\n**系统校验（R1）**\n- 验收指标每条都必须有“检测方法”和“判定值”，否则不能提交立项评审。\n- 技术来源为“转移/委托/外购”时，授权文件为必填。\n- 风险值 ≥10 时，必须有管代评审记录。\n\n**签核**：总经理批准立项；管代组织评审（RD-OP-001 §3）。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「③ 构建与原料准备」梳理关键控制要求，重点涵盖 **③ 构建与原料准备**、**③ 构建与原料准备**、**③ 构建与原料准备** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【③ 构建与原料准备】**：种子有没有建档（来源、版本、测序报告、冻存位置）。\n- **【③ 构建与原料准备】**：外购物料的供方是否在合格名录里，来料有没有检验。\n- **【③ 构建与原料准备】**：领用的物料是否合格、在效期内。\n- **【③ 构建与原料准备】**：供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把设计变成“可靠的起点”：测序确认序列没错的菌种、建档保存的种子，以及外购的关键原料（合成肽、IgG 粗品、酶、填料）。起点不可靠，后面做得再好也白做。\n\n**该盯什么**\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n**常见翻车点**\n- 供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n- 批记录里“起始物料”这一步没登记（LabOS 页面显示：导入的批记录没有这一步）。\n- 中间品批号重复使用（26-001/26-003 用于不同物料，风险清单 R12）。\n\n**可以问团队**\n1. 这批用的种子编号是什么？测序报告在哪？\n2. 外购的关键物料来自哪个供方？到货检验记录在哪？\n3. 起始物料批号有没有登记到批记录里？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「③ 构建与原料准备」梳理关键控制要求，重点涵盖 **③ 构建与原料准备**、**③ 构建与原料准备**、**③ 构建与原料准备** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【③ 构建与原料准备】**：种子有没有建档（来源、版本、测序报告、冻存位置）。\n- **【③ 构建与原料准备】**：外购物料的供方是否在合格名录里，来料有没有检验。\n- **【③ 构建与原料准备】**：领用的物料是否合格、在效期内。\n- **【③ 构建与原料准备】**：供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把设计变成“可靠的起点”：测序确认序列没错的菌种、建档保存的种子，以及外购的关键原料（合成肽、IgG 粗品、酶、填料）。起点不可靠，后面做得再好也白做。\n\n**该盯什么**\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n**常见翻车点**\n- 供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n- 批记录里“起始物料”这一步没登记（LabOS 页面显示：导入的批记录没有这一步）。\n- 中间品批号重复使用（26-001/26-003 用于不同物料，风险清单 R12）。\n\n**可以问团队**\n1. 这批用的种子编号是什么？测序报告在哪？\n2. 外购的关键物料来自哪个供方？到货检验记录在哪？\n3. 起始物料批号有没有登记到批记录里？",
    "cases": [
      {
        "title": "工序 ③ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| ISO 外审不符合 Q8.4.1 | 奥浦迈、语燕未纳入合格供方名录 | E1，全景 §6 | 新供方第一次供货前，应该完成哪些步骤？ |\n| CCP 来源 | 外购或委托合成；供方有\"生工 → 弘胜\"\"高校委托\"\"艾赛氏\"等不同说法（待确认） | E1，全景 §5.1 | 供方说法不一，对 CoA 和客户审核意味着什么？ |\n| 供方评估记录 | 3 家供方评估逐格相同 | E1，风险清单 R1 | 供方评估怎样做才是真实的？ |\n| 批号重复 | 中间品批号 26-001/26-003 用于不同物料 | E1，风险清单 R12 | 种子和原料批号应该怎样编？ |"

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「LabOS 设计」梳理关键控制要求，重点涵盖 **对象**、**种子库**、**外购物料** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 批次与样品：中间品取号（格式“样品号-年月日-序号”），可记冰箱/层/盒位置、体积、浓度、总量、剩余。\n- 批记录：有“① 起始物料”步骤，但部分导入批次没有登记。\n- 领用物料必须状态为“合格”且在效期内，否则不能记入批记录。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对象】**：关键字段（＋为新增）\n- **【种子库】**：＋来源；＋构建版本；＋测序报告编号；＋库位；＋传代次数\n- **【外购物料】**：＋物料分类 A/B/C；＋供方（只能选合格供方名录）；＋来料检验结果；＋状态（待检/合格/不合格）\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**LabOS 现状（页面所见）**\n- 批次与样品：中间品取号（格式“样品号-年月日-序号”），可记冰箱/层/盒位置、体积、浓度、总量、剩余。\n- 批记录：有“① 起始物料”步骤，但部分导入批次没有登记。\n\n**建议新增对象与字段**\n\n| 对象 | 关键字段（＋为新增） |\n|---|---|\n| 种子库 | ＋来源；＋构建版本；＋测序报告编号；＋库位；＋传代次数 |\n| 外购物料 | ＋物料分类 A/B/C；＋供方（只能选合格供方名录）；＋来料检验结果；＋状态（待检/合格/不合格） |\n\n**系统校验（R3）**\n- 领用物料必须状态为“合格”且在效期内，否则不能记入批记录。\n- 序列确认之前不能建种子。\n- 供方不在名录内时不可建采购单，或必须走例外审批。\n\n**签核**：QC 来料检验；综合部负责采购与供方管理。",

    "key": "labos.1.3",
    "path": "LabOS 开发指导 / 设计与研发：对象、字段与校验 / ④ 制备：扩增、表达或合成",
    "title": "④ 制备：扩增、表达或合成",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「④ 制备：扩增、表达或合成」梳理关键控制要求，重点涵盖 **④ 制备：扩增、表达或合**、**④ 制备：扩增、表达或合**、**④ 制备：扩增、表达或合** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 记录是否及时（LabOS 上“待补”行是否长期堆积）。\n- 产量是否与“标准速率”对得上，近期是否偏低。\n- 不同条件的比较是否有对照、取样是否可比。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【④ 制备：扩增、表达或合】**：记录是否及时（LabOS 上“待补”行是否长期堆积）。\n- **【④ 制备：扩增、表达或合】**：产量是否与“标准速率”对得上，近期是否偏低。\n- **【④ 制备：扩增、表达或合】**：不同条件的比较是否有对照、取样是否可比。\n- **【④ 制备：扩增、表达或合】**：两个诱导条件取样量不一致就下结论。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：用细菌、哺乳细胞或 PCR 把目标产物“做出来”。关键不在做出来，而在**能证明条件之间的差别是真的**：比较时取样要等比例，否则结论不可信。\n\n**该盯什么**\n- 记录是否及时（LabOS 上“待补”行是否长期堆积）。\n- 产量是否与“标准速率”对得上，近期是否偏低。\n- 不同条件的比较是否有对照、取样是否可比。\n\n**常见翻车点**\n- 两个诱导条件取样量不一致就下结论。\n- 上游记录拖着不补：D10-01 页面显示上游有待补行、下游有待补 10 行。\n- 表达量波动很大（SAA 表达量 85–135 mg/L）却没有记录能解释波动的参数。\n\n**可以问团队**\n1. 这批的关键条件参数是什么？和上一批比有什么变化？\n2. 上清和沉淀是不是等比例取样跑的胶？\n3. 近期速率低于标准，原因找过吗？",
    "cases": [
      {
        "title": "工序 ④ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| SAA/IgG 瞬转 | 293F；DNA 1 µg/mL；DNA:PEI = 1:3；D1 补 5% Feed + 1% 葡萄糖；第 6 天收获；表达量 85–135 mg/L | E1，全景 §5.1、§5.3 | 表达量波动这么大，应记录哪些参数来解释？ |\n| 原核表达通用条件 | LB/TB；OD600 0.65–0.89 诱导；可溶性差时 16 ℃、IPTG 0.1–0.4 mM；超声 400 W 3 s/2 s 40 min | E1，全景 §5.3 | 比较 16 ℃ 和 37 ℃ 时，取样要怎样做才可比？ |\n| dsDNA PCR | 100 µL 体系，EasyTaq，引物 0.25 µM，模板 200 ng；94 ℃ 4 min →（94 ℃ 30 s / 54 ℃ 30 s / 72 ℃ 3 min 10 s）×30 → 72 ℃ 4 min | E1，全景 §5.3 | 按常用的 Taq 延伸经验值（约 1 kb/min，E3，以所用酶的说明书为准），3 min 10 s 延伸对约 5000 bp 产物是否足够？现行程序的依据是什么？ |\n| 程新秀 2025 年真核转染 | 126 次，成功率 92% | E1，全景 §3 | 这类统计可以成为 LabOS 里的\"标准速率\"吗？ |\n| LabOS 中 D10 上游进度 | 仪表盘显示 D10-01 上游\"63/65 板\"（2026-11-04 查看） | LabOS | 板数和产量的对应关系应记录在哪里？ |"
      }
    ],
