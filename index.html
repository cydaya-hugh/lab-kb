    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑤ 纯化与样品处理（可重复调用）」梳理关键控制要求，重点涵盖 **⑤ 纯化与样品处理（可重**、**⑤ 纯化与样品处理（可重**、**⑤ 纯化与样品处理（可重** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每一步的回收率有没有记，损失能不能解释。\n- 最终拿到的结果是否来自一致的操作，而不是挑了最好的一次。\n- 原料是不是血浆或细胞来源（如人 IgG），需要病原风险评估。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑤ 纯化与样品处理（可重】**：每一步的回收率有没有记，损失能不能解释。\n- **【⑤ 纯化与样品处理（可重】**：最终拿到的结果是否来自一致的操作，而不是挑了最好的一次。\n- **【⑤ 纯化与样品处理（可重】**：原料是不是血浆或细胞来源（如人 IgG），需要病原风险评估。\n- **【⑤ 纯化与样品处理（可重】**：只挑最好看的胶图当结果，不记各步回收。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：从一锅混合物里把目标“钓”出来并洗干净。方法有三类思路：按**特异结合**钓（亲和）、按**大小**分（分子筛）、按**电荷或疏水性**分。纯化可以反复用，例如表达后捕获、切掉标签后再纯化、修饰后清除残留，都算纯化。\n\n**该盯什么**\n- 每一步的回收率有没有记，损失能不能解释。\n- 最终拿到的结果是否来自一致的操作，而不是挑了最好的一次。\n- 原料是不是血浆或细胞来源（如人 IgG），需要病原风险评估。\n\n**常见翻车点**\n- 只挑最好看的胶图当结果，不记各步回收。\n- RF 酶切抗原的人 IgG 原料没有病原筛查（风险清单 R6）。\n- 日报写“静丙酶切一直在纯化”，系统里却标“暂停”（LabOS 仪表盘 AI 提示，需例会确认）。\n\n**可以问团队**\n1. 每一步的回收率是多少？总回收多少？\n2. 这一步是为了去掉什么杂质？怎么证明去掉了？\n3. 原料来自哪里？需不需要病原筛查？",

        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| SAA/IgG 抗体 | Protein A 载量 10–15 mg/mL；PB + 500 mM NaCl 洗杂；100 mM Gly pH 3.0 洗脱；1 M Tris pH 9.0 中和 | E1，全景 §5.3 | 中和要多快？低 pH 停留时间应不应该记录？ |\n| dsDNA | QIAGEN-Tip 10000，载量 6–8 mg；1.25 M NaCl/15% 异丙醇洗脱 140 mL；0.7 倍体积异丙醇沉淀 | E1，全景 §5.3 | 每一步的回收率记录在哪里？ |\n| RF/IgG 酶切抗原 | 木瓜酶:IgG = 1:50，2–8 ℃ 12–16 h，碘乙酰胺终止 → Protein A（含 2 M 尿素洗杂）→ Chromdex 200 → 超滤 → QHP（Triton/乙二醇洗杂）→ Protein L 流穿 | E1，全景 §5.3 | 最后一步收\"流穿\"而不是\"洗脱\"，目的是什么？（推测：去除含 κ 轻链的 Fab，保留 Fc） |\n| RF 原料生物安全 | 人 IgG 原料无病原筛查；本公司无自有批数据，验证全部引用赛珀 | E1，全景 §5.1；风险清单 R6 | 应由谁、在哪个工序决定是否需要病原筛查？ |\n| 静丙酶切在纯化 | LabOS 仪表盘 AI 提示：岁鲁姗日报中 10/12–10/15 静丙酶切一直在纯化（透析、Protein L、pH 4.0），而系统里标为\"暂停\"，请例会确认 | LabOS（2026-11-04 查看） | 系统状态和日报不一致时，以哪个为准？谁来改？ |\n| D10-SiO2 | LabOS 中 D10-SiO2-01 处于研发阶段；名称提示为硅胶膜纯化路线（推测） | LabOS | 新纯化路线和现行阴离子交换路线，怎样做可比的比较？ |\n| 血清多抗 | 亲和 + Q HP 二次纯化，回收 85–90%，可解决长期储存沉淀 | E1，全景 §5.3 | 这个经验应写进哪个产品的工艺规程？ |"

    "path": "LabOS 开发指导 / 设计与研发：对象、字段与校验 / ⑥ 组装、修饰与呈现",
    "title": "⑥ 组装、修饰与呈现",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑥ 组装、修饰与呈现」梳理关键控制要求，重点涵盖 **⑥ 组装、修饰与呈现**、**⑥ 组装、修饰与呈现**、**⑥ 组装、修饰与呈现** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 修饰程度有没有测，游离的试剂清除干净了没有。\n- 修饰后的识别能力有没有单独验证。\n- 只验证了能被吸住，没验证抗体还能不能识别。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑥ 组装、修饰与呈现】**：修饰程度有没有测，游离的试剂清除干净了没有。\n- **【⑥ 组装、修饰与呈现】**：修饰后的识别能力有没有单独验证。\n- **【⑥ 组装、修饰与呈现】**：只验证了能被吸住，没验证抗体还能不能识别。\n- **【⑥ 组装、修饰与呈现】**：Biotin-CCP、生物素化 dsDNA 目前都没有生物素化率的检测（风险清单 R6）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：让材料能在客户的检测板、磁珠或胶乳上“用起来”。比如给分子贴上生物素（像贴一张“标签贴纸”），客户的链霉亲和素磁珠就能把它“吸住”。要分别验证两件事：**贴上了没有**，以及**贴完之后抗体还认不认**。\n\n**该盯什么**\n- 修饰程度有没有测，游离的试剂清除干净了没有。\n- 修饰后的识别能力有没有单独验证。\n\n**常见翻车点**\n- 只验证了能被吸住，没验证抗体还能不能识别。\n- Biotin-CCP、生物素化 dsDNA 目前都没有生物素化率的检测（风险清单 R6）。\n\n**可以问团队**\n1. 修饰程度是多少？用什么方法测的？\n2. 游离的生物素怎么清除、怎么证明清除了？\n3. 修饰后，阳性血清的信号和修饰前比怎么样？",
    "cases": [
      {
        "title": "工序 ⑥ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| Biotin-CCP | N 端生物素化合成肽，MW 2500 Da；目前无生物素化确认、无功能放行 | E1，全景 §5.1；风险清单 R6 | 至少应补哪两项检查？ |\n| 生物素化 dsDNA | 5′/3′ 生物素引物；目前无生物素化率、ssDNA 检测 | E1，风险清单 R6 | 生物素化率可以用什么方法测？ |\n| CCP 胶乳比浊 R1/R2 | 多肽致敏胶乳 → R1/R2 配制 → 性能验证；迈克标准 4:160:40、800 nm、线性 15–200 U/mL、批内 CV ≤5% | E2，全景 §5.1 | 这是原料还是半成品试剂？验收标准由谁定？ |\n| RD03 CCP 胶乳半成品 | 线性 10–180 U/mL；批内 CV ≤5%；≥60 份样本对比 r ≥0.95；开瓶 28 天、冷链 72 h | E1，全景 §5.2 | RD03 和迈克标准的线性范围不同，为什么？ |"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑥ 组装、修饰与呈现」梳理关键控制要求，重点涵盖 **⑥ 组装、修饰与呈现**、**⑥ 组装、修饰与呈现**、**⑥ 组装、修饰与呈现** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 修饰程度有没有测，游离的试剂清除干净了没有。\n- 修饰后的识别能力有没有单独验证。\n- 只验证了能被吸住，没验证抗体还能不能识别。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑥ 组装、修饰与呈现】**：修饰程度有没有测，游离的试剂清除干净了没有。\n- **【⑥ 组装、修饰与呈现】**：修饰后的识别能力有没有单独验证。\n- **【⑥ 组装、修饰与呈现】**：只验证了能被吸住，没验证抗体还能不能识别。\n- **【⑥ 组装、修饰与呈现】**：Biotin-CCP、生物素化 dsDNA 目前都没有生物素化率的检测（风险清单 R6）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：让材料能在客户的检测板、磁珠或胶乳上“用起来”。比如给分子贴上生物素（像贴一张“标签贴纸”），客户的链霉亲和素磁珠就能把它“吸住”。要分别验证两件事：**贴上了没有**，以及**贴完之后抗体还认不认**。\n\n**该盯什么**\n- 修饰程度有没有测，游离的试剂清除干净了没有。\n- 修饰后的识别能力有没有单独验证。\n\n**常见翻车点**\n- 只验证了能被吸住，没验证抗体还能不能识别。\n- Biotin-CCP、生物素化 dsDNA 目前都没有生物素化率的检测（风险清单 R6）。\n\n**可以问团队**\n1. 修饰程度是多少？用什么方法测的？\n2. 游离的生物素怎么清除、怎么证明清除了？\n3. 修饰后，阳性血清的信号和修饰前比怎么样？",
    "cases": [
      {
        "title": "工序 ⑥ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| Biotin-CCP | N 端生物素化合成肽，MW 2500 Da；目前无生物素化确认、无功能放行 | E1，全景 §5.1；风险清单 R6 | 至少应补哪两项检查？ |\n| 生物素化 dsDNA | 5′/3′ 生物素引物；目前无生物素化率、ssDNA 检测 | E1，风险清单 R6 | 生物素化率可以用什么方法测？ |\n| CCP 胶乳比浊 R1/R2 | 多肽致敏胶乳 → R1/R2 配制 → 性能验证；迈克标准 4:160:40、800 nm、线性 15–200 U/mL、批内 CV ≤5% | E2，全景 §5.1 | 这是原料还是半成品试剂？验收标准由谁定？ |\n| RD03 CCP 胶乳半成品 | 线性 10–180 U/mL；批内 CV ≤5%；≥60 份样本对比 r ≥0.95；开瓶 28 天、冷链 72 h | E1，全景 §5.2 | RD03 和迈克标准的线性范围不同，为什么？ |"
      }

  "labos.2.0": {
    "key": "labos.2.0",
    "path": "LabOS 开发指导 / 验证与定型：对象、字段与校验 / ⑦ 质量与用途验证",
    "title": "⑦ 质量与用途验证",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑦ 质量与用途验证」梳理关键控制要求，重点涵盖 **⑦ 质量与用途验证**、**⑦ 质量与用途验证**、**⑦ 质量与用途验证** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每个质量属性有没有适合的方法（小肽不能只靠 SDS-PAGE）。\n- 检验的人和放行的人是不是分开。\n- 检测用的设备是否在校准有效期内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑦ 质量与用途验证】**：每个质量属性有没有适合的方法（小肽不能只靠 SDS-PAGE）。\n- **【⑦ 质量与用途验证】**：检验的人和放行的人是不是分开。\n- **【⑦ 质量与用途验证】**：检测用的设备是否在校准有效期内。\n- **【⑦ 质量与用途验证】**：CoA 上写的是实测值，还是只写“≥90%”。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：确认做出来的东西“是什么、有多少、纯不纯”，并且在客户用途里“真的能用”。最关键的是：**检测方法要适合这种材料**，合格标准要在测之前就定好。\n\n**该盯什么**\n- 每个质量属性有没有适合的方法（小肽不能只靠 SDS-PAGE）。\n- 检验的人和放行的人是不是分开。\n- 检测用的设备是否在校准有效期内。\n- CoA 上写的是实测值，还是只写“≥90%”。\n\n**常见翻车点**\n- CCP 标准写 HPLC 和质谱，实际只检外观、溶解性、SDS-PAGE。\n- 检验与放行是同一个人；CoA 没有批准人签名（风险清单 R6）。\n- 外检设备校准已过期（墨肽台账外检 2026-05-19 到期）。\n\n**可以问团队**\n1. 这个指标用什么方法测？这个方法适合这种材料吗？\n2. 这份检验结果是谁测的、谁复核的、谁放行的？\n3. 用的设备校准到什么时候？",
    "cases": [
      {
        "title": "工序 ⑦ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| CCP 检验方法 | 标准写 HPLC ≥90%、Tricine-SDS-PAGE ≥90%、MW 2500±10 Da；实际只检外观、溶解性、SDS-PAGE；CoA 只写\"≥90%\"无实测值 | E1，全景 §5.1；风险清单 R6 | 在没有 HPLC 的情况下，下一步怎么办？ |\n| dsDNA 检验 | 浓度 ≥0.8 mg/mL；A260/280 1.75–1.90；单一条带；ELISA；批间 CV ≤10%；无生物素化率、ssDNA、内毒素检测；判定值 0.17/0.2 不统一 | E1，全景 §5.1；风险清单 R6 | 判定值不统一，应在哪个文件里统一？ |\n| SAA 检验 | ≥10 mg/mL；SDS-PAGE ≥90%；ELISA OD ≥2.0；克隆 12 的检验数据与克隆 11 逐字相同；CoA 日期早于检验日期 | E1，全景 §5.1；风险清单 R1 | 这类问题 LabOS 能怎样从系统上避免？ |\n| 诺唯赞评测 | dsDNA 符合率 81% | E1，全景 §5.1 | 这是 ⑦ 的方法问题，还是 ② 的设计问题？怎么区分？ |\n| 设备与能力 | 无 HPLC（预算\"暂缓\"）、无微量天平；墨肽台账外检 2026-05-19 已到期；新旦雅外校 2027-02 到期 | E1，风险清单 R6 | 外检到期的设备测出的数据还能用吗？ |\n| 肺炎支原体天然抗原 | 2023 年入库检验有计算错误、数据复制 | E1，全景 §5.1 | 检验记录复核应检查哪些点？ |"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「LabOS 设计」梳理关键控制要求，重点涵盖 **对象**、**质量标准**、**检验结果** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 成品质检：有“质检天数”“入库天数”“抽样支数”（默认抽样 3 支）。\n- 工艺规程里有“质量标准”页签，当前数量为 0。\n- 批记录“④ 质检放行”：成品 QC（含 CoA）→ 放行（管代）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对象】**：关键字段（＋为新增）\n- **【质量标准】**：＋每个项目的方法编号（QC-SIP 版本）、限值、判定规则\n- **【检验结果】**：＋实测值；＋原始数据附件；＋检验人；＋复核人\n- **【方法确认 / 参考品 / 设备】**：＋方法确认记录；＋参考品台账（编号、来源、赋值、有效期）；＋设备编号与校准有效期\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**LabOS 现状（页面所见）**\n- 成品质检：有“质检天数”“入库天数”“抽样支数”（默认抽样 3 支）。\n- 工艺规程里有“质量标准”页签，当前数量为 0。\n- 批记录“④ 质检放行”：成品 QC（含 CoA）→ 放行（管代）。\n\n**建议新增对象与字段**\n\n| 对象 | 关键字段（＋为新增） |\n|---|---|\n| 质量标准 | ＋每个项目的方法编号（QC-SIP 版本）、限值、判定规则 |\n| 检验结果 | ＋实测值；＋原始数据附件；＋检验人；＋复核人 |\n| 方法确认 / 参考品 / 设备 | ＋方法确认记录；＋参考品台账（编号、来源、赋值、有效期）；＋设备编号与校准有效期 |\n\n**系统校验（R7）**\n- 检验人与复核人不能是同一人；小团队兼岗时，必须另一人复核原始数据。\n- 设备校准过期时，不允许录入检验结果，或强制弹出提示并要求例外审批。\n- CoA 的数值从检验记录自动带出，不可手填；批准日期不得早于检验完成日期。\n\n**签核**：QC 判定；复核人另行签字。",

        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| CCP 检验方法 | 标准写 HPLC ≥90%、Tricine-SDS-PAGE ≥90%、MW 2500±10 Da；实际只检外观、溶解性、SDS-PAGE；CoA 只写\"≥90%\"无实测值 | E1，全景 §5.1；风险清单 R6 | 在没有 HPLC 的情况下，下一步怎么办？ |\n| dsDNA 检验 | 浓度 ≥0.8 mg/mL；A260/280 1.75–1.90；单一条带；ELISA；批间 CV ≤10%；无生物素化率、ssDNA、内毒素检测；判定值 0.17/0.2 不统一 | E1，全景 §5.1；风险清单 R6 | 判定值不统一，应在哪个文件里统一？ |\n| SAA 检验 | ≥10 mg/mL；SDS-PAGE ≥90%；ELISA OD ≥2.0；克隆 12 的检验数据与克隆 11 逐字相同；CoA 日期早于检验日期 | E1，全景 §5.1；风险清单 R1 | 这类问题 LabOS 能怎样从系统上避免？ |\n| 诺唯赞评测 | dsDNA 符合率 81% | E1，全景 §5.1 | 这是 ⑦ 的方法问题，还是 ② 的设计问题？怎么区分？ |\n| 设备与能力 | 无 HPLC（预算\"暂缓\"）、无微量天平；墨肽台账外检 2026-05-19 已到期；新旦雅外校 2027-02 到期 | E1，风险清单 R6 | 外检到期的设备测出的数据还能用吗？ |\n| 肺炎支原体天然抗原 | 2023 年入库检验有计算错误、数据复制 | E1，全景 §5.1 | 检验记录复核应检查哪些点？ |"

    "key": "labos.2.1",
    "path": "LabOS 开发指导 / 验证与定型：对象、字段与校验 / ⑧ 优化、稳定性与放大",
    "title": "⑧ 优化、稳定性与放大",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑧ 优化、稳定性与放大」梳理关键控制要求，重点涵盖 **⑧ 优化、稳定性与放大**、**⑧ 优化、稳定性与放大**、**⑧ 优化、稳定性与放大** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 声明的效期有没有实时数据支撑。\n- 优化是不是在独立样本上也有效，而不只是在开发样本上。\n- 至少 3 批的一致性有没有按同一方法比较。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑧ 优化、稳定性与放大】**：声明的效期有没有实时数据支撑。\n- **【⑧ 优化、稳定性与放大】**：优化是不是在独立样本上也有效，而不只是在开发样本上。\n- **【⑧ 优化、稳定性与放大】**：至少 3 批的一致性有没有按同一方法比较。\n- **【⑧ 优化、稳定性与放大】**：都写“6 个月长期稳定性”，但批次生产后仅约 1 个月（风险清单 R1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把“能做出来”变成“每批都一样、放得住、能放大”。**稳定性**就是产品放多久不坏；**放大**就是批量变大后性能不变。结论必须有时间做依据，不能超过实际观察过的时间。\n\n**该盯什么**\n- 声明的效期有没有实时数据支撑。\n- 优化是不是在独立样本上也有效，而不只是在开发样本上。\n- 至少 3 批的一致性有没有按同一方法比较。\n\n**常见翻车点**\n- 都写“6 个月长期稳定性”，但批次生产后仅约 1 个月（风险清单 R1）。\n- 声明效期 24–36 个月，却没有实时稳定性数据（风险清单 R7），而亚辉龙要求到货剩余效期 ≥24 个月。\n- 三个项目共用同一组批间数据。\n\n**可以问团队**\n1. 效期的依据是什么？实时数据已经做了多长时间？\n2. 这个改进在没用过的样本上验证过吗？\n3. 3 批的一致性数据是各自独立的原始数据吗？",
    "cases": [
      {
        "title": "工序 ⑧ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| RD01 稳定性指标 | 2–8 ℃ 7 天、冻融 3 次后保持率 ≥90%；3 批 CV ≤8% | E1，全景 §5.2 | 7 天数据能支持多长的效期？ |\n| \"6 个月稳定性\" | SAA、dsDNA、B2mg 的确认评审都称有 6 个月长期稳定性，但批次生产后只过了约 1 个月 | E1，风险清单 R1 | 这类结论应怎样更正？对已给客户的资料怎么办？ |\n| 声明效期无依据 | 声明 24–36 个月，无实时稳定性数据；亚辉龙要求剩余效期 ≥24 个月 | E1、E2，风险清单 R7 | 风险清单建议什么？数据出来前对外应如何表述？ |\n| 批间数据共用 | 三个项目共用同一组数字（批间 CV 纯度 1.1%、ELISA 7.2%） | E1，风险清单 R1 | 批间一致性报告应附哪些原始数据？ |\n| dsDNA 产能 | 月产能 70–80 mg | E1，全景 §5.1 | 产能数据是否足以支撑放大决策？ |\n| 液氮与冰箱监控 | 液氮罐液位事故延迟 4 天上报；冰箱、液氮无连续监控报警 | E1，风险清单 R11 | 储存条件失控对稳定性结论有什么影响？ |"
      }
    ],
    "updatedAt": "2026-11-19T15:30:00.000Z"
  },

    "title": "⑨ 定型、放行与交付准备",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑨ 定型、放行与交付准备」梳理关键控制要求，重点涵盖 **⑨ 定型、放行与交付准备**、**⑨ 定型、放行与交付准备**、**⑨ 定型、放行与交付准备** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 规格、方法、工艺三个文件的版本是否相互对应。\n- 试制批有没有经过设计转换评审，才变成可销售库存。\n- 货号、名称、规格等主数据是否唯一、一致。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑨ 定型、放行与交付准备】**：规格、方法、工艺三个文件的版本是否相互对应。\n- **【⑨ 定型、放行与交付准备】**：试制批有没有经过设计转换评审，才变成可销售库存。\n- **【⑨ 定型、放行与交付准备】**：货号、名称、规格等主数据是否唯一、一致。\n- **【⑨ 定型、放行与交付准备】**：dsDNA 2024 年三张 CoA 的数值与 2025 年中试三批完全一致（风险清单 R1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把配方、方法、标准三样**冻结成同一个版本**，形成检验报告（CoA）和技术文件，经评审后才算“研发完成、可以转入生产”。之后任何改动都要走变更流程。\n\n**该盯什么**\n- 规格、方法、工艺三个文件的版本是否相互对应。\n- 试制批有没有经过设计转换评审，才变成可销售库存。\n- 货号、名称、规格等主数据是否唯一、一致。\n\n**常见翻车点**\n- dsDNA 2024 年三张 CoA 的数值与 2025 年中试三批完全一致（风险清单 R1）。\n- CCP 有多个货号（ABCCP-001、-005 等，RD01 还写 ABCCP-710）。\n- 一批文件在一天内集中编写、审批，却记载多年前的评审（风险清单 R1）。\n\n**可以问团队**\n1. 这个产品当前生效的规格、方法、工艺分别是哪个版本？\n2. 这个产品的唯一货号是什么？客户资料里是否一致？\n3. 设计转换评审是哪天做的？结论是什么？",

        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| dsDNA CoA 数值复制 | 2024 年三张 CoA 的浓度和比值（1.25/1.31/1.28；1.81/1.83/1.85）与 2025-12 中试三批完全一致 | E1，风险清单 R1 | 发现这种问题后，对已交付的 CoA 应怎样处理？ |\n| CCP 设计文件 | 全套设计文件 2026-05-29 一天内编审批，却记载 2020–2021 年评审；称\"30+ 批次无投诉\"但无记录 | E1，风险清单 R1 | 对历史产品，正确的做法是什么？ |\n| CoA 签字与放行 | CoA 无\"Approved By\"签名；QC 与放行由同一人 | E1，风险清单 R6 | 8 人规模的团队，怎样安排检验和放行分人？ |\n| 货号不统一 | CCP 有 ABCCP-001、-005 等多个货号，RD01 写 ABCCP-710；dsDNA CoA 写 F111E | E1，全景 §5.1 | 定型时应冻结哪些主数据？ |\n| 第一个全链路真实批 | 路线图建议选 dsDNA D10（指令 2026-09-15，100 mg，交期 10-30）按 G0–G4 留全部原始数据 | E1，04 路线图 | D10 的规格、SOP、SIP 是否已三者一致？ |"

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「LabOS 设计」梳理关键控制要求，重点涵盖 **对象**、**产品主数据**、**设计转换记录** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 工艺规程：状态有“草稿/试行/在用/改进中”；批次下显示“没引用版本”提示（如 D10 的批次）。\n- 页面写明“完整规程待整理”。\n- 工艺规程从“试行”变为“在用”，必须有 R9 评审记录。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对象】**：关键字段（＋为新增）\n- **【产品主数据】**：＋唯一货号；＋分子形式；＋规格版本；＋SOP/SIP/标签版本；＋效期及依据；＋储存与运输条件\n- **【设计转换记录】**：＋R9 评审结论、日期、签字\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**LabOS 现状（页面所见）**\n- 工艺规程：状态有“草稿/试行/在用/改进中”；批次下显示“没引用版本”提示（如 D10 的批次）。\n- 页面写明“完整规程待整理”。\n\n**建议新增对象与字段**\n\n| 对象 | 关键字段（＋为新增） |\n|---|---|\n| 产品主数据 | ＋唯一货号；＋分子形式；＋规格版本；＋SOP/SIP/标签版本；＋效期及依据；＋储存与运输条件 |\n| 设计转换记录 | ＋R9 评审结论、日期、签字 |\n\n**系统校验（R9）**\n- 工艺规程从“试行”变为“在用”，必须有 R9 评审记录。\n- 把现在的“没引用版本”提示升级为**放行阻断**：批记录未引用规程版本，不得放行。\n\n**签核**：管代；总经理批准重大转产。",

        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| dsDNA CoA 数值复制 | 2024 年三张 CoA 的浓度和比值（1.25/1.31/1.28；1.81/1.83/1.85）与 2025-12 中试三批完全一致 | E1，风险清单 R1 | 发现这种问题后，对已交付的 CoA 应怎样处理？ |\n| CCP 设计文件 | 全套设计文件 2026-05-29 一天内编审批，却记载 2020–2021 年评审；称\"30+ 批次无投诉\"但无记录 | E1，风险清单 R1 | 对历史产品，正确的做法是什么？ |\n| CoA 签字与放行 | CoA 无\"Approved By\"签名；QC 与放行由同一人 | E1，风险清单 R6 | 8 人规模的团队，怎样安排检验和放行分人？ |\n| 货号不统一 | CCP 有 ABCCP-001、-005 等多个货号，RD01 写 ABCCP-710；dsDNA CoA 写 F111E | E1，全景 §5.1 | 定型时应冻结哪些主数据？ |\n| 第一个全链路真实批 | 路线图建议选 dsDNA D10（指令 2026-09-15，100 mg，交期 10-30）按 G0–G4 留全部原始数据 | E1，04 路线图 | D10 的规格、SOP、SIP 是否已三者一致？ |"

    "path": "LabOS 开发指导 / 生产 · 市场 · 改进：对象、字段与校验 / ⑩ 批生产与偏差",
    "title": "⑩ 批生产与偏差",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑩ 批生产与偏差」梳理关键控制要求，重点涵盖 **⑩ 批生产与偏差**、**⑩ 批生产与偏差**、**⑩ 批生产与偏差** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 五个控制点 G0 开工、G1 上游交接、G2 半成品转序、G3 成品放行、G4 发货，是否一个都没跳过。\n- 入库只是“收下”，不等于“放行”。\n- 偏差有没有登记、分级、有结论。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑩ 批生产与偏差】**：五个控制点 G0 开工、G1 上游交接、G2 半成品转序、G3 成品放行、G4 发货，是否一个都没跳过。\n- **【⑩ 批生产与偏差】**：入库只是“收下”，不等于“放行”。\n- **【⑩ 批生产与偏差】**：偏差有没有登记、分级、有结论。\n- **【⑩ 批生产与偏差】**：把入库签收当成放行，没放行就发货。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：按已批准的指令，做出一批**有据可查、经过放行**的成品。核心是三条：**每一步留记录、每个异常先停下、放行由专人签字**。LabOS 的批记录模块就是这道工序的主战场。\n\n**该盯什么**\n- 五个控制点 G0 开工、G1 上游交接、G2 半成品转序、G3 成品放行、G4 发货，是否一个都没跳过。\n- 入库只是“收下”，不等于“放行”。\n- 偏差有没有登记、分级、有结论。\n\n**常见翻车点**\n- 把入库签收当成放行，没放行就发货。\n- 记录事后补写或批量生成（86 份“模拟”缓冲液配制记录，风险清单 R1）。\n- 批次已过交期、多个步骤过了计划日期，但没有人提出调整（如 D10-01 的页面提示）。\n\n**可以问团队**\n1. 这批现在走到哪个控制点？每个控制点的证据在哪？\n2. 这批有没有偏差？是怎么分级和处理的？\n3. 每个人做了什么：谁做的、谁复核的、谁放行的？",
    "cases": [
      {
        "title": "工序 ⑩ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 证据 | 讨论题 |\n|---|---|---|---|\n| dsDNA D10：第一个全链路真实批 | 路线图建议选 D10（生产指令 2026-09-15，100 mg，交期 10-30）作为第一个按 G0–G4 留全部原始数据的批次 | `04_世界一流路线图.md` | 这批在 LabOS 里的 G0–G4 证据齐不齐？缺哪个？ |\n| 86 份\"模拟\"缓冲液配制记录 | 事后按规则生成；2024 年记录引用 2025 年的 SOP；实测值恰好等于目标值 | 风险清单 R1 | 哪些迹象说明这不是原始记录？LabOS 怎样从系统上防止？ |\n| 中间品批号重复 | 26-001/26-003 被用于不同物料；批号没有产品前缀 | 风险清单 R12 | 按父子批规则应该怎样编号？ |\n| dsDNA 同一批两份检验记录 | 同一批 251201 有 docx、xlsx 两种半成品检验记录，项目和限值不同 | 流转计划 §9、S8 | 以哪份为准？产品主数据应由谁核定？ |\n| 审核时提交他司格式的批记录 | 浩欧博审核时提交的批记录实为墨肽格式，其中有返工批 | 全景 §5.1 | 返工批需要哪些记录才算完整？ |"
      }

    "title": "LabOS 设计",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「LabOS 设计」梳理关键控制要求，重点涵盖 **对象**、**质量状态**、**控制点** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 批记录：指令单（需求量、时间窗、交期、预计）；例外提示（已过交期、步骤过了计划日期、待批变更）；步骤（起始物料、上游、下游纯化、分装入库、质检放行）；批次与数量、记录、变更与偏差等页签；“进展/问题”区有 AI 提示。\n- 批次与样品：成品库存当前为 0；152 个中间品大多“未登记”位置，体积、浓度、总量为空；清单里混有“测试1027/测试1028”的测试批次。\n- 待整理与核对：日报回溯的未挂载记录；AI 读出的数值要人核对（绿底=原文逐字找到，黄底=要人看）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对象】**：关键字段（＋为新增）\n- **【质量状态】**：＋7 种状态：待检、检验合格待审批、已批准转序、成品已放行、冻结、不合格、已处置；每次变化记录依据、批准人、时间\n- **【控制点】**：＋G0–G4 的状态、时间、签字人、证据链接\n- **【父子批】**：＋父批号、子批号、容器号；＋物料平衡（投入=成品+取样+留样+余量+损耗）\n- **【偏差】**：＋编号、批号、发现人、R=S×P 分级、处置、关闭日期、是否转 CAPA\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**LabOS 现状（页面所见，较完整）**\n- 批记录：指令单（需求量、时间窗、交期、预计）；例外提示（已过交期、步骤过了计划日期、待批变更）；步骤（起始物料、上游、下游纯化、分装入库、质检放行）；批次与数量、记录、变更与偏差等页签；“进展/问题”区有 AI 提示。\n- 批次与样品：成品库存当前为 0；152 个中间品大多“未登记”位置，体积、浓度、总量为空；清单里混有“测试1027/测试1028”的测试批次。\n- 待整理与核对：日报回溯的未挂载记录；AI 读出的数值要人核对（绿底=原文逐字找到，黄底=要人看）。\n\n**建议新增对象与字段**\n\n| 对象 | 关键字段（＋为新增） |\n|---|---|\n| 质量状态 | ＋7 种状态：待检、检验合格待审批、已批准转序、成品已放行、冻结、不合格、已处置；每次变化记录依据、批准人、时间 |\n| 控制点 | ＋G0–G4 的状态、时间、签字人、证据链接 |\n| 父子批 | ＋父批号、子批号、容器号；＋物料平衡（投入=成品+取样+留样+余量+损耗） |\n| 偏差 | ＋编号、批号、发现人、R=S×P 分级、处置、关闭日期、是否转 CAPA |\n\n**系统校验（G0–G4）**\n- G0：物料合格且在效期、设备校准有效、文件为现行版、人员已培训、清场合格，缺一不能开工。\n- G3：全项检验合格 + 偏差已关闭或已评估 + CoA、标签、库存批号一致 + 管代签字，才能把状态改为“成品已放行”。\n- G4：出库时只能选“成品已放行”的批次；冻结、超期、退货、未批准品不可选。\n- 偏差分级为 R≥10 时，自动要求开 CAPA，并通知管代。\n\n**签核**：执行、检验、放行、保管四种职能分别留痕；同一人不能复核自己的关键操作。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「LabOS 设计」梳理关键控制要求，重点涵盖 **对象**、**质量状态**、**控制点** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 批记录：指令单（需求量、时间窗、交期、预计）；例外提示（已过交期、步骤过了计划日期、待批变更）；步骤（起始物料、上游、下游纯化、分装入库、质检放行）；批次与数量、记录、变更与偏差等页签；“进展/问题”区有 AI 提示。\n- 批次与样品：成品库存当前为 0；152 个中间品大多“未登记”位置，体积、浓度、总量为空；清单里混有“测试1027/测试1028”的测试批次。\n- 待整理与核对：日报回溯的未挂载记录；AI 读出的数值要人核对（绿底=原文逐字找到，黄底=要人看）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对象】**：关键字段（＋为新增）\n- **【质量状态】**：＋7 种状态：待检、检验合格待审批、已批准转序、成品已放行、冻结、不合格、已处置；每次变化记录依据、批准人、时间\n- **【控制点】**：＋G0–G4 的状态、时间、签字人、证据链接\n- **【父子批】**：＋父批号、子批号、容器号；＋物料平衡（投入=成品+取样+留样+余量+损耗）\n- **【偏差】**：＋编号、批号、发现人、R=S×P 分级、处置、关闭日期、是否转 CAPA\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**LabOS 现状（页面所见，较完整）**\n- 批记录：指令单（需求量、时间窗、交期、预计）；例外提示（已过交期、步骤过了计划日期、待批变更）；步骤（起始物料、上游、下游纯化、分装入库、质检放行）；批次与数量、记录、变更与偏差等页签；“进展/问题”区有 AI 提示。\n- 批次与样品：成品库存当前为 0；152 个中间品大多“未登记”位置，体积、浓度、总量为空；清单里混有“测试1027/测试1028”的测试批次。\n- 待整理与核对：日报回溯的未挂载记录；AI 读出的数值要人核对（绿底=原文逐字找到，黄底=要人看）。\n\n**建议新增对象与字段**\n\n| 对象 | 关键字段（＋为新增） |\n|---|---|\n| 质量状态 | ＋7 种状态：待检、检验合格待审批、已批准转序、成品已放行、冻结、不合格、已处置；每次变化记录依据、批准人、时间 |\n| 控制点 | ＋G0–G4 的状态、时间、签字人、证据链接 |\n| 父子批 | ＋父批号、子批号、容器号；＋物料平衡（投入=成品+取样+留样+余量+损耗） |\n| 偏差 | ＋编号、批号、发现人、R=S×P 分级、处置、关闭日期、是否转 CAPA |\n\n**系统校验（G0–G4）**\n- G0：物料合格且在效期、设备校准有效、文件为现行版、人员已培训、清场合格，缺一不能开工。\n- G3：全项检验合格 + 偏差已关闭或已评估 + CoA、标签、库存批号一致 + 管代签字，才能把状态改为“成品已放行”。\n- G4：出库时只能选“成品已放行”的批次；冻结、超期、退货、未批准品不可选。\n- 偏差分级为 R≥10 时，自动要求开 CAPA，并通知管代。\n\n**签核**：执行、检验、放行、保管四种职能分别留痕；同一人不能复核自己的关键操作。",

    "title": "⑪ 交付与客户反馈",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑪ 交付与客户反馈」梳理关键控制要求，重点涵盖 **⑪ 交付与客户反馈**、**⑪ 交付与客户反馈**、**⑪ 交付与客户反馈** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑪ 交付与客户反馈】**：每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- **【⑪ 交付与客户反馈】**：客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- **【⑪ 交付与客户反馈】**：客户审核的结论和整改记录有没有存档。\n- **【⑪ 交付与客户反馈】**：评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把放行的产品**完好送到**客户手里，并且把客户的每一次反馈（咨询、评测结果、投诉、退货、审核）都**登记、分级、给回复、能追到结果**。反馈是改进的原料，丢了就没有闭环。\n\n**该盯什么**\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n**常见翻车点**\n- 评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n- 亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录均未存档（风险清单 R8）。\n- 满意度调查表逐格相同且早于签约日（风险清单 R1）。\n\n**可以问团队**\n1. 最近一个月收到了哪些客户反馈？各自处理到哪一步？\n2. 这个客户的协议里，回复时限、变更通知提前期、留样要求分别是什么？\n3. 上次客户审核的不符合项，整改证据在哪？",

        "body": "| 案例 | 说明 | 证据 | 讨论题 |\n|---|---|---|---|\n| 诺唯赞评测 dsDNA 符合率 81% | 属于 B 类性能反馈 | 全景 §5.1 | 先查什么来区分\"产品批次问题\"\"方法差异\"\"设计或表位问题\"？分别转到哪道工序？ |\n| 迈克指出 SAA 线性验证与溯源问题 | 客户书面指出 | 全景 §7 | 这是 ⑦ 的问题还是 ⑨ 的问题？整改证据是什么？ |\n| 科华质量协议签章栏空白 | 协议约定：投诉 10 个工作日回复、变更提前 30 个工作日通知、留样至效期 | 全景 §7 | 协议没签，这些义务还算不算？LabOS 应怎样提醒？ |\n| 亚辉龙剩余效期 ≥24 个月 | 声明效期缺少实时稳定性数据 | 全景 §5.1；风险清单 R7 | 接单时应如何答复？需要 ⑧ 先补什么数据？ |\n| 客户审核记录未存档 | 2025 年多家审核结论缺失 | 风险清单 R8 | 审核资料包应包含哪些固定内容？ |"

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「LabOS 设计」梳理关键控制要求，重点涵盖 **对象**、**客户档案**、**反馈** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 回复期限自动倒计时，取程序规定与该客户协议中较严的一个，快到期提醒负责人和管代。\n- A 类（质量投诉）必须关联批号，并有留样复测记录，才能关闭。\n- 出库单只能选“成品已放行”的批次；客户的剩余效期要求在下单时自动校验，不满足则提示。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对象】**：关键字段（＋为新增）\n- **【客户档案】**：＋名称；＋联系人；＋协议要求（回复时限、变更通知提前期、留样要求、剩余效期要求）\n- **【反馈】**：＋编号、接收日期、渠道；＋客户、产品、批号、CoA 编号；＋类型（收货确认、咨询、评测、投诉、退货、CoA 质疑、审核、满意度）；＋级别 A/B/C/D；＋负责人、首次响应期限、回复期限；＋调查摘要与留样复测链接；＋影响批次；＋处置、结论、客户确认；＋是否转 CAPA\n- **【审核台账】**：＋审核方、日期、不符合项、整改期限、证据、客户结论\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**LabOS 现状（页面所见）**：侧栏的 15 个页面里没有看到客户、反馈、投诉、审核相关的页面（“更多工具”折叠项未展开核对）。\n\n**建议新增对象与字段**\n\n| 对象 | 关键字段（＋为新增） |\n|---|---|\n| 客户档案 | ＋名称；＋联系人；＋协议要求（回复时限、变更通知提前期、留样要求、剩余效期要求） |\n| 反馈 | ＋编号、接收日期、渠道；＋客户、产品、批号、CoA 编号；＋类型（收货确认、咨询、评测、投诉、退货、CoA 质疑、审核、满意度）；＋级别 A/B/C/D；＋负责人、首次响应期限、回复期限；＋调查摘要与留样复测链接；＋影响批次；＋处置、结论、客户确认；＋是否转 CAPA |\n| 审核台账 | ＋审核方、日期、不符合项、整改期限、证据、客户结论 |\n\n**系统校验（F1–F2）**\n- 回复期限自动倒计时，取程序规定与该客户协议中较严的一个，快到期提醒负责人和管代。\n- A 类（质量投诉）必须关联批号，并有留样复测记录，才能关闭。\n- 出库单只能选“成品已放行”的批次；客户的剩余效期要求在下单时自动校验，不满足则提示。\n\n**签核**：销售/客户联系人登记并回复；管代批准重大投诉的对外回复。",

  "labos.3.2": {
    "key": "labos.3.2",
    "path": "LabOS 开发指导 / 生产 · 市场 · 改进：对象、字段与校验 / ⑫ CAPA 与变更",
    "title": "⑫ CAPA 与变更",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑫ CAPA 与变更」梳理关键控制要求，重点涵盖 **⑫ CAPA 与变更**、**⑫ CAPA 与变更**、**⑫ CAPA 与变更** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- 措施完成后有没有验证有效。\n- 改动是否通知了协议要求的客户、提前了多久。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑫ CAPA 与变更】**：根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- **【⑫ CAPA 与变更】**：措施完成后有没有验证有效。\n- **【⑫ CAPA 与变更】**：改动是否通知了协议要求的客户、提前了多久。\n- **【⑫ CAPA 与变更】**：外审不符合 Q8.4.1 的整改，写了做不到的内容（SaaS 平台、法务部，风险清单 R5）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：**CAPA** 是“纠正与预防措施”：出了问题，找到真正的原因，改掉它，防止再发生，并验证有效。**变更控制**是：任何改动（原料、供方、工艺、方法、规格）先评估影响、批准、通知客户，再执行。这一步让整条链路形成闭环：问题要回到出问题的那道工序去修。\n\n**该盯什么**\n- 根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- 措施完成后有没有验证有效。\n- 改动是否通知了协议要求的客户、提前了多久。\n\n**常见翻车点**\n- 外审不符合 Q8.4.1 的整改，写了做不到的内容（SaaS 平台、法务部，风险清单 R5）。\n- 措施做完就关闭，没有验证。\n- 工艺或方法改了，没有评估是否要通知客户。\n\n**可以问团队**\n1. 这个问题的根因是什么？为什么规程或系统允许它发生？\n2. 措施做完后，用什么标准证明有效？\n3. 这次改动要不要通知客户？协议要求提前多久？",

    "title": "⑫ CAPA 与变更",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑫ CAPA 与变更」梳理关键控制要求，重点涵盖 **⑫ CAPA 与变更**、**⑫ CAPA 与变更**、**⑫ CAPA 与变更** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- 措施完成后有没有验证有效。\n- 改动是否通知了协议要求的客户、提前了多久。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑫ CAPA 与变更】**：根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- **【⑫ CAPA 与变更】**：措施完成后有没有验证有效。\n- **【⑫ CAPA 与变更】**：改动是否通知了协议要求的客户、提前了多久。\n- **【⑫ CAPA 与变更】**：外审不符合 Q8.4.1 的整改，写了做不到的内容（SaaS 平台、法务部，风险清单 R5）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：**CAPA** 是“纠正与预防措施”：出了问题，找到真正的原因，改掉它，防止再发生，并验证有效。**变更控制**是：任何改动（原料、供方、工艺、方法、规格）先评估影响、批准、通知客户，再执行。这一步让整条链路形成闭环：问题要回到出问题的那道工序去修。\n\n**该盯什么**\n- 根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- 措施完成后有没有验证有效。\n- 改动是否通知了协议要求的客户、提前了多久。\n\n**常见翻车点**\n- 外审不符合 Q8.4.1 的整改，写了做不到的内容（SaaS 平台、法务部，风险清单 R5）。\n- 措施做完就关闭，没有验证。\n- 工艺或方法改了，没有评估是否要通知客户。\n\n**可以问团队**\n1. 这个问题的根因是什么？为什么规程或系统允许它发生？\n2. 措施做完后，用什么标准证明有效？\n3. 这次改动要不要通知客户？协议要求提前多久？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「LabOS 设计」梳理关键控制要求，重点涵盖 **对象**、**CAPA**、**变更** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- CAPA 必须填写有效性验证结果，才能关闭。\n- 重大变更在批准之前，不得在批记录或工艺规程中生效。\n- 变更涉及客户时，自动列出需通知的客户和协议中的提前期，没有回执不能关闭。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对象】**：关键字段（＋为新增）\n- **【CAPA】**：＋来源（偏差/反馈/内审/外审/供方/趋势/管评）与来源编号；＋不合格事实；＋遏制措施；＋影响批次；＋R=S×P；＋根因类型与描述；＋纠正/纠正措施/预防措施（责任人、期限）；＋有效性标准与验证结果；＋退回工序；＋关闭日期\n- **【变更】**：＋类别（重大/一般）；＋变更对象（原料、供方、工艺、方法、规格、设备、地点、文件）；＋影响评估；＋验证计划；＋需通知的客户、通知日期、回执；＋批准人；＋生效日期；＋文件新版本号\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**LabOS 现状（页面所见）**：批记录页有“变更与偏差”页签（D10-01 当前 4 项）和“待批变更”提示；工艺规程有“版本与变更”页签。未看到 CAPA 对象、变更分类和客户通知字段。\n\n**建议新增对象与字段**\n\n| 对象 | 关键字段（＋为新增） |\n|---|---|\n| CAPA | ＋来源（偏差/反馈/内审/外审/供方/趋势/管评）与来源编号；＋不合格事实；＋遏制措施；＋影响批次；＋R=S×P；＋根因类型与描述；＋纠正/纠正措施/预防措施（责任人、期限）；＋有效性标准与验证结果；＋退回工序；＋关闭日期 |\n| 变更 | ＋类别（重大/一般）；＋变更对象（原料、供方、工艺、方法、规格、设备、地点、文件）；＋影响评估；＋验证计划；＋需通知的客户、通知日期、回执；＋批准人；＋生效日期；＋文件新版本号 |\n\n**系统校验（C1–C2）**\n- CAPA 必须填写有效性验证结果，才能关闭。\n- 重大变更在批准之前，不得在批记录或工艺规程中生效。\n- 变更涉及客户时，自动列出需通知的客户和协议中的提前期，没有回执不能关闭。\n- CAPA 的“退回工序”字段为必填，用于把改进回流到 ①–⑩ 对应的工序。\n\n**签核**：管代批准 CAPA 和变更；涉及重大资源的报总经理。",

        "body": "| 案例 | 说明 | 证据 | 讨论题 |\n|---|---|---|---|\n| ISO 外审不符合 Q8.4.1 | 奥浦迈、语燕未纳入合格供方；90 天整改；关闭证据待确认；整改用的供应商程序写了做不到的内容（SaaS 平台、法务部） | 全景 §6；风险清单 R5 | 根因是\"漏登\"，还是\"供方程序与公司规模不匹配\"？有效性如何验证？ |\n| 记录真实性问题群 | 模拟记录、CoA 数值复制、稳定性时间不成立、克隆检验数据相同 | 风险清单 R1 | 这是 ⑩ 的执行问题，还是缺少系统控制？LabOS 能消除哪些条件？ |\n| 诺唯赞 81% 符合率 | 来自 ⑪ 的 B 类反馈 | 全景 §5.1 | 按根因退回表推演：退回 ②、⑦ 还是 ①？（教学推演，E4） |\n| CCP 检验方法不适用 | 只检外观、溶解性、SDS-PAGE，没有 HPLC 和 MS | 全景 §5.1；风险清单 R6 | 改用 HPLC（或委外）属于重大变更吗？需要通知哪些客户？ |\n| 工艺来源与授权 | dsDNA、RF 等工艺资料来自宁波赛珀 | 风险清单 R10 | 这类问题的 CAPA 输出是什么？与 ① 的技术来源合法性如何衔接？ |"

    "path": "LabOS 开发指导 / 相关体系条款 / 3. 条款地图（ISO 9001:2015 第 4–10 章）",
    "title": "3. 条款地图（ISO 9001:2015 第 4–10 章）",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「3. 条款地图（ISO 9001:2015 第 4–10 章）」梳理关键控制要求，重点涵盖 **4 组织环境**、**5 领导作用**、**6 策划** 等核心要素（来源：`ISO9001体系管理要点_草案V0.1_20261106.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【4 组织环境】**：弄清内外部环境、相关方要求、体系范围；QA-FM-007 已填（2025-06-10）；范围与实际生产不一致（A、03）；① 立项；项目立项记录关联客户要求与相关方\n- **【5 领导作用】**：方针目标、职责权限、管代；方针有两个版本：QM 与向审核员陈述的不一致；管代为胡冯博，另有人员疑问（A、05 第 10 题）；全部（角色与签核）；角色权限表、签核人必须是授权人员\n- **【6 策划】**：风险与机遇、质量目标；QM 8 项目标与实际考核的 QA-FM-022 是两套；月度全填 100%（A）；① R1、⑫；目标指标自动由系统数据计算，不手填\n- **【7.1.5 监视测量资源】**：设备校准、量值溯源；13 台已外校；墨肽台账有逾期（01、03 R6）；⑦ 质量验证；设备台账含校准到期日，到期后不能用于出数据\n- **【7.2–7.3 能力与意识】**：人员培训、资格；AD-FM-001 培训记录（2025.6–12）（A）；③–⑩ 操作人员；操作资格与工序挂钩，未培训不能签核\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `ISO9001体系管理要点_草案V0.1_20261106.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n| 条款 | 要求（白话） | 本公司现状（来源） | 对应工序 / Gate | LabOS 能做什么（建议） |\n|---|---|---|---|---|\n| 4 组织环境 | 弄清内外部环境、相关方要求、体系范围 | QA-FM-007 已填（2025-06-10）；范围与实际生产不一致（A、03） | ① 立项 | 项目立项记录关联客户要求与相关方 |\n| 5 领导作用 | 方针目标、职责权限、管代 | 方针有两个版本：QM 与向审核员陈述的不一致；管代为胡冯博，另有人员疑问（A、05 第 10 题） | 全部（角色与签核） | 角色权限表、签核人必须是授权人员 |\n| 6 策划 | 风险与机遇、质量目标 | QM 8 项目标与实际考核的 QA-FM-022 是两套；月度全填 100%（A） | ① R1、⑫ | 目标指标自动由系统数据计算，不手填 |\n| 7.1.5 监视测量资源 | 设备校准、量值溯源 | 13 台已外校；墨肽台账有逾期（01、03 R6） | ⑦ 质量验证 | 设备台账含校准到期日，到期后不能用于出数据 |\n| 7.2–7.3 能力与意识 | 人员培训、资格 | AD-FM-001 培训记录（2025.6–12）（A） | ③–⑩ 操作人员 | 操作资格与工序挂钩，未培训不能签核 |\n| 7.5 文件化信息 | 文件和记录的创建、更新、控制 | 文件未签发；编号冲突（03 R5） | 全部 | 文件主索引（一号一名），版本与生效日期校验 |\n| 8.1 运行策划 | 把要求变成可执行的过程 | 生产流转计划草案 V0.1（G0–G4）已有，建议试行（03） | ⑩ | G0–G4 控制点作为系统节点 |\n| 8.2 产品和服务要求 | 与客户沟通、评审要求 | 合同可能先于立项、立项评审前签订（03 R1、A） | ① ⑪ | 合同评审记录先于立项；客户规格变更走变更 |\n| 8.3 设计和开发 | 策划、输入、控制、输出、变更 | RD-OP-001 与 RD-FM-001～011；部分设计记录日期可疑（03 R1） | ①–⑨（R1–R9） | 设计输入输出、评审、验证、确认、转换逐项留证 |\n| 8.4 外部供方 | 供方选择、评价、再评价 | **二阶段不符合项 Q8.4.1**；3 家评估逐格相同（A、03） | ③ 原料、⑩ | 合格供方清单；未合格供方物料不能入库放行 |\n| 8.5 生产和服务提供 | 受控条件、标识追溯、财产、防护 | 批号重复、物料台账缺有效期和质量状态（03 R12） | ④⑤⑥⑩ | 批号唯一、父批子批关系、质量状态七态 |\n| 8.6 产品放行 | 放行条件满足后才放行，留下证据 | QC 与放行同一人；CoA 无批准签名；QM §8.6 与 QA-OP-011 §4.2 表述不一致（03、LabOS 总表） | ⑦⑨⑩ G2–G4 | 放行需不同于检验员的授权人签核，系统强制 |\n| 8.7 不合格输出 | 识别并控制，防止误用 | PM-SMP-006 偏差规程草案已起草（待审核） | ⑩ | 不合格品冻结，不能被转序或发货 |\n| 9.1 监视、测量、分析 | 客户满意、数据分析 | 3 家满意度调查逐格相同且早于签约日（A、03 R1） | ⑪ | 反馈和满意度原始记录入库，禁止批量复制 |\n| 9.2 内部审核 | 按计划审核、跟踪整改 | QA-FM-017 内审全套（2025-10-15）；不符合事实前后不一致（A） | 全部 | 审核发现关联到责任人和关闭证据 |\n| 9.3 管理评审 | 管理层评审体系绩效 | 最近一次 2025-10-25（A） | ⑫ | 管评输入数据（偏差、投诉、CAPA）自动汇总 |\n| 10.2 不合格与纠正措施 | 根因分析、纠正措施、有效性验证 | QA-OP-009 CAPA 程序；QA-SMP-007 变更规程草案（待审核） | ⑫ C1–C2 | CAPA 与变更对象、根因退回工序、有效性复核 |\n| 10.3 持续改进 | 持续提升体系 | 路线图 04 提出评估 ISO 13485 | ⑫ | 指标看板与趋势 |",

/* 合并 AI 同步数据文件 (笔记与案例_同步数据.js) */
if(window.LABKB_SYNC_DATA&&typeof window.LABKB_SYNC_DATA==="object"){
  let changed=false;
  Object.keys(window.LABKB_SYNC_DATA).forEach(k=>{
    const incoming=window.LABKB_SYNC_DATA[k];
    if(!incoming||typeof incoming!=="object")return;
    const existing=store[k];
    if(!existing||(incoming.updatedAt&&(!existing.updatedAt||incoming.updatedAt>existing.updatedAt))){
      store[k]=incoming;
      changed=true;
    }
  });
  if(changed){
    try{localStorage.setItem(STORE_KEY,JSON.stringify(store))}catch(e){}
  }
}

function ancestors(n){const a=[];for(let p=n._par;p;p=p._par)a.unshift(p);return a}
function nodePathKey(n){
  const tabId=n._k.split(".")[0];
  return tabId+"::"+[...ancestors(n).map(p=>p.t),n.t].join("/");
}
function getEntry(n){
  if(!n)return {note:"",cases:[]};
  const pk=nodePathKey(n);
  const raw=store[n._k]||store[pk];
  if(!raw)return {note:"",cases:[]};
  return {
    note:typeof raw.note==="string"?raw.note:"",
    cases:Array.isArray(raw.cases)?raw.cases.map(c=>({title:c.title||"",tag:c.tag||"",body:c.body||""})):[]
  };
}
function hasNote(n){
  const e=getEntry(n);
  return e.note.trim().length>0;
}
function validCases(e){
  return (e.cases||[]).filter(c=>(c.title&&c.title.trim())||(c.tag&&c.tag.trim())||(c.body&&c.body.trim()));
}
function caseCount(n){
  return validCases(getEntry(n)).length;
}
function setEntry(n,entry){
  if(!n)return;
  const pk=nodePathKey(n);
  const cleanCases=(entry.cases||[]).map(c=>({title:c.title||"",tag:c.tag||"",body:c.body||""}));
  const hasAny=(entry.note&&entry.note.trim())||cleanCases.some(c=>c.title.trim()||c.tag.trim()||c.body.trim());
  if(hasAny){
    const rec={
      key:n._k,
      path:[...ancestors(n).map(p=>p.t),n.t].join(" / "),
      title:n.t,
      note:entry.note||"",
      cases:cleanCases,
      updatedAt:new Date().toISOString()
    };
    store[n._k]=rec;
    store[pk]=rec;
  }else{
    delete store[n._k];
    delete store[pk];
  }
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify(store));
    const now=new Date();
    const ts=[now.getHours(),now.getMinutes(),now.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");
    $("nb-save-state").textContent="已保存 "+ts;
    $("nb-save-state").classList.add("saved");
  }catch(e){
    $("nb-save-state").textContent="保存失败（存储空间不足）";
    $("nb-save-state").classList.remove("saved");
  }
  scheduleServerSync();
  updateBadges();
  updateNodeBadgeInMap(n);
}

/* 增强版 Markdown 渲染（支持概述专业术语蓝色点击跳转到下方词条注释、加粗标题、--- 分行线、==高亮==、【标签】） */
function escapeRegExp(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}
function renderMarkdown(md){
  if(!md||!md.trim())return '<p class="nb-empty">暂无内容，点击右上角「✏️ 编辑模式」开始编写。</p>';
  const lines=md.replace(/\r\n/g,"\n").split("\n");

  // 第一遍扫描：提取下方「核心概念定义」中的所有【术语】并建立跳转索引
  const defEntries=[];
  const lineToDefId={};
  lines.forEach((ln,idx)=>{
    const m=ln.match(/^\s*(?:[-*•]|\d+[.、])\s*(?:\*\*)?【([^】]+)】/);
    if(m){
      const rawTerm=m[1].trim();
      const defId="nb-def-"+defEntries.length;
      lineToDefId[idx]=defId;
      const candidates=new Set();
      candidates.add(rawTerm);
      // 括号前主词（如「氨基酸基准序列（Canonical Sequence）」->「氨基酸基准序列」）
      const mainPart=rawTerm.replace(/[（(].*$/,"").trim();
      if(mainPart.length>=2){
        candidates.add(mainPart);
        // 若主词含「与」「/」「／」，拆分出子术语（如「登录号与序列版本」->「登录号」「序列版本」）
        mainPart.split(/[与／/、]/).map(x=>x.trim()).filter(x=>x.length>=2).forEach(x=>candidates.add(x));
      }
      // 括号内英文或缩写（如「Canonical Sequence」「SOTA」「IMAC」「SEC-HPLC」）
      const parenMatches=rawTerm.match(/[（(]([^）)]+)[）)]/g)||[];
      parenMatches.forEach(pm=>{
        const inner=pm.slice(1,-1).split(/[，,；;]/)[0].trim();
        if(inner.length>=2&&!/^[$\\]/.test(inner))candidates.add(inner);
      });
      defEntries.push({defId,rawTerm,candidates:[...candidates]});
    }
  });

  // 构建按长度降序排列的术语匹配表
  const termMap=[];
  const seenKw=new Set();
  defEntries.forEach(d=>{
    d.candidates.forEach(kw=>{
      const cleanKw=kw.trim();
      if(cleanKw.length>=2&&!seenKw.has(cleanKw)){
        seenKw.add(cleanKw);
        termMap.push({kw:cleanKw,escKw:esc(cleanKw),defId:d.defId,rawTerm:d.rawTerm});
      }
    });
  });
  termMap.sort((a,b)=>b.escKw.length-a.escKw.length);
  const termRegex=termMap.length?new RegExp("("+termMap.map(x=>escapeRegExp(x.escKw)).join("|")+")","g"):null;
  const kwLookup={};
  termMap.forEach(x=>{kwLookup[x.escKw]=x});

  function linkTermsInHtml(htmlStr){
    if(!termRegex)return htmlStr;
    // 只在 HTML 标签外的纯文本节点中替换术语为蓝色可跳转链接
    return htmlStr.split(/(<a\b[^>]*>[\s\S]*?<\/a>|<span\s+class="nb-tag-chip">[\s\S]*?<\/span>|<[^>]+>)/g).map(chunk=>{
      if(chunk.startsWith("<"))return chunk;
      return chunk.replace(termRegex,match=>{
        const info=kwLookup[match];
        if(!info)return match;
        return `<a href="#${info.defId}" class="nb-term-link" data-jump="${info.defId}" title="点击跳转查看下方【${esc(info.rawTerm)}】详细注释">${match}<span class="nb-term-arr">↓</span></a>`;
      });
    }).join("");
  }

  function inlineFmt(s,enableTermLink=true){
    let t=esc(s);
    t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
    t=t.replace(/==(.+?)==/g,"<mark>$1</mark>");
    t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    t=t.replace(/\*(.+?)\*/g,"<em>$1</em>");
    t=t.replace(/【([^】]+)】/g,'<span class="nb-tag-chip">$1</span>');
    t=t.replace(/^([A-Za-z0-9\u4e00-\u9fa5（）()／/·\-]{2,14})([：:])/,"<strong>$1$2</strong>");
    if(enableTermLink)t=linkTermsInHtml(t);
    return t;
  }

  const out=[];
  if(defEntries.length){
    out.push(`<div class="nb-read-hint"><span>💡 概述中带蓝色虚线的 <b>专业术语↓</b> 可点击直接跳转到下方词条注释</span><span>共 ${defEntries.length} 个词条</span></div>`);
  }
  let i=0;
  while(i<lines.length){
    const ln=lines[i];
    if(!ln.trim()){i++;continue}
    if(/^(\s*[-*_]\s*){3,}$/.test(ln)){
      out.push('<hr class="nb-hr">');
      i++;continue;
    }
    if(ln.startsWith("```")){
      const code=[];i++;
      while(i<lines.length&&!lines[i].startsWith("```")){code.push(esc(lines[i]));i++}
      i++;
      out.push("<pre><code>"+code.join("\n")+"</code></pre>");
      continue;
    }
    const hm=ln.match(/^(#{1,4})\s+(.+)/);
    if(hm){
      const lv=hm[1].length;
      out.push(`<h${lv}>${inlineFmt(hm[2],false)}</h${lv}>`);
      i++;continue;
    }
    if(ln.startsWith(">")){
      const q=[];
      while(i<lines.length&&lines[i].startsWith(">")){q.push(inlineFmt(lines[i].replace(/^>\s?/,""),true));i++}
      out.push("<blockquote>"+q.join("<br>")+"</blockquote>");
      continue;
    }
    if(ln.startsWith("|")){
      const rows=[];
      while(i<lines.length&&lines[i].startsWith("|")){
        rows.push(lines[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
        i++;
      }
      if(rows.length){
        const head=rows[0];
        const body=rows.slice(1).filter(r=>!r.every(c=>/^:?-+:?$/.test(c)));
        out.push("<table><thead><tr>"+head.map(c=>`<th>${inlineFmt(c,false)}</th>`).join("")+"</tr></thead><tbody>"+
          body.map(r=>"<tr>"+r.map(c=>`<td>${inlineFmt(c,true)}</td>`).join("")+"</tr>").join("")+"</tbody></table>");
      }
      continue;
    }
    if(/^\s*([-*•]|\d+[.、])\s+/.test(ln)){
      const isOl=/^\s*\d+[.、]\s+/.test(ln);
      const tag=isOl?"ol":"ul";
      const lis=[];
      while(i<lines.length&&/^\s*([-*•]|\d+[.、])\s+/.test(lines[i])){
        const defId=lineToDefId[i];
        const cleanLine=lines[i].replace(/^\s*([-*•]|\d+[.、])\s+/,"");
        if(defId){
          lis.push(`<li class="nb-def-card" id="${defId}">`+inlineFmt(cleanLine,false)+"</li>");
        }else{
          lis.push("<li>"+inlineFmt(cleanLine,true)+"</li>");
        }
        i++;
      }
      out.push(`<${tag}>`+lis.join("")+`</${tag}>`);
      continue;
    }
    const p=[];
    while(i<lines.length&&lines[i].trim()&&!/^(\s*[-*_]\s*){3,}$/.test(lines[i])&&!lines[i].startsWith("#")&&!lines[i].startsWith(">")&&!lines[i].startsWith("|")&&!lines[i].startsWith("```")&&!/^\s*([-*•]|\d+[.、])\s+/.test(lines[i])){
      p.push(inlineFmt(lines[i],true));i++;
    }
    out.push("<p>"+p.join("<br>")+"</p>");
  }
  return out.join("");
}

/* ✨ 一键自动美化 Markdown 语法函数 */
function beautifyMarkdownText(raw){
  if(!raw||!raw.trim())return raw;
  const lines=raw.replace(/\r\n/g,"\n").split("\n");
  const res=[];
  const secPat=/^(?:[一二三四五六七八九十]+[、.．]\s*|\d+[.、．]\s*)?(整体定义|核心定义|定义|原理解释|核心原理|原理|Gate\s*标准|Gate|放行标准|质量控制|QC|结合案例|实战案例|案例演示|案例|防错要点|踩坑点|注意事项|总结|结论)\s*[：:]?\s*(.*)$/i;
  for(let i=0;i<lines.length;i++){
    let ln=lines[i].trimEnd();
    if(!ln.trim()){
      res.push("");
      continue;
    }
    // 已经是分割线或标题则保留
    if(/^(\s*[-*_]\s*){3,}$/.test(ln)||ln.startsWith("#")){
      res.push(ln);
      continue;
    }
    // 识别「整体定义 / 原理解释 / Gate 标准 / 案例」等模块行，自动加分割线与 H2 加粗标题
    const sm=ln.trim().match(secPat);
    if(sm){
      if(res.length&&res[res.length-1]!=="---"&&res.some(x=>x.trim())){
        if(res[res.length-1]!=="")res.push("");
        res.push("---");
        res.push("");
      }
      res.push(`## **${sm[1].trim()}**`);
      if(sm[2]&&sm[2].trim()){
        res.push(`- ${sm[2].trim()}`);
      }
      continue;
    }
    // 识别「xxx：yyy」结构自动转为列表 + 冒号前加粗
    const kv=ln.trim().match(/^([-*•]?\s*)([A-Za-z0-9\u4e00-\u9fa5（）()／/·\s]{2,14})([：:])\s*(.+)$/);
    if(kv&&!kv[2].includes("**")){
      res.push(`- **${kv[2].trim()}**${kv[3]} ${kv[4]}`);
      continue;
    }
    res.push(ln);
  }
  return res.join("\n").replace(/\n{3,}/g,"\n\n");
}

/* 导图绘制 */
function collect(n,depth,parent){
  const it={n,depth,parent,children:[]};
  items.push(it);
  if(n===tab.root||tab.open.has(n._k))it.children=(n.c||[]).map(c=>collect(c,depth+1,it));
  return it;
}
function buildNodeBadgeHtml(n){
  const hn=hasNote(n),hc=caseCount(n)>0;
  if(!hn&&!hc)return "";
  return `<span class="nb-node-badges">${hn?'<i class="nb-badge-dot nb-badge-note" title="已写笔记"></i>':""}${hc?'<i class="nb-badge-dot nb-badge-case" title="已写案例"></i>':""}</span>`;
}
function updateNodeBadgeInMap(n){
  if(!n)return;
  const btn=plane.querySelector(`[data-k="${CSS.escape(n._k)}"]`);
  if(!btn)return;

}
function makeNode(it){
  const n=it.n,k=kind(n),wrap=document.createElement("div");wrap.className="nb-node";
  const b=document.createElement("button");b.type="button";
  b.className="nb-node-button d"+Math.min(it.depth,3)+(k==="root"?" nb-node-root":k==="gate"?" nb-node-gate":"")+(hits.includes(n)?" nb-hit":"");
  b.innerHTML=esc(n.t)+buildNodeBadgeHtml(n);
  b.dataset.k=n._k;b.setAttribute("aria-pressed",String(n===cur));
  b.addEventListener("click",()=>select(n));wrap.append(b);
  if(n.c&&n.c.length&&k!=="root"){
    const op=tab.open.has(n._k),t=document.createElement("button");t.type="button";t.className="nb-node-toggle";
    t.textContent=op?"‹":"›";t.title=(op?"收起":"展开")+"（"+n.c.length+" 项）";t.setAttribute("aria-label",(op?"收起":"展开")+n.t);t.setAttribute("aria-expanded",String(op));
    t.addEventListener("click",()=>{op?tab.open.delete(n._k):tab.open.add(n._k);renderMap(true);reveal(n,true);const f=plane.querySelector(`[data-x="${CSS.escape(n._k)}"]`);if(f)f.focus({preventScroll:true})});
    t.dataset.x=n._k;wrap.append(t);
  }
  plane.append(wrap);it.el=wrap;
}
function applyView(){
  plane.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;
  edges.setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.scale})`);
  $("nb-zoom").textContent=Math.round(view.scale*100)+"%";
  $("nb-zoom-out").disabled=view.scale<=.5;
  $("nb-zoom-in").disabled=view.scale>=1.6;
}
function fit(){
  const w=stage.clientWidth,h=stage.clientHeight;
  view.scale=Math.max(.85,Math.min(1,(w-24)/totalW,(h-24)/totalH));
  view.x=totalW*view.scale>w-24?12:(w-totalW*view.scale)/2;
  if(totalH*view.scale>h-24){
    const r=items[0];
    view.y=r?h/2-(r.y+r.h/2)*view.scale:12;
    view.y=Math.min(12,view.y);
  }else view.y=(h-totalH*view.scale)/2;
  applyView();
}
function reveal(n,withKids){
  const it=items.find(i=>i.n===n);if(!it)return;
  const arr=withKids?[it,...it.children]:[it];
  const l=Math.min(...arr.map(a=>a.x))*view.scale,r=Math.max(...arr.map(a=>a.x+a.w))*view.scale,t=Math.min(...arr.map(a=>a.y))*view.scale,b=Math.max(...arr.map(a=>a.y+a.h))*view.scale,w=stage.clientWidth,h=stage.clientHeight,m=12;
  if(r-l<w-2*m){if(r+view.x>w-m)view.x=w-m-r;if(l+view.x<m)view.x=m-l}else view.x=m-it.x*view.scale;
  if(b-t<h-2*m){if(b+view.y>h-m)view.y=h-m-b;if(t+view.y<m)view.y=m-t}else view.y=h/2-(it.y+it.h/2)*view.scale;
  applyView();
}
function markActive(){
  if(!cur)return;
  plane.querySelectorAll("[data-k]").forEach(b=>b.setAttribute("aria-pressed",String(byKey[b.dataset.k]===cur)));
  const anc=new Set([cur,...ancestors(cur)].map(n=>n._k));
  edges.querySelectorAll("path").forEach(p=>p.classList.toggle("nb-active",anc.has(p.dataset.to)));
}
function renderMap(keepView){
  if(!stage.clientWidth)return;
  items=[];const top=collect(tab.root,0,null);plane.replaceChildren();edges.replaceChildren();items.forEach(makeNode);
  const widths=[];for(const it of items){it.w=it.el.offsetWidth;it.h=it.el.offsetHeight;widths[it.depth]=Math.max(widths[it.depth]||0,it.w)}
  const gap=stage.clientWidth<440?24:32,xs=[0];widths.forEach((w,i)=>xs[i+1]=xs[i]+w+gap);
  let y=0;
  (function pos(it){
    it.x=xs[it.depth];
    if(it.children.length){it.children.forEach(pos);it.cy=(it.children[0].cy+it.children[it.children.length-1].cy)/2}
    else{it.cy=y+it.h/2+6;y+=it.h+12}
    it.y=it.cy-it.h/2;it.el.style.left=it.x+"px";it.el.style.top=it.y+"px";
  })(top);
  totalW=Math.max(...items.map(i=>i.x+i.w));totalH=Math.max(...items.map(i=>i.y+i.h))+12;
  for(const it of items)if(it.parent){
    const a=it.parent,x1=a.x+a.w,y1=a.cy,x2=it.x,y2=it.cy,mx=(x1+x2)/2,p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    p.dataset.to=it.n._k;edges.append(p);
  }
  markActive();
  if(!keepView){fit();if(cur&&cur!==tab.root)reveal(cur,false)}else applyView();
}
function zoom(d){
  const nx=Math.max(.5,Math.min(1.6,Math.round((view.scale+d)*100)/100)),cx=stage.clientWidth/2,cy=stage.clientHeight/2;
  view.x=cx-(cx-view.x)*nx/view.scale;view.y=cy-(cy-view.y)*nx/view.scale;view.scale=nx;applyView();
}
$("nb-zoom-out").onclick=()=>zoom(-.1);
$("nb-zoom-in").onclick=()=>zoom(.1);
$("nb-overview").onclick=()=>{tab.open=new Set();(tab.root.c||[]).forEach(c=>{if(c.c&&c.c.length)tab.open.add(c._k)});select(tab.root)};
$("nb-expand").onclick=()=>{(function f(n){if(n.c&&n.c.length){tab.open.add(n._k);n.c.forEach(f)}})(tab.root);renderMap()};

let drag=null;
stage.addEventListener("pointerdown",e=>{if(e.target.closest("button")||e.button!==0)return;drag={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y};stage.setPointerCapture(e.pointerId);stage.classList.add("nb-dragging")});
stage.addEventListener("pointermove",e=>{if(!drag)return;view.x=Math.max(40-totalW*view.scale,Math.min(stage.clientWidth-40,drag.ox+e.clientX-drag.x));view.y=Math.max(40-totalH*view.scale,Math.min(stage.clientHeight-40,drag.oy+e.clientY-drag.y));applyView()});
const stop=()=>{drag=null;stage.classList.remove("nb-dragging")};stage.addEventListener("pointerup",stop);stage.addEventListener("pointercancel",stop);
stage.addEventListener("wheel",e=>{e.preventDefault();if(e.ctrlKey||e.metaKey)zoom(e.deltaY<0?.1:-.1);else{view.x-=e.deltaX;view.y-=e.deltaY;applyView()}},{passive:false});

/* 监听笔记输入 */
$("nb-note-input").addEventListener("input",()=>{
  if(!cur)return;
  const entry=getEntry(cur);
  entry.note=$("nb-note-input").value;
  setEntry(cur,entry);
});

/* 监听案例输入 */
function onCaseInput(){
  if(!cur)return;
  const entry=getEntry(cur);
  if(!entry.cases.length)entry.cases=[{title:"",tag:"",body:""}];
  while(entry.cases.length<=activeCaseIdx)entry.cases.push({title:"",tag:"",body:""});
  entry.cases[activeCaseIdx]={
    title:$("nb-case-title-input").value,
    tag:$("nb-case-tag-input").value,
    body:$("nb-case-body-input").value
  };
  setEntry(cur,entry);
  const pill=$("nb-case-tabs").querySelector(`[data-cidx="${activeCaseIdx}"]`);
  if(pill){
    const t=$("nb-case-title-input").value.trim();
    pill.textContent=t||`案例 ${activeCaseIdx+1}`;
  }
}
$("nb-case-title-input").addEventListener("input",onCaseInput);
$("nb-case-tag-input").addEventListener("input",onCaseInput);
$("nb-case-body-input").addEventListener("input",onCaseInput);

/* Markdown 快捷工具栏操作 */
function activeTextarea(){
  return readMode==="note"?$("nb-note-input"):$("nb-case-body-input");
}
function insertAtCursor(ta,prefix,suffix="",defaultText=""){
  if(previewMode)setPreview(false);
  ta.focus();
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.substring(s,e)||defaultText;
  const rep=prefix+sel+suffix;
  ta.value=ta.value.substring(0,s)+rep+ta.value.substring(e);
  ta.selectionStart=s+prefix.length;
  ta.selectionEnd=s+prefix.length+sel.length;
  ta.dispatchEvent(new Event("input"));
}
$("nb-md-toolbar").addEventListener("click",e=>{
  const btn=e.target.closest("[data-md]");
  if(!btn)return;
  const act=btn.dataset.md;
  const ta=activeTextarea();
  if(act==="h2")insertAtCursor(ta,"\n## **","**\n","标题");
  else if(act==="h3")insertAtCursor(ta,"\n### **","**\n","小节标题");
  else if(act==="bold")insertAtCursor(ta,"**","**","重点文字");
  else if(act==="mark")insertAtCursor(ta,"==","==","高亮内容");
  else if(act==="hr")insertAtCursor(ta,"\n\n---\n\n","","");
  else if(act==="ul")insertAtCursor(ta,"\n- ","","列表项");
  else if(act==="quote")insertAtCursor(ta,"\n> **核心要点**：","","提示内容");
  else if(act==="tpl"){
    const tpl=`## **1. 整体定义**\n- **核心目标**：\n\n---\n\n## **2. 原理解释**\n- **底层逻辑**：\n- **关键防坑点**：\n\n---\n\n## **3. Gate 标准**\n- **检查方法与通过依据**：\n`;
    insertAtCursor(ta,ta.value.trim()?"\n\n"+tpl:tpl,"","");
  }
});

/* ✨ 一键美化排版按钮 */
$("nb-beautify-btn").onclick=()=>{
  const ta=activeTextarea();
  ta.value=beautifyMarkdownText(ta.value);
  ta.dispatchEvent(new Event("input"));
  setPreview(true);
};

/* 支持 Tab 缩进 */
[$("nb-note-input"),$("nb-case-body-input")].forEach(ta=>{
  ta.addEventListener("keydown",e=>{
    if(e.key==="Tab"){
      e.preventDefault();
      const s=ta.selectionStart,end=ta.selectionEnd;
      ta.value=ta.value.substring(0,s)+"  "+ta.value.substring(end);
      ta.selectionStart=ta.selectionEnd=s+2;
      ta.dispatchEvent(new Event("input"));
    }
  });
});

/* 案例切换、新增与删除 */
$("nb-case-tabs").addEventListener("click",e=>{
  const cbtn=e.target.closest("[data-cidx]");
  if(cbtn){
    activeCaseIdx=+cbtn.dataset.cidx;
    renderRightPane();
    return;
  }
  if(e.target.closest("#nb-case-add-btn")){
    if(!cur)return;
    const entry=getEntry(cur);
    if(!entry.cases.length)entry.cases=[{title:"",tag:"",body:""}];
    entry.cases.push({title:"",tag:"",body:""});
    activeCaseIdx=entry.cases.length-1;
    setEntry(cur,entry);
    if(previewMode)setPreview(false);else renderRightPane();
    $("nb-case-title-input").focus();
    return;
  }
  if(e.target.closest("#nb-case-del-btn")){
    if(!cur)return;
    const entry=getEntry(cur);
    if(!confirm("确定删除当前案例吗？"))return;
    if(entry.cases.length<=1){
      entry.cases=[];
      activeCaseIdx=0;
    }else{
      entry.cases.splice(activeCaseIdx,1);
      activeCaseIdx=Math.max(0,activeCaseIdx-1);
    }
    setEntry(cur,entry);
    renderRightPane();
  }
});

function autoPreviewFor(n,m){
  if(!n)return false;
  return m==="note"?hasNote(n):caseCount(n)>0;
}
function setRead(m){
  readMode=m;
  root.querySelectorAll("[data-read]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.read===m)));
  $("nb-note-panel").hidden=m!=="note";
  $("nb-case-panel").hidden=m!=="case";
  setPreview(autoPreviewFor(cur,m));
}
root.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>setRead(b.dataset.read));

function setPreview(p){
  previewMode=p;
  $("nb-mode-tabs").querySelectorAll("[data-mode]").forEach(b=>{
    b.setAttribute("aria-pressed",String((b.dataset.mode==="read")===p));
  });
  $("nb-md-toolbar").hidden=p;
  renderRightPane();
}
$("nb-mode-tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-mode]");
  if(b)setPreview(b.dataset.mode==="read");
});
[$("nb-note-preview"),$("nb-case-preview")].forEach(el=>{
  el.title="点击蓝色专业术语可跳转至下方注释；双击空白处可切换到编辑模式";
  el.addEventListener("click",e=>{
    const link=e.target.closest("[data-jump]");
    if(link){
      e.preventDefault();
      const target=el.querySelector("#"+CSS.escape(link.dataset.jump));
      if(target){
        target.scrollIntoView({behavior:"smooth",block:"center"});
        target.classList.remove("nb-def-flash");
        void target.offsetWidth;
        target.classList.add("nb-def-flash");
      }
    }
  });
  el.addEventListener("dblclick",e=>{
    if(e.target.closest("[data-jump]"))return;
    setPreview(false);
  });
});

/* 📋 一键复制全部已写内容给 AI */
$("nb-copy-all").onclick=async()=>{
  const records=[];
  const seen=new Set();
  Object.keys(store).forEach(k=>{
    if(k.includes("::"))return;
    const r=store[k];
    if(!r||seen.has(r.key))return;
    seen.add(r.key);
    records.push(r);
  });
  if(!records.length){
    alert("当前还没有保存任何笔记或案例内容。");
    return;
  }
  const text=records.map(r=>{
    const cs=validCases(r).map((c,i)=>`  [案例 ${i+1}] 标题：${c.title||"未命名"}（分类：${c.tag||"无"}）\n${c.body}`).join("\n\n");
    return `【节点】${r.path} (${r.key})\n【笔记】\n${r.note||"（空）"}\n${cs?`【案例演示】\n${cs}`:""}`;
  }).join("\n\n====================\n\n");
  try{
    await navigator.clipboard.writeText(text);
    const btn=$("nb-copy-all");
    const old=btn.textContent;
    btn.textContent="✅ 已复制！可直接粘贴给AI";
    setTimeout(()=>btn.textContent=old,2500);
  }catch(e){
    prompt("请按 Cmd+C 复制以下已写内容发给 AI：",text);
  }
};

/* 导出与导入 JSON 备份 */
$("nb-export").onclick=()=>{
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:store},null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  const d=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(blob);
  a.download=`实验室知识体系_笔记与案例备份_${d}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$("nb-import").onclick=()=>$("nb-import-file").click();
$("nb-import-file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      const incoming=parsed.data||parsed;
      if(typeof incoming==="object"&&incoming){
        Object.assign(store,incoming);
        localStorage.setItem(STORE_KEY,JSON.stringify(store));
        renderMap(true);
        renderRightPane();
        $("nb-save-state").textContent="已导入备份";
        $("nb-save-state").classList.add("saved");
      }
    }catch(err){
      alert("导入失败：JSON 文件格式不正确");
    }
    e.target.value="";
  };
  r.readAsText(f);
});

/* 节点选择与视图切换 */
function select(n,opts={}){
  ancestors(n).forEach(p=>{if(p!==tab.root)tab.open.add(p._k)});
  const prev=cur;cur=n;
  if(prev!==n)activeCaseIdx=0;
  renderMap(true);
  if(!opts.noReveal)reveal(n,false);
  if(opts.read)setRead(opts.read);
  else setPreview(autoPreviewFor(n,readMode));
  if(root.clientWidth<=650&&opts.mobile!==false&&prev)mobile("read");
  try{history.replaceState(null,"","#"+n._k)}catch(e){}
}
function renderViews(){
  $("nb-views").innerHTML=tabs.map(t=>`<button type="button" data-t="${t.id}" aria-pressed="${t===tab}">${esc(t.label)}</button>`).join("");
}
function goTab(id){
  tab=tabs.find(t=>t.id===id)||tabs[0];
  renderViews();hits=[];$("nb-q").value="";$("nb-qn").textContent="点节点写笔记/案例";
  cur=null;renderMap();select(tab.root,{mobile:false});
}
function mobile(v){
  root.dataset.mobile=v;
  root.querySelectorAll("[data-mobile]").forEach(b=>b.tagName==="BUTTON"&&b.setAttribute("aria-pressed",String(b.dataset.mobile===v)));
  if(v==="map")requestAnimationFrame(()=>renderMap());
}
root.querySelectorAll("button[data-mobile]").forEach(b=>b.onclick=()=>mobile(b.dataset.mobile));
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t){goTab(t.dataset.t);return}
});

/* 搜索节点标题、个人笔记、个人案例 */
$("nb-q").addEventListener("input",()=>{
  const q=$("nb-q").value.trim().toLowerCase();hits=[];hitI=-1;
  if(q){
    (function f(n){
      const e=getEntry(n);
      const caseTxt=(e.cases||[]).map(c=>`${c.title} ${c.tag} ${c.body}`).join(" ");
      const hay=(n.t+" "+e.note+" "+caseTxt).toLowerCase();
      if(n!==tab.root&&hay.includes(q))hits.push(n);
      (n.c||[]).forEach(f);
    })(tab.root);
    hits.forEach(h=>ancestors(h).forEach(p=>{if(p!==tab.root)tab.open.add(p._k)}));
  }
  $("nb-qn").textContent=q?`${hits.length} 处 · 回车跳转`:"点节点写笔记/案例";
  renderMap();
});
$("nb-q").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&hits.length){
    hitI=(hitI+1)%hits.length;
    select(hits[hitI],{mobile:false});
    $("nb-qn").textContent=`${hitI+1} / ${hits.length}`;
  }
});

let last="";
new ResizeObserver(()=>{
  layout();
  const s=stage.clientWidth+":"+stage.clientHeight;
  if(s!==last&&stage.clientWidth){last=s;requestAnimationFrame(()=>renderMap())}
}).observe(root);

layout();mobile("map");
const h=decodeURIComponent(location.hash.slice(1));
if(h&&byKey[h]){
  tab=tabs.find(t=>h===t.id||h.startsWith(t.id+"."));
  renderViews();cur=null;renderMap();select(byKey[h],{mobile:false});
}else if(tabs.length){
  goTab("learn");
}
})();
</script>
