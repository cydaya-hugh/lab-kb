    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：严格落实 AKTA 上机前的 **三大准备铁律**——**Buffer 0.22µm抽滤与超声脱气**、**样品高速离心/过滤** 以及 **A/B泵Pump Wash与上样环（Sample Loop）润洗排空**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Buffer 0.22µm抽滤与超声脱气】**：未过滤的缓冲液中含有肉眼看不见的纤维尘埃和未溶盐晶，一旦打进 AKTA 会卡死精密单向阀（导致泵压力剧烈跳动）并堵死层析柱顶筛板；而从 4°C 拿出来的液体溶有大量空气，进泵加压再减压后会析出微气泡卡在柱头和紫外流通池里。因此 **所有上 AKTA 的水、乙醇、Buffer 必须 100% 经 0.22 µm 滤膜真空抽滤并超声脱气 15 min**！\n- **【样品高速离心/过滤】**：浓缩后的蛋白样品上机前必须 **4°C, 12,000 × g 离心 10 min**（取上清，绝不触碰管底微沉淀）或过 0.22 µm 低吸附 PES 针头滤器。\n- **【A/B泵Pump Wash与上样环（Sample Loop）润洗排空】**：\n  - 将 A1 进液管放入 Buffer A，B1 放入 Buffer B，在软件上执行 `Pump Wash`（用大流速抽吸排尽泵头腔体内的残余乙醇和气泡）；\n  - 切换进样阀至 `Load（装样）` 状态，用注射器吸取 **3–5 倍上样环体积的 Buffer A** 从进样口推入，洗净上样环内上一个人留下的残液并排空空气，然后再切换至 `Inject` 冲洗管路。",
    "cases": [

    "key": "learn.0.2.2.1",
    "path": "基础知识学习 / ⓪ 实验室 Buffer 化学体系与层析设备工程基石 (Buffer & Column Foundation) / 手工柱(重力柱/蠕动泵)与全自动AKTA设备操作SOP / 全自动AKTA纯化工作站标准操作SOP / 柱前硬件压限设定、UV280/UV260/电导三曲线判读与关机20%乙醇封存",
    "title": "柱前硬件压限设定、UV280/UV260/电导三曲线判读与关机20%乙醇封存",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 AKTA 运行中的 **柱前硬件压限（Pre-column Pressure Limit）设定**、**UV₂₈₀/UV₂₆₀/电导率三曲线实时判读** 以及 **实验结束纯水冲盐与20%乙醇封存关机 SOP**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【柱前硬件压限（Pre-column Pressure Limit）设定】**：接柱前必须在软件 `Alarm / Pressure` 中设死当前柱型的最高耐受压力（一旦超压 AKTA 会自动停泵保柱）：\n  - `HiTrap / HisTrap 1 mL & 5 mL`：**上限 0.5 MPa（推荐工作压 < 0.3 MPa）**；\n  - `Superdex 200 / 75 Increase 10/300 GL`：**上限 3.0 MPa（推荐流速 0.4–0.5 mL/min）**。\n- **【UV₂₈₀/UV₂₆₀/电导率三曲线实时判读】**：\n  - `UV 280 nm（深蓝线）> UV 260 nm（红线）`（且比值 A₂₆₀/A₂₈₀ ≈ 0.55–0.65）：**纯正的蛋白质洗脱峰**！\n  - `UV 260 nm（红线）> UV 280 nm（深蓝线）`：**核酸（DNA/RNA）污染峰或高浓度咪唑本底**！\n  - `Cond 电导率（棕线）`：反映盐浓度变化；在平衡阶段必须等到 **UV 基线与电导率曲线双双走成水平直线**，才算柱子真正平衡好！\n- **【实验结束纯水冲盐与20%乙醇封存关机 SOP】**：\n  - **绝对禁止跑完含盐 Buffer 直接关电源走人**！（Buffer 里的 NaCl 和磷酸盐在蓝宝石单向阀和柱塞杆上干涸结晶后，下次开机直接划伤密封圈导致漏液报废）；\n  - **关机三步曲**：① 拆下层析柱（柱子本身按规程转入 20% 乙醇封存）并接上直通接头（Union）；② 把 A/B 进液管放入脱气超纯水跑 `System Wash` 冲净所有盐分；③ 把 A/B 进液管放入 **脱气 20% 乙醇** 跑 `Pump Wash + System Wash`，让整个泵头、管路和紫外流通池充满 20% 乙醇后再关机！",
    "cases": [
      {
        "title": "项目实战案例：凭 AKTA 双波长（280 nm vs. 260 nm）一眼识别并切弃核酸假峰",
        "tag": "实验室实战案例",
        "body": "- 跑 Q 阴离子柱梯度洗脱时出现两个大峰：第一个峰在 220 mM NaCl（280 nm 蓝线高、260 nm 红线只有蓝线的一半），第二个峰在 680 mM NaCl（260 nm 红线比 280 nm 蓝线高出一倍）。凭双波长曲线当场判定第一峰为高纯 Ro52 蛋白，第二峰为大肠杆菌核酸，精准切峰一步达标。"
      }

  "learn.0.3": {
    "key": "learn.0.3",
    "path": "基础知识学习 / ⓪ 实验室 Buffer 化学体系与层析设备工程基石 (Buffer & Column Foundation) / Gate R0｜全工序标准Buffer速查总表与层析上机前点检红线",
    "title": "Gate R0｜全工序标准Buffer速查总表与层析上机前点检红线",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：汇总全实验室从 **③ 上游破壁 → ④ 下游亲和/阴阳离子/分子筛 → ⑤ 偶联呈现 → ⑥ 冻存制剂** 的 **全工序标准Buffer配方与配伍禁忌速查总表**，并作为每次层析实验开机前的 **Gate R0 基础点检门禁**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【全工序标准Buffer配方与配伍禁忌速查总表】**：将散落在各工序的 Buffer 统一纳入标准化配方编号管理，明确每一瓶 Buffer 的 **目标 pH（注明温度）、电导率范围、现加活性组分（PMSF/TCEP/Zn²⁺）与下游绝对禁区**。\n- **【Gate R0 基础点检门禁】**：纯化/偶联实验开始前 10 分钟的强制点检动作（查 pH、查滤膜脱气、查柱床状态、查压限、查配伍禁忌）。\n\n---\n\n## **3. 全实验室各工序标准 Buffer 配方与禁忌总表（V2.1 受控速查卡）**\n| 所属工序 | Buffer 名称 | 标准配方（以含 Zn²⁺ 指环蛋白 Ro52 为例） | 关键质控参数 | 绝对配伍禁区（踩中即报废） |\n|---|---|---|---|---|\n| **③ 上游破壁** | **Lysis Buffer (破壁液)** | 25 mM HEPES (或 Tris) pH 7.5, **500 mM NaCl**, 20 mM 咪唑, 5% 甘油, 0.5 mM TCEP, **20 µM ZnCl₂**, **现加 1 mM PMSF** | 4°C 预冷；超声全程 < 10°C | **严禁加 EDTA/EGTA**（夺锌+剥镍）；PMSF 必须在破壁前 5 min 现加 |\n| **④ Ni-NTA 柱** | **Ni-A (结合) / Ni-W (洗杂) / Ni-B (洗脱)** | 25 mM HEPES pH 7.5, 300–500 mM NaCl, **20 mM (A) / 50 mM (W) / 250 mM (B) 咪唑**, 5% 甘油, 0.5 mM TCEP, 20 µM ZnCl₂ | **250–500 mM 咪唑配完必用盐酸调回 pH 7.5** | **严禁 DTT > 2 mM**（把镍柱还原变黑）；洗脱后必须当天除咪唑 |\n| **④ Amylose 柱** | **MBP 结合液 / 麦芽糖洗脱液** | 20 mM HEPES pH 7.4, 200 mM NaCl, 0.5 mM TCEP, 20 µM ZnCl₂（洗脱液 **+ 10 mM 麦芽糖**） | 上样流速 ≤ 1 mL/min | 培养基与破壁液 **禁含葡萄糖与淀粉酶**；柱再生 **禁用 0.5 M NaOH 强碱**（用 0.1% SDS） |\n| **④ 阴离子柱 (AEX)** | **Q-A (低盐) / Q-B (高盐)** | 25 mM **Tris-HCl (或 HEPES) pH 8.0 (pH > pI+1)**, **20 mM NaCl (A) / 1000 mM NaCl (B)**, 5% 甘油, 0.5 mM TCEP | **上样液电导率必须稀释至 < 5 mS/cm** | 高盐（>100 mM NaCl）未稀释直接上样会导致 100% 流穿 |\n| **④ 阳离子柱 (CEX)** | **SP-A (低盐) / SP-B (高盐)** | 25 mM **MES (或磷酸钠/HEPES) pH 6.0–6.5 (pH < pI-1)**, **20 mM NaCl (A) / 1000 mM NaCl (B)**, 5% 甘油 | 上样电导率 < 5 mS/cm；用完封存于 **0.2 M 乙酸钠 + 20% 乙醇** | 避免使用 Tris 阳离子缓冲盐；不可将 pH 调至恰好等于蛋白 pI |\n| **④ 分子筛 (SEC)** | **SEC 运行/抛光液** | 20 mM HEPES (或 K-PBS) pH 7.4, 150–300 mM NaCl, 0.5 mM TCEP, 20 µM ZnCl₂, 5% 甘油 | 0.22 µm 抽滤 + 超声脱气 15 min；上样 ≤ 500 µL | 一步切换至无伯胺终 Buffer；**8.0–8.5 mL 死体积聚体峰必须 100% 切弃** |\n| **⑤ 偶联呈现** | **NHS 生物素化 / EDC 磁珠偶联液** | NHS 偶联：**20 mM HEPES 或 PBS pH 7.4–7.8**, 150 mM NaCl<br>EDC 羧基活化：**25 mM MES pH 6.0** | 蛋白浓度 ≥ 1.0 mg/mL | NHS 偶联 **绝对禁 Tris/甘氨酸/咪唑/硫酸铵**；EDC 活化 **绝对禁醋酸盐/柠檬酸盐**；HRP 体系 **绝对禁 NaN₃** |\n| **⑥ 冻存制剂** | **Storage 防冻原液配方** | 20 mM **HEPES 或全钾盐 K-PBS pH 7.4**, 150 mM NaCl, 0.5 mM TCEP, **5%–8% 海藻糖（或 20%–50% 超纯甘油）+ 0.01% Tween-20** | 0.22 µm PES 低吸附膜过滤，小规格单次分装速冻 | **严禁用无保护剂的普通钠盐 PBS 慢冻**（共晶 pH 暴跌至 3.6）；**严禁用还原糖（葡萄糖）或劣质含醛甘油** |",

    "path": "基础知识学习 / ① 前沿调研与立项策划 (SOTA & Gate R1)",
    "title": "① 前沿调研与立项策划 (SOTA & Gate R1)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：按“**先定临床用途与检测平台** → **再拆靶点序列与一至四级空间结构** → **后查文献证据矩阵与专利自由实施（FTO）** → **最后锁定工序①质检标准与Gate R1放行**”的四步逻辑完成立项策划。\n- **为什么要调整成这个顺序**：过去一上来先查序列，却没问清客户到底是用在 **化学发光磁珠**、**ELISA微孔板** 还是 **胶乳比浊** 上；用途不同，抗原的标签去留、缓冲液配方（能不能含 Tris 氨基）和验收重点完全不同！“用途决定设计，设计决定验收”。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【临床用途与检测平台】**：明确该原料在客户端怎么用（如间接法抓患者 IgG 抗体，还是双抗体夹心法测抗原？直接疏水吸附包被，还是生物素化后挂链霉亲和素 SA 磁珠？）。\n- **【靶点序列与一至四级空间结构】**：从 UniProt 唯一基准序列出发，拆解蛋白质的局部螺旋/折叠（二级）、独立结构域边界（三级）以及天然寡聚状态（四级），找出表位区与易聚集区。\n- **【文献证据矩阵与专利自由实施（FTO）】**：把多篇文献的片段坐标、表达宿主和临床样本表现列成对比矩阵，并排查核心序列与标签方案无专利侵权风险、外协技术有正式授权合同。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项铁律**：立项评审（Gate R1）不是走形式签字，而是核对四张清单 —— ① 客户平台与用途规格单、② 序列与结构域风险图、③ 文献证据与候选路线矩阵、④ 预设验收标准表。",
    "cases": [
      {
        "title": "Ro52 立项四步逻辑闭环推演",
        "tag": "实战案例",
        "body": "## **1. 四步立项推演链**\n1. **定用途**：用于自身免疫抗 Ro52 IgG 抗体检测（兼容 ELISA 直接包被与化学发光羧基磁珠偶联/SA 生物素捕获） → 决定最终成品 **必须切除 MBP 大标签，且交付缓冲液不能含 Tris 伯氨基**。\n2. **拆结构**：锁定 UniProt `P19474 (1–475 aa)`，识别出 N 端锌指（需补 Zn²⁺ 禁 EDTA）、中间 Coiled-Coil 二聚体主表位区（易聚成包涵体）及 C 端 PRY/SPRY 域（易非特异结合人 IgG Fc）。\n3. **锚路线**：确立“全长 1–475 aa 基准参照 + 核心表位截短体 125–268 aa”双路线平行验证。\n4. **锁 Gate R1**：明确 SDS-PAGE 纯度 ≥90%、SEC 二聚体 ≥85%、50 例参比血清盘符合率 ≥95% 为硬性验收线。"
      }
    ],

    "title": "临床用途与终端平台定义",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在立项第一步明确原料的 **终端检测平台（化学发光/ELISA/胶乳比浊/免疫印迹）**、**固相包被方式（物理吸附/共价偶联/生物素-SA捕获）** 以及 **标杆参照品（Benchmark）**，将模糊的“客户要某抗原”转化为精确的物理化学与免疫学输入参数。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【终端检测平台】**：客户端使用该原料的仪器体系。化学发光（CLIA）动态范围最宽但对微量聚集体导致的本底极敏感；胶乳增强免疫比浊（PETIA）耗量最大（毫克级）且要求极高浓度稳定性；ELISA 与免疫印迹（LIA/Dot）要求高特异吸附。\n- **【固相包被方式】**：把抗原固定在磁珠或塑料板上的方法：\n  - **物理疏水吸附**：直接溶在碳酸盐或 PBS 里涂板（要求抗原里绝对不能含 Tween-20 等去垢剂）；\n  - **EDC/NHS 羧基共价偶联**：把抗原表面的氨基（-NH₂）焊在羧基磁珠上（要求抗原缓冲液里绝对不能含 Tris、甘氨酸或铵盐）；\n  - **生物素-链霉亲和素（Biotin-SA）定向捕获**：给抗原贴上生物素，挂到 SA 磁珠上（要求控制标记比并 100% 除尽游离生物素）。\n- **【标杆参照品（Benchmark）】**：市场上公认的头部对照试剂盒（如自免领域的欧蒙 Euroimmun、Phadia、亚辉龙等）或公司上一代合格参比批，用来作为内部考卷的“标准答案”。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项第一问**：研发提交立项书时，先看有没有写清 **“客户用什么固相载体、怎么挂上去”**！如果连客户是做直接包被还是做 NHS 共价偶联都没问清，下游纯化最后一步换什么 Buffer 必然做错！",
    "cases": [
      {
        "title": "同一款 Ro52 抗原面向三种不同客户端平台的规格差异表",
        "tag": "实战案例",
        "body": "## **1. 终端平台决定交付规格**\n| 客户端检测平台 | 固相连接方式 | 成品 Buffer 要求 | 关键质控侧重点 |\n|---|---|---|---|\n| **ELISA / 线性免疫印迹 (LIA)** | 聚苯乙烯板 / NC 膜物理吸附 | PBS 或 Tris 均可，**严禁含 Tween-20 等去垢剂** | 构象与线性表位兼顾，绝对无 MBP 标签背景 |\n| **磁微粒化学发光 (羧基磁珠)** | EDC/NHS 氨基共价偶联 | **必须用 PBS / HEPES（严禁含 Tris / 甘氨酸）** | SEC-HPLC 死体积聚集峰 ≤5%（防发光本底跳值） |\n| **磁微粒化学发光 (SA 磁珠)** | Biotin-Ro52 定向捕获 | PBS + 稳定剂，**游离生物素 100% 除尽** | 必须完成“SA 捕获 + 阳性血清识别”双重验证 |"
      }
    ],

    "title": "检测平台与固相载体匹配: 发光磁珠/ELISA/胶乳比浊",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握主流 IVD 免疫诊断平台 —— **磁微粒化学发光（CLIA）**、**酶联免疫吸附（ELISA）**、**胶乳增强免疫比浊（PETIA）** 与 **免疫层析/印迹（POCT/Blot）** 对生物活性原料在纯度、浓度、聚集态和缓冲液成分上的刚性约束。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【磁微粒化学发光（CLIA）】**：目前医院检验科最主流的高敏自动化平台（如吖啶酯直接发光或 ALP/HRP 酶促发光）。信噪比极高（跨越 5–6 个数量级），哪怕抗原里有 5% 的死蛋白聚集体或微量细菌杂蛋白，也会在阴性样本上被放大成高背景（假阳性）。\n- **【酶联免疫吸附（ELISA）】**：利用 96 孔聚苯乙烯微孔板疏水吸附抗原，加病人血清、再加酶标二抗（如 HRP-抗人 IgG）显色读 OD₄₅₀，也是原料厂内部自检最常用的基准平台。\n- **【胶乳增强免疫比浊（PETIA）】**：把抗原或抗体高密度包被在纳米聚苯乙烯胶乳微球表面，遇到样本中的靶标后微球互相搭桥聚集成大团，用浊度变化定量（如本公司 SAA、CRP、RF、CCP 胶乳项目），对原料批间等电点（pI）和浓度要求极严。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **平台适配必查**：立项书必须明确写出目标平台名称及对应的 **缓冲液禁入物清单**（如发光偶联禁 Tris、物理吸附禁去垢剂、酶标体系禁叠氮钠 NaN₃——因为叠氮钠会毒死 HRP 辣根过氧化物酶！）。",
    "cases": [
      {
        "title": "Ro52 适配化学发光与 ELISA 双平台的通用交付设计",
        "tag": "实战案例",
        "body": "## **1. 跨平台通用型 Ro52 母液设计**\n- 为了让同一批 Ro52 原液既能卖给做 ELISA/印迹的客户，又能卖给做羧基磁珠化学发光偶联或生物素标记的客户，我们将纯化终点母液统一锁定为：\n  - **通用无氨基配方**：`20 mM PB / K-PBS (pH 7.5) + 300 mM NaCl + 0.5 mM TCEP + 10% Glycerol`（**零 Tris、零甘氨酸、零去垢剂、零叠氮钠**），实现一料通配三大平台。"

    "title": "参照品锚定与临床目标样本界定",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在项目启动时锁定 **标杆参照产品（Reference Product）** 或内部黄金参比批，建立分层的 **临床目标血清盘（含强阳、临界弱阳、健康阴性及疾病干扰阴性）**，并把客户的 **商务与法规硬条款（如到货剩余效期、冷链要求）** 一并纳入立项输入。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【标杆参照产品（Reference Product）】**：客户端正在使用的进口原研原料或行业金标准试剂盒（如欧蒙抗 Ro52 检测试剂盒）。研发不能自己闭门造车说“有信号就行”，必须跟标杆参照品同台测同一批样本，符合率达标才算合格。\n- **【临床目标血清盘】**：用来给新原料考试的标准样本库，必须包含四类样本：① 强/中阳性样本；② **临界弱阳性样本（Cutoff 附近，最容易漏检）**；③ 健康人阴性样本；④ **交叉干扰阴性样本（如高 RF、高总 IgG、其他自免阳性但目标抗体阴性的样本）**。\n- **【商务与法规硬条款】**：客户质量协议里签死的交付门槛（例如亚辉龙要求原料到货时剩余有效期必须 ≥24 个月，2–8°C 或干冰冷链运输，变更必须提前书面通知）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **参照与样本必查**：立项时如果既没有标杆参照品（或参比试剂盒定值血清），也没有明确临床弱阳性样本来源，说明项目处于“盲人摸象”状态，Gate R1 不予通过！",
    "cases": [
      {
        "title": "亚辉龙效期条款与诺唯赞评测教训在 Ro52 立项中的前置转化",
        "tag": "公司实录案例",
        "body": "## **1. 两条自家历史经验的前置转化（源自全景知识库 §5.1）**\n1. **效期前置（亚辉龙 DNA-Ag 05 协议要求）**：大客户协议通常要求“到货剩余效期 ≥24 个月”。因此在 Ro52 立项第一天就必须规划好 **37°C 加速稳定性 + 36 个月实时稳定性留样计划**，否则做出来也签不了供货协议。\n2. **盲测前置（诺唯赞评测教训）**：吸取过往样品未做足临界样本对比即外发导致符合率仅 81% 的教训，立项即规定：**内部必须建齐 50 例经欧蒙/化学发光标杆定值的参考血清盘（含 ≥5 例弱阳 + 10 例高 IgG/RF 干扰阴性）**。"

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在项目启动时锁定 **标杆参照产品（Reference Product）** 或内部黄金参比批，建立分层的 **临床目标血清盘（含强阳、临界弱阳、健康阴性及疾病干扰阴性）**，并把客户的 **商务与法规硬条款（如到货剩余效期、冷链要求）** 一并纳入立项输入。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【标杆参照产品（Reference Product）】**：客户端正在使用的进口原研原料或行业金标准试剂盒（如欧蒙抗 Ro52 检测试剂盒）。研发不能自己闭门造车说“有信号就行”，必须跟标杆参照品同台测同一批样本，符合率达标才算合格。\n- **【临床目标血清盘】**：用来给新原料考试的标准样本库，必须包含四类样本：① 强/中阳性样本；② **临界弱阳性样本（Cutoff 附近，最容易漏检）**；③ 健康人阴性样本；④ **交叉干扰阴性样本（如高 RF、高总 IgG、其他自免阳性但目标抗体阴性的样本）**。\n- **【商务与法规硬条款】**：客户质量协议里签死的交付门槛（例如亚辉龙要求原料到货时剩余有效期必须 ≥24 个月，2–8°C 或干冰冷链运输，变更必须提前书面通知）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **参照与样本必查**：立项时如果既没有标杆参照品（或参比试剂盒定值血清），也没有明确临床弱阳性样本来源，说明项目处于“盲人摸象”状态，Gate R1 不予通过！",
    "cases": [
      {
        "title": "亚辉龙效期条款与诺唯赞评测教训在 Ro52 立项中的前置转化",
        "tag": "公司实录案例",
        "body": "## **1. 两条自家历史经验的前置转化（源自全景知识库 §5.1）**\n1. **效期前置（亚辉龙 DNA-Ag 05 协议要求）**：大客户协议通常要求“到货剩余效期 ≥24 个月”。因此在 Ro52 立项第一天就必须规划好 **37°C 加速稳定性 + 36 个月实时稳定性留样计划**，否则做出来也签不了供货协议。\n2. **盲测前置（诺唯赞评测教训）**：吸取过往样品未做足临界样本对比即外发导致符合率仅 81% 的教训，立项即规定：**内部必须建齐 50 例经欧蒙/化学发光标杆定值的参考血清盘（含 ≥5 例弱阳 + 10 例高 IgG/RF 干扰阴性）**。"
      }

    "title": "靶点序列与空间结构拆解 (五级深度解析)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：从 **UniProt基准序列** 出发，全面拆解靶蛋白的 **一至四级空间结构**、**结构域边界**、**翻译后修饰（PTM）** 与 **金属配位辅因子**，在纸面上就把“哪里是表位、哪里会抱团进包涵体、哪里会惹出非特异假阳性”摸得一清二楚。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【UniProt基准序列】**：蛋白质的全球唯一标准户籍号与氨基酸序列（如 Ro52 为 `P19474 v1, 1–475 aa`）。\n- **【一至四级空间结构】**：从氨基酸顺序（一级）、局部 α-螺旋/β-折叠（二级）、独立折叠模块/结构域（三级）到多条链组装成的二聚体/八聚体（四级）的完整立体层级。\n- **【结构域边界】**：每个独立折叠模块（Domain）的起止氨基酸门牌号；工程截短只能顺着模块之间的连接缝（无规卷曲）下刀，绝不能切在模块肚子中间。\n- **【翻译后修饰（PTM）与金属配位辅因子】**：蛋白折叠所需的糖链、二硫键或金属离子（如锌指蛋白必需的 Zn²⁺），直接决定用什么宿主表达、培养基和 Buffer 里该补什么、禁什么。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **结构拆解三张图**：立项报告必须附上 ① 带版本号的基准氨基酸序列、② 结构域边界划分图（标清起止 aa）、③ 疏水风险区与 PTM/金属离子核查结论。",
    "cases": [
      {
        "title": "Ro52 (TRIM21) 全长 475 aa 四大结构域拆解总图",
        "tag": "实战案例",
        "body": "## **1. Ro52 结构域精确门牌号（基于 UniProt P19474-1）**\n- **`1–15 aa`**：N 端短前导无序区\n- **`16–55 aa` 【RING 结构域】**：结合 2 个 Zn²⁺ 离子的经典锌指域（E3 泛素连接酶活性中心）\n- **`92–123 aa` 【B-box 2 结构域】**：结合 Zn²⁺ 的次级锌指辅助域\n- **`128–238 aa` 【Coiled-Coil 卷曲螺旋域】**：长 α-螺旋，**既是驱动两条链拧成反平行同源二聚体的骨架、又是患者抗 Ro52 自身抗体的头号免疫优势区（含 p200 表位 200–239 aa），同时也是裸蛋白在细菌里抱团成包涵体的疏水重灾区**\n- **`268–475 aa` 【PRY/SPRY (B30.2) 结构域】**：C 端球状 β-折叠域，**天然高亲和力结合人 IgG 的 Fc 段（血清学假阳性隐患源）**"
      }

  "learn.1.1.0": {
    "key": "learn.1.1.0",
    "path": "基础知识学习 / ① 前沿调研与立项策划 (SOTA & Gate R1) / 靶点序列与空间结构拆解 (五级深度解析) / 氨基酸序列获取: UniProt标准序列与异构体辨析",
    "title": "氨基酸序列获取: UniProt标准序列与异构体辨析",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心原则**：任何重组蛋白项目的起点，都是从 **UniProt** 锁定唯一的、受控的 **氨基酸基准序列** 及其 **异构体**，并登记明确的 **登录号与序列版本**。\n- **为什么要锁死**：避免团队内部误用截短体、突变体或不同物种序列，导致后续 ==引物设计、质粒构建和表位坐标全部错位==。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【UniProt】**：全球最权威的蛋白质序列与功能数据库（相当于蛋白质界的“国家标准户籍库”），网址为 `uniprot.org`。\n- **【氨基酸基准序列（Canonical Sequence）】**：同一个基因在数据库里被指定为“默认主代表”的那条全长标准氨基酸序列（编号通常为 `-1`），是所有结构域和表位坐标（第几到第几号氨基酸）的唯一标尺。\n- **【异构体（Isoforms）】**：同一个基因由于 mRNA 选择性剪接（切掉了某段外显子）或不同起始位点，翻译出来的“同胞兄弟蛋白”。名字很像但长度和表位不同（如 `Ro52α` 与 `Ro52β`）。\n- **【登录号与序列版本（Accession & Version）】**：蛋白质在 UniProt 中的唯一身份证号（如 `P19474`）及序列修订版次（如 `Version 1`）。**只写蛋白名字不写登录号，等于没有受控标准**。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项必查**：立项书与序列设计文件上是否明确写出了 **UniProt 登录号 + 序列版本号 + 起止氨基酸坐标（如 `P19474, v1, 1–475 aa`）**？没写一律退回补齐。",
    "cases": [
      {
        "title": "Ro52 案例：UniProt 标准序列锁定与 Ro52α / Ro52β 异构体防错",
        "tag": "实战案例",
        "body": "## **1. 标准序列锁定**\n- **靶点名称**：人源 Ro52（基因名 `TRIM21`）\n- **UniProt 登录号**：==`P19474`==（条目名：`RO52_HUMAN`，Sequence Version 1）\n- **基准规格**：全长共 **475 个氨基酸（1–475 aa）**，理论分子量约 **54.2 kDa**，理论等电点 **pI = 6.35**。\n\n---\n\n## **2. 防错要点（Ro52α vs. Ro52β）**\n- **常见踩坑点**：文献中常同时出现 `Ro52α`（全长 475 aa，即 `P19474-1`）和缺少中间第 4 外显子（恰好处在 Coiled-Coil 免疫优势区！）的剪接异构体 `Ro52β`。\n- **坐标错位风险**：如果不锁死基准序列，不同文献或不同研发人员说的“第 125–268 位”或“p200 肽段（200–239 aa）”就会完全对不上号。\n\n---\n\n> **立项受控写法**：在立项书与 LabOS 中必须写死 —— **「基准序列：基于 UniProt `P19474` (Version 1, 1–475 aa)」**，以此作为全长参照及后续 `125–268 aa` 截短体设计的唯一坐标尺子。"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在动手设计构建体前，把靶蛋白从一条平面氨基酸链拆解为立体四层架构 —— 依次摸清它的 **一级结构**、**二级结构**、**三级结构（结构域）** 与 **四级结构（寡聚态）**，定位哪一段是病人抗体识别的 **构象表位**、哪一段是藏在肚子里的 **疏水核心**、哪一段是需要金属离子的 **锌指配位结构域**。\n- **为什么管理者必须看懂这四级结构**：很多时候研发汇报“SDS-PAGE 电泳只有一条带，纯度 95%”，但上板测血清却没信号或假阳性极高 —— 因为 SDS-PAGE 把蛋白煮沸搓直了，只能检查 **一级结构**（链没断），而真正决定抗原活性的 **二级螺旋、三级结构域折叠和四级二聚体组装** 一旦在表达或纯化中坍塌，蛋白就是“一条完整的死绳子”。\n\n[SVG:protein_structure]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【一级结构（Primary Structure）】**：蛋白质从头（N 端）到尾（C 端）精确的氨基酸排列顺序，靠共价 **肽键** 串成一条线（就像还没开始折纸的珍珠项链）。**跑还原 SDS-PAGE 和基因测序，测的都只是一级结构对不对、链有没有断。**\n- **【二级结构（Secondary Structure）】**：多肽链局部依靠主链上的氢键自己盘绕成的基础小零件，主要有三种形态：\n  1. **α-螺旋（α-Helix）**：像老式电话线弹簧一样盘绕的螺杆（Ro52 中间 128–238 aa 核心区就是一条长长的 α-螺旋，其著名的 p200 表位必须保持这种弹簧形状才能被患者抗体抓住）；\n  2. **β-折叠（β-Sheet）**：像折扇扇面一样来回折叠的结实薄片（Ro52 C 端的 PRY/SPRY 域就是由多层 β-折叠围成的桶状结构）；\n  3. **无规卷曲（Random Coil / Loop）**：连接各个螺旋和折叠模块之间的柔软绳索（铰链区）—— **工程上做截短下刀、或者插蛋白酶切位点，必须选在无规卷曲区！**\n- **【三级结构（Tertiary Structure）与结构域（Domain）】**：二级结构零件在三维空间里进一步折叠成一个紧实的球体或杆状模块。折叠的根本动力是“**把怕水的氨基酸藏进肚子中心（疏水核心），把亲水的氨基酸露在表面**”。一个大蛋白通常由几个各自能独立折叠完好的功能模块组成，每一个独立模块就叫一个 **结构域（Domain）**（例如 Ro52 由 RING、B-box、Coiled-Coil、PRY/SPRY 四个结构域串成）。\n- **【疏水核心（Hydrophobic Core）】**：正常时深藏在三级结构域内部或二聚体贴合面的强疏水氨基酸群。**截短设计铁律：绝不能一刀切在某个结构域的肚子中间！一旦切开，内部疏水核心裸露见水，不同分子的疏水区就会疯狂粘连成死包涵体！**\n- **【四级结构（Quaternary Structure / 寡聚态）】**：两条或更多条已经折好三级结构的独立肽链（每条链叫一个 **亚基 Subunit**），按精确比例拼装成的最终工作机器。例如：两条一模一样的 Ro52 链靠中间的卷曲螺旋面对面抱在一起，组成 **同源二聚体（Homodimer，2 × 54.2 = 108.4 kDa）**；而组蛋白 H2A/H2B/H3/H4 各两条共 8 条链拼成 **异源八聚体（Hetero-octamer）**。**质检四级结构不能用还原 SDS-PAGE（会被 SDS 拆散），必须用非变性的 SEC-HPLC 分子筛！**\n- **【构象表位（Conformational Epitope）】**：患者体内的自身抗体分为两类：一类认“连续排在一起的几个氨基酸（**线性表位**，蛋白煮熟变性了也能认）”；另一类认“二级螺旋、三级结构域和四级二聚体正确折叠后才拼出来的立体表面形状（**构象表位**）”。一旦折叠错误，构象表位消失，临床弱阳性患者血清就会大面积漏检！\n- **【锌指配位结构域（Zinc Finger）】**：如 Ro52 N 端的 RING 和 B-box 结构域，必须靠 4 个半胱氨酸/组氨酸像爪子一样抓着一颗 **Zn²⁺（二价锌离子）** 当“中心铆钉”才能维持三级结构；一旦缺锌或遇到 EDTA 把锌拔走，该结构域立刻散架沉淀。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **结构审查三问**：① 该靶点有哪些结构域（起止 aa 是多少）？拟截短的边界是不是在结构域之间的无规卷曲连接区？② 天然四级结构是单体还是二聚体/多聚体（下游 SEC 收集哪个峰）？③ 有没有需要补金属离子（如 Zn²⁺）或会导致假阳性的特殊结构域（如结合 IgG Fc 的 PRY/SPRY 域）？",

        "body": "## **1. Ro52 四级结构逐层档案**\n| 结构层级 | Ro52 (P19474, 475 aa) 具体特征 | 对应的工艺与质检动作 |\n|---|---|---|\n| **一级结构** | 475 aa 单链，理论 MW = 54.2 kDa，理论 pI = 6.35 | Sanger 双向全长测序确认序列；还原 SDS-PAGE 确认 54 kDa 链完整 |\n| **二级结构** | 128–238 aa 为长 α-螺旋（含 p200 核心螺旋表位 200–239 aa）；C 端为 β-折叠 | 诱导与纯化全程温和（16°C 表达、4°C 酶切、pH 7.4–8.0），严禁强酸或尿素变性破坏 α-螺旋 |\n| **三级结构 (四大结构域)** | ① `RING (16–55)` + ② `B-box2 (92–123)`（双锌指）；③ `Coiled-Coil (128–238)`；④ `PRY/SPRY (268–475)`（结合人 IgG Fc） | 全长诱导必补 **50 μM ZnCl₂** 且下游 **严禁加 EDTA**；截短体选 **125–268 aa** 恰好切在无规卷曲连接区，完整保留 Coiled-Coil 并切掉 C 端 Fc 干扰域 |\n| **四级结构** | 两条链通过 Coiled-Coil 反平行组装成 **天然同源二聚体（108.4 kDa，长杆状）** | **SEC-HPLC 分子筛**上表观分子量约 130–150 kDa 的主峰即为天然活性二聚体，绝不能当成“多聚杂质”扔掉！ |"

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：从分子底层搞懂蛋白质的 **一级结构（氨基酸线性序列与共价肽键）** 与 **二级结构（α-螺旋、β-折叠、β-转角与无规卷曲铰链区）**，明确 **线性表位 vs. 局部二级构象表位（如 Ro52 p200 螺旋表位）** 的诊断意义。\n\n[SVG:protein_structure]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【一级结构（氨基酸线性序列与共价肽键）】**：蛋白质从 N 端（氨基端，1 号位 Met）到 C 端（羧基端，如 Ro52 的 475 号位）由共价肽键串联而成的精确氨基酸顺序。\n  - **怎么把关**：一级结构是一切空间折叠的总图纸，也是设置结构域坐标（aa 起止编号）的唯一标尺；质检手段为 **质粒 Sanger 测序（基因层）** 与 **还原 SDS-PAGE 分子量 / 质谱肽图（蛋白层）**。\n- **【二级结构（α-螺旋、β-折叠、β-转角与无规卷曲铰链区）】**：多肽链主链上的羰基氧（`C=O`）与亚氨基氢（`N-H`）之间通过规律的 **氢键** 局部盘绕或折叠出的基础构件：\n  - **`α-螺旋（α-Helix）`**：像电话线或弹簧一样右手螺旋盘绕（每圈 3.6 个氨基酸），如 Ro52 中段的 **Coiled-Coil（aa 128–238）** 就是一根超长的两亲性 α-螺旋；\n  - **`β-折叠（β-Sheet）`**：像折扇一样多条肽段并排靠氢键拼成坚固的片层，如 Ro52 C 端 **PRY/SPRY 域（aa 268–475）** 由十几个反平行 β-折叠片拼成三明治；\n  - **`无规卷曲 / 柔性铰链区（Random Coil / Flexible Hinge）`**：连接各个坚固结构域之间的松散柔性绳段（如 Ro52 的 **aa 239–267 铰链区**）。\n- **【线性表位 vs. 局部二级构象表位（如 Ro52 p200 螺旋表位）】**：\n  - 只有约 15%–20% 的病人抗体识别拉直的短肽（线性表位）；\n  - 比如干燥综合征著名的 **Ro52 p200 表位（aa 200–239）**，如果只合成一段短肽往往是乱卷的无规卷曲，必须折叠成完整的 **α-螺旋并进一步组装成双链卷曲螺旋**，才能被先天性心脏传导阻滞（CHB）高危孕妇的自身抗体高亲和力识别！",

    "title": "一级与二级结构: 氨基酸序列、α-螺旋/β-折叠与无规卷曲铰链区",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：从分子底层搞懂蛋白质的 **一级结构（氨基酸线性序列与共价肽键）** 与 **二级结构（α-螺旋、β-折叠、β-转角与无规卷曲铰链区）**，明确 **线性表位 vs. 局部二级构象表位（如 Ro52 p200 螺旋表位）** 的诊断意义。\n\n[SVG:protein_structure]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【一级结构（氨基酸线性序列与共价肽键）】**：蛋白质从 N 端（氨基端，1 号位 Met）到 C 端（羧基端，如 Ro52 的 475 号位）由共价肽键串联而成的精确氨基酸顺序。\n  - **怎么把关**：一级结构是一切空间折叠的总图纸，也是设置结构域坐标（aa 起止编号）的唯一标尺；质检手段为 **质粒 Sanger 测序（基因层）** 与 **还原 SDS-PAGE 分子量 / 质谱肽图（蛋白层）**。\n- **【二级结构（α-螺旋、β-折叠、β-转角与无规卷曲铰链区）】**：多肽链主链上的羰基氧（`C=O`）与亚氨基氢（`N-H`）之间通过规律的 **氢键** 局部盘绕或折叠出的基础构件：\n  - **`α-螺旋（α-Helix）`**：像电话线或弹簧一样右手螺旋盘绕（每圈 3.6 个氨基酸），如 Ro52 中段的 **Coiled-Coil（aa 128–238）** 就是一根超长的两亲性 α-螺旋；\n  - **`β-折叠（β-Sheet）`**：像折扇一样多条肽段并排靠氢键拼成坚固的片层，如 Ro52 C 端 **PRY/SPRY 域（aa 268–475）** 由十几个反平行 β-折叠片拼成三明治；\n  - **`无规卷曲 / 柔性铰链区（Random Coil / Flexible Hinge）`**：连接各个坚固结构域之间的松散柔性绳段（如 Ro52 的 **aa 239–267 铰链区**）。\n- **【线性表位 vs. 局部二级构象表位（如 Ro52 p200 螺旋表位）】**：\n  - 只有约 15%–20% 的病人抗体识别拉直的短肽（线性表位）；\n  - 比如干燥综合征著名的 **Ro52 p200 表位（aa 200–239）**，如果只合成一段短肽往往是乱卷的无规卷曲，必须折叠成完整的 **α-螺旋并进一步组装成双链卷曲螺旋**，才能被先天性心脏传导阻滞（CHB）高危孕妇的自身抗体高亲和力识别！",
    "cases": [
      {
        "title": "项目实战案例：为什么化学合成 20 aa 短肽无法替代重组 Ro52 蛋白？",
        "tag": "实验室实战案例",
        "body": "- 文献与内部对比证实：用化学合成的 Ro52 线性多肽包被酶标板，对临床干燥综合征（SS）和红斑狼疮（SLE）阳性血清的检出率不足 45%（漏检过半！），原因正是绝大多数抗 Ro52 自身抗体专认 **α-螺旋束与三级/四级空间构象表位**。"
      }

    "title": "三级结构与结构域边界: 独立折叠球、内部疏水核心与截短禁区",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：吃透蛋白质的 **三级结构（Tertiary Structure）** 与 **结构域边界（Domain Boundary）**，深刻理解 **“外亲水、内疏水核心”折叠法则** 以及分子工程改造中最重要的铁律：**截短绝不能一刀切在结构域内部**！\n\n[SVG:protein_structure]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【三级结构（Tertiary Structure）】**：一条多肽链上的多个二级结构（几段 α-螺旋和几片 β-折叠）在三维空间中进一步靠 **疏水相互作用、二硫键、盐桥、氢键以及金属配位键（如 Zn²⁺）** 紧密折叠成的一个或多个独立的立体功能模块。\n- **【“外亲水、内疏水核心”折叠法则】**：天然可溶蛋白在水溶液里就像一个“汤圆”——带电荷、极性亲水的氨基酸（Lys, Arg, Glu, Asp, Ser）全部朝外跟水分子接触；而极其怕水的 **疏水氨基酸（Leu, Ile, Val, Phe, Trp）全部像汤圆馅一样严严实实地包在结构域球体的最核心（Hydrophobic Core）**！\n- **【结构域边界（Domain Boundary）与截短禁区铁律】**：\n  - 一个大蛋白往往由几个“独立折叠的小汤圆（结构域）”用柔性铰链绳串起来。以 **Ro52 (TRIM21, 1–475 aa)** 为例，它由 4 个结构域串成：\n    1. `RING 锌指域（aa 16–55）`：夹着 2 个 Zn²⁺；\n    2. `B-box2 锌指域（aa 92–123）`：夹着 1–2 个 Zn²⁺；\n    3. `Coiled-Coil 卷曲螺旋域（aa 128–238）`；\n    4. *柔性铰链区（aa 239–267）*；\n    5. `PRY/SPRY 球状β-三明治域（aa 268–475）`。\n  - **截短禁区铁律**：如果你做截短体设计时，不查 AlphaFold / PDB 边界，闭着眼睛在 **aa 350（恰好位于 PRY/SPRY β-三明治球体的正中间！）** 切一刀——这就好比 **把一个汤圆从正中间劈成两半，里面黑乎乎的疏水核心全部裸露到水里**，切出来的蛋白在大肠杆菌里会 **100% 瞬间互相死抱形成不溶包涵体**！\n  - **正确切法**：所有截短边界必须精准选在两个结构域之间的 **无规卷曲柔性铰链区（如 Ro52 的 aa 124–127 或 aa 250–267）**！",
    "cases": [

        "title": "项目实战案例：根据 AlphaFold 结构域边界精准设计 Ro52 截短体坐标",
        "tag": "实验室实战案例",
        "body": "- 通过查看 PDB `2IWG`（PRY/SPRY 晶体结构）与 AlphaFold `AF-P19474-F1` pLDDT 置信度图，锁定 **aa 253–267** 为低 pLDDT 的柔性无规卷曲铰链区。我们将 N 端截短体终点设在 `aa 1–255`、C 端核心截短体起点设在 `aa 125–475`，避开了所有结构域内部疏水核心，在大肠杆菌中均实现了高比例可溶表达！"
      }

    "path": "基础知识学习 / ① 前沿调研与立项策划 (SOTA & Gate R1) / 靶点序列与空间结构拆解 (五级深度解析) / 蛋白质结构解析: 一至四级空间结构评估 (含图解) / 四级结构与空间寡聚态: 天然同源二聚体组装与SEC表观分子量校准",
    "title": "四级结构与空间寡聚态: 天然同源二聚体组装与SEC表观分子量校准",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握蛋白质的 **四级结构（Quaternary Structure / 空间寡聚态）**，搞懂为什么 Ro52 在天然状态下必须组装成 **反平行同源二聚体（Homodimer）**，以及如何用 **分析型分子筛（SEC-HPLC）** 区分“天然活性二聚体”与“错误折叠的死体积多聚体”。\n\n[SVG:protein_structure]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【四级结构（Quaternary Structure / 空间寡聚态）】**：两条或两条以上已经折叠好三级结构的独立多肽链（亚基 Subunits），通过非共价键（疏水拉链、氢键、盐桥）进一步精准拼装成的完整天然生物大分子复合物（如二聚体 Dimer、三聚体 Trimer、四聚体 Tetramer、八聚体 Octamer）。*注意：单条链独立工作的单体蛋白（Monomer）只有一至三级结构，没有四级结构*。\n- **【反平行同源二聚体（Homodimer）】**：\n  - Ro52（TRIM21）单条链分子量为 **52–54 kDa**；\n  - 它的中段 **Coiled-Coil 域（aa 128–238）** 表面有一排疏水氨基酸（七肽重复 Heptad Repeat），单条链自己无法把这条长疏水带藏起来——**必须由两条 Ro52 多肽链面对面、按反平行方向像拧麻花一样互相缠绕，拼成一个稳定的 ~108 kDa 同源二聚体**，才能把疏水面完美掩埋在两条螺旋的交界面内部！\n  - 一旦二聚体组装失败，单条链露出的 Coiled-Coil 疏水面就会乱抓别的分子，形成几十个分子乱抱一团的包涵体或假可溶聚集体！\n- **【分析型分子筛（SEC-HPLC）四级结构表征】**：\n  - 还原 SDS-PAGE 因为加了 SDS 和煮沸，会把天然二聚体也拆成 52 kDa 单链，根本看不出四级结构；\n  - 只有在不加 SDS、不煮沸的天然缓冲液中跑 **SEC 分子筛（Superdex 200）**，看到蛋白在 **~13.5–14.0 mL（对应表观分子量 ~110–130 kDa）** 跑出单一对称尖峰，且在 **8.0 mL 死体积处无多聚体峰**，才真正证明四级结构（天然二聚体）组装成功！",
    "cases": [
      {
        "title": "项目实战案例：SEC 分子筛证实 Ro52 处于 100% 天然同源二聚体四级构象",
        "tag": "实验室实战案例",
        "body": "- 切除 MBP 标签后的天然 Ro52（单链理论 54.2 kDa）上 Superdex 200 Increase 10/300 GL，主峰精准出现在 **13.6 mL**（根据标准品校准曲线对应表观分子量 ~115 kDa，恰好为 54.2 × 2 = 108.4 kDa 的略微伸展二聚体），完美验证了四级结构完整性。"
      }

    "title": "翻译后修饰(PTM)与金属配位辅因子评估",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：核查靶蛋白在人体内是否存在 **N-糖基化/O-糖基化**、**磷酸化修饰**、**瓜氨酸化修饰** 或复杂的 **分子内二硫键网络**，并判断患者的 **自身抗体识别** 是否依赖这些修饰或 **金属配位辅因子（Zn²⁺/Ca²⁺）**。\n- **为什么这一步决定生死**：大肠杆菌（*E. coli*）没有内质网和高尔基体，**不会加糖链，也很难在还原性胞质里正确配对多对二硫键**！如果自身抗体必须抓糖蛋白构象（如 β2GPI），用大肠杆菌做出来的就是 100% 废品；反之，如果证实无需糖基化（如 Ro52），用大肠杆菌就能把生产成本降到哺乳细胞的 1/10！\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【N-糖基化/O-糖基化】**：真核分泌蛋白或膜蛋白在天冬酰胺（`N-X-S/T` 基序）或丝氨酸/苏氨酸上挂上的复杂糖链；它既像一层亲水保护壳防止蛋白聚集，又常常参与维持胞外糖蛋白的天然构象。\n- **【分子内二硫键网络】**：两个半胱氨酸（Cys）的巯基（-SH）氧化手拉手形成的共价键（`-S-S-`），常见于细胞外分泌蛋白（如抗体 IgG、β2GPI 含 11 对二硫键）。注意：**细胞内蛋白（如 Ro52）的半胱氨酸通常处于还原态（-SH）或用来抓 Zn²⁺，并不是二硫键！**\n- **【瓜氨酸化修饰（Citrullination）】**：精氨酸（Arg）在肽酰基精氨酸脱亚氨酶（PAD）作用下脱去氨基变成非天然的“瓜氨酸（Cit）”—— 类风湿关节炎（RA）患者体内的抗 CCP 抗体和抗 MCV 抗体，**专门只认变成了瓜氨酸的肽段，不认普通精氨酸**！\n- **【金属配位辅因子（Zn²⁺/Ca²⁺）】**：蛋白维持正确三级/四级结构所必需的金属离子（如 Ro52 N 端锌指必需 Zn²⁺，某些钙结合蛋白或组蛋白组装需 Ca²⁺/高盐）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项 PTM 核查铁律**：① 凡选大肠杆菌表达，立项书必须附 UniProt PTM 栏核查结论（确认无必需糖基化与复杂二硫键）；② 凡含锌指/钙结合域，必须在上下游工艺卡中写明“补加何种金属离子”及“禁用 EDTA 螯合剂”；③ 凡涉及瓜氨酸化靶点（如 CCP/MCV），必须明确是固相化学合成引入瓜氨酸，还是体外 PAD 酶法修饰！",
    "cases": [

        "body": "## **1. 四大自免靶点修饰特征与路线决策表**\n| 靶点名称 | 天然位置与 PTM/辅因子特征 | 自身抗体识别依赖项 | 唯一正确制备底盘 |\n|---|---|---|---|\n| **Ro52 (TRIM21)** | 胞内/核内蛋白；**无糖基化**；N 端含 **Zn²⁺ 配位锌指**（非二硫键） | 识别 Coiled-Coil 螺旋肽段与构象，不依赖糖链 | **大肠杆菌 Rosetta(DE3)** + 补 50 μM ZnCl₂ |\n| **β2GPI** | 血浆分泌糖蛋白；含 **11 对二硫键 + 4 处 N-糖基化** | 高度依赖天然二硫键折叠与糖基化修饰后的开放构象 | **HEK293 / CHO 哺乳动物细胞分泌表达** |\n| **CCP（环瓜氨酸肽）** | 人工设计环肽；含 **瓜氨酸（Cit）修饰 + 二硫键/酰胺键成环** | 绝对依赖 **瓜氨酸残基** 与 **环化空间张力**（线性或未瓜氨酸化完全无反应） | **化学固相多肽合成（SPPS）+ 定向环化 + 生物素标记** |\n| **Histone 八聚体** | 细胞核染色质核心；H2A/H2B/H3/H4 高度碱性（pI 10–11） | 依赖 **四亚基 2:2:2:2 异源八聚体天然组装构象** | **大肠杆菌共表达/高盐复性组装 + SEC 分离八聚体峰** |"

    "path": "基础知识学习 / ① 前沿调研与立项策划 (SOTA & Gate R1) / 文献证据矩阵与路线锚定",
    "title": "文献证据矩阵与路线锚定",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在动手设计基因前，通过检索顶刊文献与国际权威公开 SOP 建立 **证据矩阵（Evidence Matrix）**，提前制定 **包涵体源头预防方案**、完成 **宿主与融合标签初选**，并彻底排查 **专利自由实施（FTO）与外单位技术来源合规性**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【证据矩阵（Evidence Matrix）】**：不听信口头传言或单篇摘要，而是把多篇核心文献的“氨基酸起止坐标、所用宿主与标签、测试血清例数与来源、局限性”列成对照表，区分哪些是板上钉钉的事实（E3）、哪些是需要我们自己做实验验证的假设（E4）。\n- **【包涵体源头预防方案】**：针对难溶蛋白，在立项时就规划好“N 端助溶大标签（MBP/SUMO）+ 16°C 低温慢速诱导 + 配位金属补料”组合拳，尽量走上清可溶路线而非高批间差的尿素复性路线。\n- **【专利自由实施（FTO）与外单位技术来源合规性】**：Freedom to Operate，既要查核心构建体（特别是人工嵌合肽或特殊突变体）有没有侵犯有效专利，更要查本公司如果使用了转移、委托或合作单位的工艺/菌株，**有没有正式签署的技术转让合同或授权书（对应风险清单 R10）**！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **策略锚定必查**：立项不能只押宝一条未经验证的激进路线（如只做一个短肽拼接），必须确立 **「1 条全长/权威基准路线 + 1～2 条工程优化候选路线」** 平行推进！",
    "cases": [
      {
        "title": "Ro52 证据矩阵与“全长参照 + 125–268 截短体”双轨立项策略",
        "tag": "实战案例",
        "body": "## **1. Ro52 核心文献与公开 SOP 证据矩阵**\n| 证据来源 | 构建区段与标签 | 表达与纯化体系 | 已证实的事实 (E3) | 未证实/需本体系验证的边界 (E4) |\n|---|---|---|---|---|\n| **Dundee SOP (`DU22292`)** | 全长 `1–475 aa`，N 端 `6xHis-SUMO` | *E. coli* BL21，低温 IPTG，Ni 柱 + SEC | 证明大肠杆菌借助助溶标签可获得可溶全长 Ro52 | 该 SOP 为科研酶学试剂，未测临床自免血清盘与 Fc 干扰背景 |\n| **2018 表位研究 (`PMC6293197`)** | 截短体 `Ro52-2 (125–268 aa, 144 aa)` | *E. coli* 表达，对比昆虫细胞全长 | 完整覆盖 Coiled-Coil，在抗 Ro52 阳性队列中反应率最高 | 原研究队列已预筛，需在本公司血清盘上与全长对比弱阳覆盖率 |\n| **2005 p200 研究 (`PMID 15683447`)** | `200–239 aa` (p200 螺旋肽) | 合成肽与重组片段对比 | 证明核心抗体识别依赖 α-螺旋二级结构 | 单独 40 aa 短肽包被效率低，需置于完整 Coiled-Coil 骨架中呈现 |"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握从 PubMed、PMC、PDB（蛋白质三维结构库）及 MRC PPU（Dundee 大学公开蛋白库）检索同靶点制备方案的标准方法，重点核验文献中的 **精确氨基酸坐标**、**样本队列选择偏倚（Selection Bias）** 与 **检测格式差异**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【精确氨基酸坐标】**：文献里写“Ro52 中间段”或“B30.2 域”不能直接拿来下单！必须追查到它的引物序列或原文 Methods，核对对应在 UniProt `P19474` 上到底是第几号到第几号氨基酸（如 `125–268 aa`）。\n- **【样本队列选择偏倚（Selection Bias）】**：读文献最容易上当的地方！如果一篇论文先用某商业试剂盒筛出 50 份强阳性血清，再用这 50 份血清去测自己做的截短体，得出“灵敏度 98%”——这只代表它在已筛阳性子集里重合度高，不代表在真实医院初筛人群（含大量弱阳性和不典型表位患者）里不漏检！\n- **【检测格式差异】**：文献里用 **变性 Western Blot（WB）** 测出阳性的短肽，换到 **非变性 ELISA 微孔板或化学发光磁珠** 上可能完全没信号（因为吸附效率或表位朝向变了）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **文献引用三不准**：① 没核对到 UniProt 具体起止 aa 数字的不准引用；② 把 Western Blot 结论直接等同于 ELISA/化学发光结论的不准轻信；③ 文献中体积单位或操作参数明显前后矛盾的（如 2018 年某文 Methods 参数笔误），只取其区段坐标逻辑，不照抄其异常参数！",
    "cases": [
      {
        "title": "如何拆穿文献里的“100% 灵敏度假象”？（Ro52 文献批判性阅读案例）",
        "tag": "实战案例",
        "body": "## **1. 文献批判性核查实例**\n- **案例 A（1994 重叠合成肽论文 PMID `7511075`）**：报告了 `107–122 aa` 和 `365–382 aa` 两段线性短肽有血清反应，但同时指出不同疾病来源患者血清对短肽的识别差异极大 → **审评结论：线性短肽缺乏 Coiled-Coil 螺旋构象，绝对不能简单把两段短肽识别率相加当作成品灵敏度！**\n- **案例 B（2018 片段论文 `PMC6293197`）**：提取其验证过的优质截短坐标 **`125–268 aa`（144 aa）** 作为路线 B 候选，但因其原文实验方法段落存在缓冲液体积单位笔误，本实验室采用自主受控的 `Ni/Amylose → TEV → Q 柱 → SEC` 标准纯化链进行放大验证。"
      }

    "title": "包涵体与低活性源头规避策略",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在立项阶段识别导致原核表达蛋白变成 **不溶性包涵体（Inclusion Body）** 或 **可溶性错误折叠聚集体** 的根源，优先设计“**前端分子伴侣标签助溶 + 过程低温控速折叠 + 必需辅因子补料**”的源头保溶路线，规避批间差极大的 **尿素/盐酸胍变性复性（Denaturation & Refolding）**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【不溶性包涵体（Inclusion Body）】**：大肠杆菌在 37°C 下合成蛋白速度是真核细胞的 5–10 倍，疏水核心还没来得及折进肚子里，隔壁刚造出来的另一条肽链就撞上来粘在一起，最后滚雪球一样聚成微米级的死蛋白颗粒（离心后全在管底白泥里）。\n- **【尿素/盐酸胍变性复性（Denaturation & Refolding）】**：当蛋白全进了包涵体时，只能用 `8 M 尿素` 或 `6 M 盐酸胍` 把死疙瘩强行拆成一根根直绳子，再通过稀释或透析慢慢撤掉尿素，指望它自己重新折回正确构象。\n  - **为什么 IVD 研发极力规避复性**：对于单结构域小蛋白（或高盐组装的组蛋白八聚体）复性可行；但对于像 Ro52 这样含 4 个结构域 + 锌指 + 长螺旋二聚体的多结构域蛋白，复性时 80% 会再次沉淀，剩下的 20% 也有大量“半生不熟”的错误构象，导致批与批之间效价差好几倍！\n- **【源头保溶三联策略】**：① N 端接 `MBP (42 kDa)` 或 `SUMO (11 kDa)` 亲水大标签当“随身保姆”；② 诱导温度降到 `16–20°C` + `0.1 mM 低 IPTG` 让核糖体慢工出细活；③ 补齐结构必需的配位离子（如 `50 μM ZnCl₂`）或截掉冗余疏水尾。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项工艺路线审核**：凡是立项书里写“如形成包涵体则采用 8M 尿素复性”，必须追问：**“为什么不先设计 MBP/SUMO 助溶标签 + 16°C 低温上清可溶路线？如果非走复性不可，用什么构象依赖型单抗或 SEC-HPLC 指标证明复性后的构象和天然可溶蛋白一致？”**",
    "cases": [
      {
        "title": "Ro52 原核上清可溶路线（得率 >15 mg/L）击败包涵体复性路线实录",
        "tag": "实战案例",
        "body": "## **1. 两条路线的实测对比教训**\n- **老路线（裸 6xHis-Ro52 + 37°C 诱导 + 8M 尿素包涵体复性）**：虽然破菌沉淀里蛋白条带极粗（每升上百毫克），但经 8M 尿素溶解、柱上复性或梯度透析后，90% 在去掉尿素到 2M 时变成白色絮状沉淀析出；最终勉强拿到的可溶蛋白在 SEC-HPLC 上一半是死体积大聚集峰，测弱阳性血清大面积漏检。\n- **新受控路线（6xHis-MBP-TEV-Ro52 + 16°C + 0.1 mM IPTG + 50 μM ZnCl₂ 上清可溶路线）**：直接从破菌上清温和纯化并切掉 MBP 标签，全程零变性剂接触，SEC-HPLC 天然二聚体主峰 >90%，弱阳性血清检出率 100%！"
      }

    "path": "基础知识学习 / ① 前沿调研与立项策划 (SOTA & Gate R1) / 文献证据矩阵与路线锚定 / 表达宿主底盘与融合标签初选",
    "title": "表达宿主底盘与融合标签初选",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在立项阶段完成 **表达宿主底盘（原核 vs 真核）** 与 **融合标签（亲和标签 + 助溶标签）** 的匹配选型，并同步规划好 **标签切除与残留去除方案**，从源头杜绝“标签带着好表达、上板全是假阳性”的顽疾。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【表达宿主底盘选型法则】**：\n  - **首选大肠杆菌 `Rosetta(DE3) / BL21(DE3)`**：只要靶点无必需糖基化且二硫键 ≤2 对（如 Ro52、核糖体 P0、组蛋白），一律首选大肠杆菌（周期 2 天、成本极低）；\n  - **必选哺乳动物细胞 `HEK293 / CHO`**：靶点含复杂二硫键网络（>3 对）或抗体识别依赖糖基化构象（如 β2GPI、TPO、重组质控单抗 IgG）。\n- **【四大常用融合标签对比】**：\n  1. **`6xHis`（六聚组氨酸，0.8 kDa）**：纯化抓手（挂 Ni-NTA 镍柱），体积最小，但毫无助溶能力；\n  2. **`MBP`（麦芽糖结合蛋白，42.5 kDa）**：助溶能力天花板（挂 Amylose 淀粉柱），但个头太大且源自大肠杆菌，**做 IVD 抗原成品必须用 TEV 酶切掉并除净**！\n  3. **`SUMO`（小泛素相关修饰蛋白，11 kDa）**：助溶能力强，且配套的 `ULP1 (SUMO蛋白酶)` 切割效率极高、切完不留任何多余氨基酸；\n  4. **`GST`（谷胱甘肽巯基转移酶，26 kDa）**：本身是二聚体标签，接在同样是二聚体的蛋白（如 Ro52）上容易交联成网状大沉淀，不推荐用于多聚倾向抗原！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项标签必查红线**：**① 严禁对本身就是二聚体/多聚体的抗原（如 Ro52）使用会自发二聚的 `GST` 标签（极易形成交联死沉淀）**！② 凡选用 `MBP` 大标签，必须同步写明 `6xHis-MBP-TEV-靶蛋白` 的反挂除标签路线！",
    "cases": [
      {
        "title": "为什么 Ro52 选 6xHis-MBP / His-SUMO，而绝对不能选 GST 标签？",
        "tag": "实战案例",
        "body": "## **1. 标签选型的“二聚体交联陷阱”**\n- **为什么 GST 标签在 Ro52 上必败**：Ro52 本身靠中间的 Coiled-Coil 形成同源二聚体；而 `GST` 标签（26 kDa）自己也是一个强力的同源二聚体！如果把 `GST` 和 `Ro52` 连在一起，一个分子的 GST 跟左边配对，它的 Ro52 又跟右边配对，瞬间就会像拉网一样形成无限延伸的 **三维网状交联大沉淀（Cross-linked Aggregate）**！\n- **为什么选 MBP 或 SUMO**：**MBP（42.5 kDa）和 SUMO（11 kDa）自身是严格的 100% 单体（Monomer）**！接在 Ro52 N 端时，只帮 Ro52 遮挡疏水斑块助溶，绝不会干扰两条 Ro52 链正常配对成健康的二聚体。"
      }

    "path": "基础知识学习 / ① 前沿调研与立项策划 (SOTA & Gate R1) / 文献证据矩阵与路线锚定 / 表达宿主底盘与融合标签初选",
    "title": "表达宿主底盘与融合标签初选",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在立项阶段完成 **表达宿主底盘（原核 vs 真核）** 与 **融合标签（亲和标签 + 助溶标签）** 的匹配选型，并同步规划好 **标签切除与残留去除方案**，从源头杜绝“标签带着好表达、上板全是假阳性”的顽疾。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【表达宿主底盘选型法则】**：\n  - **首选大肠杆菌 `Rosetta(DE3) / BL21(DE3)`**：只要靶点无必需糖基化且二硫键 ≤2 对（如 Ro52、核糖体 P0、组蛋白），一律首选大肠杆菌（周期 2 天、成本极低）；\n  - **必选哺乳动物细胞 `HEK293 / CHO`**：靶点含复杂二硫键网络（>3 对）或抗体识别依赖糖基化构象（如 β2GPI、TPO、重组质控单抗 IgG）。\n- **【四大常用融合标签对比】**：\n  1. **`6xHis`（六聚组氨酸，0.8 kDa）**：纯化抓手（挂 Ni-NTA 镍柱），体积最小，但毫无助溶能力；\n  2. **`MBP`（麦芽糖结合蛋白，42.5 kDa）**：助溶能力天花板（挂 Amylose 淀粉柱），但个头太大且源自大肠杆菌，**做 IVD 抗原成品必须用 TEV 酶切掉并除净**！\n  3. **`SUMO`（小泛素相关修饰蛋白，11 kDa）**：助溶能力强，且配套的 `ULP1 (SUMO蛋白酶)` 切割效率极高、切完不留任何多余氨基酸；\n  4. **`GST`（谷胱甘肽巯基转移酶，26 kDa）**：本身是二聚体标签，接在同样是二聚体的蛋白（如 Ro52）上容易交联成网状大沉淀，不推荐用于多聚倾向抗原！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项标签必查红线**：**① 严禁对本身就是二聚体/多聚体的抗原（如 Ro52）使用会自发二聚的 `GST` 标签（极易形成交联死沉淀）**！② 凡选用 `MBP` 大标签，必须同步写明 `6xHis-MBP-TEV-靶蛋白` 的反挂除标签路线！",
    "cases": [
      {
        "title": "为什么 Ro52 选 6xHis-MBP / His-SUMO，而绝对不能选 GST 标签？",
        "tag": "实战案例",
        "body": "## **1. 标签选型的“二聚体交联陷阱”**\n- **为什么 GST 标签在 Ro52 上必败**：Ro52 本身靠中间的 Coiled-Coil 形成同源二聚体；而 `GST` 标签（26 kDa）自己也是一个强力的同源二聚体！如果把 `GST` 和 `Ro52` 连在一起，一个分子的 GST 跟左边配对，它的 Ro52 又跟右边配对，瞬间就会像拉网一样形成无限延伸的 **三维网状交联大沉淀（Cross-linked Aggregate）**！\n- **为什么选 MBP 或 SUMO**：**MBP（42.5 kDa）和 SUMO（11 kDa）自身是严格的 100% 单体（Monomer）**！接在 Ro52 N 端时，只帮 Ro52 遮挡疏水斑块助溶，绝不会干扰两条 Ro52 链正常配对成健康的二聚体。"
      }
    ],

    "title": "专利自由实施(FTO)与技术来源合规核查",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在立项关口（Gate R1）前完成 **专利自由实施（FTO）检索** 与 **技术来源合规性审查**，确保拟开发的序列、突变体、制备工艺及菌株既不侵犯第三方有效专利，也不存在外单位技术无授权使用的法律与外审风险（直击本公司风险清单 **R10**）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【专利自由实施（FTO, Freedom to Operate）】**：不是看“我们能不能申请新专利”，而是查“我们把这个产品做出来卖给试剂盒厂家，会不会踩到别人还在 20 年保护期内的有效发明专利”：\n  - 天然存在的人类野生型全长基因/蛋白序列（如 UniProt `P19474` 1–475 aa）及过期的公知截短区段属于公有领域，无序列侵权风险；\n  - 需重点排查的是他人近 20 年内申请的 **特定人工嵌合序列、特殊定点突变组合或专属偶联配方专利**。\n- **【技术来源合规性（自研 vs 转移/委托/外购）】**：ISO 9001 与高企审查重点核查项 —— 如果某产品的菌株、质粒或 SOP 来自外部合作单位（如高校或关联公司），档案里 **必须有正式签署的《技术开发/转让合同》或《知识产权授权书》**，且受控文件必须完成本公司化转换（严禁文件头改成了新旦雅 CYDAYA，正文里还写着外单位名字！）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项合规红线（对应风险清单 R10 与工序卡 ①.8）**：① 立项书不能只写一句空话“无专利侵权风险”，必须附上 **「FTO 检索记录（检索数据库、关键词/序列号、检索日期、核查结论与判断人签字）」**；② 凡技术或种子来自外单位，未见正式合同或授权书前，Gate R1 一律亮红灯拦截！",
    "cases": [
      {
        "title": "本公司历史技术来源风险（R10）复盘与 Ro52 自研 FTO 合规建档",
        "tag": "公司实录案例",
        "body": "## **1. 历史风险教训（引自《03_现状诊断与风险清单》R10）**\n- **历史问题**：全景排查发现公司早期的 dsDNA 工艺与 RF 酶切工艺存在“疑转移自外部单位（如宁波赛珀）”、部分受控程序文件虽改名为 `CYDAYA-QP` 但正文中仍残留外单位名称，且缺乏对应的技术转让/授权合同归档；同时浙大宁波理工学院 dsDNA 委托开发合同（2026-04 签署）与早期已投产记录存在时间线倒挂风险。\n\n---\n\n## **2. Ro52 项目 FTO 与自研合规建档标准**\n1. **序列公有性核查**：人源 TRIM21/Ro52 野生型序列（`P19474`，1991 年公布）及 `125–268 aa` 学术公开结构域均属公知公用序列；载体采用商业化通用 `pET-28a` + 标准 `MBP/TEV` 系统，无核心专利壁垒。\n2. **100% 自主证据链留存**：从序列密码子优化设计稿、基因合成公司订单与发票、Sanger 测序原始 `.ab1` 峰图到小试电泳原图，全套原始记录均在新旦雅（Cydaya）本实验室独立生成并归档入 LabOS。"
      }

    "path": "基础知识学习 / ① 前沿调研与立项策划 (SOTA & Gate R1) / Gate R1｜① 调研立项质检标准与放行四件套",
    "title": "Gate R1｜① 调研立项质检标准与放行四件套",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R1（调研与立项放行关口）** 将工序 ① 的所有产出收敛为受控的 **立项质检标准** 与 **Gate R1 四件套**，只有当临床平台用途、基准序列版本、结构风险对策、FTO 合规记录与 **预设质量验收指标（Design Input）** 全部核验通过并由总经理/管代签批后，方可开立项目号进入阶段 ② 基因合成。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【立项质检标准（每个指标必带检测方法）】**：立项书里写的目标指标，**绝不能只写一个光秃秃的数字（如“纯度 ≥90%”）**，必须写死 **“数值 + 检测方法 + 判定条件”**（如“还原 SDS-PAGE 考马斯亮蓝染色光密度扫描纯度 ≥90.0%”）。\n- **【风险量化评估（R = S × P）】**：依据本公司《风险管理控制程序》（`QA-OP-005`），对识别出的每个技术与合规风险按 **严重度 S（1–5分）× 发生概率 P（1–5分）** 计算风险值 R：R ≥ 10 为高风险，必须制定强制降低风险的设计控制措施。\n- **【RD-OP-001 立项受控表单三件套】**：《项目建议书》（`RD-FM-001`）、《设计开发计划书》（`RD-FM-002`）、《设计开发输入清单与评审表》（`RD-FM-003 / 004`）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R1 四件套放行核查表（一票否决制）**：\n> - **① 检查方法**：核查 UniProt 序列档案、结构域风险图、文献证据矩阵、FTO 检索记录及 `RD-FM-001~004` 评审签字；\n> - **② 通过依据**：用途平台明确、全长与截短对照路线清晰、每项验收指标均绑定检测方法、技术来源 100% 合规；\n> - **③ 未通过动作**：缺参照品、缺去标签设计或指标无检测方法时，退回补调研，**禁止下单合成基因，禁止把文献候选路线登记为已验证工艺**；\n> - **④ 交付物**：签批完整的 `RD-FM-001/002/003/004` 及 LabOS「实验立项」建档记录。",
    "cases": [
      {
        "title": "Ro52 项目 Gate R1 立项质检指标与风险评估（R=S×P）定稿样板",
        "tag": "Gate 放行案例",
        "body": "## **1. Ro52 立项预设质检标准表（写入 `RD-FM-003` 设计输入）**\n| 指标类别 | 质检项目 | 绑定检测方法 | 立项预设合格标准 |\n|---|---|---|---|\n| **理化指标** | 外观 | 目视法 | 无色澄清液体，无沉淀或悬浮物 |\n| **理化指标** | 身份与表观分子量 | 还原 SDS-PAGE & 抗 Ro52 WB | 全长主带 54±3 kDa（截短体 17±2 kDa），WB 阳性 |\n| **理化指标** | 电泳纯度 | 还原 SDS-PAGE 考马斯亮蓝成像积分（上样 3 μg） | 主带纯度 **≥90.0%**，43 kDa MBP 残留带 <2% |\n| **理化指标** | 天然寡聚均一性 | SEC-HPLC（Superdex 200 / TSKgel G3000SWxl） | 天然同源二聚体主峰 **≥85.0%**，死体积聚集峰 ≤5.0% |\n| **理化指标** | 蛋白浓度与核酸比 | BCA 法（同基质空白调零）+ 紫外 A₂₆₀/A₂₈₀ | 浓度 **≥1.00 mg/mL**，且 **A₂₆₀/A₂₈₀ ≤ 0.65** |\n| **功能与稳定性** | 临床血清学活性与耐冻融 | 50 例参比血清盘 ELISA / 4PL 效价；5 次反复冻融 | 阳符合率 ≥95%（20例含弱阳），阴符合率 ≥96.7%（30例含干扰）；5 次冻融活性衰减 ≤10% |\n\n---\n\n## **2. Ro52 立项核心风险评估表（R = S × P）**\n1. **风险 1（Coiled-Coil 区原核表达形成死包涵体）**：S=4, P=4 → **R=16（高风险）** → **控制措施**：采用 `6xHis-MBP` 助溶标签 + 16°C 低温 + 0.1 mM IPTG + 50 μM ZnCl₂。\n2. **风险 2（MBP 大标签与大肠杆菌残留引发人血清假阳性）**：S=5, P=3 → **R=15（高风险）** → **控制措施**：设计 TEV 酶切位点，切标后反挂 Ni-NTA 柱彻底去除 MBP，并过 Q 柱除核酸内毒素。\n3. **风险 3（全长 C 端 PRY/SPRY 域结合血清正常 IgG Fc 假阳性）**：S=4, P=3 → **R=12（高风险）** → **控制措施**：平行开发切除了 PRY/SPRY 域的 `125–268 aa` 截短体，并在 QC 中增设正常人 IgG Fc 干扰阴性对照盘。"
      }

    "title": "Gate R1｜① 调研立项质检标准与放行四件套",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R1（调研与立项放行关口）** 将工序 ① 的所有产出收敛为受控的 **立项质检标准** 与 **Gate R1 四件套**，只有当临床平台用途、基准序列版本、结构风险对策、FTO 合规记录与 **预设质量验收指标（Design Input）** 全部核验通过并由总经理/管代签批后，方可开立项目号进入阶段 ② 基因合成。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【立项质检标准（每个指标必带检测方法）】**：立项书里写的目标指标，**绝不能只写一个光秃秃的数字（如“纯度 ≥90%”）**，必须写死 **“数值 + 检测方法 + 判定条件”**（如“还原 SDS-PAGE 考马斯亮蓝染色光密度扫描纯度 ≥90.0%”）。\n- **【风险量化评估（R = S × P）】**：依据本公司《风险管理控制程序》（`QA-OP-005`），对识别出的每个技术与合规风险按 **严重度 S（1–5分）× 发生概率 P（1–5分）** 计算风险值 R：R ≥ 10 为高风险，必须制定强制降低风险的设计控制措施。\n- **【RD-OP-001 立项受控表单三件套】**：《项目建议书》（`RD-FM-001`）、《设计开发计划书》（`RD-FM-002`）、《设计开发输入清单与评审表》（`RD-FM-003 / 004`）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R1 四件套放行核查表（一票否决制）**：\n> - **① 检查方法**：核查 UniProt 序列档案、结构域风险图、文献证据矩阵、FTO 检索记录及 `RD-FM-001~004` 评审签字；\n> - **② 通过依据**：用途平台明确、全长与截短对照路线清晰、每项验收指标均绑定检测方法、技术来源 100% 合规；\n> - **③ 未通过动作**：缺参照品、缺去标签设计或指标无检测方法时，退回补调研，**禁止下单合成基因，禁止把文献候选路线登记为已验证工艺**；\n> - **④ 交付物**：签批完整的 `RD-FM-001/002/003/004` 及 LabOS「实验立项」建档记录。",
    "cases": [
      {
        "title": "Ro52 项目 Gate R1 立项质检指标与风险评估（R=S×P）定稿样板",
        "tag": "Gate 放行案例",
        "body": "## **1. Ro52 立项预设质检标准表（写入 `RD-FM-003` 设计输入）**\n| 指标类别 | 质检项目 | 绑定检测方法 | 立项预设合格标准 |\n|---|---|---|---|\n| **理化指标** | 外观 | 目视法 | 无色澄清液体，无沉淀或悬浮物 |\n| **理化指标** | 身份与表观分子量 | 还原 SDS-PAGE & 抗 Ro52 WB | 全长主带 54±3 kDa（截短体 17±2 kDa），WB 阳性 |\n| **理化指标** | 电泳纯度 | 还原 SDS-PAGE 考马斯亮蓝成像积分（上样 3 μg） | 主带纯度 **≥90.0%**，43 kDa MBP 残留带 <2% |\n| **理化指标** | 天然寡聚均一性 | SEC-HPLC（Superdex 200 / TSKgel G3000SWxl） | 天然同源二聚体主峰 **≥85.0%**，死体积聚集峰 ≤5.0% |\n| **理化指标** | 蛋白浓度与核酸比 | BCA 法（同基质空白调零）+ 紫外 A₂₆₀/A₂₈₀ | 浓度 **≥1.00 mg/mL**，且 **A₂₆₀/A₂₈₀ ≤ 0.65** |\n| **功能与稳定性** | 临床血清学活性与耐冻融 | 50 例参比血清盘 ELISA / 4PL 效价；5 次反复冻融 | 阳符合率 ≥95%（20例含弱阳），阴符合率 ≥96.7%（30例含干扰）；5 次冻融活性衰减 ≤10% |\n\n---\n\n## **2. Ro52 立项核心风险评估表（R = S × P）**\n1. **风险 1（Coiled-Coil 区原核表达形成死包涵体）**：S=4, P=4 → **R=16（高风险）** → **控制措施**：采用 `6xHis-MBP` 助溶标签 + 16°C 低温 + 0.1 mM IPTG + 50 μM ZnCl₂。\n2. **风险 2（MBP 大标签与大肠杆菌残留引发人血清假阳性）**：S=5, P=3 → **R=15（高风险）** → **控制措施**：设计 TEV 酶切位点，切标后反挂 Ni-NTA 柱彻底去除 MBP，并过 Q 柱除核酸内毒素。\n3. **风险 3（全长 C 端 PRY/SPRY 域结合血清正常 IgG Fc 假阳性）**：S=4, P=3 → **R=12（高风险）** → **控制措施**：平行开发切除了 PRY/SPRY 域的 `125–268 aa` 截短体，并在 QC 中增设正常人 IgG Fc 干扰阴性对照盘。"
      }

    "title": "② 分子工程设计与载体构建 (Design & Gate R2/R3)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：将阶段 ① 锁定的氨基酸序列转化为高表达、易纯化、可切标的 **工程化重组质粒（Expression Construct）**，涵盖 **密码子优化与表达元件匹配**、**融合双标签与Linker/TEV酶切盒工程**、**全长/截短/突变分子改造** 以及 **克隆宿主（DH5α）与表达宿主（Rosetta/BL21）双菌库受控管理**，并在末端通过 **Gate R2/R3 测序质检** 放行。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【工程化重组质粒（Expression Construct）】**：把目标基因连同启动子、核糖体结合位点（RBS）、融合标签、连接肽、蛋白酶切位点和终止密码子，严丝合缝组装进环状质粒载体（如 `pET-28a`）形成的生产蓝图。\n- **【融合双标签与Linker/TEV酶切盒工程】**：在目标蛋白 N 端按严格顺序排列 `[6xHis] - [MBP/SUMO] - [柔性Linker] - [TEV/ULP1酶切点]`，确保既能用大标签助溶、又能用小 His 挂镍柱、最后切完还能用镍柱反挂把标签和酶一把抓走。\n- **【克隆宿主（DH5α）与表达宿主（Rosetta/BL21）双菌库】**：`DH5α` 专门用来扩增质粒、测序和建立 `-80°C` 永久主种子库（MCB）；`Rosetta(DE3)` 专门用来加 IPTG 生产蛋白（工作库 WCB），严禁混用。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **阶段 ②③ 核心抓手**：下单合成前审 **Gate R2（设计图谱、阅读框与预设标准）**；质粒到货转化后审 **Gate R3（Sanger 双向全长测序 100% 匹配无套峰 + DH5α 主种子库位置建档）**。",
    "cases": [
      {
        "title": "Ro52 工程化表达盒（Expression Cassette）完整基因架构图",
        "tag": "实战案例",
        "body": "## **1. Ro52 表达盒从 5' 到 3' 的元件排布标准**\n`[T7lac 启动子 + lacO] ➔ [RBS 核糖体结合位点] ➔ [ATG 起始] ➔ [6xHis 纯化标签] ➔ [MBP 助溶域 (367 aa)] ➔ [(GGGGS)₃ 柔性连接肽 (15 aa)] ➔ [TEV 酶切位点 (ENLYFQ↓G)] ➔ [Ro52 目标序列 (1–475 aa 或 125–268 aa)] ➔ [TAA 强终止密码子] ➔ [T7 终止子]`\n\n---\n\n## **2. 架构设计的三大精妙之处**\n1. **`6xHis` 放在 `MBP` 最前面（N 端）**：保证 TEV 酶切开 `ENLYFQ↓G` 后，切下来的 `6xHis-MBP` 依然带着 His 标签，过第二遍镍柱时能被 100% 扣留在柱上！\n2. **C 端不加任何多余标签，直接用 `TAA` 原核最强终止密码子收尾**：保证切掉 N 端标签后，Ro52 的 C 端也是 100% 天然序列。\n3. **卡那霉素抗性（`KanR`）骨架**：高密度发酵不丢质粒。"
      }

  "learn.2.0": {
    "key": "learn.2.0",
    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 密码子优化与表达元件设计",
    "title": "密码子优化与表达元件设计",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：通过对人源基因进行 **宿主密码子适应指数（CAI）优化**、**GC含量与mRNA二级结构平顺化**，搭配带双重刹车机制的 **T7lac严谨型启动子** 与高稳定性 **卡那霉素抗性（KanR）pET载体骨架**，解决人类基因在大肠杆菌中“转录太猛撑死菌、翻译卡壳出碎片、发酵后期丢质粒”的三大顽疾。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【宿主密码子适应指数（CAI）】**：衡量一段 DNA 序列里使用的三联体密码子与大肠杆菌常用习惯契合度的指标（满分 1.0）。野生型人类基因在大肠杆菌里 CAI 通常只有 0.5–0.6（遍地是大肠杆菌缺 tRNA 的稀有密码子）；经算法同义替换优化后，**要求 CAI ≥ 0.80–0.85**。\n- **【GC含量与mRNA二级结构平顺化】**：G 和 C 之间有 3 个氢键（A 和 T 只有 2 个），如果局部 GC 含量超过 70%，转录出来的 mRNA 会自己粘成解不开的死疙瘩（发卡结构 Hairpin），把核糖体挡在门外；优化时必须把 **整体及局部窗口 GC 含量控制在 40%–60%**。\n- **【T7lac严谨型启动子】**：在噬菌体 T7 强启动子紧后方加上一个 `lacO` 操纵基因刹车位，同时质粒自己还带一个 `lacI` 刹车蛋白基因——没加 IPTG 时把启动子锁死（防本底泄漏表达毒害细菌），加了低浓度 IPTG 才按预定速度开启。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **基因合成下单前必查四项**：① 优化后的 DNA 序列重新翻译成氨基酸，与 UniProt 基准序列比对是否 **100% 一字不差**？② **CAI 是否 ≥0.80、GC 是否在 40%–60%**？③ 基因内部是否消除了克隆所用的限制性内切酶位点（如 `NcoI / NdeI / XhoI / BamHI`）？④ 终止密码子是否选用了大肠杆菌最严谨的 `TAA`（或 `TAA+TGA` 双终止）？",
    "cases": [
      {
        "title": "Ro52 基因合成下单前的序列优化参数对比表",
        "tag": "实战案例",
        "body": "## **1. Ro52 (TRIM21) 野生型 cDNA vs. 大肠杆菌优化型对比**\n| 评估维度 | 人源野生型 *TRIM21* cDNA | 经 *E. coli* 密码子优化后序列 | 改善意义 |\n|---|---|---|---|\n| **密码子适应指数 (CAI)** | 0.62（偏低） | **0.89（优秀）** | 翻译速率提升 ~3 倍，消除核糖体停滞 |\n| **稀有精氨酸密码子 (AGA/AGG)** | 含 14 处稀有密码子及连续簇 | **0 处（全部替换为高频 CGU/CGC）** | 彻底消除 30–40 kDa 翻译中途断链杂质带 |\n| **GC 含量与极端峰** | 局部 GC 峰值达 74%（含发卡） | **全局 52.4%（局部窗口 45%–58%）** | 消除 5' 端 mRNA 发卡，提升翻译起始效率 |\n| **氨基酸序列一致性** | 475 aa (UniProt P19474) | **475 aa (100.0% 恒等)** | 仅做同义密码子替换，蛋白序列零改变 |"
      }

        "body": "## **1. Ro52 (TRIM21) 野生型 cDNA vs. 大肠杆菌优化型对比**\n| 评估维度 | 人源野生型 *TRIM21* cDNA | 经 *E. coli* 密码子优化后序列 | 改善意义 |\n|---|---|---|---|\n| **密码子适应指数 (CAI)** | 0.62（偏低） | **0.89（优秀）** | 翻译速率提升 ~3 倍，消除核糖体停滞 |\n| **稀有精氨酸密码子 (AGA/AGG)** | 含 14 处稀有密码子及连续簇 | **0 处（全部替换为高频 CGU/CGC）** | 彻底消除 30–40 kDa 翻译中途断链杂质带 |\n| **GC 含量与极端峰** | 局部 GC 峰值达 74%（含发卡） | **全局 52.4%（局部窗口 45%–58%）** | 消除 5' 端 mRNA 发卡，提升翻译起始效率 |\n| **氨基酸序列一致性** | 475 aa (UniProt P19474) | **475 aa (100.0% 恒等)** | 仅做同义密码子替换，蛋白序列零改变 |"

    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 密码子优化与表达元件设计 / 密码子偏好性优化: CAI指数与GC含量调控",
    "title": "密码子偏好性优化: CAI指数与GC含量调控",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：利用 **遗传密码简并性（Degeneracy）**，将人类基因中大肠杆菌极度匮乏的 **稀有密码子（Rare Codons）** 替换为大肠杆菌高丰度 tRNA 对应的同义密码子，调控 **CAI指数（≥0.80）** 与 **5'端翻译起始区自由能（ΔG）**，防止核糖体中途“饿死脱轨”产生大量截短降解副产物。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【遗传密码简并性（Degeneracy）】**：64 种三联体密码子只编码 20 种氨基酸（比如精氨酸 Arg 有 6 种密码子：`CGU、CGC、CGA、CGG、AGA、AGG`）。不管用哪一种，翻译出来的都是同一个精氨酸，这就给了我们“换字不换意”的空间。\n- **【稀有密码子（Rare Codons）】**：人类细胞最爱用 `AGA / AGG` 编码精氨酸，但大肠杆菌偏偏只爱用 `CGU / CGC`，它体内负责搬运 `AGA / AGG` 的 tRNA 小货车数量不到总量的 1%！当核糖体读到人类基因里的连续两个 `AGA` 时，因为等不到货车送精氨酸过来，核糖体就会在半路卡死并掉下来（**核糖体停滞与脱轨 Ribosomal Stalling**），吐出一堆只有一半长度的半成品废蛋白！\n- **【5'端翻译起始区自由能（ΔG）】**：mRNA 开头前 40 个碱基（含 RBS 和起始密码子 ATG 附近）千万不能自己折成发卡结构；自由能 Δ G 越接近 0（负值越小，如 > -5 kcal/mol），说明开头越松散平坦，核糖体一上来就能顺利套上去开始翻译。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **密码子优化审核必看**：不仅要看基因合成公司给的总体 CAI 分数（≥0.80），还要重点检查 **① 有没有残留连续的稀有密码子簇（尤其是精氨酸 `AGA/AGG`、亮氨酸 `CUA`、异亮氨酸 `AUA`、脯氨酸 `CCC`）**；**② 融合标签与目标基因拼接的接口处有没有因为凑酶切位点而意外造出稀有密码子或高 GC 发卡**！",
    "cases": [
      {
        "title": "Ro52 消除精氨酸稀有密码子簇、根治 35 kDa 截短杂带实录",
        "tag": "实战案例",
        "body": "## **1. 故障现象**\n- 某早期批次直接用人白细胞提取逆转录的野生型 Ro52 cDNA 构建原核载体，诱导后在还原 SDS-PAGE 上除了全长目标带外，始终伴随一条占总量 30% 的比目标小约 15–20 kDa 的顽固杂带，加蛋白酶抑制剂 PMSF 也无法消除。\n\n---\n\n## **2. 根因定位与解决**\n- **根因**：并非被蛋白酶切碎，而是人源 Ro52 基因第 240–310 位氨基酸编码区存在密集的 `AGA / AGG / CCC` 稀有密码子簇，核糖体翻译到该处大比例停滞脱落（Premature Termination）。\n- **解决**：全基因按大肠杆菌高频密码子重写（CAI = 0.89）并配合含 `pRARE` 质粒的 `Rosetta(DE3)` 宿主双重保障，截短副产物彻底消失。"
      }

    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 密码子优化与表达元件设计 / 启动子选择: T7lac严谨调控与冷休克防泄漏",
    "title": "启动子选择: T7lac严谨调控与冷休克防泄漏",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握原核表达中 **启动子强度与折叠速率的匹配法则** —— 利用 **T7lac双重阻遏系统**（配合培养基葡萄糖本底抑制）或 **cspA冷休克启动子 / tac温和启动子**，严防加诱导剂前的 **本底泄漏表达（Leaky Expression）**，并把诱导后的转录洪峰控制在细胞折叠伴侣能够承受的范围内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【T7lac双重阻遏系统】**：普通 T7 启动子没有门锁，只要细菌里有一点点泄漏出来的 T7 聚合酶就会偷偷造蛋白；而 `pET-28a` 等载体采用的是 `T7lac` 启动子 —— ① 细菌染色体上的 T7 聚合酶基因前有一道 `lacUV5` 锁；② 质粒上的 T7 启动子紧后面又加了一道 `lacO` 锁，同时质粒自带 `lacI` 锁头基因。两道大锁同时锁住，没加 IPTG 时几乎滴水不漏！\n- **【本底泄漏表达（Leaky Expression）】**：如果启动子锁不严（或者用的普通 LB 培养基里含微量乳糖类似物），细菌在 37°C 刚接菌长身体的时候就开始偷偷造外源蛋白。像 Ro52（E3 泛素连接酶）这类对细菌代谢有轻度负担的蛋白，一旦提前泄漏表达，**带着质粒的好细菌就长不过扔掉质粒的空细菌**，等长到 OD₆₀₀=0.6 加 IPTG 时，锅里早就是一锅不产蛋白的“假阳性空菌”了！\n- **【葡萄糖本底抑制（Catabolite Repression）】**：在接菌扩增的 LB/TB 培养基里补加 **0.5%–1.0% 葡萄糖（Glucose）**，大肠杆菌有葡萄糖吃的时候体内 cAMP 极低，会彻底关死 `lac` 系统的本底泄漏，等长到对数期再降温加 IPTG，菌体活力最旺盛！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **启动子与泄漏防错必查**：① 查小试电泳胶上的 **「0 h 未诱导（Uninduced）泳道」** —— 如果还没加 IPTG 的未诱导泳道里就已经有很明显的粗目标带，说明存在严重本底泄漏，必须在扩增培养基中加 0.5% 葡萄糖或检查载体是否为 `T7lac`！",
    "cases": [
      {
        "title": "Ro52 种子活化期加 0.5% 葡萄糖防本底泄漏、稳住批间产量案例",
        "tag": "实战案例",
        "body": "## **1. 批间产量波动排查**\n- **现象**：过夜摇活的 `Rosetta(DE3)/pET28a-MBP-Ro52` 种子液，如果摇了 16 小时（长到饱和过夜）再按 1:100 转接大瓶，有时诱导后产量只有正常批的一半。\n- **机理**：酵母提取物（Yeast Extract）不同批次含有微量的半乳糖/乳糖迹量成分，在过夜饱和期引发了微量本底泄漏表达，导致质粒稳定性下降。\n- **受控措施**：在过夜种子活化培养基（LB + Kan + Cam）中固定添加 **0.5% 无菌葡萄糖**，彻底锁死过夜期的本底泄漏，转接放大批次产量 CV 从 25% 降至 <8%。"
      }

    "title": "载体骨架与抗性匹配: pET系列卡那抗性优势",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：选择结构紧凑、拷贝数适中且具备 **卡那霉素抗性（KanR）** 的 **pET系列专用载体（如 pET-28a / pET-24a / pET-SUMO）**，淘汰在发酵中极易被降解失效的 **氨苄青霉素抗性（AmpR）** 载体，确保从摇瓶到高密度发酵全程 **质粒保有率（Plasmid Retention）≥95%**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【pET系列专用载体】**：Novagen 开发的大肠杆菌表达黄金标准载体（基于 pBR322 的 ColE1 复制起点，每个细菌体内保持约 15–40 个质粒拷贝——拷贝数恰到好处，既够高产又不会像几百拷贝的 pUC 克隆质粒那样把细菌累死）。\n- **【卡那霉素抗性（KanR）vs. 氨苄青霉素抗性（AmpR）——为什么工业生产必选 KanR？】**：\n  - **氨苄青霉素（AmpR，如老款 pET-32a / pET-21a / pGEX）的致命缺陷**：质粒编码的 β-内酰胺酶会被细菌 **分泌到细胞外的培养液里**，在 37°C 摇瓶培养 3–4 小时后，整瓶培养液里的氨苄青霉素就被分解光了！接下来没有任何抗生素压力，那些扔掉质粒“轻装上阵”的空菌繁殖速度比带质粒的好菌快一倍，到加 IPTG 时满锅都是不产蛋白的空菌！\n  - **卡那霉素（KanR，如 `pET-28a`）的绝对优势**：卡那霉素抗性酶（氨基糖苷磷酸转移酶）留在细菌肚子里不外泌，培养液里的卡那霉素全程有效，任何敢扔掉质粒的细菌当场被杀死，质粒保有率接近 100%！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **载体抗性审核铁律**：新建自免抗原原核表达项目，**一律强制选用卡那霉素抗性（`KanR`，如 `pET-28a` 或 `pET-SUMO`）骨架**！若历史老项目（或外部转移质粒）使用的是氨苄抗性（`AmpR`）载体，在定型放大前应亚克隆换入 `KanR` 载体，或至少在发酵中使用耐酶降解的 **羧苄青霉素（Carbenicillin）** 替代普通氨苄！",
    "cases": [
      {
        "title": "Ro52 从 pMAL-c5X (AmpR) 升级至 pET-28a-MBP (KanR) 产量翻倍案例",
        "tag": "实战案例",
        "body": "## **1. 载体抗性升级对比**\n- 传统 MBP 融合载体 `pMAL-c5X` 带有氨苄青霉素抗性（`AmpR`），在 1L 大摇瓶 TB 培养基高密度培养（OD₆₀₀ 达 4.0–6.0）时，平板复测发现收获时仅 45% 的菌落还带有质粒（其余 55% 为丢失质粒的空菌）。\n- **改造方案**：将 `6xHis-MBP-Linker-TEV-Ro52` 完整表达盒构建入 **`pET-28a(+)`（卡那霉素抗性 `KanR`, 50 μg/mL）** 骨架，收获时质粒保有率 **>98%**，单位体积湿菌目标蛋白得率直接提升 1.8 倍。"
      }

    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 融合标签、Linker与酶切盒工程",
    "title": "融合标签、Linker与酶切盒工程",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：科学排布目标蛋白前端的 **融合双标签（6xHis-MBP / His-SUMO）**、**柔性连接肽（Linker）** 与 **高特异性蛋白酶切位点（TEV / ULP1）**，实现“表达期靠大标签保溶、粗纯期靠双亲和抓手捕获、酶切后靠反向挂镍柱（Reverse IMAC）把标签和酶 100% 剥离”的无痕纯化闭环。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【融合双标签（6xHis-MBP / His-SUMO）】**：把“纯化小磁铁（`6xHis`）”焊在“助溶大救生圈（`MBP` 或 `SUMO`）”的最前端（N 端），同时解决“怎么溶”和“怎么抓”两个问题。\n- **【柔性连接肽（Linker）】**：夹在大标签和酶切位点之间的柔软氨基酸绳索（如 15 aa 的 `(GGGGS)₃`），给蛋白酶留出下刀的操作空间。\n- **【高特异性蛋白酶切位点（TEV / ULP1）】**：只认特定 7 氨基酸暗号（TEV：`ENLYFQ↓G`）或特定三维构象（ULP1 认 SUMO 球体）的精密手术刀，切掉标签且绝不误伤目标蛋白。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **酶切盒排布铁律**：从 N 端到 C 端的顺序必须是 **`6xHis ➔ MBP ➔ Linker ➔ TEV位点 ➔ 目标蛋白`**！绝对不能把 `6xHis` 放在 `TEV位点` 和 `目标蛋白` 之间（除非你的目的是保留 His 标签，否则切下来的 42 kDa MBP 没有 His 标签，就没法用镍柱反挂除掉了！）。",
    "cases": [
      {
        "title": "Ro52 模块化标签盒的“正挂捕获 + 酶切 + 反挂除标”闭环设计",
        "tag": "实战案例",
        "body": "## **1. 为什么这套标签盒是 IVD 难溶抗原的黄金模板？**\n1. **第一步（正挂 Ni 柱或 Amylose 柱）**：破菌上清里的 `6xHis-MBP-Linker-TEV-Ro52` 被柱子牢牢抓住，洗掉 85% 细菌杂蛋白。\n2. **第二步（加 `6xHis-TEV` 酶透析切割）**：刀口精准切在 `ENLYFQ ↓ G` 之间，一刀两断变成：`6xHis-MBP-Linker-ENLYFQ`（带 His） + `G-Ro52`（**不带 His！**）。\n3. **第三步（反挂 Ni 柱 Reverse IMAC）**：把切完的混合液重新流过 Ni-NTA 柱 —— 带 His 的 `6xHis-MBP` 和带 His 的 `6xHis-TEV酶` 全被镍柱抓牢扣下，流穿液直接接到的就是 **零 MBP 标签、零 TEV 酶残留的纯净 Ro52**！"
      }

  "learn.2.1.0": {
    "key": "learn.2.1.0",
    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 融合标签、Linker与酶切盒工程 / 助溶与亲和双标签: 6xHis-MBP与His-SUMO设计",
    "title": "助溶与亲和双标签: 6xHis-MBP与His-SUMO设计",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握两大工业级助溶双标签 —— **6xHis-MBP（麦芽糖结合蛋白双标签）** 与 **6xHis-SUMO（小泛素相关修饰蛋白双标签）** 的助溶机理、分子量占比核算以及在全长 vs 截短体抗原上的选型分工。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【6xHis-MBP（麦芽糖结合蛋白双标签，~43.3 kDa）】**：大肠杆菌周质空间自带的天然高溶解度蛋白。当它放在 N 端先从核糖体翻译出来时，能在毫秒级内迅速折成一个极其亲水的大球，像老母鸡护小鸡一样把紧接着吐出来的 Ro52 疏水螺旋抱在怀里（**分子内伴侣效应 Intramolecular Chaperone**），不让不同 Ro52 分子之间撞在一起结成包涵体。\n- **【6xHis-SUMO（小泛素相关修饰蛋白双标签，~11.8 kDa）】**：源自酿酒酵母的天然伴侣小蛋白。优点是：① 个头只有 MBP 的 1/4（所以切标签后目标蛋白的质量得率高）；② 配套的 **ULP1（SUMO 蛋白酶）** 切割效率极高，且切完后目标蛋白第一个氨基酸可以是任何天然氨基酸（连一个多余的甘氨酸 G 都不留）。\n- **【标签质量扣减系数（Tag Mass Deduction）】**：审阅纯化得率时必须换算的数学账 —— 比如 `6xHis-MBP-Ro52` 全长总重约 43.3 + 54.2 = 97.5 kDa，其中 **MBP 标签占了 44.4% 的重量**！这意味着第一步粗纯拿到 100 mg 融合蛋白，哪怕 100% 切开且零损耗，里面真正的纯 Ro52 最多也只有 55.6 mg！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **双标签应用红线**：① **绝对禁止把带 `MBP` 大标签的未酶切融合蛋白直接作为 IVD 成品放行出库**！（因为 MBP 是大肠杆菌内源蛋白，约 5%–15% 的临床人血清中含有抗大肠杆菌/抗 MBP 抗体，留着 MBP 包被酶标板或磁珠会导致严重的临床假阳性！）；② 核算纯化收率时必须按切除标签后的 **净目标蛋白毫克数** 入账！",
    "cases": [
      {
        "title": "Ro52 全长选 6xHis-MBP、125–268 截短体选 6xHis-SUMO 的工程决策",
        "tag": "实战案例",
        "body": "## **1. 全长与截短体的标签精准匹配**\n- **路线 A（Ro52 全长 1–475 aa，极难溶）**：选用助溶力最强的 **`6xHis-MBP-TEV`** 系统，确保包含 N 端双锌指、中间长螺旋和 C 端球状域的 54.2 kDa 全长链在 16°C 下获得 >50% 可溶表达。\n- **路线 B（Ro52 截短体 125–268 aa，16.8 kDa）**：若用 43 kDa 的 MBP 去带 16.8 kDa 的小截短体，标签占了总重的 72%（切完只剩 28%，太不划算）；因此截短体优选仅 11.8 kDa 的 **`6xHis-SUMO`** 标签（或切标后高收率 MBP 体系），切标后理论净蛋白占比提升至 **58.7%**，且 ULP1 酶切零氨基酸残留！"
      }

    "title": "助溶与亲和双标签: 6xHis-MBP与His-SUMO设计",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握两大工业级助溶双标签 —— **6xHis-MBP（麦芽糖结合蛋白双标签）** 与 **6xHis-SUMO（小泛素相关修饰蛋白双标签）** 的助溶机理、分子量占比核算以及在全长 vs 截短体抗原上的选型分工。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【6xHis-MBP（麦芽糖结合蛋白双标签，~43.3 kDa）】**：大肠杆菌周质空间自带的天然高溶解度蛋白。当它放在 N 端先从核糖体翻译出来时，能在毫秒级内迅速折成一个极其亲水的大球，像老母鸡护小鸡一样把紧接着吐出来的 Ro52 疏水螺旋抱在怀里（**分子内伴侣效应 Intramolecular Chaperone**），不让不同 Ro52 分子之间撞在一起结成包涵体。\n- **【6xHis-SUMO（小泛素相关修饰蛋白双标签，~11.8 kDa）】**：源自酿酒酵母的天然伴侣小蛋白。优点是：① 个头只有 MBP 的 1/4（所以切标签后目标蛋白的质量得率高）；② 配套的 **ULP1（SUMO 蛋白酶）** 切割效率极高，且切完后目标蛋白第一个氨基酸可以是任何天然氨基酸（连一个多余的甘氨酸 G 都不留）。\n- **【标签质量扣减系数（Tag Mass Deduction）】**：审阅纯化得率时必须换算的数学账 —— 比如 `6xHis-MBP-Ro52` 全长总重约 43.3 + 54.2 = 97.5 kDa，其中 **MBP 标签占了 44.4% 的重量**！这意味着第一步粗纯拿到 100 mg 融合蛋白，哪怕 100% 切开且零损耗，里面真正的纯 Ro52 最多也只有 55.6 mg！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **双标签应用红线**：① **绝对禁止把带 `MBP` 大标签的未酶切融合蛋白直接作为 IVD 成品放行出库**！（因为 MBP 是大肠杆菌内源蛋白，约 5%–15% 的临床人血清中含有抗大肠杆菌/抗 MBP 抗体，留着 MBP 包被酶标板或磁珠会导致严重的临床假阳性！）；② 核算纯化收率时必须按切除标签后的 **净目标蛋白毫克数** 入账！",
    "cases": [
      {
        "title": "Ro52 全长选 6xHis-MBP、125–268 截短体选 6xHis-SUMO 的工程决策",
        "tag": "实战案例",
        "body": "## **1. 全长与截短体的标签精准匹配**\n- **路线 A（Ro52 全长 1–475 aa，极难溶）**：选用助溶力最强的 **`6xHis-MBP-TEV`** 系统，确保包含 N 端双锌指、中间长螺旋和 C 端球状域的 54.2 kDa 全长链在 16°C 下获得 >50% 可溶表达。\n- **路线 B（Ro52 截短体 125–268 aa，16.8 kDa）**：若用 43 kDa 的 MBP 去带 16.8 kDa 的小截短体，标签占了总重的 72%（切完只剩 28%，太不划算）；因此截短体优选仅 11.8 kDa 的 **`6xHis-SUMO`** 标签（或切标后高收率 MBP 体系），切标后理论净蛋白占比提升至 **58.7%**，且 ULP1 酶切零氨基酸残留！"
      }
    ],

  "learn.2.1.1": {
    "key": "learn.2.1.1",
    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 融合标签、Linker与酶切盒工程 / 特异性蛋白酶切位点: TEV/ULP1原理与淘汰凝血酶",
    "title": "特异性蛋白酶切位点: TEV/ULP1原理与淘汰凝血酶",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握高特异性工具蛋白酶 —— **TEV蛋白酶（识别 ENLYFQ↓G/S）**、**ULP1蛋白酶（识别 SUMO 三维构象）** 与 **HRV 3C蛋白酶（识别 LEVLFQ↓GP）** 的切割原理与反应条件，全面淘汰容易在目标蛋白内部乱切的 **凝血酶（Thrombin）**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【TEV蛋白酶（识别 ENLYFQ↓G/S）】**：烟草蚀纹病毒（Tobacco Etch Virus）蛋白酶。它必须同时核对 7 个连续氨基酸暗号 **`Glu-Asn-Leu-Tyr-Phe-Gln ↓ Gly/Ser`** 才会下刀（刀口在 Gln 和 Gly 之间，切完后目标蛋白 N 端只多留 1 个极小的甘氨酸 G 或丝氨酸 S）。\n  - **工业优势**：① 7 个氨基酸严谨识别，几乎绝不乱切目标抗原内部；② 可在 **4°C 低温** 下过夜温和切割（保护抗原不失活）；③ 本实验室可自制高活性 **`6xHis-TEV(S219V)` 抗自切突变体酶**，成本极低且自带 His 标签方便反挂去除！\n- **【ULP1蛋白酶（识别 SUMO 三维构象）】**：专门配对 SUMO 标签的酵母蛋白酶。它不认短短几个线性氨基酸，而是像钥匙插锁孔一样认整个 SUMO 蛋白的三维立体形状，在 SUMO 尾巴的 `Gly-Gly ↓` 后面一刀切下，切完的目标蛋白 N 端 **零多余残基**，且在 4°C 下 1:500 酶量即可切完。\n- **【凝血酶（Thrombin）为什么必须淘汰？】**：老教材 `pET-28a` 默认自带的是 Thrombin 位点（`LVPR↓GS`），但凝血酶识别极不严谨——只要目标蛋白表面有暴露的 `Arg-Gly` 或碱性精氨酸簇（像 Ro52 有 33 个精氨酸！），凝血酶就会像喝醉了一样把目标抗原内部切得七零八落！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **酶切工艺三必查**：① **TEV 酶是半胱氨酸蛋白酶，活性中心怕氧化，酶切 Buffer 里必须含 `0.5 mM TCEP` 或 `0.5–1 mM DTT`（但如果要紧接着上镍柱反挂，优先用 `0.5 mM TCEP` 因为不伤镍柱）**；② **高浓度咪唑（>150 mM）和去垢剂会强烈抑制 TEV 酶活**，因此镍柱洗脱液最好采用 **“边透析除咪唑、边在透析袋里 4°C 过夜酶切”** 的二合一工艺；③ 酶切前后必须并排跑 SDS-PAGE 确认切割率 ≥90%–95%！",
    "cases": [
      {
        "title": "Ro52 的“4°C 边透析除咪唑、边 TEV 酶切”高效二合一 SOP",
        "tag": "实战案例",
        "body": "## **1. 为什么“边透析边酶切”能省一天时间且防沉淀？**\n- **痛点**：从 Ni-NTA 柱刚洗脱下来的 `6xHis-MBP-TEV-Ro52` 含有 **250 mM 高浓度咪唑**。如果直接加 TEV 酶，高咪唑不仅抑制 TEV 酶活性，还会让切掉 MBP 保护伞后的裸 Ro52 在高咪唑下析出沉淀；而如果先透析一天除咪唑、第二天再加酶切一天，又太慢（耗时 48h）。\n\n---\n\n## **2. 二合一标准操作规程（14 小时全部搞定）**\n1. **混酶入袋**：在 Ni-NTA 洗脱液（假设含 40 mg `His-MBP-Ro52`）中直接按质量比 **`1 : 30`** 加入本室自制的 **`6xHis-TEV` 蛋白酶（约 1.3 mg）**，装入 `14 kDa MWCO` 透析袋。\n2. **4°C 低温同步透析酶切**：将透析袋置入 100 倍体积的 **无咪唑透析液（`50 mM Tris pH 7.8, 300 mM NaCl, 5% Glycerol, 0.5 mM TCEP`）** 中，4°C 磁力慢速搅拌过夜（12–14 h）。\n3. **效果**：随着咪唑在头 2 小时内迅速扩散出透析袋，TEV 酶活性全面释放，次日早晨取出时 **咪唑已降至 <3 mM、同时酶切率达 >95%**，溶液澄清透明，可直接上第二遍 Ni-NTA 反挂柱！"
      }

  "learn.2.1.2": {
    "key": "learn.2.1.2",
    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 融合标签、Linker与酶切盒工程 / 柔性连接肽(Linker): 消除空间位阻与阅读框对齐",
    "title": "柔性连接肽(Linker): 消除空间位阻与阅读框对齐",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在融合大标签（如 42 kDa 的 MBP）与蛋白酶切位点（TEV）、或嵌合抗原的不同表位区段之间，设计合适长度与亲水柔性的 **连接肽（Linker，通常 15–25 aa）**，彻底消除 **空间位阻（Steric Hindrance）**，并严格执行 **阅读框对齐（In-Frame Check）** 杜绝移码突变。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【空间位阻（Steric Hindrance）】**：可以想象成“两个大胖子挤在窄门里” —— `MBP` 是一个 42.5 kDa 的大球，`Ro52 二聚体` 是一个 108 kDa 的大棒；如果中间不留一段绳子直接把 TEV 的 7 个氨基酸切点焊在两个大胖子中间，重达 27 kDa 的 TEV 蛋白酶根本挤不进缝隙去够那个切点，结果就是 **“蛋白酶加得再多也切不动”**！\n- **【柔性连接肽（Flexible Linker，如 `(GGGGS)₃`）】**：由 4 个甘氨酸（`Gly, G`：没有侧链，像360度自由旋转的万向球节）和 1 个丝氨酸（`Ser, S`：带羟基 `-OH` 亲水，防止绳子疏水打结）组成的五肽重复单元。重复 3–4 次（15–20 aa）就能拉开约 4–6 纳米的宽松距离，让 TEV 酶轻松下刀。\n- **【刚性连接肽（Rigid Linker，如 `(EAAAK)₃`）】**：自身会折成一根硬质小 α-螺旋杆的支撑杆连接肽，用于必须把两个功能域强行撑开、绝对不允许它们撞在一起的特殊融合蛋白。\n- **【阅读框对齐（In-Frame Check）】**：核糖体读 mRNA 是“每 3 个碱基（1 个密码子）一步”往下跳的。设计 Linker 和酶切点时，**插入的所有碱基总数除以 3 必须余数为 0**，且中间绝对不能不小心拼出终止密码子（`TAA / TAG / TGA`）！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Linker 与阅读框核查铁律**：① 大标签（MBP/GST）与 TEV 酶切位点之间是否留足了 **≥12–20 aa 的柔性间隔区**？② 下单前必须用 SnapGene 或LabOS生物计算器把 **从第一个 `ATG` 到最后一个 `TAA` 的整条 DNA 一口气直接翻译成一条完整多肽**，肉眼核对 TEV 切点后面的 Ro52 第 1 个氨基酸是不是正确对齐！",
    "cases": [
      {
        "title": "Ro52 插入 15 aa (GGGGS)₃ 柔性 Linker 将 TEV 切割率从 35% 提升至 96% 案例",
        "tag": "实战案例",
        "body": "## **1. 空间位阻导致的酶切失败复盘**\n- **失败构建（V0.1 旧版）**：在 MBP C 端仅用了多克隆位点自带的 3 个氨基酸（`G-S-H`）就直接连 `ENLYFQG-Ro52(1-475)`。纯化出融合蛋白后，即使把 TEV 酶投料比加到 1:10、25°C 切 16 小时，SDS-PAGE 显示仍有 **>60% 的 97 kDa 融合蛋白未切开**（因为 Ro52 N 端紧实的锌指结构域与 MBP 大球把切点夹死了）。\n\n---\n\n## **2. 成功改造（V1.0 受控版）**\n- **插入 `(GGGGS)₃`（15 aa：`GGT GGC GGT GGA AGC GGC GGT GGC GGA TCC GGT GGC GGT GGC AGC`，注意同义错开重复序列防 PCR 打滑）**：TEV 酶在 **4°C、1:30 低酶量** 下过夜切割率即达 **96% 以上**！"
      }

    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 融合标签、Linker与酶切盒工程 / 柔性连接肽(Linker): 消除空间位阻与阅读框对齐",
    "title": "柔性连接肽(Linker): 消除空间位阻与阅读框对齐",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在融合大标签（如 42 kDa 的 MBP）与蛋白酶切位点（TEV）、或嵌合抗原的不同表位区段之间，设计合适长度与亲水柔性的 **连接肽（Linker，通常 15–25 aa）**，彻底消除 **空间位阻（Steric Hindrance）**，并严格执行 **阅读框对齐（In-Frame Check）** 杜绝移码突变。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【空间位阻（Steric Hindrance）】**：可以想象成“两个大胖子挤在窄门里” —— `MBP` 是一个 42.5 kDa 的大球，`Ro52 二聚体` 是一个 108 kDa 的大棒；如果中间不留一段绳子直接把 TEV 的 7 个氨基酸切点焊在两个大胖子中间，重达 27 kDa 的 TEV 蛋白酶根本挤不进缝隙去够那个切点，结果就是 **“蛋白酶加得再多也切不动”**！\n- **【柔性连接肽（Flexible Linker，如 `(GGGGS)₃`）】**：由 4 个甘氨酸（`Gly, G`：没有侧链，像360度自由旋转的万向球节）和 1 个丝氨酸（`Ser, S`：带羟基 `-OH` 亲水，防止绳子疏水打结）组成的五肽重复单元。重复 3–4 次（15–20 aa）就能拉开约 4–6 纳米的宽松距离，让 TEV 酶轻松下刀。\n- **【刚性连接肽（Rigid Linker，如 `(EAAAK)₃`）】**：自身会折成一根硬质小 α-螺旋杆的支撑杆连接肽，用于必须把两个功能域强行撑开、绝对不允许它们撞在一起的特殊融合蛋白。\n- **【阅读框对齐（In-Frame Check）】**：核糖体读 mRNA 是“每 3 个碱基（1 个密码子）一步”往下跳的。设计 Linker 和酶切点时，**插入的所有碱基总数除以 3 必须余数为 0**，且中间绝对不能不小心拼出终止密码子（`TAA / TAG / TGA`）！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Linker 与阅读框核查铁律**：① 大标签（MBP/GST）与 TEV 酶切位点之间是否留足了 **≥12–20 aa 的柔性间隔区**？② 下单前必须用 SnapGene 或LabOS生物计算器把 **从第一个 `ATG` 到最后一个 `TAA` 的整条 DNA 一口气直接翻译成一条完整多肽**，肉眼核对 TEV 切点后面的 Ro52 第 1 个氨基酸是不是正确对齐！",
    "cases": [
      {
        "title": "Ro52 插入 15 aa (GGGGS)₃ 柔性 Linker 将 TEV 切割率从 35% 提升至 96% 案例",
        "tag": "实战案例",
        "body": "## **1. 空间位阻导致的酶切失败复盘**\n- **失败构建（V0.1 旧版）**：在 MBP C 端仅用了多克隆位点自带的 3 个氨基酸（`G-S-H`）就直接连 `ENLYFQG-Ro52(1-475)`。纯化出融合蛋白后，即使把 TEV 酶投料比加到 1:10、25°C 切 16 小时，SDS-PAGE 显示仍有 **>60% 的 97 kDa 融合蛋白未切开**（因为 Ro52 N 端紧实的锌指结构域与 MBP 大球把切点夹死了）。\n\n---\n\n## **2. 成功改造（V1.0 受控版）**\n- **插入 `(GGGGS)₃`（15 aa：`GGT GGC GGT GGA AGC GGC GGT GGC GGA TCC GGT GGC GGT GGC AGC`，注意同义错开重复序列防 PCR 打滑）**：TEV 酶在 **4°C、1:30 低酶量** 下过夜切割率即达 **96% 以上**！"
      }
    ],
    "updatedAt": "2026-11-20T13:10:00.000Z"

    "title": "分子工程改造路线与菌库分工",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：当天然全长抗原存在难表达或固有交叉反应域时，科学规划 **全长基准与结构域截短体平行设计**、**暴露疏水斑块定点突变** 或 **多表位嵌合串联** 路线，并在实验室层面严格执行 **克隆宿主（DH5α）与表达宿主（Rosetta/BL21）双菌库物理隔离与分工**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【全长基准与结构域截短体平行设计】**：截短体虽好养活，但有漏检少数患者抗体的风险；因此工程改造必须保留全长版本作为“对照标尺”，用同一套弱阳性血清盘检验截短体有没有丢表位。\n- **【同义错开防重组（Degenerate Wobble）】**：当插入 `(GGGGS)₃` 这种重复氨基酸序列时，DNA 碱基不能傻乎乎地写三遍一模一样的 `GGTGGCGGTGGCAGC`，而要换用不同的同义密码子（如 `GGT GGC...` 和 `GGA GGT...`），防止 PCR 扩增或细菌复制时发生“同源打滑丢失”。\n- **【双菌库物理隔离与分工】**：`DH5α` 管质粒保种与测序，`Rosetta(DE3)` 管蛋白诱导表达，两套菌库分别贴签存放于不同冻存盒。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **工程改造审核必看**：任何截短或突变方案，必须画出 **“在全长序列上的坐标对照图”**，确保刀口落在无规卷曲连接区，且绝不破坏二聚体组装必需的内部疏水骨架。",
    "cases": [
      {
        "title": "Ro52 全长 (1–475) 与核心截短体 (125–268) 的结构域边界切割图",
        "tag": "实战案例",
        "body": "## **1. 为什么截短体刀口选在 125 和 268 位？**\n- 查看 UniProt `P19474` 结构域边界：\n  - 第 `92–123 aa` 是 B-box 2 锌指域的结尾，第 `128–238 aa` 是 Coiled-Coil 螺旋域的开头 → **第 `125 aa` 恰好处在两个结构域之间的无规卷曲铰链区**！\n  - 第 `238 aa` 是 Coiled-Coil 结尾，第 `268–475 aa` 是 C 端 PRY/SPRY (B30.2) 域开头 → **第 `268 aa` 恰好处在进入 PRY/SPRY 球状域之前的边界处**！\n- **工程收益**：`125–268 aa`（共 144 aa）一刀切掉了 N 端两个需要补锌的锌指域，另一刀切掉了 C 端会非特异结合人血清 IgG Fc 的 PRY/SPRY 域，100% 完整保留了中间的 Coiled-Coil 二聚体与 p200 核心构象表位！"
      }

  "learn.2.2.0": {
    "key": "learn.2.2.0",
    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 分子工程改造路线与菌库分工 / 全长基准与结构域截短体平行设计策略",
    "title": "全长基准与结构域截短体平行设计策略",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：建立 **全长天然构建体（Full-Length Native Construct）** 与 **优势表位结构域截短体（Domain-Truncated Construct）** 的平行比选与 **摩尔浓度/有效包被量归一化** 评价方法，在提升产率、降低非特异背景的同时守住临床检出灵敏度底线。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【全长天然构建体（Full-Length Native Construct）】**：包含从第 1 号到最后 1 号氨基酸的完整天然序列。优点是覆盖 100% 的线性和构象表位，绝对不会因为少了一块而漏检罕见表位型患者；缺点是往往分子量偏大、含疏水或跨膜/非特异结合区，制备难度高、收率偏低。\n- **【优势表位结构域截短体（Domain-Truncated Construct）】**：只截取文献和结构分析证实的患者抗体最集中的核心结构域（如 Ro52 的 `125–268 aa`，或核糖体 P0 的 C 端优势区）。优点是表达量极高、极易溶解、切掉了惹祸的交叉反应域；潜在风险是可能漏检 3%–10% 只识别边缘结构域的弱阳性患者。\n- **【摩尔浓度/有效包被量归一化】**：全长 Ro52（54.2 kDa）的单个分子重量是截短体（16.8 kDa）的 **3.2 倍**！如果按相同的质量浓度（比如都按 1.0 μg/mL）去包被酶标板，截短体孔里的抗原分子个数其实是全长孔的 3.2 倍！因此做头对头比武时，必须同时比较 **等质量浓度梯度** 和 **等摩尔浓度梯度（nM）** 下的表现。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **截短体替代全长的放行铁律**：截短体若想单独定型替代全长（或与全长按比例复配包被），必须在 **≥20 例临床确诊阳性血清（含 ≥5 例弱阳性）** 上证明 **零新增漏检**！若截短体背景极好但漏检 1–2 例只认 N/C 端的患者，黄金工业方案是采用 **「全长 Ro52 + 125–268 截短体 按 1:2 质量比复配包被（Cocktail Coating）」**，兼得高灵敏度与高信噪比！",
    "cases": [
      {
        "title": "Ro52“全长 + 125–268 截短体”双抗原复配包被（Cocktail）工业进阶策略",
        "tag": "实战案例",
        "body": "## **1. 单用全长 vs 单用截短体 vs 双抗原复配对比**\n| 包被方案 | 强/中阳检出 (15例) | 边缘弱阳检出 (5例) | 高 IgG/RF 干扰阴性特异度 (30例) | 综合评价 |\n|---|---|---|---|---|\n| **单用全长 (1–475 aa, 1.5 μg/mL)** | 15/15 | 5/5 (100%) | 28/30 (2 例高 IgG 轻度背景偏高) | 表位最全，但高浓度包被时 C 端有微弱 Fc 背景 |\n| **单用截短体 (125–268 aa, 1.0 μg/mL)** | 15/15 | 4/5 (1 例仅认 N 端 RING-linker 患者信号偏弱) | 30/30 (100% 极低本底) | 本底极干净、成本极低，但单用有 5% 边缘表位减弱风险 |\n| **★ 黄金复配 (0.5 μg/mL 全长 + 0.8 μg/mL 截短体)** | **15/15** | **5/5 (100%)** | **30/30 (100% 极低本底)** | **截短体提供高密度 Coiled-Coil 主表位，低剂量全长补齐边缘表位且将 Fc 背景压至最低！** |"
      }

    "title": "疏水斑块定点突变与嵌合多表位串联设计",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握蛋白质理性改造中的 **暴露疏水斑块定点突变（Site-Directed Mutagenesis）**、**游离半胱氨酸防氧化替换（Cys→Ser）** 以及 **多表位嵌合串联设计（Chimeric Poly-epitope）** 的适用边界与对照验证规范。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【暴露疏水斑块定点突变（Site-Directed Mutagenesis）】**：结合三维结构（PDB 或 AlphaFold 模型），找出位于蛋白外表面、不属于抗体结合表位、却老是跟别的分子粘在一起的孤立疏水残基（如亮氨酸 Leu、缬氨酸 Val），将其定点突变为亲水的谷氨酰胺（Gln）或丝氨酸（Ser）。**禁忌：严禁突变结构域内部疏水核心或二聚体结合面（如 Coiled-Coil 的七肽重复疏水脊）**！\n- **【游离半胱氨酸防氧化替换（Cys→Ser）】**：如果一段截短体或多肽里只含 1 个落单的半胱氨酸（Cys，不参与配对也不抓锌），在保存过程中它的 `-SH` 极易两两氧化成错误的分子间二硫键二聚体；将其突变为体积和极性几乎一模一样的 **丝氨酸（Ser，把 `-SH` 换成 `-OH`）**，就能彻底根除氧化交联且不影响空间结构。\n- **【多表位嵌合串联设计（Chimeric Poly-epitope）】**：把两段或多段线性/结构域表位用 `(GGGGS)₃` 串成一条新蛋白。**必须警惕连接处拼出自然界原本不存在的“人工假表位（Neo-epitope）”吸正常人血清产生假阳性**。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **突变与嵌合审核红线**：① 任何定点突变在立项与质粒图谱中必须以标准格式标明（如 `C195S` 代表第 195 位 Cys 突变为 Ser），绝不能还用野生型名字混叫；② 嵌合体必须设置 **「单片段对照 + 物理混合对照 + 连接肽空白对照」** 三组对照！",
    "cases": [
      {
        "title": "Ro52 截短体 (125–268) 内部唯一游离半胱氨酸 (Cys195) 的保护策略",
        "tag": "实战案例",
        "body": "## **1. 序列精细扫描发现的隐藏风险点**\n- 扫描 UniProt `P19474` 的 `125–268 aa` 区段发现：虽然切掉了 N 端富含 Cys 的两个锌指域，但在 Coiled-Coil 螺旋中段的 **第 195 位仍含有 1 个孤立的半胱氨酸（`Cys195`）**，且紧邻 p200 核心表位（200–239 aa）。\n\n---\n\n## **2. 工程应对策略**\n- 因为 `Cys195` 紧挨 p200 核心表位，为避免突变影响构象识别，首选 **在纯化与最终储存缓冲液中全程添加 `0.5 mM TCEP`（长效非巯基还原剂）** 保持 `Cys195` 处于天然还原态，既100%保留天然野生型序列，又彻底杜绝了存储期分子间二硫键错配交联。"
      }

  "learn.2.2.2": {
    "key": "learn.2.2.2",
    "path": "基础知识学习 / ② 分子工程设计与载体构建 (Design & Gate R2/R3) / 分子工程改造路线与菌库分工 / 克隆宿主(DH5α)与表达宿主(Rosetta/BL21)双菌库分工",
    "title": "克隆宿主(DH5α)与表达宿主(Rosetta/BL21)双菌库分工",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：建立严格的 **克隆感受态（DH5α / TOP10）** 与 **表达感受态（BL21(DE3) / Rosetta(DE3)）** 双菌库分工与防错机制，从遗传稳定性根源上理解 **为什么绝对不能在 BL21/Rosetta 表达菌株中长期保藏和传代质粒**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【克隆感受态（DH5α / TOP10）—— 质粒的“金库保险箱”】**：\n  1. **`recA1` 突变（重组酶缺陷）**：彻底关掉了细菌把外源质粒乱切乱重组的机器，保证含有重复序列（如 `(GGGGS)₃` Linker）的质粒在里面扩增一万代也不会发生缺失或突变；\n  2. **`endA1` 突变（核酸内切酶 I 缺陷）**：敲除了细菌体内会降解质粒的核酸酶，提出来的质粒超螺旋比例极高、极其纯净；\n  3. **绝对无 `DE3`（无 T7 RNA 聚合酶）**：`pET` 质粒在 `DH5α` 里就像一张锁在保险箱里的图纸，**绝对不会泄漏表达哪怕一个分子的 Ro52 蛋白**，细菌没有任何生长压力，质粒 100% 稳定！\n- **【表达感受态（BL21(DE3) / Rosetta(DE3)）—— 高负荷运转的“生产车间”】**：\n  1. **含 `λDE3`（带 T7 RNA 聚合酶基因）**：随时准备高强度转录外源蛋白，但也因此总有微量的本底泄漏；\n  2. **通常为 `recA+` 且无 `endA1` 保护**：如果在 `BL21(DE3)` 里把带质粒的菌反复划板、挑菌传代或者长期保存再活化，那些质粒上发生“启动子突变失活”或“把外源基因删掉一截”的突变菌，因为不用背负泄漏表达的负担，会迅速淘汰正常菌株 —— 导致 **“上个月这管 BL21 甘油菌还能表达，这个月拿出来划板怎么一点蛋白都不出了”**！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **双菌库管理铁律（写进实验室 SOP 与 LabOS 校验）**：\n> 1. **主质粒库与主细胞库（MCB）必须且只能保存在 `DH5α` 中**（同时冻存 `-20°C/-80°C` 高纯度质粒 DNA 备份管）；\n> 2. **每次中试或大生产前，优先取测序确认的质粒 DNA 新鲜转化 `Rosetta(DE3)` 涂板挑单克隆**（或使用经验证一代以内的工作种子管 WCB，严禁拿诱导摇瓶剩的菌液连续转接传代）！",
    "cases": [
      {
        "title": "DH5α 与 Rosetta(DE3) 基因型差异及双菌库标准建档流程",
        "tag": "实战案例",
        "body": "## **1. 克隆菌 vs 表达菌核心基因型与职责对照表**\n| 维度 | 克隆菌株 **`DH5α`** | 表达菌株 **`Rosetta(DE3)`** |\n|---|---|---|\n| **T7 RNA 聚合酶 (`DE3`)** | **无（绝对不表达 pET 质粒蛋白）** | **有（IPTG 诱导强效表达）** |\n| **同源重组防止 (`recA1`)** | **有（质粒序列高度稳定不丢片段）** | 无（长期传代易发生质粒重组突变） |\n| **蛋白酶缺失 (`lon / ompT`)** | 无 | **有（缺失 Lon 和 OmpT，防目标蛋白降解）** |\n| **稀有密码子 tRNA (`pRARE`)** | 无 | **有（自带氯霉素抗性 pRARE 质粒补 6 种稀有 tRNA）** |\n| **受控用途** | **质粒连接转化、提质粒、Sanger 测序、MCB 永久保种** | **仅用于蛋白诱导表达生产（单次新鲜转化或一代 WCB）** |"
      }
    ],
    "updatedAt": "2026-11-20T13:10:00.000Z"
  },

    "title": "Gate R2/R3｜②③ 分子设计、Sanger测序质检与种子库放行",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：**Gate R2/R3（分子设计评审与构建原料放行关口）** 将工序 ② 和 ③ 的质检标准合并把关 —— 每一个候选构建体必须通过 **Sanger双向全长测序拼接100%核验（零点突变、零移码、零未覆盖缺口、零双峰套峰）**、完成 **双酶切/菌落PCR交叉确认**，并在 LabOS 中完成 **序列版本号、DH5α主种子库位置与合格外购物料（ASL）** 的受控锁定后，方准进入阶段 ③ 上游发酵。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Sanger双向全长测序拼接100%核验】**：第一代测序单次读长只有约 700–800 bp，而 `6xHis-MBP-Linker-TEV-Ro52` 全长编码区超过 2,600 bp！只用通用的 `T7` 正向和 `T7ter` 反向两个引物测序，中间会留下 1,000 bp 的“未测盲区”！**必须额外设计内部搭桥测序引物（如 MBP 3' 端正向引物），把整条编码区从头到尾 100% 无缝拼接读通，且查看 `.ab1` 原始彩色峰图确认峰型单一锐利无套峰**！\n- **【双酶切/菌落PCR交叉确认】**：菌落 PCR 或质粒双酶切跑琼脂糖凝胶电泳只用来初筛“插入片段大小对不对（如 ~2.6 kb）”；**初筛条带大小正确绝对不能代替全长测序放行**（因为少 1 个碱基的移码突变在电泳胶上大小完全看不出差别，但翻译出来全是废码）！\n- **【序列与构建体版本冻结】**：一旦测序通过，该质粒的序列图谱文件（`.dna / .gb`）即赋予唯一受控版本号（如 `V1.0`），后续所有表达批、纯化批和 CoA 必须关联此版本号。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Gate R2/R3 放行四件套核查表**：\n> - **① 检查方法**：核对 `.ab1` 测序原始峰图与拼接翻译比对报告、质粒电泳图、种子管标签（宿主/版本/位置）及外购酶/填料供方合格名录（ASL）；\n> - **② 通过依据**：从 `ATG` 到终止密码子 `TAA` 100% 覆盖且氨基酸翻译与设计图 100% 一致；`DH5α` 主种子库与 `Rosetta(DE3)` 表达株已分别建档入库；\n> - **③ 未通过动作**：存在测序覆盖盲区、点突变、移码、混合套峰或宿主身份未标明的克隆，**严禁进入表达小试**；外购物料供方不在合格名录的（防外审不符合项 Q8.4.1），先停用并补齐供方评审；\n> - **④ 交付物**：Sanger 测序原始数据包与比对报告、受控构建体图谱（含版本号）、LabOS「批次与样品」种子库位置台账。",
    "cases": [
      {
        "title": "Ro52 质粒（2,658 bp 长片段）三引物全覆盖 Sanger 测序核验案例",
        "tag": "Gate 放行案例",
        "body": "## **1. 长融合基因防“测序盲区”三引物方案**\n- `6xHis-MBP-Linker-TEV-Ro52(1-475)` 整个开放阅读框（ORF）长达 **2,658 bp**。\n- **测序引物布局**：\n  1. **引物 1（`T7 Promoter` 正向）**：覆盖 `1 ~ 850 bp`（核验 RBS、ATG、6xHis 及 MBP 前半段）；\n  2. **引物 2（`MBP-Internal-F` 内部正向，位于 750 bp 处）**：覆盖 `780 ~ 1,680 bp`（**核心核验区：MBP 尾端、`(GGGGS)₃` Linker、`ENLYFQG` TEV 切点及 Ro52 N 端 RING/B-box 域**）；\n  3. **引物 3（`T7 Terminator` 反向）**：反向覆盖 `2,658 ~ 1,600 bp`（核验 Ro52 Coiled-Coil、PRY/SPRY 域及终止密码子 `TAA`）。\n- **核验结论**：三段重叠区（Overlap >70 bp）拼接后 2,658 bp **覆盖率 100.0%，碱基匹配率 100.0%，`.ab1` 峰图无任何杂峰**，准予通过 Gate R3 签发主种子库批号！"
      }

  "learn.3": {
    "key": "learn.3",
    "path": "基础知识学习 / ③ 上游发酵与可溶性表达 (Upstream & Gate R4)",
    "title": "③ 上游发酵与可溶性表达 (Upstream & Gate R4)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在选定的表达宿主（如 `Rosetta(DE3)`）中，通过精细控制 **菌体生长对数期（OD₆₀₀）**、**诱导前低温预冷（16°C–20°C）**、**低浓度IPTG（0.1–0.2mM）** 与 **辅因子补料（ZnCl₂）**，并在 **冰水浴脉冲超声/高压均质破壁** 后通过 **等体积归一化SDS-PAGE与Mini-Pulldown小量挂柱** 验证真实可溶性，产出合格的湿菌体或粗提上清移交下游纯化。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【菌体生长对数期（OD₆₀₀ = 0.6–0.8）】**：细菌一分为二、二分为四分裂最旺盛的“青年黄金期”；太早诱导（OD < 0.3）菌太少总产量低，太晚诱导（OD > 1.5 进入衰老稳定期）核糖体和伴侣活力下降且营养耗尽。\n- **【诱导前低温预冷（16°C–20°C）】**：加 IPTG 之前，先把摇床和菌液从 37°C 彻底冷透到 16–20°C，确保第一批合成出来的蛋白就在低温保护下慢速正确折叠。\n- **【等体积归一化SDS-PAGE与Mini-Pulldown小量挂柱】**：不仅要把总菌（T）、上清（S）、等体积重悬沉淀（P）并排跑胶看可溶比例，还要用小量亲和填料实测上清里的蛋白能不能挂上柱子（排除 MBP 拖着死蛋白浮在水里的“假可溶微聚集体”）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **上游工序总抓手（Gate R4 / G1）**：以“高速离心收获的湿菌体（g/L）”或“0.45 μm 过滤后的澄清破菌上清”为交接界限；必须同时满足 **湿菌重达标、T/S/P 胶图上清占比 ≥40%、且 LabOS 上游记录无“待补”空行** 方可转序！",
    "cases": [
      {
        "title": "Ro52 上游 1L×6 大摇瓶批次标准生产参数卡",
        "tag": "实战案例",
        "body": "## **1. Ro52 上游标准工艺参数（TB 富营养培养基体系）**\n| 工序步骤 | 控制参数标准 | 关键防错与监控指标 |\n|---|---|---|\n| **1. 一级种子活化** | 新鲜转化 `Rosetta(DE3)` 单菌落接入 50 mL LB（含 `50 μg/mL Kan + 34 μg/mL Cam + 0.5% 葡萄糖`），37°C、220 rpm 培养 12 h | 双抗生素防丢 pRARE；0.5% 葡萄糖防过夜本底泄漏 |\n| **2. 二级转接扩增** | 按 `1 : 50` 转接入 6 × 1 L TB 培养基（2.8 L 挡板三角瓶，含 Kan + Cam），37°C、220 rpm 培养约 3.5 h | 每 45 min 测一次 OD₆₀₀，达 **`0.65–0.80`** 时立即停止加热 |\n| **3. 预冷与加料诱导** | **先将摇床降至 16°C 预冷 30 min（实测瓶温 ≤18°C）**，再加入 **`0.1 mM IPTG + 50 μM ZnCl₂`**，16°C、180 rpm 诱导 **16 h** | **严禁在 37°C 热菌液中先加 IPTG 后降温！** |\n| **4. 离心收获 (G1)** | 8,000 rpm、4°C 离心 15 min 弃上清，称取湿菌泥重，分装贴签 `-80°C` 冻存或直接冷链移交破菌 | 合格湿菌重：**`16–22 g/L`**（低于 12 g/L 触发偏差调查） |"
      }
    ],
    "updatedAt": "2026-11-20T13:10:00.000Z"
  },

    "title": "表达宿主底盘特性与培养实操",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握三大蛋白表达系统的底层特性与实操要点 —— **原核大肠杆菌系统（Rosetta/BL21）** 的高性价比保溶培养、**真核哺乳动物细胞（CHO/HEK293）** 的内质网折叠与分泌表达、以及 **无细胞蛋白质合成系统（CFPS）** 的微克级快速并行筛选。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【原核大肠杆菌系统（Rosetta/BL21）】**：工业界 70% 以上非糖基化重组诊断抗原的首选主力车间，核心在于通过低温慢速诱导和伴侣标签克服包涵体。\n- **【真核哺乳动物细胞（CHO/HEK293）】**：复杂二硫键糖蛋白（如 β2GPI）和重组抗体（IgG）的专属车间，通过 N 端分泌信号肽直接把折叠好的天然蛋白吐到无血清培养液里。\n- **【无细胞蛋白质合成系统（CFPS）】**：把细胞内的核糖体和翻译因子抽出来装在试管里，直接加 PCR 模板 3 小时出蛋白，专用于立项初期几十个截短体/突变体的快速摸底。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **宿主系统审核必查**：核对菌株/细胞系来源档案、代数及抗性配伍，严禁使用来源不明或已发生噬菌体/支原体污染的宿主投产。",

        "title": "本实验室在产/在研品种的表达底盘分配总览",
        "tag": "实战案例",
        "body": "## **1. 产品线底盘分布**\n- **大肠杆菌 `Rosetta(DE3) / BL21(DE3)` 线**：**Ro52 全长与截短体**、核糖体 P0、组蛋白 Histone 八聚体、犬埃立克体（Ehrlichia Canis-Ag）、弓形虫（Toxoplasma Gondii-Ag）等原核重组抗原。\n- **真核细胞 / 天然提取与酶切线**：**β2GPI**、自身免疫重组质控单抗、**RF 酶切抗原（人 IgG Fc 酶切修饰）**。\n- **PCR 扩增 / 固相合成与化学修饰线**：**Biotin-dsDNA**、**Biotin-CCP 环肽**。"

  "learn.3.0.0": {
    "key": "learn.3.0.0",
    "path": "基础知识学习 / ③ 上游发酵与可溶性表达 (Upstream & Gate R4) / 表达宿主底盘特性与培养实操 / 原核大肠杆菌系统: Rosetta(DE3)稀有密码子补充与防降解",
    "title": "原核大肠杆菌系统: Rosetta(DE3)稀有密码子补充与防降解",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：深入理解大肠杆菌王牌表达菌株 **Rosetta(DE3)** 的三大工程基因型改造 —— 染色体整合的 **λDE3溶原噬菌体（IPTG诱导型T7聚合酶）**、自带氯霉素抗性的 **pRARE稀有密码子tRNA补充质粒**，以及天然缺失的 **Lon胞内蛋白酶与OmpT外膜蛋白酶**，并在培养实操中执行 **双抗生素（Kan+Cam）协同筛选**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【λDE3溶原噬菌体（IPTG诱导型T7聚合酶）】**：菌株名带 `(DE3)`，说明它染色体里装有受 `lacUV5` 启动子控制的 T7 RNA 聚合酶基因。只有带 `(DE3)` 的菌才能表达 `pET` 系列质粒！\n- **【pRARE稀有密码子tRNA补充质粒】**：Rosetta 菌株比普通 BL21(DE3) 多带的一张“外挂补丁质粒”，上面编码了大肠杆菌最缺的 6 种稀有密码子 tRNA（精氨酸 `AGA/AGG`、异亮氨酸 `AUA`、亮氨酸 `CUA`、脯氨酸 `CCC`、甘氨酸 `GGA`）。**这张 `pRARE` 质粒自带的是氯霉素抗性（Chloramphenicol, `CamR`，34 μg/mL）**！\n- **【Lon胞内蛋白酶与OmpT外膜蛋白酶】**：普通大肠杆菌（如 K-12 菌株）体内有两个专门剪切外来蛋白的恶霸蛋白酶 —— 胞内的 `Lon` 和外膜上的 `OmpT`（破菌瞬间外膜和胞质混在一起，OmpT 就会出来把目标蛋白咬断）。BL21 和 Rosetta 都天生缺失了这两个蛋白酶基因（`lon⁻ ompT⁻`），所以表达出来的蛋白特别完整！\n- **【双抗生素（Kan+Cam）协同筛选】**：养 `Rosetta(DE3)/pET28a-Ro52` 时，主质粒 `pET28a` 是卡那抗性（`KanR`），辅助质粒 `pRARE` 是氯霉素抗性（`CamR`）；种子活化时必须同时加 **`50 μg/mL Kan + 34 μg/mL Cam`**，否则细菌会把 `pRARE` 扔掉，退化成普通 BL21！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **Rosetta 培养实操两必查**：① 查配液记录 —— 活化 `Rosetta(DE3)` 时有没有漏加 **34 μg/mL 氯霉素（Cam，需用无水乙醇配制 34 mg/mL 母液按 1:1000 加入）**？② 因为同时背着两张质粒和两种抗生素，Rosetta 生长速度比普通 BL21 慢约 20%，**必须以实测 OD₆₀₀ 达到 0.6–0.8 为诱导准绳，绝不能死板按“摇满 2.5 小时就加 IPTG”操作**！",
    "cases": [
      {
        "title": "Ro52 在 Rosetta(DE3) 中漏加氯霉素导致丢失 pRARE 质粒的偏差复盘",
        "tag": "实战案例",
        "body": "## **1. 偏差现象**\n- 某次小试使用传代保藏的 `Rosetta(DE3)` 感受态转化 Ro52 质粒，培养全程只加了卡那霉素（Kan），未加氯霉素（Cam），结果诱导后全长 97 kDa 融合蛋白条带明显变浅，且下方重现少量 35–45 kDa 翻译停滞杂带。\n- **根因与纠正**：制备 `Rosetta(DE3)` 感受态及一级种子活化时若不加 34 μg/mL 氯霉素，部分菌体丢失了 `pRARE` 质粒。现已在《上游配液 SOP》中将 **`Kan (50 μg/mL) + Cam (34 μg/mL)` 双抗添加** 设为 Rosetta 菌株的强制勾选校验项。"
      }

    "path": "基础知识学习 / ③ 上游发酵与可溶性表达 (Upstream & Gate R4) / 表达宿主底盘特性与培养实操 / 真核哺乳动物细胞: CHO/HEK293内质网折叠与分泌表达",
    "title": "真核哺乳动物细胞: CHO/HEK293内质网折叠与分泌表达",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **CHO（中国仓鼠卵巢细胞）/ HEK293（人胚肾悬浮细胞）** 真核表达系统在制备依赖复杂二硫键、天然糖基化修饰的高构象自免抗原（如 β2GPI）及工程单抗中的核心机制 —— **N端分泌信号肽引导**、**内质网分子伴侣与PDI二硫键异构酶折叠质控（ERQC）** 以及 **无血清悬浮培养上清收获**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【HEK293 瞬时转染 vs. CHO 稳定株】**：\n  - **`Expi293F`（无血清悬浮 HEK293）**：用阳离子聚合物（PEI）或脂质体把真核质粒（如 `pcDNA3.4`）直接转染进细胞，不整合染色体，**5–7 天即可从培养上清收获数十毫克蛋白**（研发与中小批量自免抗原首选）；\n  - **`CHO` 稳定细胞株**：把基因整合进染色体并筛选高产单克隆（耗时 2–3 个月），适合单抗或克级以上大品种常年连续生产。\n- **【N端分泌信号肽引导】**：在基因最前端接一段 18–22 aa 的“导航条”（如小鼠 IgG κ 链信号肽或 IL-2 信号肽），指引新生肽链钻进内质网腔；出门前细胞自带的信号肽酶会自动把这段导航条齐根剪掉，把干净的目标蛋白吐到细胞外的培养液里。\n- **【内质网分子伴侣与PDI二硫键异构酶折叠质控（ERQC）】**：内质网腔是氧化环境，里面的 PDI 酶会帮蛋白把 11 对二硫键一对一对准确扣好，同时挂上天然 N-糖链；没折对的残次品会被内质网扣留销毁，**凡是能被分泌到细胞外培养上清里的，几乎 100% 都是折叠正确的鲜活构象**！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **真核培养收获必查**：① 转染前细胞活率（Viability）必须 **≥95%** 且无支原体污染；② 收获时间点需监控细胞活率（通常在活率降至 **75%–80%** 时立即离心收上清 —— 如果拖到细胞大量死亡破裂，胞内蛋白酶放出来会把上清里的好蛋白啃坏！）。",
    "cases": [
      {
        "title": "β2GPI 糖蛋白与抗 Ro52 嵌合质控单抗的 Expi293F 悬浮分泌表达方案",
        "tag": "实战案例",
        "body": "## **1. 为什么这两款原料必须上 Expi293F？**\n1. **重组人 β2GPI 抗原**：含 11 对二硫键与 4 处 N-糖基化，采用 `pcDNA3.4-信号肽-β2GPI-6xHis` 瞬转 Expi293F 细胞，第 6 天（活率 82%）离心收取无血清培养上清，直接过 Ni-NTA + SEC，一步获得 >95% 纯度且对临床抗磷脂综合征阳性血清高敏反应的天然糖蛋白。\n2. **抗 Ro52 人鼠嵌合 IgG1 阳性参考品（质控血清替代品）**：重链（HC）与轻链（LC）双质粒按 `1 : 1.2` 共转染 Expi293F，培养上清经 Protein A 一步亲和捕获，即可作为每块 ELISA 板和发光批次的永久定值黄金内控品！"
      }

    "title": "真核哺乳动物细胞: CHO/HEK293内质网折叠与分泌表达",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **CHO（中国仓鼠卵巢细胞）/ HEK293（人胚肾悬浮细胞）** 真核表达系统在制备依赖复杂二硫键、天然糖基化修饰的高构象自免抗原（如 β2GPI）及工程单抗中的核心机制 —— **N端分泌信号肽引导**、**内质网分子伴侣与PDI二硫键异构酶折叠质控（ERQC）** 以及 **无血清悬浮培养上清收获**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【HEK293 瞬时转染 vs. CHO 稳定株】**：\n  - **`Expi293F`（无血清悬浮 HEK293）**：用阳离子聚合物（PEI）或脂质体把真核质粒（如 `pcDNA3.4`）直接转染进细胞，不整合染色体，**5–7 天即可从培养上清收获数十毫克蛋白**（研发与中小批量自免抗原首选）；\n  - **`CHO` 稳定细胞株**：把基因整合进染色体并筛选高产单克隆（耗时 2–3 个月），适合单抗或克级以上大品种常年连续生产。\n- **【N端分泌信号肽引导】**：在基因最前端接一段 18–22 aa 的“导航条”（如小鼠 IgG κ 链信号肽或 IL-2 信号肽），指引新生肽链钻进内质网腔；出门前细胞自带的信号肽酶会自动把这段导航条齐根剪掉，把干净的目标蛋白吐到细胞外的培养液里。\n- **【内质网分子伴侣与PDI二硫键异构酶折叠质控（ERQC）】**：内质网腔是氧化环境，里面的 PDI 酶会帮蛋白把 11 对二硫键一对一对准确扣好，同时挂上天然 N-糖链；没折对的残次品会被内质网扣留销毁，**凡是能被分泌到细胞外培养上清里的，几乎 100% 都是折叠正确的鲜活构象**！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **真核培养收获必查**：① 转染前细胞活率（Viability）必须 **≥95%** 且无支原体污染；② 收获时间点需监控细胞活率（通常在活率降至 **75%–80%** 时立即离心收上清 —— 如果拖到细胞大量死亡破裂，胞内蛋白酶放出来会把上清里的好蛋白啃坏！）。",
    "cases": [
      {
        "title": "β2GPI 糖蛋白与抗 Ro52 嵌合质控单抗的 Expi293F 悬浮分泌表达方案",
        "tag": "实战案例",
        "body": "## **1. 为什么这两款原料必须上 Expi293F？**\n1. **重组人 β2GPI 抗原**：含 11 对二硫键与 4 处 N-糖基化，采用 `pcDNA3.4-信号肽-β2GPI-6xHis` 瞬转 Expi293F 细胞，第 6 天（活率 82%）离心收取无血清培养上清，直接过 Ni-NTA + SEC，一步获得 >95% 纯度且对临床抗磷脂综合征阳性血清高敏反应的天然糖蛋白。\n2. **抗 Ro52 人鼠嵌合 IgG1 阳性参考品（质控血清替代品）**：重链（HC）与轻链（LC）双质粒按 `1 : 1.2` 共转染 Expi293F，培养上清经 Protein A 一步亲和捕获，即可作为每块 ELISA 板和发光批次的永久定值黄金内控品！"
      }
    ],

    "title": "无细胞蛋白质合成(CFPS): 高通量截短体与突变体快筛",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **无细胞蛋白质合成（CFPS, Cell-Free Protein Synthesis）** 的原理与定位 —— 利用预先提取的 **大肠杆菌S30或真核细胞翻译裂解物**，直接向反应孔中加入 **线性PCR模板或质粒**，在 **2–4小时内完成96孔板并行微克级表达**，用于项目早期的几十种截短边界或点突变体的极速功能初筛。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【无细胞蛋白质合成（CFPS）】**：把活细胞的外墙（细胞膜/细胞壁）拆掉，只把里面的“造蛋白流水线（核糖体、T7 RNA 聚合酶、tRNA、氨基酸、ATP 能量再生系统）”浓缩装进冻存管里。做实验时不用转化细菌、不用涂板过夜、不用摇瓶破菌，像做 PCR 一样往孔里加 DNA 模板，30°C 温育 3 小时直接出蛋白！\n- **【线性PCR模板直接表达】**：只要在 PCR 引物前端带上 T7 启动子和 RBS 序列，扩增出来的线性 DNA 片段不用连质粒就能直接丢进 CFPS 反应液里出蛋白，把“设计 → 拿到蛋白测 ELISA”的周期从 7 天压缩到 **1 天**！\n- **【开放体系外源调控优势】**：因为没有活细胞怕死的问题，可以在反应液里直接加二硫键异构酶（DsbC）、氧化型/还原型谷胱甘肽、Zn²⁺ 离子或温和去垢剂（Brij-35 / 纳米磷脂盘 Nanodisc）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **CFPS 应用边界核查**：CFPS 每毫升成本极高、产量仅为微克级，**仅限研发立项与设计期（工序 ①②）的高通量表位/边界初筛**；筛出的优胜构建体必须转入活菌系统（`Rosetta(DE3)`）完成中试工艺锁定（Gate R4/R8），绝不能把 CFPS 反应粗液直接当作生产放行原料！",
    "cases": [
      {
        "title": "利用 CFPS 在 8 小时内并行比选 Ro52 的 12 种截短边界候选",
        "tag": "教学与初筛案例",
        "body": "## **1. 快速边界摸底流程**\n- 以全长 Ro52 质粒为模板，设计 12 对带 5'-T7 启动子与 C 端 His/Strep 标签的重叠 PCR 引物（分别截取 `1–268`, `125–268`, `128–238`, `145–255`, `200–239`, `268–475` 等 12 个区段）。\n- 上午跑完 PCR，中午加入 96 孔板 CFPS 体系 30°C 反应 3 h，下午直接转移至 Ni-NTA 包被板或 ELISA 板与 4 份典型阳性/阴性血清反应，当天傍晚即锁定 **`125–268 aa`** 为反应性最强且无 Fc 背景的最优截短边界。"
      }

    "path": "基础知识学习 / ③ 上游发酵与可溶性表达 (Upstream & Gate R4) / 小试诱导动力学与培养基优化",
    "title": "小试诱导动力学与培养基优化",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：系统优化大肠杆菌摇瓶与发酵的核心动力学参数 —— 锁定 **对数生长期诱导窗口（OD₆₀₀ = 0.6–0.8）**，严格执行 **“先降温至16°C–20°C预冷透、再加0.1–0.2mM低浓度IPTG”** 的控速折叠铁律，并根据靶点结构协同匹配 **TB/LB培养基与微量金属配位离子（如50μM ZnCl₂）**，最大化破菌上清中的天然可溶蛋白总产量。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对数生长期诱导窗口（OD₆₀₀ = 0.6–0.8）】**：细菌活力最旺、胞内分子伴侣（GroEL/GroES、DnaK）含量最充沛的黄金时点。\n- **【低温预冷 + 低IPTG控速折叠】**：把合成蛋白的“流水线传送带”调慢 5 倍（16°C 低温 + 0.1 mM 低 IPTG），让每一条刚从核糖体探出头来的 MBP-Ro52 肽链都有充足时间折好结构域，而不是在 37°C 下挤成一团死包涵体。\n- **【TB富营养培养基 vs. LB基础培养基】**：`TB（Terrific Broth）` 比普通 `LB` 多了 4 倍的酵母粉、蛋白胨以及甘油碳源和 **磷酸钾缓冲盐（防止细菌产酸导致 pH 暴跌）**，能让单位体积菌体密度和蛋白产量比 LB 高出 2–3 倍！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **小试记录必查三项**：① 有没有设 **「未诱导（0 mM IPTG）对照管」**？② 诱导前有没有记录 **「实测 OD₆₀₀ 值」和「降温预冷确认温度（≤20°C）」**？③ 评价优劣是不是以 **“上清可溶带 × 一步亲和纯化实得毫克数”** 为准？",
    "cases": [
      {
        "title": "Ro52 上游小试四组条件（LB/TB × 37°C/16°C × IPTG/Zn²⁺）实测收率大比武",
        "tag": "实战案例",
        "body": "## **1. 四组小试（每组 1 L 摇瓶）实测全链路数据**\n| 实验组 | 培养基 | 诱导温度与预冷 | IPTG & 辅因子 | 收获湿菌重 | 破菌上清可溶率 | 一步亲和纯化实得融合蛋白 |\n|---|---|---|---|---|---|---|\n| 组 1 (传统法) | LB | 37°C (4 h) | 1.0 mM IPTG (无 Zn²⁺) | 4.2 g/L | <8% (全在沉淀) | **仅 2.1 mg/L** (且易聚沉) |\n| 组 2 (仅降温) | LB | 16°C 预冷 (16 h) | 0.2 mM IPTG (无 Zn²⁺) | 5.5 g/L | ~35% | 14.5 mg/L |\n| 组 3 (降温+补锌) | LB | 16°C 预冷 (16 h) | 0.1 mM IPTG + 50 μM ZnCl₂ | 5.8 g/L | ~52% | 24.0 mg/L |\n| **★ 组 4 (定型SOP)** | **TB** | **16°C 预冷30min (16 h)** | **0.1 mM IPTG + 50 μM ZnCl₂** | **18.5 g/L** | **~55%** | **46.8 mg/L（折合纯 Ro52 >15 mg/L）** |"
      }

    "title": "诱导时机(OD600)与16°C–20°C低温预冷慢速诱导铁律",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：精准卡控 **诱导时机（对数期 OD₆₀₀ = 0.6–0.8）**，并将诱导期温度严格控制在 **16°C至20°C低温区间**；深刻理解为什么 **疏水相互作用随温度降低而减弱**、为什么 **核糖体降速能促进共翻译折叠（Co-translational Folding）**，以及为什么在现场操作中必须执行 **“先降温冷透 30 分钟、后加 IPTG”** 的防错铁律。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【对数期 OD₆₀₀ = 0.6–0.8（600nm 光密度）】**：用紫外分光光度计在 600 nm 下测菌液吸光度（空白用未接菌的新鲜培养基调零；注意当 OD₆₀₀ > 0.8 时，必须稀释 2–5 倍再测才准，因为分光光度计在 OD > 1.0 时读数不线性！）。在摇瓶中，OD₆₀₀ = 0.6–0.8 时细菌正处于分裂最猛、核糖体和 ATP 最充沛的对数生长期。\n- **【共翻译折叠（Co-translational Folding）】**：蛋白质不是整条链全吐出来以后才开始折的，而是 **一边从核糖体出口往外吐、一边一段一段地折**（比如前面的 MBP 先折好，接着 RING 域折好，再接着 Coiled-Coil 折好）。37°C 时每秒狂吐 18 个氨基酸，前面的还没折完后面的疏水段就撞上来了；**降到 16°C 时每秒只吐 2–3 个氨基酸，每个结构域都有充裕时间完美折好**！\n- **【疏水相互作用随温度降低而减弱】**：形成包涵体的罪魁祸首是疏水基团互相粘连，而疏水相互作用在热力学上是“吸热熵驱动”的 —— **温度越高，疏水粘连力越强；温度降到 16°C，未折叠疏水斑块互相粘成包涵体的力量直接锐减**，同时细菌体内咬外源蛋白的内源蛋白酶在 16°C 下也基本冬眠了！\n- **【先降温冷透 30 分钟、后加 IPTG 铁律】**：1 升装在玻璃三角瓶里的 37°C 热菌液，放进 16°C 摇床里需要 **25–40 分钟** 才能真正降到 18°C 以下！如果在 37°C 刚调完摇床面板就立刻把 IPTG 倒进去，**IPTG 在头 30 分钟的高温菌液里就已经全面启动了狂暴合成，等你菌液凉下来的时候，第一波造出来的蛋白早就 100% 变成包涵体晶核（Seed），还会带着后面造的蛋白一起沉淀**！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **批记录现场核查必看**：查上游批记录（及 LabOS 上游表达模块）的时间戳 —— **「停止 37°C 到达 OD₆₀₀ 的时间」与「实际加入 IPTG 的时间」之间，是否有 ≥30 分钟的降温预冷间隔及实测温度记录（≤20°C）**？凡是两个时间写同一分钟的，必须现场纠正操作习惯！",
    "cases": [
      {
        "title": "Ro52 摇瓶因“热菌液直接加 IPTG”引发包涵体暴增的现场纠偏案例",
        "tag": "实战案例",
        "body": "## **1. 偏差回溯**\n- 某新人按 SOP 操作 1L 摇瓶 Ro52 表达，看到 OD₆₀₀ 达到 0.72 后，在超净台里直接往 37°C 热滚滚的摇瓶里加了 IPTG，然后再把瓶子放回摇床把设定温度从 37°C 改成 16°C（摇床带压缩机降温到 16°C 用了 15 分钟，瓶内 1L 液体降到 18°C 用了 45 分钟）。\n- **后果**：次日破菌 T/S/P 电泳显示，沉淀（P）条带比上清（S）粗两倍，可溶率从标准批的 55% 暴跌至 22%！\n\n---\n\n## **2. 防呆 SOP 固化**\n- 现已规定标准三步动作：\n  1. 测得 OD₆₀₀ = 0.65–0.75 时，**先将摇床调至 16°C（或将三角瓶置于冰水浴/4°C 冷房快速降温 15–20 min）**；\n  2. 红外测温枪或温度计确认瓶体温度 **≤18°C** 后；\n  3. 方可加入 `0.1 mM IPTG + 50 μM ZnCl₂` 开始计时诱导 16 小时。"
      }

  "learn.3.1.1": {
    "key": "learn.3.1.1",
    "path": "基础知识学习 / ③ 上游发酵与可溶性表达 (Upstream & Gate R4) / 小试诱导动力学与培养基优化 / 诱导剂浓度调控: 0.1–0.2mM低浓度IPTG防翻译拥堵",
    "title": "诱导剂浓度调控: 0.1–0.2mM低浓度IPTG防翻译拥堵",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：摒弃陈旧的“1.0 mM 高浓度 IPTG 猛冲”做法，采用 **0.1–0.2mM低浓度IPTG** 实现对 **T7/lac启动子转录速率的微调滴定**，防止细胞内 mRNA 瞬间过载引发 **核糖体排队拥堵、伴侣蛋白耗竭与宿主生长停滞**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【IPTG（异丙基-β-D-硫代半乳糖苷）的不代谢特性】**：天然乳糖进入大肠杆菌后会被半乳糖苷酶吃掉分解，所以浓度会越来越低；但人工合成的 **IPTG 含有硫原子（-S-），大肠杆菌根本分解不掉它**！这意味着哪怕只加 **0.1 mM IPTG**，它在 16 个小时的诱导期里浓度一分一毫都不会少，能一直稳定温和地开着启动子开关！\n- **【核糖体排队拥堵与伴侣蛋白耗竭】**：如果加 1.0 mM 高浓度 IPTG，T7 聚合酶全力开火，几分钟内造出海量的目标 mRNA，把细菌里所有的核糖体和折叠保姆（分子伴侣 GroEL/DnaK）全部抢光。结果：① 细菌连维持自己生命的蛋白都造不出来，停止生长甚至自溶；② 成百上千条新生 Ro52 肽链没有保姆照看，全撞在一起变成死包涵体。\n- **【总表达量 vs. 可溶可用产量】**：1.0 mM IPTG 在总菌电泳上看着条带很粗（但 90% 是包涵体废渣）；**0.1 mM IPTG 虽然总菌条带斯文一点，但 55% 以上都在上清里，最后过柱子真正能拿到手的鲜活好蛋白反而多出 30%–50%**，而且还省下了 90% 的 IPTG 试剂费！\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **IPTG 母液配制与投料核查**：实验室统一配制 **`1.0 M IPTG`（238.3 mg/mL 纯水溶解，0.22 μm 除菌过滤，分装 1 mL/管冻存于 -20°C）**；诱导 1 L 培养基达到 **0.1 mM** 终浓度时，仅需精准加入 **`100 μL`** 的 1.0 M 母液（即 **万分之一体积比 1:10,000**）！严禁算错小数点多加 10 倍变成 1.0 mM！",
    "cases": [
      {
        "title": "Ro52 诱导剂梯度筛选（0.05 / 0.1 / 0.2 / 1.0 mM IPTG）与投料速算表",
        "tag": "实战案例",
        "body": "## **1. 实验室 `1.0 M IPTG` 标准母液投料速算表（防算错小数点）**\n| 摇瓶培养液体积 | 目标终浓度 **`0.1 mM IPTG`** 需加 1M 母液体积 | 目标终浓度 **`0.2 mM IPTG`** 需加 1M 母液体积 |\n|---|---|---|\n| **50 mL 小试瓶** | **`5 μL`** | `10 μL` |\n| **200 mL 中试瓶** | **`20 μL`** | `40 μL` |\n| **1,000 mL (1 L) 大摇瓶** | **`100 μL` (0.1 mL)** | `200 μL` (0.2 mL) |\n\n> **防错提醒**：50 mL 小试摇瓶加 5 μL 时，也可先将 1 M 母液用无菌水稀释 10 倍成 `0.1 M`，再加 `50 μL`，移液更精准！"
      }
