<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>实验室知识体系</title>
<!-- AI 起草，待人工审核。内容由 _tools/build_doc_tree.py 写入 DATA；右栏为个人编写的「笔记」与「案例演示」。 -->
<style>
:root{--bg:#f7f9fc;--surface:#fff;--ink:#1e293b;--sub:#64748b;--border:#e2e8f0;--blue:#235dbe;--selected:#eaf2ff;--root:#253954;--root-ink:#fff;--highlight:#edf4ff;--note:#fff8eb;--note-ink:#67491d;--hit:#ffe9a8;--own:#0f7b55;--teach:#8a5a00;--rf:15px;--rw:500px;color-scheme:light;--n0:#2f4858;--n0i:#fff;--n1:#b9ddc9;--n1b:#6cae8c;--n1i:#17402f;--n2:#e0f1e8;--n2b:#a8d3bd;--n2i:#1b4433;--n3:#eaf6f0;--n3b:#bcdfcc;--n3i:#23463a;--n4:#f4faf7;--n4b:#cfe8da;--n4i:#2c5244;--ng:#fdf1d8;--ngb:#dcb25f;--ngi:#6b4e12;--wire:#b8cfc2}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;padding:10px;overflow:hidden}
h2,h3,h4,p{margin:0}
h2{font-size:18px;line-height:1.35;font-weight:600}
h3,h4{font-size:14px;font-weight:500}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;line-height:1.4;cursor:pointer}
button:hover{background:var(--selected)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button:disabled{opacity:.45;cursor:default}
button[aria-pressed="true"]{background:var(--selected);border-color:var(--blue);color:var(--blue);font-weight:500}
[hidden]{display:none!important}
#nb{height:100%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.nb-header{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.nb-views{display:flex;gap:6px;flex-wrap:wrap}
.nb-views button{font-size:13px;padding:6px 13px}
.nb-mobile-tabs{display:none}
.nb-workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,1fr) 8px var(--rw)}
.nb-map-pane{min-width:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.nb-map-stage{position:relative;flex:1;min-height:240px;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.nb-map-stage.nb-dragging{cursor:grabbing}
.nb-map-edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nb-map-edges path{fill:none;stroke:var(--wire);stroke-width:1.5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.nb-map-edges path.nb-active{stroke:var(--blue);stroke-width:2.2}
.nb-map-plane{position:absolute;left:0;top:0;transform-origin:0 0}
.nb-node{position:absolute;display:flex;align-items:center;gap:2px;white-space:nowrap;width:max-content;max-width:260px}
.nb-node-button{padding:8px 13px;border-radius:9px;max-width:245px;white-space:normal;font-size:13px;line-height:1.5;text-align:left;background:var(--n3);border:1px solid var(--n3b);color:var(--n3i);box-shadow:0 1px 2px #0000000d;transition:box-shadow .12s,transform .12s;position:relative}
.nb-node-button:hover{background:var(--n3);box-shadow:0 2px 8px #00000018;transform:translateY(-1px)}
.nb-node-button[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:1px}
.nb-node-button.d1{background:var(--n1);border-color:var(--n1b);color:var(--n1i);font-weight:600;font-size:13.5px;padding:9px 15px}
.nb-node-button.d1:hover{background:var(--n1)}
.nb-node-button.d2{background:var(--n2);border-color:var(--n2b);color:var(--n2i);font-weight:500}
.nb-node-button.d2:hover{background:var(--n2)}
.nb-node-button.d4{background:var(--n4);border-color:var(--n4b);color:var(--n4i);font-size:12.5px;padding:7px 12px}
.nb-node-button.d4:hover{background:var(--n4)}
.nb-node-root,.nb-node-root.d1{background:var(--n0);color:var(--n0i);border-color:var(--n0);font-weight:600;font-size:14px;padding:11px 18px;border-radius:11px}
.nb-node-root:hover,.nb-node-root[aria-pressed="true"]{background:var(--n0);color:var(--n0i);border-color:var(--n0)}
.nb-node-gate,.nb-node-gate.d2,.nb-node-gate.d1{background:var(--ng);border-color:var(--ngb);color:var(--ngi);border-left-width:4px;font-weight:600}
.nb-node-gate:hover{background:var(--ng)}
.nb-node-button.nb-hit{background:var(--hit);border-color:var(--note-ink);color:#3a2d08}
.nb-node-badges{display:inline-flex;gap:3px;margin-left:5px;vertical-align:1px}
.nb-badge-dot{display:inline-block;width:7px;height:7px;border-radius:50%}
.nb-badge-note{background:var(--blue)}
.nb-badge-case{background:var(--own)}
.nb-node-toggle{border:1px solid var(--n2b);background:var(--surface);color:var(--sub);width:20px;height:20px;min-width:20px;padding:0;margin-left:4px;border-radius:50%;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.nb-node-toggle:hover{border-color:var(--blue);color:var(--blue);background:var(--selected)}
.nb-map-tools{display:flex;align-items:center;gap:6px;padding:7px 12px;flex-wrap:wrap;border-top:1px solid var(--border);background:var(--surface)}
.nb-map-tools button{border:1px solid transparent;background:transparent;font-size:12px;padding:4px 8px;border-radius:6px}
.nb-map-tools button:hover{background:var(--selected)}
.nb-map-tools .nb-views{display:inline-flex;gap:4px;padding-right:8px;margin-right:4px;border-right:1px solid var(--border)}
.nb-map-tools .nb-views button{border:1px solid var(--border);background:var(--bg);font-size:12px;padding:4px 10px;border-radius:7px;font-weight:500}
.nb-map-tools .nb-views button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.nb-tool-group{display:flex;gap:4px;align-items:center}
.nb-small{font-size:11px;color:var(--sub)}
.nb-legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--sub);flex-wrap:wrap;margin-left:auto}
.nb-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.nb-legend .ln{background:var(--blue)}
.nb-legend .lc{background:var(--own)}
.nb-search{border:1px solid var(--border);background:var(--bg);border-radius:7px;padding:4px 9px;font-size:12px;width:165px}
.nb-resize{padding:0;border:0;border-radius:0;background:var(--border);touch-action:none;min-height:0}
.nb-resize:hover,.nb-resize:focus-visible{background:var(--blue)}
.nb-resize-width{width:8px;cursor:col-resize}

/* 右栏：全高单面板（笔记 / 案例演示） */
.nb-reader-pane{min-width:0;display:flex;flex-direction:column;background:var(--surface);overflow:hidden}
.nb-right-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.nb-read-tabs{display:flex;gap:6px;flex:1;min-width:170px}
.nb-read-tabs button{font-size:13px;flex:1;padding:6px 10px;display:flex;align-items:center;justify-content:center;gap:6px}
.nb-tab-count{font-size:11px;padding:1px 6px;border-radius:10px;background:var(--bg);color:var(--sub);font-weight:500}
button[aria-pressed="true"] .nb-tab-count{background:var(--blue);color:#fff}
.nb-top-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.nb-top-actions button{font-size:11.5px;padding:4px 8px;border-radius:6px;color:var(--sub)}
.nb-top-actions button:hover{color:var(--ink)}
.nb-top-actions .nb-copy-ai{color:var(--blue);border-color:var(--blue);background:var(--selected);font-weight:500}

.nb-node-bar{padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nb-node-info{min-width:0;flex:1}
.nb-topic-path{font-size:11px;color:var(--sub);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-node-info h3{font-size:calc(var(--rf) + 1px);font-weight:600;line-height:1.4;word-break:break-word}
.nb-node-meta{display:flex;align-items:center;gap:8px;flex:none}
.nb-save-state{font-size:11px;color:var(--sub);white-space:nowrap}
.nb-save-state.saved{color:var(--own)}
.nb-mode-tabs{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px}
.nb-mode-tabs button{border:0;background:transparent;font-size:12px;padding:4px 10px;border-radius:7px;color:var(--sub);font-weight:500;transition:all .15s}
.nb-mode-tabs button:hover{color:var(--ink);background:var(--bg)}
.nb-mode-tabs button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 1px 3px rgba(35,93,190,.25)}

/* Markdown 可视化工具栏 */
.nb-md-toolbar{display:flex;align-items:center;gap:4px;padding:7px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.nb-md-toolbar button{font-size:11.5px;padding:3px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--ink)}
.nb-md-toolbar button:hover{background:var(--selected);border-color:var(--blue);color:var(--blue)}
.nb-md-toolbar .nb-beautify{margin-left:auto;background:var(--note);border-color:#e2c68d;color:var(--note-ink);font-weight:500}
.nb-md-toolbar .nb-beautify:hover{background:#ffefcc;border-color:var(--note-ink)}

.nb-panel-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.nb-editor-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 16px 16px;gap:10px}
.nb-textarea{flex:1;width:100%;min-height:0;resize:none;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:12px 14px;font-size:var(--rf);line-height:1.75;color:var(--ink);overflow:auto}
.nb-textarea::placeholder{color:var(--sub);opacity:.65}

/* 增强版 Markdown 可视化阅读样式：白底清爽层次排版，仅注释区使用浅灰底，专业术语支持鼠标悬浮气泡释义 */
.nb-preview{flex:1;min-height:0;overflow:auto;border:1px solid var(--border);border-radius:10px;background:#ffffff;color:#1e293b;padding:20px 24px;font-size:var(--rf);line-height:1.82;overflow-wrap:anywhere;scroll-behavior:smooth}
.nb-preview p{margin:0 0 12px;color:#334155}
.nb-preview h1,.nb-preview h2,.nb-preview h3,.nb-preview h4{margin:20px 0 12px;font-weight:700;line-height:1.45;color:#0f172a}
.nb-preview h1:first-child,.nb-preview h2:first-child,.nb-preview h3:first-child{margin-top:0}
.nb-preview h1{font-size:calc(var(--rf) + 4px);padding-bottom:8px;border-bottom:2px solid var(--border)}
.nb-preview h2{font-size:calc(var(--rf) + 2px);padding:5px 0 8px 12px;border-left:4px solid #1e293b;border-bottom:1px solid #e2e8f0;background:transparent;color:#0f172a;letter-spacing:.01em}
.nb-preview h3{font-size:calc(var(--rf) + 0.5px);padding:5px 11px;border-left:3px solid #64748b;background:#f8fafc;border-radius:0 6px 6px 0;color:#0f172a;margin:16px 0 10px}
.nb-preview h4{font-size:var(--rf);color:#334155;font-weight:700}
.nb-preview hr.nb-hr{border:0;height:1px;background:linear-gradient(90deg,#e2e8f0 0%,#cbd5e1 50%,#e2e8f0 100%);margin:20px 0}
.nb-preview ul,.nb-preview ol{padding-left:1.35em;margin:8px 0 14px}
.nb-preview li{margin:8px 0;color:#334155;line-height:1.78}
.nb-preview li::marker{color:#64748b;font-weight:600}
.nb-preview ul.nb-sublist{list-style:circle;padding-left:1.25em;margin:6px 0 8px 2px;border-left:2px solid #cbd5e1}
.nb-preview ul.nb-sublist li{margin:5px 0;font-size:.96em;color:#334155}
.nb-preview .nb-kv-key{color:#0f172a;font-weight:700}
.nb-preview li.nb-def-card{list-style:none;margin:10px 0 10px -1.35em;padding:12px 15px;border:1px solid #e2e8f0;border-left:3.5px solid #64748b;border-radius:9px;background:#f8fafc;color:#1e293b;transition:background .25s,box-shadow .25s,border-color .25s;scroll-margin-top:24px}
.nb-preview li.nb-def-card:hover{border-color:#cbd5e1;border-left-color:#334155;box-shadow:0 2px 6px rgba(15,23,42,.04)}
.nb-preview .nb-def-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-weight:700;color:#0f172a;font-size:calc(var(--rf) + 0.5px)}
.nb-preview .nb-def-body{color:#334155;font-size:calc(var(--rf) - 0.3px);line-height:1.76}
.nb-preview .nb-def-body ul.nb-sublist{margin-top:6px;background:#ffffff;padding:8px 12px 8px 24px;border-radius:6px;border:1px solid #e2e8f0;border-left:2.5px solid #94a3b8}
@keyframes nbDefPulse{0%{background:#fef3c7;border-left-color:var(--blue);box-shadow:0 0 0 3px rgba(35,93,190,.2)}70%{background:#fef3c7;border-left-color:var(--blue)}100%{background:#f8fafc;box-shadow:none}}
.nb-preview li.nb-def-card.nb-def-flash{animation:nbDefPulse 2.2s ease-out}
.nb-preview a.nb-term-link{color:#1d4ed8;background:rgba(37,99,235,.06);font-weight:600;text-decoration:none;border-bottom:1.5px dashed rgba(37,99,235,.55);padding:1px 5px;border-radius:4px;cursor:help;transition:background .15s,color .15s,border-color .15s}
.nb-preview a.nb-term-link:hover{background:#dbeafe;color:#1e40af;border-bottom-style:solid;border-bottom-color:#1d4ed8}
.nb-preview strong{font-weight:700;color:#0f172a}
.nb-preview a.nb-term-link strong{color:inherit}
.nb-preview mark{background:#fef3c7;color:#3a2d08;padding:1px 5px;border-radius:4px;font-weight:600}
.nb-preview .nb-tag-chip{display:inline;background:transparent;color:#0f172a;font-weight:700;padding:0;margin-right:2px}
.nb-preview code{background:#f1f5f9;border:1px solid #e2e8f0;padding:1px 6px;border-radius:5px;font-size:.9em;color:#0f172a;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.nb-preview pre{background:#f8fafc;padding:10px 12px;border-radius:8px;overflow-x:auto;margin:10px 0;border:1px solid #e2e8f0}
.nb-preview pre code{border:0;padding:0;color:var(--ink)}
.nb-preview blockquote{margin:12px 0;padding:11px 15px;border-left:4px solid #d97706;background:#fffbeb;color:#78350f;border-radius:0 8px 8px 0;font-size:calc(var(--rf) - 0.3px)}
.nb-svg-card{margin:14px 0;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}
.nb-svg-card .nb-svg-title{font-size:12px;font-weight:700;color:#334155;margin-bottom:8px}
.nb-svg-card svg{display:block;width:100%;height:auto}
.nb-preview table{border-collapse:collapse;font-size:calc(var(--rf) - 1px);width:100%;margin:12px 0;border-radius:8px;overflow:hidden;border:1px solid #e2e8f0}
.nb-preview th,.nb-preview td{border:1px solid #e2e8f0;padding:8px 10px;text-align:left;vertical-align:top;line-height:1.65}
.nb-preview th{background:#f1f5f9;color:#0f172a;font-weight:700}
.nb-preview tbody tr:nth-child(even){background:#f8fafc}
.nb-preview tbody tr:hover{background:#f1f5f9}

/* 鼠标悬浮专业术语弹出释义卡片 (Popover) */
.nb-term-popover{position:fixed;z-index:9999;width:min(420px,calc(100vw - 24px));max-height:340px;display:flex;flex-direction:column;background:#ffffff;color:#1e293b;border:1px solid #cbd5e1;border-top:3.5px solid #235dbe;border-radius:11px;box-shadow:0 12px 32px -4px rgba(15,23,42,.18),0 4px 12px -2px rgba(15,23,42,.08);pointer-events:auto;animation:nbPopIn .14s ease-out}
@keyframes nbPopIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.nb-pop-head{display:flex;align-items:center;gap:7px;padding:10px 14px 8px;border-bottom:1px solid #f1f5f9;background:#f8fafc;border-radius:8px 8px 0 0}
.nb-pop-tag{font-size:11px;font-weight:700;color:#1d4ed8;background:#dbeafe;padding:2px 7px;border-radius:5px;white-space:nowrap}
.nb-pop-title{font-size:13.5px;font-weight:700;color:#0f172a;line-height:1.35}
.nb-pop-body{padding:10px 14px;font-size:13.5px;line-height:1.72;color:#334155;overflow-y:auto;flex:1}
.nb-pop-body ul.nb-sublist{list-style:disc;padding-left:1.25em;margin:6px 0 4px;border-left:2px solid #cbd5e1}
.nb-pop-body li{margin:4px 0}
.nb-pop-body code{background:#f1f5f9;border:1px solid #e2e8f0;padding:1px 5px;border-radius:4px;font-size:.9em}
.nb-pop-foot{padding:6px 14px;background:#f8fafc;border-top:1px solid #f1f5f9;font-size:11px;color:#64748b;border-radius:0 0 10px 10px;display:flex;justify-content:space-between}
.nb-empty{color:var(--sub);font-size:calc(var(--rf) - 1px)}

/* 案例演示栏专属控件 */
.nb-case-tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nb-case-pill{font-size:12px;padding:4px 10px;border-radius:7px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-case-add{font-size:12px;padding:4px 9px;border-radius:7px;border-style:dashed;color:var(--blue)}
.nb-case-del{font-size:12px;padding:4px 8px;border-radius:7px;color:#c53030;margin-left:auto}
.nb-case-del:hover{background:#fff5f5;border-color:#feb2b2}
.nb-case-fields{display:grid;grid-template-columns:1fr 130px;gap:8px}
.nb-input{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:calc(var(--rf) - 1px);background:var(--surface);width:100%;font-weight:500}
.nb-input::placeholder{color:var(--sub);opacity:.65;font-weight:400}

@media(max-width:900px){.nb-workspace{grid-template-columns:minmax(0,1fr) 8px 360px}}
@media(max-width:650px){
 body{padding:0;overflow:auto}
 #nb{border-radius:0;border:0;height:auto;min-height:100%}
 .nb-header{padding:10px 14px}
 .nb-views{width:100%}.nb-views button{flex:1;padding:6px 4px;font-size:12px}
 .nb-mobile-tabs{display:flex;padding:8px 12px;gap:8px;border-bottom:1px solid var(--border);background:var(--surface)}
 .nb-mobile-tabs button{flex:1;font-size:13px}
 .nb-workspace{display:block}
 .nb-resize-width{display:none}
 .nb-map-pane,.nb-reader-pane{height:calc(100vh - 120px);min-height:500px}
 #nb[data-mobile="map"] .nb-reader-pane{display:none}
 #nb[data-mobile="read"] .nb-map-pane{display:none}
 .nb-search{width:120px}
}
@media(pointer:coarse){button{min-height:36px}}
</style>
<script>
// AI 与浏览器本地笔记双向同步数据文件（V2.0 全节点预填写版）
window.LABKB_SYNC_DATA = {
  "iso": {
    "key": "iso",

CoA 无批准签名；QM §8.6 与 QA-OP-011 §4.2 表述不一致（03、LabOS 总表） | ⑦⑨⑩ G2–G4 | 放行需不同于检验员的授权人签核，系统强制 |\n| 8.7 不合格输出 | 识别并控制，防止误用 | PM-SMP-006 偏差规程草案已起草（待审核） | ⑩ | 不合格品冻结，不能被转序或发货 |\n| 9.1 监视、测量、分析 | 客户满意、数据分析 | 3 家满意度调查逐格相同且早于签约日（A、03 R1） | ⑪ | 反馈和满意度原始记录入库，禁止批量复制 |\n| 9.2 内部审核 | 按计划审核、跟踪整改 | QA-FM-017 内审全套（2025-10-15）；不符合事实前后不一致（A） | 全部 | 审核发现关联到责任人和关闭证据 |\n| 9.3 管理评审 | 管理层评审体系绩效 | 最近一次 2025-10-25（A） | ⑫ | 管评输入数据（偏差、投诉、CAPA）自动汇总 |\n| 10.2 不合格与纠正措施 | 根因分析、纠正措施、有效性验证 | QA-OP-009 CAPA 程序；QA-SMP-007 变更规程草案（待审核） | ⑫ C1–C2 | CAPA 与变更对象、根因退回工序、有效性复核 |\n| 10.3 持续改进 | 持续提升体系 | 路线图 04 提出评估 ISO 13485 | ⑫ | 指标看板与趋势 |",

    "title": "5. 记录真实性：审核中最致命的一类",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「5. 记录真实性：审核中最致命的一类」梳理关键控制要求，重点涵盖 **红线**、**已发现的情形（03 R1）**、**处置方向（03 建议）** 等核心要素（来源：`ISO9001体系管理要点_草案V0.1_20261106.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【红线】**：原始数据先于记录；不预填；不补造签名；不倒签日期；不覆盖原数据；返工不换批号。\n- **【已发现的情形（03 R1）】**：事后生成的“模拟”记录；跨年数值完全一致的 CoA；稳定性时间不成立；逐格相同的供方评估和满意度表；同日同人保养多台设备。\n- **【处置方向（03 建议）】**：先隔离，再确认是否已提交给客户或审核员，已提交的要书面说明；历史产品采用“回顾性技术文件”如实写明；未采集的指标写“待验证”。\n- **【LabOS 的作用】**：限制编辑权限、保留版本历史、原始文件作为附件、签署证据、服务器时间戳，让造假在系统里“做不到”，而不是靠人自觉。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `ISO9001体系管理要点_草案V0.1_20261106.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n03 号文件把“记录真实性（数据完整性 ALCOA+）”列为第一优先事项。管理者需要记住：\n\n- **红线**：原始数据先于记录；不预填；不补造签名；不倒签日期；不覆盖原数据；返工不换批号。\n- **已发现的情形（03 R1）**：事后生成的“模拟”记录；跨年数值完全一致的 CoA；稳定性时间不成立；逐格相同的供方评估和满意度表；同日同人保养多台设备。\n- **处置方向（03 建议）**：先隔离，再确认是否已提交给客户或审核员，已提交的要书面说明；历史产品采用“回顾性技术文件”如实写明；未采集的指标写“待验证”。\n- **LabOS 的作用**：限制编辑权限、保留版本历史、原始文件作为附件、签署证据、服务器时间戳，让造假在系统里“做不到”，而不是靠人自觉。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「① 调研与立项」梳理关键控制要求，重点涵盖 **① 调研与立项**、**技术来源是否清楚**、**① 调研与立项** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 目标是不是写成了**可检验的指标**（数值 + 用什么方法测），而不是“完成转化”这类说法。\n- 技术来源是否清楚：自研，还是转移、委托、外购？有没有授权或合同？\n- 客户的硬要求有没有写进来（例如剩余效期、运输温度）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【① 调研与立项】**：目标是不是写成了**可检验的指标**（数值 + 用什么方法测），而不是“完成转化”这类说法。\n- **【技术来源是否清楚】**：自研，还是转移、委托、外购？有没有授权或合同？\n- **【① 调研与立项】**：客户的硬要求有没有写进来（例如剩余效期、运输温度）。\n- **【① 调研与立项】**：把一篇文献的结论直接当作“已验证技术”写进立项书。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：在动手做之前，先弄清三件事：这个材料给谁用、要达到什么指标、技术从哪来。相当于项目的“可行性论证 + 立项审批”。做错的代价最大，因为后面所有工作都建立在这一步上。\n\n**该盯什么**\n- 目标是不是写成了**可检验的指标**（数值 + 用什么方法测），而不是“完成转化”这类说法。\n- 技术来源是否清楚：自研，还是转移、委托、外购？有没有授权或合同？\n- 客户的硬要求有没有写进来（例如剩余效期、运输温度）。\n\n**常见翻车点**\n- 把一篇文献的结论直接当作“已验证技术”写进立项书。\n- 技术来自外单位却没有授权文件（dsDNA、RF 工艺均有此风险，见风险清单 R10）。\n- LabOS 里 dsDNA-Ag 的“当期目标”写的是“新工艺完成转化”，没有指标数值和检测方法，后面无法判断做没做到。\n\n**可以问团队**\n1. 这个项目的验收指标有哪几条？每条用什么方法测、多少算合格？\n2. 这项技术的来源是什么？有没有授权或转让文件？\n3. 客户有哪些硬性要求（效期、运输、规格）？写进立项书了吗？",
    "cases": [
      {
        "title": "工序 ① 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| RD01–RD03 立项指标 | RD01 自身免疫抗原（dsDNA ≥0.8 mg/mL、A260/280 1.75–1.90、3 批 CV ≤8%；CCP HPLC ≥90%、MW 2500±10 Da）；RD02 动物疫病抗原（纯度 ≥95%、≥1.0 mg/mL、≥2 家企业书面反馈）；RD03 CCP 胶乳半成品 | E1，全景 §5.2 | 哪些指标写清了检测方法？哪些只写了数值？ |\n| 亚辉龙 DNA-Ag 05 | 要求到货剩余效期 ≥24 个月、2–8 ℃ 运输 | E2，全景 §5.1 | 这个要求应在立项时写进哪一项？对 ⑧ 意味着什么？ |\n| 技术来源 | dsDNA 工艺\"疑来自宁波赛珀\"；RF 酶切工艺\"转移自赛珀 SG\"；部分文件改名为 CYDAYA-QP，但正文仍是赛珀 | E1，全景 §5.1；风险清单 R10 | 立项时缺授权或转让合同，R1 能不能过？ |\n| IgG4、Z110 立项与合同顺序 | 合同先于或紧跟立项；设计记录有改日期的两个版本 | E1，风险清单 R1 | 立项文件的日期应以什么为准？ |"

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「② 分子与材料设计」梳理关键控制要求，重点涵盖 **设计文件是否写清分子形式（尤其抗**、**② 分子与材料设计**、**② 分子与材料设计** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 设计文件是否写清分子形式（尤其抗体：鼠源、嵌合、人源化）。\n- 序列文件有没有版本号，后续每一批是否引用同一版本。\n- 验收标准是否在实验开始前就定好了。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【设计文件是否写清分子形式（尤其抗】**：鼠源、嵌合、人源化）。\n- **【② 分子与材料设计】**：序列文件有没有版本号，后续每一批是否引用同一版本。\n- **【② 分子与材料设计】**：验收标准是否在实验开始前就定好了。\n- **【对外名称与实际分子不一致】**：SAA 对外有“人源化、嵌合、杂交瘤”三种说法，IgG4 名称写“鼠抗人”（风险清单 R4）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把“要什么”翻译成“做什么样的分子”：用全长还是截短、加不加标签、怎样让抗体最容易“抓住”它。这一步还要**提前**定好怎么验收，不能做完再改标准。\n\n**该盯什么**\n- 设计文件是否写清分子形式（尤其抗体：鼠源、嵌合、人源化）。\n- 序列文件有没有版本号，后续每一批是否引用同一版本。\n- 验收标准是否在实验开始前就定好了。\n\n**常见翻车点**\n- 对外名称与实际分子不一致：SAA 对外有“人源化、嵌合、杂交瘤”三种说法，IgG4 名称写“鼠抗人”（风险清单 R4）。\n- 看到结果后再回头调整通过标准。\n- 设计文件事后一天补齐、日期倒填（风险清单 R1）。\n\n**可以问团队**\n1. 这个分子的准确名称和分子形式是什么？客户资料里是否一致？\n2. 序列文件是哪个版本？存在哪里？\n3. 验收标准是什么时候定的？之后有没有改过？",

    "title": "③ 构建与原料准备",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「③ 构建与原料准备」梳理关键控制要求，重点涵盖 **③ 构建与原料准备**、**③ 构建与原料准备**、**③ 构建与原料准备** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【③ 构建与原料准备】**：种子有没有建档（来源、版本、测序报告、冻存位置）。\n- **【③ 构建与原料准备】**：外购物料的供方是否在合格名录里，来料有没有检验。\n- **【③ 构建与原料准备】**：领用的物料是否合格、在效期内。\n- **【③ 构建与原料准备】**：供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把设计变成“可靠的起点”：测序确认序列没错的菌种、建档保存的种子，以及外购的关键原料（合成肽、IgG 粗品、酶、填料）。起点不可靠，后面做得再好也白做。\n\n**该盯什么**\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n**常见翻车点**\n- 供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n- 批记录里“起始物料”这一步没登记（LabOS 页面显示：导入的批记录没有这一步）。\n- 中间品批号重复使用（26-001/26-003 用于不同物料，风险清单 R12）。\n\n**可以问团队**\n1. 这批用的种子编号是什么？测序报告在哪？\n2. 外购的关键物料来自哪个供方？到货检验记录在哪？\n3. 起始物料批号有没有登记到批记录里？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「③ 构建与原料准备」梳理关键控制要求，重点涵盖 **③ 构建与原料准备**、**③ 构建与原料准备**、**③ 构建与原料准备** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【③ 构建与原料准备】**：种子有没有建档（来源、版本、测序报告、冻存位置）。\n- **【③ 构建与原料准备】**：外购物料的供方是否在合格名录里，来料有没有检验。\n- **【③ 构建与原料准备】**：领用的物料是否合格、在效期内。\n- **【③ 构建与原料准备】**：供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把设计变成“可靠的起点”：测序确认序列没错的菌种、建档保存的种子，以及外购的关键原料（合成肽、IgG 粗品、酶、填料）。起点不可靠，后面做得再好也白做。\n\n**该盯什么**\n- 种子有没有建档（来源、版本、测序报告、冻存位置）。\n- 外购物料的供方是否在合格名录里，来料有没有检验。\n- 领用的物料是否合格、在效期内。\n\n**常见翻车点**\n- 供方没纳入合格名录就在用，成为外审不符合项 Q8.4.1。\n- 批记录里“起始物料”这一步没登记（LabOS 页面显示：导入的批记录没有这一步）。\n- 中间品批号重复使用（26-001/26-003 用于不同物料，风险清单 R12）。\n\n**可以问团队**\n1. 这批用的种子编号是什么？测序报告在哪？\n2. 外购的关键物料来自哪个供方？到货检验记录在哪？\n3. 起始物料批号有没有登记到批记录里？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「④ 制备：扩增、表达或合成」梳理关键控制要求，重点涵盖 **④ 制备：扩增、表达或合**、**④ 制备：扩增、表达或合**、**④ 制备：扩增、表达或合** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 记录是否及时（LabOS 上“待补”行是否长期堆积）。\n- 产量是否与“标准速率”对得上，近期是否偏低。\n- 不同条件的比较是否有对照、取样是否可比。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【④ 制备：扩增、表达或合】**：记录是否及时（LabOS 上“待补”行是否长期堆积）。\n- **【④ 制备：扩增、表达或合】**：产量是否与“标准速率”对得上，近期是否偏低。\n- **【④ 制备：扩增、表达或合】**：不同条件的比较是否有对照、取样是否可比。\n- **【④ 制备：扩增、表达或合】**：两个诱导条件取样量不一致就下结论。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：用细菌、哺乳细胞或 PCR 把目标产物“做出来”。关键不在做出来，而在**能证明条件之间的差别是真的**：比较时取样要等比例，否则结论不可信。\n\n**该盯什么**\n- 记录是否及时（LabOS 上“待补”行是否长期堆积）。\n- 产量是否与“标准速率”对得上，近期是否偏低。\n- 不同条件的比较是否有对照、取样是否可比。\n\n**常见翻车点**\n- 两个诱导条件取样量不一致就下结论。\n- 上游记录拖着不补：D10-01 页面显示上游有待补行、下游有待补 10 行。\n- 表达量波动很大（SAA 表达量 85–135 mg/L）却没有记录能解释波动的参数。\n\n**可以问团队**\n1. 这批的关键条件参数是什么？和上一批比有什么变化？\n2. 上清和沉淀是不是等比例取样跑的胶？\n3. 近期速率低于标准，原因找过吗？",

        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| SAA/IgG 瞬转 | 293F；DNA 1 µg/mL；DNA:PEI = 1:3；D1 补 5% Feed + 1% 葡萄糖；第 6 天收获；表达量 85–135 mg/L | E1，全景 §5.1、§5.3 | 表达量波动这么大，应记录哪些参数来解释？ |\n| 原核表达通用条件 | LB/TB；OD600 0.65–0.89 诱导；可溶性差时 16 ℃、IPTG 0.1–0.4 mM；超声 400 W 3 s/2 s 40 min | E1，全景 §5.3 | 比较 16 ℃ 和 37 ℃ 时，取样要怎样做才可比？ |\n| dsDNA PCR | 100 µL 体系，EasyTaq，引物 0.25 µM，模板 200 ng；94 ℃ 4 min →（94 ℃ 30 s / 54 ℃ 30 s / 72 ℃ 3 min 10 s）×30 → 72 ℃ 4 min | E1，全景 §5.3 | 按常用的 Taq 延伸经验值（约 1 kb/min，E3，以所用酶的说明书为准），3 min 10 s 延伸对约 5000 bp 产物是否足够？现行程序的依据是什么？ |\n| 程新秀 2025 年真核转染 | 126 次，成功率 92% | E1，全景 §3 | 这类统计可以成为 LabOS 里的\"标准速率\"吗？ |\n| LabOS 中 D10 上游进度 | 仪表盘显示 D10-01 上游\"63/65 板\"（2026-11-04 查看） | LabOS | 板数和产量的对应关系应记录在哪里？ |"

    "title": "⑤ 纯化与样品处理（可重复调用）",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑤ 纯化与样品处理（可重复调用）」梳理关键控制要求，重点涵盖 **⑤ 纯化与样品处理（可重**、**⑤ 纯化与样品处理（可重**、**⑤ 纯化与样品处理（可重** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每一步的回收率有没有记，损失能不能解释。\n- 最终拿到的结果是否来自一致的操作，而不是挑了最好的一次。\n- 原料是不是血浆或细胞来源（如人 IgG），需要病原风险评估。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑤ 纯化与样品处理（可重】**：每一步的回收率有没有记，损失能不能解释。\n- **【⑤ 纯化与样品处理（可重】**：最终拿到的结果是否来自一致的操作，而不是挑了最好的一次。\n- **【⑤ 纯化与样品处理（可重】**：原料是不是血浆或细胞来源（如人 IgG），需要病原风险评估。\n- **【⑤ 纯化与样品处理（可重】**：只挑最好看的胶图当结果，不记各步回收。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：从一锅混合物里把目标“钓”出来并洗干净。方法有三类思路：按**特异结合**钓（亲和）、按**大小**分（分子筛）、按**电荷或疏水性**分。纯化可以反复用，例如表达后捕获、切掉标签后再纯化、修饰后清除残留，都算纯化。\n\n**该盯什么**\n- 每一步的回收率有没有记，损失能不能解释。\n- 最终拿到的结果是否来自一致的操作，而不是挑了最好的一次。\n- 原料是不是血浆或细胞来源（如人 IgG），需要病原风险评估。\n\n**常见翻车点**\n- 只挑最好看的胶图当结果，不记各步回收。\n- RF 酶切抗原的人 IgG 原料没有病原筛查（风险清单 R6）。\n- 日报写“静丙酶切一直在纯化”，系统里却标“暂停”（LabOS 仪表盘 AI 提示，需例会确认）。\n\n**可以问团队**\n1. 每一步的回收率是多少？总回收多少？\n2. 这一步是为了去掉什么杂质？怎么证明去掉了？\n3. 原料来自哪里？需不需要病原筛查？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑦ 质量与用途验证」梳理关键控制要求，重点涵盖 **⑦ 质量与用途验证**、**⑦ 质量与用途验证**、**⑦ 质量与用途验证** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每个质量属性有没有适合的方法（小肽不能只靠 SDS-PAGE）。\n- 检验的人和放行的人是不是分开。\n- 检测用的设备是否在校准有效期内。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑦ 质量与用途验证】**：每个质量属性有没有适合的方法（小肽不能只靠 SDS-PAGE）。\n- **【⑦ 质量与用途验证】**：检验的人和放行的人是不是分开。\n- **【⑦ 质量与用途验证】**：检测用的设备是否在校准有效期内。\n- **【⑦ 质量与用途验证】**：CoA 上写的是实测值，还是只写“≥90%”。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：确认做出来的东西“是什么、有多少、纯不纯”，并且在客户用途里“真的能用”。最关键的是：**检测方法要适合这种材料**，合格标准要在测之前就定好。\n\n**该盯什么**\n- 每个质量属性有没有适合的方法（小肽不能只靠 SDS-PAGE）。\n- 检验的人和放行的人是不是分开。\n- 检测用的设备是否在校准有效期内。\n- CoA 上写的是实测值，还是只写“≥90%”。\n\n**常见翻车点**\n- CCP 标准写 HPLC 和质谱，实际只检外观、溶解性、SDS-PAGE。\n- 检验与放行是同一个人；CoA 没有批准人签名（风险清单 R6）。\n- 外检设备校准已过期（墨肽台账外检 2026-05-19 到期）。\n\n**可以问团队**\n1. 这个指标用什么方法测？这个方法适合这种材料吗？\n2. 这份检验结果是谁测的、谁复核的、谁放行的？\n3. 用的设备校准到什么时候？",

  "iso.3.7": {
    "key": "iso.3.7",
    "path": "实验室 ISO 体系管理 / 各工序的控制点与异常处理 / ⑧ 优化、稳定性与放大",
    "title": "⑧ 优化、稳定性与放大",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑧ 优化、稳定性与放大」梳理关键控制要求，重点涵盖 **⑧ 优化、稳定性与放大**、**⑧ 优化、稳定性与放大**、**⑧ 优化、稳定性与放大** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 声明的效期有没有实时数据支撑。\n- 优化是不是在独立样本上也有效，而不只是在开发样本上。\n- 至少 3 批的一致性有没有按同一方法比较。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑧ 优化、稳定性与放大】**：声明的效期有没有实时数据支撑。\n- **【⑧ 优化、稳定性与放大】**：优化是不是在独立样本上也有效，而不只是在开发样本上。\n- **【⑧ 优化、稳定性与放大】**：至少 3 批的一致性有没有按同一方法比较。\n- **【⑧ 优化、稳定性与放大】**：都写“6 个月长期稳定性”，但批次生产后仅约 1 个月（风险清单 R1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把“能做出来”变成“每批都一样、放得住、能放大”。**稳定性**就是产品放多久不坏；**放大**就是批量变大后性能不变。结论必须有时间做依据，不能超过实际观察过的时间。\n\n**该盯什么**\n- 声明的效期有没有实时数据支撑。\n- 优化是不是在独立样本上也有效，而不只是在开发样本上。\n- 至少 3 批的一致性有没有按同一方法比较。\n\n**常见翻车点**\n- 都写“6 个月长期稳定性”，但批次生产后仅约 1 个月（风险清单 R1）。\n- 声明效期 24–36 个月，却没有实时稳定性数据（风险清单 R7），而亚辉龙要求到货剩余效期 ≥24 个月。\n- 三个项目共用同一组批间数据。\n\n**可以问团队**\n1. 效期的依据是什么？实时数据已经做了多长时间？\n2. 这个改进在没用过的样本上验证过吗？\n3. 3 批的一致性数据是各自独立的原始数据吗？",
    "cases": [
      {
        "title": "工序 ⑧ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 级别与出处 | 讨论题 |\n|---|---|---|---|\n| RD01 稳定性指标 | 2–8 ℃ 7 天、冻融 3 次后保持率 ≥90%；3 批 CV ≤8% | E1，全景 §5.2 | 7 天数据能支持多长的效期？ |\n| \"6 个月稳定性\" | SAA、dsDNA、B2mg 的确认评审都称有 6 个月长期稳定性，但批次生产后只过了约 1 个月 | E1，风险清单 R1 | 这类结论应怎样更正？对已给客户的资料怎么办？ |\n| 声明效期无依据 | 声明 24–36 个月，无实时稳定性数据；亚辉龙要求剩余效期 ≥24 个月 | E1、E2，风险清单 R7 | 风险清单建议什么？数据出来前对外应如何表述？ |\n| 批间数据共用 | 三个项目共用同一组数字（批间 CV 纯度 1.1%、ELISA 7.2%） | E1，风险清单 R1 | 批间一致性报告应附哪些原始数据？ |\n| dsDNA 产能 | 月产能 70–80 mg | E1，全景 §5.1 | 产能数据是否足以支撑放大决策？ |\n| 液氮与冰箱监控 | 液氮罐液位事故延迟 4 天上报；冰箱、液氮无连续监控报警 | E1，风险清单 R11 | 储存条件失控对稳定性结论有什么影响？ |"
      }

    "path": "实验室 ISO 体系管理 / 各工序的控制点与异常处理 / ⑩ 批生产与偏差",
    "title": "⑩ 批生产与偏差",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑩ 批生产与偏差」梳理关键控制要求，重点涵盖 **⑩ 批生产与偏差**、**⑩ 批生产与偏差**、**⑩ 批生产与偏差** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 五个控制点 G0 开工、G1 上游交接、G2 半成品转序、G3 成品放行、G4 发货，是否一个都没跳过。\n- 入库只是“收下”，不等于“放行”。\n- 偏差有没有登记、分级、有结论。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑩ 批生产与偏差】**：五个控制点 G0 开工、G1 上游交接、G2 半成品转序、G3 成品放行、G4 发货，是否一个都没跳过。\n- **【⑩ 批生产与偏差】**：入库只是“收下”，不等于“放行”。\n- **【⑩ 批生产与偏差】**：偏差有没有登记、分级、有结论。\n- **【⑩ 批生产与偏差】**：把入库签收当成放行，没放行就发货。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：按已批准的指令，做出一批**有据可查、经过放行**的成品。核心是三条：**每一步留记录、每个异常先停下、放行由专人签字**。LabOS 的批记录模块就是这道工序的主战场。\n\n**该盯什么**\n- 五个控制点 G0 开工、G1 上游交接、G2 半成品转序、G3 成品放行、G4 发货，是否一个都没跳过。\n- 入库只是“收下”，不等于“放行”。\n- 偏差有没有登记、分级、有结论。\n\n**常见翻车点**\n- 把入库签收当成放行，没放行就发货。\n- 记录事后补写或批量生成（86 份“模拟”缓冲液配制记录，风险清单 R1）。\n- 批次已过交期、多个步骤过了计划日期，但没有人提出调整（如 D10-01 的页面提示）。\n\n**可以问团队**\n1. 这批现在走到哪个控制点？每个控制点的证据在哪？\n2. 这批有没有偏差？是怎么分级和处理的？\n3. 每个人做了什么：谁做的、谁复核的、谁放行的？",
    "cases": [
      {
        "title": "工序 ⑩ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 证据 | 讨论题 |\n|---|---|---|---|\n| dsDNA D10：第一个全链路真实批 | 路线图建议选 D10（生产指令 2026-09-15，100 mg，交期 10-30）作为第一个按 G0–G4 留全部原始数据的批次 | `04_世界一流路线图.md` | 这批在 LabOS 里的 G0–G4 证据齐不齐？缺哪个？ |\n| 86 份\"模拟\"缓冲液配制记录 | 事后按规则生成；2024 年记录引用 2025 年的 SOP；实测值恰好等于目标值 | 风险清单 R1 | 哪些迹象说明这不是原始记录？LabOS 怎样从系统上防止？ |\n| 中间品批号重复 | 26-001/26-003 被用于不同物料；批号没有产品前缀 | 风险清单 R12 | 按父子批规则应该怎样编号？ |\n| dsDNA 同一批两份检验记录 | 同一批 251201 有 docx、xlsx 两种半成品检验记录，项目和限值不同 | 流转计划 §9、S8 | 以哪份为准？产品主数据应由谁核定？ |\n| 审核时提交他司格式的批记录 | 浩欧博审核时提交的批记录实为墨肽格式，其中有返工批 | 全景 §5.1 | 返工批需要哪些记录才算完整？ |"

仓管 + 销售 | 销售出库单 SW-FM-005 | 进入 ⑪ |\n\n### Gate 四件套\n\n| Gate | 检查方法 | 通过依据 | 未通过 → 去向 | 交付物 |\n|---|---|---|---|---|\n| G0 | 开工检查表逐项核对 | 物料合格且在效期；设备校准有效；文件现行；人员已培训；清场合格 | 不开工；补齐条件，或改指令版本 | 签字的开工检查 |\n| G1 | 实物与交接单逐容器核对 | 身份、数量、状态、条件、时限一致 | 冻结 → 偏差（⑩.3） | 双签交接单 |\n| G2 | 半成品检验 + 原始数据复核 | 达到该产品半成品 QC-SIP 规定的限值（**不能用\"符合 ISO 9001\"替代产品指标**，流转计划 §5.2） | 不合格 → QA-OP-008 处置；需要调查的 → ⑫ | 半成品检验记录 + 转序审批 |\n| G3 | 管代复核整批资料 | 全项合格；偏差已关闭或已评估；CoA、标签、库存批号三者一致 | 不放行；按 QA-OP-008 让步、返工或报废 | 放行单 + CoA |\n| G4 | 出库核对 | 只有\"成品已放行\"状态可发；冻结、超期、退货、未批准品一律不可发 | 停发，查明原因 | 出库单 + 运单 |",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「偏差与不合格」梳理关键控制要求，重点涵盖 **停**、**隔离与标识**、**报告** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 前提：不合格评审已决定返工。由项目部提出返工申请，写明不合格内容、返工工艺与原工艺的差异、预期指标、风险评估。\n- 审批：技术可行性和风险评估后，由**管代批准**。\n- 次数：原则上同一批**不超过 1 次**；多次返工需总经理批准。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【停】**：发现人立即停止相关生产、发料或发货（PM-OP-001 §4.4.3）。\n- **【隔离与标识】**：受影响物料改为\"冻结\"状态，移到隔离位置；保全原始记录。\n- **【报告】**：通知 QC、管代和批次负责人。\n- **【调查】**：QC/技术人员评估对质量的影响；调取批记录、检验记录、留样。\n- **【处置】**：管代批准以下之一：继续流转、复检、返工、让步接收、降级、报废、退货（QA-OP-008 §4.3.2）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n### 必须立即暂停流转的情形（流转计划 §7.1）\n批号或标签不清；实物与记录不符；数量差异无法解释；容器破损；有污染疑虑；温度或时限超限；检验不合格；资料不全；未经批准的变更。\n\n### 处理步骤\n1. **停**：发现人立即停止相关生产、发料或发货（PM-OP-001 §4.4.3）。\n2. **隔离与标识**：受影响物料改为\"冻结\"状态，移到隔离位置；保全原始记录。\n3. **报告**：通知 QC、管代和批次负责人。\n4. **调查**：QC/技术人员评估对质量的影响；调取批记录、检验记录、留样。\n5. **处置**：管代批准以下之一：继续流转、复检、返工、让步接收、降级、报废、退货（QA-OP-008 §4.3.2）。\n6. **关联**：偏差编号写进批记录和放行单；需要根因调查的转 ⑫。\n\n### 偏差分级（建议）\n现行 PM-OP-001 引用的《异常偏差处理规程》PM-SMP-006 **尚未建立**（风险清单 R5）。在建立之前，建议先用 QA-OP-005 的风险值 R = S × P（S、P 各 1–5 级）来分级：\n\n> **已起草**：`00 AI 工作区/待审核/PM-SMP-006 异常偏差处理规程_草案V0.1_20261104.docx`（2026-11-04，AI 起草，待人工审核）。含 S、P 分级描述（建议）、直接判为重大的条件、检验结果异常的调查、处置与关闭要求，附流程表、偏差报告单和台账样式。下表为摘要，以规程为准。\n\n| R 值 | 等级（QA-OP-005） | 偏差处理建议 |\n|---|---|---|\n| R ≤ 4 | 低 | 记录 + 批次负责人处置 + QC 确认；按季度汇总趋势 |\n| 5–9 | 中 | 必须调查原因；管代批准处置；评估是否开 CAPA |\n| R ≥ 10 | 高 | 必须开 CAPA；管代组织评审；影响已放行或已发货批次时转 ⑪/⑫ 评估客户通知或召回；重大偏差由总经理决策（PM-OP-001 §3） |\n\n### 返工（PM-OP-004）\n- 前提：不合格评审已决定返工。由项目部提出返工申请，写明不合格内容、返工工艺与原工艺的差异、预期指标、风险评估。\n- 审批：技术可行性和风险评估后，由**管代批准**。\n- 次数：原则上同一批**不超过 1 次**；多次返工需总经理批准。\n- 标识：\"返工品 - 原批号 - 返工日期\"，与正常品分区存放。\n- 放行：返工后重新做**完整**成品检验；必要时加做稳定性观察；客户要求时在 CoA 上注明返工批。\n- 每一次返工都要按 QA-OP-009 做根因调查（转 ⑫）。\n\n### 让步与紧急放行\n- 流转计划**不设常规\"紧急放行\"通道**。但 PM-OP-002 §4.2.2 写有\"紧急放行\"，两份文件冲突，待统一。\n- 让步放行：原则上需要**客户书面同意 + 管代签字**；QA-OP-011 §4.4 仍是\"待人工确认\"状态，规则定下来之前不应使用。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「批号、批次关系与追溯」梳理关键控制要求，重点涵盖 **批号、批次关系与追溯**、**批号、批次关系与追溯**、**批号、批次关系与追溯** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 原辅料的供方、批号、入库日期、检验结果；\n- 每道工序的操作人、复核人、关键参数；\n- 检验人、放行人、放行日期；\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【批号、批次关系与追溯】**：原辅料的供方、批号、入库日期、检验结果；\n- **【批号、批次关系与追溯】**：每道工序的操作人、复核人、关键参数；\n- **【批号、批次关系与追溯】**：检验人、放行人、放行日期；\n- **【批号、批次关系与追溯】**：发给了哪个客户、发货日期、CoA 编号。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**追溯链**（PM-OP-002 §4.4）：采购入库单 → 原辅料检验记录 → 领料单 → 批生产记录 → 半成品/成品检验记录 → CoA → 出货单 → 销售合同 → 客户收货与反馈。\n\n任意一批成品都应能查到：\n- 原辅料的供方、批号、入库日期、检验结果；\n- 每道工序的操作人、复核人、关键参数；\n- 检验人、放行人、放行日期；\n- 发给了哪个客户、发货日期、CoA 编号。\n\n**父子批规则**（流转计划 §6.2）：\n- 同一半成品分几次分装，要保留父批号和每次的子批号。\n- 不同来源的批次不得自行合批。确需合批的，须事先批准，并登记全部父批号、投入比例、依据和检验要求。\n\n**物料平衡**（流转计划 §6.2）：\n可核算投入量 ＝ 成品量 ＋ 检验取样量 ＋ 留样量 ＋ 可回收余量 ＋ 已记录损耗。\n差额必须解释；体积、质量、容器数分别核算；取样和留样不能重复计数。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「批号、批次关系与追溯」梳理关键控制要求，重点涵盖 **批号、批次关系与追溯**、**批号、批次关系与追溯**、**批号、批次关系与追溯** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 原辅料的供方、批号、入库日期、检验结果；\n- 每道工序的操作人、复核人、关键参数；\n- 检验人、放行人、放行日期；\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【批号、批次关系与追溯】**：原辅料的供方、批号、入库日期、检验结果；\n- **【批号、批次关系与追溯】**：每道工序的操作人、复核人、关键参数；\n- **【批号、批次关系与追溯】**：检验人、放行人、放行日期；\n- **【批号、批次关系与追溯】**：发给了哪个客户、发货日期、CoA 编号。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**追溯链**（PM-OP-002 §4.4）：采购入库单 → 原辅料检验记录 → 领料单 → 批生产记录 → 半成品/成品检验记录 → CoA → 出货单 → 销售合同 → 客户收货与反馈。\n\n任意一批成品都应能查到：\n- 原辅料的供方、批号、入库日期、检验结果；\n- 每道工序的操作人、复核人、关键参数；\n- 检验人、放行人、放行日期；\n- 发给了哪个客户、发货日期、CoA 编号。\n\n**父子批规则**（流转计划 §6.2）：\n- 同一半成品分几次分装，要保留父批号和每次的子批号。\n- 不同来源的批次不得自行合批。确需合批的，须事先批准，并登记全部父批号、投入比例、依据和检验要求。\n\n**物料平衡**（流转计划 §6.2）：\n可核算投入量 ＝ 成品量 ＋ 检验取样量 ＋ 留样量 ＋ 可回收余量 ＋ 已记录损耗。\n差额必须解释；体积、质量、容器数分别核算；取样和留样不能重复计数。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑪ 交付与客户反馈」梳理关键控制要求，重点涵盖 **⑪ 交付与客户反馈**、**⑪ 交付与客户反馈**、**⑪ 交付与客户反馈** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑪ 交付与客户反馈】**：每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- **【⑪ 交付与客户反馈】**：客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- **【⑪ 交付与客户反馈】**：客户审核的结论和整改记录有没有存档。\n- **【⑪ 交付与客户反馈】**：评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把放行的产品**完好送到**客户手里，并且把客户的每一次反馈（咨询、评测结果、投诉、退货、审核）都**登记、分级、给回复、能追到结果**。反馈是改进的原料，丢了就没有闭环。\n\n**该盯什么**\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n**常见翻车点**\n- 评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n- 亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录均未存档（风险清单 R8）。\n- 满意度调查表逐格相同且早于签约日（风险清单 R1）。\n\n**可以问团队**\n1. 最近一个月收到了哪些客户反馈？各自处理到哪一步？\n2. 这个客户的协议里，回复时限、变更通知提前期、留样要求分别是什么？\n3. 上次客户审核的不符合项，整改证据在哪？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑪ 交付与客户反馈」梳理关键控制要求，重点涵盖 **⑪ 交付与客户反馈**、**⑪ 交付与客户反馈**、**⑪ 交付与客户反馈** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑪ 交付与客户反馈】**：每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- **【⑪ 交付与客户反馈】**：客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- **【⑪ 交付与客户反馈】**：客户审核的结论和整改记录有没有存档。\n- **【⑪ 交付与客户反馈】**：评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：把放行的产品**完好送到**客户手里，并且把客户的每一次反馈（咨询、评测结果、投诉、退货、审核）都**登记、分级、给回复、能追到结果**。反馈是改进的原料，丢了就没有闭环。\n\n**该盯什么**\n- 每条反馈有没有登记，是否按时限回复（程序要求 5 个工作日内首次响应，客户协议更严的从严）。\n- 客户的特殊要求（剩余效期、运输温度）在接单时有没有核对。\n- 客户审核的结论和整改记录有没有存档。\n\n**常见翻车点**\n- 评测不理想只在微信里聊，没有登记（诺唯赞评测 dsDNA 符合率 81%，全景 §5.1）。\n- 亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录均未存档（风险清单 R8）。\n- 满意度调查表逐格相同且早于签约日（风险清单 R1）。\n\n**可以问团队**\n1. 最近一个月收到了哪些客户反馈？各自处理到哪一步？\n2. 这个客户的协议里，回复时限、变更通知提前期、留样要求分别是什么？\n3. 上次客户审核的不符合项，整改证据在哪？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「二方审核（客户审核）」梳理关键控制要求，重点涵盖 **审前**、**审中**、**审后** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 逐批 CoA，质量放行；\n- 变更提前通知（30 个工作日起）；\n- 偏差和 CAPA 要包含根因，以及对其他批次的影响；\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【审前】**：建\"常驻审核资料包\"，按季度用最新的**真实**批次刷新（风险清单 R8 建议）。\n- **【审中】**：只提交真实、本公司主体、格式受控的记录。历史上出现过两年提交同两个 CCP 批次、提交墨肽格式批记录等问题（风险清单 R8；全景 §7）。\n- **【审后】**：不符合项逐条登记 → 开 CAPA → 按期提交整改证据 → 归档客户结论。亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录目前**均未存档**（风险清单 R8）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n- **审前**：建\"常驻审核资料包\"，按季度用最新的**真实**批次刷新（风险清单 R8 建议）。\n- **审中**：只提交真实、本公司主体、格式受控的记录。历史上出现过两年提交同两个 CCP 批次、提交墨肽格式批记录等问题（风险清单 R8；全景 §7）。\n- **审后**：不符合项逐条登记 → 开 CAPA → 按期提交整改证据 → 归档客户结论。亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录目前**均未存档**（风险清单 R8）。\n\n**客户共性要求清单**（全景 §7），可直接作为 ⑪ 的检查表：\n- 逐批 CoA，质量放行；\n- 变更提前通知（30 个工作日起）；\n- 偏差和 CAPA 要包含根因，以及对其他批次的影响；\n- 设备校准、方法验证；\n- 留样至效期；\n- 冷链；\n- 关键物料供应商管理；\n- 批记录可追溯；\n- OEM 试剂要求供方自建溯源。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「二方审核（客户审核）」梳理关键控制要求，重点涵盖 **审前**、**审中**、**审后** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n- 逐批 CoA，质量放行；\n- 变更提前通知（30 个工作日起）；\n- 偏差和 CAPA 要包含根因，以及对其他批次的影响；\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【审前】**：建\"常驻审核资料包\"，按季度用最新的**真实**批次刷新（风险清单 R8 建议）。\n- **【审中】**：只提交真实、本公司主体、格式受控的记录。历史上出现过两年提交同两个 CCP 批次、提交墨肽格式批记录等问题（风险清单 R8；全景 §7）。\n- **【审后】**：不符合项逐条登记 → 开 CAPA → 按期提交整改证据 → 归档客户结论。亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录目前**均未存档**（风险清单 R8）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n- **审前**：建\"常驻审核资料包\"，按季度用最新的**真实**批次刷新（风险清单 R8 建议）。\n- **审中**：只提交真实、本公司主体、格式受控的记录。历史上出现过两年提交同两个 CCP 批次、提交墨肽格式批记录等问题（风险清单 R8；全景 §7）。\n- **审后**：不符合项逐条登记 → 开 CAPA → 按期提交整改证据 → 归档客户结论。亚辉龙、迈克、科华、浩欧博 2025 年的审核结论和整改记录目前**均未存档**（风险清单 R8）。\n\n**客户共性要求清单**（全景 §7），可直接作为 ⑪ 的检查表：\n- 逐批 CoA，质量放行；\n- 变更提前通知（30 个工作日起）；\n- 偏差和 CAPA 要包含根因，以及对其他批次的影响；\n- 设备校准、方法验证；\n- 留样至效期；\n- 冷链；\n- 关键物料供应商管理；\n- 批记录可追溯；\n- OEM 试剂要求供方自建溯源。",

    "title": "⑫ CAPA 与变更",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「⑫ CAPA 与变更」梳理关键控制要求，重点涵盖 **⑫ CAPA 与变更**、**⑫ CAPA 与变更**、**⑫ CAPA 与变更** 等核心要素（来源：`工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md`）。\n- 根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- 措施完成后有没有验证有效。\n- 改动是否通知了协议要求的客户、提前了多久。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【⑫ CAPA 与变更】**：根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- **【⑫ CAPA 与变更】**：措施完成后有没有验证有效。\n- **【⑫ CAPA 与变更】**：改动是否通知了协议要求的客户、提前了多久。\n- **【⑫ CAPA 与变更】**：外审不符合 Q8.4.1 的整改，写了做不到的内容（SaaS 平台、法务部，风险清单 R5）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_补充_管理者速读与LabOS设计_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n**白话**：**CAPA** 是“纠正与预防措施”：出了问题，找到真正的原因，改掉它，防止再发生，并验证有效。**变更控制**是：任何改动（原料、供方、工艺、方法、规格）先评估影响、批准、通知客户，再执行。这一步让整条链路形成闭环：问题要回到出问题的那道工序去修。\n\n**该盯什么**\n- 根因是不是真根因（“员工粗心”通常不是，要追问为什么系统允许它发生）。\n- 措施完成后有没有验证有效。\n- 改动是否通知了协议要求的客户、提前了多久。\n\n**常见翻车点**\n- 外审不符合 Q8.4.1 的整改，写了做不到的内容（SaaS 平台、法务部，风险清单 R5）。\n- 措施做完就关闭，没有验证。\n- 工艺或方法改了，没有评估是否要通知客户。\n\n**可以问团队**\n1. 这个问题的根因是什么？为什么规程或系统允许它发生？\n2. 措施做完后，用什么标准证明有效？\n3. 这次改动要不要通知客户？协议要求提前多久？",
    "cases": [
      {
        "title": "工序 ⑫ 自家案例与问题对照",
        "tag": "公司实录案例",
        "body": "| 案例 | 说明 | 证据 | 讨论题 |\n|---|---|---|---|\n| ISO 外审不符合 Q8.4.1 | 奥浦迈、语燕未纳入合格供方；90 天整改；关闭证据待确认；整改用的供应商程序写了做不到的内容（SaaS 平台、法务部） | 全景 §6；风险清单 R5 | 根因是\"漏登\"，还是\"供方程序与公司规模不匹配\"？有效性如何验证？ |\n| 记录真实性问题群 | 模拟记录、CoA 数值复制、稳定性时间不成立、克隆检验数据相同 | 风险清单 R1 | 这是 ⑩ 的执行问题，还是缺少系统控制？LabOS 能消除哪些条件？ |\n| 诺唯赞 81% 符合率 | 来自 ⑪ 的 B 类反馈 | 全景 §5.1 | 按根因退回表推演：退回 ②、⑦ 还是 ①？（教学推演，E4） |\n| CCP 检验方法不适用 | 只检外观、溶解性、SDS-PAGE，没有 HPLC 和 MS | 全景 §5.1；风险清单 R6 | 改用 HPLC（或委外）属于重大变更吗？需要通知哪些客户？ |\n| 工艺来源与授权 | dsDNA、RF 等工艺资料来自宁波赛珀 | 风险清单 R10 | 这类问题的 CAPA 输出是什么？与 ① 的技术来源合法性如何衔接？ |"

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「CAPA 流程（QA-OP-009）」梳理关键控制要求，重点涵盖 **#**、**1**、**2** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【#】**：步骤；做什么；负责；记录\n- **【1】**：立项；描述不合格事实（是什么、在哪、什么时候、多少、证据）；体系/内审类由综合部填写；投诉类由销售填写；纠正和预防措施处理单 QA-FM-024\n- **【2】**：遏制；立即控制影响：冻结相关批次、停发、通知（与 ⑩.3、⑪.3 衔接）；责任部门 + 管代；同上\n- **【3】**：影响评估；涉及哪些批次、哪些已发货、哪些客户；QC + 项目部；同上\n- **【4】**：根因分析；用 5Why、因果图、排列图或试验，找到**可验证**的根因；责任部门；同上 + 分析附件\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n| # | 步骤 | 做什么 | 负责 | 记录 |\n|---|---|---|---|---|\n| 1 | 立项 | 描述不合格事实（是什么、在哪、什么时候、多少、证据） | 体系/内审类由综合部填写；投诉类由销售填写 | 纠正和预防措施处理单 QA-FM-024 |\n| 2 | 遏制 | 立即控制影响：冻结相关批次、停发、通知（与 ⑩.3、⑪.3 衔接） | 责任部门 + 管代 | 同上 |\n| 3 | 影响评估 | 涉及哪些批次、哪些已发货、哪些客户 | QC + 项目部 | 同上 |\n| 4 | 根因分析 | 用 5Why、因果图、排列图或试验，找到**可验证**的根因 | 责任部门 | 同上 + 分析附件 |\n| 5 | 措施 | 纠正（处理已发生的）+ 纠正措施（消除根因）+ 预防措施（同类风险）；写明责任人和完成期限 | 责任部门制定，管代批准 | 同上 |\n| 6 | 实施 | 按计划执行；涉及文件、工艺、规格改动的，走 ⑫.3 变更 | 责任部门 | 变更记录 |\n| 7 | 有效性验证 | 用事先定好的标准判断措施是否有效（如连续 N 批未再发生、复审通过） | 监督部门（综合部/管代） | 同上 |\n| **C1** | **CAPA 关闭** | 有效性验证通过，监督部门主管签字确认 | 管代 | 同上 |\n| 8 | 回流 | 按根因所在退回 ①–⑩，更新知识库和风险登记 | 综合部 | 知识库更新日志 |\n\n### 根因退回表（建议，本知识梳理的核心）\n\n| 根因类型 | 典型例子 | 退回到 |\n|---|---|---|\n| 需求或用途理解错 | 客户平台、样本类型与我们的验收方式不匹配 | ① 调研与立项 |\n| 设计问题 | 表位、构建、标签、呈现方式导致性能不足 | ② 设计 |\n| 原料或供方问题 | 合成肽质量波动；供方未纳入合格名录 | ③ 构建与原料 / 供方管理 |\n| 工艺能力不足 | 收率、纯度、批间差不稳定 | ④⑤⑥ 或 ⑧ |\n| 检验方法不适用 | 方法不能检出关键属性（如小肽只用 SDS-PAGE） | ⑦ 质量验证 |\n| 规格或效期没有依据 | 效期缺少稳定性数据 | ⑧ 稳定性 / ⑨ 定型 |\n| 执行或记录问题 | 未按 SOP 操作；记录不真实；交接遗漏 | ⑩ 批生产（培训、复核、系统控制） |\n| 交付或沟通问题 | 冷链超时；客户要求没传达 | ⑪ 交付 |\n\n**判别要点**：\"加强培训\"\"员工粗心\"通常不是根因。要继续追问：为什么规程或系统允许这个错误发生？",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「变更控制」梳理关键控制要求，重点涵盖 **#**、**1**、**2** 等核心要素（来源：`工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【#】**：步骤；做什么；负责\n- **【1】**：申请；写清变更内容、原因、涉及的产品、批次和文件；提出人\n- **【2】**：分类；重大**：可能影响产品质量、性能、规格，或客户已确认的工艺，如关键原料、供方、工艺步骤、检验方法、规格、生产地点。**一般**：不影响质量，如格式、非关键设备的同型替换；综合部 + QC\n- **【3】**：影响评估；要做哪些验证（对比批、稳定性、方法确认）；哪些客户需要通知；对库存和在制批的影响；R = S×P；项目部 + QC\n- **【4】**：批准；一般变更由管代批准；重大变更由管代批准，涉及重大资源的报总经理；管代 / 总经理\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `工序卡_10-12_批生产_客户反馈_CAPA变更_草案V0.1_20261104.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n> **重要缺口**：现行体系**没有独立的变更控制程序**。只有 SM-OP-001 §4.4 讲产品要求变更（与客户协商并按 QA-OP-001 修改文件），以及 QA-OP-009 §4.5 讲 CAPA 引起的文件更改。客户普遍要求变更提前 30 个工作日通知（全景 §7），因此建议新建变更控制规程。下面的流程是**建议**。\n>\n> **已起草**：`00 AI 工作区/待审核/QA-SMP-007 变更管理规程_草案V0.1_20261104.docx`（2026-11-04，AI 起草，待人工审核）。编号沿用 RD-OP-001 §5 已引用的 QA-SMP-007；内容覆盖分类判定、影响评估、验证、批准、顾客通知、紧急/临时变更、供方变更（衔接 SC-OP-002 §4.4.1），附流程表、申请评估单和顾客通知函样式。下表为摘要，以规程为准。\n\n| # | 步骤 | 做什么 | 负责 |\n|---|---|---|---|\n| 1 | 申请 | 写清变更内容、原因、涉及的产品、批次和文件 | 提出人 |\n| 2 | 分类 | **重大**：可能影响产品质量、性能、规格，或客户已确认的工艺，如关键原料、供方、工艺步骤、检验方法、规格、生产地点。**一般**：不影响质量，如格式、非关键设备的同型替换 | 综合部 + QC |\n| 3 | 影响评估 | 要做哪些验证（对比批、稳定性、方法确认）；哪些客户需要通知；对库存和在制批的影响；R = S×P | 项目部 + QC |\n| 4 | 批准 | 一般变更由管代批准；重大变更由管代批准，涉及重大资源的报总经理 | 管代 / 总经理 |\n| 5 | 客户通知 | 重大变更按客户协议提前通知（如 30 个工作日），需要时取得客户书面同意后才执行 | 销售 + 管代 |\n| 6 | 实施与验证 | 按计划执行和验证；文件按 QA-OP-001 换版；培训；回收旧版 | 项目部 + 综合部 |\n| **C2** | **变更关闭** | 验证结果达标；文件已生效；客户通知已有回执；首批变更后产品放行 | 管代 |",

    "key": "iso.5.1",
    "path": "实验室 ISO 体系管理 / 记录与数据完整性 / 5. 数据完整性：系统层规则",
    "title": "5. 数据完整性：系统层规则",
    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「5. 数据完整性：系统层规则」梳理关键控制要求，重点涵盖 **原始数据先于记录**、**修改留痕**、**不可删除** 等核心要素（来源：`LabOS字段与规则总表_草案V0.1_20261105.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【原始数据先于记录】**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n- **【修改留痕】**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n- **【不可删除】**：已提交的记录只能作废并注明原因，不能物理删除。\n- **【时间戳由系统生成】**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n- **【签署证据】**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `LabOS字段与规则总表_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n对应 AGENTS.md §2.3 和风险清单 R1。目标是让“补造、倒签、覆盖”**在系统里做不到**，而不是只靠制度。\n\n1. **原始数据先于记录**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n2. **修改留痕**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n3. **不可删除**：已提交的记录只能作废并注明原因，不能物理删除。\n4. **时间戳由系统生成**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n5. **签署证据**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n6. **AI 读取的内容必须人核对**：现有“待整理与核对”流程（绿底/黄底，改/对/驳回）应保留，并在报表里区分“人工核对过”和“AI 读出未核”的数值。\n7. **测试数据隔离**：我在“批次与样品”里看到“测试1027/测试1028”等测试批次与正式批次混在一个清单里。建议增加“测试”标记，默认不进入统计、不进入周报和 CoA。\n8. **示例与真实分开**：培训或演示用的数据必须有“示例/培训用”标识，不得生成看起来像真实原始记录的数据（AGENTS.md §2.3）。",

    "note": "## **1. 概述（整体定义与目的）**\n- **本节核心**：围绕「5. 数据完整性：系统层规则」梳理关键控制要求，重点涵盖 **原始数据先于记录**、**修改留痕**、**不可删除** 等核心要素（来源：`LabOS字段与规则总表_草案V0.1_20261105.md`）。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【原始数据先于记录】**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n- **【修改留痕】**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n- **【不可删除】**：已提交的记录只能作废并注明原因，不能物理删除。\n- **【时间戳由系统生成】**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n- **【签署证据】**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **管理者核查要点**：对照 `LabOS字段与规则总表_草案V0.1_20261105.md` 逐项核实本节原始记录、责任人签字与 LabOS 系统状态是否闭环。\n\n---\n\n### **附：原始章节明细**\n对应 AGENTS.md §2.3 和风险清单 R1。目标是让“补造、倒签、覆盖”**在系统里做不到**，而不是只靠制度。\n\n1. **原始数据先于记录**：检验结果必须关联原始文件（仪器导出、胶图、色谱图）。没有附件的数值，在报表和 CoA 里标“待核”。\n2. **修改留痕**：任何字段修改保留旧值、修改人、时间和原因；已签核的记录不可直接改，只能走更正流程。\n3. **不可删除**：已提交的记录只能作废并注明原因，不能物理删除。\n4. **时间戳由系统生成**：日期不能手填倒填；补录必须标明“补录”并记录实际录入时间。\n5. **签署证据**：关键批准需可识别的签署（账号、时间），不能以他人账号代签。\n6. **AI 读取的内容必须人核对**：现有“待整理与核对”流程（绿底/黄底，改/对/驳回）应保留，并在报表里区分“人工核对过”和“AI 读出未核”的数值。\n7. **测试数据隔离**：我在“批次与样品”里看到“测试1027/测试1028”等测试批次与正式批次混在一个清单里。建议增加“测试”标记，默认不进入统计、不进入周报和 CoA。\n8. **示例与真实分开**：培训或演示用的数据必须有“示例/培训用”标识，不得生成看起来像真实原始记录的数据（AGENTS.md §2.3）。",

    "title": "基础知识学习",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：围绕 **IVD活性原料**（重组抗原、工程抗体、合成多肽、生物素化核酸）建立从 **前沿调研与立项策划**、**分子工程设计与载体构建**、**上游发酵与可溶性表达**、**下游层析纯化与Buffer/柱维护**、**偶联呈现与临床功能性评价** 到 **稳定性考核与三批定型转换** 的 6 大主干标准化知识体系。\n- **V2.0 架构逻辑**：\n  1. **每道工序内嵌 QC 与 Gate 标准**：不再把所有质检堆在最后，每道工序末尾直接管控本工序的理化/分子质检与 **Gate放行四件套**；\n  2. **理论 + Buffer + 手工/自动柱实操合一**：贴合实验室“一套全自动层析仪（AKTA）+ 手工柱（重力柱/蠕动泵预装柱）为主”的实际配置，详解装柱、过柱、再生与封存保养；\n  3. **理化合格与临床功能评价解耦**：纯化关口（Gate R5）管“蛋白纯不纯、聚不聚”，第 ⑤ 主干专门管“上板后测病人血清准不准（4PL 效价与阴阳性血清盘）”。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【IVD活性原料】**：体外诊断（In Vitro Diagnostics）试剂盒中最核心的“生物芯片”（如用于捕获患者自身抗体的重组抗原、标记抗体），其构象纯度与批间一致性直接决定试剂盒的临床灵敏度与特异性。\n- **【前沿调研与立项策划】**：在花钱合成基因前，先锁定临床检测平台（发光/ELISA/胶乳）、UniProt 唯一序列、一至四级空间结构隐患与专利自由实施（FTO）边界。\n- **【分子工程设计与载体构建】**：将天然基因改造成适合工程菌高效可溶表达的质粒（密码子优化、6xHis-MBP/SUMO 双标签、柔性 Linker、TEV 酶切位点与截短改造）。\n- **【Gate放行四件套】**：每道工序转入下一工序前必须核验的四个要素 —— ① 检查方法（怎么测）、② 通过依据（合格线是多少）、③ 未通过动作（不合格怎么拦截回退）、④ 交付物（留什么原始记录与实物）。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **全局管理铁律**：① 验收标准必须在实验前定好，严禁看结果反改标准；② 任何 CoA 和验证报告上的数字必须 100% 挂钩原始图谱附件（电泳原图、SEC 色谱图、酶标仪原始读数）；③ 点击任意带子节点的父级分支可自动展开下级步骤。",

        "title": "Ro52 (TRIM21) 自免抗原全生命周期 6 大主干通关路线图",
        "tag": "全景主线案例",
        "body": "## **1. 靶点挑战与 V2.0 六步通关总览**\n- **靶点底牌**：人源 Ro52（UniProt `P19474 v1`，全长 475 aa，54.2 kDa），干燥综合征（SS）与系统性红斑狼疮（SLE）核心自身抗原。天然无糖基化，中间卷曲螺旋区极易自聚成包涵体，C 端 PRY/SPRY 域天然结合人 IgG Fc 段。\n\n---\n\n## **2. 六大主干与内嵌 Gate 放行标准一览**\n| 主干工序 | 核心工程动作 | 本工序内嵌质检（QC）与 Gate 放行线 |\n|---|---|---|\n| **① 前沿调研与立项** | 锁定发光/ELISA 平台、P19474 序列、四级结构与全长/截短双路线 | **Gate R1**：证据矩阵完整、FTO 无侵权、设计输入指标（`RD-FM-003`）锁定 |\n| **② 分子设计与构建** | CAI 优化至 0.89，构建 `pET28a-6xHis-MBP-Linker-TEV-Ro52`，DH5α 保种 | **Gate R2/R3**：Sanger 双向全长测序 100% 零突变、DH5α 主种子库（MCB）建档 |\n| **③ 上游发酵与表达** | Rosetta(DE3) 双抗培养，16°C 预冷 + 0.1 mM IPTG + 50 μM ZnCl₂ 诱导 | **Gate R4 (G1)**：湿菌重 ≥15 g/L，T/S/P 等体积电泳上清可溶占比 ≥40% |\n| **④ 下游纯化与Buffer** | Ni/Amylose 捕获 → TEV 透析切标 → 反挂 Ni 柱 → Q 阴离子柱 → SEC 分子筛 | **Gate R5 (G2)**：SDS-PAGE 纯度 ≥90%、SEC-HPLC 二聚体主峰 ≥85%、A₂₆₀/A₂₈₀ <0.65 |\n| **⑤ 偶联与功能评价** | 直接包被或生物素化，棋盘滴定 4PL 拟合 EC₅₀，50 例临床参考血清盘盲测 | **Gate R6/R7**：相对效价 85%–115%，阳性符合率 ≥95%，高 IgG/RF 干扰阴性符合率 ≥96.7% |\n| **⑥ 稳定性与定型** | HEPES/PBS+甘油+海藻糖防冻配方，5 次冻融 + 37°C 加速 + 3 批实时稳定性 | **Gate R8/R9 (G3)**：3 批 EC₅₀ CV ≤10%，规格/方法/工艺三版本冻结，管代双签放行 |"
      }

    "title": "⓪ 实验室 Buffer 化学体系与层析设备工程基石 (Buffer & Column Foundation)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在动手过柱前，彻底吃透纯化 **缓冲盐pH缓冲范围**、**离子强度与消电离盐**、**还原剂与金属螯合禁忌**，并熟练掌握实验室主力 **手工柱装柱操作** 与 **全自动AKTA层析系统** 的标准作业程序（SOP）。\n- **核心认知**：80% 的蛋白纯化失败（蛋白沉淀、不挂柱、洗脱峰拖尾、柱子堵死）不是填料坏了，而是 Buffer 配错 pH/盐浓度，或者装柱进气泡、流速过快导致沟流。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【缓冲盐pH缓冲范围】**：每种缓冲盐（Tris、HEPES、PBS、MES）只有在自身 pKa ± 1.0 范围内才有抵抗酸碱波动的能力；超出范围加酸加碱时 pH 会瞬间失控。\n- **【离子强度与消电离盐】**：溶液中 NaCl/KCl 的浓度；适当盐浓度（150–500 mM）能屏蔽蛋白与填料骨架的非特异静电吸附并维持蛋白盐溶，但做离子交换上样时必须降至低盐（20–50 mM）才能挂柱。\n- **【还原剂与金属螯合禁忌】**：DTT/TCEP 用于打断异常分子间二硫键，EDTA 用于螯合二价金属；但在金属蛋白（含 Zn²⁺ 的 RING 域）和 Ni²⁺ 柱纯化中，过量 DTT 或哪怕 1 mM EDTA 都会剥离金属导致蛋白失活脱柱。\n- **【手工柱装柱操作】**：利用开口空柱管与填料匀浆，通过重力沉降或恒流泵压实成无气泡、顶面水平、柱效均匀的层析柱床的手工基本功。\n- **【全自动AKTA层析系统】**：配备精密双柱塞泵、在线 UV（A₂₈₀/A₂₅₄）、电导率仪、pH 电极和自动组分收集器的蛋白纯化工作站，适用于线性盐梯度洗脱和分子筛精细分离。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **纯化前点检**：所有 Buffer 上机前必须实测室温 pH、经 0.22 µm 滤膜抽滤并超声脱气 15 min；手工柱必须目视检查无干裂纹、无气泡。",

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：在动手过柱前，彻底吃透纯化 **缓冲盐pH缓冲范围**、**离子强度与消电离盐**、**还原剂与金属螯合禁忌**，并熟练掌握实验室主力 **手工柱装柱操作** 与 **全自动AKTA层析系统** 的标准作业程序（SOP）。\n- **核心认知**：80% 的蛋白纯化失败（蛋白沉淀、不挂柱、洗脱峰拖尾、柱子堵死）不是填料坏了，而是 Buffer 配错 pH/盐浓度，或者装柱进气泡、流速过快导致沟流。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【缓冲盐pH缓冲范围】**：每种缓冲盐（Tris、HEPES、PBS、MES）只有在自身 pKa ± 1.0 范围内才有抵抗酸碱波动的能力；超出范围加酸加碱时 pH 会瞬间失控。\n- **【离子强度与消电离盐】**：溶液中 NaCl/KCl 的浓度；适当盐浓度（150–500 mM）能屏蔽蛋白与填料骨架的非特异静电吸附并维持蛋白盐溶，但做离子交换上样时必须降至低盐（20–50 mM）才能挂柱。\n- **【还原剂与金属螯合禁忌】**：DTT/TCEP 用于打断异常分子间二硫键，EDTA 用于螯合二价金属；但在金属蛋白（含 Zn²⁺ 的 RING 域）和 Ni²⁺ 柱纯化中，过量 DTT 或哪怕 1 mM EDTA 都会剥离金属导致蛋白失活脱柱。\n- **【手工柱装柱操作】**：利用开口空柱管与填料匀浆，通过重力沉降或恒流泵压实成无气泡、顶面水平、柱效均匀的层析柱床的手工基本功。\n- **【全自动AKTA层析系统】**：配备精密双柱塞泵、在线 UV（A₂₈₀/A₂₅₄）、电导率仪、pH 电极和自动组分收集器的蛋白纯化工作站，适用于线性盐梯度洗脱和分子筛精细分离。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **纯化前点检**：所有 Buffer 上机前必须实测室温 pH、经 0.22 µm 滤膜抽滤并超声脱气 15 min；手工柱必须目视检查无干裂纹、无气泡。",

      }

    "title": "主缓冲盐对 (Buffer Pairs) 底层化学",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握蛋白实验室四大主力缓冲盐对（**Tris-HCl缓冲对**、**HEPES两性离子缓冲对**、**PBS磷酸盐缓冲对**、**MES微酸性缓冲对**）的 **有效缓冲区间（pKa±1）**、**温度与冷冻pH漂移特性**、**游离伯胺/羧基偶联配伍禁区** 以及 **阴阳离子交换反离子法则**。\n- **为什么把 Buffer 单独提为第 ⓪ 号工程基石**：Buffer 绝不仅仅是“纯化过柱时冲柱子的水”——从 **上游破壁提取**、**中游亲和/离子交换/分子筛层析**、**下游 NHS 生物素化/EDC 磁珠偶联** 到 **终原液 −80°C 冻存制剂**，每一步都在 Buffer 里发生。前一步选错缓冲盐（例如用 Tris 保存待偶联抗原，或用钠盐 PBS 慢冻含锌蛋白），后面所有工序都会全军覆没。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Tris-HCl缓冲对】**：`pKa (25°C) = 8.06`，有效缓冲范围 **pH 7.0–9.0**。成本低、缓冲力强，是破壁、Ni-NTA 和 **阴离子交换（AEX）** 的主力；但有两大死穴：① **温度系数极大**（温度每降 1°C，pH 升高约 0.03）；② **分子自带游离伯胺（-NH₂）**，绝对禁止用于 NHS 生物素化或羧基磁珠偶联！\n- **【HEPES两性离子缓冲对】**：`pKa (25°C) = 7.48`，有效缓冲范围 **pH 6.8–8.2**（Good's Buffer 代表）。**不含游离伯胺、不与 Ca²⁺/Mg²⁺/Zn²⁺ 生成沉淀、低温与冷冻 pH 极稳定**，是高价值重组抗原精纯、偶联与冻存的“全能冠军”。\n- **【PBS磷酸盐缓冲对】**：`pKa₂ = 7.20`，有效缓冲范围 **pH 6.8–8.0**。最接近人体生理环境、不含伯胺，兼容 NHS 偶联；但 **易与二价金属（Zn²⁺/Ca²⁺）生成磷酸盐微沉淀**，且 **钠盐 PBS 在 −20°C 冷冻时共晶析出会导致局部 pH 暴跌至 3.6**。\n- **【MES微酸性缓冲对】**：`pKa (25°C) = 6.15`，有效缓冲范围 **pH 5.5–6.7**。不含伯胺与羧基，是 **阳离子交换（CEX，SP/CM 柱）** 和 **EDC/NHS 羧基磁珠/胶乳微球活化（pH 6.0）** 的专属缓冲液。\n- **【有效缓冲区间（pKa±1）】**：亨德森-哈塞尔巴尔赫方程 pH = pKa + log[[A⁻] ÷ [HA]] 决定了只有当目标 pH 落在缓冲盐 pKa ± 1.0 范围内时，共轭酸碱对才有足够的抗酸碱冲击能力；超出该区间配出的 Buffer 形同白水！",
    "cases": [
      {
        "title": "项目实战案例：建立全实验室《四大缓冲盐选型与禁区红绿灯表》",
        "tag": "实验室实战案例",
        "body": "- 实验室将 `Tris / HEPES / PBS / MES` 四张配伍红绿灯卡贴在配液室 pH 计上方：凡下游需做 NHS-Biotin 或 EDC 磁珠偶联的项目，自最后一步精纯（SEC 分子筛或超滤换液）起一律强制切入 **20 mM HEPES 或钾盐 K-PBS (pH 7.4)**，彻底终结了因 Tris 残留导致的偶联失败事故。"
      }

    "title": "pKa缓冲容量与温度系数 (Tris vs. HEPES/PBS)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：吃透缓冲盐的 **pKa±1有效缓冲边界**、**Tris温度系数（ΔpKa/ΔT = -0.028/°C）** 与 **钠盐PBS冷冻共晶pH暴跌** 三大物理化学规律，做到“在什么温度下用，就按什么温度校准 pH”。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【pKa±1有效缓冲边界】**：例如 Tris 的 pKa 是 8.06，绝对不能拿 Tris 去配 pH 6.0 的缓冲液（在 pH 6.0 时 99% 的 Tris 都已质子化，滴半滴酸 pH 就会掉到 3.0）。\n- **【Tris温度系数（ΔpKa/ΔT = -0.028/°C）】**：在 25°C 室温下调好 **pH 7.5** 的 Tris-HCl 缓冲液，放进 **4°C 层析冷柜** 后，真实 pH 会自动飙升到 **pH 8.05–8.10**；而放在 37°C 水浴中则会降到 **pH 7.15**。\n- **【钠盐PBS冷冻共晶pH暴跌】**：含 Na₂HPO₄ 的普通 PBS 在慢速冷冻时，碱性磷酸氢二钠先结晶析出，未结冰液相变成 pH 3.6 的强酸环境。",
    "cases": [

        "title": "项目实战案例：4°C 冷柜做离子交换时 Tris 实际 pH 升高 0.5 导致杂蛋白共洗脱",
        "tag": "实验室实战案例",
        "body": "- 某蛋白在 25°C 下摸索 Q 阴离子柱条件（Tris pH 7.8），转入 4°C 冷层析柜放大时未修正 Tris 温度漂移，4°C 下柱内真实 pH 升至 8.35，导致原本在 pH 7.8 不挂柱的宿主杂蛋白也带负电挂上了 Q 柱。改用温度系数极小的 **HEPES（或按 4°C 实测调 Tris pH）** 后恢复高纯度分峰。"

    "title": "有效缓冲范围(pKa±1)与Tris低温(4°C)pH上漂0.5机理",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **有效缓冲范围（pKa±1）** 与 **Tris低温pH上漂机理（-0.028 pH/°C）**，规范配液室室温调 pH 与 4°C 冷柜层析的温度补偿公式。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【有效缓冲范围（pKa±1）】**：\n  - `MES`：pKa 6.15 → 负责 **pH 5.5 – 6.7**；\n  - `PBS`：pKa₂ 7.20 → 负责 **pH 6.8 – 7.8**；\n  - `HEPES`：pKa 7.48 → 负责 **pH 6.8 – 8.2**；\n  - `Tris`：pKa 8.06 → 负责 **pH 7.2 – 9.0**。\n- **【Tris低温pH上漂机理（-0.028 pH/°C）】**：Tris 伯胺去质子化是吸热过程，温度降低时平衡向质子化方向移动（吸走溶液中的 H⁺），导致溶液变碱：\n  pH(4°C) ≈ pH(25°C) + (25 - 4) × 0.028 ≈ pH(25°C) + 0.58\n  - 若希望 Buffer 在 **4°C 冷柜里真实工作在 pH 7.8**，在 25°C 室温配液调 pH 时应调在 **pH 7.25–7.30**；或者直接改用温度系数小一半的 **HEPES（-0.014 pH/°C）** 或 **PBS（-0.0028 pH/°C，几乎不受室温到 4°C 影响）**。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **配液记录必查**：《Buffer 配制台账》必须同时记录 **“配液调定时的液温（°C）”** 与 **“实测 pH 值”**；严禁把刚从高压灭菌锅出来还烫手（50°C）的溶液直接插电极调 pH！",

    "title": "钠盐PBS冷冻共晶pH暴跌至3.6机理与HEPES/钾盐K-PBS稳态方案",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **钠盐PBS（Na₂HPO₄/NaH₂PO₄）冷冻共晶pH暴跌至3.6** 的热力学机理，并用 **HEPES两性离子缓冲体系** 或 **全钾盐K-PBS（K₂HPO₄/KH₂PO₄）** 从源头杜绝冻存酸变性。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【钠盐PBS（Na₂HPO₄/NaH₂PO₄）冷冻共晶pH暴跌至3.6】**：\n  - 室温下 pH 7.4 的 PBS 中，碱性盐 Na₂HPO₄ 与酸性盐 NaH₂PO₄ 比例约为 4:1；\n  - 当放入 −20°C 冰箱慢速结冰时，Na₂HPO₄· 12H₂O 的共晶点极高（−0.5°C）且低温溶解度极低，会率先析出成固体盐晶；\n  - 剩下的未冻微液滴中只剩高溶解度的酸性 NaH₂PO₄，导致蛋白被困在 **pH 3.6–3.8 的浓酸微液滴** 中长达数小时直至完全冻结！\n- **【HEPES两性离子缓冲体系】**：20 mM HEPES (pH 7.4) 在结冰过程中不会发生单组分盐析，冷冻前后 pH 波动 **< 0.3 个单位**。\n- **【全钾盐K-PBS（K₂HPO₄/KH₂PO₄）】**：磷酸氢二钾（K₂HPO₄）在 0°C 以下溶解度远高于钠盐，共晶点接近 −14°C，结冰时酸碱组分同步冻结，**冷冻 pH 偏移 < 0.2 个单位**。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **终原液配方必查**：任何需进入 −20°C / −80°C 冻存的对酸敏感抗原（尤其是含 Zn²⁺ 的 Ro52），终 Buffer 严禁使用无保护剂的纯钠盐 PBS！",
    "cases": [
      {
        "title": "项目实战案例：用溴百里酚蓝（BTB）冷冻变色实验直观展示钠盐 PBS 变酸",
        "tag": "实验室实战案例",
        "body": "- 实验室培训新人时，在两管 pH 7.4 的缓冲液（一管普通钠盐 PBS，一管 20 mM HEPES / K-PBS）中滴入 pH 指示剂溴百里酚蓝（中性呈蓝色，酸性呈亮黄色），放入 −20°C：30 分钟后 **钠盐 PBS 冰柱变成了刺眼的亮黄色（pH < 4.0）**，而 **HEPES 与 K-PBS 冰柱依然保持深蓝色（pH 7.4）**！新人看一眼就终身记住了这条铁律。"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：死守下游偶联与标记工序的 **游离伯胺禁区（NHS反应）**、**游离羧基禁区（EDC反应）** 与 **叠氮钠毒化禁区（HRP酶标）**，确保纯化终原液与下游体外诊断试剂盒工艺无缝衔接。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【游离伯胺禁区（NHS反应）】**：凡分子结构中带有 `-NH₂`（伯胺）或高浓度氮配位的缓冲组分——包括 **Tris、甘氨酸（Glycine）、咪唑（Imidazole）、硫酸铵 `(NH₄)₂SO₄`、赖氨酸、尿素**——都会直接与 `NHS-Biotin` 或 `NHS 活化磁珠` 发生亲核取代反应，把偶联试剂 100% 消耗殆尽！\n- **【游离羧基禁区（EDC反应）】**：凡带有 `-COOH`（羧基）的缓冲盐——如 **醋酸盐（Acetate）、柠檬酸盐（Citrate）**——会被碳二亚胺（EDC）活化成活性酯，反过来把蛋白表面的赖氨酸氨基全部封死（乙酰化/柠檬酰化）！\n- **【叠氮钠毒化禁区（HRP酶标）】**：叠氮化钠（NaN₃）是实验室常用的抑菌防腐剂，但 N₃⁻ 离子会不可逆地配位结合 **辣根过氧化物酶（HRP）** 活性中心的血红素铁离子（Fe³⁺），只要残留 0.01% NaN₃ 就会让 HRP 酶标物彻底失活！",

        "title": "项目实战案例：纯化组与偶联组交接单增设“禁含组分三勾选”",

    "path": "基础知识学习 / ⓪ 实验室 Buffer 化学体系与层析设备工程基石 (Buffer & Column Foundation) / 主缓冲盐对 (Buffer Pairs) 底层化学 / 游离伯胺与羧基配伍禁区 (下游偶联红线) / NHS生物素化/磁珠偶联禁区: 严禁Tris/甘氨酸/咪唑/硫酸铵抢活性酯",
    "title": "NHS生物素化/磁珠偶联禁区: 严禁Tris/甘氨酸/咪唑/硫酸铵抢活性酯",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **NHS活性酯亲核取代机理**，明确为什么 **Tris、甘氨酸、咪唑、硫酸铵** 是 NHS 生物素化与 NHS 磁珠偶联的“头号克星”，以及如何通过 **HEPES/PBS置换** 彻底清除。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【NHS活性酯亲核取代机理】**：`NHS-PEG₄-Biotin` 靠 N-羟基丁二酰亚胺酯（NHS ester）与蛋白表面赖氨酸的未质子化伯胺（R-NH₂，在 pH 7.4–8.0 下反应最快）生成稳定的共价酰胺键。\n- **【Tris、甘氨酸、咪唑、硫酸铵的竞争计算】**：\n  - 假设 1 mg/mL 的 50 kDa 蛋白含有 25 个赖氨酸，其总伯胺浓度仅为 **0.02 mM × 25 = 0.5 mM**；\n  - 而如果你用了 **50 mM Tris-HCl** 作为缓冲液，每一个 Tris 分子（NH₂-C(CH₂OH)₃）都带着一个活泼的游离伯胺（浓度 **50 mM，是蛋白伯胺的 100 倍！**），加入的 NHS-Biotin 会在 1 分钟内被 Tris 抢走 99% 以上！（同理，咪唑环会催化 NHS 酯加速水解失效）。\n- **【HEPES/PBS置换标准】**：进 NHS 偶联前，必须通过 SEC 分子筛、透析（3 次 × 100 倍体积）或超滤（3 次 × 10 倍稀释）将缓冲液彻底置换为 **20 mM HEPES 或 PBS (pH 7.4–7.8), 150 mM NaCl**。",
    "cases": [
      {
        "title": "项目实战案例：用 Tris 终止液反证 Tris 对 NHS-Biotin 的淬灭能力",
        "tag": "实验室实战案例",
        "body": "- 在标准 NHS-Biotin 偶联 SOP 中，30 min 反应结束时的“终止剂（Quencher）”正是加入 **10 mM Tris-HCl (pH 7.5)**！把终止剂直接当成反应缓冲液，自然不可能偶联上任何生物素。"

    "title": "NHS生物素化/磁珠偶联禁区: 严禁Tris/甘氨酸/咪唑/硫酸铵抢活性酯",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **NHS活性酯亲核取代机理**，明确为什么 **Tris、甘氨酸、咪唑、硫酸铵** 是 NHS 生物素化与 NHS 磁珠偶联的“头号克星”，以及如何通过 **HEPES/PBS置换** 彻底清除。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【NHS活性酯亲核取代机理】**：`NHS-PEG₄-Biotin` 靠 N-羟基丁二酰亚胺酯（NHS ester）与蛋白表面赖氨酸的未质子化伯胺（R-NH₂，在 pH 7.4–8.0 下反应最快）生成稳定的共价酰胺键。\n- **【Tris、甘氨酸、咪唑、硫酸铵的竞争计算】**：\n  - 假设 1 mg/mL 的 50 kDa 蛋白含有 25 个赖氨酸，其总伯胺浓度仅为 **0.02 mM × 25 = 0.5 mM**；\n  - 而如果你用了 **50 mM Tris-HCl** 作为缓冲液，每一个 Tris 分子（NH₂-C(CH₂OH)₃）都带着一个活泼的游离伯胺（浓度 **50 mM，是蛋白伯胺的 100 倍！**），加入的 NHS-Biotin 会在 1 分钟内被 Tris 抢走 99% 以上！（同理，咪唑环会催化 NHS 酯加速水解失效）。\n- **【HEPES/PBS置换标准】**：进 NHS 偶联前，必须通过 SEC 分子筛、透析（3 次 × 100 倍体积）或超滤（3 次 × 10 倍稀释）将缓冲液彻底置换为 **20 mM HEPES 或 PBS (pH 7.4–7.8), 150 mM NaCl**。",
    "cases": [
      {
        "title": "项目实战案例：用 Tris 终止液反证 Tris 对 NHS-Biotin 的淬灭能力",
        "tag": "实验室实战案例",
        "body": "- 在标准 NHS-Biotin 偶联 SOP 中，30 min 反应结束时的“终止剂（Quencher）”正是加入 **10 mM Tris-HCl (pH 7.5)**！把终止剂直接当成反应缓冲液，自然不可能偶联上任何生物素。"
      }
    ],

    "title": "EDC羧基胶乳偶联与HRP酶标禁区: 禁醋酸盐/柠檬酸盐及叠氮钠(NaN3)",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握 **EDC/Sulfo-NHS羧基微球活化原理** 与 **HRP血红素催化中心毒化机理**，避开 **醋酸盐/柠檬酸盐（游离羧基）** 及 **叠氮钠（NaN₃）** 禁区。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【EDC/Sulfo-NHS羧基微球活化原理】**：在胶乳免疫比浊或化学发光羧基磁珠偶联中，先用 EDC 在 **pH 5.5–6.5** 下活化微球表面的羧基（`-COOH`），再与抗原蛋白表面的氨基（`-NH₂`）缩合。\n- **【醋酸盐/柠檬酸盐（游离羧基）禁区】**：许多文献用 pH 5.5 醋酸钠或柠檬酸钠缓冲液，但醋酸（CH₃COOH）和柠檬酸本身就是高浓度游离羧基！加入 EDC 后，EDC 会把缓冲液里的醋酸全部活化，反过来把蛋白表面的氨基全部乙酰化封死。**因此 EDC 活化步必须且只能使用不含羧基也不含伯胺的 `20–50 mM MES (pH 6.0)` 缓冲液**！\n- **【叠氮钠（NaN₃）禁区】**：若抗原需用于 ELISA（HRP 体系）或直接做 HRP 酶标偶联，防腐剂严禁用 NaN₃，应改用 **0.05% ProClin 300** 或 **0.22 µm 无菌过滤分装冻存**。",
    "cases": [
      {
        "title": "项目实战案例：胶乳微球 EDC 活化将醋酸钠换成 25 mM MES (pH 6.0) 解决偶联脱落",
        "tag": "实验室实战案例",
        "body": "- 某胶乳比浊项目早期用 pH 5.5 醋酸钠缓冲液做 EDC 一步法偶联，蛋白偶联效率不足 20%；切换为 **25 mM MES (pH 6.0)** 后，蛋白偶联率提升至 93%，加速稳定性合格。"
      }

    "title": "阴阳离子交换反离子匹配法则",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握离子交换层析（IEX）中 **“缓冲盐工作离子与填料同号相斥（不抢位点）”** 的 **阴阳离子交换反离子匹配法则**。\n- **为什么缓冲盐选错会导致柱子出现“鬼峰”和局部 pH 剧变**：如果跑带正电的阴离子柱（Q 柱）时用了带负电的磷酸盐，磷酸根（HPO₄²⁻）就会直接吸附到 Q 柱的正电荷位点上，不仅和蛋白抢位子，还会在盐梯度洗脱时被 Cl⁻ 成片冲下来，造成柱内 pH 剧烈震荡！\n\n[SVG:iex_charge]\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【阴阳离子交换反离子匹配法则】**：\n  - **跑阴离子交换柱（AEX：Q / DEAE，填料带正电 \\oplus）**：\n    - 缓冲盐的工作离子应该 **也带正电（阳离子缓冲体系）**，与填料同性相斥、绝不挂柱！\n    - **首选**：**Tris-HCl（Tris⁺ 带正电，抗衡离子为 Cl⁻）** 或 **Bis-Tris**。\n  - **跑阳离子交换柱（CEX：SP / CM，填料带负电 \\ominus）**：\n    - 缓冲盐的工作离子应该 **也带负电（阴离子缓冲体系）**，与填料同性相斥、绝不挂柱！\n    - **首选**：**MES、HEPES、磷酸钠（H₂PO₄⁻ / HPO₄²⁻）、醋酸钠**（抗衡离子均为 Na⁺）。",
    "cases": [
      {
        "title": "项目实战案例：SP 阳离子柱把 Tris-HCl 换成 MES/HEPES 消除梯度基线漂移",
        "tag": "实验室实战案例",
        "body": "- 跑 HiTrap SP 阳离子柱时曾误用 Tris-HCl 缓冲液，结果在跑 NaCl 梯度时电导率和 pH 曲线出现大幅度台阶漂移；换为 **25 mM MES (pH 6.5)** 后，基线平直如尺，洗脱峰尖锐对称。"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握蛋白纯化 Buffer 中五大核心组分（**主缓冲盐对**、**NaCl背景盐**、**咪唑竞争配体**、**TCEP与DTT还原剂**、**甘油与表面活性剂**）的化学机理、适用浓度区间与配伍禁忌。\n- **为什么要懂每一味药**：配 Buffer 就像开中药方，“君臣佐使”各司其职；随便照搬文献配方而不看下游偶联和蛋白自身结构，极易踩坑。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【主缓冲盐对】**：维持溶液 pH 恒定的基础骨架：\n  - `Tris-HCl`（有效缓冲范围 pH 7.0–9.0）：便宜好用，但 **温度系数极大**（4°C 比 25°C 时 pH 升高约 0.5），且 **含游离伯胺（-NH₂），严禁用于下游 NHS 生物素化或羧基胶乳偶联**！\n  - `PBS 磷酸盐`（pH 6.8–8.0）：生理兼容性最好、不含伯胺，适合终产品存储与偶联；但易与高浓度 Ca²⁺/Mg²⁺/Zn²⁺ 生成磷酸盐沉淀，且 **钠盐 PBS 在 −20°C 慢速冷冻时 pH 会暴跌至 3.8**。\n  - `HEPES`（pH 6.8–8.2）：两性离子缓冲盐，不含伯胺、不沉淀二价金属（适合补 Zn²⁺）、冷冻 pH 偏移小，是高价值诊断抗原最推荐的精纯与偶联缓冲体系。\n  - `MES`（pH 5.5–6.7）：常用于阳离子交换（CEX）微酸性上样缓冲液。\n- **【NaCl背景盐】**：\n  - 亲和层析（Ni-NTA / Amylose）通常加 **300–500 mM NaCl**，作用是打破带电杂蛋白与填料基架的“搭便车”静电吸附，并抑制蛋白自身疏水聚集；\n  - 离子交换（AEX/CEX）上样 Buffer 必须降至 **20–50 mM NaCl**（电导率 < 5 mS/cm），否则高盐离子会抢占填料电荷位点导致目标蛋白挂不上柱。\n- **【咪唑竞争配体】**：咪唑环结构与组氨酸（His）侧链一模一样；低浓度（20–50 mM）用于挤走微弱结合的宿主杂蛋白，高浓度（250–500 mM）用于把 6×His 标签蛋白从 Ni²⁺ 上竞争洗脱下来。注意：**高浓度咪唑呈碱性（未调 pH 的 500 mM 咪唑溶液 pH 高达 9.5–10），配完必须用浓盐酸调回 pH 7.5–8.0**，且洗脱后需尽快脱盐防沉淀！\n- **【TCEP与DTT还原剂】**：防止胞内蛋白表面的游离半胱氨酸（-SH）被空气氧化形成错误的分子间二硫键聚体：\n  - `β-ME（巯基乙醇，5–10 mM）`：挥发臭味大、半衰期短（24 h）；\n  - `DTT（二硫苏糖醇，1–2 mM）`：还原力强，但在空气中 48 h 易氧化失效，且 **> 2 mM DTT 会把 Ni-NTA 柱还原成棕黑色硫化镍/金属镍（Brown column）**；\n  - `TCEP（0.5–1 mM）`：无味、水溶性极好、在宽 pH 下极稳定，且对 Ni-NTA 柱耐受性远优于 DTT（但配制浓缩母液 0.5 M 时呈强酸性，必须先用 NaOH 调至 pH 7.0 再加入 Buffer）。\n- **【甘油与表面活性剂】**：\n  - `5%–10% Glycerol（甘油）`：包裹蛋白表面疏水区，大幅降低低温纯化和超滤浓缩时的聚集沉淀风险（但会略微增大溶液粘度，AKTA 流速需下调 20%）；\n  - `0.01%–0.05% Tween-20 / Triton X-100`：防止蛋白粘附管壁或超滤膜，但高浓度 Triton X-100 有极强 280 nm 紫外吸收，会干扰 A₂₈₀ 浓度测定。\n\n---\n\n## **3. 实验室常用标准 Buffer 速查表**\n| Buffer 名称 | 标准配方（以含 Zn²⁺ 指环蛋白 Ro52 为例） | 核心质控点与禁忌 |\n|---|---|---|\n| **破壁/Ni柱结合液 (Buffer A)** | 25 mM HEPES (或 Tris-HCl) pH 7.5, **500 mM NaCl**, **20 mM 咪唑**, 5% Glycerol, 0.5 mM TCEP, **20 µM ZnCl₂** | 破壁前现加 1 mM PMSF；**严禁加 EDTA** |\n| **Ni柱洗杂液 (Wash Buffer)** | 同 Buffer A，咪唑提升至 **40–60 mM** | 洗至流穿液 Bradford 不变蓝（或 AKTA UV 回基线） |\n| **Ni柱洗脱液 (Buffer B)** | 25 mM HEPES pH 7.5, 300 mM NaCl, **250–300 mM 咪唑**, 5% Glycerol, 0.5 mM TCEP, 20 µM ZnCl₂ | **配完后必测 pH 并调回 7.5**；洗脱后当天换液除咪唑 |\n| **离子交换低盐液 (IEX-A)** | 25 mM HEPES (或 Tris) pH 7.5–8.0, **20–30 mM NaCl**, 5% Glycerol, 0.5 mM TCEP | 电导率控制在 2–4 mS/cm |\n| **离子交换高盐液 (IEX-B)** | 25 mM HEPES (或 Tris) pH 7.5–8.0, **1000 mM NaCl**, 5% Glycerol, 0.5 mM TCEP | 用于 0% → 50% B 线性梯度洗脱 |\n| **终储存/偶联液 (Storage)** | 20 mM HEPES (或钾盐 PBS) pH 7.4, 150 mM NaCl, 0.5 mM TCEP, **20%–50% 甘油（或 5% 海藻糖）** | **绝对不含 Tris、咪唑、甘氨酸、叠氮钠（NaN₃）** |",

        "tag": "实验室实战案例",
        "body": "- **案例 A（咪唑未调 pH）**：实习生配制 500 mM 咪唑洗脱液时漏调 pH（实测 pH 9.8），洗脱下来的 Ro52 在管中放置 1 小时后全部变成白色絮状沉淀。纠正后规定所有含咪唑 Buffer 配制记录必须填入实测 pH 值。\n- **案例 B（Tris 干扰生物素化）**：早期用 50 mM Tris-HCl 作为终存储液，下游做 NHS-Biotin 偶联时，50 mM Tris 的伯胺浓度是蛋白表面赖氨酸的近千倍，把 NHS-Biotin 全部抢光，导致抗原生物素化率为 0。后统一改为 HEPES 或 PBS 体系。"

    "title": "NaCl背景盐与硫酸铵: 300–500mM盐溶防吸附 vs. 1M高盐促疏水挂柱",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握纯化 Buffer 中 **NaCl（氯化钠）** 与 **(NH₄)₂SO₄（硫酸铵）** 在不同工序中的浓度切换逻辑——**300–500 mM NaCl 盐溶防非特异吸附**、**20–50 mM NaCl 低电导率离子交换上样**、**150 mM NaCl 生理等渗保存** 与 **1.0 M 硫酸铵促疏水挂柱**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【300–500 mM NaCl 盐溶防非特异吸附】**：在 **破壁（Lysis）与亲和层析（Ni-NTA / Amylose）** 中，必须维持 300–500 mM 的高浓度 NaCl。原因有二：① 屏蔽大肠杆菌带电杂蛋白和核酸与填料基架的“静电搭便车”；② 提供充足离子强度（Salting-in 盐溶效应），防止高浓度重组蛋白通过表面偶极相互作用自发聚集。\n- **【20–50 mM NaCl 低电导率离子交换上样】**：在 **阴/阳离子交换（AEX/CEX）上样前**，必须把 NaCl 稀释或透析降至 ≤ 30–50 mM（电导率 < 5 mS/cm），否则高浓度的 Na⁺ 和 Cl⁻ 会把离子柱的电荷位点全部占满，蛋白根本挂不上柱。\n- **【1.0 M 硫酸铵促疏水挂柱】**：在 **霍夫迈斯特序列（Hofmeister Series）** 中，SO₄²⁻ 是最强的促水结构盐（Kosmotrope），能剥去蛋白表面的自由水化层，迫使疏水斑块贴到 **疏水柱（HIC Phenyl/Butyl）** 上。",

    "path": "基础知识学习 / ⓪ 实验室 Buffer 化学体系与层析设备工程基石 (Buffer & Column Foundation) / 盐离子、还原剂、金属辅因子与保护剂体系 / 还原剂与二硫键保护: TCEP宽pH长效稳定 vs. DTT(>2mM)还原镍柱变黑禁忌",
    "title": "还原剂与二硫键保护: TCEP宽pH长效稳定 vs. DTT(>2mM)还原镍柱变黑禁忌",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握胞内重组蛋白纯化中三大还原剂——**TCEP**、**DTT（二硫苏糖醇）** 与 **β-ME（巯基乙醇）** 的化学特性对比，熟记 **DTT > 2 mM 还原镍柱变棕黑（Brown Column）** 与 **TCEP 母液强酸性必调中性** 的实操铁律。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【为什么胞内蛋白必须加还原剂】**：人体细胞质（Cytoplasm）是强还原性环境，因此像 Ro52 这类胞内蛋白表面的许多半胱氨酸（Cys）天然处于游离巯基（`-SH`）状态。一旦破壁暴露在充满氧气的空气和缓冲液中，两个分子表面的游离 `-SH` 就会被氧气随机氧化连成错误的 **分子间二硫键（`-S-S-`）**，形成一串串失活的多聚体！\n- **【TCEP vs. DTT vs. β-ME 核心差异】**：\n  - `TCEP (0.5–1.0 mM)`：**强烈推荐首选**！三(2-羧乙基)膦，不含硫原子（不会跟蛋白形成混合二硫键）、无臭味、在空气中半衰期长达数周、在 pH 1.5–9.0 全范围有效，且 **对 Ni-NTA 柱的耐受度远高于 DTT，更不会干扰下游马来酰亚胺或胺偶联**！*唯一注意：直接用水配出的 0.5 M TCEP·HCl 母液 pH 约为 2.5（强酸），必须用 NaOH 调至 pH 7.0 分装 −20°C 保存*。\n  - `DTT (1.0–2.0 mM)`：还原力强，但在 pH 7.5 空气中 **半衰期仅 10–24 小时**（必须当天现配现加），且 **> 2–5 mM DTT 会直接把 Ni-NTA 柱上的 Ni²⁺ 还原成棕黑色的硫化镍/金属镍沉淀**，同时高浓度 DTT 会干扰 BCA 蛋白浓度测定！\n  - `β-ME (5–10 mM)`：单巯基还原力弱、有浓烈刺鼻恶臭且极易挥发失效，仅在粗破壁或 SDS-PAGE 上样液中使用。",
    "cases": [
      {
        "title": "项目实战案例：将纯化全程的 2 mM DTT 替换为 0.5 mM 中性 TCEP",
        "tag": "实验室实战案例",
        "body": "- 早期用 2 mM DTT 过 Ni-NTA 柱，填料每次用完顶部都发黑发褐，且存放 3 天后 DTT 氧化失效导致非还原 SDS-PAGE 出现二聚/四聚交联带；统一换为 **0.5 mM TCEP（由 pH 7.0 的 0.5 M TCEP 母液按 1:1000 加入）** 后，镍柱始终保持翠绿，原液存放 14 天零氧化交联。"
      }

    "title": "金属辅因子与螯合禁区: Zn2+/Ca2+结构补料 vs. EDTA剥离金属失活红线",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握金属依赖型结构域（如 **RING/B-box锌指结构域**、**EF-hand钙结合域**）的 **结构性金属辅因子（Zn²⁺/Ca²⁺）全程补料规则**，并死守 **“金属蛋白与Ni-NTA纯化全程绝对禁用EDTA/EGTA”** 的红线。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【结构性金属辅因子（Zn²⁺/Ca²⁺）全程补料规则】**：\n  - 在 Ro52（TRIM21）中，N 端 RING 结构域（aa 16–55）靠 `Cys3-His-Cys4` 八个配位残基夹着 **2 个 Zn²⁺**，B-box2 结构域（aa 92–123）也夹着 **1–2 个 Zn²⁺**；\n  - 这几个 Zn²⁺ 就像帐篷的中心支柱——一旦丢了锌，整个 N 端三级结构瞬间坍塌露出疏水核心，变成死聚集体！\n  - **补料标准**：在 **发酵诱导培养基中补加 50–100 µM ZnCl₂**，并在 **破壁、Ni-NTA、离子交换及终存储 Buffer 中全程维持 10–20 µM ZnCl₂**（注意：配在 HEPES 或 Tris 中，避免高浓度磷酸盐生成磷酸锌混浊）。\n- **【金属蛋白与Ni-NTA纯化全程绝对禁用EDTA/EGTA】**：\n  - EDTA（乙二胺四乙酸）是六齿强螯合剂，对 Zn²⁺（log K ≈ 16.5）和 Ni²⁺（log K ≈ 18.6）的结合力比蛋白质和 NTA 强百万倍！\n  - 许多通用裂解液配方里写着“加 1 mM EDTA 抑制金属蛋白酶”——如果你照抄加进 Ro52 破壁液里：**第一，它会把 Ro52 肚子里的 Zn²⁺ 全部抠走导致蛋白变性；第二，上 Ni-NTA 柱时它会把柱子上的 Ni²⁺ 洗劫一空（柱子直接变白，蛋白全部流穿）**！",
    "cases": [

        "title": "项目实战案例：禁用含 EDTA 的商用蛋白酶抑制剂 Cocktail，改用 EDTA-Free 配方",

        "body": "- 市售普通蛋白酶抑制剂片剂（Complete Cocktail）默认含 1–5 mM EDTA。实验室采购明确规定：所有重组蛋白项目一律采购 **EDTA-Free（无 EDTA 型）蛋白酶抑制剂** 或单独使用 **1 mM PMSF**，从源头杜绝误加 EDTA 事故。"

    "title": "金属辅因子与螯合禁区: Zn2+/Ca2+结构补料 vs. EDTA剥离金属失活红线",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握金属依赖型结构域（如 **RING/B-box锌指结构域**、**EF-hand钙结合域**）的 **结构性金属辅因子（Zn²⁺/Ca²⁺）全程补料规则**，并死守 **“金属蛋白与Ni-NTA纯化全程绝对禁用EDTA/EGTA”** 的红线。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【结构性金属辅因子（Zn²⁺/Ca²⁺）全程补料规则】**：\n  - 在 Ro52（TRIM21）中，N 端 RING 结构域（aa 16–55）靠 `Cys3-His-Cys4` 八个配位残基夹着 **2 个 Zn²⁺**，B-box2 结构域（aa 92–123）也夹着 **1–2 个 Zn²⁺**；\n  - 这几个 Zn²⁺ 就像帐篷的中心支柱——一旦丢了锌，整个 N 端三级结构瞬间坍塌露出疏水核心，变成死聚集体！\n  - **补料标准**：在 **发酵诱导培养基中补加 50–100 µM ZnCl₂**，并在 **破壁、Ni-NTA、离子交换及终存储 Buffer 中全程维持 10–20 µM ZnCl₂**（注意：配在 HEPES 或 Tris 中，避免高浓度磷酸盐生成磷酸锌混浊）。\n- **【金属蛋白与Ni-NTA纯化全程绝对禁用EDTA/EGTA】**：\n  - EDTA（乙二胺四乙酸）是六齿强螯合剂，对 Zn²⁺（log K ≈ 16.5）和 Ni²⁺（log K ≈ 18.6）的结合力比蛋白质和 NTA 强百万倍！\n  - 许多通用裂解液配方里写着“加 1 mM EDTA 抑制金属蛋白酶”——如果你照抄加进 Ro52 破壁液里：**第一，它会把 Ro52 肚子里的 Zn²⁺ 全部抠走导致蛋白变性；第二，上 Ni-NTA 柱时它会把柱子上的 Ni²⁺ 洗劫一空（柱子直接变白，蛋白全部流穿）**！",
    "cases": [
      {
        "title": "项目实战案例：禁用含 EDTA 的商用蛋白酶抑制剂 Cocktail，改用 EDTA-Free 配方",
        "tag": "实验室实战案例",
        "body": "- 市售普通蛋白酶抑制剂片剂（Complete Cocktail）默认含 1–5 mM EDTA。实验室采购明确规定：所有重组蛋白项目一律采购 **EDTA-Free（无 EDTA 型）蛋白酶抑制剂** 或单独使用 **1 mM PMSF**，从源头杜绝误加 EDTA 事故。"
      }

    "title": "防冻剂与表面活性剂: 甘油/海藻糖防冰晶 vs. Tween-20防管壁与超滤膜吸附",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握纯化与储存 Buffer 中两大保护组分——**甘油（Glycerol）与海藻糖（Trehalose）化学伴侣/防冻剂** 以及 **Tween-20非离子表面活性剂** 的作用机理、最佳浓度与紫外/粘度边界。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【甘油（Glycerol）与海藻糖（Trehalose）化学伴侣/防冻剂】**：\n  - **纯化过程（5%–10% v/v 甘油）**：作为“化学分子伴侣（Chemical Chaperone）”，通过优先水化效应（Preferential Hydration）使蛋白质疏水区若暴露在水中热力学不利，从而像打绷带一样逼着蛋白质保持紧凑的天然折叠态，防止在低温过柱和超滤浓缩时聚沉；\n  - **长期冻存（20%–50% 甘油 或 5%–8% 海藻糖）**：抑制大冰晶生长，保护三级/四级空间构象。\n- **【Tween-20非离子表面活性剂】**：\n  - 高纯度蛋白在低浓度（< 0.2 mg/mL）或超滤换液时，极易通过疏水作用贴在聚丙烯离心管壁、枪头和超滤膜上（损失可达 20%–40%）；\n  - 加入极微量的 **0.005%–0.02% Tween-20（吐温-20）** 即可优先封闭塑料管壁与气-液界面，防止界面剪切变性，且 **Tween-20 无苯环，不干扰 280 nm 紫外浓度测定**（相反，**Triton X-100 / NP-40 含有芳香苯环，在 280 nm 有极强紫外吸收**，精纯后 Buffer 严禁加 Triton X-100！）。",
    "cases": [
      {
        "title": "项目实战案例：纯化全程加 5% 甘油将 Ro52 超滤浓缩极限从 0.8 mg/mL 提升至 3.5 mg/mL",
        "tag": "实验室实战案例",
        "body": "- 不加甘油时，Ro52 超滤浓缩一旦超过 0.8 mg/mL 就开始出现肉眼可见蛋白丝；在纯化全程 Buffer 中固定添加 **5% (v/v) 超纯甘油** 后，浓缩至 3.5 mg/mL 依然清澈如水、SEC 单分散性 > 94%。"
      }

    "path": "基础知识学习 / ⓪ 实验室 Buffer 化学体系与层析设备工程基石 (Buffer & Column Foundation) / 手工柱(重力柱/蠕动泵)与全自动AKTA设备操作SOP",
    "title": "手工柱(重力柱/蠕动泵)与全自动AKTA设备操作SOP",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：针对本实验室 **“手工柱（重力柱/注射器预装柱/蠕动泵）+ 一套全自动 AKTA 层析仪”** 的主力配置，建立从 **手工柱湿法装柱**、**重力与蠕动泵流速控制**、**Bradford点滴显色追踪** 到 **AKTA管路排气与压力保护** 的标准化实操规范。\n- **为什么手工柱和自动柱都要精通**：\n  - **手工柱（重力柱 / 蠕动泵）**：零死体积等待、可同时并行跑 4–8 个样品、操作极其灵活，是小试筛选、亲和捕获（Ni-NTA / Amylose）和反向挂柱的主力；\n  - **全自动层析仪（AKTA）**：具备精准的双泵线性盐梯度和实时 UV₂₈₀/UV₂₅₄/电导率曲线，是离子交换（AEX/CEX）精细分峰和 SEC 分子筛去聚集的唯一选择。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【手工柱湿法装柱】**：将储存于 20% 乙醇中的填料摇匀成 50% 匀浆（Slurry），沿倾斜的空柱管内壁一次性连续倒入，让填料在重力下自然沉降压实并装上顶筛板的过程。\n- **【重力与蠕动泵流速控制】**：\n  - 重力柱靠液面高度差自然滴落（正常滴速约 **1 滴 / 2–3 秒**，对应 1–1.5 mL/min）；\n  - 预装柱（如 5 mL HisTrap/HiTrap）接蠕动泵或注射器推注时，必须严格控制流速（5 mL 柱 ≤ 2–3 mL/min；1 mL 柱 ≤ 1 mL/min），**严禁大力猛推注射器**（瞬间高压会压碎琼脂糖微球并把蛋白直接冲穿）。\n- **【Bradford点滴显色追踪】**：手工柱没有在线 UV 监测器，洗杂和洗脱时在 96 孔板或 PCR 管盖上滴加 20 µL 考马斯亮蓝 G-250 染液 + 2 µL 流出液：一旦变蓝说明有蛋白出来；洗杂必须洗到完全不变蓝（棕红色），洗脱收集到不再变蓝为止。\n- **【AKTA管路排气与压力保护】**：AKTA 开机必须先做 A/B 泵 `Pump Wash` 和进样阀冲洗，防止气泡进入柱头（气泡进柱不仅会形成乱峰，还会直接废掉一根上万元的 Superdex 分子筛柱！）；并必须设置 `Pre-column Pressure Limit`（硬件压限）。\n\n---\n\n## **3. 手工柱 vs. 全自动 AKTA 标准操作 SOP**\n\n### **A. 手工重力柱装柱与过柱 6 步法（实验室日常最高频）**\n1. **润洗底筛板排气**：取空层析柱垂直固定在铁架台上，先注入 2 mL 纯水或 20% 乙醇浸润底筛板，打开底帽放出几滴液体，**确保底筛板下方无残留气泡**，然后关紧底帽，保留柱底部约 0.5 cm 液封。\n2. **填料重悬与一次性倾倒**：将 Ni-NTA 或 Amylose 填料瓶轻轻颠倒摇匀成均匀悬液（**严禁剧烈涡旋振荡打碎微球**！假设装 2 mL 柱床体积 CV，需吸取 4 mL 50% 匀浆）。用剪掉尖头的宽口枪头吸取匀浆，**沿柱管内壁倾斜一次性连续滑入**，切忌分次滴加产生分层和气泡。\n3. **重力沉降与压装顶筛板**：静置 5–10 min 待填料自然沉降出清晰界面后，打开底帽让乙醇缓慢流下（**液面绝不能低于填料顶面！**）。用润湿过的上筛板斜向推入柱管（避免封住空气），轻轻压至贴合填料顶面（上方既不留空隙，也不把填料死死压扁）。\n4. **去乙醇与平衡（Equilibration）**：先加 **5 CV 去离子水** 洗去 20% 乙醇（若直接上高盐 Buffer，高盐在乙醇中会析出晶体堵死筛板！），再加 **5–10 CV 结合液（Buffer A）** 平衡柱床。\n5. **低温慢速上样（Loading）**：将 0.22 µm 过滤后的裂解上清沿柱壁缓慢加入（或把填料倒入上清在 4°C 旋转混匀仪上孵育 30–45 min 后再倒回柱管沉降，结合效率最高）。收集流穿液（FT），必要时将 FT 复上样 1 次。\n6. **洗杂与分管洗脱（Wash & Elution）**：\n   - 加 **10–15 CV 洗杂液（Wash Buffer）**，在 96 孔板中用 **Bradford 染液点滴监测**，直至流出液完全不显蓝色；\n   - 换 **洗脱液（Elution Buffer）**，按 **每管 0.5–1 CV** 分管收集（E1, E2, E3, E4, E5），用 Bradford 找出蓝度最深的核心高浓度管合并，避免把首尾极稀的管混入导致总体积过大。\n\n### **B. 蠕动泵 / 注射器连接预装柱（1 mL / 5 mL 柱）防气泡要点**\n- **Drop-to-Drop（滴对滴连接）**：将预装柱接上蠕动泵管路或注射器鲁尔接头前，必须先让管路出口滴出液体，在柱头凹槽滴满液滴，**“液滴对液滴”旋紧接头**，严禁把整段空气推进预装柱！\n- **流速标定**：用蠕动泵过柱前，先用量筒和秒表实测 1 min 出液量，校准转速对应流速（1 mL 柱控制在 1 mL/min；5 mL 柱控制在 2.5–3 mL/min）。\n\n### **C. 全自动 AKTA 纯化仪上机 5 条铁律**\n1. **所有液体必须过 0.22 µm 膜并超声脱气 15 min**，样品上机前必须 **12,000 × g 离心 10 min**（或过 0.22 µm 针头滤器）。\n2. **开机先排空再接柱**：先跑 `System Wash / Pump Wash` 排尽 A/B 泵头和上样环（Sample Loop）气泡，**在 `Load` 状态下用缓冲液润洗上样环**，并以 `Drop-to-Drop` 方式在低流速（0.2 mL/min）下接上层析柱。\n3. **必须根据柱型号设死报警上限压力（Pre-column Pressure）**：\n   - `HisTrap / HiTrap Q / SP (5 mL)`：耐压上限 **0.3–0.5 MPa**，推荐流速 2–4 mL/min；\n   - `Superdex 200 Increase 10/300 GL`：耐压上限 **3.0 MPa**，推荐流速 **0.5 mL/min**（若缓冲液含 5%–10% 甘油，流速降至 **0.35–0.4 mL/min**）。\n4. **实时盯紧三条曲线**：\n   - `UV 280 nm`（蓝线）：代表蛋白质浓度；\n   - `UV 254 / 260 nm`（红线）：若 260 nm 曲线高于 280 nm 曲线，说明洗出来的是 **核酸污染或游离咪唑本底**，而非纯蛋白！\n   - `Cond 电导率`（棕线）：检验 A/B 泵盐梯度是否平滑、柱子是否真正平衡到位。\n5. **关机收尾**：实验结束必须依次用 **纯水冲洗系统管路 → 20% 乙醇充满泵头与紫外流通池**，严禁让含盐 Buffer 在 AKTA 钛合金/PEEK 管路和单向阀内过夜结晶！",
    "cases": [
      {
        "title": "项目实战案例：手工柱 Bradford 分管收集 vs. 整管盲接",
        "tag": "实验室实战案例",
        "body": "- 过去操作人员在 5 mL Ni-NTA 重力柱洗脱时直接拿一个 15 mL 离心管接 15 mL 洗脱液，导致蛋白浓度只有 0.3 mg/mL，后续超滤浓缩耗时 2 小时且损失 25%。\n- 改为 **“每管 1.5 mL 分管收集 (E1–E8) + 96 孔板 Bradford 点滴显色”** 后，发现 90% 的目标蛋白集中在 E2、E3、E4 三管（共 4.5 mL，浓度直接达到 1.4 mg/mL），无需长时间超滤即可直接进下一步分子筛！"
      }

    "title": "手工柱(重力柱/蠕动泵)与全自动AKTA设备操作SOP",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：针对本实验室 **“手工柱（重力柱/注射器预装柱/蠕动泵）+ 一套全自动 AKTA 层析仪”** 的主力配置，建立从 **手工柱湿法装柱**、**重力与蠕动泵流速控制**、**Bradford点滴显色追踪** 到 **AKTA管路排气与压力保护** 的标准化实操规范。\n- **为什么手工柱和自动柱都要精通**：\n  - **手工柱（重力柱 / 蠕动泵）**：零死体积等待、可同时并行跑 4–8 个样品、操作极其灵活，是小试筛选、亲和捕获（Ni-NTA / Amylose）和反向挂柱的主力；\n  - **全自动层析仪（AKTA）**：具备精准的双泵线性盐梯度和实时 UV₂₈₀/UV₂₅₄/电导率曲线，是离子交换（AEX/CEX）精细分峰和 SEC 分子筛去聚集的唯一选择。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【手工柱湿法装柱】**：将储存于 20% 乙醇中的填料摇匀成 50% 匀浆（Slurry），沿倾斜的空柱管内壁一次性连续倒入，让填料在重力下自然沉降压实并装上顶筛板的过程。\n- **【重力与蠕动泵流速控制】**：\n  - 重力柱靠液面高度差自然滴落（正常滴速约 **1 滴 / 2–3 秒**，对应 1–1.5 mL/min）；\n  - 预装柱（如 5 mL HisTrap/HiTrap）接蠕动泵或注射器推注时，必须严格控制流速（5 mL 柱 ≤ 2–3 mL/min；1 mL 柱 ≤ 1 mL/min），**严禁大力猛推注射器**（瞬间高压会压碎琼脂糖微球并把蛋白直接冲穿）。\n- **【Bradford点滴显色追踪】**：手工柱没有在线 UV 监测器，洗杂和洗脱时在 96 孔板或 PCR 管盖上滴加 20 µL 考马斯亮蓝 G-250 染液 + 2 µL 流出液：一旦变蓝说明有蛋白出来；洗杂必须洗到完全不变蓝（棕红色），洗脱收集到不再变蓝为止。\n- **【AKTA管路排气与压力保护】**：AKTA 开机必须先做 A/B 泵 `Pump Wash` 和进样阀冲洗，防止气泡进入柱头（气泡进柱不仅会形成乱峰，还会直接废掉一根上万元的 Superdex 分子筛柱！）；并必须设置 `Pre-column Pressure Limit`（硬件压限）。\n\n---\n\n## **3. 手工柱 vs. 全自动 AKTA 标准操作 SOP**\n\n### **A. 手工重力柱装柱与过柱 6 步法（实验室日常最高频）**\n1. **润洗底筛板排气**：取空层析柱垂直固定在铁架台上，先注入 2 mL 纯水或 20% 乙醇浸润底筛板，打开底帽放出几滴液体，**确保底筛板下方无残留气泡**，然后关紧底帽，保留柱底部约 0.5 cm 液封。\n2. **填料重悬与一次性倾倒**：将 Ni-NTA 或 Amylose 填料瓶轻轻颠倒摇匀成均匀悬液（**严禁剧烈涡旋振荡打碎微球**！假设装 2 mL 柱床体积 CV，需吸取 4 mL 50% 匀浆）。用剪掉尖头的宽口枪头吸取匀浆，**沿柱管内壁倾斜一次性连续滑入**，切忌分次滴加产生分层和气泡。\n3. **重力沉降与压装顶筛板**：静置 5–10 min 待填料自然沉降出清晰界面后，打开底帽让乙醇缓慢流下（**液面绝不能低于填料顶面！**）。用润湿过的上筛板斜向推入柱管（避免封住空气），轻轻压至贴合填料顶面（上方既不留空隙，也不把填料死死压扁）。\n4. **去乙醇与平衡（Equilibration）**：先加 **5 CV 去离子水** 洗去 20% 乙醇（若直接上高盐 Buffer，高盐在乙醇中会析出晶体堵死筛板！），再加 **5–10 CV 结合液（Buffer A）** 平衡柱床。\n5. **低温慢速上样（Loading）**：将 0.22 µm 过滤后的裂解上清沿柱壁缓慢加入（或把填料倒入上清在 4°C 旋转混匀仪上孵育 30–45 min 后再倒回柱管沉降，结合效率最高）。收集流穿液（FT），必要时将 FT 复上样 1 次。\n6. **洗杂与分管洗脱（Wash & Elution）**：\n   - 加 **10–15 CV 洗杂液（Wash Buffer）**，在 96 孔板中用 **Bradford 染液点滴监测**，直至流出液完全不显蓝色；\n   - 换 **洗脱液（Elution Buffer）**，按 **每管 0.5–1 CV** 分管收集（E1, E2, E3, E4, E5），用 Bradford 找出蓝度最深的核心高浓度管合并，避免把首尾极稀的管混入导致总体积过大。\n\n### **B. 蠕动泵 / 注射器连接预装柱（1 mL / 5 mL 柱）防气泡要点**\n- **Drop-to-Drop（滴对滴连接）**：将预装柱接上蠕动泵管路或注射器鲁尔接头前，必须先让管路出口滴出液体，在柱头凹槽滴满液滴，**“液滴对液滴”旋紧接头**，严禁把整段空气推进预装柱！\n- **流速标定**：用蠕动泵过柱前，先用量筒和秒表实测 1 min 出液量，校准转速对应流速（1 mL 柱控制在 1 mL/min；5 mL 柱控制在 2.5–3 mL/min）。\n\n### **C. 全自动 AKTA 纯化仪上机 5 条铁律**\n1. **所有液体必须过 0.22 µm 膜并超声脱气 15 min**，样品上机前必须 **12,000 × g 离心 10 min**（或过 0.22 µm 针头滤器）。\n2. **开机先排空再接柱**：先跑 `System Wash / Pump Wash` 排尽 A/B 泵头和上样环（Sample Loop）气泡，**在 `Load` 状态下用缓冲液润洗上样环**，并以 `Drop-to-Drop` 方式在低流速（0.2 mL/min）下接上层析柱。\n3. **必须根据柱型号设死报警上限压力（Pre-column Pressure）**：\n   - `HisTrap / HiTrap Q / SP (5 mL)`：耐压上限 **0.3–0.5 MPa**，推荐流速 2–4 mL/min；\n   - `Superdex 200 Increase 10/300 GL`：耐压上限 **3.0 MPa**，推荐流速 **0.5 mL/min**（若缓冲液含 5%–10% 甘油，流速降至 **0.35–0.4 mL/min**）。\n4. **实时盯紧三条曲线**：\n   - `UV 280 nm`（蓝线）：代表蛋白质浓度；\n   - `UV 254 / 260 nm`（红线）：若 260 nm 曲线高于 280 nm 曲线，说明洗出来的是 **核酸污染或游离咪唑本底**，而非纯蛋白！\n   - `Cond 电导率`（棕线）：检验 A/B 泵盐梯度是否平滑、柱子是否真正平衡到位。\n5. **关机收尾**：实验结束必须依次用 **纯水冲洗系统管路 → 20% 乙醇充满泵头与紫外流通池**，严禁让含盐 Buffer 在 AKTA 钛合金/PEEK 管路和单向阀内过夜结晶！",
    "cases": [
      {
        "title": "项目实战案例：手工柱 Bradford 分管收集 vs. 整管盲接",
        "tag": "实验室实战案例",
        "body": "- 过去操作人员在 5 mL Ni-NTA 重力柱洗脱时直接拿一个 15 mL 离心管接 15 mL 洗脱液，导致蛋白浓度只有 0.3 mg/mL，后续超滤浓缩耗时 2 小时且损失 25%。\n- 改为 **“每管 1.5 mL 分管收集 (E1–E8) + 96 孔板 Bradford 点滴显色”** 后，发现 90% 的目标蛋白集中在 E2、E3、E4 三管（共 4.5 mL，浓度直接达到 1.4 mg/mL），无需长时间超滤即可直接进下一步分子筛！"
      }

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握手工空柱管装填散装填料（Ni-NTA / Amylose / Q / SP Sepharose）的 **湿法装柱6步法**，做到 **底筛板零气泡、柱床无断层纹、顶筛板水平贴合**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【底筛板润洗排气】**：空柱管底部的多孔聚乙烯筛板（Frit）如果干着直接倒填料，筛板微孔里藏着的空气泡会堵死 70% 的过流面积，或者在过柱中途向上冒穿整个柱床形成大裂缝（沟流 Channeling）。必须先加 2 mL 20% 乙醇或纯水，打开底帽放掉几滴液体排尽底筛板空气，再关上底帽留 0.5 cm 液封。\n- **【50%匀浆连续斜倒】**：商业填料瓶中通常是“一半沉降填料 + 一半 20% 乙醇保存液”（即 50% Slurry 匀浆）。要装 **2 mL 柱床体积（1 CV = 2 mL）**，就必须温和颠倒混匀后吸取 **4 mL 匀浆**，沿着倾斜 30° 的柱管内壁 **一次性连续滑入**（严禁分两次倒，分次倒会在两次沉降交界处形成细微泥沙分层，严重阻碍流速！）。\n- **【压装顶筛板】**：待填料自然沉降出清晰水平顶面后，放液至液面距填料顶面约 1 cm，将预先在纯水中浸湿排气的上筛板 **斜着推入柱管**（让气泡从斜上方逃逸），再用推杆垂直轻推至 **刚好贴合填料顶面**（严禁大力把琼脂糖微球压瘪！）。",

    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：掌握手工重力柱过柱过程中的 **防干柱液封控制** 与 **96孔板Bradford考染点滴显色追踪法**，让手工柱拥有媲美紫外检测器（UV₂₈₀）的洗杂终点判定与洗脱高峰精准切管能力！\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【防干柱液封控制】**：重力柱在平衡、上样、洗杂、洗脱的任何时刻，**必须在液面即将降到顶筛板上方 1–2 mm 时及时补液或盖上底帽**！一旦液面掉进填料层内部（干柱），空气钻入微球缝隙，后续加进去的洗脱液只会顺着裂缝短路流走，两边干区里的蛋白再也洗不下来。\n- **【96孔板Bradford考染点滴显色追踪法】**：\n  1. 在一块干净的 96 孔透明酶标板（或白瓷点滴板/PCR 排管盖）中，每孔预先滴加 **30 µL 考马斯亮蓝 G-250（Bradford 染液，本底为棕红色）**；\n  2. **洗杂终点判定**：当洗杂液（Wash Buffer）放到第 8 CV、第 10 CV、第 12 CV 时，各接 **3 µL 流出液** 滴入 Bradford 孔中——若变蓝说明还有杂蛋白正在洗出，必须继续补加洗杂液，**一直洗到滴入后完全保持棕红色（零变蓝）为止**！\n  3. **洗脱分管切峰**：换洗脱液（Elution Buffer）后，准备 6–8 支 1.5 mL EP 管（编号 E1–E8），**每管只接 0.5–1.0 CV**（例如 2 mL 柱每管接 1.2 mL）；每接满一管，取 **2 µL** 滴入对应 Bradford 孔中：\n     - 通常 E1 刚置换柱死体积（不变蓝或微蓝）；\n     - **E2、E3、E4 瞬间变成深邃的宝蓝色**（核心高浓度主峰！）；\n     - E5、E6 转为浅蓝，E7 恢复棕红（洗脱完全结束）；\n     - **只合并 E2–E4（或 E2–E5）高浓度管**，无需漫长超滤就能直接拿到 > 1.5 mg/mL 的高浓纯蛋白！",
    "cases": [
      {
        "title": "项目实战案例：Bradford 点滴法发现“固定洗 5 CV 洗杂液”根本没洗干净",
        "tag": "实验室实战案例",
        "body": "- 某次大体积菌液上样后，按老习惯洗了 5 CV 洗杂液准备洗脱，用 96 孔板 Bradford 一点发现第 5 CV 流出液依然呈明显蓝色！继续追加洗到第 12 CV 才彻底变为棕红色。后续 SDS-PAGE 证实此举洗掉了近 4 mg 弱结合宿主杂蛋白，使洗脱纯度从 72% 提升至 91%。"
      }

    "title": "Drop-to-Drop(滴对滴)无气泡连接与蠕动泵量筒秒表流速标定",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心目标**：严格执行预装柱连接的 **Drop-to-Drop（滴对滴）防气泡手法**、**蠕动泵量筒秒表流速标定** 以及 **注射器手推严禁猛推铁律**。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【Drop-to-Drop（滴对滴）防气泡手法】**：商用预装柱（如 Cytiva HisTrap / HiTrap）是全封闭不透明或半透明柱管，一旦把管路里的空气推进柱头筛板，气泡就卡在柱头再也排不出来！正确连接动作：\n  1. 先开动蠕动泵（或轻推注射器），让缓冲液从管路接头尖端持续滴出；\n  2. 拧开预装柱顶盖，在柱头入口凹槽里滴满缓冲液至鼓起半圆形液珠；\n  3. **让管路尖端悬着的液滴与柱头鼓起的液珠先碰在一起融合成一滴（挤走所有空气），再顺势旋紧鲁尔/螺纹接头**，最后才拧开柱底堵头（记住口诀：**“先开顶、液对液接好、最后开底堵头；拆柱时先封底堵头、再拆顶接头”**，防止虹吸抽干柱子！）。\n- **【蠕动泵量筒秒表流速标定】**：蠕动泵软管用久了会弹性疲劳变扁，屏幕上显示的转速（rpm）不等于真实流速！每次上贵重预装柱前，先拿 10 mL 量筒和手机秒表接 60 秒纯水，确认 **1 mL 预装柱流速 = 0.8–1.0 mL/min，5 mL 预装柱流速 = 2.5–3.5 mL/min**。\n- **【注射器手推严禁猛推铁律】**：用注射器推 1 mL / 5 mL 预装柱时，必须看着秒表保持 **每秒只滴落 1–2 滴** 的均匀慢速！如果用大拇指死命猛推（5 秒推完 5 mL），瞬时压力高达 1.5 MPa（超过琼脂糖微球耐压极限 0.3 MPa 的 5 倍），会直接把微球压扁塌陷成死饼，且蛋白来不及结合就全部流穿！",
    "cases": [
      {
        "title": "项目实战案例：纠正“先拔底堵头导致预装柱虹吸进气泡”的操作细节",

        "body": "- 规范预装柱拆卸顺序：每次停泵换液或收柱封存时，必须 **先拧上柱底部堵头（Stop Plug），再拧上顶部堵头**，彻底杜绝了因重力虹吸把空气从柱头吸进填料层的事故。"
      }
