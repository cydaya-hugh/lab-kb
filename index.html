    "note": "## **1. 整体定义**\n- **核心目标**：在花钱合成基因、进实验室动手之前，先通过数据库、文献、专利和客户需求，弄清 ==「做哪个分子、怎么切、用什么宿主和标签、最大风险在哪、怎么算合格」==。\n- **管理意义**：这是研发成本最低、但决定生死的一步。起点选错（如漏看自聚区或非特异结合区），后面几个月的表达和纯化都会在错误路线上返工。\n\n---\n\n## **2. 核心调研逻辑（两大动作）**\n1. **【靶点与结构特征分析】**（摸清分子脾气）：\n   - **锁序列**：从 UniProt 锁定唯一标准序列与版本号（防坐标错位）。\n   - **看结构**：评估一至四级结构域边界、疏水自聚区、金属结合位点（防乱切降解、防包涵体）。\n   - **看修饰**：评估自身抗体是否依赖糖基化/二硫键（决定能不能用低成本大肠杆菌）。\n2. **【文献与策略锚定】**（站在前人肩膀上）：\n   - **查顶刊与公开 SOP**：建立证据矩阵，区分「文献事实」与「待验证假设」。\n   - **定防聚与标签方案**：针对难溶蛋白提前规划「助溶大标签（MBP/SUMO）+ 酶切位点（TEV）+ 低温慢速诱导」。\n\n---\n\n## **3. Gate R1 审核抓手（管理者必问）**\n> **不过关红线**：未明确客户检测平台（直接包被 vs. 生物素捕获）、未锁定基准序列版本、或把文献结果直接当成已验证工艺时，严禁直接进入全量合成与生产。",
    "cases": [
      {
        "title": "Ro52 (TRIM21) 前沿调研全景推演",
        "tag": "实战案例",
        "body": "## **1. 靶点底牌（摸清脾气）**\n- **基准序列**：UniProt `P19474`（Version 1），全长 ==475 aa==（约 54.2 kDa），天然无糖基化，可用大肠杆菌表达。\n- **两大结构隐患**：\n  1. **【包涵体隐患】**：中间 `Coiled-Coil 卷曲螺旋区（128–238 aa）` 既是核心免疫优势区，又极易疏水自聚，裸蛋白原核表达 >90% 进包涵体。\n  2. **【假阳性隐患】**：C 端 `PRY/SPRY 域（268–475 aa）` 天然结合人 IgG 的 Fc 段，在血清学检测中易产生非特异背景。\n\n---\n\n## **2. 锚定策略（立项路线）**\n- **平行对比路线**：以 **路线 A（全长 1–475 aa）** 为基准参照，平行开发 **路线 B（125–268 aa 核心表位截短体，切掉 C 端 Fc 结合域）**。\n- **保溶方案**：采用 `N端 6xHis-MBP-TEV` 助溶标签 + `Rosetta(DE3)` 16°C 低温诱导（全长补加 $50\\ \\mu\\text{M ZnCl}_2$ 稳定 N 端锌指）。"
      }
    ],
    "updatedAt": "2026-11-18T12:18:00.000Z"
  },

    "path": "基础知识学习 / State-of-the-Art前沿调研 / 靶点与结构特征分析 / 氨基酸序列获取: UniProt数据库标准序列",
    "title": "氨基酸序列获取: UniProt数据库标准序列",
    "note": "## **1. 概述（整体定义与目的）**\n- **核心原则**：任何重组蛋白项目的起点，都是锁定**唯一的、受控的氨基酸基准序列（Canonical Sequence）**及其异构体（Isoforms）。\n- **为什么要锁死**：必须从 `UniProt` 获取带明确**登录号（Accession）**和**序列版本号（Sequence Version）**的标准序列，避免团队内部误用截短体、突变体或不同物种序列，导致后续 ==引物设计、质粒构建和表位坐标全部错位==。\n\n---\n\n## **2. 核心概念定义（白话词典）**\n- **【UniProt】**：全球最权威的蛋白质序列与功能数据库（相当于蛋白质界的“国家标准户籍库”），网址为 `uniprot.org`。\n- **【氨基酸基准序列（Canonical Sequence）】**：同一个基因在数据库里被指定为“默认主代表”的那条全长标准氨基酸序列（通常是最常见、最完整的功能形式，编号为 `-1`）。所有结构域和表位的坐标（如第几到第几号氨基酸）都以它为唯一标尺。\n- **【异构体（Isoforms）】**：同一个基因由于 mRNA 选择性剪接（切掉了某段外显子）或不同起始位点，翻译出来的“同胞兄弟蛋白”。名字很像但长度和结构不同（如 `Ro52α` 与 `Ro52β`）。\n- **【登录号与序列版本（Accession & Version）】**：蛋白质在 UniProt 中的唯一身份证号（如 `P19474`）及序列修订版次（如 `Version 1`）。**只写蛋白名字不写登录号，等于没有受控标准**。\n\n---\n\n## **3. Gate 审核抓手（怎么检查）**\n> **立项必查**：立项书与序列设计文件上是否明确写出了 **UniProt 登录号 + 序列版本号 + 起止氨基酸坐标（如 `P19474, v1, 1–475 aa`）**？没写一律退回补齐。",
    "cases": [
      {
        "title": "Ro52 案例：UniProt 标准序列锁定与异构体防错",
        "tag": "实战案例",
        "body": "## **1. 标准序列锁定**\n- **靶点名称**：人源 Ro52（基因名 `TRIM21`）\n- **UniProt 登录号**：==`P19474`==（条目名：`RO52_HUMAN`，Sequence Version 1）\n- **基准规格**：全长共 **475 个氨基酸（1–475 aa）**，理论分子量约 **54.2 kDa**。\n\n---\n\n## **2. 防错要点（Ro52α vs. Ro52β）**\n- **常见踩坑点**：文献中常同时出现 `Ro52α`（全长 475 aa，即 `P19474-1`）和缺少中间第 4 外显子（缺失部分卷曲螺旋核心表位区）的剪接异构体 `Ro52β`。\n- **坐标错位风险**：如果不锁死基准序列，不同文献或不同研发人员说的“第 125–268 位”或“p200 肽段（200–239 aa）”就会对不上号。\n\n---\n\n> **立项受控写法**：在立项书与 LabOS 中必须写死 —— **「基准序列：基于 UniProt `P19474` (Version 1, 1–475 aa)」**，以此作为全长参照及后续 `125–268 aa` 截短体设计的唯一坐标尺子。"
      }

if(window.LABKB_SYNC_DATA&&typeof window.LABKB_SYNC_DATA==="object"){
  let changed=false;
  Object.keys(window.LABKB_SYNC_DATA).forEach(k=>{
    const incoming=window.LABKB_SYNC_DATA[k];
    if(!incoming||typeof incoming!=="object")return;
    const existing=store[k];
    if(!existing||(incoming.updatedAt&&(!existing.updatedAt||incoming.updatedAt>existing.updatedAt))){
      store[k]=incoming;
      changed=true;
    }
  });

    try{localStorage.setItem(STORE_KEY,JSON.stringify(store))}catch(e){}
  }
}

function ancestors(n){const a=[];for(let p=n._par;p;p=p._par)a.unshift(p);return a}
function nodePathKey(n){
  const tabId=n._k.split(".")[0];
  return tabId+"::"+[...ancestors(n).map(p=>p.t),n.t].join("/");
}
function getEntry(n){
  if(!n)return {note:"",cases:[]};
  const pk=nodePathKey(n);
  const raw=store[n._k]||store[pk];
  if(!raw)return {note:"",cases:[]};
  return {
    note:typeof raw.note==="string"?raw.note:"",
    cases:Array.isArray(raw.cases)?raw.cases.map(c=>({title:c.title||"",tag:c.tag||"",body:c.body||""})):[]
  };
}
function hasNote(n){
  const e=getEntry(n);
  return e.note.trim().length>0;
}
function validCases(e){
  return (e.cases||[]).filter(c=>(c.title&&c.title.trim())||(c.tag&&c.tag.trim())||(c.body&&c.body.trim()));
}
function caseCount(n){
  return validCases(getEntry(n)).length;
}
function setEntry(n,entry){
  if(!n)return;
  const pk=nodePathKey(n);
  const cleanCases=(entry.cases||[]).map(c=>({title:c.title||"",tag:c.tag||"",body:c.body||""}));
  const hasAny=(entry.note&&entry.note.trim())||cleanCases.some(c=>c.title.trim()||c.tag.trim()||c.body.trim());
  if(hasAny){
    const rec={
      key:n._k,
      path:[...ancestors(n).map(p=>p.t),n.t].join(" / "),
      title:n.t,
      note:entry.note||"",
      cases:cleanCases,
      updatedAt:new Date().toISOString()
    };
    store[n._k]=rec;
    store[pk]=rec;
  }else{
    delete store[n._k];
    delete store[pk];
  }
  try{
    localStorage.setItem(STORE_KEY,JSON.stringify(store));
    const now=new Date();
    const ts=[now.getHours(),now.getMinutes(),now.getSeconds()].map(x=>String(x).padStart(2,"0")).join(":");
    $("nb-save-state").textContent="已保存 "+ts;
    $("nb-save-state").classList.add("saved");
  }catch(e){
    $("nb-save-state").textContent="保存失败（存储空间不足）";
    $("nb-save-state").classList.remove("saved");
  }
  scheduleServerSync();
  updateBadges();
  updateNodeBadgeInMap(n);
}

/* 增强版 Markdown 渲染（支持加粗标题、--- 分行线、==高亮==、【标签】、冒号前自动加粗） */
function renderMarkdown(md){
  if(!md||!md.trim())return '<p class="nb-empty">暂无内容，点击右上角「返回编辑」开始编写。</p>';
  const lines=md.replace(/\r\n/g,"\n").split("\n");
  const out=[];
  let i=0;
  function inlineFmt(s){
    let t=esc(s);
    t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
    t=t.replace(/==(.+?)==/g,"<mark>$1</mark>");
    t=t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
    t=t.replace(/\*(.+?)\*/g,"<em>$1</em>");
    t=t.replace(/【([^】]+)】/g,'<span class="nb-tag-chip">$1</span>');
    // 行首「关键词：」若未加粗则自动加粗冒号前短词
    t=t.replace(/^([A-Za-z0-9\u4e00-\u9fa5（）()／/·\-]{2,14})([：:])/,"<strong>$1$2</strong>");
    return t;
  }
  while(i<lines.length){
    const ln=lines[i];
    if(!ln.trim()){i++;continue}
    if(/^(\s*[-*_]\s*){3,}$/.test(ln)){
      out.push('<hr class="nb-hr">');
      i++;continue;
    }
    if(ln.startsWith("```")){
      const code=[];i++;
      while(i<lines.length&&!lines[i].startsWith("```")){code.push(esc(lines[i]));i++}
      i++;
      out.push("<pre><code>"+code.join("\n")+"</code></pre>");
      continue;
    }
    const hm=ln.match(/^(#{1,4})\s+(.+)/);
    if(hm){
      const lv=hm[1].length;
      out.push(`<h${lv}>${inlineFmt(hm[2])}</h${lv}>`);
      i++;continue;
    }
    if(ln.startsWith(">")){
      const q=[];
      while(i<lines.length&&lines[i].startsWith(">")){q.push(inlineFmt(lines[i].replace(/^>\s?/,"")));i++}
      out.push("<blockquote>"+q.join("<br>")+"</blockquote>");
      continue;
    }
    if(ln.startsWith("|")){
      const rows=[];
      while(i<lines.length&&lines[i].startsWith("|")){
        rows.push(lines[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
        i++;
      }
      if(rows.length){
        const head=rows[0];
        const body=rows.slice(1).filter(r=>!r.every(c=>/^:?-+:?$/.test(c)));
        out.push("<table><thead><tr>"+head.map(c=>`<th>${inlineFmt(c)}</th>`).join("")+"</tr></thead><tbody>"+
          body.map(r=>"<tr>"+r.map(c=>`<td>${inlineFmt(c)}</td>`).join("")+"</tr>").join("")+"</tbody></table>");
      }
      continue;
    }
    if(/^\s*([-*•]|\d+[.、])\s+/.test(ln)){
      const isOl=/^\s*\d+[.、]\s+/.test(ln);
      const tag=isOl?"ol":"ul";
      const lis=[];
      while(i<lines.length&&/^\s*([-*•]|\d+[.、])\s+/.test(lines[i])){
        lis.push("<li>"+inlineFmt(lines[i].replace(/^\s*([-*•]|\d+[.、])\s+/,""))+"</li>");
        i++;
      }
      out.push(`<${tag}>`+lis.join("")+`</${tag}>`);
      continue;
    }
    const p=[];
    while(i<lines.length&&lines[i].trim()&&!/^(\s*[-*_]\s*){3,}$/.test(lines[i])&&!lines[i].startsWith("#")&&!lines[i].startsWith(">")&&!lines[i].startsWith("|")&&!lines[i].startsWith("```")&&!/^\s*([-*•]|\d+[.、])\s+/.test(lines[i])){
      p.push(inlineFmt(lines[i]));i++;
    }
    out.push("<p>"+p.join("<br>")+"</p>");
  }
  return out.join("");
}

/* ✨ 一键自动美化 Markdown 语法函数 */
function beautifyMarkdownText(raw){
  if(!raw||!raw.trim())return raw;
  const lines=raw.replace(/\r\n/g,"\n").split("\n");
  const res=[];
  const secPat=/^(?:[一二三四五六七八九十]+[、.．]\s*|\d+[.、．]\s*)?(整体定义|核心定义|定义|原理解释|核心原理|原理|Gate\s*标准|Gate|放行标准|质量控制|QC|结合案例|实战案例|案例演示|案例|防错要点|踩坑点|注意事项|总结|结论)\s*[：:]?\s*(.*)$/i;
  for(let i=0;i<lines.length;i++){
    let ln=lines[i].trimEnd();
    if(!ln.trim()){
      res.push("");
      continue;
    }
    // 已经是分割线或标题则保留
    if(/^(\s*[-*_]\s*){3,}$/.test(ln)||ln.startsWith("#")){
      res.push(ln);
      continue;
    }
    // 识别「整体定义 / 原理解释 / Gate 标准 / 案例」等模块行，自动加分割线与 H2 加粗标题
    const sm=ln.trim().match(secPat);
    if(sm){
      if(res.length&&res[res.length-1]!=="---"&&res.some(x=>x.trim())){
        if(res[res.length-1]!=="")res.push("");
        res.push("---");
        res.push("");
      }
      res.push(`## **${sm[1].trim()}**`);
      if(sm[2]&&sm[2].trim()){
        res.push(`- ${sm[2].trim()}`);
      }
      continue;
    }
    // 识别「xxx：yyy」结构自动转为列表 + 冒号前加粗
    const kv=ln.trim().match(/^([-*•]?\s*)([A-Za-z0-9\u4e00-\u9fa5（）()／/·\s]{2,14})([：:])\s*(.+)$/);
    if(kv&&!kv[2].includes("**")){
      res.push(`- **${kv[2].trim()}**${kv[3]} ${kv[4]}`);
      continue;
    }
    res.push(ln);
  }
  return res.join("\n").replace(/\n{3,}/g,"\n\n");
}

function applyView(){
  plane.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;
  edges.setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.scale})`);
  $("nb-zoom").textContent=Math.round(view.scale*100)+"%";
  $("nb-zoom-out").disabled=view.scale<=.5;
  $("nb-zoom-in").disabled=view.scale>=1.6;
}
function fit(){
  const w=stage.clientWidth,h=stage.clientHeight;
  view.scale=Math.max(.85,Math.min(1,(w-24)/totalW,(h-24)/totalH));
  view.x=totalW*view.scale>w-24?12:(w-totalW*view.scale)/2;
  if(totalH*view.scale>h-24){
    const r=items[0];
    view.y=r?h/2-(r.y+r.h/2)*view.scale:12;
    view.y=Math.min(12,view.y);
  }else view.y=(h-totalH*view.scale)/2;
  applyView();
}
function reveal(n,withKids){
  const it=items.find(i=>i.n===n);if(!it)return;
  const arr=withKids?[it,...it.children]:[it];
  const l=Math.min(...arr.map(a=>a.x))*view.scale,r=Math.max(...arr.map(a=>a.x+a.w))*view.scale,t=Math.min(...arr.map(a=>a.y))*view.scale,b=Math.max(...arr.map(a=>a.y+a.h))*view.scale,w=stage.clientWidth,h=stage.clientHeight,m=12;
  if(r-l<w-2*m){if(r+view.x>w-m)view.x=w-m-r;if(l+view.x<m)view.x=m-l}else view.x=m-it.x*view.scale;
  if(b-t<h-2*m){if(b+view.y>h-m)view.y=h-m-b;if(t+view.y<m)view.y=m-t}else view.y=h/2-(it.y+it.h/2)*view.scale;
  applyView();
}
function markActive(){

function renderMap(keepView){
  if(!stage.clientWidth)return;
  items=[];const top=collect(tab.root,0,null);plane.replaceChildren();edges.replaceChildren();items.forEach(makeNode);
  const widths=[];for(const it of items){it.w=it.el.offsetWidth;it.h=it.el.offsetHeight;widths[it.depth]=Math.max(widths[it.depth]||0,it.w)}
  const gap=stage.clientWidth<440?24:32,xs=[0];widths.forEach((w,i)=>xs[i+1]=xs[i]+w+gap);
  let y=0;
  (function pos(it){
    it.x=xs[it.depth];
    if(it.children.length){it.children.forEach(pos);it.cy=(it.children[0].cy+it.children[it.children.length-1].cy)/2}
    else{it.cy=y+it.h/2+6;y+=it.h+12}
    it.y=it.cy-it.h/2;it.el.style.left=it.x+"px";it.el.style.top=it.y+"px";
  })(top);
  totalW=Math.max(...items.map(i=>i.x+i.w));totalH=Math.max(...items.map(i=>i.y+i.h))+12;
  for(const it of items)if(it.parent){
    const a=it.parent,x1=a.x+a.w,y1=a.cy,x2=it.x,y2=it.cy,mx=(x1+x2)/2,p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    p.dataset.to=it.n._k;edges.append(p);
  }
  markActive();
  if(!keepView){fit();if(cur&&cur!==tab.root)reveal(cur,false)}else applyView();
}
function zoom(d){
  const nx=Math.max(.5,Math.min(1.6,Math.round((view.scale+d)*100)/100)),cx=stage.clientWidth/2,cy=stage.clientHeight/2;
  view.x=cx-(cx-view.x)*nx/view.scale;view.y=cy-(cy-view.y)*nx/view.scale;view.scale=nx;applyView();
}

$("nb-zoom-in").onclick=()=>zoom(.1);
$("nb-overview").onclick=()=>{tab.open=new Set();(tab.root.c||[]).forEach(c=>{if(c.c&&c.c.length)tab.open.add(c._k)});select(tab.root)};

/* Markdown 快捷工具栏操作 */
function activeTextarea(){
  return readMode==="note"?$("nb-note-input"):$("nb-case-body-input");
}
function insertAtCursor(ta,prefix,suffix="",defaultText=""){
  if(previewMode)setPreview(false);
  ta.focus();
  const s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.substring(s,e)||defaultText;
  const rep=prefix+sel+suffix;
  ta.value=ta.value.substring(0,s)+rep+ta.value.substring(e);
  ta.selectionStart=s+prefix.length;
  ta.selectionEnd=s+prefix.length+sel.length;
  ta.dispatchEvent(new Event("input"));
}
$("nb-md-toolbar").addEventListener("click",e=>{
  const btn=e.target.closest("[data-md]");
  if(!btn)return;
  const act=btn.dataset.md;
  const ta=activeTextarea();
  if(act==="h2")insertAtCursor(ta,"\n## **","**\n","标题");
  else if(act==="h3")insertAtCursor(ta,"\n### **","**\n","小节标题");
  else if(act==="bold")insertAtCursor(ta,"**","**","重点文字");
  else if(act==="mark")insertAtCursor(ta,"==","==","高亮内容");
  else if(act==="hr")insertAtCursor(ta,"\n\n---\n\n","","");
  else if(act==="ul")insertAtCursor(ta,"\n- ","","列表项");
  else if(act==="quote")insertAtCursor(ta,"\n> **核心要点**：","","提示内容");
  else if(act==="tpl"){
    const tpl=`## **1. 整体定义**\n- **核心目标**：\n\n---\n\n## **2. 原理解释**\n- **底层逻辑**：\n- **关键防坑点**：\n\n---\n\n## **3. Gate 标准**\n- **检查方法与通过依据**：\n`;
    insertAtCursor(ta,ta.value.trim()?"\n\n"+tpl:tpl,"","");
  }
});

[$("nb-note-preview"),$("nb-case-preview")].forEach(el=>{
  el.title="双击可直接进入编辑模式";
  el.addEventListener("dblclick",()=>setPreview(false));
});

/* 📋 一键复制全部已写内容给 AI */
$("nb-copy-all").onclick=async()=>{
  const records=[];
  const seen=new Set();
  Object.keys(store).forEach(k=>{
    if(k.includes("::"))return;
    const r=store[k];
    if(!r||seen.has(r.key))return;
    seen.add(r.key);
    records.push(r);
  });
  if(!records.length){
    alert("当前还没有保存任何笔记或案例内容。");
    return;
  }
  const text=records.map(r=>{
    const cs=validCases(r).map((c,i)=>`  [案例 ${i+1}] 标题：${c.title||"未命名"}（分类：${c.tag||"无"}）\n${c.body}`).join("\n\n");
    return `【节点】${r.path} (${r.key})\n【笔记】\n${r.note||"（空）"}\n${cs?`【案例演示】\n${cs}`:""}`;
  }).join("\n\n====================\n\n");
  try{
    await navigator.clipboard.writeText(text);
    const btn=$("nb-copy-all");
    const old=btn.textContent;
    btn.textContent="✅ 已复制！可直接粘贴给AI";
    setTimeout(()=>btn.textContent=old,2500);
  }catch(e){
    prompt("请按 Cmd+C 复制以下已写内容发给 AI：",text);
  }
};

/* 导出与导入 JSON 备份 */
$("nb-export").onclick=()=>{
  const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:store},null,2)],{type:"application/json;charset=utf-8"});
  const a=document.createElement("a");
  const d=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(blob);
  a.download=`实验室知识体系_笔记与案例备份_${d}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
$("nb-import").onclick=()=>$("nb-import-file").click();
$("nb-import-file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result);
      const incoming=parsed.data||parsed;
      if(typeof incoming==="object"&&incoming){
        Object.assign(store,incoming);
        localStorage.setItem(STORE_KEY,JSON.stringify(store));
        renderMap(true);
        renderRightPane();
        $("nb-save-state").textContent="已导入备份";
        $("nb-save-state").classList.add("saved");
      }
    }catch(err){
      alert("导入失败：JSON 文件格式不正确");
    }
    e.target.value="";
  };
  r.readAsText(f);
});

/* 节点选择与视图切换 */
function select(n,opts={}){
  ancestors(n).forEach(p=>{if(p!==tab.root)tab.open.add(p._k)});
  const prev=cur;cur=n;
  if(prev!==n)activeCaseIdx=0;
  renderMap(true);
  if(!opts.noReveal)reveal(n,false);
  if(opts.read)setRead(opts.read);
  else setPreview(autoPreviewFor(n,readMode));
  if(root.clientWidth<=650&&opts.mobile!==false&&prev)mobile("read");
  try{history.replaceState(null,"","#"+n._k)}catch(e){}
}
function renderViews(){
  $("nb-views").innerHTML=tabs.map(t=>`<button type="button" data-t="${t.id}" aria-pressed="${t===tab}">${esc(t.label)}</button>`).join("");
}
function goTab(id){
  tab=tabs.find(t=>t.id===id)||tabs[0];
  renderViews();hits=[];$("nb-q").value="";$("nb-qn").textContent="点节点写笔记/案例";
  cur=null;renderMap();select(tab.root,{mobile:false});
}
function mobile(v){
  root.dataset.mobile=v;
  root.querySelectorAll("[data-mobile]").forEach(b=>b.tagName==="BUTTON"&&b.setAttribute("aria-pressed",String(b.dataset.mobile===v)));
  if(v==="map")requestAnimationFrame(()=>renderMap());
}
root.querySelectorAll("button[data-mobile]").forEach(b=>b.onclick=()=>mobile(b.dataset.mobile));
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t){goTab(t.dataset.t);return}
});

/* 搜索节点标题、个人笔记、个人案例 */
$("nb-q").addEventListener("input",()=>{
  const q=$("nb-q").value.trim().toLowerCase();hits=[];hitI=-1;
  if(q){
    (function f(n){
      const e=getEntry(n);
      const caseTxt=(e.cases||[]).map(c=>`${c.title} ${c.tag} ${c.body}`).join(" ");
      const hay=(n.t+" "+e.note+" "+caseTxt).toLowerCase();
      if(n!==tab.root&&hay.includes(q))hits.push(n);
      (n.c||[]).forEach(f);
    })(tab.root);
    hits.forEach(h=>ancestors(h).forEach(p=>{if(p!==tab.root)tab.open.add(p._k)}));
  }
  $("nb-qn").textContent=q?`${hits.length} 处 · 回车跳转`:"点节点写笔记/案例";
  renderMap();
});
$("nb-q").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&hits.length){
    hitI=(hitI+1)%hits.length;
    select(hits[hitI],{mobile:false});
    $("nb-qn").textContent=`${hitI+1} / ${hits.length}`;
  }
});

let last="";
new ResizeObserver(()=>{
  layout();
  const s=stage.clientWidth+":"+stage.clientHeight;
  if(s!==last&&stage.clientWidth){last=s;requestAnimationFrame(()=>renderMap())}
}).observe(root);

layout();mobile("map");
const h=decodeURIComponent(location.hash.slice(1));
if(h&&byKey[h]){
  tab=tabs.find(t=>h===t.id||h.startsWith(t.id+"."));
  renderViews();cur=null;renderMap();select(byKey[h],{mobile:false});
}else if(tabs.length){
  goTab("learn");
}
})();
</script>
